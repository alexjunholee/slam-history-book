# Ch.12 — End-to-end 학습의 한계: PoseNet, DeepVO, SfMLearner

Ch.11에서 본 단안 depth 예측 연구와 같은 시기인 2015년부터 2018년 사이에, 연구자들은 자세 추정까지 포함한 SLAM의 여러 단계를 신경망 하나로 풀려고 했다. end-to-end는 입력에서 출력까지 중간 단계를 따로 설계하지 않고 망 하나로 학습한다는 뜻이다.

2015년 Cambridge 대학 박사과정 학생 Alex Kendall은 Roberto Cipolla의 지도로, 사진 한 장을 넣으면 6-DoF pose를 출력하는 신경망을 만들었다. ImageNet이나 Places로 미리 학습한 GoogLeNet을 가져와, Cambridge 시내에서 찍은 영상과 SfM으로 만든 자세 라벨로 다시 학습(fine-tuning)했다. 이 [Kendall et al. 2015. PoseNet](https://doi.org/10.1109/ICCV.2015.336)은 Santiago de Chile에서 열린 ICCV에서 발표됐다. 그 뒤 몇 년 동안 feature 추출, 매칭, 최적화, 지도 관리를 CNN 하나로 대신하려는 논문이 여럿 나왔다.

---

## 12.1 PoseNet

[AlexNet(Krizhevsky et al. 2012)](https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks) 이후, ImageNet 분류로 학습한 깊은 CNN이 고수준 시각 표현을 배운다는 사실이 널리 알려졌다. Kendall은 이 표현을 자세 추정에 옮겨 썼다.

> 🔗 **차용.** PoseNet의 backbone은 [GoogLeNet(Inception, Szegedy et al., CVPR 2015)](https://arxiv.org/abs/1409.4842) 구조다. 분류 head를 떼고 7차원 회귀 head(위치 x, y, z와 quaternion 네 성분)를 붙였다.

Kendall 등은 Cambridge Landmarks 데이터셋을 직접 찍어 만들었다. King's College, Street, Old Hospital, Shop Façade, St Mary's Church 같은 야외 장면이 들어 있다. 여기서 PoseNet의 위치 오차는 장면에 따라 1.5~3.7 m, 방향 오차는 5~8.5° 정도였다(원 논문 §5). 계산은 프레임당 약 5 ms였고, feature 추출이나 RANSAC, 지도 조회 없이 자세가 나왔다.

후속 연구는 저마다 다른 부분을 고쳤다. [Bayesian PoseNet(Kendall & Cipolla 2016)](https://arxiv.org/abs/1509.05909)은 Monte Carlo Dropout으로 자세 불확실성을 추정했다. [Walch 등의 LSTM PoseNet](https://arxiv.org/abs/1611.07890)은 2016년 arXiv에 먼저 올라왔고 ICCV 2017에 실렸다. 이미지 한 장에서 뽑은 feature의 공간 관계를 LSTM으로 처리한 연구다. [Kendall과 Cipolla의 2017년 연구](https://arxiv.org/abs/1704.00390)는 자세 회귀의 손실 함수를 다뤘다. 그중 재투영 손실은 3D 점을 정답 자세와 예측 자세로 각각 투영한 영상 좌표의 차이를 쓴다.

3D 구조를 쓰는 방법과는 차이가 컸다. Kendall과 Cipolla가 2017년 논문에 정리한 표를 보면, SIFT 특징점을 3D 점과 맞추는 [Active Search(Sattler et al. 2012)](https://www.graphics.rwth-aachen.de/media/papers/sattler_eccv12_preprint_1.pdf)는 같은 Cambridge 장면에서 위치 오차가 0.12~0.85 m였다. PoseNet과 그 후속 모델의 오차는 대체로 1~3 m였다. Sattler et al.(2019)은 absolute pose regression의 정확도가 3D 구조 기반 방법보다 DenseVLAD 같은 이미지 검색 방법에 더 가깝다고 분석했다.

---

## 12.2 DeepVO

이미지 한 장 대신 연속 영상을 넣는 방법도 나왔다. Oxford의 Sen Wang 등은 2017년 ICRA에 [Wang et al. 2017. DeepVO](https://arxiv.org/abs/1709.08429)를 발표했다. visual odometry(VO)는 연속 영상에서 카메라가 움직인 양을 추정하는 일이다. DeepVO는 미리 학습한 FlowNet을 바탕으로 만든 CNN으로 연속 두 프레임에서 optical flow feature를 뽑았다. 그다음 LSTM으로 시간 정보를 모아 VO를 바로 출력했다.

> 🔗 **차용.** DeepVO의 훈련 라벨은 KITTI의 GPS/IMU ground truth다. feature 추출 설계는 [FlowNet(Dosovitskiy et al. 2015)](https://arxiv.org/abs/1504.06852)의 optical flow CNN 구조에서 가져왔다.

저자들은 KITTI 시퀀스 00, 02, 08, 09로 학습하고 03–07, 10으로 시험했다. DeepVO의 오차는 스테레오 VISO2-S보다 컸고, 단안 VISO2-M보다는 대체로 작았다. 고속 구간의 이동 오차만 VISO2-M보다 조금 컸다. 00–10 전체로 학습한 모델은 시퀀스 12에서 위치 오차가 크게 났다. 저자들은 학습 데이터에 시속 60 km를 넘는 구간이 시퀀스 01밖에 없었다는 점을 첫 번째 원인으로 들었다. 시퀀스 12의 속도는 시속 50 km에서 약 90 km까지였다.

같은 해 CVPR에는 Tinghui Zhou(UC Berkeley)가 Google 인턴 기간에 주로 진행한 [Zhou et al. 2017. SfMLearner](https://arxiv.org/abs/1704.07813)가 나왔다. 정답 라벨 없이 영상 자체에서 학습 신호를 얻는 자기지도(self-supervised) 학습으로 depth와 ego-motion(카메라 자체의 운동)을 함께 추정했다. 학습 신호는 photometric reprojection loss였다. 한 프레임을 예측한 depth와 운동으로 다른 프레임 시점에 옮겨 그린 뒤, 실제 영상과 밝기를 비교한 값이다.

> 🔗 **차용.** SfMLearner와 [DSO(Engel et al. 2018)](https://arxiv.org/abs/1607.02565)는 기하적으로 대응시킨 영상의 밝기 차이를 이용한다는 원리를 공유한다. DSO는 이 밝기 차이로 자세와 지도를 직접 최적화한다. SfMLearner는 같은 신호로 깊이와 카메라 운동을 예측하는 망을 학습한다.

SfMLearner의 자세 평가는 KITTI 시퀀스 09, 10에서 5프레임짜리 짧은 구간 단위로 했다. 같은 5프레임만 입력받는 ORB-SLAM(short)보다는 오차가 작았다. 시퀀스 전체 프레임을 써서 loop closure와 재위치 추정(re-localization)까지 하는 ORB-SLAM(full)에는 미치지 못했다.

---

## 12.3 기하 제약, 일반화, 불확실성

2019–2020년 무렵 end-to-end pose regression과 학습 기반 odometry에는 아래 문제가 남아 있었다. [Sattler et al.(2019)](https://arxiv.org/abs/1903.07504)이 분석한 것은 이미지 한 장에서 절대 자세를 회귀하는 absolute pose regression이다. 연속 영상에서 상대 운동을 추정하는 learned odometry에는 이 분석을 그대로 옮길 수 없다.

**기하 제약(inductive bias)이 없다.** 고전 SLAM은 epipolar constraint, rigid body motion 가정, scale invariance, 공간의 연속성 같은 기하학적 제약을 알고리즘 구조에 담았다. CNN은 이 제약을 데이터에서 새로 배워야 했다. ImageNet 분류로 미리 학습해 얻은 표현은 3D metric geometry와 거리가 멀다. 회귀 망이 자세를 맞혀도 그 결과가 3D 구조를 반영한 것인지 특정 조명·색상·질감 조합을 기억한 것인지 가려내기 어려웠다.

**학습 분포 밖에서 일반화하기 어렵다.** PoseNet의 출력은 학습한 장면의 좌표계에 묶여 있다. 상대 운동을 추정하는 learned odometry도 카메라나 주행 방식, 영상 분포가 바뀌면 다시 검증해야 한다. CoRL 2020의 [TartanVO](https://proceedings.mlr.press/v155/wang21h.html)는 데이터셋을 넘는 일반화를 주요 설계 문제로 다뤘다. 고전 ORB-SLAM 역시 특징 검출이나 조명 조건이 달라지면 추적을 잃는다.

**불확실성 추정을 검증하기 어렵다.** 경로 계획과 장애물 회피에는 추정한 위치와 함께 그 오차가 얼마나 될지 판단할 정보가 필요하다. EKF는 공분산을 갱신하고, factor graph에서는 추정치 주변의 불확실성을 계산한다. 이 값들도 모델과 근사에 따라 달라진다. Bayesian PoseNet은 dropout으로 불확실성을 추정했다. 원 논문은 이 값을 위치 오차 추정과, 입력이 학습 장면에 속하는지 판별하는 데 썼다. 훈련 분포 밖 입력에서 이 불확실성이 실제 오차와 맞는지는 따로 검증해야 한다.

## 12.4 그 뒤

Kendall은 2017년 Cambridge에 박사학위 논문을 냈고, 같은 해 Wayve를 세웠다. [이후 논문](https://alexgkendall.com/)에는 자율주행용 imitation learning과 world model(GAIA-1)이 있다.

TUM의 Tateno·Tombari·Laina·Navab는 [CNN-SLAM(2017)](https://arxiv.org/abs/1704.03489)에서 CNN이 예측한 dense depth를 direct monocular SLAM의 깊이 측정과 합쳤다. 단안 SLAM이 깊이를 잘 잡지 못하는 저질감 영역에서는 예측 깊이를 더 믿고, 기하로 깊이가 잡히는 곳에서는 SLAM 측정을 썼다. 예측 깊이로 절대 스케일을 잡는 방법도 내놓았다. 평가는 TUM RGB-D와 ICL-NUIM에서 했다. 학습과 기하를 합친 초기 시스템이다.

> 📜 **예언 vs 실제.** PoseNet 논문(2015)은 다중 시점 기하로 얻는 학습 자료, 확률적 확장, 한 모델이 학습할 수 있는 장면 규모의 한계를 후속 과제로 제시했다. Bayesian PoseNet(2016)은 그중 확률적 자세 추정과 불확실성 평가를 다뤘다. absolute pose regression의 정확도와 일반화는 그 뒤에도 과제로 남았다.

이 시기의 아이디어 일부는 다른 용도로 쓰였다. SfMLearner의 photometric self-supervision은 MonoDepth2(Godard et al., ICCV 2019) 같은 후속 단안 깊이 연구로 이어졌다. DROID-SLAM(Teed & Deng, NeurIPS 2021)도 미분 가능한 기하를 쓰지만, 정답 pose와 정답 depth로 만든 flow를 손실로 써서 지도 학습한다. DeepVO와 같은 Oxford 그룹의 [VINet(Clark et al., AAAI 2017)](https://arxiv.org/abs/1701.08376)은 LSTM으로 영상과 IMU를 함께 처리해 visual-inertial odometry를 학습했다.

> 📜 **예언 vs 실제.** Zhou 등은 SfMLearner 논문(2017) 맺음말에서 장면 속 움직임과 가림(occlusion)을 명시적으로 모델링하지 않는다는 점, 카메라 내부 파라미터를 알아야 한다는 점, depth map이 3D 장면을 단순화한 표현이라는 점을 남은 과제로 들었다. 장면 속 움직임 문제는 [GeoNet(Yin & Shi 2018)](https://arxiv.org/abs/1803.02276) 같은 후속 self-supervised 연구가 일부 다뤘다. GeoNet은 정적 영역과 동적 영역을 나누어 깊이, optical flow, 카메라 운동을 함께 학습했다.

---

## 12.5 기하와 학습의 분담

2020년 무렵에는 기하 계산을 알고리즘에 맡기고 학습은 feature와 prior에 쓰는 연구가 나왔다.

> 🔗 **차용.** Ch.13에서 다루는 CodeSLAM(Bloesch et al., CVPR 2018)과 DROID-SLAM(Teed & Deng, NeurIPS 2021)이 이런 방식이다. 둘 다 최적화 또는 bundle adjustment를 그대로 두고, 학습은 CodeSLAM에서 depth 표현을, DROID-SLAM에서 dense correspondence와 반복 갱신을 맡는다.

CodeSLAM과 DROID-SLAM은 이미지에서 자세를 바로 회귀하지 않는다. 영상 사이의 대응 관계에 기하 제약을 걸어 자세를 구하고, 그 과정에 학습한 표현을 더했다.

어느 쪽이 나은지는 조건에 따라 달랐다. PoseNet 논문은 SIFT 기반 위치 추정이 크게 실패하는 넓은 시점 차이에서도 자세를 냈다고 보고했다. 해 질 녘, 비, 안개, 밤, motion blur 영상도 시험했다. Sattler et al.(2019)의 평가에서는 absolute pose regression이 3D 구조 기반 위치 추정만큼 정확하지 않았다.

---

## 🧭 아직 열린 것

**어떤 기하 제약을 어디에 넣을지.** 기하를 알고리즘으로 푼다고 해도, rigid body motion이나 epipolar constraint 같은 제약을 어느 수준에서 코드로 넣을지는 아직 정해지지 않았다. 3DGS 기반 시스템들은 geometry를 학습 표현 안에 넣는 방식을 시험하고 있다.

**Learned uncertainty의 calibration.** Bayesian PoseNet 이후에도 딥러닝이 내는 불확실성이 실제 오차와 얼마나 맞는지, 특히 학습 분포 밖 입력에서 맞는지 확인하는 일은 남은 과제다. 자율주행에서 특히 중요한 문제다.

**End-to-end의 범위.** PoseNet의 end-to-end는 이미지에서 자세를 바로 회귀하는 것이었다. foundation model이 나온 2023년 이후로는 SLAM의 어느 모듈을 학습으로 대신하고 어느 모듈을 알고리즘으로 둘지가 다시 논의되고 있다. 알고리즘과 학습의 경계가 흐려지고 있다고 본다.

Ch.13은 CodeSLAM에서 시작한다.

# Ch.13 — 학습과 기하의 결합: CodeSLAM에서 DROID-SLAM까지

Michael Bloesch는 2018년 CVPR에 CodeSLAM을 발표했다. 그때 그는 Imperial College London Dyson Robotics Lab의 Dyson Research Fellow로 Andrew Davison 그룹에 있었다. 2011년 Richard Newcombe가 DTAM을 만든 곳도 Davison 그룹이다. CodeSLAM은 Davison 그룹의 확률적 SLAM에 딥러닝으로 배운 표현을 넣었다.

---

## 13.1 CodeSLAM — latent code와 지도

기존 monocular SLAM은 depth를 직접 추정했다. sparse landmark 수백 개를 쓰든 [DTAM](https://www.doc.ic.ac.uk/~ajd/Publications/newcombe_etal_iccv2011.pdf)(Newcombe et al. 2011)처럼 모든 픽셀을 쓰든 depth가 최적화 변수였다. dense 방식이면 변수 수가 이미지 해상도에 비례한다. 640×480 keyframe 한 장의 dense depth map에는 독립 변수가 307,200개 있다. 변수가 이만큼 많으면 최적화가 무겁고 초기값에 민감하며, prior를 넣기도 어렵다.

[Bloesch et al. 2018. CodeSLAM](https://doi.org/10.1109/CVPR.2018.00271)은 depth map 대신 depth map을 만들어 내는 저차원 잠재 벡터(**latent code**)를 최적화했다. 이미지를 조건으로 받는 variational autoencoder(VAE)를 학습하면, latent code 공간의 점 하나가 그럴듯한 depth map 하나에 대응한다. 최적화는 이 공간 안에서만 움직이므로 keyframe당 변수가 수십만 개에서 128개로 줄어든다.

> 🔗 **차용.** CodeSLAM의 latent depth 표현은 [Kingma & Welling 2013. VAE](https://arxiv.org/abs/1312.6114)의 encoder-decoder 잠재 공간 구조를 썼다. 학습은 VAE 방식을 따른다. SLAM에서 쓸 때는 sampling을 하지 않고 **z**를 최적화 변수로 다룬다.

keyframe마다 decoder가 그 이미지의 feature(U-Net으로 뽑은 것)와 latent code **z**로 dense depth map을 만든다. **z**는 0에서, 자세는 identity에서 시작해 함께 최적화한다. 시야가 겹치는 두 프레임 사이에서 밝기 차이(photometric residual)와 depth 차이(geometric residual)를 함께 줄인다.

목적함수는 다음과 같다:

$$E(\mathbf{z}, T) = \sum_{(A,B)} \Bigl[ L_p\bigl(I_A[u] - I_B[w(u, \mathbf{z}_A, T_A^B)]\bigr) + L_g\bigl(D_A[u] - D_B[w(u, \mathbf{z}_A, T_A^B)]\bigr) \Bigr]$$

$I$는 영상, $D$는 decoder가 이미지와 code로 만든 depth, $T_A^B$는 두 keyframe 사이의 상대 pose다. $w$는 keyframe $A$의 픽셀 $u$를 code $\mathbf{z}_A$로 만든 depth와 $T_A^B$로 $B$에 옮기는 warping이다. $L_p$, $L_g$는 Huber 가중치를 주고 잘못된 대응, 가려진 픽셀, 심하게 기운 면의 오차를 줄이는 손실 함수다. 원 논문은 식 (13)과 (14)에서 두 residual을 따로 정의한다. 위 식은 둘을 합쳐 쓴 것이다. CodeSLAM 논문은 code에 따로 prior 항을 두지 않았다. code를 0 근처에 묶어 두는 zero-code prior factor는 DeepFactors(13.2)에서 들어왔다.

CodeSLAM은 적은 변수로 dense depth를 추정했다. 속도는 keyframe 4개 구성에서 지도 갱신 5 Hz였다. 저자들은 keyframe을 너무 자주 추가하지 않으면 실시간에 충분하다고 적었다. TensorFlow로 구현한 image warping을 더 빠르게 만드는 일은 향후 과제로 남겼다.

> 📜 **예언 vs 실제.** CodeSLAM 논문은 이 구성 요소로 완전한 실시간 keyframe 기반 SLAM을 만들고, 실제 영상으로도 학습하겠다고 맺었다. 같은 Imperial 그룹은 2020년 DeepFactors를 실시간 시스템으로 내놓았다.

---

## 13.2 DeepFactors — factor graph 통합

2020년 Davison의 박사과정 학생 Jan Czarnowski는 [Czarnowski et al. 2020. DeepFactors](https://doi.org/10.1109/LRA.2020.2965415)를 IEEE RA-L에 발표했다.

DeepFactors는 CodeSLAM의 latent depth 표현과 결합 최적화를 factor graph로 옮겼다. tracking과 mapping을 나누고 keyframe을 추가하는 기준도 두었다. NVIDIA GTX 1080 한 장에서 새 영상을 최신 keyframe에 맞추는 tracking은 약 250 Hz로 돌았다. 새 keyframe을 만들 때마다 신경망을 돌려 첫 code와 Jacobian을 구했는데, 이 계산에 약 340 ms가 걸렸다. 그중 forward pass는 16 ms였고 나머지는 TensorFlow로 Jacobian을 구하는 데 들었다. 저자들은 탐색하듯 움직일 때 시스템이 실시간으로 돌았고, 이때는 보통 photometric 오차와 재투영 오차만 켠다고 적었다.

> 🔗 **차용.** DeepFactors의 mapping은 Dellaert 연구실의 factor graph 라이브러리 [GTSAM](https://gtsam.org/tutorials/intro.html)과 그 증분 최적화 알고리즘 iSAM2(Kaess et al.)를 쓴다. CodeSLAM이 함께 최적화하던 자세와 latent code를 Czarnowski는 factor graph의 변수로 다시 세웠다. VAE가 학습 중 code를 평균 0인 Gaussian 근처로 모으므로, 최적화 중에도 zero-code prior factor로 code를 그 근처에 묶어 둔다.

같은 시기 TU Munich의 Daniel Cremers 그룹은 2016년에 내놓은 direct sparse odometry([DSO](https://arxiv.org/abs/1607.02565))에 신경망 예측을 더했다. [Yang, Wang, Stückler, Cremers 2018. DVSO](https://arxiv.org/abs/1807.02570)는 신경망이 예측한 depth를 단안 DSO에 "가상 stereo" 관측으로 넣었다. [Yang, von Stumberg, Wang, Cremers 2020. D3VO](https://arxiv.org/abs/2003.01060)는 self-supervised로 학습한 depth, pose, uncertainty 예측을 DSO의 최적화에 factor로 더했다. [Wimbauer et al. 2021. MonoRec](https://arxiv.org/abs/2011.11814)과 [Wimbauer et al. 2023. Behind the Scenes](https://arxiv.org/abs/2301.07668)는 이 연구를 동적 장면의 dense 재구성과, 이미지 한 장으로 density field를 추정하는 문제로 넓혔다. Imperial과 TUM은 따로 연구하면서 둘 다 신경망 예측을 기존 최적화 구조에 넣었다. 2021년 Princeton에서 나온 DROID-SLAM도 이렇게 설계했다.

---

## 13.3 RAFT — recurrent optical flow

Zachary Teed와 Jia Deng(Princeton)은 2020년 ECCV에 [Recurrent All-Pairs Field Transforms(RAFT)](https://arxiv.org/abs/2003.12039)를 발표했다. RAFT는 optical flow 추정 논문이다. 이 설계가 뒤에 DROID-SLAM에 들어갔다. 구조는 다음과 같다.

1. Feature encoder: CNN이 두 이미지에서 feature map을 추출한다.
2. Correlation volume: 모든 픽셀 쌍 간의 유사도를 4-level pyramid의 4D volume으로 구성한다.
3. Update operator: Gated Recurrent Unit(GRU)이 correlation volume을 lookup하며 flow field를 반복해서 고친다.

이름의 all-pairs는 모든 픽셀 쌍의 유사도를 미리 계산해 둔다는 뜻이다. PWC-Net 같은 coarse-to-fine 방법은 해상도를 바꿔 가며 flow를 추정한다. RAFT는 flow field를 원영상 가로·세로의 1/8인 해상도 하나로 유지한 채 correlation pyramid를 lookup하고, 마지막에 출력을 upsampling한다. RAFT 논문은 KITTI의 F1-all 오류를 5.10%로 낮췄다고 보고했다. 논문이 당시 공개된 최고 결과로 든 6.10%보다 16% 낮다. Sintel final pass의 endpoint error는 30% 낮췄다.

DROID-SLAM 논문은 RAFT의 반복 갱신 구조를 이어받았다. 반복할 때마다 고치는 대상은 두 프레임 사이의 flow에서 여러 프레임의 카메라 자세와 depth로 바뀌었다. 각 갱신은 미분 가능한 Dense Bundle Adjustment(DBA) layer가 계산한다.

---

## 13.4 DROID-SLAM — update operator와 BA

[Teed & Deng. DROID-SLAM](https://arxiv.org/abs/2108.10869)은 2021년 NeurIPS에서 발표됐다. DROID는 "Differentiable Recurrent Optimization-Inspired Design"의 약자다.

frontend는 RAFT와 구조가 같다. CNN encoder가 feature map을 뽑으면 all-pairs correlation volume을 만들고, GRU update operator가 dense flow를 반복 추정한다. DROID-SLAM은 이 추정을 keyframe graph의 모든 edge에서 동시에 한다.

DBA의 최적화 변수는 자세와 inverse depth다. flow 추정으로 얻은 2D 대응을 제약으로 삼아 자세와 depth를 함께 최적화한다. 선형 시스템은 Schur complement로 빠르게 푼다.

**DBA layer**가 GRU와 최적화를 잇는다. GRU가 추정한 flow 수정량과 신뢰도 가중치가 DBA에 들어간다. DBA가 pose와 depth를 갱신하면, 그 결과로 다음 GRU 반복의 기준이 바뀐다.

> 🔗 **차용.** 모든 픽셀로 자세와 depth를 추정한다는 생각은 Newcombe의 DTAM(2011)에도 있었다. DTAM은 tracking과 depth 추정을 번갈아 했다. DROID-SLAM은 학습한 flow를 입력으로 dense BA를 한다.

EuRoC 단안 실험에서 DROID-SLAM의 ATE는 ORB-SLAM3가 성공한 10개 시퀀스만 놓고 비교해도 43% 낮았다. 스테레오 입력에서는 71% 낮았다. 학습은 합성 데이터셋 TartanAir로만 했는데, TartanAir·EuRoC·TUM-RGBD에서 추적에 실패한 시퀀스가 하나도 없었다. ETH-3D RGB-D에서는 32개 중 30개를 추적했고, 다음으로 좋은 방법은 19개였다. Teed와 Deng 등이 쓴 SLAM Handbook 13장은 EuRoC V1_02 시퀀스에서 global optimization이 RMSE ATE를 16.5 cm에서 1.2 cm로 줄였다고 적는다.

PoseNet은 기하 제약 없이 자세를 바로 회귀했고 일반화가 잘 되지 않았다. DROID-SLAM에서는 신경망이 feature 추출과 dense correspondence를 맡고, BA가 기하 제약과 일관성을 맡는다.

## 13.5 Imperial Dyson Robotics Lab의 연구자들

Andrew Davison은 2003년 Oxford에서 MonoSLAM을 발표했고, 2005년 Imperial College로 옮겨 Robot Vision Group을 세웠다. 2014년에는 Dyson Robotics Lab을 세워 소장을 맡았다. 이 그룹에서 연구한 학생과 연구원은 다음과 같다.

- **Richard Newcombe** (Davison 지도, Imperial): DTAM(2011), [KinectFusion](https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/ismar2011.pdf)(2011). 이후 Oculus→Meta Reality Labs
- **Michael Bloesch** (Dyson Research Fellow, Imperial, 2017–2019): CodeSLAM(2018). 그 전에는 ETH Zurich에서 박사과정을 하며 visual-inertial odometry(ROVIO)를 연구했고, 그 뒤 DeepMind로 옮김
- **Jan Czarnowski** (Davison 지도, Imperial): DeepFactors(2020)
- **Edgar Sucar** (Davison 그룹, Imperial): [iMAP](https://arxiv.org/abs/2103.12352)(2021). neural implicit SLAM의 초기 연구
- **Tristan Laidlow** (Davison 그룹, Imperial): DeepFactors(2020) 공저

이 그룹은 확률적 추정과 불확실성을 중시하면서 단안 sparse 지도에서 dense latent 표현으로, 다시 implicit 표현으로 옮겨 갔다. Davison은 [FutureMapping](https://arxiv.org/abs/1803.11288)(2018)과 [FutureMapping 2](https://arxiv.org/abs/1910.14139)(2019, Ortiz 공저)에서 Spatial AI 시스템에 필요한 계산 구조와 표현을 제안했다. 여러 기하·의미 표현을 확률 그래프 하나로 묶자는 주장이다. CodeSLAM과 DeepFactors는 이 생각을 실험한 초기 연구다.

---

## 13.6 2023-2025 — DROID-SLAM 이후

University of Bologna의 [GO-SLAM](https://arxiv.org/abs/2309.02436)(Zhang et al., ICCV 2023)은 DROID-SLAM의 tracking에 online loop closing과 full bundle adjustment를 더했다. 지도는 Instant-NGP처럼 multi-resolution hash encoding을 쓰는 neural implicit 표현으로 만들었다.

[NICER-SLAM](https://arxiv.org/abs/2302.03594)(Zhu et al., arXiv 2023 / 3DV 2024)은 카메라 자세와 계층적 neural implicit 지도를 함께 최적화했다. RGB만 쓰는 dense SLAM을 목표로 한 점은 DROID-SLAM과 같다. 구조는 DROID-SLAM을 따르지 않고, 단안 기하 단서와 optical flow를 추가 감독 신호로 쓴다.

CMU의 [SplaTAM](https://arxiv.org/abs/2312.02126)(Keetha et al., CVPR 2024)은 RGB-D 입력으로 지도를 3D Gaussian Splatting으로 만들었다. tracking도 silhouette mask를 쓰는 differentiable rendering으로 새로 짰다. DROID-SLAM과는 별개의 시스템이다.

[DPV-SLAM](https://arxiv.org/abs/2408.01654)(Lipson, Teed, Deng, ECCV 2024)은 DROID-SLAM과 같은 Princeton 그룹에서 나왔다. [DPVO](https://github.com/princeton-vl/DPVO)(Deep Patch Visual Odometry)에 근접 기반 loop closure와 고전적 loop closure를 더했다. 근접 기반 loop closure는 추정한 카메라 위치가 가까운 프레임끼리 잇고, CUDA로 짠 block-sparse BA로 푼다. 고전적 loop closure는 image retrieval과 pose graph 최적화를 쓴다. 저자들은 EuRoC와 TartanAir에서 DROID-SLAM과 비슷한 정확도를 내면서 EuRoC 기준 2.5배 빠르고 VRAM은 4분의 1만 쓴다고 보고했다. GPU 한 장으로 돈다.

DROID-SLAM과 별개로 Naver Labs Europe의 [DUSt3R](https://arxiv.org/abs/2312.14132)(Wang et al., CVPR 2024)에서 출발한 연구가 2024–2025년에 이어졌다. DUSt3R는 이미지 두 장에서 pointmap(픽셀마다 3D 점을 담은 지도)을 바로 출력한다. 같은 그룹(Cabon, Revaud 등)은 [Cabon et al. 2025. MUSt3R](https://arxiv.org/abs/2503.01661)에서 DUSt3R 구조를 대칭형으로 고치고 여러 층의 memory를 더했다. 그래서 이미지 쌍 단위였던 구조가 여러 프레임을 한 좌표계에서 처리하게 됐다. 저자들은 offline SfM과 online visual SLAM에 같은 네트워크를 쓸 수 있다고 밝혔다.

DROID-SLAM의 구성 요소는 다른 시스템에서도 다시 쓰였다. Google DeepMind 등의 [Li et al. 2025. MegaSaM](https://arxiv.org/abs/2412.04463)(CVPR 2025)은 DROID-SLAM 방식의 differentiable dense BA를 동적 장면이 담긴 일상 영상에 적용했다. 초점 거리를 모르는 영상도 다루도록 focal length까지 함께 최적화했다. NVIDIA의 [Huang et al. 2025. ViPE](https://arxiv.org/abs/2508.10934)는 DROID-SLAM의 dense flow 제약, cuVSLAM으로 추적한 sparse point, 단안 metric depth network가 낸 depth를 dense BA 하나에 함께 넣었다. NVIDIA는 이 파이프라인으로 인터넷 동영상 약 10만 개를 포함한 대규모 영상에 카메라 자세와 depth를 달았다.

> 📜 **예언 vs 실제.** DROID-SLAM은 미분 가능한 BA와 end-to-end 학습을 묶었다. 2026년 현재 학습한 frontend와 고전적 backend를 묶는 설계는 여러 형태로 쓰인다. 어느 형태가 범용 해법이 될지는 정해지지 않았다.

---

## 🧭 아직 열린 것

**학습한 prior의 일반화.** CodeSLAM과 DeepFactors의 VAE는 훈련 데이터의 depth 분포를 학습한다. 실외처럼 훈련 데이터와 크게 다른 환경에서는 learned prior가 최적화를 잘못된 방향으로 끌고 갈 수 있다. DROID-SLAM의 flow estimator도 훈련 도메인 밖에서 성능이 떨어진다. TartanAir처럼 다양한 합성 데이터로 학습하는 방법이 있지만 합성과 실제 사이의 차이(sim-to-real gap)가 남는다.

**실시간 제약.** DROID-SLAM 논문은 RTX 3090 두 장이면 실시간으로 돈다고 적었다. 한 장은 tracking과 local BA를, 다른 한 장은 global BA와 loop closure를 맡았다. EuRoC에서는 해상도를 320×512로 줄이고 프레임을 하나씩 건너뛰어 평균 20 fps를 냈다. 카메라가 빠르게 움직이는 TartanAir에서는 평균 8 fps로 실시간에 못 미쳤다. DPV-SLAM은 GPU 한 장에서 돌도록 구조를 바꿨다. 모바일 로봇이나 AR/VR처럼 저전력 기기에서 돌려야 하는 응용에는 여전히 계산량이 부담이다.

**Loop closure.** DROID-SLAM은 카메라가 지도로 만든 곳에 돌아오면 frame graph에 먼 거리 edge를 더해 loop를 닫는다. backend는 추정한 자세와 depth로 모든 프레임 쌍의 optical flow를 계산하고, flow가 기준보다 작은 쌍만 잇는다. 그래서 drift가 크지 않을 때만 loop가 닫힌다. Teed와 Deng 등이 쓴 SLAM Handbook 13장은 "DROID-SLAM doesn't include any relocalization module, so large loops with lots of drift cannot be closed"라고 적는다. DPV-SLAM은 이 자리에 image retrieval 기반의 고전적 loop closure를 따로 붙였다. Ch.10의 학습 기반 place recognition을 이런 dense BA 시스템과 한 구조로 묶는 일은 남은 과제다.

---

DROID-SLAM은 keyframe마다 inverse depth map으로 장면을 표현했다. 2020년에 나온 [NeRF](https://arxiv.org/abs/2003.08934)(Neural Radiance Field)는 장면을 연속 함수로 표현한다. 렌더링이 미분 가능하므로, 렌더링한 영상과 실제 영상의 차이를 줄이는 방향으로 장면과 자세를 최적화할 수 있다.

2021년 Imperial College의 Edgar Sucar는 이 표현을 SLAM에 가져와, TSDF voxel grid 대신 MLP(multilayer perceptron, 다층 퍼셉트론) 하나로 장면을 표현하는 iMAP을 만들었다.

# Ch.14 — NeRF를 SLAM 지도로: iMAP→NICE-SLAM

DROID-SLAM은 학습한 표현을 SLAM의 tracking에 넣었다. CNN과 GRU가 feature와 대응을 만들고, 그 결과로 자세를 최적화했다. Imperial College의 Edgar Sucar와 동료들은 2021년 iMAP에서 학습한 표현을 *지도*로 썼다. 그 표현은 SLAM 밖의 NeRF에서 왔다.

2020년 3월, Ben Mildenhall과 동료들이 arXiv에 올린 [Mildenhall et al. 2020. NeRF](https://arxiv.org/abs/2003.08934)는 자세를 아는 여러 입력 영상으로 연속 volumetric scene function을 최적화해, 보지 않은 시점의 영상을 합성하는(novel-view synthesis) 방법이었다. 2021년 ICCV에 나온 iMAP은 이런 표현으로 지도와 자세를 함께 추정했다. KinectFusion(Ch.9)이 풀던 dense mapping을 implicit neural field(신경망으로 표현한 연속 함수)로 다시 푼 초기 시스템이다.

NeRF 이전인 2019년에도 좌표를 입력받는 MLP(coordinate-based MLP)로 3D를 표현하는 연구가 잇달아 나왔다. [Park et al.의 DeepSDF](https://arxiv.org/abs/1901.05103)는 좌표를 넣으면 signed distance를 출력하는 MLP로 물체 표면을 암묵적으로 기술했다. [Mescheder et al.의 Occupancy Networks](https://arxiv.org/abs/1812.03828)는 같은 좌표 입력에서 occupancy 확률을 출력하게 했다. [Sitzmann et al.의 SRN](https://arxiv.org/abs/1906.01618)은 좌표를 넣으면 scene feature vector를 내는 MLP를 두고, 미분 가능한 ray marching으로 이미지를 합성했다. 이 연구들은 모두 좌표를 넣으면 field 값이 나오는 함수를 학습했다. NeRF는 여기에 volume rendering 적분과 positional encoding을 더해 view synthesis에 썼다. iMAP 논문은 DeepSDF와 Occupancy Networks를 참고문헌으로 인용한다.

---

## NeRF: MLP 기반 공간 표현

NeRF는 MLP 하나로 3D 공간을 표현한다. 공간 좌표 $(x, y, z)$와 시선 방향 $(\theta, \phi)$를 넣으면 그 위치의 색상 $(r, g, b)$와 밀도 $\sigma$를 출력한다. 이 출력을 광선마다 적분해 장면을 렌더링한다.

렌더링은 volume rendering 방정식으로 이루어진다. 카메라 원점 $\mathbf{o}$에서 방향 $\mathbf{d}$로 나간 광선을 $t$ 매개변수로 샘플링한다:

$$\hat{C}(\mathbf{r}) = \int_{t_n}^{t_f} T(t)\,\sigma\!\left(\mathbf{r}(t)\right) \mathbf{c}\!\left(\mathbf{r}(t), \mathbf{d}\right)\, dt$$

여기서 $T(t) = \exp\!\left(-\int_{t_n}^{t} \sigma(\mathbf{r}(s))\, ds\right)$는 광선이 $t$까지 도달할 확률, 즉 누적 투과율이다. 실제로는 광선 위 샘플들로 이 적분을 구간별 합으로 근사한다.

> 🔗 **차용.** Volume rendering 방정식은 [Kajiya & Von Herzen(1984)](https://courses.cs.duke.edu/cps296.8/spring03/papers/RayTracingVolumeDensities.pdf)의 그래픽스 논문에서 왔다. NeRF 논문은 이 식을 미분 가능하게 계산해, 렌더링한 색과 실제 픽셀의 차이로 MLP를 학습했다.

좌표를 그대로 넣은 MLP는 저주파 성분에 치우쳐 학습한다. NeRF 논문은 positional encoding으로 이 문제를 다뤘다. 좌표 $(x, y, z)$를 여러 주파수의 사인·코사인 값으로 바꿔 넣으면 네트워크가 세밀한 텍스처와 날카로운 경계까지 학습한다:

$$\gamma(p) = \left(\sin(2^0 \pi p),\, \cos(2^0 \pi p),\, \ldots,\, \sin(2^{L-1} \pi p),\, \cos(2^{L-1} \pi p)\right)$$

> 🔗 **차용.** positional encoding은 NeRF 원 논문에 이미 있었다. 같은 해 [Tancik et al.(2020)](https://arxiv.org/abs/2006.10739) "Fourier Features Let Networks Learn High Frequency Functions"가 NTK(neural tangent kernel) 이론으로 이 기법의 작동 원리를 설명했다.

NeRF는 자세를 아는 이미지와 같은 시점에서 렌더링한 결과를 비교해 픽셀 색의 제곱 오차 합을 줄인다. 최적화가 끝나면 장면의 geometry와 appearance가 MLP 가중치에 담긴다.

원래 NeRF는 장면 하나를 학습하는 데 V100 GPU 한 장으로 1~2일이 걸렸다. 장면마다 따로 학습해야 했고, 카메라 자세는 COLMAP 같은 SfM으로 미리 구해야 했다. SLAM에 쓰려면 자세 추정과 지도 학습을 실시간에 가깝게 함께 해야 한다.

---

## iMAP: 초기 neural implicit SLAM

Imperial College Dyson Robotics Lab의 Edgar Sucar는 2021년 ICCV에 [Sucar et al. 2021. iMAP](https://doi.org/10.1109/ICCV48922.2021.00617)을 발표했다. **iMAP**(Implicit MAP)은 손에 든 RGB-D 카메라 입력으로 MLP 하나를 실시간에 지도로 학습하면서 자세를 함께 최적화했다. 논문 저자는 Sucar, Shikun Liu, Joseph Ortiz, Andrew Davison이다.

최적화 루프 두 개가 병렬로 돈다. *mapping* 루프는 MLP와 keyframe 몇 장의 자세를 함께 업데이트한다. 라이브 시스템은 매 반복마다 과거 keyframe 3장을 손실 분포에 비례해 뽑고, 마지막 keyframe과 현재 프레임을 더해 5장으로 최적화했다. 픽셀도 이미지당 200개만 뽑아, 손실이 큰 영역에 더 많이 배정했다. *tracking* 루프는 MLP를 고정하고 현재 프레임의 자세를 렌더링 손실로 최적화한다. 두 루프는 같은 MLP를 쓴다. 논문은 tracking 10 Hz, 전역 지도 갱신 2 Hz를 보고했다.

손실 함수는 색상 손실 $\mathcal{L}_{\text{color}} = \|\hat{C} - C\|_1$과 깊이 손실 $\mathcal{L}_{\text{depth}} = \|\hat{D} - D\|_1$로 이루어진다. 깊이 손실은 광선을 따라 계산한 depth 분산으로 정규화해, 물체 경계처럼 불확실한 영역의 비중을 낮춘다.

iMAP은 MLP 하나를 실시간 SLAM의 유일한 장면 표현으로 썼다. 논문은 keyframe 10~20장과 1 MB 정도의 MLP로 방 하나를 지도화했다고 적었다. 새 영역을 학습하면 이전 영역의 표현이 망가질 수 있어서, 선택한 keyframe을 기억 저장소처럼 계속 다시 학습(replay)했다.

> 📜 **예언 vs 실제.** Sucar는 iMAP 논문 Conclusion에서 "future directions for iMAP include how to make more structured and compositional representations that reason explicitly about the self similarity in scenes"라고 적었다. iMAP이 arXiv에 올라온 지 9개월 뒤(2021년 12월) 나온 NICE-SLAM은 multi-resolution voxel feature grid로 공간을 계층적으로 나눴다. 2023년 Wang et al.의 Co-SLAM은 hash grid와 coordinate encoding을 함께 썼다.

---

## NICE-SLAM: 계층 격자와 scalability

iMAP의 단일 MLP 문제를 직접 다룬 연구는 ETH Zurich의 Zihan Zhu와 Songyou Peng이 2022년 CVPR에서 발표한 [Zhu et al. 2022. NICE-SLAM](https://arxiv.org/abs/2112.12130)이다. **NICE-SLAM**(Neural Implicit Scalable Encoding for SLAM)은 단일 MLP 대신 multi-resolution voxel feature grid와 작은 MLP decoder를 결합했다.

공간을 명시적 복셀 격자로 나누고 각 복셀에 학습 가능한 feature vector를 둔다. 렌더링 시 샘플 좌표 주변 복셀들의 feature를 trilinear interpolation으로 결합한 뒤 작은 MLP에 통과시켜 색상과 occupancy를 얻는다. 공간 정보 대부분이 격자에 담기므로 MLP는 작아도 된다.

NICE-SLAM은 세 단계 해상도 격자를 계층적으로 쌓았다. 거친 격자부터 세밀한 격자까지 geometry를 여러 수준으로 표현하고, 색상은 별도의 color feature grid와 decoder로 표현한다. 논문은 시야 안에 든 격자 feature만 최적화하는 이런 지역 갱신 덕분에 iMAP과 같은 forgetting 문제를 겪지 않는다고 적었다. geometry decoder 세 개는 ConvONet 방식으로 미리 학습해 고정했다.

tracking에서는 격자와 decoder를 고정하고 자세만 최적화했다. mapping에서는 격자 feature를 업데이트했다. 논문은 여러 방으로 된 아파트를 직접 촬영해 재구성했다. 같은 픽셀 수로 속도를 재면 tracking은 iMAP보다 2배 넘게, mapping은 3배 넘게 빨랐다(101→47 ms, 448→130 ms).

다만 3D 격자의 메모리는 장면 한 변 길이의 세제곱으로 늘었다. 이 점은 ESLAM 논문이 짚었다. 전체 시스템 속도는 Co-SLAM 논문 측정으로 Replica에서 0.91 Hz였다.

Thomas Müller와 동료들의 [Müller et al. 2022. Instant-NGP](https://nvlabs.github.io/instant-ngp/)는 2022년 SIGGRAPH에서 발표됐다. multi-resolution hash encoding과 GPU에 맞춘 구현으로 학습 시간을 크게 줄였고, 공개 구현은 지원되는 NVIDIA GPU의 일부 데모 장면에서 수 초 훈련을 시연했다. SLAM 논문은 아니지만 이후 여러 NeRF-SLAM 시스템이 이 hash encoding을 썼다.

> 🔗 **차용.** NICE-SLAM의 multi-resolution feature grid와 Instant-NGP의 hash encoding은 비슷한 시기에 따로 나왔다(arXiv 2021년 12월, 2022년 1월). Co-SLAM은 hash grid를 썼다. 격자에 TSDF 값 대신 feature를 저장한다는 점에서 KinectFusion(Ch.9)의 voxel 격자와도 이어진다.

---

## Co-SLAM과 NeRF-SLAM

2022년 말부터 나온 시스템 가운데 일부는 implicit 표현 자체를 더 효율적으로 만들었다. 다른 일부는 기존 SLAM의 추정기를 NeRF 지도와 결합했다.

UCL의 Wang et al.이 낸 [**Co-SLAM**](https://arxiv.org/abs/2304.14377)(CVPR 2023)은 표현을 효율화했다. multi-resolution hash grid(parametric encoding)와 one-blob coordinate encoding을 함께 썼다. hash grid는 빠르게 수렴하고 국소 세부를 담는다. one-blob encoding은 표면을 매끄럽게 잇고 관측하지 않은 영역을 채우게 돕는다. 논문은 10~17 Hz를 보고했다(Replica 15~17 Hz, ScanNet·TUM 12~13 Hz).

같은 해 같은 CVPR에서 Idiap/EPFL의 Johari et al.의 [**ESLAM**](https://arxiv.org/abs/2211.11704)은 3D feature grid 대신 multi-scale axis-aligned feature plane을 써 메모리 증가를 $O(n^3)$에서 $O(n^2)$로 낮췄다. volume density 대신 TSDF를 decoding 목표로 삼았고, NICE-SLAM보다 최대 10배 빠르면서 사전 학습도 필요 없다고 보고했다.

MIT의 Antoni Rosinol, John Leonard, Luca Carlone이 2022년에 공개한 [**NeRF-SLAM**](https://arxiv.org/abs/2210.13641)(IROS 2023)은 기존 추정기를 썼다. 단안 영상만 받아 DROID-SLAM 방식으로 자세와 dense depth를 추정하고, 그 최적화에서 주변 공분산(marginal covariance)을 추가로 계산했다. 별도의 Instant-NGP 기반 mapping 모듈은 이 추정값과 불확실성을 받아 radiance field를 학습했다.

> 🔗 **차용.** NeRF-SLAM은 DROID-SLAM의 recurrent update와 Dense Bundle Adjustment가 만든 pose·depth 추정을 가져오고, 지도 표현에 Instant-NGP를 결합했다. radiance field는 자세 추정에 쓰이지 않는다. 기존 추정기의 출력을 받아 실시간으로 dense 지도를 만든다.

---

## iMAP의 구조적 한계

단일 MLP에는 지역성(locality)이 없다. 공간의 어느 부분을 렌더링하든 MLP 전체를 거친다. 그래서 새 영역을 학습하면 가중치 전체가 바뀌어 기존 영역의 표현이 망가질 수 있다(catastrophic forgetting). NICE-SLAM 논문은 장면이 커질 때 단일 MLP의 용량 한계 때문에 파라미터와 연산량이 더 늘어날 수 있다고 적었다.

NICE-SLAM 논문은 자기 방식에서 점 하나를 질의하는 연산량이 장면이 아주 커져도 같다고 적었다.

---

## 🧭 아직 열린 것

**실시간 NeRF-SLAM.** 앞에서 본 Co-SLAM의 10~17 Hz는 데스크톱 GPU에서 잰 값이다. 모바일·임베디드 로봇에서 같은 속도를 내는 문제는 남아 있다. Gaussian Splatting(Ch.15)은 명시적 표현으로 렌더링 속도를 높였다.

**대규모 야외 환경.** [Block-NeRF](https://arxiv.org/abs/2202.05263)(Tancik et al., CVPR 2022)는 도시 구역을 여러 국소 NeRF로 나눠 재구성했다. 다만 이미 모은 영상으로 학습하는 오프라인 방법이어서, loop closure와 전역 일관성을 실시간으로 다루는 SLAM과는 문제 설정이 다르다.

**semantic·편집 가능한 implicit 지도.** NeRF 지도는 MLP 가중치나 feature에 장면을 담는다. 그래서 물체를 지도에서 지우거나 영역의 분류를 바꿀 때, TSDF나 point cloud처럼 해당 원소를 직접 고칠 수 없다. [LERF](https://arxiv.org/abs/2303.09553)는 언어 feature를 공간에 정렬해 의미로 질의할 수 있게 했지만 물체 삭제나 편집을 다루지는 않는다. [Nerfstudio](https://arxiv.org/abs/2302.04264) 같은 도구 위에서 의미 표현과 편집 연구가 이어지고 있고, SLAM 파이프라인과 실시간으로 묶는 일은 아직 풀리지 않았다.

---

implicit field 연구와 함께 명시적 표현으로 돌아가는 연구도 나왔다. 장면을 MLP 가중치나 feature grid 대신 공간에 놓인 작은 타원체 수백만 개로 표현하는 방법이다. splatting에는 2001년 EWA splatting 같은 선행 기법이 있었다. Bernhard Kerbl 등의 SIGGRAPH 2023 논문은 학습 가능한 3D Gaussian과 빠른 미분 가능 렌더러를 결합했다.

# Ch.15 — Gaussian Splatting: 3DGS에서 GS-SLAM까지

iMAP과 NICE-SLAM은 MLP로 공간을 저장할 수 있음을 보였지만, 그 표현은 직접 고치기 어려웠다. iMAP에서는 새 관측으로 MLP를 갱신하면 다른 영역까지 함께 바뀌었다. NICE-SLAM은 지역 feature grid를 써서 이 문제를 줄였지만, RTX 3090 Ti에서 잰 Replica 처리 속도가 1 fps에도 못 미쳐 실시간 SLAM이라 부르기 어려웠다. 장면이 네트워크 파라미터 안에 들어 있어서 사람이 내용을 직접 들여다보기도 어려웠다.

2023년 8월 SIGGRAPH에서 Bernhard Kerbl(Inria), Georgios Kopanas, Thomas Leimkühler, George Drettakis가 3D Gaussian Splatting(3DGS) [논문](https://arxiv.org/abs/2308.04079)을 발표했다. 이들은 MLP나 voxel grid를 쓰지 않고, 작은 타원체인 Gaussian primitive 수백만 개를 공간에 놓아 장면을 명시적으로 표현했다. 렌더링 방식은 Matthias Zwicker 등의 EWA splatting(2001)을 바탕으로 했고, 표현은 NeRF처럼 differentiable rendering(미분 가능한 렌더링)으로 최적화했다. 그 뒤 6개월 동안 이 표현을 쓴 SLAM 논문이 잇따라 나왔다.

---

## 3DGS의 구조

3DGS에서 Gaussian 하나는 위치(mean) $\boldsymbol{\mu} \in \mathbb{R}^3$, 공분산 행렬 $\boldsymbol{\Sigma} \in \mathbb{R}^{3 \times 3}$, 학습하는 불투명도 $o \in (0,1)$, 구면조화함수(spherical harmonics) 계수로 나타낸 색으로 이루어진다. 학습을 안정시키려고 공분산은 스케일 벡터 $\mathbf{s}$와 단위 쿼터니언 $\mathbf{q}$로 나눠 둔다. $\mathbf{S}$는 $\mathbf{s}$로 만든 대각 행렬, $\mathbf{R}$은 $\mathbf{q}$로 만든 회전 행렬이다:

$$\boldsymbol{\Sigma} = \mathbf{R}\mathbf{S}\mathbf{S}^\top\mathbf{R}^\top$$

렌더링할 때는 화면에 투영한 2D Gaussian을 깊이 순서대로 알파 블렌딩(alpha-blending)한다. Gaussian마다 유효 불투명도 $\alpha_i$는 학습한 불투명도 $o_i$에 픽셀 위치에서 계산한 2D Gaussian 값 $G_i(\mathbf{x})$를 곱한 값이다. 픽셀 색 $C$는 다음과 같다.

$$C = \sum_{i \in N} c_i \alpha_i \prod_{j<i}(1 - \alpha_j), \quad \alpha_i = o_i G_i(\mathbf{x})$$

3DGS는 GPU 래스터화(rasterization)로 렌더링한다. NeRF처럼 광선마다 volume rendering 적분을 수치로 근사하는 과정이 없다. 저자들은 타일 기반 래스터라이저의 forward와 backward를 모두 CUDA 커널로 직접 짰고, A6000 GPU에서 1080p 영상을 30 fps 이상으로 렌더링했다. 이 수치는 학습을 마친 장면에서 새 시점을 그리는 속도다. tracking과 지도 갱신까지 포함한 NICE-SLAM의 처리 속도와 바로 견줄 값은 아니다.

초기값은 SfM이 만든 sparse point cloud다. 학습하는 동안 Gaussian을 나누고(splitting), 복제하고(cloning), 지우는(pruning) **densification** 절차를 되풀이한다. 뷰 공간(view-space) 위치 그래디언트가 임계치를 넘은 Gaussian 가운데, 덜 복원된 영역의 작은 Gaussian은 같은 크기로 복제해 그래디언트 방향으로 옮긴다. 분산이 큰 영역의 큰 Gaussian은 작은 Gaussian 둘로 나눈다. 불투명도가 낮은 Gaussian은 주기적으로 지운다.

> 🔗 **차용.** 3DGS가 3D Gaussian을 화면의 2D Gaussian으로 투영하는 식은 Zwicker et al.의 [EWA splatting (2001)](https://www.cs.umd.edu/~zwicker/publications/EWAVolumeSplatting-VIS01.pdf)에서 왔다. Zwicker 등은 volume 데이터를 렌더링하려고 샘플마다 타원형 Gaussian 커널을 화면에 투영했다. 3DGS는 이 커널의 변수를 학습하게 했고, GPU 타일 래스터라이저로 속도를 높였다.

---

## 3DGS가 SLAM 지도에 맞았던 까닭

Ch.14에서 본 catastrophic forgetting 때문에 MLP 기반 NeRF 지도는 조금씩 갱신하기 어려웠다. NICE-SLAM의 voxel grid는 이 문제를 줄였지만, 해상도를 높이면 메모리가 늘었다.

Gaussian은 공간의 정해진 자리에 놓이므로, 새 keyframe이 들어오면 그 영역에 Gaussian을 더하면 된다. densification은 keyframe을 더하는 방식과 잘 맞았다. 렌더링 품질은 NeRF 수준이었고 속도는 훨씬 빨랐다.

## GS-SLAM: 초기 시도

Chi Yan(Shanghai AI Laboratory, HKUST)과 공동 연구자들은 2023년 11월 [GS-SLAM](https://arxiv.org/abs/2311.11700)을 arXiv에 올렸고, 이 논문은 CVPR 2024에 실렸다. 비슷한 시기에 공개된 3DGS SLAM 원고 가운데 하나로, 3DGS를 tracking과 mapping에 모두 쓴 초기 시스템이다.

GS-SLAM은 기존 SLAM 구조를 따른다. tracking은 현재 프레임의 자세를 추정하고, mapping은 Gaussian 지도를 갱신한다. 새로 제안한 것은 adaptive expansion과 coarse-to-fine tracking이다. adaptive expansion은 새로 관측한 영역에 Gaussian을 더하고, 표면 앞에 떠 있는 잡음 Gaussian의 불투명도를 크게 낮춘다. coarse-to-fine tracking은 먼저 성기게 뽑은 픽셀로 대략의 자세를 구한 뒤, 믿을 만한 Gaussian만 골라 자세를 다시 최적화한다. 이렇게 해서 시간을 줄이고 추정을 안정시켰다.

tracking은 렌더링한 영상과 관측 영상의 photometric 손실로 자세를 최적화한다. 손실은 샘플링한 픽셀의 L1 색 손실이다:

$$\mathcal{L}_{track} = \sum_m \|\mathbf{C}_m - \hat{\mathbf{C}}_m\|_1$$

mapping에서는 depth L1과 color L1의 가중합을 쓴다. 3DGS 원 논문의 학습 손실 $(1-\lambda)\mathcal{L}_1 + \lambda\mathcal{L}_{D\text{-}SSIM}$ ($\lambda=0.2$)은 이후 Gaussian 지도 학습에서 기본으로 쓰였다. 이 손실을 자세로 미분할 수 있는 것은 3DGS의 rasterizer가 미분 가능하기 때문이다.

Replica 데이터셋에서 GS-SLAM은 렌더링 PSNR이 두 번째로 좋은 방법보다 1.52 dB 높았고, 시스템 전체가 RTX 4090에서 8.34 fps로 돌았다. 저자들은 한계로 질 좋은 depth 데이터에 기대는 점과 큰 장면에서 메모리가 많이 드는 점을 들었다.

## SplaTAM: silhouette 기반 densification

Nikhil Keetha(카네기멜론대)의 [Keetha et al. 2024. SplaTAM (CVPR)](https://arxiv.org/abs/2312.02126)은 더 단순한 densification 규칙을 썼다.

SplaTAM은 렌더링한 Gaussian이 픽셀을 얼마나 덮는지 나타내는 **silhouette mask**로, 현재 뷰에서 기존 Gaussian이 설명하지 못하는 영역을 찾는다. silhouette 값이 0.5보다 작은 픽셀과, 관측 depth가 렌더링 depth보다 앞에 있으면서 depth 오차가 크게 벌어진 픽셀에 새 Gaussian을 더한다.

SplaTAM은 지도를 고정한 채 자세를 최적화하는 tracking과, 자세를 고정한 채 Gaussian 변수를 조정하는 mapping을 번갈아 돌린다. GS-SLAM도 이렇게 단계를 나눈다.

> 🔗 **차용.** keyframe을 골라 지도를 유지하는 방식은 PTAM(Klein & Murray, 2007, Ch.5)부터 쓰였다. SplaTAM은 mapping 때 현재 프레임, 가장 최근 keyframe, 그리고 현재 프레임과 가장 많이 겹치는 이전 keyframe들을 골라 함께 최적화한다.

Replica 데이터셋에서 SplaTAM의 평균 PSNR은 34.11 dB였다. 같은 논문의 표에서 NICE-SLAM은 24.42 dB였다.

> 📜 **예언 vs 실제.** Keetha는 SplaTAM(2024)의 Limitations & Future Work에서 motion blur, 큰 depth noise, 급한 회전에 약한 점을 한계로 들었다. OpenVDB 같은 표현으로 큰 장면까지 넓힐 수 있다고 적었고, 알려진 intrinsics와 dense depth 없이 돌게 하는 일을 앞으로 풀 과제로 꼽았다. 같은 해 Matsuki의 MonoGS(CVPR 2024)는 단안 RGB만 쓰는 시스템을 따로 내놓았다. intrinsics 없이 동작하는 방법과 대규모 장면 문제는 2025년에도 연구 중이다.

---

## MonoGS: monocular RGB

Hidenobu Matsuki(Imperial College Dyson Robotics Lab)의 [Matsuki et al. 2024. MonoGS (CVPR)](https://arxiv.org/abs/2312.06741)는 depth sensor 없이 단안(monocular) RGB 카메라만으로 3DGS SLAM을 돌렸다. Matsuki는 Sucar(iMAP), Bloesch(CodeSLAM)와 같은 Davison 그룹 소속이었다.

단안 카메라만으로는 절대 scale을 알 수 없다. Matsuki는 Gaussian의 형상을 직접 최적화하고 등방성 손실을 더했지만, 단안 궤적의 scale은 여전히 정해지지 않는다.

$$\mathcal{L}_{iso} = \sum_k \| \mathbf{s}_k - \bar{s}_k \mathbf{1} \|_1$$

여기서 $\mathbf{s}_k \in \mathbb{R}^3$는 k번째 Gaussian의 스케일 벡터이고, $\bar{s}_k = \frac{1}{3}\sum_j s_{k,j}$는 세 축 스케일의 평균이다. 이 등방성(isotropy) 정규화는 세 축 길이가 크게 벌어지지 않게 한다. 시점이 부족하면 Gaussian이 시선 방향으로 길게 늘어나 렌더링과 tracking을 망치는데, 이 정규화가 그런 현상을 줄인다.

tracking에서는 Gaussian을 렌더링한 영상과 관측 영상의 photometric loss로 자세를 직접 최적화했다. 새 Gaussian을 넣을 때, 렌더링한 depth가 있는 픽셀에서는 그 깊이 주변에 작은 분산으로 초기화한다. depth가 없는 픽셀에서는 렌더링한 깊이의 중앙값 주변에 큰 분산으로 초기화한다. 이렇게 잡은 깊이는 여러 시점의 관측으로 고쳐 나간다.

> 🔗 **구분.** MonoGS는 미리 학습한 monocular depth 예측기나 외부 tracking 모듈을 쓰지 않는다.

[MonoGS의 2023년 첫 arXiv 원고](https://arxiv.org/abs/2312.06741v1)에서 TUM-RGBD 데이터셋의 평균 ATE RMSE는 monocular 4.44 cm, RGB-D 1.58 cm였다. 단안 ATE는 정답 궤적에 scale을 맞춘 뒤 잰 값이고, RGB-D 값은 rigid alignment만 해서 잰 값이다. 렌더링 품질은 RGB-D 설정의 Replica에서 평균 PSNR(peak signal-to-noise ratio, 높을수록 정답 영상에 가깝다) 37.50 dB였다.

## RTG-SLAM과 실시간 처리

다음 과제는 속도였다. 앞에서 본 GS-SLAM은 RTX 4090에서 8.34 fps로 돌았다. Zhejiang University의 Zhexi Peng 등이 발표한 [RTG-SLAM (SIGGRAPH 2024)](https://arxiv.org/abs/2404.19706)은 큰 장면을 실시간으로 RGB-D 재구성하는 것을 목표로 했다.

RTG-SLAM은 Gaussian마다 불투명하거나 거의 투명하도록 강제한다. 불투명한 Gaussian은 표면과 주된 색을 맡고, 투명한 Gaussian은 남은 색 차이를 맡는다. 불투명한 Gaussian 하나가 표면 한 영역을 덮으므로 Gaussian을 여러 개 겹칠 필요가 없다. 그래서 메모리와 계산량이 크게 준다. 또 Gaussian을 안정·불안정으로 나눠 불안정한 것만 최적화하고, 그것이 덮는 픽셀만 렌더링한다. 논문은 최신 NeRF 기반 RGB-D SLAM보다 약 2배 빠르고 메모리는 절반가량이라고 보고했다.

---

## 3DGS 이후 달라진 표현 선택

2024년 이후 3DGS 논문이 빠르게 늘면서 SLAM 지도로 고를 수 있는 표현도 많아졌다. 임베디드, 경로 계획, 안전이 중요한 응용에서는 지금도 TSDF와 occupancy grid를 쓴다. 예를 들어 NVIDIA의 [nvblox](https://nvidia-isaac-ros.github.io/concepts/scene_reconstruction/nvblox/index.html)는 Jetson 같은 장치에서 TSDF 지도를 만들고, 이를 경로 계획용 거리장(ESDF)과 cost map으로 바꾼다.

3DGS가 빨리 퍼진 데에는 하드웨어도 작용했다고 본다. 3DGS가 쓰는 래스터화에 맞춰 GPU가 오랫동안 최적화돼 왔고, NeRF는 ray marching(광선을 따라 샘플을 찍는 렌더링)으로 그린다.

> 🔗 **차용.** 장면 표현을 gradient로 최적화하고 photometric loss로 관측과 렌더링을 비교하는 방식은 NeRF(Mildenhall et al. 2020)에서 왔다. 3DGS는 이 방식을 그대로 쓰면서 표현만 implicit MLP에서 명시적 Gaussian으로 바꿨다.

> 📜 **예언 vs 실제.** Kerbl et al.은 3DGS(2023)의 Limitations에서 관측이 부족한 영역의 artifact, 길쭉한(elongated) artifact, popping, 정규화(regularization)를 하지 않은 점, 메모리 소비(큰 장면을 훈련할 때 20 GB를 넘을 수 있고, 렌더링에도 수백 MB)를 한계로 꼽았다. 개선 방향으로는 antialiasing, 더 원칙적인 culling, point cloud 압축 기법을 가져오는 일을 들었다. 메모리 압축은 2024년 [Compact 3DGS](https://arxiv.org/abs/2311.13681)와 [Niedermayr et al.](https://arxiv.org/abs/2401.02436)이 다뤘다. dynamic scene 확장([4DGS](https://arxiv.org/abs/2310.08528), [Deformable 3DGS](https://arxiv.org/abs/2309.13101))과 생성·편집([DreamGaussian](https://arxiv.org/abs/2309.16653), [GaussianEditor](https://arxiv.org/abs/2311.14521))은 원 논문이 언급하지 않았지만 2024년 전후로 따로 연구 분야가 됐다.

---

## 🧭 아직 열린 것

**Memory scaling.** Gaussian 수는 장면 크기에 비례해 늘어난다. 실내 Replica 데이터셋보다 실외 도시 구역에서 훨씬 많은 Gaussian이 필요하다. Gaussian pruning과 level-of-detail 계층 구조가 연구되고 있다. 큰 환경에서 메모리와 렌더링 품질을 함께 맞추는 일은 남은 과제다.

**Semantic 통합.** 2023년 [LERF](https://arxiv.org/abs/2303.09553)가 NeRF에 언어 feature를 붙였고, [LangSplat](https://arxiv.org/abs/2312.16084)은 Gaussian 표현에 언어 feature를 붙였다. 그 뒤 semantic Gaussian을 SLAM에 넣은 연구도 나왔다. 실시간 갱신, tracking 품질, semantic 정확도를 같은 조건에서 함께 비교하는 일은 아직 남아 있다.

**Dynamic scene.** 4DGS와 Deformable 3DGS는 Gaussian에 시간 차원을 더하는 방법을 제안했다. GS-SLAM(Yan et al. 2024), SplaTAM(Keetha et al. 2024), MonoGS(Matsuki et al. 2024)는 모두 세계가 정적이라고 가정한다. 움직이는 물체를 다루는 SLAM은 Ch.15b에서 다룬다.

초기 Gaussian을 어디서 얻을지도 문제였다. 자세를 알아야 Gaussian을 놓을 수 있고, Gaussian이 있어야 자세를 추정할 수 있다. 초기화 방법은 시스템마다 달랐다. RGB-D 방법은 센서가 잰 깊이를 썼다. MonoGS는 렌더링한 깊이로 시스템 안에서 초기 깊이를 잡았다. Ch.16에서 다루는 DUSt3R와 후속 연구는 이미지에서 기하를 바로 예측하는 네트워크를 학습했다.

# Ch.15b — 정적 세계 가정 밖: Dynamic과 Deformable SLAM

Jorge Fuentes-Pacheco는 동료 Ruiz-Ascencio, Rendón-Mancha와 함께 쓴 [*Visual simultaneous localization and mapping: a survey*](https://link.springer.com/article/10.1007/s10462-012-9365-8)를 2012년 *Artificial Intelligence Review*에 온라인으로 공개했고, 이 글은 2015년 43권에 실렸다. 초록은 동적이고 복잡한 대규모 환경의 visual SLAM을 아직 활발히 연구 중인 분야로 꼽았고, 서베이의 마지막 절 제목은 "Dynamic and Deformable Environments"였다. 그 전에도 움직이는 물체를 다룬 논문은 있었다. 2026년 4월 21일자 *The SLAM Handbook* 원고는 이 주제에 한 장 37쪽을 썼다. 저자는 Lukas Schmid, José María Martínez Montiel, Shoudong Huang, Daniel Cremers, José Neira, Javier Civera 여섯 명이다. 이 장은 SLAM이 정적 환경을 가정해 왔다고 짚고, 그 가정이 맞지 않는 예로 도시를 달리는 자율주행차, 사람이 오가는 집 안의 서비스 로봇, 장면 전체가 변형되는 몸속의 수술 로봇을 든다.

---

## 15b.1 세 개의 축

Schmid et al.은 Handbook 15장 §15.1에서 Looper et al.(2023)의 정의를 따라 동적 효과를 나눈다. 동적인지 정적인지는 *관측*에 따라 갈린다. 같은 물리적 운동이 어떤 로봇에게는 short-term dynamic(관측하는 동안 보이는 움직임)이 되고, 다른 로봇에게는 long-term dynamic(관측 사이에 쌓인 변화)이 된다. 이를 정하는 것은 장면의 변화율 $\text{Dyn}$과 로봇의 관측률 $\text{Obs}$의 관계다. $\text{Dyn} \ll \text{Obs}$이면 로봇은 움직임을 프레임마다 보고, $\text{Dyn} \gg \text{Obs}$이면 다음에 왔을 때 장면이 이미 바뀌어 있다.

Handbook은 이 관측 특성(Observation)을 첫 번째 축으로 두고 short-term과 long-term을 나눈다. 두 번째 축인 재구성 수준(Reconstruction)은 pose만 추정할지, scene geometry까지 복원할지, 시간에 따른 장면 이해까지 갈지를 정한다. 세 번째 축인 시간 제약(Time)은 online으로 처리할지 offline으로 처리할지를 정한다. Handbook의 그림 설명에 따르면, 동적인 부분을 outlier로 버리면서 실시간으로 자세를 추정하는 일반적인 pose-graph SLAM은 이 공간의 한 점에 해당한다.

---

## 15b.2 Short-term: 마스킹에서 multi-object SLAM으로

Zaragoza에서 박사과정을 하던 Berta Bescos는 2018년 [DynaSLAM](https://arxiv.org/abs/1806.05620)을 RA-L에 발표했다. ORB-SLAM2의 frontend에 Mask R-CNN을 넣어 사람과 자동차처럼 움직일 수 있는 물체를 미리 가리고, 가린 영역에서는 keypoint를 뽑지 않았다. 방법은 간단했지만 TUM-RGBD의 walking sequence에서 ATE가 0.9~4.0 cm로 내려갔다.

UCL의 Martin Rünz는 움직이는 물체를 지우지 않고 따로 추적했다. 그는 Lourdes Agapito의 지도로 [Co-Fusion(Rünz & Agapito, 2017)](https://arxiv.org/abs/1706.06629)과 이듬해 [MaskFusion(Rünz et al., 2018)](https://arxiv.org/abs/1804.09194)을 연달아 내놓았다. 두 시스템은 객체마다 surfel 모델을 따로 두고 카메라 궤적과 객체 궤적을 함께 추정했다. Heriot-Watt의 Raluca Scona, TUM의 Mariano Jaimez와 Daniel Cremers 등이 2018년 ICRA에 낸 [StaticFusion](https://raluca-scona.github.io/docs/conference-papers/2018_icra_staticfusion.pdf)은 semantic segmentation을 쓰지 않았다. 카메라 운동과 정적·동적 확률 분할을 함께 추정하고, 정적인 부분만 지도에 합쳤다.

다음 단계에서는 움직이는 객체를 상태 변수에 넣어 함께 추정했다. Australian National University의 Jun Zhang 등이 낸 [VDO-SLAM(Zhang et al., 2020)](https://arxiv.org/abs/2005.11052)은 동적 객체마다 factor graph의 변수를 두었다. 카메라 자세 $T_i^w \in SE(3)$와 객체 $k$의 자세 $T_{k,i}^w \in SE(3)$가 같은 그래프에 들어가고, smooth motion factor가 객체의 운동이 갑자기 바뀌지 않도록 제약했다. Zaragoza의 Bescos는 2021년 [DynaSLAM II(Bescos et al., 2021)](https://arxiv.org/abs/2010.07820)에서 ORB-SLAM2를 바탕으로, stereo와 RGB-D 입력에서 객체 추적과 SLAM을 강하게 결합했다. CMU의 Yuheng Qiu가 2022년 ICRA에 발표한 [AirDOS](https://arxiv.org/abs/2109.09903)는 사람처럼 관절이 있는 객체(articulated object)까지 다뤘다.

> 🔗 **차용.** VDO-SLAM은 Ch.6의 graph SLAM 정식화를 그대로 썼다. 움직이는 자동차 하나를 지도에 넣으려면 factor graph에 변수와 factor를 더하면 된다.

관성 센서를 쓰는 쪽에서는 KAIST의 Song·Lim·Lee·Myung이 2022년 RA-L에 [DynaVINS](https://arxiv.org/abs/2208.11500)를 발표했다. DynaVINS는 semantic mask와 multi-object tracking을 쓰지 않았다. IMU preintegration으로 얻은 자세 prior와 어긋나는 관측의 가중치를 bundle adjustment에서 낮춰, 동적 특징이 상태 추정에 끼어들지 못하게 했다. 같은 그룹이 2024년 RA-L에 낸 [DynaVINS++](https://arxiv.org/abs/2410.15373)는 이 과정을 adaptive truncated least squares로 다시 짰다. 동적 물체 때문에 생긴 잘못된 대응이 IMU bias 추정으로 번져 추정이 발산하는 문제도 막았다.

Handbook §15.2.3은 LiDAR 기반 moving object segmentation(MOS, 움직이는 점을 골라내는 일)의 예로 Schmid 자신의 [Dynablox(Schmid et al., 2023)](https://arxiv.org/abs/2304.10049)를 든다. 2025년의 [AnyCam](https://arxiv.org/abs/2503.23282)(Wimbauer et al.)은 transformer로, 동적 물체가 있는 일상 영상에서 카메라 자세와 intrinsics를 한꺼번에 추정한다.

---

## 15b.3 Long-term: 시간을 가로지르는 지도

long-term 변화는 방문과 방문 사이에 생긴다. 어제 본 의자가 오늘은 옆으로 밀려 있는 경우가 그렇다.

Sherbrooke의 Mathieu Labbé가 Michaud의 지도로 개발한 [RTAB-Map](https://introlab.github.io/rtabmap/)은 사람의 기억 모델을 본떴다. short-term, working, long-term memory 계층을 두고 시간과 관측 빈도에 따라 노드를 옮긴다. 최근 노드는 working memory에 두고, 드물게 방문하는 노드는 long-term memory로 보낸다. Labbé는 2019년 JFR 논문에서 이 구조를 여러 세션에 걸친 대규모 SLAM에 쓰는 방법을 정리했다.

KAIST URL의 임형태·황성원·명현이 2021년 발표한 [ERASOR](https://arxiv.org/abs/2103.04316)는 누적된 LiDAR 지도에서 움직이는 물체가 남긴 흔적을 지웠다. 지도와 개별 스캔의 영역별 높이 범위를 비교해 동적 점이 있을 법한 구역을 고르고, 구역마다 지면을 추정해 지면 점과 동적 물체의 점을 구별했다.

Handbook §15.3은 **absence of evidence vs evidence of absence**(못 본 것과 없는 것)를 거듭 구별한다. 의자가 없어졌는지 내가 못 봤는지 가리지 못하면, map cleaning은 남아 있는 객체를 지우고 change detection은 가려진 영역을 변화로 잘못 판정한다. Schmid가 2022년 ICRA에 발표한 [Panoptic Multi-TSDF](https://arxiv.org/abs/2109.10165)는 이 문제를 submap 구조로 다뤘다. 객체마다 submap을 따로 두고, 지금 추적 중인 submap만 active로 두어 새 데이터를 합쳤다. 몇 프레임 동안 검출되지 않은 submap은 inactive로 돌려, 과거 데이터가 망가지지 않게 했다. MIT Carlone 그룹에서 Schmid 등이 2024년 낸 [Khronos](https://arxiv.org/abs/2402.13817)는 spatio-temporal metric-semantic SLAM 문제를 정의했다. loop closure 뒤에 change detection을 다시 돌려 각 객체가 언제 바뀌었는지까지 추정하므로, metric-semantic 지도에 시간 축이 더해진다.

> 🔗 **차용.** Panoptic Multi-TSDF는 여러 TSDF submap을 함께 관리하는 volumetric submapping과, 객체마다 모델을 두는 object-centric mapping을 합쳤다.

KAIST의 Jang과 Myung 등이 2026년 공개한 [Chamelion](https://arxiv.org/abs/2602.08189)은 공사 현장이나 배치가 자주 바뀌는 실내 같은 환경에서, dual-head 네트워크로 online change detection과 장기 지도 유지를 한다. 시간에 따라 정합한 실제 데이터를 모으기 어려워서, 다른 장면의 요소를 가져와 구조 변화를 합성하는 data augmentation을 썼다.

반복되는 변화를 다룬 연구도 있다. 영국 Lincoln 대학의 Tomáš Krajník, Tom Duckett 등이 2014년부터 내놓은 **frequency maps**(FreMEn)는 주기적으로 되풀이되는 환경 변화를 Fourier 분석으로 모델링한다. 스웨덴 Örebro 대학의 Tomasz Kucner, Martin Magnusson, Achim Lilienthal이 연구한 Maps of Dynamics(MoD)는 사람 흐름 같은 *typical motion pattern*을 지도에 직접 담는다. 2022년 arXiv에 공개된 [Changing-SLAM(Soares et al.)](https://arxiv.org/abs/2209.10710)은 ORB-SLAM3를 바탕으로, 미리 동적이라고 아는 물체의 특징점은 걸러내고 움직일 수 있는 물체는 Extended Kalman Filter로 추적하며, 장기 변화는 Bayesian filter와 장기 data association으로 다뤘다.

## 15b.4 Deformable: 형상이 변할 때

배경 자체가 변형되는 경우도 있다.

출발점은 2015년 CVPR best paper로, University of Washington의 Newcombe, Fox, Seitz가 발표한 [DynamicFusion](https://grail.cs.washington.edu/projects/dynamicfusion/)이었다. KinectFusion의 canonical TSDF에 embedded deformation graph를 얹어, 카메라 앞에서 변형되는 얼굴이나 몸통을 실시간으로 비강체(non-rigid) 복원했다. 노드마다 회전과 이동을 둔 변형 그래프를 매 프레임 최적화했다. 이어 Erlangen-Nürnberg 대학의 Matthias Innmann 등이 2016년 [VolumeDeform](https://arxiv.org/abs/1603.08161)으로 색 정보를 더했다. 2017년 Miroslava Slavcheva가 낸 [KillingFusion](https://campar.in.tum.de/pub/slavcheva2017cvpr/slavcheva2017cvpr.pdf)은 Killing vector field 정칙화로 변형이 매끄럽고 거의 등거리(isometric)가 되게 했고, 위상 변화까지 허용했다. MIT에서 Tedrake의 지도를 받은 Wei Gao가 2018년에 발표한 [SurfelWarp](https://arxiv.org/abs/1904.13073)는 TSDF 대신 surfel로 지도를 표현했다.

> 🔗 **차용.** DynamicFusion의 embedded deformation graph는 컴퓨터 그래픽스에서 Sumner, Schmid, Pauly가 2007년 발표한 ED graph를 가져온 것이다. 메시 변형에 쓰던 희소 제어 그래프가 실시간 비강체 재구성의 변수가 됐다.

Zaragoza의 Civera와 Montiel은 이 문제를 꾸준히 다뤘다. Montiel의 지도로 박사과정을 한 José Lamarca는 2021년 [DefSLAM](https://arxiv.org/abs/1908.08918)을 IEEE TRO에 발표했다. DefSLAM은 프레임마다 Shape-from-Template(SfT)로 tracking하고, keyframe마다 isometric NRSfM으로 template를 다시 계산했다. ORB 특징으로 대응을 찾았다. 같은 그룹의 Juan J. Gómez Rodríguez는 2023년 arXiv에 [NR-SLAM](https://arxiv.org/abs/2308.04036)을 공개했고, 이 논문은 2024년 IEEE TRO에 실렸다. NR-SLAM 논문은 기존 mesh 기반 방법이 평면 토폴로지를 가정해 관이나 구멍 난 표면을 다루지 못한다고 지적하고, dynamic deformable graph로 임의의 표면 토폴로지를 다뤘다. visco-elastic 변형 모델로 시간 방향 정칙화도 넣었다. Handbook §15.4.3은 이 연구들을 단안 카메라용 deformable SLAM 파이프라인으로 정리한다.

University of Technology Sydney의 Jingwei Song 등이 2018년 RA-L에 낸 [MIS-SLAM](https://doi.org/10.1109/LRA.2018.2856519)은 stereo 내시경 영상으로 수술 중 장기의 변형을 추적했다. Brigham and Women's Hospital(Harvard)의 Haoyin Zhou와 Jagadeesan Jayender가 개발한 EMDQ(Expectation Maximization and Dual Quaternion) 알고리즘은 SURF 특징으로 카메라 운동과 조직 변형을 함께 추정했다. 목표는 최소침습수술(minimally invasive surgery, MIS) 중의 수술 내비게이션이다.

Handbook §15.4.1은 **Floating Map Ambiguity**를 강조한다. deformable SLAM은 관측된 변형 가운데 rigid transformation으로 설명되는 부분을 모두 카메라 궤적으로 돌린다고 가정한다. 그러나 운동의 강체 성분과 비강체 성분을 가르는 일은 ill-posed(해가 하나로 정해지지 않는) 문제다. 손이 30 cm 움직였는지 카메라가 30 cm 움직였는지는 영상만으로 가를 수 없다. Handbook은 변형하는 물체의 변위에 prior를 두어야 이 둘을 가를 수 있다고 쓴다. DefSLAM의 isometric prior와 NR-SLAM의 visco-elastic prior가 그런 prior다.

> 📜 **예언 vs 실제.** Newcombe는 DynamicFusion(2015)의 Limitations and Discussion에서, 닫힌 위상에서 열린 위상으로 빠르게 바뀌는 장면(손을 쥔 채 재구성을 시작해 손을 펴는 경우)을 다루기 어렵다고 적었다. 장면을 더 키우기 어려운 이유로는 KinectFusion처럼 TSDF 메모리가 기하 범위를 제한한다는 점과, 장면이 커질수록 카메라에 가려지는 부분이 늘어 커지는 warp field를 추정하기 어려워진다는 점을 들었다. 위상 변화는 2017년 KillingFusion이 다뤘다.

---

## 🧭 아직 열린 것

**Absence vs evidence of absence.** 지도에서 객체가 사라졌는지, 가려서 못 봤는지를 구별하는 일은 Handbook §15.3이 거듭 짚은 문제다. §15b.3에서 본 Panoptic Multi-TSDF와 Khronos가 이 문제를 다뤘다.

**Floating Map Ambiguity.** deformable SLAM에서 카메라 운동과 객체 운동을 나누는 문제는 isometric·visco-elastic prior로 피해 가고 있다. Handbook §15.5는 카메라 궤적과 지도의 변형을 둘 다 정확히 추정할 수 있는 조건, 변형하는 물체의 강체 운동과 카메라의 강체 운동을 분명히 가를 수 있는지, 결과의 불확실성을 정확히 추정할 수 있는지를 열린 질문으로 남겼다.

**Online deformable SLAM.** DefSLAM 논문은 10×10 노드 template 기준으로 deformable tracking thread가 프레임당 약 50 ms, deformable mapping thread가 약 400 ms 걸린다고 보고했다(i7-4700HQ CPU). NR-SLAM 논문은 C++로 새로 구현해 CPU에서만 돌린다고 적었고, 처리 시간은 따로 보고하지 않았다. Khronos는 RGB-D 입력으로 짧은 시간의 움직임과 긴 시간의 변화를 online으로 함께 다뤘다. 다만 대상은 사람과 물체의 움직임, 물체 배치의 변화였고, 조직처럼 형태가 바뀌는 표면의 변형은 추정하지 않았다. Handbook §15.5는 동적 객체 추적을 상태 추정에 넣으면 계산 비용이 늘어난다고 적었다. NeRF와 3DGS 같은 미분 가능한 표현에 대해서도, 동적 장면의 실시간 SLAM에 쓰려면 메모리와 계산 비용 문제가 남아 있다고 정리했다.

**의료 MIS의 실세계 격차.** MIS-SLAM과 NR-SLAM은 Hamlyn 데이터셋의 생체(in vivo) 복강경 영상으로 평가했고, NR-SLAM은 실제 대장내시경 영상에서도 정성적으로 시험했다. NR-SLAM 논문은 깊이 불연속과 강한 변형이 함께 나타나는 장면에서는 지도를 만들고 넓히기 어렵다고 한계를 밝혔다. 수술 도구가 시야를 가리는 시퀀스에서는 도구를 분할해 가리는 SD-DefSLAM보다 오차가 컸다. 2024년에는 EndoGS 같은 Gaussian 기반 시도도 나왔다.

# Ch.16 — Foundation 3D: DUSt3R에서 VGGT까지

Naver Labs Europe의 Philippe Weinzaepfel과 Jérôme Revaud 등은 2022년 CroCo를 발표했다. 같은 장면을 찍은 두 이미지를 단서로 visual representation을 학습하는 cross-view self-supervised pretraining(두 시점 영상을 이용한 자기지도 사전학습) 방법이었다. CroCo는 feature learning 연구였다. 1년 남짓 뒤 같은 연구소가 CroCo의 구조를 바탕으로, calibration 없이 pointmap을 바로 출력하는 DUSt3R를 내놓았다. 2025년에는 Oxford VGG 그룹과 Meta AI의 VGGT가 나왔다.

---

## 16.1 DUSt3R — learned pointmap

2010년대 내내 3D 재구성은 같은 절차를 따랐다. 특징점을 찾아 매칭하고, 카메라 내부·외부 파라미터를 추정하고, triangulation으로 점군을 만들고, bundle adjustment로 전체를 다듬는다. [COLMAP(Schönberger & Frahm, CVPR 2016)](https://openaccess.thecvf.com/content_cvpr_2016/html/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.html)은 이 파이프라인을 구현한 대표적인 공개 소프트웨어다.

[Shuzhe Wang et al. 2024. DUSt3R: Geometric 3D Vision Made Easy (CVPR)](https://arxiv.org/abs/2312.14132)는 이 절차를 거치지 않는다. 이미지 두 장을 받아 각 픽셀의 3D 좌표를 바로 출력하고, 내부 파라미터(focal length, principal point)를 입력으로 받지 않는다. pointmap이라 부르는 이 출력은 두 이미지의 픽셀을 모두 첫 번째 카메라 좌표계로 나타낸 3D 좌표다.

DUSt3R의 transformer는 CroCo에서 물려받은 encoder-decoder 구조를 쓴다. 각 이미지는 따로 encoding되고, 두 decoder가 정보를 주고받는다. decoder 블록마다 먼저 self-attention으로 같은 이미지의 token끼리 참조하고, 이어서 cross-attention으로 다른 이미지의 token을 모두 참조한다. 어느 픽셀이 다른 이미지의 어느 픽셀과 같은 3D 점을 보는지는 이 cross-attention이 대규모 데이터에서 암묵적으로 배운다. 논문은 Habitat, MegaDepth, ARKitScenes, Static Scenes 3D, BlendedMVS, ScanNet++, CO3D-v2, Waymo 등 여덟 개 데이터셋에서 이미지 쌍 850만 개를 뽑았다. 정답은 합성 데이터, SfM 소프트웨어의 재구성 결과, 센서 측정에서 얻었으므로, 정답의 일부는 고전 SfM이 만들었다.

> 🔗 **차용.** DUSt3R의 backbone은 ViT([Dosovitskiy et al., ICLR 2021](https://arxiv.org/abs/2010.11929))에서 가져왔다. 더 직접적인 선행 연구는 Naver Labs Europe의 CroCo([Weinzaepfel et al. 2022](https://arxiv.org/abs/2210.10716))다. CroCo는 한 이미지에서 가린 영역을 다른 이미지의 정보로 복원하는 cross-view completion으로 사전학습을 했다. DUSt3R는 CroCo의 encoder-decoder 구조를 그대로 쓰고 과제만 pointmap 예측으로 바꿨다.

두 이미지의 pointmap은 이미 첫 카메라의 좌표계에 함께 놓여 있다. 그래서 상대 카메라 자세는 pointmap에서 바로 구할 수 있다. 논문은 두 pointmap을 Procrustes alignment로 맞추는 방법을 먼저 들고, 잡음과 outlier에 더 강한 방법으로 PnP-RANSAC을 쓴다.

이미지가 세 장 이상이면 DUSt3R는 global alignment를 푼다. 모든 이미지 쌍의 pointmap을 하나의 좌표계로 정합하는 최적화다. bundle adjustment와 비슷하지만 feature matching이나 카메라 모델 없이 진행한다.

---

## 16.2 매칭까지 하는 MASt3R

DUSt3R는 재구성의 핵심 단계인 픽셀 대응(feature matching)을 암묵적으로만 다룬다. SuperPoint+SuperGlue나 LightGlue 같은 명시적 매칭을 대신하기에는 부족했다.

[Vincent Leroy et al. 2024. Grounding Image Matching in 3D with MASt3R (ECCV)](https://arxiv.org/abs/2406.09756)는 DUSt3R에 matching head를 더한다. pointmap과 함께 픽셀마다 서술자(descriptor)를 출력하고, 3D 위치와 서술자를 함께 학습한다. 매칭은 두 이미지에서 서로가 서로의 nearest neighbor인 짝을 찾는 reciprocal matching으로 하며, 논문은 이를 빠르게 하는 알고리즘도 함께 냈다.

> 🔗 **차용.** MASt3R의 3D-anchored matching은 SuperGlue([Sarlin et al. 2020](https://arxiv.org/abs/1911.11763))가 풀려던 2D 서술자의 모호성 문제를 다른 방법으로 다룬다. SuperGlue는 그래프 신경망으로 주변 맥락을 써서 모호성을 줄였다. MASt3R는 3D 구조를 함께 학습해서 줄인다.

2024년 12월 Imperial College London Davison 그룹의 Riku Murai, Eric Dexheimer, Andrew Davison이 [MASt3R-SLAM](https://arxiv.org/abs/2412.12392)을 공개했다(CVPR 2025). 이 시스템은 MASt3R의 매칭을 frontend로, 그래프 기반 global optimization을 backend로 쓰고, 논문 실험에서는 RTX 4090 한 장으로 약 15 fps를 냈다.

MASt3R는 정확한 calibration 없이도 dense 매칭을 한다. foundation 모델의 출력을 COLMAP 형식의 SfM 파이프라인에 잇는 구성도 나왔다. 2025년 6월, §16.4에서 다룰 VGGT의 공개 저장소에 예측을 COLMAP 형식으로 저장하고 bundle adjustment를 선택해 돌리는 스크립트가 들어갔다.

> 📜 **예언 vs 실제.** DUSt3R는 이미지 쌍을 처리한 뒤 global alignment로 묶는 구조여서, 순차 처리와 실시간 동작은 후속 연구가 맡았다. DUSt3R 공개 후 8개월 만인 2024년 8월에 Spann3R가 global alignment 없이 이미지를 차례로 처리했고, 2024년 12월에 MASt3R-SLAM이 SLAM 시스템으로 묶었다.

---

## 16.3 Spann3R — sequential 처리

DUSt3R와 MASt3R는 이미지 집합을 한꺼번에 받아 처리한다. SLAM에서는 이미지가 시간 순서로 한 장씩 들어오고, 프레임마다 지도를 갱신해야 한다.

[Hengyi Wang & Lourdes Agapito 2025. 3D Reconstruction with Spatial Memory (Spann3R, 3DV)](https://arxiv.org/abs/2408.16061)는 DUSt3R의 구조를 sequential 처리에 맞게 고쳤다. 이미 처리한 프레임의 정보를 외부 spatial memory에 저장하고, 새 프레임이 들어오면 이 memory를 조회해 공통 좌표계의 pointmap을 바로 예측한다. global alignment 최적화가 필요 없다.

> 🔗 **차용.** Spann3R는 DUSt3R의 ViT encoder와 두 decoder 구조를 그대로 쓴다. 이전에 예측한 pointmap과 decoder의 기하 feature를 가벼운 memory encoder로 memory key와 value로 만들고, decoder의 기하 feature로 query를 만들어 memory를 조회한다. memory 관리 방식은 사람의 기억 모델을 본뜬 X-Mem을 참고했다.

Spann3R도 DUSt3R처럼 calibration 없이 동작하고, 이미지가 들어올 때마다 지도를 갱신한다. 논문은 RTX 4090 한 장에서 test-time 최적화 없이 50 fps 넘게 점진적으로 재구성했다고 보고했다.

---

## 16.4 VGGT — multi-view joint inference

Spann3R는 프레임을 하나씩 처리하면서 memory로 과거 프레임을 참조한다. Oxford VGG 그룹과 Meta AI의 Jianyuan Wang, Minghao Chen, Nikita Karaev, Andrea Vedaldi, Christian Rupprecht, David Novotny는 2025년 초 새 방법을 내놓았다. 여러 이미지를 한꺼번에 받아 카메라 파라미터, depth map, point map, 3D point track을 forward pass 한 번으로 출력한다.

[Jianyuan Wang et al. 2025. VGGT: Visual Geometry Grounded Transformer (CVPR)](https://arxiv.org/abs/2503.11651)는 DUSt3R의 쌍 단위 처리를 여러 시점 동시 추론으로 바꿨다. DUSt3R로 N장을 다루려면 이미지 쌍마다 pointmap을 구하고(최대 N(N-1)/2쌍) global alignment를 풀어야 한다. VGGT는 N장을 한꺼번에 transformer에 넣고 attention으로 모든 이미지 사이의 관계를 함께 처리한다. 논문은 수백 장까지 한꺼번에 입력으로 받는다고 적었다. 논문이 H100 한 장에서 잰 feature backbone 처리 시간은 20장에 0.31초, 100장에 3.12초였다.

논문의 정량 비교에서 VGGT는 후처리 없이도 카메라 자세 정확도와 점군 품질에서 DUSt3R보다 나았고, global alignment 최적화가 없어 더 빨랐다.

---

## 16.5 pose estimation과 reconstruction의 경계

컴퓨터 비전은 지도 기반 localization(알려진 지도에서 현재 위치 찾기)과 3D 재구성(처음 보는 환경의 기하 복원)을 따로 다뤘다. SLAM은 둘을 동시에 풀어야 해서 어려웠다.

DUSt3R부터 VGGT까지의 시스템은 기하와 카메라를 추정할 때 같은 학습 표현을 쓴다. DUSt3R는 pointmap에서 따로 계산해 pose를 구하고, 여러 뷰를 global alignment로 묶는다. VGGT는 forward pass 한 번으로 카메라와 기하를 함께 출력하므로 그런 후처리가 없다.

multi-view geometry는 학습 신호로 남아 있다. DUSt3R, MASt3R, VGGT는 SfM 재구성과 센서 데이터에서 얻은 정답으로 자세, depth, pointmap을 학습하면서 여러 시점의 기하 규칙을 이용한다. 다만 epipolar constraint, triangulation, bundle adjustment 같은 알고리즘이 transformer 가중치 안에 그대로 학습됐는지는 어느 논문도 보이지 않았다. 없어진 것은 명시적 파이프라인의 일부다. DUSt3R가 실패하면 그 원인이 네트워크 가중치 안에 있어서, 어느 단계에서 틀렸는지 짚기 어렵다.

> 📜 **예언 vs 실제.** MASt3R 논문의 결론은 여러 벤치마크에서 카메라 자세와 localization 성능을 끌어올렸다는 점과, 이미지가 적을 때도 동작하므로 localization의 쓰임새를 크게 넓힐 것이라는 기대를 적었다. 같은 해 MASt3R의 매칭은 MASt3R-SLAM의 frontend로 쓰였다(§16.2).

---

## 16.6 Semantic foundation model을 지도에 쓰기

DUSt3R, MASt3R, VGGT는 pointmap, 카메라 자세, 기하 구조를 다루는 geometric foundation model이다. 같은 시기 SLAM 연구에서는 CLIP, DINO, SAM 같은 모델을 지도에 넣는 semantic 연구도 늘었다. semantic 모델을 쓰면 미리 정한 class 목록(dictionary) 밖의 개념도 지도에 담을 수 있다.

계층적 semantic 지도를 실시간으로 만든 예로는 MIT Luca Carlone 그룹의 연구가 있다. [Nathan Hughes et al. 2022. Hydra: A Real-time Spatial Perception System for 3D Scene Graph Construction and Optimization (RSS)](https://arxiv.org/abs/2201.13360)는 Kimera(Rosinol et al., ICRA 2020)의 metric-semantic mesh 위에 objects → places → rooms → buildings의 계층적 scene graph를 online으로 만들었다. 정해진 class만 아는 분류기(closed-set)를 썼으므로, Handbook 16장이 말하는 "relatively small (e.g., 100-1000 labels) and predefined dictionary"의 제약 안에 있었다. 논문은 Hydra를 처음으로 실시간 동작하는 spatial perception system이라고 소개했다.

이 제약은 foundation model을 쓰는 연구가 다뤘다. ETH Zurich와 Google의 Songyou Peng, Marc Pollefeys 등이 [Songyou Peng et al. 2023. OpenScene: 3D Scene Understanding with Open Vocabularies (CVPR)](https://arxiv.org/abs/2211.15654)를 냈다. 이어 Toronto, Montréal, MIT 등의 공동 연구로 [Qiao Gu et al. 2024. ConceptGraphs: Open-Vocabulary 3D Scene Graphs for Perception and Planning (ICRA)](https://arxiv.org/abs/2309.16650)가 발표됐다. OpenScene은 CLIP feature를 3D 점군에 distillation해, 사용자가 넣은 임의의 단어와 장면의 각 점이 얼마나 맞는지 보여 주게 했다. ConceptGraphs는 class label 대신 VLM이 만든 설명문을 노드 속성으로 달고, 객체 사이의 관계를 LLM이 서술하게 했다. 두 연구로 미리 정한 class 밖의 개념도 3D 표현에 연결할 수 있게 됐다.

[Dominic Maggio et al. 2024. Clio: Real-time Task-Driven Open-Set 3D Scene Graphs (RA-L)](https://arxiv.org/abs/2404.13696)는 로봇이 받은 자연어 과제(task)를 기준으로 scene graph를 만든다. information bottleneck 원리로 과제에 필요한 추상화 수준만 남기고, 과제와 상관없는 세부는 묶는다.

> 🔗 **차용.** Clio는 Carlone 그룹이 Hydra에 과제 기반 추상화를 더한 후속 연구다. ConceptGraphs는 open-vocabulary 객체 그래프를 따로 만든 연구다.

Ch.18 §18.4는 2017–2019년 object-as-landmark 연구가 줄어든 과정을 다룬다. semantic SLAM은 그 뒤 계층적 scene graph의 형태로 돌아왔다. DUSt3R 같은 geometric foundation model이 예측한 기하에 semantic feature를 함께 싣는 연구도 나왔다. UT Austin·NVIDIA 등의 [Fan et al. 2024. Large Spatial Model (LSM, NeurIPS)](https://arxiv.org/abs/2410.18956)은 DUSt3R로 초기화한 pointmap 예측에 LSeg feature를 더해, pose를 모르는 이미지 두 장에서 기하·외관·open-vocabulary semantic을 forward pass 한 번으로 출력했다.

---

## 16.7 SLAM에서 무엇이 남는가

MASt3R-SLAM은 고전 SLAM의 구조를 빌려 쓴다. keyframe 선택, loop closure, 지도 관리는 새 표현에서도 그대로 필요했다. DUSt3R 계열이 feature matching과 재구성의 내부를 바꿨어도 시스템 수준의 결정은 고전 방법을 따른다.

5부의 다른 시스템도 마찬가지다. NeRF-SLAM은 NeRF를 지도 표현으로 쓰면서 keyframe 기반 tracking을 유지했다. 초기 3DGS-SLAM 시스템인 MonoGS는 명시적 loop closure를 논문의 future work로 남겼다(Ch.15).

2025년 MIT의 Dominic Maggio·Hyungtae Lim·Luca Carlone이 [VGGT-SLAM](https://arxiv.org/abs/2505.12549)을 공개했다(NeurIPS 2025). VGGT가 local submap을 재구성하면, 시스템은 이어지는 submap 사이의 15자유도 projective transform을 \(\mathrm{SL}(4)\) 위에서 최적화하고 loop-closure 제약까지 함께 반영한다. transformer가 local 기하를 만들어도 global graph 최적화는 필요하다. *The SLAM Handbook* 13장(Teed, Deng, Chidlovskii, Revaud, Wimbauer, Cremers)도 DUSt3R를 다룬 절에서 "a form of factor graph is still necessary"라고 적었다(p.386).

---

## 🧭 아직 열린 것

**대규모 sequence 처리.** DUSt3R는 이미지 쌍마다 pointmap을 구하므로 쌍의 수가 이미지 수의 제곱으로 늘어난다. VGGT 논문의 비교에서 DUSt3R는 32장을 넘기면 GPU 메모리가 모자랐다. VGGT의 feature backbone은 H100 한 장에서 200장을 8.75초, 최대 메모리 40.63 GB로 처리했지만, 1,000장이나 10,000장은 그대로 넣기 어렵다. Spann3R는 점진적 방식으로 이 문제의 일부를 다뤘다. sparse attention, 계층적 global alignment 등이 시도되고 있고, 대규모 실외 환경을 처리하는 일은 남은 과제다.

**loop closure의 정의.** 고전 SLAM에서 loop closure는 전에 방문한 장소를 알아보고 누적 오차를 고치는 일이다. DUSt3R 계열에서 방문한 장소를 어떻게 표현하고, pointmap 기반 지도에 교정을 어떻게 퍼뜨릴지는 아직 정해지지 않았다. MASt3R-SLAM은 이미지 검색으로 loop closure 후보를 찾는 기존 방식을 그대로 썼다.

**metric scale의 일반화.** DUSt3R의 pointmap은 상대 scale이어서, 깊이 비율은 복원해도 절대 scale은 모른다. Metric3D나 Depth Anything v2가 metric depth를 목표로 했듯, foundation 3D에서도 여러 환경에서 metric scale을 맞히는 문제가 남는다. 이미지만으로는 절대 scale이 기하적으로 정해지지 않으므로, GPS나 IMU 없이 얻는 scale은 학습한 prior에 기댄 추정이다.

**SLAM에 쓰기.** Ch.15의 3DGS처럼 foundation 3D도 SLAM 연구에 들어오고 있다. 2024–2025년 MASt3R-SLAM과 VGGT-SLAM은 모두 foundation 모델의 출력을 그래프 최적화로 묶었다. 긴 sequence를 실시간으로 처리하는 방법과 §16.6의 semantic 연구(Hydra, Clio, ConceptGraphs)와 결합하는 방법은 남은 과제다. Ch.19에서 다시 다룬다.

# Ch.17 — LiDAR 평행 우주: LOAM에서 FAST-LIO까지

앞 장들에서 다룬 사진측량부터 Foundation 3D까지의 연구는 모두 카메라로 찍은 영상을 입력으로 받는다. MonoSLAM, PTAM, ORB-SLAM, DSO, DUSt3R가 다 그렇다. 같은 시기에 LiDAR를 쓰던 연구자들은 [ICP (Besl·McKay, 1992)](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf)와 Lu–Milios의 pose network를 바탕으로 따로 방법을 쌓아 왔다. 두 쪽은 서로의 논문을 거의 인용하지 않았고, 벤치마크와 학회도 달랐다.

Ji Zhang이 RSS에서 LOAM을 발표한 2014년에 카메라 쪽에서는 LSD-SLAM이 나왔고, 이듬해에는 ElasticFusion이 나왔다. LOAM은 이 방법들과 거의 관계없이 만들어졌고, 그 뒤 10년 동안에도 두 쪽이 서로 주고받은 것은 많지 않았다.

---

## 17.1 LOAM: edge와 plane으로 실시간 3D 정합

LOAM 전에도 레이저 스캔으로 지도를 만드는 방법은 있었다. [Lu & Milios 1997. "Globally Consistent Range Scan Alignment for Environment Mapping" (Autonomous Robots)](https://doi.org/10.1023/A:1008854305733)은 2D 레인지 스캔 하나하나를 노드로, 스캔 사이의 상대 제약을 edge로 두고 궤적 전체를 한꺼번에 최적화했다. 이 "network of poses"는 뒤에 pose-graph SLAM의 원형이 된다(Ch.6 참조). 스캔끼리 맞추는 방법으로는 ICP 말고도 [Biber·Straßer 2003. "The Normal Distributions Transform" (IROS)](https://doi.org/10.1109/IROS.2003.1249285)의 NDT가 있었다. NDT는 공간을 셀로 나누고 셀마다 포인트를 가우시안 분포 하나로 요약한 다음, 새 스캔을 그 분포에 맞춘다. 뒤에 Magnusson이 이를 3D로 확장했다.

움직이면서 3D 스캔을 모으는 일은 더 까다로웠다. 포인트마다 측정 시각이 달라서, 그동안 센서가 움직인 양을 잘못 추정하면 포인트 클라우드가 어긋나게 쌓인다. LOAM 논문에 따르면 그때까지 일관된 3D 지도는 오프라인 일괄 처리로 만들었고, drift는 흔히 loop closure로 바로잡았다. LOAM은 같은 수준의 정확도를 실시간으로 내겠다고 나섰다.

당시 3D LiDAR는 비쌌다(가격은 §17.5). LOAM 저자들도 이 센서를 쓰지 않았다. 논문의 자체 실험에는 Hokuyo UTM-30LX 2D 레이저 스캐너를 모터로 돌려 만든 2축 LiDAR를 썼고, Velodyne 데이터는 KITTI 벤치마크로만 다뤘다.

Ji Zhang은 Carnegie Mellon 대학 Robotics Institute에서 Sanjiv Singh의 지도를 받아 [Zhang & Singh 2014. "LOAM: Lidar Odometry and Mapping in Real-time" (RSS)](https://www.roboticsproceedings.org/rss10/p07.pdf)를 냈다. LOAM은 포인트마다 smoothness $c$를 계산한다. $c$는 같은 scan line에서 양옆 포인트들과의 위치 차이를 더해 구한 값으로, 그 자리의 표면이 얼마나 매끄러운지를 나타낸다. $c$가 가장 큰 포인트들은 **edge point**로, 가장 작은 포인트들은 **planar point**로 고르고, 매칭에는 이 두 집합만 쓴다. edge point는 직전 sweep에서 찾은 edge line까지의 거리로, planar point는 직전 sweep에서 찾은 평면까지의 거리로 제약을 건다. 전체 포인트 대신 적은 수의 feature만 맞추므로 실시간으로 돌릴 만큼 계산량이 줄어든다.

LOAM은 알고리즘 두 개를 함께 돌린다. Lidar Odometry는 약 10 Hz로 스캔 사이의 6-DoF 움직임을 거칠게 추정하고, Lidar Mapping은 1 Hz로 왜곡을 보정한 스캔을 지도에 정밀하게 맞춘다. 두 결과를 합친 위치는 약 10 Hz로 나온다. 이렇게 빠르고 거친 계산과 느리고 정밀한 계산을 나눠 실시간으로 돌면서도 drift(누적 위치 오차)를 줄였다. 이 구조는 뒤에 나온 LeGO-LOAM이 그대로 이어받았다.

2026년 10월 현재 KITTI odometry 공개 순위표에 올라 있는 LOAM의 평균 translation error는 0.55%다.

> 🔗 **차용.** LOAM의 포인트 정합은 Besl·McKay(1992)의 ICP에서 출발한다.

## 17.2 LeGO-LOAM: 지면을 먼저 분리하다

LOAM은 지면 포인트를 다른 포인트와 섞어서 처리했다.

Stevens Institute of Technology의 Robust Field Autonomy Lab에서 Tixiao Shan과 지도교수 Brendan Englot은 [Shan & Englot 2018. LeGO-LOAM](https://doi.org/10.1109/IROS.2018.8594299)에서 지면 분리를 파이프라인 맨 앞에 두었다. 포인트 클라우드를 range image(픽셀마다 거리를 담은 2D 영상)로 펼쳐 지면 포인트를 먼저 떼어 내고, 남은 포인트를 묶음으로 나눈다(segmentation). 최적화도 두 단계로 나눴다. 먼저 지면의 planar feature로 높이($t_z$)와 roll, pitch를 구하고, 이어서 edge feature로 나머지 $t_x$, $t_y$, yaw를 구한다. 두 단계 모두 Levenberg-Marquardt로 푼다.

저자들은 지상 차량으로 울퉁불퉁한 지형에서 모은 데이터로 실험해, LeGO-LOAM이 LOAM보다 적은 계산으로 비슷하거나 더 나은 정확도를 낸다고 보고했다. VLP-16 데이터는 저전력 임베디드 보드인 NVIDIA Jetson TX2에서 실시간으로 처리했다. 공개 구현은 수평으로 단 VLP-16을 기준으로 맞춰져 있고, [README](https://github.com/RobustFieldAutonomyLab/LeGO-LOAM)는 스캔에 지면이 늘 있다고 가정한다고 밝힌다.

같은 해 Bonn 대학의 Jens Behley와 Cyrill Stachniss는 실외 LiDAR에 **surfel**(surface element, 작은 원반 모양의 표면 조각)을 썼다. [Behley & Stachniss 2018. "Efficient Surfel-Based SLAM using 3D Laser Range Data in Urban Environments" (RSS)](http://www.roboticsproceedings.org/rss14/p16.pdf)의 SuMa는 지도를 surfel로 만들고, 새 스캔을 그 지도에 맞춘다(scan-to-model). Ch.9에서 본 ElasticFusion이 실내 RGB-D(Kinect) 데이터에 쓰던 표현을 실외 Velodyne 데이터에 가져온 것이다. 후속작 [Chen et al. 2019. "SuMa++" (IROS)](https://doi.org/10.1109/IROS40897.2019.8967704)는 semantic segmentation 결과를 surfel에 붙여 움직이는 물체를 걸러 냈다. 2018년 무렵에는 LOAM처럼 feature를 골라 쓰는 방식, LeGO-LOAM처럼 지면을 먼저 나누는 방식, SuMa처럼 surfel 지도를 쓰는 방식이 함께 쓰였다.

## 17.3 FAST-LIO: tightly coupled LiDAR-IMU

회전식 LiDAR는 보통 1초에 10번 한 바퀴를 돈다. 한 바퀴를 도는 동안 센서가 빠르게 움직이면 처음과 끝의 센서 위치가 달라져 포인트 클라우드가 일그러진다. 이것을 motion distortion이라고 한다. LOAM은 한 sweep 동안 속도가 일정하다고 보고 이 왜곡을 보정했는데, 움직임이 급하면 이 가정이 맞지 않는다.

IMU는 이보다 훨씬 자주 측정하므로 스캔과 스캔 사이를 채울 수 있다. 두 센서를 합치는 방식에는 loosely coupled와 tightly coupled가 있다. loosely coupled 방식은 센서마다 따로 추정한 결과를 나중에 합친다. tightly coupled 방식은 추정기 하나에 두 센서의 관측을 함께 넣는다. 그만큼 두 센서 사이의 관계를 더 많이 쓰지만, 실제 성능은 모델과 보정, 구현에 따라 달라진다.

University of Hong Kong(HKU) MaRS Lab의 Wei Xu와 지도교수 Fu Zhang은 2021년 RA-L에 [FAST-LIO](https://arxiv.org/abs/2010.08196)를 발표했다. FAST-LIO는 iterated Extended Kalman Filter(iEKF, 반복 확장 칼만 필터)로 LiDAR feature point와 IMU 측정을 합친다. 측정값이 많아도 계산이 불어나지 않도록 Kalman gain을 새로 유도해, 계산량이 측정 개수가 아닌 상태 차원에 따라 정해지게 했다. 저자들은 쿼드로터에 실은 컴퓨터에서 한 스캔의 유효 feature point를 1,200개 넘게 합치면서 iEKF 한 단계의 반복을 모두 25 ms 안에 마쳤다고 보고했다. iEKF는 측정 업데이트를 할 때 새로 얻은 추정치에서 다시 선형화해 계산을 되풀이하므로, 한 번만 선형화하는 EKF보다 선형화 오차를 줄일 수 있다.

이듬해 TRO에 실린 FAST-LIO2([Xu et al. 2022](https://doi.org/10.1109/TRO.2022.3141876))는 feature를 따로 뽑지 않고 원시 포인트를 바로 지도에 맞췄다. 손으로 설계한 feature 추출 단계가 없어지자 스캔 방식이 다른 LiDAR에도 그대로 쓸 수 있게 됐다. 지도는 ikd-Tree(incremental kd-Tree)에 담았다. ikd-Tree는 포인트를 넣고 지우는 일을 트리 전체를 다시 만들지 않고 처리하며, 필요할 때 균형을 다시 맞춘다. 저자들은 공개 데이터셋 19개 시퀀스로 비교했고, 넓은 실외에서 odometry와 mapping을 최대 100 Hz로 돌렸다고 보고했다. 실험 플랫폼은 UAV, 핸드헬드 장치, 자동차였다.

같은 연구실의 [He et al. 2023. "Point-LIO: Robust High-Bandwidth Light Detection and Ranging Inertial Odometry" (Advanced Intelligent Systems)](https://doi.org/10.1002/aisy.202200459)는 포인트를 스캔 하나로 모으지 않았다. Point-LIO는 LiDAR 포인트가 하나 들어올 때마다 그 포인트의 측정 시각에서 상태를 갱신하므로, 스캔 안에서 생기는 motion distortion이 처음부터 생기지 않는다. 실험에서 odometry 출력은 4~8 kHz였다. IMU 측정값을 운동 모델의 출력으로 두어서, IMU가 측정 범위를 넘어 포화된 상태에서도 초당 75 rad로 도는 움직임을 추정했다. 공개 데이터셋 비교에서는 정확도와 계산 시간 모두 다른 방법과 비슷했다고 저자들은 보고했다.

> 🔗 **구분.** FAST-LIO는 raw IMU 측정으로 상태를 앞으로 전파(forward propagation)하고, 스캔 안의 각 포인트를 거꾸로 전파(backward propagation)해 보정한 다음 iEKF로 갱신한다. [Forster et al. 2017. "On-Manifold Preintegration" (TRO)](https://doi.org/10.1109/TRO.2016.2597321)의 IMU preintegration factor는 factor graph에서 쓰는 방식이고, 이 장에서는 LIO-SAM이 이 방식을 쓴다.

## 17.4 LIO-SAM: LiDAR와 IMU를 factor graph로 묶다

그 무렵 visual-inertial 시스템에서는 factor graph가 널리 쓰였다. LiDAR 쪽에도 Lu–Milios의 pose network로 거슬러 올라가는 graph SLAM 연구가 있었다. [GTSAM](https://gtsam.org/)은 Georgia Tech의 Frank Dellaert 연구실이 만든 factor graph 라이브러리로, 여러 센서의 제약을 factor로 엮어 최적화한다.

Tixiao Shan은 LeGO-LOAM의 다음 작업으로 [Shan et al. 2020. LIO-SAM](https://doi.org/10.1109/IROS45743.2020.9341176)을 IROS에 발표했다. LIO-SAM은 GTSAM의 factor graph로 LiDAR-IMU odometry를 푼다. 상대 측정과 절대 측정을 출처에 상관없이 factor로 넣을 수 있어서, IMU preintegration, LiDAR odometry, GPS, loop closure를 한 그래프에 함께 올렸다. IMU preintegration으로 추정한 움직임은 포인트 클라우드의 왜곡을 펴고 LiDAR odometry 최적화의 초기값이 된다. 실시간 성능을 위해 새 스캔을 전체 지도가 아닌 최근 keyframe 몇 개로 만든 국소 지도에 맞춘다.

[공개 구현](https://github.com/TixiaoShan/LIO-SAM)은 실행 내내 유지되는 factor graph에서 LiDAR odometry factor와 GPS factor를 최적화한다. 또 다른 factor graph는 IMU와 LiDAR odometry factor로 IMU bias를 추정하고, IMU 주기로 위치를 내기 위해 주기적으로 초기화된다. README는 loop closure 기능을 LeGO-LOAM에서 그대로 가져온 ICP 기반의 예제라고 설명하고, 더 나은 구현으로 Scan Context를 권한다.

2023년 Bonn 대학의 [Vizzo et al. 2023. "KISS-ICP: In Defense of Point-to-Point ICP" (RA-L)](https://doi.org/10.1109/LRA.2023.3236571)은 이름(Keep It Small and Simple)대로 구성 요소를 대부분 덜어 냈다. 남은 것은 point-to-point ICP, 대응점(correspondence)을 고르는 거리 기준을 상황에 맞춰 바꾸는 adaptive threshold, robust kernel, 단순한 motion compensation, point cloud subsampling이다. IMU 없이 3D point cloud만 입력으로 받는다. 저자들은 파라미터를 바꾸지 않고 자동차, UAV, segway, 핸드헬드 LiDAR 데이터에서 최신 방법과 비슷한 성능을 냈다고 보고했다.

## 17.5 센서 가격 하락과 보급: 2007–2024

2007년 DARPA Urban Challenge에서 주요 팀들이 단 Velodyne HDL-64E는 한 대에 75,000달러였다. 이 센서는 주로 자율주행 연구팀과 국방 과제에서 썼다. 2011년 IEEE Spectrum이 소개한 Google 자율주행 Prius도 지붕에 Velodyne 64빔 LiDAR를 달았다([IEEE Spectrum 2011](https://spectrum.ieee.org/how-google-self-driving-car-works)). Velodyne은 2014년 9월 16채널 VLP-16을 [7,999달러에 내놓았지만](https://www.prweb.com/releases/breaking_through_the_price_barrier_for_lidar_sensors_velodyne_introduces_3d_real_time_lidar_puck_at_7_999/prweb12139477.htm), 이 값도 연구실 예산에서 작은 돈은 아니었다.

2019년에는 값이 훨씬 다양해졌다. DJI에서 나온 중국 업체 Livox는 그해 [Mid-40의 미국 소매가를 599달러로 발표했다](https://www.livoxtech.com/news/1). 같은 해 1월 Ouster는 128채널 OS1-128을 [18,000달러에 내놓았다](https://ouster.com/insights/blog/introducing-the-os-1-128-lidar-sensor). Ouster는 2020년 10월에 solid-state 센서 ES2를 발표하면서 [2024년 차량 양산용 예상 가격을 600달러로 제시했다](https://investors.ouster.com/news-releases/news-release-details/ouster-announces-first-high-performance-true-solid-state-digital). 이 제품들은 채널 수, 시야각, 측정 거리가 다르고, 소매가와 양산 예상가는 매기는 기준도 다르다.

센서가 싸지고 종류가 늘자 알고리즘이 풀어야 할 문제도 생겼다. Solid-state LiDAR는 회전식보다 시야각(FoV)이 좁고, Livox 일부 제품은 같은 경로를 되풀이하지 않는 스캔 패턴을 쓴다. 360° 회전 스캔의 scan line 구조를 전제로 만든 원래 LOAM은 이런 센서에 그대로 쓰기 어렵다. FAST-LIO와 FAST-LIO2는 회전식과 solid-state LiDAR를 모두 지원하고, 저자들은 시야각이 좁은 solid-state LiDAR로 한 실험 결과도 보고했다.

## 17.6 Visual SLAM과 LiDAR SLAM이 따로 발전한 이유

두 센서는 재는 것이 다르다. 카메라는 밝기와 색을 기록하고, LiDAR는 거리를 재서 형상을 얻는다. 그래서 카메라 기반 방법은 keypoint, descriptor, photometric consistency(같은 점은 영상마다 밝기가 같다는 가정)를 중심으로 발전했고, LiDAR 방법은 edge, plane, range image를 주로 썼다. place recognition(이미 와 본 곳인지 알아보는 일)에서도 카메라 쪽은 DBoW2나 NetVLAD처럼 이미지의 겉모습(appearance)을 쓰고, LiDAR 쪽은 [Scan Context(Kim·Kim, IROS 2018)](https://gisbi-kim.github.io/publications/gkim-2018-iros.pdf)나 [PointNetVLAD](https://arxiv.org/abs/1804.03492)처럼 point cloud의 3D 구조를 쓴다.

논문을 내는 곳도 달랐다. 이 장에서 다룬 LiDAR 방법은 LOAM이 RSS, LeGO-LOAM과 LIO-SAM이 IROS, FAST-LIO가 RA-L, FAST-LIO2가 TRO에 실렸다. 앞 장들의 카메라 기반 방법은 로봇공학 학회지 말고도 컴퓨터 비전 학회에 자주 실렸다. PTAM은 ISMAR, DTAM은 ICCV, LSD-SLAM은 ECCV, DUSt3R는 CVPR에 나왔다.

2020년대 초부터 두 분야를 잇는 연구가 나왔다. Tixiao Shan은 [LVI-SAM (ICRA 2021)](https://arxiv.org/abs/2104.10831)에서 LIO-SAM에 visual-inertial 시스템을 붙였다. LVI-SAM은 factor graph 하나로 visual-inertial system(VIS)과 lidar-inertial system(LIS)을 묶는다. VIS는 LIS의 추정으로 초기화하고 LiDAR로 시각 feature의 깊이를 얻는다. LIS는 VIS의 추정을 scan matching의 초기값으로 쓴다. 한쪽이 실패해도 다른 쪽만으로 동작한다.

## 17.7 Visual-LiDAR 수렴 시도: 2024-2025

센서 종류에 상관없이 feature를 뽑는 foundation model이 나오면서, 카메라와 LiDAR를 한 프레임워크에서 다루려는 연구도 늘었다.

한쪽은 LiDAR와 카메라 데이터를 같은 embedding space(특징 벡터 공간)에 놓는 multi-modal pretrained feature를 만든다. [CLIP(Radford et al., 2021)](https://arxiv.org/abs/2103.00020)이 이미지와 텍스트를 contrastive learning(같은 대상의 짝은 가깝게, 다른 짝은 멀게 학습하는 방법)으로 맞춘 것처럼, LiDAR와 이미지 사이에 같은 학습을 적용한다.

다른 쪽은 센서 출력을 geometric primitive나 neural field 같은 공통 표현으로 바꾼 다음 backend 하나에서 처리하려 한다.

그래도 이 장에서 다룬 LiDAR 방법과 앞 장들의 카메라 방법은 대부분 한 종류의 센서를 중심으로 설계됐다.

---

## 17.8 Radar는 본 책의 scope 밖이다

Radar SLAM은 독립된 하위 분야로 자랐다. 하드웨어는 Navtech 계열의 회전식 radar와, 칩 하나에 송수신부를 넣은 4D mmWave radar로 나뉜다. 4D mmWave radar는 Doppler 효과로 각 반사점이 센서 쪽으로 다가오는 속도(radial velocity)를 직접 재므로, 스캔 사이의 대응점을 찾지 않고도 자기 움직임을 구할 수 있다. 어느 쪽이든 speckle, multipath, receiver saturation처럼 전파에서 생기는 노이즈를 따로 모델링해야 한다. 연구는 Oxford의 [Cen & Newman 2018](https://doi.org/10.1109/ICRA.2018.8460687)에서 시작해 Adolfsson·Magnusson의 CFEAR와 후속 TBV-SLAM, Burnett·Barfoot의 continuous-time 방법으로 이어졌다. 벤치마크로는 Oxford Radar RobotCar, Boreas, MulRan 같은 radar 전용 데이터셋을 쓴다. radar는 비, 안개, 연기 속에서도 측정할 수 있다. 다만 이 책이 따라온 photogrammetry → SfM → Visual SLAM → learning → 3D foundation의 흐름과 겹치는 데가 적어 여기서는 다루지 않는다. 자세한 내용은 *SLAM Handbook*(Cambridge University Press, 2026년 4월 21일자 원고) 9장 "Radar SLAM"을 보라.

---

## 📜 예언 vs 실제

> Zhang·Singh는 2014년 LOAM 논문의 결론에서 loop closure로 drift를 바로잡는 일과, 자신들의 출력을 IMU와 함께 Kalman filter로 합쳐 drift를 더 줄이는 일을 future work로 적었다. 이 일들은 10년 안에 이루어졌다. loop closure는 LIO-SAM(2020)이 factor graph에 넣었고, IMU 결합은 FAST-LIO(2021)와 FAST-LIO2(2022)가 iEKF 기반 tightly coupled 방식으로 풀었다.

---

## 🧭 아직 열린 것

**Visual+LiDAR 완전 융합.** LVI-SAM 뒤에도 두 센서를 상태 추정기 하나에서 tightly coupled로 다루는 방식은 연구마다 설계가 다르다. 두 센서를 함께 쓰려면 센서 사이 캘리브레이션이 필요하다. 한 추정기에서 두 센서를 함께 다루는 표준 설계를 정하는 일은 남은 과제다.

**Solid-state LiDAR에 맞춘 알고리즘.** 원래 LOAM은 360° 회전식 LiDAR의 scan line 구조를 전제로 했다. Livox 일부 제품의 비반복 스캔과 solid-state 센서의 좁은 FoV에서는 어떤 방향의 움직임을 관측할 수 있는지(observability)와 motion distortion이 생기는 양상이 달라진다. FAST-LIO2처럼 원시 포인트를 지도에 바로 맞추는 방식이나 Livox용 LOAM 구현([loam_livox](https://github.com/hku-mars/loam_livox))처럼 이런 센서를 다루는 시스템은 이미 있다. 서로 다른 FoV와 스캔 패턴을 설정 하나로 모두 처리하는 일은 아직 남아 있다.

**동적 물체 처리.** LOAM 논문이 future work로 꼽지 않은 문제다. SLAM은 오래전부터 환경이 움직이지 않는다고 가정했고, LiDAR SLAM도 이 가정을 따른다. 움직이는 점을 떼어 내는 방법으로는 §17.2의 SuMa++처럼 semantic segmentation 결과를 쓰는 방식과, Ch.15b의 ERASOR와 Dynablox처럼 기하 정보로 동적 점을 고르는 방식이 있다.

# Ch.18 — 실패 사례와 사라진 계보

카메라 기반 SLAM과 LiDAR 기반 SLAM이 자리를 잡아 가는 동안, 로보틱스 연구자 가운데 일부는 두 방식 어느 쪽에도 속하지 않는 방법을 시도했다. 생체 모방 지도, event camera, 사물 단위 semantic 지도, 구조적 prior를 쓰는 방법이었다.

논문과 초기 결과를 충분히 내고도 주류가 되지 못한 방법들이다.

---

## 18.1 RatSLAM — place cell 기반 위상 지도

RatSLAM은 Michael Milford, Gordon Wyeth, David Prasser가 2004년 ICRA에서 발표했다([Milford et al. 2004](https://doi.org/10.1109/ROBOT.2004.1307183)). 세 사람은 University of Queensland에 있었다. RatSLAM은 쥐의 해마에 있는 **place cell**과 **head direction cell**을 본뜬 모델로 로봇의 위치를 추정했다. 중심은 **pose cell**이라 부르는 신경망이다. pose cell은 (x, y, θ) 세 축으로 배열된 competitive attractor network(경쟁 끌개 신경망)이고, 활성이 한곳에 모인 덩어리(activity packet)가 로봇의 위치와 방향을 나타낸다. 바퀴 엔코더로 잰 이동량(path integration)에 따라 이 덩어리가 옮겨 간다. 로봇이 전에 본 장면(local view)을 다시 보면, 그 장면과 연결된 pose cell에 활성이 더해져 덩어리의 위치가 바로잡힌다.

> 🔗 **차용.** [O'Keefe와 Dostrovsky(1971)](https://pubmed.ncbi.nlm.nih.gov/5124915/)가 발견한 place cell은 신경과학 연구에서 인지 지도 이론으로 이어졌다. RatSLAM은 이 생물학적 기제를 공학 시스템으로 옮긴 초기 시도였다.

2008년 IEEE TRO 논문 [Milford & Wyeth 2008](https://doi.org/10.1109/TRO.2008.2004520)에서는 RatSLAM을 실외에서 시험했다. 차 지붕에 노트북 내장 웹캠 하나를 달고 브리즈번 St Lucia 교외를 100분 동안 66 km 달렸다. RatSLAM은 10 Hz로 들어오는 영상을 실시간으로 처리했고, 길이가 최대 5 km인 루프를 51개 넘게 닫았다. 결과로 나온 지도는 semi-metric topological map(반계량 위상 지도)이었다. 논문은 이 지도가 덮은 면적이 다른 연구진의 지도보다 다섯 배 넘게 넓다고 보고했다. 그 연구진은 자기 지도가 2007년까지 레이저 센서 하나로 만든 지도 가운데 가장 크다고 밝혔다.

RatSLAM을 공학적으로 더 키운 연구는 있었지만 SLAM의 주류가 되지 못했다. 장소가 늘수록 계산량이 커졌고, 정밀도가 더 큰 문제였다. RatSLAM의 위상 지도(topological map)로는 "여기 와 본 적이 있다"는 것까지 알 수 있었지만, 미터 단위의 metric 위치는 안정적으로 내지 못했다. 자율주행과 조작(manipulation)에는 정확한 좌표가 필요했다.

> 📜 **예언 vs 실제.** Milford와 Wyeth는 2008년 TRO 논문 결론에서 RatSLAM을 "vision-only SLAM의 대안적 접근"이라고 불렀다. 기존 state-of-the-art SLAM이 다루기 어려운 환경을 지도로 만들었고, odometry 오차가 크고 환경이 모호해도 큰 루프를 반복해서 믿을 만하게 닫았다고 주장했다. 이 주장은 부분적으로 맞았다. 위상 지도는 지금도 일부 place recognition 연구에 나온다.

RatSLAM은 기하 없이도 장소를 표현할 수 있다는 생각을 남겼다. 이 생각은 place recognition 연구로 퍼졌다. 2012년 Milford와 Wyeth가 [SeqSLAM](https://doi.org/10.1109/ICRA.2012.6224623)을 발표했다. 이미지 하나 대신 이미지 시퀀스를 비교해 장소를 알아보는 방식은 visual place recognition 연구의 한 갈래가 됐다.

---

## 18.2 biologically-inspired SLAM의 공학적 한계

RatSLAM은 biologically-inspired SLAM(생물 모방 SLAM) 가운데 가장 완성된 사례였다. 2000년대 중반부터 2010년대 초반까지 인지 지도, entorhinal grid cell, hippocampal replay를 본뜬 SLAM 변형도 꾸준히 나왔다. 이들 모두 비슷한 문제를 안고 있었다.

생물학적 모델은 뇌가 공간을 *어떻게* 표현하는지 설명한다. 뇌가 *왜* 그렇게 표현하는지, 그 방식이 공학적 목적에도 맞는지는 별개의 질문이다. 쥐의 해마가 일하는 조건과 로봇을 평가하는 센서·계산·정확도 조건은 서로 다르다.

공학적 SLAM에는 미터 이하의 위치 정확도, 실시간 처리, 새 환경에 빨리 적응하는 능력, 검증할 수 있는 오차 범위가 필요하다. 인지 모델로는 이 조건을 보장하기 어려웠다.

---

## 18.3 Event SLAM — 하드웨어와 알고리즘 성숙 격차

Patrick Lichtsteiner, Christoph Posch, Tobi Delbruck는 [ISSCC 2006 논문](https://tilde.ini.uzh.ch/users/tobi/public_html/papers/lichtsteiner_ISSCC2006_D27_09.pdf)에서 Dynamic Vision Sensor(DVS)를 공개했고, [JSSC 2008 논문](https://doi.org/10.1109/JSSC.2007.914337)으로 확장했다. 논문에 적힌 소속은 Lichtsteiner와 Delbruck가 ETH Zürich(취리히의 Institute of Neuroinformatics, INI), Posch가 빈의 ARC Seibersdorf Research다. DVS의 각 픽셀은 밝기의 로그값이 얼마나 바뀌었는지를 혼자서 임계값과 비교한다. 바뀐 양이 임계값을 넘으면 밝아졌는지(ON) 어두워졌는지(OFF)를 담은 이벤트를 다른 픽셀과 상관없이 비동기(asynchronous)로 내보낸다. 셔터로 모든 픽셀을 한꺼번에 읽지 않고, 픽셀마다 이벤트가 난 시각을 마이크로초 단위로 기록한다. 프레임이 없는 카메라였다.

> 🔗 **차용.** DVS는 생물의 망막이 변화를 감지하는 방식에서 착안한 센서였다. Event SLAM은 이 센서에서 출발했다.

이벤트 카메라의 장점은 분명했다. 시간 해상도가 마이크로초 단위이고, 빠르게 움직여도 영상이 번지지 않는다. 동적 범위(dynamic range)가 넓어(HDR) 터널 안과 직사광선 아래를 모두 다룰 수 있다. 전력도 적게 쓴다. [Gallego 등의 서베이](https://arxiv.org/abs/1904.08405)에 따르면 칩 수준에서 대부분 약 10 mW를 쓴다.

2014년 ICRA에서 [Weikersdorfer et al. 2014](https://doi.org/10.1109/ICRA.2014.6906882)가 DVS에 depth 센서를 더한 event 기반 3D SLAM을 발표했다. 같은 해 다른 그룹들도 event 기반 optical flow와 depth 추정을 내놓았다. 2016년부터 2018년 사이 University of Zurich의 Davide Scaramuzza 연구실(RPG)에서 Henri Rebecq 등이 [EVO](https://doi.org/10.1109/LRA.2016.2645143)(RA-L 2017)와 [ESIM](https://proceedings.mlr.press/v87/rebecq18a.html)(CoRL 2018)을 발표하면서 event SLAM 파이프라인이 구체적인 모양을 갖췄다.

실제 환경에서는 제약이 컸다. 해상도가 문제였다. JSSC 2008 논문의 DVS는 128×128 픽셀로, VGA(640×480) 카메라의 약 19분의 1이었다. feature matching과 지도 작성이 해상도에 직접 좌우되는 SLAM에서 이 차이는 컸다. 알고리즘도 문제였다. 프레임을 전제로 만든 알고리즘을 이벤트 스트림에 맞게 다시 설계해야 했고, 그 작업에 시간이 걸렸다.

event를 쓰는 연구는 이후 장소 인식으로도 넓어졌다. [EventVLAD](https://ieeexplore.ieee.org/document/9635907/)(Lee & Kim, IROS 2021)는 event stream에서 잡음을 걷어 낸 edge 이미지를 복원하고, 이 이미지에서 NetVLAD descriptor를 뽑아 장소를 알아봤다. 조명이 크게 바뀌는 조건처럼 frame 기반 VPR(visual place recognition)이 약한 환경에 event를 써 본 시도였다.

## 18.4 Semantic SLAM — 사물을 landmark로 쓰는 방식

2017년부터 2019년까지 CVPR, ECCV, IROS에서 "semantic"을 다룬 연구가 빠르게 늘었다. 딥러닝으로 instance segmentation과 object detection 성능이 빠르게 오르던 때였다. 이런 semantic 이해를 SLAM에 넣으려는 연구도 이어졌다.

그보다 앞선 2013년 CVPR에서 Imperial College London의 Renato Salas-Moreno, Richard Newcombe, Hauke Strasdat, Paul Kelly, Andrew Davison이 **SLAM++**를 발표했다([Salas-Moreno et al. 2013](https://doi.org/10.1109/CVPR.2013.178)). SLAM++는 점이나 패치 대신 *사물(object)*을 지도의 기본 단위로 삼았다. 미리 만들어 둔 사물의 3D 모델을 데이터베이스에 넣어 두고, 손에 든 RGB-D 카메라 영상에서 그 사물을 실시간으로 인식했다. 인식에는 point pair feature로 투표하는 방법을 GPU에서 병렬로 돌렸고, 자세는 ICP(Iterative Closest Point)로 다듬었다. 인식한 사물은 카메라와 함께 pose graph에 넣어 계속 최적화했다. 실험에서는 의자 두 종류와 둥근 탁자 두 종류를 인식해 방 하나를 지도로 만들었다. 논문은 다른 방 하나의 지도 메모리를 같은 부피의 KinectFusion 지도와 견주어 약 70분의 1로 추산했다. 점 수천 개 대신 사물 수십 개로 지도를 나타내면 지도가 작아지고, 장소 인식과 loop closure도 사물을 단위로 할 수 있었다.

> 🔗 **차용.** SLAM++의 사물 인식은 컴퓨터 비전의 model-based recognition에서 왔다. 투표 방식은 Drost 등이 제안한 point pair feature 방법을 가져다 썼다.

SLAM++ 뒤로 [SemanticFusion](https://arxiv.org/abs/1609.05130)(McCormac et al., ICRA 2017)은 dense 지도에 semantic label을 붙였고, [MaskFusion](https://arxiv.org/abs/1804.09194)(Rünz et al., ISMAR 2018)은 움직이는 사물을 인식해 따로 추적했다. 같은 무렵 나온 [SuperPoint](https://arxiv.org/abs/1712.07629)(DeTone et al., CVPRW 2018)도 학습을 썼다. SuperPoint는 keypoint detector와 local descriptor를 함께 학습하는 방법이어서 점 단위로 동작한다. Semantic SLAM 연구자들은 semantic 이해를 기하 파이프라인에 넣으면 환경이 바뀌어도 지도가 더 강건해진다고 주장했다.

2019년까지 널리 비교되던 geometric 파이프라인은 ORB-SLAM2와 VINS-Mono였다. LIO-SAM은 2020년에 나왔다. 당시 semantic 시스템들은 저마다 다른 실내 환경, 사물, 데이터셋에서 평가돼 서로 직접 비교하기 어려웠다. 미리 정한 segmentation model과 class 목록에 기대야 한다는 한계는 여러 논문에 되풀이해 나왔다.

semantic을 먼저 세운 SLAM이 주류가 되지 못한 데는 의존성 문제가 있었다. Semantic SLAM은 segmentation이 정확해야 했다. segmentation이 틀리면 지도 전체가 오염됐다. 기하 파이프라인은 feature matching이 일부 실패해도 robust estimation으로 버텼다. 일반화도 문제였다. 특정 사물 class로 학습한 semantic prior는 그 class 밖에서 쓸모가 없었다.

> 📜 **예언 vs 실제.** Salas-Moreno 등은 SLAM++ 논문 결론에서 자신들의 방법을 "보다 일반적인(generic) SLAM 방법으로 가는 첫걸음"이라고 불렀다. 모양이 조금씩 다른 사물까지 다루고, 장기적으로는 시스템이 스스로 사물 class를 나누고 정의하게 되기를 기대했다. 초록에서는 사물 단위 표현으로 지도를 크게 압축할 수 있다고 했다. 이 기대는 일부만 맞았다. 사물 단위 지도는 AR과 일부 manipulation 응용에 쓰였다. 같은 사물이 되풀이되는 실내 환경에서는 압축과 효율 면의 이점이 다시 확인됐다. 주류 geometric SLAM은 2026년에도 sparse point와 keyframe graph를 쓴다. 시스템이 사물을 스스로 나누고 정의하는 단계에는 이르지 못했다. 사물을 landmark로 쓰는 방식은 널리 퍼지지 않았다. semantic은 SLAM 안에서 움직이는 영역을 가려내는 데, 그리고 SLAM 뒤의 semantic mapping과 task planning에 쓰이게 됐다.

semantic을 다른 자리에 쓴 연구는 계속 나왔다. [SuMa++](https://doi.org/10.1109/IROS40897.2019.8967704)(Chen et al., IROS 2019)는 LiDAR 스캔에 semantic class를 붙여 움직이는 물체를 걸러 냈다. [Kimera](https://doi.org/10.1109/ICRA40945.2020.9196885)(Rosinol et al., ICRA 2020)는 metric-semantic 3D mesh를 실시간으로 만들었고, 같은 그룹의 [3D Dynamic Scene Graphs](https://doi.org/10.15607/RSS.2020.XVI.079)(Rosinol et al., RSS 2020)가 3D scene graph를 내놓았다. [Hydra](https://doi.org/10.15607/RSS.2022.XVIII.050)(Hughes et al., RSS 2022)는 scene graph를 실시간으로, 계층을 나누어 만들었다. [ConceptGraphs](https://doi.org/10.1109/ICRA57147.2024.10610243)(Gu et al., ICRA 2024)와 [Clio](https://doi.org/10.1109/LRA.2024.3451395)(Maggio et al., RA-L 2024)는 그 위에 open-vocabulary foundation feature를 얹었다. semantic은 지도의 위층으로 자리를 옮겼다. 이 흐름은 2026년에도 이어지고 있고, [Ch.15b](chapter_15b_dynamic.md)(Dynamic·static 분리의 semantic 귀환), [Ch.16](chapter_16_foundation_3d.md)(foundation 3D·metric-semantic 본체), [Ch.19 §19.7](chapter_19_open_problems.md#197-semantic-표현과-open-world)(Semantic의 귀환)에서 이어 다룬다.
