# 13장 장소 인식: FAB-MAP에서 AnyLoc까지

Oxford 모바일 로보틱스 그룹의 Mark Cummins와 Paul Newman이 파고든 질문은 단순하면서도 치명적이었다. "로봇이 방금 지나친 이 장소를 예전에 본 적이 있는가?" 영상만으로 이동량을 쌓아 가는 visual odometry에는 어쩔 수 없이 drift가 누적되므로, feature 기반이든 direct든 dense든 모든 SLAM 시스템이 큰 오차를 털어 내려면 결국 loop를 닫아야 한다. **장소 인식**(place recognition)은 지금 카메라에 비친 장면이 수천 장의 과거 기록 중 어디와 같은지 가려내는 역할을 도맡았다. 흥미롭게도 이 분야는 tracking·mapping과 사뭇 다른 궤적을 그리며 독자적으로 발전했다. 특히 장소 인식은 손으로 깎아 만든 visual word 통계에서 출발해 딥러닝 기반 전역 서술자로 가장 먼저, 그리고 깊숙이 옮겨 간 영역이기도 하다.

---

## 13.1 BoW 이전의 place recognition

GPS 신호가 닿지 않는 실내나 터널, 고층 빌딩 숲에서 로봇이 루프를 닫으려면 과거에 찍어 둔 이미지 수천, 수만 장 가운데 현재 장면과 닮은 것을 눈 깜짝할 사이에 찾아내야 한다. 데이터베이스의 모든 이미지를 하나씩 꺼내 비교하는 선형 탐색으로는 이미지가 수만 장만 넘어가도 실시간 제한 시간을 훌쩍 넘겨 버린다.

돌파구는 SLAM 바깥, 컴퓨터 비전의 영상 검색 연구에서 왔다. 2003년 ICCV에서 Oxford의 Sivic과 Zisserman이 발표한 ["Video Google"](https://www.robots.ox.ac.uk/~vgg/publications/2003/Sivic03/sivic03.pdf)은 동영상 속에서 특정 물체가 나온 장면을 곧바로 찾아내기 위해 텍스트 검색의 고전인 TF-IDF(단어 빈도에 희귀도 가중치를 곱한 점수)를 이미지로 가져왔다. SIFT 서술자를 k-means로 군집화해 일종의 시각 단어인 "visual word" 사전을 만들고, 각 이미지를 이 단어들의 빈도 벡터로 요약한 것이다. 여기에 단어마다 그 단어가 등장한 이미지 목록을 미리 매달아 둔 inverted index를 얹으면, 질의 영상에 포함된 visual word 목록만 훑고도 후보 영상을 즉시 추려 낼 수 있다. 장소 인식 연구자들은 이 검색 엔진 구조를 지체 없이 로보틱스로 가져왔다.

---

## 13.2 FAB-MAP — 확률적 BoW와 Chow-Liu 트리 (2008)

하지만 영화 속 물체를 찾는 것과 로봇의 loop closure는 무게가 달랐다. 2008년 Cummins와 Newman은 [Cummins & Newman. FAB-MAP: Probabilistic Localization and Mapping in the Space of Appearance](https://doi.org/10.1177/0278364908090961)에서 단순한 유사도 점수만으로는 왜 충분하지 않은지를 분명히 짚었다. 비슷한 구조물이 반복되는 환경에서는 가장 높은 유사도 점수를 받은 후보조차 가짜일 수 있으며, SLAM에서 잘못된 loop closure(false positive)가 단 하나라도 그래프에 끼어들면 지도 전체가 산산조각 나기 때문이다.

두 사람은 유사도 순위를 매기는 대신 엄밀한 베이즈 추론으로 문제를 다시 세웠다. 현재 관측 $z_t$(어떤 visual word들이 나타났는지 담은 집합)가 주어졌을 때, 데이터베이스의 각 장소 $\ell_i$에 있을 사후 확률은 다음과 같다.

$$P(\ell_i \mid z_t) \propto P(z_t \mid \ell_i) P(\ell_i)$$

핵심 난관은 우도 $P(z_t \mid \ell_i)$를 어떻게 모델링하느냐였다. 모든 visual word가 서로 독립이라고 가정하면 간단한 naïve Bayes가 되지만, 현실의 시각 단어들은 강하게 얽혀 있다. 가령 "문"에 해당하는 단어가 보이면 "문손잡이"에 해당하는 단어도 덩달아 등장하기 쉽다. 이 상관관계를 무시하고 독립을 가정하면 흔한 구조물이 겹칠 때마다 확률이 과대평가되어 오탐이 속출한다.

FAB-MAP은 이 상관관계를 **Chow-Liu tree**로 포착했다. Chow-Liu tree는 visual word 쌍 $(e_i, e_j)$ 사이의 상호정보량(mutual information)

$$I(e_i; e_j) = \sum_{e_i, e_j} P(e_i, e_j) \log \frac{P(e_i, e_j)}{P(e_i)P(e_j)}$$

의 합이 최대가 되도록 짠 최대 스패닝 트리다. 이 트리 구조 위에서 joint likelihood를 분해하면 다음과 같은 연쇄 곱 형태가 된다.

$$P(z_t \mid \ell_i) = \prod_k P(z_t^k \mid z_t^{\text{pa}(k)}, \ell_i)$$

여기서 $z_t^k \in \{0,1\}$은 $k$번째 word의 출현 여부, $\text{pa}(k)$는 트리에서 $k$의 부모 노드다. 단어들이 함께 등장하는 패턴을 확률 모델 안에 녹여 낸 덕분에 복도처럼 닮은 장소가 줄지어 있어도 false positive를 상당 부분 걸러 낼 수 있었다(vocabulary와 tree는 대량의 별도 학습 영상에서 미리 구해 둔다). 여기에 FAB-MAP은 현재 위치가 기존 데이터베이스에 없는 전혀 새로운 장소일 확률까지 "new place" 가설로 명시적으로 계산해 넣어 오탐의 틈을 한 번 더 막았다.

그 위력은 2011년 발표된 [FAB-MAP 2.0](https://www.robots.ox.ac.uk/~mjc/Papers/cummins_newman_ijrr_fabmap2_2010_preprint.pdf)에서 증명됐다. FAB-MAP 2.0은 무려 1,000 km에 달하는 도로 주행 경로에서 오직 영상의 겉모습(appearance)만으로 loop closure를 검출해 냈다.

> 🔗 **차용.** FAB-MAP이 visual word로 장면을 요약하는 뼈대는 Sivic & Zisserman의 "Video Google"(2003)에서 왔다. Cummins와 Newman은 문서 검색용 BoW 기법을 베이즈 확률과 Chow-Liu 트리 위에서 로봇 항법의 안전 기준에 맞게 재탄생시켰다.

---

## 13.3 DBoW2 — binary 서술자와 vocabulary tree (2012)

FAB-MAP이 활약하던 시기에도 SURF 같은 부동소수점 서술자는 여전히 무거웠다. 2012년 무렵 SLAM 진영이 BRIEF, ORB, BRISK처럼 비트 연산으로 매칭하는 훨씬 가벼운 binary 서술자로 이동하면서, 장소 인식 역시 부동소수점 vocabulary의 계산 굴레를 벗어날 필요가 생겼다.

스페인 Zaragoza 대학의 Dorian Gálvez-López와 Juan D. Tardós는 2012년 [Gálvez-López & Tardós. Bags of Binary Words for Fast Place Recognition in Image Sequences](https://doi.org/10.1109/TRO.2012.2197158)를 발표하며 **DBoW2**를 내놓았다. binary 서술자로 계층적 vocabulary tree를 직접 구축해 Hamming distance만으로 word를 배정할 수 있게 한 덕분에, SIFT·SURF 기반 방식보다 훨씬 빠른 속도로 장소를 검색할 수 있었다.

DBoW2는 $k$분기 $d$깊이 트리의 각 리프 노드 $w_i$에 TF-IDF 가중치

$$\eta_i = \frac{n_i}{n} \cdot \log \frac{N}{N_i}$$

를 곱해 BoW 벡터를 만든다. 여기서 $n_i$는 해당 이미지에 word $w_i$가 등장한 횟수, $n$은 이미지 내 전체 word 수, $N$은 데이터베이스 총 이미지 수, $N_i$는 $w_i$를 포함한 이미지 수다. 두 이미지 $a$와 $b$의 BoW 벡터 $\mathbf{v}_a, \mathbf{v}_b$ 사이의 유사도는 L1-norm 기반으로 다음과 같이 잰다.

$$s(\mathbf{v}_a, \mathbf{v}_b) = 1 - \frac{1}{2} \left\| \frac{\mathbf{v}_a}{|\mathbf{v}_a|} - \frac{\mathbf{v}_b}{|\mathbf{v}_b|} \right\|_1$$

이 계산은 inverted index 조회와 맞물려 매우 가볍게 돌아갔다(조회 비용은 word 수와 각 목록 길이에 비례한다). 오픈소스로 풀린 DBoW2는 곧바로 ORB-SLAM(2015), ORB-SLAM2, ORB-SLAM3의 loop closure 심장으로 자리 잡았고, 공저자 Tardós 역시 ORB-SLAM 세 편 모두에 이름을 올렸다.

> 🔗 **차용.** DBoW2가 채택한 계층적 vocabulary tree 구조는 Nistér & Stewénius의 2006년 ["Scalable Recognition with a Vocabulary Tree"](https://people.eecs.berkeley.edu/~yang/courses/cs294-6/papers/nister_stewenius_cvpr2006.pdf)(CVPR)에서 빌려 왔다. Gálvez-López와 Tardós는 이 트리를 binary 서술자의 Hamming 공간에 맞게 다듬고 가중치와 시간적 일관성 검사를 SLAM에 최적화했다.

---

## 13.4 NetVLAD — CNN 기반 VPR (2016)

BoW 방식은 빠르고 가벼웠지만 근본적인 약점이 있었다. 미리 학습해 둔 vocabulary가 특정 환경과 특정 수작업 서술자에 묶여 있어, 밤낮이 바뀌거나 계절이 변하고 카메라 시점이 크게 틀어지면 visual word 분포 자체가 무너져 버린다.

2016년 CVPR에서 Relja Arandjelović, Petr Gronat, Akihiko Torii, Tomáš Pajdla, Josef Sivic이 발표한 [NetVLAD: CNN Architecture for Weakly Supervised Place Recognition](https://doi.org/10.1109/CVPR.2016.572)은 딥러닝으로 이 장벽을 넘었다. 공저자 Sivic이 13년 전 "Video Google"을 썼던 바로 그 연구자라는 점도 시대의 전환을 상징한다.

NetVLAD의 핵심은 국소 서술자들을 이미지 한 장의 고정 길이 벡터로 묶는 **VLAD**(Vector of Locally Aggregated Descriptors) 연산을 미분 가능하게 뜯어고친 데 있다. 2010년 [Jégou 등](https://inria.hal.science/inria-00548637/file/jegou_compactimagerepresentation.pdf)이 제안한 원래 VLAD는 각 국소 서술자 $\mathbf{x}_i$와 가장 가까운 군집 중심 $\boldsymbol{\mu}_k$ 사이의 잔차 벡터를 군집별로 누적해 단어 빈도만 세는 BoW보다 훨씬 풍부한 기하·외관 정보를 담았다.

$$\mathbf{V}(k) = \sum_{\mathbf{x}_i : \text{NN}(\mathbf{x}_i)=k} (\mathbf{x}_i - \boldsymbol{\mu}_k)$$

전체 VLAD 벡터 $\mathbf{V} = [\mathbf{V}(1)^\top, \ldots, \mathbf{V}(K)^\top]^\top$는 군집별 부분 벡터를 모두 이어 붙인(concatenate) 뒤 L2 정규화한 $KD$차원 벡터다($K$개 군집, $D$차원 서술자).

문제는 가장 가까운 군집 하나를 고르는 $\text{NN}(\mathbf{x}_i)=k$ 연산이 불연속이라 기울기가 흐르지 않는다는 점이었다. NetVLAD layer는 이 hard assignment를 학습 가능한 파라미터 $\mathbf{w}_k, b_k$를 쓴 softmax 기반 soft assignment로 부드럽게 풀어냈다.

$$\bar{a}_k(\mathbf{x}_i) = \frac{e^{\mathbf{w}_k^\top \mathbf{x}_i + b_k}}{\sum_{k'} e^{\mathbf{w}_{k'}^\top \mathbf{x}_i + b_{k'}}}$$

CNN feature map에서 뽑은 국소 특징 $\mathbf{x}_i$에 이 가중치를 적용해 누적하면

$$\mathbf{V}(k) = \sum_i \bar{a}_k(\mathbf{x}_i)\,(\mathbf{x}_i - \boldsymbol{\mu}_k)$$

이 되고, 이어 $\mathbf{V} = [\mathbf{V}(1)^\top, \ldots, \mathbf{V}(K)^\top]^\top$의 각 부분 벡터를 먼저 정규화(intra-normalization)한 뒤 전체 벡터를 다시 L2 정규화해 최종 VPR(visual place recognition) 서술자를 얻는다. 이제 전 과정이 미분 가능하므로 CNN backbone까지 한꺼번에 end-to-end로 학습시킬 수 있었다.

학습 데이터의 병목도 영리하게 우회했다. 저자들은 같은 거리를 서로 다른 해와 계절에 찍은 Google Street View Time Machine 이미지와 GPS 태그를 활용해, 가까운 위치의 다른 시점 사진은 양성 쌍으로, 먼 위치의 사진은 음성 쌍으로 묶는 weakly supervised triplet loss를 썼다. 사람이 일일이 정밀한 대응 레이블을 달아 주지 않아도 강건한 장소 표현을 학습할 수 있었던 비결이다.

Pittsburgh 250k와 Tokyo 24/7 벤치마크에서 NetVLAD는 기존 VLAD와 비학습 CNN 특징을 큰 격차로 따돌렸고, 특히 낮과 밤이 뒤바뀌는 가혹한 조건에서도 잘 버텼다. 다만 DBoW2에 비해 추론 속도가 느리고 메모리 요구량이 컸기에, 당시 실시간 SLAM 파이프라인에 곧장 갈아 끼워지기보다는 주로 대규모 VPR과 후처리 재위치 추정 영역에서 표준으로 자리 잡았다.

> 🔗 **차용.** NetVLAD의 집계 계층은 Jégou 등이 CVPR 2010에 발표한 "Aggregating Local Descriptors into a Compact Image Representation"의 VLAD 설계를 그대로 계승하되, hard assignment를 softmax soft assignment로 치환해 종단 간 역전파 학습의 길을 열었다.

---

## 13.5 Patch-NetVLAD, MixVPR, AnyLoc (2020-2023)

NetVLAD 이후 VPR 연구는 계절과 날씨, 시점 변화가 극단으로 치닫는 조건에서도 무너지지 않는 표현을 찾는 데 집중했고, 평가 무대도 Mapillary Street Level Sequences(MSLS)나 노르웨이 철도의 여름·겨울을 담은 Nordland 같은 데이터셋으로 옮겨 갔다.

2021년 Hausler 등의 [Patch-NetVLAD](https://arxiv.org/abs/2103.01486)는 global NetVLAD 서술자로 후보를 빠르게 추린 뒤, 이미지를 패치 단위로 쪼개 다중 스케일 NetVLAD 특징을 뽑고 공간적 일치도를 따져 순위를 다시 매겼다. 이로써 Tokyo 24/7의 Recall@1을 NetVLAD의 64.8%에서 86.0%까지 끌어올렸다. 2023년 Ali-bey 등의 [MixVPR](https://arxiv.org/abs/2303.02190)는 사전 학습된 backbone의 feature map을 MLP 블록(Feature-Mixer)으로 통째로 섞어 전역 특징을 빚어냈고, NetVLAD의 절반도 안 되는 파라미터 수로 Pitts250k, MSLS, Nordland에서 기존 기록을 경신했다.

더 큰 전환점은 foundation model의 등판이었다. Keetha 등의 [AnyLoc: Towards Universal Visual Place Recognition](https://arxiv.org/abs/2308.00688)(arXiv 2023, RA-L 2024)은 대규모 인터넷 이미지로 자기지도 학습된 Vision Transformer(ViT)인 DINOv2의 특징을 아무런 fine-tuning 없이 VPR에 곧바로 투입했다. 연구진은 ViT 계층 내부의 **facet**—곧 query(Q), key(K), value(V), token(patch feature)—을 꼼꼼히 비교한 끝에 value facet이 장소 인식에서 평균적으로 가장 뛰어나다는 사실을 확인했다. 여기에 비지도 VLAD 집계를 결합하자, 재학습 없이도 도시, 실외, 실내, 항공, 수중, 지하까지 단일 방법으로 작동하며 기존 대비 최대 4배 높은 Recall@1을 달성했다.

한편 카메라와 LiDAR처럼 서로 다른 센서 사이의 장벽을 허무는 교차 모달(cross-modal) 장소 인식도 열렸다. Lee 등의 [(LC)²](https://arxiv.org/abs/2304.08660)(RA-L 2023)는 스테레오 카메라에서 얻은 disparity 영상과 LiDAR range 영상을 똑같은 2.5D 깊이 이미지 공간으로 옮겨 서로 매칭해, 사전 구축된 3D point cloud 지도 없이도 카메라–LiDAR 간 loop 제약을 걸어 위치를 추정해 냈다. 또 Lee 등이 만든 [ViViD++](https://arxiv.org/abs/2204.06183)(RA-L 2022)처럼 RGB, 열화상(thermal), event, depth 카메라와 관성 센서를 한 몸에 싣고 낮과 밤을 바꿔 가며 같은 경로를 반복 기록한 데이터셋도 등장해 악천후·저조도 평가의 토대를 놓았다.

> 🔗 **차용.** AnyLoc의 특징 추출기는 Meta AI가 공개한 [DINOv2](https://arxiv.org/abs/2304.07193)(Oquab et al., 2023)다. 흥미롭게도 2000–2010년대 BoW와 VLAD 시절의 고전적 집계 기법이 2023년 foundation model의 범용 ViT 특징과 만나 '학습 없는 범용 VPR'로 다시 태어난 셈이다.

---

## 13.6 place recognition과 metric localization의 통합 시도 (2023-2024)

오랫동안 장소 인식은 SLAM의 나머지 단계와 분리된 별동대처럼 움직였다. ORB-SLAM 안의 DBoW2만 보더라도 mapping이나 tracking 상태는 살피지 않고 이미지를 받아 "이전에 본 몇 번 keyframe과 비슷하다"는 후보 ID만 뱉어 낼 뿐, 실제 기하 정합은 뒤따르는 RANSAC과 PnP에 넘겼다.

2023–2024년에는 Berton 등의 [EigenPlaces](https://arxiv.org/abs/2308.10832)(2023)와 Izquierdo·Civera의 [SALAD](https://arxiv.org/abs/2311.15937)(arXiv 2023 / CVPR 2024)가 시점 변화에 한층 강한 전역 서술자와 최적 수송(optimal transport) 기반 국소 특징 집계를 밀어 올렸다. 하지만 이들이 내놓는 결과 역시 데이터베이스 속 가장 닮은 이미지일 뿐이어서, 미터 단위의 정밀한 metric pose를 얻으려면 결국 기하 검증과 별도의 위치 추정 단계를 거쳐야 한다. 2024년에는 3D Gaussian Splatting(3DGS)으로 구축한 장면 표현 자체에서 곧바로 장소 인식용 서술자를 끌어내어 지도 표현과 재위치 추정을 하나로 엮으려는 시도도 고개를 들었다.

---

## 아직 열린 문제

**계절·조명 극변.** 여름과 겨울이 극단적으로 대비되는 Nordland 노르웨이 철도 데이터셋이나 사계절을 1년 내내 기록한 Oxford RobotCar는 10년 넘게 장소 인식 알고리즘을 괴롭혀 왔다. DINOv2 같은 foundation model이 그 간극을 크게 좁히긴 했으나, 눈보라가 치거나 식생이 완전히 뒤바뀐 환경에서도 오탐 없이 작동하는 일은 여전히 쉽지 않다.

**Place recognition과 metric localization의 통합.** 전통적인 ORB-SLAM 계열은 '장소 인식(후보 검색) → 서술자 매칭 → 기하적 자세 추정'이라는 다단계 파이프라인을 밟는다. 검색용 전역 표현과 정밀 자세 추정용 3D 기하 표현을 하나로 통합했을 때, 다양한 센서와 장면·배포 제약 조건 아래에서도 정밀도와 속도를 동시에 지켜 낼 수 있는지는 아직 검증 중이다.

**인식 가능한 장소 표현의 프라이버시.** 위치 추정을 위해 서버나 로봇에 저장하는 지도 자체가 사생활 유출의 통로가 될 수 있다는 경고도 무겁다. [Pittaluga 등(CVPR 2019)](https://arxiv.org/abs/1904.03303)은 서술자가 붙은 3D SfM point cloud만 가지고도 원래 그 장소를 찍었던 카메라 영상을 섬뜩할 만큼 선명하게 복원해 보여, 가정·병원·사무실을 누비는 상용 로봇의 지도가 안고 있는 보안 위험을 드러냈다. 같은 해 [Speciale 등(CVPR 2019)](https://arxiv.org/abs/1903.05572)이 3D 점을 무작위 방향의 직선으로 치환한 line cloud 지도를 대안으로 내놓았으나, 2021년 [Chelani, Kahl, Sattler](https://arxiv.org/abs/2103.05086)은 그 line cloud에서조차 점 위치와 영상 내용을 대략 되살릴 수 있음을 증명했다(선을 극도로 성기게 남길 때만 세부가 가려졌다). 정확히 장소를 알아맞히면서도 원래 모습은 엿볼 수 없게 만드는 프라이버시 보존형 장면 표현은 여전히 풀어야 할 숙제다.

---

장소 인식에서 신경망으로 "여기가 어디인가"라는 전역 기억을 다루기 시작했다면, 거의 같은 시기 딥러닝이 정조준한 또 하나의 고전 난제는 "단 한 장의 사진만 보고 각 픽셀이 얼마나 멀리 떨어져 있는가"를 읽어 내는 일이었다. 다음 장에서는 단일 이미지에서 깊이를 예측하며 단안 SLAM의 고질적 제약을 흔들어 놓은 단안 깊이 추정의 역사를 따라간다(→ 14장).

# 14장 단안 깊이 추정: Eigen에서 Depth Anything까지

단안 깊이 추정(monocular depth estimation)은 컴퓨터 비전에서 손꼽히는 오래된 ill-posed 문제다. 3차원 세계가 2차원 이미지 평면으로 투영되는 순간 거리 정보는 소실되므로, 기하학만 놓고 보면 똑같은 사진 한 장을 만들어 낼 수 있는 3차원 장면의 조합은 무한히 많다. 그런데도 사람은 원근감과 가림(occlusion), 텍스처의 성글고 촘촘한 기울기, 표면의 음영 같은 시각 단서를 엮어 눈 한쪽만으로도 깊이를 가늠한다. 2014년 뉴욕대학교(NYU) 대학원생 David Eigen이 CNN을 이용해 단일 이미지에서 깊이 맵을 직접 예측해 내자, 학습 기반 깊이 예측을 단안 SLAM의 빈틈에 끼워 넣으려는 시도가 물밀듯 이어졌다.

---

## 14.1 Eigen 2014 — 초기 CNN depth

딥러닝 이전에도 사진 한 장에서 깊이를 배우려는 시도는 있었다. 2005년 NIPS에서 Stanford의 Ashutosh Saxena 등은 [Markov Random Field(MRF)로 단일 이미지의 depth map을 예측하는 연구](https://papers.nips.cc/paper/2921-learning-depth-from-single-monocular-images)를 발표했고, 뒤이은 Make3D 시스템은 실외 사진 속 superpixel마다 작은 평면을 배치해 거친 3차원 구조를 복원했다. Make3D는 CNN 시대 이전에 수작업 시각 특징으로 단안 깊이를 추정한 대표적 이정표다.

판도를 바꾼 것은 Eigen, Puhrsch, Fergus가 NIPS 2014에 발표한 [Eigen et al. 2014](https://arxiv.org/abs/1406.2283)였다. 이 네트워크는 두 단계로 작동한다. 먼저 coarse network가 이미지 전체의 굵직한 원근 구조와 바닥·벽 배치를 훑어 거친 깊이를 잡으면, 뒤따르는 fine network가 원본 영상의 국소 세부와 물체 경계를 살려 깊이를 날카롭게 다듬는다. 저자들은 NYU Depth v2의 실내 464개 장면 중 학습용 249개 장면에서 뽑은 약 120,000장의 영상과, 실외 주행 데이터인 KITTI로 각각 모델을 학습시켰고, 두 벤치마크 모두에서 같은 데이터로 학습한 Make3D를 확실히 앞섰다.

하지만 **scale ambiguity**(척도 모호성)라는 벽은 그대로 남았다. 신경망이 뱉어 내는 절대 미터 값은 학습 데이터셋의 방 크기와 카메라 시야각 분포에 암묵적으로 묶여 있었다. 가령 NYU 실내 영상으로 학습한 모델을 야외 풍경에 들이대면 스케일이 크게 어긋나기 일쑤였다. 절대 미터 단위의 단안 metric depth를 낯선 환경에서도 일관되게 예측하는 일은 그로부터 10년이 지난 2024년에도 핵심 과제로 남았다.

> 🔗 **차용.** Eigen 2014는 Saxena 등이 개척한 '단일 이미지에서 직접 depth map을 회귀한다'는 문제 정의를 고스란히 이어받되, 수작업 특징과 MRF 추론을 다중 스케일 CNN으로 대체해 정확도를 끌어올렸다.

---

## 14.2 Garg → Godard — self-supervised depth

Eigen 방식의 supervised 학습에는 치명적인 병목이 있었다. 픽셀마다 정답 깊이(ground truth)가 달린 대량의 데이터가 필요하다는 점이다. Kinect는 실내에서는 쓸 만했지만 햇빛이 비치는 실외에서는 무력했고, 고가 LiDAR로 대규모 야외 RGB-D 데이터셋을 구축하는 데는 막대한 비용이 들었다.

2016년 호주 애들레이드 대학의 [Ravi Garg 등](https://arxiv.org/abs/1603.04992)은 정답 깊이 레이블 대신 스테레오 카메라가 찍은 좌우 이미지 쌍 자체를 학습 신호로 쓰는 영리한 우회로를 열었다. 왼쪽 이미지만 신경망에 넣어 깊이를 예측한 뒤, 그 깊이와 이미 알고 있는 카메라 baseline으로 왼쪽 이미지를 오른쪽 카메라 시점으로 옮겨 그린다. 이들은 이렇게 옮겨 그린 영상이 실제 오른쪽 이미지와 밝기가 같아야 한다는 점을 활용했다. 재구성한 영상과 실제 영상의 밝기 차이(photometric loss)만 줄이면 되니 비싼 깊이 정답이 필요 없었다.

2017년 UCL의 Clément Godard는 이 아이디어를 한층 정교하게 다듬어 [Godard et al. 2017](https://doi.org/10.1109/CVPR.2017.699)의 **MonoDepth**를 발표했다. 왼쪽에서 예측한 disparity와 오른쪽에서 예측한 disparity가 서로 일관되도록 묶는 left-right consistency 제약을 얹고, 단순 L1 밝기 차이에 구조적 유사도(SSIM)를 결합해 경계 품질을 크게 높였다. 스테레오 쌍은 학습 중에만 쓰이고 실제 추론에는 이미지 한 장만 들어가는데도, 당시 KITTI 평가 기준에서 기존 self-supervised 기법들을 모두 앞질렀다.

한 걸음 더 나아간 작품이 2019년 ICCV에 나온 Godard의 **MonoDepth2**([Godard et al. 2019, ICCV](https://arxiv.org/abs/1806.01260))다. 이제는 학습 때조차 스테레오 카메라 없이 일반 단안 비디오 하나만 있으면 됐다. 별도의 pose network가 연속 프레임 사이의 카메라 움직임을 예측하면, depth network가 뽑은 깊이와 합쳐 이웃 프레임을 현재 시점으로 warping하고 그 오차가 줄어들도록 두 망을 동시에 학습시키는 구조다. 단안 비디오 학습의 고질적인 오류를 막기 위해 두 가지 정교한 장치도 고안됐다. 먼저 한 프레임에서 물체에 가려진(occluded) 영역이 평균 오차를 오염시키지 않도록, 여러 소스 프레임 중 가장 오차가 작은 값만 취하는 **minimum reprojection loss**를 썼다. 또 **auto-masking**에서는 warping 없이 그대로 비교한 identity reprojection error가 warping 후 오차 이하로 떨어지면 해당 픽셀을 학습 신호에서 자동으로 걸러 냈다. 가령 카메라가 정지해 있거나 앞차가 카메라와 나란히 같은 속도로 달릴 때가 그런 경우다.

그럼에도 한계는 분명했다. 움직이는 물체나 거울·유리 같은 반사면에서는 밝기 일치(photometric consistency) 가정 자체가 성립하지 않았고, 하늘처럼 무늬 없는 영역에서는 밝기 기울기가 없어 깊이가 모호해졌으며, 단안 비디오만으로는 절대 미터 스케일까지 배울 수 없었다.

> 🔗 **차용.** Garg와 Godard가 신경망의 지도 신호로 삼은 photometric loss는 사실 고전 스테레오 매칭 문헌에서 오래 써 온 밝기 일치 제약의 변주다. [Scharstein과 Szeliski(2002)](https://vision.middlebury.edu/stereo/taxonomy-IJCV.pdf)가 집대성한 disparity 추정 알고리즘의 핵심 가정이 미분 가능한 image warping을 통해 딥러닝 손실 함수로 옮겨 온 셈이다.

---

## 14.3 MiDaS — 데이터셋 혼합

단안 깊이 모델이 연구실 데이터셋 울타리를 넘어 어디서나 통하려면 거대한 데이터 규모가 필요했지만, 세상에 흩어진 깊이 데이터셋들은 저마다 단위와 성질이 제각각이었다. Intel의 René Ranftl 등이 발표한 **MiDaS**([Ranftl et al. 2022](https://doi.org/10.1109/TPAMI.2020.3019967), "Towards Robust Monocular Depth Estimation: Mixing Datasets for Zero-shot Cross-dataset Transfer", 2020년 온라인 공개 후 2022년 TPAMI 44권 3호 게재)는 바로 이 이질적인 데이터셋들을 하나의 모델로 녹여 낸 전환점이었다.

실제로 MiDaS가 끌어모은 데이터는 웹 스테레오 영상(ReDWeb), 인터넷 관광 사진의 SfM 재구성(MegaDepth), 3D 영화에서 추출한 disparity(3D Movies) 등 스케일도 다르고 원점 시프트(shift)도 제멋대로인 자료들이었다. 이를 그대로 섞어 학습하면 데이터셋마다 손실 함수의 기준이 충돌해 학습이 망가진다.

Ranftl 팀의 해법은 **affine-invariant loss**였다. 손실을 계산하기 직전, 이미지마다 예측 깊이 맵과 정답 깊이 맵에서 각각 중앙값을 빼서 시프트를 지우고, 중앙값으로부터의 절대편차 평균으로 나누어 스케일까지 지워 버린 뒤 오차를 재는 방식이다. 이 정규화 덕분에 서로 다른 단위의 데이터셋을 거리낌 없이 섞어 학습할 수 있었고, 그 대가로 네트워크는 절대 미터가 아닌 상대적인 앞뒤 깊이(relative depth)를 배우게 됐다.

결과는 인상적이었다. MiDaS는 초기 버전부터 학습에 한 번도 넣지 않은 NYU나 KITTI에서도 곧바로 뛰어난 성능을 보이며 zero-shot cross-dataset transfer를 입증했고, 이후 연구팀은 버전을 거듭하며 학습 데이터셋을 최대 12개까지 불렸다. 2021년에는 Ranftl 팀이 ViT(Vision Transformer) 기반의 [DPT(Dense Prediction Transformer)](https://arxiv.org/abs/2103.13413)를 발표해 MiDaS v3부터 기본 backbone을 CNN에서 Transformer로 교체했고, v3.1(2022)에서는 다양한 최신 Transformer backbone으로 선택지를 넓혔다.

> 🔗 **차용.** 뒤이어 등장한 Depth Anything 역시 DINOv2로 사전 학습한 ViT encoder 위에 바로 이 MiDaS 계보의 DPT decoder를 얹어 구조를 짰다.

## 14.4 Depth Anything — 데이터 규모 확대

2024년 1월 홍콩대(HKU)와 TikTok의 Lihe Yang 등이 내놓은 **Depth Anything**([Yang et al. 2024](https://arxiv.org/abs/2401.10891))은 데이터 규모를 한 차원 더 끌어올리며 범용 단안 깊이의 새 기준을 세웠다. 이들은 6개 공개 데이터셋의 레이블 이미지 150만 장에 더해, 8개 대규모 데이터셋에서 모은 레이블 없는(unlabeled) 이미지 6,200만 장을 학습에 쏟아부었다. 먼저 레이블 데이터로 학습한 교사 모델이 6,200만 장의 일반 이미지에 가짜 정답(pseudo-label)을 붙이면, 학생 모델은 강하게 증강된 영상으로 이를 따라 배웠다. 동시에 사전 학습된 DINOv2 encoder의 semantic 특징 공간과 정렬하는 보조 손실을 더해 기하와 의미 정보를 함께 붙잡았다. ViT-S(24.8M), ViT-B(97.5M), ViT-L(335.3M) 세 규모로 공개된 Depth Anything은 KITTI, NYUv2, Sintel, DDAD, ETH3D, DIODE 등 6개 zero-shot relative depth 벤치마크에서 MiDaS v3.1을 일제히 앞섰다.

같은 해 여름 공개된 [Depth Anything v2](https://arxiv.org/abs/2406.09414)는 한 걸음 더 대담한 전략을 취했다. 실제 데이터셋의 센서 깊이에는 잡음과 누락이 끼고 유리·반사면이 망가지기 때문에, 아예 Virtual KITTI 2와 Hypersim 같은 100% 정밀한 **합성 데이터**만으로 교사 모델을 학습시킨 뒤, 그 교사가 실제 영상에 달아 준 깔끔한 pseudo-label로 학생 모델을 훈련했다. 그 덕분에 v2는 v1보다 훨씬 날카로운 물체 경계와 머리카락·전선 같은 얇은 구조를 잡아냈다.

한편 상대 깊이만으로는 부족한 로보틱스와 SLAM의 요구에 맞춰 절대 미터(metric) 깊이를 되찾으려는 노력도 병행됐다. [ZoeDepth(Shariq Farooq Bhat et al. 2023)](https://arxiv.org/abs/2302.12288)는 MiDaS류 상대 깊이 backbone 위에 실내·실외 도메인을 자동 판별해 연결하는 metric-bin head를 얹었고, [Depth Anything v2(2024)](https://arxiv.org/abs/2406.09414) 역시 사전 학습 backbone을 metric 데이터로 따로 fine-tuning한 모델을 함께 공개했다. 또 [Metric3D v2(2024)](https://arxiv.org/abs/2404.15506)는 카메라마다 초점거리가 달라 생기는 크기 착시를 없애기 위해, 입력 영상을 가상의 표준 카메라 공간(canonical camera space)으로 변환해 깊이를 추론한 뒤 다시 원래 카메라 파라미터로 되돌렸다. 이 기법으로 도메인 간 metric 일관성을 높였다.

## 14.5 SLAM에서 쓰기

2017년 CNN-SLAM 무렵부터 연구자들은 이렇게 똑똑해진 단안 깊이 모델을 SLAM 파이프라인에 직접 꽂아 넣기 시작했다. 학습된 깊이가 가장 즉각적으로 빛을 발하는 순간은 단안 SLAM의 **초기화**다. 순수 기하적 단안 SLAM은 카메라가 충분히 옆으로 움직여 삼각측량할 baseline이 확보될 때까지 지도를 띄우지 못하고 scale도 정할 수 없다. 반면 첫 프레임부터 단안 깊이 모델의 예측을 prior로 쥐여 주면 지도를 즉시 세울 수 있고, metric depth 모델이거나 스케일이 보정된 모델이라면 미터 단위의 초기 규모까지 곧바로 잡을 수 있다. 2021년 발표된 [Teed와 Deng의 DROID-SLAM](https://arxiv.org/abs/2108.10869)(반복적 optical flow 갱신과 미분 가능한 BA를 결합한 시스템) 기반 후속 연구들도 초기 기하 설정에 단안 깊이 prior를 결합하는 방식을 적극 실험했다.

학습된 깊이는 주행 중 쌓이는 **scale drift 억제**에도 요긴하다. 단안 visual odometry는 거리가 길어질수록 지도의 축척이 서서히 줄거나 늘어나는 drift를 피하기 어려운데, metric으로 보정된 단안 깊이 예측을 주기적인 스케일 닻(anchor)으로 삼으면 drift를 붙잡을 수 있다(물론 MiDaS 같은 relative depth 모델만 단독으로 쓸 때는 여전히 외부 metric 기준이 필요하다).

> 📜 **예언 vs 실제.** Eigen은 2014년 논문 말미에서 표면 법선(surface normal) 같은 다른 3차원 기하 단서를 함께 예측하는 방향을 다음 과제로 꼽았다. 그 예언은 이듬해 Eigen과 Fergus가 depth, surface normal, semantic label을 단일 multi-scale CNN으로 동시에 예측한 [ICCV 2015 논문](https://arxiv.org/abs/1411.4734)으로 곧바로 실현됐고, 이후 depth와 scene parsing을 엮은 [PAD-Net](https://arxiv.org/abs/1805.04409)(CVPR 2018) 같은 다중 작업(multi-task) 학습 흐름으로 이어졌다.

## 아직 열린 문제

**반사·투명 표면의 depth.** 유리창, 물웅덩이, 번들거리는 금속 표면에서는 카메라에 맺힌 상이 표면 자체가 아니라 그 너머나 반사된 풍경을 비추기 때문에 기하와 외관 단서가 정면으로 충돌한다. Depth Anything v2가 합성 데이터로 이 공백을 메우려 했고(§14.4), 로봇 파지를 겨냥한 [ClearGrasp(Sajjan et al. 2020)](https://arxiv.org/abs/1910.02550)처럼 특정 환경에 맞춘 해법도 나왔지만, 일상 속 투명·반사 물체를 완벽히 풀어내는 일은 여전히 까다롭다.

**동적 장면에서 카메라 운동과 물체 운동의 분리.** 자동차와 보행자가 뒤섞여 움직이는 거리에서는 정적인 장면을 전제로 한 photometric consistency가 깨진다. self-supervised 기법들은 주로 움직이는 객체를 마스킹해 학습에서 제외하는 소극적 방식을 택했고, [Ranjan 등(2019)](https://arxiv.org/abs/1805.09806)처럼 카메라의 자체 운동(ego-motion)과 개별 물체의 운동, 그리고 깊이를 한꺼번에 풀어내려는 시도도 있었으나 복잡한 실제 도심 장면을 깔끔히 분해하기까지는 아직 갈 길이 남았다.

**Metric scale의 일반화.** ZoeDepth나 Depth Anything v2의 metric 모델은 레이블 학습 분포에 기대고, Metric3D v2는 카메라의 초점거리(intrinsic) 입력을 전제로 스케일을 맞춘다. 하지만 메타데이터조차 없는 인터넷 영상이나 CCTV 기록처럼 카메라 내장 파라미터를 전혀 모르는 상황도 허다하다. 최근 [UniDepth](https://arxiv.org/abs/2403.18913)(Piccinelli et al., CVPR 2024)와 Apple의 [Depth Pro](https://arxiv.org/abs/2410.02073)(Bochkovskii et al., ICLR 2025)가 내장 파라미터 없이 사진 한 장만으로 metric depth를 낸다고 발표했으나, UniDepth 저자들 스스로도 ETH3D나 IBims-1 같은 데이터셋에서는 여전히 장면 스케일을 놓치는 경우가 있다고 시인했다.

---

신경망이 사진 한 장에서 조밀한 깊이 맵까지 읽어 내기 시작하자, 연구자들의 상상력은 자연스럽게 한 걸음 더 나아갔다. 깊이뿐 아니라 카메라의 위치와 움직임, 나아가 SLAM의 최적화 과정 전체를 아예 하나의 신경망으로 종단간(end-to-end) 학습해 버리면 어떨까? 실제로 2015년 케임브리지에서 발표된 [PoseNet](https://arxiv.org/abs/1505.07427)은 특징점 추출도, 기하학적 최적화도 모두 건너뛴 채 이미지 한 장에서 곧바로 6-DoF 카메라 자세를 출력하는 대담한 실험을 시작했다. 다음 장에서는 그 종단간 학습의 도전과 한계를 살펴본다(→ 15장).

# 15장 종단간 학습: PoseNet에서 SfMLearner까지

단안 깊이 예측이 CNN의 날개를 달고 날아오르던 바로 그 시기인 2015년부터 2018년 사이, 한 무리의 연구자들은 훨씬 더 급진적인 질문을 던졌다. 특징점을 뽑고, 매칭하고, RANSAC을 돌리고, 비선형 최적화를 푸는 복잡한 SLAM 파이프라인을 전부 치워 버리고, 입력 영상에서 카메라 자세까지 단 하나의 신경망으로 종단간(end-to-end) 학습할 수는 없을까?

2015년 케임브리지 대학교 박사과정생 Alex Kendall이 그 첫 포문을 열었다. Roberto Cipolla의 지도를 받던 Kendall은 ImageNet과 Places 데이터셋으로 사전 학습된 GoogLeNet을 가져와, 케임브리지 시내를 걸으며 찍은 영상과 SfM으로 만든 자세 레이블로 미세 조정(fine-tuning)했다. 그렇게 사진 한 장을 넣으면 곧바로 6-DoF 카메라 자세를 뱉어 내는 신경망 [Kendall et al. 2015. PoseNet](https://doi.org/10.1109/ICCV.2015.336)이 산티아고에서 열린 ICCV 2015에 등장했다. 이후 몇 년간 특징 추출, 매칭, 최적화, 심지어 지도 관리까지 통째로 CNN이나 RNN 안에 밀어 넣으려는 야심 찬 논문들이 봇물처럼 쏟아졌다.

---

## 15.1 PoseNet

[AlexNet(Krizhevsky et al. 2012)](https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks)의 대성공 이후, 이미지 분류로 훈련된 깊은 CNN이 단순한 텍스처를 넘어 고수준 시각 표현을 포착한다는 사실이 상식이 됐다. Kendall은 바로 그 분류망의 표현력을 기하학적 카메라 자세 추정으로 옮겨 심었다.

연구팀은 King's College, Street, Old Hospital, Shop Façade, St Mary's Church 등 케임브리지 시내 야외 풍경을 직접 촬영해 Cambridge Landmarks 데이터셋을 구축했다. 여기서 PoseNet은 특징점 추출이나 RANSAC, 3D 지도 조회 없이 프레임당 약 5 ms 만에 자세를 내놓으며, 장면에 따라 1.5~3.7 m의 위치 오차와 5~8.5° 수준의 방향 오차를 기록했다(원 논문 §5).

뒤이어 오차를 줄이고 불확실성 추정을 더하려는 변주들이 잇따랐다. [Bayesian PoseNet(Kendall & Cipolla 2016)](https://arxiv.org/abs/1509.05909)은 Monte Carlo Dropout을 도입해 추론 때 여러 번 샘플링해 구한 분산으로 자세 불확실성을 쟀고, [Walch 등의 LSTM PoseNet](https://arxiv.org/abs/1611.07890)(arXiv 2016, ICCV 2017)은 이미지 특징 맵의 공간적 맥락을 LSTM으로 훑어 회귀 안정성을 높였다. [Kendall과 Cipolla의 2017년 후속 연구](https://arxiv.org/abs/1704.00390)에서는 위치 오차와 회전 오차 사이의 애매한 가중치 균형 대신, 3D 점을 정답 자세와 예측 자세로 각각 투영한 픽셀 차이를 직접 줄이는 재투영 손실(reprojection loss)을 제안했다.

하지만 순수한 3D 기하 기반 위치 추정과 나란히 놓아 보면 격차가 뚜렷했다. Kendall과 Cipolla가 2017년 논문 표에 직접 정리한 대로, SIFT 특징점을 3D 점군에 정합하는 [Active Search(Sattler et al. 2012)](https://www.graphics.rwth-aachen.de/media/papers/sattler_eccv12_preprint_1.pdf)는 같은 Cambridge 장면에서 0.12~0.85 m의 정밀도를 보인 반면, PoseNet 계열의 오차는 대체로 1~3 m 대에 머물렀다. 훗날 Sattler 등(2019)은 이 현상을 면밀히 분석한 끝에, 이미지 한 장에서 절대 자세를 바로 회귀하는 방식(absolute pose regression)이 실제로는 3D 기하를 복원하기보다 DenseVLAD 같은 이미지 검색 기법에 더 가깝게 동작한다고 진단했다.

> 🔗 **차용.** PoseNet의 뼈대는 [GoogLeNet(Inception, Szegedy et al., CVPR 2015)](https://arxiv.org/abs/1409.4842)이다. 마지막 분류 head를 떼어 내고 그 자리에 위치 $(x, y, z)$와 쿼터니언 네 성분을 합친 7차원 회귀 head를 붙인 구조다.

## 15.2 DeepVO

단일 이미지로 절대 위치를 찍어 내는 대신, 연속된 영상 프레임 사이의 상대 운동을 신경망으로 학습하려는 흐름도 곧바로 뒤따랐다. 2017년 ICRA에서 옥스퍼드 대학의 Sen Wang 등은 [Wang et al. 2017. DeepVO](https://arxiv.org/abs/1709.08429)를 발표했다. DeepVO는 FlowNet에서 빌려 온 CNN으로 연속한 두 프레임 사이의 optical flow 특징을 뽑은 뒤, 이를 LSTM 순환 신경망에 통과시켜 시간적 맥락을 통합하고 곧바로 6-DoF 상대 움직임을 출력하는 RCNN 구조였다.

KITTI 시퀀스 00, 02, 08, 09로 학습하고 03–07과 10에서 시험한 결과, DeepVO는 스테레오 기반 고전 기법인 VISO2-S보다는 오차가 컸지만 단안 고전 기법인 VISO2-M보다는 대체로 나은 궤적을 그렸다(고속 주행 구간의 이동 오차만 VISO2-M보다 조금 컸다). 그러나 데이터 분포를 벗어나는 순간의 취약성도 적나라하게 드러났다. 시퀀스 00–10 전체로 학습한 모델에서조차 시퀀스 12의 위치 오차가 크게 치솟았는데, 저자들은 학습 데이터 가운데 시속 60 km를 넘긴 구간이 시퀀스 01 하나뿐이었던 반면 시퀀스 12는 시속 50 km에서 약 90 km까지 달렸기 때문이라고 짚었다.

같은 해 CVPR에 등장한 UC 버클리 Tinghui Zhou(Google 인턴 기간 연구)의 [Zhou et al. 2017. SfMLearner](https://arxiv.org/abs/1704.07813)는 한 발 더 나아가 정답 자세 레이블마저 없앴다. 카메라 움직임(ego-motion)을 예측하는 망과 깊이를 예측하는 망을 나란히 세워 두고, 예측한 깊이와 상대 자세로 이웃 프레임을 현재 프레임 시점에 투영(warping)했을 때 실제 이미지와 밝기가 얼마나 일치하는지(photometric reprojection loss)를 자기지도 학습 신호로 삼았다. KITTI 시퀀스 09와 10을 5프레임짜리 짧은 조각으로 잘라 평가했을 때, SfMLearner는 똑같이 5프레임만 본 단기 ORB-SLAM(short)보다 작은 오차를 냈다. 물론 시퀀스 전체를 훑으며 loop closure와 재위치 추정까지 동원하는 ORB-SLAM(full)의 전역 정밀도에는 미치지 못했다.

> 🔗 **차용.** DeepVO는 KITTI의 GPS/IMU 실측치를 정답 레이블로 삼고, 프레임 간 움직임 특징 추출 설계를 [FlowNet(Dosovitskiy et al. 2015)](https://arxiv.org/abs/1504.06852)의 optical flow CNN에서 그대로 가져왔다.

> 🔗 **차용.** SfMLearner와 [DSO(Engel et al. 2018)](https://arxiv.org/abs/1607.02565)는 기하학적으로 대응시킨 영상 간 밝기 차이를 줄인다는 동일한 원리 위에 서 있다. 다만 DSO가 그 밝기 차이로 매 순간 카메라 자세와 점 깊이를 직접 최적화하는 반면, SfMLearner는 같은 잔차를 손실 함수 삼아 깊이와 운동을 예측하는 신경망의 가중치를 학습시킨다는 점이 달랐다.

## 15.3 기하 제약, 일반화, 불확실성

2019–2020년 무렵 종단간 학습 열풍을 되돌아본 연구자들 앞에는 세 가지 구조적 한계가 뚜렷이 드러나 있었다(앞서 언급한 [Sattler et al.(2019)](https://arxiv.org/abs/1903.07504)의 분석은 단일 이미지 절대 자세 회귀를 정조준했으며, 연속 영상의 상대 운동을 배우는 learned odometry에 그대로 대입할 수는 없지만, 두 진영 모두 다음 근본 질문을 피해 가지 못했다).

**기하 제약(inductive bias)의 부재.** 고전 SLAM은 epipolar 제약, 강체 운동(rigid body motion), 투영 불변성 같은 물리·기하 법칙을 수식과 알고리즘 뼈대에 직접 새겨 넣었다. 반면 순수 CNN 회귀 망은 그 모든 3D 기하 법칙을 오직 데이터만으로 밑바닥부터 다시 배워야 했다. 게다가 ImageNet 분류로 사전 학습된 표현은 본래 3차원 거리 감각과는 동떨어져 있어서, 설령 망이 자세를 꽤 잘 맞히더라도 3D 기하 구조를 이해한 결과인지 아니면 특정 조명·색감·질감 조합을 외워 버린 것인지 가려내기 어려웠다.

**학습 분포 밖 일반화의 어려움.** PoseNet의 좌표 출력은 태생적으로 학습한 특정 도시·건물의 좌표계에 묶여 있다. 상대 운동만 출력하는 learned odometry 역시 카메라 렌즈(초점거리), 주행 속도, 환경이 달라지면 성능이 흔들려 새로 검증해야 했다. CoRL 2020의 [TartanVO](https://proceedings.mlr.press/v155/wang21h.html)가 카메라 내장 파라미터를 입력으로 넣어 데이터셋 간 일반화를 핵심 과제로 끌어올린 것도 이 때문이었다(물론 특징점 검출이나 조명이 크게 바뀌면 고전 ORB-SLAM 역시 추적을 잃기는 마찬가지다).

**검증하기 어려운 불확실성 추정.** 자율주행 경로 계획이나 장애물 회피 시스템에 위치를 넘기려면, 추정값과 함께 그 값이 얼마나 믿을 만한지 알려 주는 불확실성 정보가 필수적이다. EKF가 공분산을 전파하고 factor graph가 추정치 주변의 정보 행렬을 뽑아내듯(물론 이 역시 선형화 근사에 의존하지만), Bayesian PoseNet은 dropout으로 불확실성을 쟀고 원 논문에서는 이를 위치 오차 가늠과 학습 장면 내외부 판별에 활용했다. 그러나 신경망이 뱉어 내는 분산 값이 학습 분포를 벗어난(out-of-distribution) 낯선 입력에서도 실제 기하적 오차에 비례하도록 보정(calibration)되는지는 별도의 까다로운 검증 문제로 남았다.

## 15.4 그 뒤

흥미롭게도 이 시기의 선구적 시도들은 이후 전혀 다른 영역으로 뻗어 나가며 큰 유산을 남겼다. Kendall은 2017년 케임브리지에서 박사학위를 마친 뒤 그해 자율주행 스타트업 Wayve를 창업했고, 이후 [그의 연구 행보](https://alexgkendall.com/)는 end-to-end 자율주행 모방 학습과 대규모 주행 월드 모델(GAIA-1)로 이어졌다.

SLAM 본진 안에서는 순수 회귀 대신 학습과 기하를 섞는 절충안이 두각을 나타냈다. 2017년 뮌헨 공대(TUM)의 Tateno, Tombari, Laina, Navab가 내놓은 [CNN-SLAM](https://arxiv.org/abs/1704.03489)은 CNN이 예측한 조밀한 깊이를 direct monocular SLAM의 깊이 측정과 융합했다. CNN-SLAM은 기하로 깊이를 잡기 힘든, 텍스처가 적은 벽면에서는 신경망 예측에 기대고 기하가 뚜렷한 곳에서는 SLAM 측정을 우선하며 단안 스케일까지 복원해 냈다(TUM RGB-D와 ICL-NUIM에서 검증). SfMLearner가 닦은 photometric self-supervision 기법은 MonoDepth2(Godard et al., ICCV 2019) 등 단안 깊이 추정 연구의 표준 학습 틀이 되었고, DeepVO와 같은 옥스퍼드 그룹에서 나온 [VINet(Clark et al., AAAI 2017)](https://arxiv.org/abs/1701.08376)은 LSTM으로 영상과 IMU를 함께 묶어 종단간 VIO의 가능성을 시험했다. 한편 2021년 등장한 DROID-SLAM(Teed & Deng, NeurIPS 2021)은 미분 가능한 기하 최적화 구조를 유지하되 정답 자세와 깊이로 계산한 optical flow를 지도 학습 신호로 삼아 전혀 다른 돌파구를 열었다.

> 📜 **예언 vs 실제.** Zhou 등(2017)은 SfMLearner 논문 맺음말에서 장면 내 동적 물체와 가림(occlusion)을 명시적으로 모델링하지 못한 점, 카메라 내부 파라미터를 미리 알아야 하는 점, 그리고 단일 depth map이 복잡한 3D 장면을 지나치게 단순화한다는 점을 한계로 짚었다. 이 가운데 동적 물체 문제는 이듬해 정적 영역과 동적 영역을 갈라 깊이·optical flow·카메라 운동을 함께 학습한 [GeoNet(Yin & Shi 2018)](https://arxiv.org/abs/1803.02276) 같은 후속 self-supervised 연구들이 곧바로 이어받아 일부 해결책을 내놓았다.

> 📜 **예언 vs 실제.** Kendall 등(2015) 역시 PoseNet 논문에서 다중 시점 기하 기반 학습 데이터 확충, 확률적 불확실성 모델링, 단일 모델이 외울 수 있는 장면 규모의 확장을 후속 과제로 제시했다. 곧이어 Bayesian PoseNet(2016)이 확률적 불확실성 추정을 구현하며 한 조각을 채웠지만, 절대 자세 회귀 자체의 정밀도와 새로운 장면으로의 일반화 한계는 그 뒤로도 오래 풀리지 않는 숙제로 남았다.

## 15.5 기하와 학습의 분담

2020년을 전후해 SLAM 연구의 큰 흐름은 일종의 역할 분담으로 수렴하기 시작했다. 억지로 신경망에 3차원 강체 변환과 투영 기하까지 다 외우게 하는 대신, 확실히 알고 있는 기하 계산과 비선형 최적화는 알고리즘에 맡기고, 신경망이 텍스처 없는 영역의 깊이 사전 지식이나 까다로운 영상 대응을 읽어 내는 데 집중하도록 하는 전략이다.

CodeSLAM과 DROID-SLAM은 바로 이 분업 철학 위에서 태어났다. 둘 다 PoseNet처럼 이미지에서 곧바로 자세 숫자를 회귀하지 않는다. 대신 영상 사이의 대응 관계와 잠재 표현을 신경망이 공급하면, 그 위에 기하 제약을 걸어 자세를 푸는 최적화 엔진이 실제 추정치를 도출한다.

물론 어느 쪽이 절대적으로 우월하다고만 단정할 수는 없었다. PoseNet은 SIFT 기반 기하 정합이 대응점을 찾지 못해 주저앉는 극단적인 시점 차이나 해 질 녘·비·안개·밤·motion blur 속에서도 어떻게든 근사 자세를 내놓았다는 장점이 있었다. 하지만 Sattler 등(2019)이 확인했듯 정밀한 3차원 위치 추정에서는 기하 구조 기반 방법을 따라잡기 어려웠고, 결국 고전 기하 최적화의 뼈대 위에 학습된 지각 모듈을 끼워 넣는 하이브리드 설계가 주류로 올라섰다.

> 🔗 **차용.** CodeSLAM(Bloesch et al., CVPR 2018)과 DROID-SLAM(Teed & Deng, NeurIPS 2021)이 공유하는 핵심 전략은 최적화 엔진의 보존이다. 둘 다 bundle adjustment나 비선형 최적화 틀을 버리지 않고 그대로 둔 채, 학습된 신경망에게 CodeSLAM에서는 저차원 depth 표현을, DROID-SLAM에서는 조밀한 대응점과 반복 갱신 방향을 맡겼다.

---

## 아직 열린 문제

**어떤 기하 제약을 어디에 넣을지.** 기하 계산을 알고리즘으로 푼다고 하더라도, rigid body motion이나 epipolar constraint 같은 제약을 아키텍처의 어느 층위에서 얼마나 강하게 코드로 강제할지에는 아직 정해진 답이 없다. 최근 3DGS 기반 SLAM 시스템들은 미분 가능한 렌더링과 기하 표현 자체를 학습·최적화 루프 안에 직접 녹여 넣는 새로운 배합을 시험하고 있다.

**Learned uncertainty의 calibration.** Bayesian PoseNet 이후에도 딥러닝 모델이 출력하는 불확실성 추정치가 실제 위치 오차의 크기와 일관되게 맞물리는지, 특히 훈련 때 한 번도 본 적 없는 낯선 환경에서도 믿고 쓸 수 있는지 보증하는 일은 여전히 난제로 남아 있다.

**End-to-end의 범위.** 2015년 PoseNet이 말하던 end-to-end는 이미지 한 장에서 곧장 자세를 뽑아내는 단일 블랙박스 회귀였다. 그러나 대규모 foundation model과 미분 가능한 최적화 계층이 공존하는 2023년 이후에는 SLAM의 어느 모듈까지를 학습으로 대체하고 어느 뼈대를 해석적 알고리즘으로 남길지, 그 경계선이 새롭게 그어지고 있다.

---

순수 종단간 회귀가 기하 일반화의 벽에 부딪히자, 결국 학습과 기하를 결합하는 새로운 설계가 등장했다. 2018년 Imperial College London의 Dyson Robotics Lab에서 나온 CodeSLAM은 VAE로 배운 저차원 잠재 공간 안에 조밀한 깊이를 압축해 확률적 최적화에 태웠고, 몇 년 뒤 프린스턴에서 나온 DROID-SLAM은 미분 가능한 Dense Bundle Adjustment를 신경망 반복 루프 안에 통째로 집어넣었다. 다음 장에서는 기하학과 딥러닝이 본격적으로 손을 맞잡은 이 하이브리드 시대의 계보를 따라간다(→ 16장).

---

# 16장 학습과 기하의 결합: CodeSLAM에서 DROID-SLAM까지

PoseNet과 SfMLearner가 신경망 하나로 SLAM의 여러 단계를 통째로 대신하려던 사이, 런던 임페리얼 칼리지의 Andrew Davison 연구실에서는 다른 질문을 던졌다. 기하 최적화의 틀을 버리는 대신, 그 안에 딥러닝이 배운 압축 표현을 집어넣으면 어떨까. 2018년 CVPR에 나온 CodeSLAM이 그 답이었다. 발표자 Michael Bloesch는 당시 Imperial College London Dyson Robotics Lab의 Dyson Research Fellow로 Davison 그룹에 몸담고 있었고, 그곳은 2011년 Richard Newcombe가 DTAM을 내놓은 바로 그 연구실이었다.

---

## 16.1 CodeSLAM — latent code와 지도

CodeSLAM 이전의 단안 SLAM은 깊이를 직접 최적화 변수로 잡았다. sparse landmark 수백 개를 추적하든 [DTAM](https://www.doc.ic.ac.uk/~ajd/Publications/newcombe_etal_iccv2011.pdf)(Newcombe et al. 2011)처럼 모든 픽셀을 밀집(dense)하게 다루든 마찬가지였다. 특히 dense 방식에서는 변수 개수가 해상도를 그대로 따라갔다. 640×480 keyframe 한 장만 해도 독립 변수가 307,200개에 달하니 최적화가 무겁고 초기값에 민감했으며, 장면에 관한 사전 지식(prior)을 넣기도 까다로웠다.

[Bloesch et al. 2018. CodeSLAM](https://doi.org/10.1109/CVPR.2018.00271)은 이 병목을 표현의 차원을 낮추는 방식으로 풀었다. 픽셀마다 깊이를 따로 최적화하는 대신, depth map을 생성하는 저차원 잠재 벡터(**latent code**)를 변수로 삼은 것이다. 이미지를 조건으로 받는 variational autoencoder(VAE)를 학습시켜 두면, 잠재 공간 안의 점 하나가 그럴듯한 depth map 하나에 대응한다. 덕분에 keyframe당 변수 수는 수십만 개에서 단 128개로 줄었고, 최적화도 이 저차원 공간 안에서만 움직인다.

실제 추론에서는 keyframe마다 U-Net으로 뽑은 이미지 feature와 latent code **z**를 decoder에 넣어 dense depth map을 복원한다. **z**는 0에서, 카메라 자세는 단위 행렬(identity)에서 출발해 두 변수를 함께 최적화하며, 시야가 겹치는 두 프레임 사이의 밝기 차이(photometric residual)와 깊이 차이(geometric residual)를 동시에 줄여 나간다.

두 오차를 합친 목적함수는 다음과 같다.

$$E(\mathbf{z}, T) = \sum_{(A,B)} \Bigl[ L_p\bigl(I_A[u] - I_B[w(u, \mathbf{z}_A, T_A^B)]\bigr) + L_g\bigl(D_A[u] - D_B[w(u, \mathbf{z}_A, T_A^B)]\bigr) \Bigr]$$

여기서 $I$는 영상, $D$는 decoder가 이미지와 code로 만든 depth, $T_A^B$는 두 keyframe 사이의 상대 자세다. $w$는 keyframe $A$의 픽셀 $u$를 $B$의 영상 평면으로 옮기는 warping 연산으로, code $\mathbf{z}_A$로 복원한 깊이와 $T_A^B$를 이용한다. $L_p$와 $L_g$는 Huber 가중치를 적용해 잘못된 대응이나 가려진 픽셀, 심하게 기운 표면의 영향을 누그러뜨리는 손실 함수다. 원 논문은 식 (13)과 (14)에서 두 residual을 따로 정의하지만, 위 식은 둘을 나란히 묶어 쓴 형태다. CodeSLAM 논문 자체에는 code에 거는 별도 prior 항이 없었고, code를 0 근처로 묶어 두는 zero-code prior factor는 뒤이어 나온 DeepFactors(16.2)에서 들어왔다.

변수를 128개로 압축한 덕분에 CodeSLAM은 적은 자유도만으로 dense depth를 추정할 수 있었다. 속도는 keyframe 4개 구성에서 지도 갱신 5 Hz 수준이었는데, 저자들은 keyframe을 너무 자주 추가하지 않으면 실시간 운용이 가능하다고 보았고 TensorFlow로 짠 image warping의 속도를 끌어올리는 일은 후속 과제로 남겼다.

> 📜 **예언 vs 실제.** CodeSLAM 논문은 이 구성 요소로 완전한 실시간 keyframe 기반 SLAM을 만들고, 실제 영상으로도 학습하겠다고 맺었다. 같은 Imperial 그룹은 2020년 DeepFactors를 실시간 시스템으로 내놓았다.

> 🔗 **차용.** CodeSLAM의 latent depth 표현은 [Kingma & Welling 2013. VAE](https://arxiv.org/abs/1312.6114)의 encoder-decoder 잠재 공간 구조를 썼다. 학습은 VAE 방식을 따르지만, SLAM에 투입할 때는 sampling을 하지 않고 **z**를 직접 최적화 변수로 다룬다.

## 16.2 DeepFactors — factor graph 통합

2년 뒤인 2020년, Davison의 박사과정 학생 Jan Czarnowski는 [Czarnowski et al. 2020. DeepFactors](https://doi.org/10.1109/LRA.2020.2965415)를 IEEE RA-L에 발표했다. DeepFactors는 CodeSLAM이 제안한 latent depth 표현과 결합 최적화를 본격적인 factor graph 체계로 옮겨 심은 시스템이다. tracking과 mapping 스레드를 분리하고 keyframe 삽입 기준을 세우자 실시간성이 살아났다. NVIDIA GTX 1080 한 장에서 새 프레임을 최신 keyframe에 정합하는 tracking은 약 250 Hz로 돌아갔다. 반면 새 keyframe을 추가할 때마다 신경망으로 초기 code와 Jacobian을 계산하는 데는 약 340 ms가 걸렸는데, 정작 forward pass는 16 ms에 불과했고 나머지 시간은 대부분 TensorFlow에서 Jacobian을 구하는 데 쓰였다. 저자들은 탐색하듯 움직이는 환경에서 실시간 동작을 확인했으며, 이때는 대체로 photometric 오차와 재투영 오차만 켠 채 운용했다고 적었다.

비슷한 시기 뮌헨 공과대학(TU Munich)의 Daniel Cremers 그룹도 2016년에 내놓은 direct sparse odometry([DSO](https://arxiv.org/abs/1607.02565))에 신경망 예측을 접목하기 시작했다. 출발점은 [Yang, Wang, Stückler, Cremers 2018. DVSO](https://arxiv.org/abs/1807.02570)로, 신경망이 예측한 깊이를 단안 DSO에 "가상 stereo" 관측처럼 넣어 주었다. 이어진 [Yang, von Stumberg, Wang, Cremers 2020. D3VO](https://arxiv.org/abs/2003.01060)는 자기지도 학습으로 얻은 깊이·자세·불확실성 예측까지 DSO 최적화의 factor로 합쳤고, [Wimbauer et al. 2021. MonoRec](https://arxiv.org/abs/2011.11814)과 [Wimbauer et al. 2023. Behind the Scenes](https://arxiv.org/abs/2301.07668)는 이 계보를 동적 장면의 dense 재구성과 단일 영상 기반 density field 추정으로까지 넓혔다. Imperial과 TUM은 각자 독자적인 경로를 걸었지만, 신경망 예측을 기존 최적화 프레임워크 안에 factor로 녹여 넣는다는 점에서는 같은 방향을 보고 있었다. 2021년 Princeton에서 등장한 DROID-SLAM 역시 이 흐름 위에서 탄생했다.

> 🔗 **차용.** DeepFactors의 mapping은 Dellaert 연구실의 factor graph 라이브러리 [GTSAM](https://gtsam.org/tutorials/intro.html)과 증분 최적화 알고리즘 iSAM2(Kaess et al.) 위에서 돌아간다. CodeSLAM이 한데 묶어 최적화하던 자세와 latent code를 Czarnowski는 factor graph의 변수 노드로 다시 세웠다. VAE 학습 과정에서 code가 평균 0인 Gaussian 근처로 모이는 성질 덕분에, 최적화에서도 zero-code prior factor를 두어 code를 그 근처에 붙들어 둔다.

## 16.3 RAFT — recurrent optical flow

DROID-SLAM의 직접적인 출발점은 SLAM이 아니라 optical flow 논문이었다. Zachary Teed와 Jia Deng(Princeton)이 2020년 ECCV에 발표한 [Recurrent All-Pairs Field Transforms(RAFT)](https://arxiv.org/abs/2003.12039)는 두 영상 사이의 픽셀 움직임을 추정하는 네트워크로, 크게 세 단계로 나뉜다.

1. Feature encoder: CNN이 두 이미지에서 feature map을 추출한다.
2. Correlation volume: 모든 픽셀 쌍 사이의 유사도로 4-level pyramid의 4D volume을 만든다.
3. Update operator: Gated Recurrent Unit(GRU)이 correlation volume을 lookup하며 flow field를 반복해서 고친다.

이름에 붙은 all-pairs는 두 이미지의 모든 픽셀 쌍 사이의 유사도를 미리 계산해 둔다는 뜻이다. PWC-Net 같은 기존 coarse-to-fine 방식이 해상도를 단계적으로 바꿔 가며 flow를 추정했다면, RAFT는 flow field를 원영상 가로·세로의 1/8 해상도 하나로 고정해 둔 채 correlation pyramid를 조회하며 반복적으로 값을 다듬고 마지막에만 upsampling한다. 이 단순하면서도 집요한 반복 구조 덕분에 RAFT는 KITTI의 F1-all 오류를 당시 최고 기록(6.10%)보다 16% 낮춘 5.10%로 끌어내렸고, Sintel final pass의 endpoint error도 30% 줄였다.

Teed와 Deng은 바로 이 반복 갱신 아이디어를 SLAM으로 가져왔다. 두 프레임 사이의 optical flow를 고치던 GRU 루프가 여러 프레임의 카메라 자세와 깊이를 함께 고치는 루프로 확장되었고, 각 반복의 기하 계산은 미분 가능한 Dense Bundle Adjustment(DBA) layer가 맡았다.

## 16.4 DROID-SLAM — update operator와 BA

2021년 NeurIPS에 발표된 [Teed & Deng. DROID-SLAM](https://arxiv.org/abs/2108.10869)에서 DROID는 "Differentiable Recurrent Optimization-Inspired Design"의 약자다. 이름 그대로 미분 가능한 최적화 루프를 신경망 구조 안에 심었다는 선언이었다.

frontend는 RAFT의 골격을 그대로 이어받는다. CNN encoder가 feature map을 뽑으면 all-pairs correlation volume을 세우고, GRU update operator가 dense flow를 반복 추정한다. 다만 두 장의 이미지에만 매달리던 RAFT와 달리, DROID-SLAM은 이 추정을 keyframe graph의 모든 edge 위에서 동시에 돌린다.

이때 backend에 해당하는 **DBA layer**가 GRU와 기하 최적화를 하나로 엮는다. GRU가 내놓은 flow 수정량과 신뢰도 가중치가 DBA에 들어가면, DBA는 이를 제약 조건 삼아 카메라 자세와 inverse depth를 Schur complement로 빠르게 푼다. 이어 DBA가 자세와 깊이를 새로 고쳐 놓으면, 그 갱신된 기하 상태가 다음 GRU 반복에서 correlation volume을 조회하는 기준점이 된다. 학습된 대응 추정과 엄밀한 3D 최적화가 매 반복마다 서로를 교정하는 셈이다.

성능 차이는 벤치마크에서 선명하게 드러났다. EuRoC 단안 실험에서 DROID-SLAM의 ATE는 ORB-SLAM3가 추적을 끝까지 유지한 10개 시퀀스만 골라 비교해도 43% 낮았고, 스테레오 입력에서는 격차가 71%까지 벌어졌다. 더 놀라운 점은 일반화였다. 학습은 합성 데이터셋 TartanAir만으로 마쳤는데도 TartanAir·EuRoC·TUM-RGBD에서 추적이 끊긴 시퀀스가 단 하나도 없었으며, 까다로운 ETH-3D RGB-D에서는 32개 시퀀스 중 30개를 완주해 차선책(19개)을 크게 앞섰다. Teed와 Deng 등이 집필한 *The SLAM Handbook* 13장은 EuRoC V1_02 시퀀스에서 global optimization이 RMSE ATE를 16.5 cm에서 1.2 cm까지 줄였다고 기록한다.

PoseNet이 기하 제약 없이 자세를 직접 회귀했다가 학습 장면을 벗어나면 무너졌던 것과 달리, DROID-SLAM은 역할을 명확히 갈랐다. 신경망은 feature 추출과 dense correspondence에만 집중하고, 기하 제약과 전역 일관성은 bundle adjustment가 책임진다.

> 🔗 **차용.** 영상의 모든 픽셀을 동원해 자세와 깊이를 동시에 추정한다는 발상은 Newcombe의 DTAM(2011)으로 거슬러 올라간다. DTAM은 tracking과 depth 추정을 번갈아 풀었고, DROID-SLAM은 신경망이 예측한 flow와 신뢰도를 입력받아 dense BA를 수행한다.

## 16.5 Imperial Dyson Robotics Lab의 연구자들

앞에서 살펴본 CodeSLAM, DeepFactors, 그리고 다음 장에서 다룰 iMAP까지, 학습과 기하를 결합한 초기 계보의 상당 부분이 한 연구실에서 나왔다. Andrew Davison은 2003년 Oxford에서 MonoSLAM을 발표한 뒤 2005년 Imperial College로 옮겨 Robot Vision Group을 꾸렸고, 2014년에는 Dyson Robotics Lab을 세워 소장을 맡았다. 이 연구실을 거쳐 간 주요 연구자와 작품은 다음과 같다.

- **Richard Newcombe** (Davison 지도, Imperial): DTAM(2011), [KinectFusion](https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/ismar2011.pdf)(2011). 이후 Oculus→Meta Reality Labs
- **Michael Bloesch** (Dyson Research Fellow, Imperial, 2017–2019): CodeSLAM(2018). 그 전에는 ETH Zurich에서 박사과정을 하며 visual-inertial odometry(ROVIO)를 연구했고, 그 뒤 DeepMind로 옮김
- **Jan Czarnowski** (Davison 지도, Imperial): DeepFactors(2020)
- **Edgar Sucar** (Davison 그룹, Imperial): [iMAP](https://arxiv.org/abs/2103.12352)(2021). neural implicit SLAM의 초기 연구
- **Tristan Laidlow** (Davison 그룹, Imperial): DeepFactors(2020) 공저

이 연구실의 궤적에는 일관된 철학이 흐른다. 확률적 추정과 불확실성 모델링을 놓지 않으면서도, 단안 sparse 지도에서 dense latent 표현으로, 다시 implicit 표현으로 지도의 그릇을 옮겨 왔다. Davison은 [FutureMapping](https://arxiv.org/abs/1803.11288)(2018)과 [FutureMapping 2](https://arxiv.org/abs/1910.14139)(2019, Ortiz 공저)에서 Spatial AI의 청사진을 제시했는데, 여러 기하·의미 표현을 하나의 확률 그래프 안으로 묶자는 구상이었다. CodeSLAM과 DeepFactors는 그 첫 실험실 무대였다.

## 16.6 2023-2025 — DROID-SLAM 이후

DROID-SLAM이 보여 준 미분 가능 DBA 구조는 2023년 이후 여러 방향으로 갈라지며 재사용됐다. 한쪽에서는 DROID-SLAM의 정밀한 tracking 위에 새로운 3D 표현 지도를 얹기 시작했다. University of Bologna의 [GO-SLAM](https://arxiv.org/abs/2309.02436)(Zhang et al., ICCV 2023)은 DROID-SLAM의 tracking에 online loop closing과 full bundle adjustment를 보태고, 지도는 Instant-NGP 스타일의 multi-resolution hash encoding 기반 neural implicit 표현으로 바꿨다. 같은 해 나온 [NICER-SLAM](https://arxiv.org/abs/2302.03594)(Zhu et al., arXiv 2023 / 3DV 2024)은 DROID-SLAM 구조를 그대로 따르지는 않았다. 다만 RGB만으로 카메라 자세와 계층적 neural implicit 지도를 함께 최적화한다는 목표를 공유하며, 단안 기하 단서와 optical flow를 추가 감독 신호로 삼았다. CMU의 [SplaTAM](https://arxiv.org/abs/2312.02126)(Keetha et al., CVPR 2024)은 아예 별개의 시스템으로, RGB-D 지도를 3D Gaussian Splatting으로 옮기고 silhouette mask 기반 differentiable rendering tracking을 새로 짰다.

Princeton 그룹 자신은 DROID-SLAM의 무거운 계산량을 덜어내는 데 집중했다. [DPV-SLAM](https://arxiv.org/abs/2408.01654)(Lipson, Teed, Deng, ECCV 2024)은 전작 [DPVO](https://github.com/princeton-vl/DPVO)(Deep Patch Visual Odometry)에 근접 기반 loop closure와 고전적 loop closure를 결합한 시스템이다. 근접 기반 loop closure는 추정한 카메라 위치가 가까운 프레임들을 이어 CUDA로 구현한 block-sparse BA로 풀고, 먼 루프는 image retrieval과 포즈 그래프 최적화로 닫는다. 그 결과 EuRoC와 TartanAir에서 DROID-SLAM과 맞먹는 정확도를 유지하면서도 EuRoC 기준 2.5배 빠르고 GPU 메모리도 5~7 GB에 그쳐 GPU 한 장으로 충분히 돌아갔다.

한편 DROID-SLAM과 별개로, 이미지 쌍에서 3D pointmap(픽셀마다 3D 좌표를 담은 지도)을 곧장 출력하는 Naver Labs Europe의 [DUSt3R](https://arxiv.org/abs/2312.14132)(Wang et al., CVPR 2024) 계열도 2024–2025년 빠르게 확장됐다. 같은 연구소의 Cabon, Revaud 등은 [Cabon et al. 2025. MUSt3R](https://arxiv.org/abs/2503.01661)에서 DUSt3R 구조를 대칭형으로 고치고 다층 memory를 붙여 쌍 단위 추론을 다중 프레임 좌표계로 넓혔으며, 오프라인 SfM과 온라인 visual SLAM을 같은 네트워크 하나로 다룰 수 있음을 보였다.

그러는 사이 DROID-SLAM의 differentiable dense BA 엔진 자체는 범용 영상 처리 파이프라인의 핵심 부품으로 자리를 잡았다. Google DeepMind 등의 [Li et al. 2025. MegaSaM](https://arxiv.org/abs/2412.04463)(CVPR 2025)은 이 DBA를 동적 물체가 뒤섞인 일상 영상에 투입하면서 초점 거리(focal length)까지 함께 최적화해 비보정 영상을 풀어냈다. NVIDIA의 [Huang et al. 2025. ViPE](https://arxiv.org/abs/2508.10934)는 한 걸음 더 나아가 DROID-SLAM의 dense flow 제약, cuVSLAM의 sparse point 추적, 단안 metric depth 네트워크 출력을 단일 dense BA에 묶어 인터넷 동영상 약 10만 개를 포함한 대규모 영상에 카메라 자세와 깊이를 달아 주었다.

> 📜 **예언 vs 실제.** DROID-SLAM은 미분 가능한 BA와 end-to-end 학습을 묶었다. 2026년 현재 학습한 frontend와 고전적 backend를 결합하는 설계는 여러 변형으로 널리 쓰이지만, 어느 조합이 범용 표준이 될지는 아직 정해지지 않았다.

---

## 아직 열린 문제

**학습한 prior의 일반화.** CodeSLAM과 DeepFactors의 VAE는 훈련 데이터의 깊이 분포를 외운다. 실외처럼 학습 분포와 동떨어진 환경에서는 오히려 learned prior가 최적화를 그릇된 방향으로 끌어당길 수 있고, DROID-SLAM의 flow estimator 역시 훈련 도메인 밖에서는 신뢰도가 흔들린다. TartanAir처럼 다양한 합성 데이터로 방어하는 전략이 쓰이지만 합성과 실제 사이의 간극(sim-to-real gap)은 여전히 남아 있다.

**실시간 제약.** DROID-SLAM 원 논문에서는 실시간 구동을 위해 RTX 3090 두 장이 필요했는데, 한 장은 tracking과 local BA, 다른 한 장은 global BA와 loop closure 용도였다. 그마저도 EuRoC에서는 해상도를 320×512로 낮추고 프레임을 건너뛰어 평균 20 fps를 냈을 뿐, 카메라 움직임이 거친 TartanAir에서는 평균 8 fps에 머물렀다. DPV-SLAM이 GPU 한 장 수준으로 문턱을 낮추긴 했으나, 모바일 로봇이나 AR/VR 기기 같은 저전력 환경에 올리기에는 여전히 계산이 무겁다.

**Loop closure.** DROID-SLAM은 카메라가 지나온 곳으로 돌아오면 frame graph에 원거리 edge를 추가해 루프를 닫는다. 이때 backend는 현재 추정한 자세와 깊이로 프레임 쌍 사이의 optical flow를 계산해 기준치 이하인 쌍만 연결하므로, drift가 작을 때만 루프가 닫힌다. Teed와 Deng 등이 *The SLAM Handbook* 13장에서 *"DROID-SLAM doesn't include any relocalization module, so large loops with lots of drift cannot be closed"*라고 짚었듯, 큰 drift가 쌓인 뒤 재위치 추정을 하기는 어렵다. DPV-SLAM이 이 자리에 image retrieval 기반 고전 loop closure를 따로 붙인 것도 그 때문이다. 학습 기반 place recognition을 이런 dense BA 구조 안에 매끄럽게 통합하는 일은 아직 숙제로 남아 있다.

---

DROID-SLAM은 keyframe마다 inverse depth map을 얹어 장면을 기록했다. 그런데 비슷한 시기, 장면을 아예 하나의 연속 함수로 통째로 학습하는 전혀 다른 길이 열리고 있었다. 2020년 등장한 [NeRF](https://arxiv.org/abs/2003.08934)(Neural Radiance Field)는 미분 가능한 렌더링으로 얻은 결과와 실제 영상의 차이를 줄이면서 장면과 카메라 자세를 함께 최적화할 가능성을 보여 주었다. 이듬해인 2021년, Imperial College의 Edgar Sucar는 이 연속 표현을 SLAM으로 끌어들여 TSDF voxel grid 대신 단 하나의 MLP(multilayer perceptron, 다층 퍼셉트론)로 방 하나를 기억하는 iMAP을 내놓았다.

# 17장 NeRF 기반 SLAM

DROID-SLAM이 학습된 신경망을 SLAM의 *tracking*에 투입해 feature와 픽셀 대응을 만들어 냈다면, 같은 Imperial College Dyson Robotics Lab의 Edgar Sucar와 동료들은 2021년 iMAP에서 학습된 연속 함수를 아예 *지도* 그 자체로 세웠다. 그 표현은 SLAM 밖의 컴퓨터 그래픽스·비전 분야, 바로 NeRF에서 가져왔다.

2020년 3월 Ben Mildenhall과 동료들이 arXiv에 공개한 [Mildenhall et al. 2020. NeRF](https://arxiv.org/abs/2003.08934)는 원래 카메라 자세가 알려진 여러 입력 영상으로 연속 volumetric scene function을 최적화해, 촬영하지 않은 새 시점의 영상을 합성(novel-view synthesis)하는 기법이었다. 2021년 ICCV에 실린 iMAP은 이 구조를 SLAM에 이식해 지도 학습과 자세 추정을 동시에 굴렸다. KinectFusion(12장)이 voxel grid로 풀던 dense mapping을, 신경망으로 짠 연속 함수 즉 implicit neural field로 다시 푼 첫 실시간 시스템이었다.

사실 좌표를 입력받아 3D 공간의 값을 내뱉는 MLP(coordinate-based MLP) 자체는 NeRF 직전인 2019년부터 3D 비전 분야에서 잇따라 시도되고 있었다. [Park et al.의 DeepSDF](https://arxiv.org/abs/1901.05103)는 공간 좌표를 넣으면 signed distance를 출력하는 MLP로 물체 표면을 암묵적으로 기술했고, [Mescheder et al.의 Occupancy Networks](https://arxiv.org/abs/1812.03828)는 같은 좌표 입력에서 점유 확률(occupancy)을 내놓았다. [Sitzmann et al.의 SRN](https://arxiv.org/abs/1906.01618)은 좌표마다 scene feature vector를 뽑아 미분 가능한 ray marching으로 이미지를 합성하는 길을 열었다. NeRF는 이 흐름 위에 volume rendering 적분과 positional encoding을 얹어 실사 수준의 시점 합성에 성공했고, iMAP 역시 DeepSDF와 Occupancy Networks를 직접적인 선행 연구로 인용한다.

---

## 17.1 NeRF: MLP 기반 공간 표현

NeRF의 핵심은 3D 공간 전체를 단 하나의 MLP 가중치에 압축해 넣는 데 있다. 3차원 공간 좌표 $(x, y, z)$와 시선 방향 $(\theta, \phi)$를 네트워크에 입력하면, 그 지점의 색상 $(r, g, b)$과 부피 밀도 $\sigma$가 나온다. 화면의 한 픽셀 색을 얻으려면 카메라 원점 $\mathbf{o}$에서 시선 방향 $\mathbf{d}$로 쏜 광선 $\mathbf{r}(t)$를 따라 다음 volume rendering 방정식을 적분한다.

$$\hat{C}(\mathbf{r}) = \int_{t_n}^{t_f} T(t)\,\sigma\!\left(\mathbf{r}(t)\right) \mathbf{c}\!\left(\mathbf{r}(t), \mathbf{d}\right)\, dt$$

여기서 $T(t) = \exp\!\left(-\int_{t_n}^{t} \sigma(\mathbf{r}(s))\, ds\right)$는 광선이 $t$ 지점까지 가로막히지 않고 도달할 확률, 곧 누적 투과율이다. 실제 구현에서는 광선 위에 여러 샘플 점을 찍어 이 연속 적분을 구간별 합으로 근사한다.

그런데 좌표를 날것 그대로 MLP에 집어넣으면 신경망이 저주파 성분만 따라가며 뭉개진 결과를 낸다. NeRF는 이 문제를 positional encoding으로 넘겼다. 입력 좌표 $(x, y, z)$를 여러 주파수의 사인·코사인 함수로 펼쳐 넣어, 네트워크가 세밀한 질감과 날카로운 경계까지 포착하도록 길을 터 준 것이다.

$$\gamma(p) = \left(\sin(2^0 \pi p),\, \cos(2^0 \pi p),\, \ldots,\, \sin(2^{L-1} \pi p),\, \cos(2^{L-1} \pi p)\right)$$

최적화는 단순하다. 자세가 알려진 실제 이미지를, 같은 시점에서 위 식을 적분해 그린 렌더링 영상과 비교하고, 픽셀 색상의 제곱 오차 합을 줄여 나간다. 수렴이 끝나면 장면의 3차원 기하와 외관이 통째로 MLP 파라미터 속에 담긴다.

다만 원판 NeRF에는 SLAM에 바로 쓸 수 없는 무거운 제약이 있었다. 장면 하나를 학습하는 데 V100 GPU 한 장으로 꼬박 1~2일이 걸렸고, 장면마다 모델을 처음부터 다시 학습해야 했으며, 카메라 자세는 이미 COLMAP 같은 SfM으로 구해 두어야 했다. 실시간 SLAM으로 만들려면 자세 추정과 지도 학습을 동시에, 그것도 초당 몇 차례 이상 돌려야 했다.

> 🔗 **차용.** volume rendering 방정식은 [Kajiya & Von Herzen(1984)](https://courses.cs.duke.edu/cps296.8/spring03/papers/RayTracingVolumeDensities.pdf)의 컴퓨터 그래픽스 논문에서 가져온 것이다. NeRF는 이 고전 적분식을 미분 가능하게 구현해, 렌더링한 색과 실제 픽셀의 차이로 MLP를 역전파 학습했다.

> 🔗 **차용.** positional encoding은 NeRF 원 논문에 이미 포함되어 있었고, 같은 해 [Tancik et al.(2020)](https://arxiv.org/abs/2006.10739)의 "Fourier Features Let Networks Learn High Frequency Functions"가 NTK(neural tangent kernel) 이론을 동원해 이 기법이 왜 고주파 디테일을 살려 내는지 수학적으로 규명했다.

---

## 17.2 iMAP: 초기 neural implicit SLAM

이 시간의 벽을 처음 뚫은 시스템은 [Sucar et al. 2021. iMAP](https://doi.org/10.1109/ICCV48922.2021.00617)이다. Imperial College Dyson Robotics Lab의 Edgar Sucar, Shikun Liu, Joseph Ortiz, Andrew Davison이 2021년 ICCV에 발표했다. **iMAP**(Implicit MAP)은 손에 든 RGB-D 카메라가 보내오는 영상으로 MLP 하나를 실시간으로 학습시키면서 동시에 카메라 자세까지 최적화했다.

실시간성을 확보하기 위해 iMAP은 하나의 MLP를 공유하는 두 개의 최적화 루프를 병렬로 돌렸다. *mapping* 루프는 MLP 가중치와 소수 keyframe의 자세를 함께 갱신했다. 라이브 시스템에서는 매 반복마다 과거 keyframe 가운데 손실 분포에 비례해 3장을 뽑고, 직전 keyframe과 현재 프레임을 더해 총 5장으로 최적화를 돌렸다. 픽셀 역시 전부를 렌더링하지 않고 이미지당 200개만 골라 오차가 큰 영역에 집중 배정했다. 한편 *tracking* 루프는 MLP 가중치를 얼려 둔 채 현재 프레임의 자세만 렌더링 손실로 맞췄다. 이렇게 연산을 쪼갠 덕분에 논문에서는 tracking 10 Hz, 전역 지도 갱신 2 Hz라는 수치를 보고했다.

학습 신호로는 색상 손실 $\mathcal{L}_{\text{color}} = \|\hat{C} - C\|_1$과 깊이 손실 $\mathcal{L}_{\text{depth}} = \|\hat{D} - D\|_1$을 함께 썼다. 이때 깊이 손실은 광선을 따라 계산한 depth 분산으로 정규화해, 물체 경계처럼 불확실성이 큰 지점의 영향력을 줄였다.

결과는 신선했다. keyframe 10~20장과 고작 1 MB 남짓한 MLP 하나로 방 한 칸의 dense 지도를 통째로 담아냈다. 다만 치명적인 약점이 하나 따라왔다. 새 구역을 학습하면 신경망 가중치 전체가 흔들리면서 앞서 배운 구역의 표현이 망가질 수 있었고, 이를 막기 위해 iMAP은 골라 둔 keyframe을 기억 저장소 삼아 반복해서 다시 학습(replay)해야 했다.

> 📜 **예언 vs 실제.** Sucar는 iMAP 논문 Conclusion에서 *"future directions for iMAP include how to make more structured and compositional representations that reason explicitly about the self similarity in scenes"*라고 적었다. iMAP이 arXiv에 올라온 지 불과 9개월 뒤(2021년 12월) 등장한 NICE-SLAM은 multi-resolution voxel feature grid로 공간을 계층적으로 쪼개 이 문제에 답했다. 2023년 Wang et al.의 Co-SLAM은 hash grid와 coordinate encoding을 결합해 한 걸음 더 나아갔다.

---

## 17.3 NICE-SLAM: 계층 격자와 scalability

iMAP이 부딪힌 단일 MLP의 확장성 한계를 정면으로 겨냥한 연구는 [Zhu et al. 2022. NICE-SLAM](https://arxiv.org/abs/2112.12130)이다. ETH Zurich의 Zihan Zhu와 Songyou Peng이 2022년 CVPR에서 내놓았다. **NICE-SLAM**(Neural Implicit Scalable Encoding for SLAM)은 공간 전체를 큰 MLP 하나에 구겨 넣는 대신, multi-resolution voxel feature grid와 아주 작은 MLP decoder를 조합했다.

구조는 직관적이다. 3D 공간을 명시적인 복셀 격자로 나눈 뒤 각 꼭짓점에 학습 가능한 feature vector를 심어 둔다. 특정 좌표를 렌더링할 때는 주변 복셀의 feature를 trilinear interpolation으로 섞어 작은 MLP에 통과시키면 색상과 점유 확률이 나온다. 기하 정보의 대부분을 공간 격자가 나눠 맡으므로 decoder MLP는 작고 가벼워도 충분하다.

NICE-SLAM은 세 단계 해상도의 격자를 겹쳐 세워 거친 윤곽부터 세밀한 형상까지 계층적으로 표현하고, 색상은 별도의 color feature grid와 decoder로 분리했다. geometry decoder 세 개는 ConvONet 방식으로 사전 학습해 고정한 채, 실행 중에는 격자 feature만 갱신했다. 이때 시야에 들어온 지역 격자만 건드리므로 iMAP처럼 과거 기억이 덮어써지는 망각(forgetting) 문제를 피할 수 있었다.

운용 방식 역시 이원 구조였다. tracking에서는 격자와 decoder를 고정한 채 자세만 풀고, mapping에서는 격자 feature를 다듬었다. 덕분에 여러 방으로 이어진 아파트 전체를 직접 촬영해 재구성할 수 있었고, 같은 픽셀 수 기준으로 iMAP보다 tracking은 2배 이상(101→47 ms), mapping은 3배 이상(448→130 ms) 빨랐다.

하지만 3D 격자라는 그릇 자체의 무게가 발목을 잡았다. ESLAM 논문이 지적했듯 3D 격자 메모리는 장면 한 변 길이의 세제곱으로 불어났고, Co-SLAM 논문이 Replica에서 측정한 전체 시스템 속도 역시 0.91 Hz에 그쳐 진정한 실시간과는 거리가 있었다.

바로 그즈음 그래픽스 쪽에서 속도의 판도를 바꾸는 돌파구가 터졌다. Thomas Müller와 동료들이 발표한 [Müller et al. 2022. Instant-NGP](https://nvlabs.github.io/instant-ngp/)(SIGGRAPH 2022)다. multi-resolution hash encoding과 GPU 친화적 커널 구현으로 학습 시간을 극적으로 줄여, 공개 구현이 지원되는 NVIDIA GPU에서 일부 데모 장면을 단 몇 초 만에 학습해 보였다. SLAM 논문은 아니었지만, 이 hash encoding은 곧바로 차세대 NeRF-SLAM 시스템들의 핵심 부품으로 흡수됐다.

> 🔗 **차용.** NICE-SLAM의 multi-resolution feature grid와 Instant-NGP의 hash encoding은 비슷한 시기에 독립적으로 등장했다(arXiv 2021년 12월, 2022년 1월). 이후 Co-SLAM이 hash grid를 직접 가져다 썼다. 격자 안에 TSDF 값 대신 학습된 feature를 담는다는 점에서, 이 발상은 KinectFusion(12장)의 voxel 격자와도 맥이 닿아 있다.

---

## 17.4 Co-SLAM과 NeRF-SLAM

2022년 말부터 후속 연구는 뚜렷하게 두 갈래로 갈렸다. 한쪽은 implicit 지도 표현 자체의 수렴 속도와 메모리 효율을 끌어올리는 데 매달렸고, 다른 한쪽은 이미 검증된 고전·학습 추적기 위에 NeRF 지도를 얹어 결합하는 방식을 택했다.

전자를 대표하는 [**Co-SLAM**](https://arxiv.org/abs/2304.14377)(UCL, Wang et al., CVPR 2023)은 multi-resolution hash grid(parametric encoding)와 one-blob coordinate encoding을 함께 엮었다. hash grid가 빠른 수렴과 국소 디테일을 책임지고, one-blob encoding이 표면을 매끄럽게 이어 주며 관측되지 않은 빈틈까지 메우는 구조다. 그 결과 Replica 15~17 Hz, ScanNet·TUM 12~13 Hz로 10~17 Hz 수준의 속도를 끌어냈다. 같은 CVPR에 발표된 [**ESLAM**](https://arxiv.org/abs/2211.11704)(Idiap/EPFL, Johari et al.)은 한발 더 나아갔다. 3D feature grid를 multi-scale axis-aligned feature plane으로 대체해 메모리 복잡도를 $O(n^3)$에서 $O(n^2)$로 낮추고, volume density 대신 TSDF를 decoding 목표로 삼아 사전 학습 없이도 NICE-SLAM보다 최대 10배 빠른 속도를 기록했다.

후자의 길을 연 것은 MIT의 Antoni Rosinol, John Leonard, Luca Carlone이 2022년에 공개한 [**NeRF-SLAM**](https://arxiv.org/abs/2210.13641)(IROS 2023)이다. RGB-D 없이 단안 영상만 받아 DROID-SLAM 방식으로 카메라 자세와 dense depth를 먼저 풀고, 그 최적화 과정에서 주변 공분산(marginal covariance)까지 함께 뽑아낸다. 그러면 별도의 Instant-NGP 기반 mapping 모듈이 이 자세·깊이 추정치와 불확실성을 넘겨받아 실시간으로 radiance field를 학습한다.

> 🔗 **차용.** NeRF-SLAM은 DROID-SLAM의 recurrent update와 Dense Bundle Adjustment에서 나온 자세·깊이 추정을 그대로 끌어오고, 지도 그릇으로 Instant-NGP를 붙였다. radiance field가 카메라 자세 추정까지 떠맡지 않고, 검증된 추정기의 출력을 받아 실시간 dense 지도를 빚어내는 분업 구조다.

---

## 17.5 iMAP의 구조적 한계

iMAP에서 NICE-SLAM·Co-SLAM으로 이어진 세대교체의 뿌리에는 **지역성(locality)**이라는 구조적 차이가 있었다. 단일 MLP는 지역성이 없다. 공간의 어느 귀퉁이를 렌더링하든 네트워크 가중치 전체를 거쳐야 하므로, 새로운 구역을 학습할 때마다 기존 영역을 지탱하던 가중치까지 함께 뒤틀린다(catastrophic forgetting). 게다가 NICE-SLAM 논문이 지적했듯 장면이 커질수록 단일 MLP가 감당해야 할 표현 용량이 벅차져 파라미터와 연산량 자체가 늘어날 수밖에 없다.

반면 복셀이나 hash grid 기반의 지역 표현에서는 장면이 아무리 넓어져도 공간의 한 점을 질의할 때 드는 연산량이 일정하게 유지된다. 온라인으로 지도가 끝없이 자라나는 SLAM에서 지역성은 단순한 최적화 기교가 아니라 확장성을 좌우하는 전제 조건이었다.

---

## 아직 열린 문제

**실시간 NeRF-SLAM.** Co-SLAM이 기록한 10~17 Hz는 데스크톱 GPU 위에서 얻은 성적이다. 전력과 연산 자원이 빠듯한 모바일·임베디드 로봇에서 같은 속도를 내는 문제는 여전히 풀리지 않았고, 이 속도 한계는 곧 명시적 Gaussian 표현으로 렌더링을 가속하는 Gaussian Splatting(18장)의 부상으로 이어졌다.

**대규모 야외 환경.** [Block-NeRF](https://arxiv.org/abs/2202.05263)(Tancik et al., CVPR 2022)는 도시 구역을 여러 국소 NeRF로 쪼개 재구성하는 해법을 보였지만, 이미 모아 둔 영상으로 학습하는 오프라인 방식이었다. 주행 중에 실시간으로 loop closure를 처리하고 전역 일관성을 지켜야 하는 SLAM의 문제 설정은 아직 도시 규모에 닿지 못했다.

**semantic·편집 가능한 implicit 지도.** NeRF 지도는 장면을 MLP 가중치나 추상적인 feature grid 안에 녹여 저장한다. 이 때문에 TSDF나 point cloud처럼 특정 물체를 집어내 삭제하거나 영역의 속성을 직접 고치기가 까다롭다. [LERF](https://arxiv.org/abs/2303.09553)가 언어 feature를 공간에 정렬해 자연어로 장면을 질의할 수 있게는 만들었지만, 물체 삭제나 편집까지는 다루지 않았다. [Nerfstudio](https://arxiv.org/abs/2302.04264) 생태계에서 의미 표현과 편집 연구가 이어지고 있으나, 이를 실시간 SLAM 파이프라인에 통합하는 과제는 아직 남아 있다.

---

implicit field 연구가 격자와 hash를 덧대며 속도를 끌어올리는 사이, 아예 명시적(explicit) 표현으로 되돌아가는 또 하나의 물결이 일었다. 장면을 MLP 가중치나 복셀 격자 대신 공간에 흩뿌린 작은 타원체 수백만 개로 직접 빚는 방식이다. Bernhard Kerbl 등은 SIGGRAPH 2023 논문에서 2001년 EWA splatting 같은 그래픽스의 오래된 선행 기법 위에 학습 가능한 3D Gaussian과 초고속 미분 가능 렌더러를 얹었다. 이 논문이 나오자 SLAM 지도 표현의 판도는 다시 한번 급격히 움직이기 시작했다.

# 18장 3D Gaussian Splatting 기반 SLAM

iMAP과 NICE-SLAM은 신경망과 격자가 3D 공간을 저장할 수 있음을 입증했지만, 그 지도는 손대기 까다로운 블랙박스였다. iMAP에서는 새 관측으로 MLP를 조금만 고쳐도 다른 영역의 기억이 함께 무너졌다. NICE-SLAM은 지역 feature grid로 망각은 줄였지만, RTX 3090 Ti에서 잰 Replica 처리 속도가 1 fps에도 미치지 못해 실시간 SLAM이라 부르기 민망했다. 장면 전체가 네트워크 파라미터 속에 잠겨 있어 사람이 지도를 열어 보고 직접 다듬기도 어려웠다.

2023년 8월 SIGGRAPH에서 전환점이 찾아왔다. Bernhard Kerbl(Inria), Georgios Kopanas, Thomas Leimkühler, George Drettakis가 내놓은 3D Gaussian Splatting(3DGS) [논문](https://arxiv.org/abs/2308.04079)은 MLP도 복셀 격자도 버리고, 공간에 띄운 작은 반투명 타원체—Gaussian primitive 수백만 개—로 장면을 명시적으로 조립했다. 렌더링 기법은 Matthias Zwicker 등의 EWA splatting(2001)에서 빌렸고, 최적화 방식은 NeRF처럼 미분 가능한 렌더링(differentiable rendering)을 따랐다. 논문이 나오자마자 불과 6개월 사이에 이 표현을 심장으로 삼은 SLAM 논문들이 쏟아졌다.

---

## 18.1 3DGS의 구조

3DGS의 기본 단위인 Gaussian 하나는 네 가지 성질로 정의된다. 3차원 위치(mean) $\boldsymbol{\mu} \in \mathbb{R}^3$, 모양과 방향을 결정하는 공분산 행렬 $\boldsymbol{\Sigma} \in \mathbb{R}^{3 \times 3}$, 학습되는 불투명도 $o \in (0,1)$, 그리고 시점마다 달라지는 빛깔을 담는 구면조화함수(spherical harmonics) 계수다. 최적화 도중 공분산 행렬이 양의 준정부호 조건을 잃지 않도록 실제 학습에서는 이를 스케일 벡터 $\mathbf{s}$와 단위 쿼터니언 $\mathbf{q}$로 쪼개어 관리한다. $\mathbf{S}$가 $\mathbf{s}$로 만든 대각 행렬, $\mathbf{R}$이 $\mathbf{q}$로 만든 회전 행렬일 때 공분산은 다음과 같이 조립된다.

$$\boldsymbol{\Sigma} = \mathbf{R}\mathbf{S}\mathbf{S}^\top\mathbf{R}^\top$$

장면을 그릴 때는 3D Gaussian들을 화면에 투영해 2D 타원으로 만든 뒤, 카메라에서 가까운 순서대로 알파 블렌딩(alpha-blending)으로 포갠다. 각 Gaussian의 유효 불투명도 $\alpha_i$는 학습한 불투명도 $o_i$에 픽셀 좌표에서의 2D Gaussian 값 $G_i(\mathbf{x})$를 곱해 구하며, 최종 픽셀 색 $C$는 다음 식을 따른다.

$$C = \sum_{i \in N} c_i \alpha_i \prod_{j<i}(1 - \alpha_j), \quad \alpha_i = o_i G_i(\mathbf{x})$$

속도의 비결은 GPU 래스터화(rasterization)에 있다. NeRF처럼 픽셀마다 쏜 광선을 따라 수십 개의 샘플을 찍어 MLP에 통과시키는 ray marching 적분이 아예 없다. Kerbl 등은 화면을 타일로 쪼개는 타일 기반 래스터라이저의 forward와 backward 패스를 모두 CUDA 커널로 직접 짰고, 그 결과 A6000 GPU에서 1080p 영상을 30 fps 이상으로 그려 냈다. 물론 이 수치는 이미 학습이 끝난 장면에서 새 시점을 그리는 렌더링 속도이므로, tracking과 지도 갱신을 함께 돌리는 NICE-SLAM의 전체 처리 속도와 같은 선상에서 비교할 값은 아니다.

지도는 보통 SfM이 뱉어 낸 sparse point cloud로 첫 발을 뗀다. 학습이 진행되는 동안 3DGS는 **densification**이라 부르는 분열·복제·가지치기(splitting, cloning, pruning) 절차를 주기적으로 밟는다. 뷰 공간(view-space) 위치 그래디언트가 임계치를 넘겨 아직 모양이 덜 잡힌 것으로 판명된 영역 가운데, 작은 Gaussian이 빈틈을 채워야 할 곳에서는 같은 크기로 복제해 그래디언트 방향으로 밀어 놓고, 분산이 큰 덩어리 Gaussian이 세밀함을 뭉개고 있는 곳에서는 작은 Gaussian 둘로 쪼갠다. 반대로 불투명도가 바닥난 유령 Gaussian은 주기적으로 도려낸다.

> 🔗 **차용.** 3DGS가 3D Gaussian을 화면의 2D Gaussian으로 투영하는 수학적 틀은 Zwicker et al.의 [EWA splatting (2001)](https://www.cs.umd.edu/~zwicker/publications/EWAVolumeSplatting-VIS01.pdf)에서 왔다. Zwicker 등은 volume 데이터를 그리려고 샘플마다 타원형 Gaussian 커널을 화면에 투영했고, 3DGS는 이 커널의 파라미터를 역전파로 학습하게 만든 뒤 GPU 타일 래스터라이저로 속도를 끌어올렸다.

---

## 18.2 3DGS가 SLAM 지도에 맞았던 까닭

NeRF 기반 SLAM이 겪던 두 가지 고질병을 떠올리면 3DGS가 왜 그토록 빨리 SLAM 연구자들을 사로잡았는지 이해하기 쉽다. 단일 MLP는 catastrophic forgetting 탓에 지도를 조금씩 덧붙이기 어려웠고, NICE-SLAM의 voxel grid는 지역성을 회복한 대가로 해상도를 높일수록 메모리가 세제곱으로 불어났다.

반면 Gaussian은 공간의 정해진 좌표에 놓이는 독립된 알갱이다. 새 keyframe이 들어오면 새로 드러난 영역에만 Gaussian을 뿌리면 될 뿐, 멀리 떨어진 기존 영역의 가중치를 건드릴 이유가 없다. 3DGS의 densification 절차 자체가 keyframe을 하나씩 쌓아 가는 SLAM의 리듬과 자연스럽게 맞아떨어졌고, 렌더링 품질은 NeRF에 필적하면서도 속도는 비교할 수 없이 빨랐다.

---

## 18.3 GS-SLAM: 초기 시도

이 표현을 가장 먼저 SLAM의 tracking과 mapping 양쪽에 들이민 초기 시스템 가운데 하나가 Shanghai AI Laboratory와 HKUST의 Chi Yan 등이 2023년 11월 arXiv에 올린 [GS-SLAM](https://arxiv.org/abs/2311.11700)(CVPR 2024)이다.

GS-SLAM은 고전 SLAM의 이분 구조를 그대로 뼈대로 삼아, tracking이 현재 프레임의 카메라 자세를 풀고 mapping이 Gaussian 지도를 다듬는다. 여기에 두 가지 장치를 얹었다. 하나는 adaptive expansion이다. 새 관측 영역에는 Gaussian을 보태되, 표면 앞에 어정쩡하게 떠 있는 잡음 Gaussian의 불투명도는 과감히 낮춘다. 다른 하나는 coarse-to-fine tracking이다. 성기게 뽑은 픽셀로 먼저 대략의 자세를 잡은 뒤, 신뢰할 만한 Gaussian만 추려 정밀 최적화로 들어간다.

tracking 단계에서는 렌더링한 영상과 실제 관측 영상의 픽셀 색 차이를 줄이는 photometric 손실로 자세를 푼다. 샘플링한 픽셀에 대한 손실 식은 다음과 같다.

$$\mathcal{L}_{track} = \sum_m \|\mathbf{C}_m - \hat{\mathbf{C}}_m\|_1$$

mapping 단계에서는 depth L1 오차와 color L1 오차의 가중합을 쓰며, 3DGS 원 논문에서 정립된 손실 $(1-\lambda)\mathcal{L}_1 + \lambda\mathcal{L}_{D\text{-}SSIM}$ ($\lambda=0.2$)은 이후 Gaussian 기반 SLAM 지도를 학습하는 거의 모든 시스템의 기본 공식이 됐다. rasterizer가 미분 가능하기 때문에 이 모든 손실의 그래디언트를 카메라 자세까지 되돌려 보낼 수 있다.

Replica 데이터셋에서 GS-SLAM은 렌더링 PSNR을 차선책보다 1.52 dB 끌어올렸고, 전체 파이프라인이 RTX 4090에서 8.34 fps로 돌아갔다. 다만 저자들은 양질의 깊이 센서에 기대고 있다는 점과 장면이 커질수록 메모리가 가파르게 불어나는 점을 한계로 짚었다.

---

## 18.4 SplaTAM: silhouette 기반 densification

비슷한 시기 카네기멜론대의 Nikhil Keetha 등이 발표한 [Keetha et al. 2024. SplaTAM (CVPR)](https://arxiv.org/abs/2312.02126)은 새 Gaussian을 어디에 심을지 훨씬 단순하고 명쾌한 규칙으로 정했다. 렌더링된 Gaussian들이 픽셀을 얼마나 촘촘히 덮었는지 재는 **silhouette mask**를 도입해, silhouette 값이 0.5 미만인 빈 구멍이거나 센서로 잰 깊이가 렌더링 깊이보다 앞에 있으면서 오차가 큰 영역에만 새 Gaussian을 추가했다.

GS-SLAM과 마찬가지로 SplaTAM도 지도를 얼려 두고 카메라 자세를 맞추는 tracking과, 자세를 고정하고 Gaussian 파라미터를 조율하는 mapping을 번갈아 돌렸다. 결과는 눈에 띄었다. Replica 데이터셋에서 SplaTAM의 평균 PSNR은 34.11 dB에 달해, 같은 실험 표에 오른 NICE-SLAM의 24.42 dB를 큰 폭으로 앞섰다.

> 📜 **예언 vs 실제.** Keetha는 SplaTAM(2024)의 Limitations & Future Work에서 motion blur, 큰 depth noise, 급격한 회전에 취약하다는 점을 솔직히 적었다. 앞으로의 과제로는 OpenVDB 같은 자료구조를 써서 대규모 장면으로 넓히는 일과, 미리 알려진 카메라 내부 파라미터(intrinsics)나 dense depth 없이도 동작하게 만드는 일을 꼽았다. 같은 해 Matsuki의 MonoGS(CVPR 2024)가 단안 RGB 전용 시스템을 따로 내놓았고, intrinsics 없는 환경과 대규모 장면 문제는 2025년에도 여전히 연구가 진행 중이다.

> 🔗 **차용.** 수많은 과거 프레임을 모두 붙잡고 있지 않고 핵심 keyframe만 추려 지도를 다듬는 전략은 PTAM(Klein & Murray, 2007, 5장) 이래의 유산이다. SplaTAM은 mapping할 때 현재 프레임, 직전 keyframe, 그리고 현재 시야와 가장 많이 겹치는 이전 keyframe을 뽑아 함께 최적화한다.

---

## 18.5 MonoGS: monocular RGB

SplaTAM이 RGB-D 센서의 깊이 측정에 기댔다면, Imperial College Dyson Robotics Lab의 Hidenobu Matsuki가 내놓은 [Matsuki et al. 2024. MonoGS (CVPR)](https://arxiv.org/abs/2312.06741)는 깊이 센서 없이 단안(monocular) RGB 카메라 한 대로 3DGS SLAM을 밀어붙였다. Matsuki 역시 iMAP의 Sucar, CodeSLAM의 Bloesch와 같은 Davison 연구실 계보에 속한 연구자였다.

단안 영상만으로 Gaussian을 최적화하면 기하적 모호성이 곧장 흉측한 형태로 드러난다. 절대 scale이 정해지지 않을뿐더러, 시점이 충분히 확보되지 않은 곳에서는 Gaussian이 카메라 시선 방향을 따라 가늘고 길게 찌그러지면서 렌더링과 tracking을 동시에 망가뜨리기 때문이다. Matsuki는 Gaussian의 세 축 길이가 한쪽으로 과도하게 늘어지지 않도록 다음과 같은 등방성(isotropy) 정규화 항을 손실에 추가했다.

$$\mathcal{L}_{iso} = \sum_k \| \mathbf{s}_k - \bar{s}_k \mathbf{1} \|_1$$

여기서 $\mathbf{s}_k \in \mathbb{R}^3$는 $k$번째 Gaussian의 스케일 벡터이고 $\bar{s}_k = \frac{1}{3}\sum_j s_{k,j}$는 세 축 스케일의 평균이다. 그럼에도 단안 궤적 자체의 절대 scale 모호성은 남는다.

tracking은 GS-SLAM·SplaTAM과 같이 렌더링 영상과 관측 영상의 photometric loss로 카메라 자세를 직접 최적화한다. 깊이 센서가 없는 상태에서 새 Gaussian을 심을 때, 기존 지도가 깊이를 렌더링해 낸 픽셀에서는 그 깊이 주변에 작은 분산으로 초기화했다. 반면 아직 지도가 없는 픽셀에서는 렌더링된 깊이들의 중앙값 주변에 큰 분산으로 띄워 둔 뒤, 여러 시점의 관측이 쌓이면서 제자리를 찾아가게 했다.

[MonoGS의 2023년 첫 arXiv 원고](https://arxiv.org/abs/2312.06741v1)에 따르면 TUM-RGBD 데이터셋의 평균 ATE RMSE는 단안 설정에서 4.44 cm(정답 궤적에 scale을 맞춘 뒤 측정), RGB-D 설정에서는 1.58 cm(rigid alignment만 적용)였다. RGB-D 설정의 Replica 렌더링 품질은 평균 PSNR(peak signal-to-noise ratio, 높을수록 원본에 가깝다) 37.50 dB를 기록했다.

> 🔗 **구분.** MonoGS는 외부에서 미리 학습한 monocular depth 예측기나 별도의 tracking 모듈을 빌려 쓰지 않고, 순수하게 3DGS 표현 안에서 단안 SLAM을 완결했다.

## 18.6 RTG-SLAM과 실시간 처리

표현 품질이 입증되자 다음 화두는 자연스레 속도와 메모리로 옮겨 갔다. Zhejiang University의 Zhexi Peng 등이 발표한 [RTG-SLAM (SIGGRAPH 2024)](https://arxiv.org/abs/2404.19706)은 거실 수준을 넘어선 큰 장면의 실시간 RGB-D 재구성에 초점을 맞췄다.

해법은 Gaussian의 역할을 극단적으로 가르는 것이었다. 모든 Gaussian을 애매한 반투명 상태로 여럿 겹쳐 놓는 대신, 각 Gaussian이 완전히 불투명하거나 거의 투명하도록 강제했다. 불투명한 Gaussian 하나가 표면 한 조각과 대표 색상을 딱 덮어 버리면 그 뒤에 다른 Gaussian을 겹쳐 쌓을 필요가 없으므로, 전체 Gaussian 개수와 연산량이 뚝 떨어진다. 여기에 Gaussian을 안정 상태와 불안정 상태로 나누어 불안정한 것만 최적화하고, 이 Gaussian들이 덮는 픽셀만 선택적으로 렌더링했다. 그 결과 동시대 최신 NeRF 기반 RGB-D SLAM보다 약 2배 빠르면서 메모리 사용량은 절반 수준으로 줄었다고 논문에서 보고됐다.

## 18.7 3DGS 이후 달라진 표현 선택

2024년 이후 3DGS 기반 SLAM 논문이 쏟아지면서 SLAM 엔지니어가 고를 수 있는 지도 표현의 스펙트럼은 어느 때보다 넓어졌다. 물론 모든 로봇이 3DGS로 갈아탄 것은 아니다. 임베디드 보드 위에서 경로를 계획하고 충돌을 피해야 하는 실전 로보틱스에서는 지금도 TSDF와 occupancy grid가 주력이다. 예컨대 NVIDIA의 [nvblox](https://nvidia-isaac-ros.github.io/concepts/scene_reconstruction/nvblox/index.html)는 Jetson 같은 소형 장치에서 실시간으로 TSDF 지도를 쌓고, 이를 곧바로 경로 계획용 거리장(ESDF)과 cost map으로 변환한다.

그럼에도 3DGS가 이토록 빠르게 번진 밑바탕에는 하드웨어 궁합이라는 현실적인 동력이 있었다. 현대 GPU는 수십 년간 삼각형과 스플랫을 화면에 뿌리는 래스터화 파이프라인에 맞춰 진화해 왔는데, ray marching 기반인 NeRF와 달리 3DGS는 바로 그 GPU의 장기인 래스터화를 그대로 탔기 때문이다.

> 🔗 **차용.** 장면 표현을 그래디언트로 최적화하고 photometric loss로 관측과 렌더링을 맞대는 패러다임 자체는 NeRF(Mildenhall et al. 2020)에서 물려받은 것이다. 3DGS는 그 최적화 문법은 그대로 유지한 채, 지도의 그릇만 implicit MLP에서 명시적 Gaussian 집합으로 바꿔 끼웠다.

> 📜 **예언 vs 실제.** Kerbl et al.은 3DGS(2023) 원 논문의 Limitations에서 관측이 빈약한 곳의 아티팩트, 길쭉하게 늘어지는(elongated) 아티팩트, 시점 이동 시 튀는 popping 현상, 별도의 정규화(regularization) 부재, 그리고 막대한 메모리 소비(큰 장면을 학습할 때 20 GB를 넘기고 렌더링에도 수백 MB가 듦)를 약점으로 꼽았다. 개선 방향으로는 antialiasing, 원칙적인 culling, point cloud 압축 기법의 도입을 들었다. 실제로 메모리 압축 문제는 2024년 [Compact 3DGS](https://arxiv.org/abs/2311.13681)와 [Niedermayr et al.](https://arxiv.org/abs/2401.02436) 등이 곧바로 파고들었다. 반면 원 논문이 아예 언급하지 않았던 동적 장면 확장([4DGS](https://arxiv.org/abs/2310.08528), [Deformable 3DGS](https://arxiv.org/abs/2309.13101))과 3D 생성·편집([DreamGaussian](https://arxiv.org/abs/2309.16653), [GaussianEditor](https://arxiv.org/abs/2311.14521))은 2024년을 전후해 아예 독립된 거대 연구 분야로 자라났다.

## 아직 열린 문제

**Memory scaling.** Gaussian 개수는 장면이 넓어지는 만큼 정직하게 늘어난다. 실내 Replica 벤치마크에서 도시 구역이나 대규모 캠퍼스로 나가면 필요한 Gaussian 수가 감당하기 어렵게 커진다. 불필요한 Gaussian을 쳐내는 pruning과 거리에 따라 해상도를 조절하는 level-of-detail 계층 구조가 활발히 연구되고 있지만, 넓은 환경에서 메모리 효율과 렌더링 화질을 동시에 잡는 일은 여전히 미완이다.

**Semantic 통합.** 2023년 [LERF](https://arxiv.org/abs/2303.09553)가 NeRF에 언어 feature를 심은 데 이어, [LangSplat](https://arxiv.org/abs/2312.16084)이 Gaussian 표현에 언어 feature를 얹으며 의미 이해와 3DGS가 만났다. 이를 SLAM으로 끌어온 연구도 잇따르고 있으나, 실시간 지도 갱신 속도와 tracking 안정성, semantic 정확도를 동일 조건에서 고르게 만족시키는 수준에는 아직 이르지 못했다.

**Dynamic scene.** 4DGS나 Deformable 3DGS처럼 Gaussian에 시간 축을 붙이는 오프라인 기법은 나왔지만, 정작 GS-SLAM(Yan et al. 2024), SplaTAM(Keetha et al. 2024), MonoGS(Matsuki et al. 2024)를 비롯한 초기 3DGS SLAM 시스템은 예외 없이 세계가 꼼짝 않고 정지해 있다고 가정한다(→ 19장).

여기에 더해 초기 Gaussian을 어디서 구할지도 시스템마다 제각각이었다. RGB-D 방식은 센서가 찍어 준 깊이에 기대고, MonoGS는 시스템 내부에서 추정한 깊이로 더듬어 나갔으며, 뒷장에서 볼 DUSt3R 계열은 아예 이미지에서 기하를 직접 출력하는 네트워크를 학습했다. 그러나 표현이 explicit하든 implicit하든, 16장에서 18장까지 살펴본 시스템들은 하나같이 "카메라만 움직이고 세상은 멈춰 있다"는 오랜 가정 위에 서 있었다. 이제 그 가장 오래된 전제가 깨지는 현장을 들여다볼 차례다.

# 19장 동적·변형 장면 SLAM

고전 필터링부터 NeRF와 3D Gaussian Splatting에 이르기까지, SLAM의 주류 계보는 오랫동안 침묵의 전제 하나를 공유해 왔다. 카메라는 움직여도 세상은 멈춰 서 있다는 가정이다. 그러나 실험실을 벗어나 차들이 뒤섞인 도심 도로를 달리는 자율주행차, 사람이 오가며 의자와 물건을 옮겨 놓는 집 안의 서비스 로봇, 심지어 숨 쉬고 박동하며 장기 전체가 출렁이는 몸속의 수술 로봇 앞에서는 그 전제가 첫 프레임부터 무너진다.

이 균열을 짚어 온 역사는 생각보다 길다. Jorge Fuentes-Pacheco가 동료 Ruiz-Ascencio, Rendón-Mancha와 함께 쓴 서베이 [*Visual simultaneous localization and mapping: a survey*](https://link.springer.com/article/10.1007/s10462-012-9365-8)는 2012년 *Artificial Intelligence Review* 온라인판(2015년 43권 정식 수록)에서부터 동적이고 복잡한 대규모 환경을 아직 풀리지 않은 핵심 난제로 지목하며, 글의 마지막 절을 아예 "Dynamic and Deformable Environments"로 세웠다. 그 이전부터 움직이는 물체를 다루려는 논문은 있었지만, 분야 전체가 이 문제를 정면으로 체계화하기까지 시간이 걸렸다. 2026년 4월 21일자 *The SLAM Handbook* 원고에서는 Lukas Schmid, José María Martínez Montiel, Shoudong Huang, Daniel Cremers, José Neira, Javier Civera 여섯 명이 집필해 이 주제에만 37쪽을 할애했다. 그 문제의식이 마침내 중심부로 올라왔음을 보여 주는 대목이다.

---

## 19.1 세 개의 축

무엇을 "동적"이라 부를 것인가. Schmid 등은 *The SLAM Handbook* 15장 §15.1에서 Looper et al.(2023)의 정의를 빌려, 동적 여부가 물리 현상 자체가 아니라 *관측*과의 관계에서 갈린다고 설명한다. 똑같은 물리적 이동이라도 어떤 로봇에게는 프레임이 흘러가는 동안 눈에 보이는 **short-term dynamic**이 되고, 다른 로봇에게는 두 번의 방문 사이에 묵묵히 쌓여 버린 **long-term dynamic**이 된다. 둘을 가르는 기준은 장면의 변화율 $\text{Dyn}$과 로봇의 관측률 $\text{Obs}$의 비율이다. $\text{Dyn} \ll \text{Obs}$이면 로봇은 움직이는 물체를 매 프레임 연속해서 목격하지만, $\text{Dyn} \gg \text{Obs}$이면 로봇이 다시 돌아왔을 때 이미 의자가 옮겨지고 상자가 치워진 뒤다.

Handbook은 바로 이 관측 특성(Observation: short-term vs long-term)을 첫 번째 축으로 세우고, 지도에 무엇까지 담을 것인가 하는 재구성 수준(Reconstruction: 자세 추정, 장면 기하 복원, 시간에 따른 장면 이해)을 두 번째 축으로, 그리고 처리를 언제 끝내야 하는가 하는 시간 제약(Time: online vs offline)을 세 번째 축으로 삼아 동적 SLAM의 지형도를 그린다. Handbook의 설명대로라면, 움직이는 물체를 전부 outlier로 버리면서 실시간으로 카메라 자세만 건지는 전형적인 포즈 그래프 SLAM은 이 3차원 설계 공간의 한 귀퉁이에 놓인 특수 해법에 불과하다.

---

## 19.2 Short-term: 마스킹에서 multi-object SLAM으로

가장 손쉬운 대응은 움직이는 물체를 아예 못 본 척 지워 버리는 것이었다. Zaragoza 대학에서 박사과정을 밟던 Berta Bescos가 2018년 RA-L에 발표한 [DynaSLAM](https://arxiv.org/abs/1806.05620)은 ORB-SLAM2의 frontend 앞에 Mask R-CNN을 세워 사람이나 자동차처럼 움직일 가능성이 높은 물체를 마스크로 가리고, 그 안에서는 keypoint를 뽑지 않았다. 발상은 소박했지만 효과는 즉각적이어서, 사람이 걸어 다니는 TUM-RGBD의 walking sequence에서 ATE가 0.9~4.0 cm 수준까지 뚝 떨어졌다.

하지만 움직이는 대상을 무조건 지우면 정작 로봇이 피해 가거나 상호작용해야 할 주변 물체의 궤적 정보까지 함께 버리게 된다. UCL의 Martin Rünz는 Lourdes Agapito의 지도 아래 내놓은 [Co-Fusion(Rünz & Agapito, 2017)](https://arxiv.org/abs/1706.06629)과 [MaskFusion(Rünz et al., 2018)](https://arxiv.org/abs/1804.09194)에서 다른 길을 택했다. 움직이는 물체를 지우는 대신 객체마다 별도의 surfel 모델을 만들어 카메라 궤적과 각 객체의 궤적을 동시에 추적한 것이다. 한편 Heriot-Watt 대학의 Raluca Scona, TUM의 Mariano Jaimez, Daniel Cremers 등이 2018년 ICRA에 발표한 [StaticFusion](https://raluca-scona.github.io/docs/conference-papers/2018_icra_staticfusion.pdf)은 딥러닝 semantic segmentation에 기대지 않고도 카메라 움직임과 정적·동적 픽셀의 확률적 분할을 함께 최적화해 정적인 배경만 지도에 남기는 방법을 보였다.

그 다음 단계는 움직이는 객체들을 아예 정식 상태 변수로 승격시켜 하나의 그래프 안에서 함께 푸는 것이었다. Australian National University의 Jun Zhang 등이 낸 [VDO-SLAM(Zhang et al., 2020)](https://arxiv.org/abs/2005.11052)은 카메라 자세 $T_i^w \in SE(3)$와 동적 객체 $k$의 자세 $T_{k,i}^w \in SE(3)$를 같은 factor graph에 나란히 올려놓고, 객체의 운동이 갑자기 튀지 않도록 smooth motion factor로 묶었다. DynaSLAM을 냈던 Bescos 역시 2021년 [DynaSLAM II(Bescos et al., 2021)](https://arxiv.org/abs/2010.07820)로 돌아와 ORB-SLAM2를 기반으로 stereo·RGB-D 입력에서 객체 추적과 SLAM을 강하게 결합했고, CMU의 Yuheng Qiu는 2022년 ICRA의 [AirDOS](https://arxiv.org/abs/2109.09903)에서 딱딱한 강체 차량을 넘어 사람처럼 관절이 꺾이는 객체(articulated object)까지 그래프 안으로 끌어들였다.

관성 센서가 함께 있을 때는 시맨틱 마스크 없이도 동적 요소를 걸러 낼 수 있었다. KAIST의 Song·Lim·Lee·Myung이 2022년 RA-L에 발표한 [DynaVINS](https://arxiv.org/abs/2208.11500)는 semantic mask나 multi-object tracking을 전혀 쓰지 않고, IMU preintegration이 내놓은 자세 prior와 어긋나는 시각 관측의 가중치를 bundle adjustment에서 낮춰 동적 특징점이 추정을 흔들지 못하게 막았다. 같은 연구실이 2024년 RA-L에 낸 [DynaVINS++](https://arxiv.org/abs/2410.15373)는 이를 adaptive truncated least squares로 재설계해, 움직이는 물체 때문에 생긴 오대응이 IMU bias 추정을 오염시켜 필터가 발산하는 현상까지 차단했다.

최근에는 LiDAR와 대규모 transformer 쪽에서도 대응이 이어지고 있다. Handbook §15.2.3은 LiDAR 기반 moving object segmentation(MOS)의 사례로 Schmid 자신의 [Dynablox(Schmid et al., 2023)](https://arxiv.org/abs/2304.10049)를 꼽는다. 한편 2025년 나온 Wimbauer 등의 [AnyCam](https://arxiv.org/abs/2503.23282)은 동적 물체가 뒤섞인 일상 영상에서 transformer로 카메라 자세와 intrinsics를 단번에 추정한다.

> 🔗 **차용.** VDO-SLAM은 고전 graph SLAM의 정식화를 한 치도 벗어나지 않는다. 움직이는 자동차 한 대를 지도에 편입시키려면, 새로운 최적화 기법을 발명하는 대신 factor graph에 그 자동차의 자세 변수와 운동 제약 factor를 추가하기만 하면 된다.

## 19.3 Long-term: 시간을 가로지르는 지도

단기 움직임이 매 프레임의 추적 정확도를 위협한다면, 장기 변화는 로봇이 어제 만든 지도를 오늘 다시 꺼내 쓸 때 드러난다. 어제 창가에 있던 의자가 오늘 아침 복도 쪽으로 밀려 있는 식이다.

이 문제를 기억 구조로 푼 선구적 시스템이 캐나다 Sherbrooke 대학의 Mathieu Labbé가 Michaud의 지도로 개발한 [RTAB-Map](https://introlab.github.io/rtabmap/)이다. 인간의 기억 체계를 본떠 short-term, working, long-term memory의 세 층을 두고, 방문 빈도와 경과 시간에 따라 지도 노드를 옮겨 실었다. 최근 노드는 working memory에 남겨 즉시 조회하고, 드물게 찾는 노드는 long-term memory로 내렸다. Labbé는 2019년 JFR 논문에서 이 구조를 수개월·다중 세션에 걸친 대규모 SLAM으로 확장하는 방법을 정리했다.

누적된 LiDAR 지도에서 과거의 유령 흔적을 청소하는 접근도 나왔다. KAIST URL의 임형태·황성원·명현이 2021년 발표한 [ERASOR](https://arxiv.org/abs/2103.04316)는 지도 전체와 개별 스캔의 구역별 높이 분포를 맞대어 동적 점이 찍혀 있을 법한 구역을 짚어 낸 뒤, 각 구역의 지면을 추정해 지면 점은 남기고 움직였던 물체의 흔적만 도려냈다.

하지만 오래 쓰는 지도에서 가장 미묘한 함정은 따로 있다. Handbook §15.3이 거듭 강조하는 **absence of evidence vs evidence of absence**(아직 못 본 것과 정말로 없어진 것의 구별)다. 방에 들어섰는데 어제 보던 의자가 시야에 없다면, 의자가 치워진 것일까 아니면 책상 뒤에 가려 아직 못 본 것일까. 둘을 가리지 못하면 지도 청소 모듈은 멀쩡히 서 있는 물체를 지워 버리고, 변화 감지 모듈은 가려진 영역을 엉뚱한 변화로 오판한다. Schmid가 2022년 ICRA에 낸 [Panoptic Multi-TSDF](https://arxiv.org/abs/2109.10165)는 객체마다 독립된 TSDF submap을 꾸리고 현재 추적 중인 submap만 active 상태로 두어 관측을 합치되, 몇 프레임 동안 보이지 않는 submap은 inactive로 잠가 과거 기억이 함부로 지워지지 않게 방어했다. 이어 MIT Carlone 그룹에서 Schmid 등이 2024년 발표한 [Khronos](https://arxiv.org/abs/2402.13817)는 아예 spatio-temporal metric-semantic SLAM을 정식화해, loop closure가 일어난 뒤 change detection을 다시 돌려 각 물체가 언제 나타나고 언제 이동했는지까지 복원함으로써 3D 지도에 시간 축을 심었다.

2026년에도 이 흐름은 계속 진화하고 있다. KAIST의 Jang과 Myung 등이 공개한 [Chamelion](https://arxiv.org/abs/2602.08189)은 공사 현장이나 배치가 수시로 바뀌는 실내에서 dual-head 네트워크로 온라인 변화 감지와 장기 지도 유지를 동시에 수행한다. 시간 차이를 두고 정확히 정합된 실세계 변화 데이터를 모으기가 워낙 까다롭다 보니, 다른 장면의 요소를 이식해 구조 변화를 합성하는 데이터 증강 기법을 고안해야 했다.

한편 불규칙한 사건뿐 아니라 주기성과 흐름을 모델링하려는 줄기도 이어져 왔다. 영국 Lincoln 대학의 Tomáš Krajník과 Tom Duckett 등이 2014년부터 발전시킨 **frequency maps**(FreMEn)는 문이 열리고 닫히거나 주차장이 차고 비는 주기적 변화를 Fourier 분석으로 포착한다. 스웨덴 Örebro 대학의 Tomasz Kucner, Martin Magnusson, Achim Lilienthal이 연구한 Maps of Dynamics(MoD)는 사람들이 주로 걷는 동선 같은 *typical motion pattern*을 아예 지도의 속성으로 기록한다. 2022년 arXiv에 올라온 [Changing-SLAM(Soares et al.)](https://arxiv.org/abs/2209.10710)은 ORB-SLAM3 위에서 본래 움직이는 물체의 특징점은 걸러 내고, 잠재적으로 움직일 수 있는 물체는 Extended Kalman Filter로 따로 추적하면서 장기 변화는 Bayesian filter와 장기 data association으로 엮었다.

> 🔗 **차용.** Panoptic Multi-TSDF는 여러 TSDF 블록을 따로 관리하는 volumetric submapping 기법과, 객체 하나마다 독립된 3D 모델을 부여하는 object-centric mapping을 하나로 합쳐 장기 지도의 훼손을 막았다.

## 19.4 Deformable: 형상이 변할 때

물체가 강체(rigid body)로서 통째로 자리를 옮기는 수준을 넘어, 배경의 표면 자체가 고무나 피부처럼 휘고 늘어나는 세계도 있다. University of Washington의 Newcombe, Fox, Seitz는 2015년 CVPR 최우수 논문상을 받은 [DynamicFusion](https://grail.cs.washington.edu/projects/dynamicfusion/)으로 비강체(non-rigid) SLAM의 물꼬를 텄다. DynamicFusion은 KinectFusion의 정적 TSDF 공간 위에 희소한 embedded deformation graph를 띄우고, 각 노드의 회전과 이동을 매 프레임 최적화함으로써 카메라 앞에서 표정을 바꾸는 얼굴이나 몸통을 실시간으로 복원했다. 곧이어 Erlangen-Nürnberg 대학의 Matthias Innmann 등이 2016년 [VolumeDeform](https://arxiv.org/abs/1603.08161)으로 색상 단서를 보태 정밀도를 높였고, 2017년 Miroslava Slavcheva의 [KillingFusion](https://campar.in.tum.de/pub/slavcheva2017cvpr/slavcheva2017cvpr.pdf)은 Killing vector field 정칙화를 도입해 변형이 매끄럽고 거의 등거리(isometric)를 유지하게 하면서도 손바닥을 폈다 오므리는 식의 위상 변화까지 허용했다. 2018년 MIT에서 Tedrake의 지도를 받은 Wei Gao가 발표한 [SurfelWarp](https://arxiv.org/abs/1904.13073)는 TSDF 대신 surfel 표현으로 비강체 추적을 이어 갔다.

단안 RGB 카메라만으로 이 난제에 매달린 연구실은 Zaragoza의 Civera와 Montiel 그룹이었다. Montiel의 박사과정 학생 José Lamarca가 2021년 IEEE TRO에 실은 [DefSLAM](https://arxiv.org/abs/1908.08918)은 ORB 특징 대응을 바탕으로 매 프레임 Shape-from-Template(SfT)로 변형을 추적하고 keyframe마다 isometric NRSfM으로 기준 template를 갱신했다. 같은 그룹의 Juan J. Gómez Rodríguez가 2023년 arXiv에 공개하고 2024년 IEEE TRO에 게재한 [NR-SLAM](https://arxiv.org/abs/2308.04036)은 기존 메시 기반 방법이 평면 토폴로지를 가정해 관 모양 장기나 구멍 난 표면을 다루지 못한다는 한계를 짚고, dynamic deformable graph와 visco-elastic 시간 정칙화를 결합해 임의의 표면 토폴로지를 수용했다. Handbook §15.4.3은 바로 이 계보를 단안 카메라용 deformable SLAM의 표준 파이프라인으로 정리한다.

이 기술이 가장 절실하게 향하는 현장은 외과 수술실이다. University of Technology Sydney의 Jingwei Song 등이 2018년 RA-L에 발표한 [MIS-SLAM](https://doi.org/10.1109/LRA.2018.2856519)은 stereo 복강경 영상으로 수술 중 장기의 박동과 변형을 추적했다. 하버드 의대 Brigham and Women's Hospital의 Haoyin Zhou와 Jagadeesan Jayender가 만든 EMDQ(Expectation Maximization and Dual Quaternion)는 SURF 특징점으로 내시경 카메라의 움직임과 조직 변형을 동시에 풀어 최소침습수술(minimally invasive surgery, MIS) 내비게이션을 겨냥했다.

하지만 변형 장면을 다루는 순간 기하학적으로 피할 수 없는 근본적 모호성이 고개를 든다. Handbook §15.4.1이 강조하는 **Floating Map Ambiguity**다. 일반적인 deformable SLAM은 관측된 변형 가운데 강체 변환으로 설명되는 성분은 모두 카메라 궤적 탓으로 돌린다. 그러나 영상 속에서 무언가 30 cm 옆으로 비켜 났을 때, 손이 30 cm 움직인 것인지 카메라가 반대 방향으로 30 cm 움직인 것인지는 영상만으로는 원리적으로 가를 수 없는 ill-posed 문제다. Handbook이 지적하듯 결국 변형하는 물체의 변위에 물리적 prior를 걸어 둘을 억지로라도 떼어 놓아야 하며, DefSLAM의 isometric prior와 NR-SLAM의 visco-elastic prior가 바로 그 역할을 맡는다.

> 📜 **예언 vs 실제.** Newcombe는 DynamicFusion(2015)의 Limitations and Discussion에서, 손을 주먹 쥔 채 재구성을 시작했다가 손가락을 펴는 것처럼 닫힌 위상에서 열린 위상으로 급격히 바뀌는 장면을 다루기 어렵다고 적었다. 또 KinectFusion처럼 고정 TSDF 메모리가 공간 크기를 가두고, 장면이 넓어질수록 가림이 늘어 거대해지는 warp field를 풀기 어려워진다는 점도 짚었다. 그중 위상 변화의 한계는 2년 뒤인 2017년 KillingFusion이 정면으로 돌파했다.

> 🔗 **차용.** DynamicFusion의 embedded deformation graph는 컴퓨터 그래픽스에서 Sumner, Schmid, Pauly가 2007년 메시 애니메이션용으로 제안한 ED graph를 가져온 것이다. 원래 3D 캐릭터의 표면을 구부리던 희소 제어 그래프가 실시간 비강체 SLAM의 최적화 변수로 변신했다.

## 아직 열린 문제

**Absence vs evidence of absence.** 지도에서 사물이 진짜 사라졌는지 아니면 다른 물체 뒤에 가려 잠시 안 보이는 것인지를 구별하는 문제는 Handbook §15.3이 거듭 강조하는 핵심 난제다. Panoptic Multi-TSDF와 Khronos가 물체 단위 submap과 사후 변화 감지로 실마리를 잡았지만, 가림이 빈번한 일상 공간에서 완결된 해법까지는 거리가 남았다.

**Floating Map Ambiguity.** deformable SLAM은 카메라의 움직임과 변형 물체의 강체 이동을 가르는 일을 여전히 isometric·visco-elastic 같은 경험적 prior에 기대어 우회하고 있다. Handbook §15.5는 카메라 궤적과 지도 변형을 둘 다 정확히 복원할 수 있는 이론적 조건이 무엇인지, 두 강체 운동을 분명히 분리할 수 있는지, 그리고 추정의 불확실성을 정량화할 수 있는지를 아직 열려 있는 근본 질문으로 남겼다.

**Online deformable SLAM.** 계산 속도 역시 현실의 벽에 걸려 있다. DefSLAM은 10×10 노드 template 기준으로 deformable tracking thread에 프레임당 약 50 ms, deformable mapping thread에 약 400 ms가 걸렸다(i7-4700HQ CPU). C++로 새로 짠 NR-SLAM 역시 CPU 전용 구현이었고, 처리 시간은 따로 보고하지 않았다. Khronos가 RGB-D 입력에서 단기 움직임과 장기 배치를 online으로 함께 다뤘지만, 그 대상은 강체 이동과 배치 변화였지 장기 조직처럼 표면 자체가 늘어나고 찌그러지는 변형은 아니었다. Handbook §15.5는 동적 객체 추적을 상태 변수에 편입할수록 계산 비용이 급증하며, NeRF나 3DGS 같은 최신 미분 가능 표현에서도 동적 장면을 실시간 SLAM에 올리기에는 메모리와 연산 부담이 여전하다고 짚는다.

**의료 MIS의 실세계 격차.** MIS-SLAM과 NR-SLAM은 Hamlyn 데이터셋의 생체(in vivo) 복강경 영상으로 검증됐고, NR-SLAM은 실제 대장내시경 영상에서도 정성 평가를 거쳤다. 그럼에도 NR-SLAM 논문 스스로 깊이 불연속과 격렬한 변형이 겹치는 장면에서는 지도를 안정적으로 넓히기 어렵다고 인정했으며, 수술 도구가 시야를 가리는 시퀀스에서는 도구를 따로 분할해 가리는 SD-DefSLAM보다 오차가 컸다. 2024년에는 EndoGS처럼 3D Gaussian을 수술 장면에 들이민 시도도 나왔지만, 실제 수술실의 연기와 출혈, 도구 가림을 견디는 실시간 변형 SLAM은 여전히 진행 중인 과제다.

이처럼 정적 세계라는 가장 오래된 가정에 균열이 가는 동안, 학습 기반 SLAM의 다른 한쪽에서는 아예 카메라 모델도, 단계적 매칭 파이프라인도 건너뛰고 이미지에서 곧장 3D 기하를 쏟아 내는 거대 모델들이 등장하고 있었다.

# 20장 3D foundation model: DUSt3R에서 VGGT까지

2022년 Naver Labs Europe의 Philippe Weinzaepfel과 Jérôme Revaud 등이 발표한 CroCo는 같은 장면을 다른 각도에서 찍은 두 이미지를 이용해 시각 표현을 배우는 자기지도 사전학습(cross-view self-supervised pretraining) 연구였다. 출발점은 순수한 feature learning이었다. 그런데 불과 1년 남짓 뒤, 같은 연구소는 CroCo의 뼈대 위에 전혀 다른 차원의 시스템을 올려놓았다. 카메라 내부 파라미터도, 특징점 매칭도 건너뛰고 이미지에서 곧장 3D pointmap을 토해 내는 DUSt3R였다. 이어 2025년에는 Oxford VGG 그룹과 Meta AI가 여러 시점을 한 번에 꿰어 내는 VGGT를 내놓으면서, 수십 년간 굳어 있던 3D 재구성의 순서 자체가 흔들리기 시작했다.

---

## 20.1 DUSt3R — learned pointmap

2010년대 내내 3D 재구성은 사실상 한 가지 정해진 각본을 따랐다. 특징점을 뽑아 짝을 짓고, 카메라 내부·외부 파라미터를 추정한 뒤, triangulation으로 점군을 세우고 마지막으로 bundle adjustment를 돌려 전체 오차를 다듬는 순서다. [COLMAP(Schönberger & Frahm, CVPR 2016)](https://openaccess.thecvf.com/content_cvpr_2016/html/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.html)은 바로 이 고전 파이프라인을 가장 완성도 높게 구현한 대표 소프트웨어였다.

[Shuzhe Wang et al. 2024. DUSt3R: Geometric 3D Vision Made Easy (CVPR)](https://arxiv.org/abs/2312.14132)는 이 오랜 절차를 통째로 우회한다. 입력은 이미지 두 장뿐이며, 초점 거리(focal length)나 주점(principal point) 같은 카메라 내부 파라미터조차 받지 않는다. 출력은 두 이미지의 모든 픽셀을 첫 번째 카메라 좌표계로 함께 옮겨 놓은 3D 좌표 지도, 곧 **pointmap**이다.

이 과감한 도약의 엔진은 CroCo에서 물려받은 encoder-decoder 구조의 transformer다. 두 이미지는 각각 독립적으로 encoding된 뒤 한 쌍의 decoder로 들어가 정보를 주고받는다. decoder 블록마다 먼저 self-attention으로 자기 이미지 안의 token끼리 문맥을 훑고, 이어서 cross-attention으로 상대 이미지의 모든 token을 건너다본다. 어느 픽셀이 다른 이미지의 어느 픽셀과 같은 3D 점을 바라보고 있는지는 명시적 매칭 알고리즘이 아니라 이 cross-attention이 대규모 데이터 속에서 암묵적으로 터득한다. 논문에서는 Habitat, MegaDepth, ARKitScenes, Static Scenes 3D, BlendedMVS, ScanNet++, CO3D-v2, Waymo 등 여덟 개 데이터셋에서 850만 쌍의 이미지를 끌어와 학습에 썼다. 흥미롭게도 그 학습 정답 가운데 일부는 합성 데이터나 센서 측정뿐 아니라 바로 고전 SfM 소프트웨어의 재구성 결과에서 왔다.

두 이미지의 pointmap이 이미 첫 번째 카메라 좌표계라는 공통 무대 위에 놓여 있으므로, 상대 카메라 자세를 뽑아내는 일은 훨씬 단순해진다. 논문에서는 두 pointmap을 Procrustes alignment로 바로 맞추는 방법을 먼저 제시하고, 잡음과 outlier에 강한 실전 해법으로 PnP-RANSAC을 쓴다. 이미지가 세 장 이상으로 늘어나면 모든 이미지 쌍에서 얻은 pointmap을 하나의 전역 좌표계로 끌어모으는 global alignment 최적화를 푼다. 겉모습은 bundle adjustment를 닮았지만, 특징점 매칭이나 사전 카메라 모델 없이 돌아간다는 점이 다르다.

> 🔗 **차용.** DUSt3R의 backbone은 ViT([Dosovitskiy et al., ICLR 2021](https://arxiv.org/abs/2010.11929))에서 왔고, 더 직접적인 설계 모태는 같은 Naver Labs Europe의 CroCo([Weinzaepfel et al. 2022](https://arxiv.org/abs/2210.10716))다. CroCo는 한 이미지의 가려진 패치를 다른 시점 이미지의 단서로 복원하는 cross-view completion으로 사전학습을 했고, DUSt3R는 그 encoder-decoder 뼈대를 그대로 가져와 출력 과제만 pointmap 예측으로 바꿔 달았다.

## 20.2 매칭까지 하는 MASt3R

DUSt3R는 재구성의 핵심인 픽셀 대응을 cross-attention 내부에 숨겨 두었기에, SuperPoint+SuperGlue나 LightGlue처럼 정밀한 명시적 매칭이 필요한 자리에 그대로 쓰기에는 아쉬움이 남았다.

[Vincent Leroy et al. 2024. Grounding Image Matching in 3D with MASt3R (ECCV)](https://arxiv.org/abs/2406.09756)은 DUSt3R 위에 matching head를 얹어 이 빈칸을 메웠다. 네트워크가 pointmap과 함께 픽셀별 서술자(descriptor)를 내놓도록 3D 위치와 서술자를 공동 학습시켰다. 실제 매칭에는 두 이미지에서 서로가 서로의 최근접 이웃이 되는 쌍을 고르는 reciprocal matching을 쓰며, 이를 빠르게 처리하는 전용 알고리즘도 함께 제시했다.

3D 기하와 결합된 매칭이 손에 들어오자 곧바로 SLAM 시스템으로 이어졌다. 2024년 12월 Imperial College London Davison 그룹의 Riku Murai, Eric Dexheimer, Andrew Davison이 공개한 [MASt3R-SLAM](https://arxiv.org/abs/2412.12392)(CVPR 2025)은 MASt3R의 매칭을 frontend로, 그래프 기반 global optimization을 backend로 엮어 RTX 4090 한 장에서 약 15 fps의 실시간 성능을 냈다. 정확한 카메라 캘리브레이션 없이도 dense 매칭이 가능해지면서 foundation 모델의 출력을 COLMAP 형식의 SfM 파이프라인에 잇는 실용적 조합도 자연스레 등장했다. 2025년 6월에는 §20.4에서 살펴볼 VGGT의 공개 저장소에도 예측 결과를 COLMAP 형식으로 내보내고 선택적으로 bundle adjustment를 돌리는 스크립트가 추가됐다.

> 📜 **예언 vs 실제.** DUSt3R는 이미지 쌍을 따로 푼 뒤 global alignment로 사후 정합하는 구조였기에 순차 처리와 실시간 구동은 후속 과제로 남아 있었다. 그러나 DUSt3R 공개 후 불과 8개월 뒤인 2024년 8월에 Spann3R가 global alignment 없이 이미지를 순서대로 처리해 보였고, 12월에는 MASt3R-SLAM이 아예 완결된 실시간 SLAM 시스템으로 묶어 냈다.

> 🔗 **차용.** MASt3R의 3D-anchored matching은 SuperGlue([Sarlin et al. 2020](https://arxiv.org/abs/1911.11763))가 겨냥했던 2D 서술자의 모호성 문제를 다른 각도에서 푼다. SuperGlue가 그래프 신경망으로 이미지 내 주변 맥락을 훑어 모호성을 낮췄다면, MASt3R는 3D 기하 구조를 함께 학습시켜 대응의 애매함을 걷어 냈다.

## 20.3 Spann3R — sequential 처리

DUSt3R와 MASt3R는 기본적으로 이미지 묶음을 한데 모아 놓고 쌍을 지어 처리한다. 그러나 카메라가 움직이면서 프레임이 시간 순서대로 한 장씩 들어오는 SLAM에서는 프레임마다 지도를 즉시 갱신할 수 있어야 한다.

[Hengyi Wang & Lourdes Agapito 2025. 3D Reconstruction with Spatial Memory (Spann3R, 3DV)](https://arxiv.org/abs/2408.16061)은 DUSt3R를 바로 이 순차 처리 문법에 맞게 개조한 시스템이다. 이미 지나온 프레임들의 기하 정보를 외부 spatial memory에 차곡차곡 저장해 두고, 새 프레임이 도착하면 그 memory를 조회해 공통 좌표계의 pointmap을 곧바로 출력한다. 뒤늦게 모든 쌍을 맞추는 global alignment 최적화가 아예 필요 없어진 것이다.

Spann3R 역시 캘리브레이션 없이 동작하면서 프레임이 들어올 때마다 실시간으로 지도를 키웠다. 논문에서는 RTX 4090 한 장에서 test-time 최적화 없이 50 fps가 넘는 속도로 점진적 3D 재구성을 했다고 보고했다.

> 🔗 **차용.** Spann3R는 DUSt3R의 ViT encoder와 두 decoder 구조를 그대로 물려받았다. 대신 이전에 예측한 pointmap과 decoder의 기하 feature를 가벼운 memory encoder에 통과시켜 memory key와 value로 저장해 두고, 새 프레임에서는 decoder의 기하 feature를 query 삼아 과거 기억을 꺼내 쓴다. 이 memory 관리 방식은 동영상 객체 분할에서 인간의 기억 모델을 본뜬 X-Mem을 참고했다.

## 20.4 VGGT — multi-view joint inference

Spann3R가 외부 메모리를 징검다리 삼아 프레임을 한 장씩 짚어 나가는 동안, Oxford VGG 그룹과 Meta AI의 Jianyuan Wang, Minghao Chen, Nikita Karaev, Andrea Vedaldi, Christian Rupprecht, David Novotny는 2025년 초 아예 판을 넓혀 버리는 해법을 제시했다. 수십, 수백 장의 이미지를 한꺼번에 집어넣으면 카메라 파라미터, depth map, point map, 3D point track을 단 한 번의 forward pass로 쏟아 내는 네트워크였다.

[Jianyuan Wang et al. 2025. VGGT: Visual Geometry Grounded Transformer (CVPR)](https://arxiv.org/abs/2503.11651)는 DUSt3R의 쌍 단위 처리를 다중 시점 동시 추론으로 끌어올렸다. DUSt3R로 이미지 $N$장을 재구성하려면 최대 $N(N-1)/2$개에 달하는 이미지 쌍을 일일이 돌린 뒤 무거운 global alignment를 풀어야 했다. VGGT는 $N$장을 통째로 transformer에 넣고 attention 연산으로 모든 시점 사이의 관계를 동시에 조율한다. 논문에서는 한 번에 수백 장까지 입력할 수 있다고 밝혔으며, H100 GPU 한 장으로 측정한 feature backbone 처리 시간은 20장에 0.31초, 100장에 3.12초에 불과했다.

정량 비교에서도 VGGT는 별도의 후처리 없이 카메라 자세 정확도와 점군 품질 모두 DUSt3R를 앞섰고, global alignment라는 사후 최적화를 덜어 낸 덕분에 속도까지 빨랐다.

## 20.5 pose estimation과 reconstruction의 경계

전통적인 컴퓨터 비전에서는 이미 지어진 지도 위에서 내 위치를 찾는 localization과, 미지의 장면을 3D로 깎아 내는 reconstruction을 서로 다른 문제로 떼어 놓고 다뤘다. SLAM은 이 둘을 동시에 맞물려 풀어야 했기에 유독 까다로웠다.

DUSt3R에서 VGGT에 이르는 계보는 이 경계를 흐린다. 기하 복원과 카메라 추정이 같은 학습 표현 위에서 한 몸처럼 돌아가기 때문이다. DUSt3R 단계에서는 아직 pointmap에서 자세를 따로 계산하고 여러 시점을 global alignment로 엮는 뒷손질이 필요했지만, VGGT에 이르러서는 단 한 번의 forward pass 안에서 카메라와 3D 기하가 함께 태어난다.

그렇다고 multi-view geometry의 원리가 증발한 것은 아니다. DUSt3R, MASt3R, VGGT 모두 SfM과 센서 측정으로 만든 다중 시점 정답 데이터를 먹고 자랐으니, 기하 법칙은 네트워크가 흡수한 학습 신호 속에 녹아 있다. 다만 epipolar constraint, triangulation, bundle adjustment 같은 알고리즘이 transformer 가중치 내부에 어떤 형태로 자리 잡았는지는 아직 아무도 증명하지 못했다. 사라진 것은 기하학 자체가 아니라, 사람이 한 줄씩 짠 명시적 파이프라인이다. 그 대가로 DUSt3R가 이상한 3D 구조를 내놓았을 때, 실패의 원인이 가중치 깊은 곳에 숨어 있어 어느 단계가 어긋났는지 짚어 내기는 훨씬 어려워졌다.

> 📜 **예언 vs 실제.** MASt3R 논문은 결론에서 여러 벤치마크의 카메라 자세·localization 성능을 끌어올렸을 뿐 아니라 적은 수의 이미지로도 작동해 localization의 활용 폭을 크게 넓힐 것이라 기대했다. 실제로 같은 해 말 MASt3R의 매칭 모듈은 MASt3R-SLAM의 frontend로 채택되어 실시간 SLAM 시스템 안으로 들어왔다(§20.2).
