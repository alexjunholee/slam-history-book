# Ch.6b — Certifiable SLAM: 해가 전역 최적인지 증명하기

Lu-Milios에서 g2o, GTSAM까지 이어진 연구에는 풀리지 않은 문제가 하나 있었다. 포즈 그래프 최적화(PGO)는 비볼록 문제라서 Gauss-Newton이나 LM이 내놓는 해가 지역 최솟값일 수 있다. 실무자들은 "odometry 초기값이 있으면 대체로 잘 풀린다"는 경험칙에 기댔다. 그러나 backend가 엉뚱한 해에 수렴하고도 아무 실패 신호 없이 멈추는 일이 있었다. 2015년 Georgia Tech에 있던 Luca Carlone은 Dellaert, MIT의 Rosen, Leonard 등과 함께 해를 수학적으로 검증하는 연구를 시작했다. Lagrangian duality를 쓴 이 연구는 Briales와 Gonzalez-Jimenez의 Cartan-Sync(2017), Rosen의 SE-Sync(2019), Yang과 Carlone의 TEASER, Papalia의 CORA로 이어졌다. 여기에 쓰인 도구는 모두 SLAM 바깥에서 왔다. Shor relaxation은 operations research에서, Burer-Monteiro factorization은 수리 최적화에서, Riemannian optimization은 미분기하에서, Kirchhoff의 Matrix-Tree 정리는 그래프 이론에서 왔다.

---

## 6b.1 지역 최솟값 문제

Ch.6 §6.7은 그래프 SLAM backend의 첫 문제로 초기값 의존성을 꼽았다. 비용 함수는 회전 변수 $\boldsymbol{R}_i \in \mathrm{SO}(3)$ 때문에 비볼록이다. 그래서 초기 추정이 참값에서 멀면 Gauss-Newton은 잘못된 해로 수렴한다. *The SLAM Handbook* 6장의 그림 6.1은 여러 층짜리 주차장을 돈 로봇의 실제 포즈 그래프로 이 문제를 보여 준다. SE-Sync가 구한 전역 최적해에서는 층이 제대로 쌓여 있다. 무작위 초기값에서 출발한 국소 최적화는 이와 전혀 다른 모양의 지역 최솟값에 멈춘다.

2000년대 후반까지 연구자들은 odometry로 좋은 초기값을 얻고, frontend에서 loop closure를 검증하고 outlier를 철저히 걸러 내는 식으로 대응했다. 둘 다 효과가 있었지만, 수렴한 값이 전역 최솟값인지 판정할 방법은 여전히 없었다. Huang과 Dissanayake는 2010년 무렵, 초기값이 좋아도 데이터가 모호하면 최적화기가 틀린 답에서 멈출 수 있다고 지적했다. PGO의 여러 특수한 경우가 NP-hard라는 것도 알려졌다. 그런데도 실제로는 g2o가 대개 잘 풀었다. 2010년대 중반 backend 이론 연구자들은 최악의 경우를 다루는 이론과 실제 결과가 왜 이렇게 다른지 파고들었다.

Gauss-Newton이 보장하는 것은 국소 조건뿐이다. 이상적인 국소 최솟값에서는 기울기가 0이고 Hessian이 양의 준정부호다. 실제 solver는 정지 기준이나 수치 문제 때문에 그 조건에 닿기 전에 멈추기도 한다. backend가 "수렴했다"고 알려 오면 사용자는 실패를 알아차리기 어렵다.

> 🔗 **차용.** Huber, Cauchy 같은 robust kernel은 robust statistics에서 왔다. [Black & Rangarajan (1996)](https://doi.org/10.1007/BF00131148)은 이런 robust 비용을 outlier 가중치 문제로 바꿔 쓸 수 있음을 보였고, 이 대응 관계는 뒤에 SLAM과 점군 정합에서 GNC(graduated non-convexity, 볼록한 근사에서 시작해 점점 원래 비용으로 옮겨 가는 방법)를 쓸 때 바탕이 됐다.

---

## 6b.2 Shor relaxation

PGO가 비볼록인 것은 회전 제약 $\boldsymbol{R}_i \in \mathrm{SO}(d)$ 때문이다. 직교성 조건 $\boldsymbol{R}^\top \boldsymbol{R} = \boldsymbol{I}$은 이차식이다. 3차원에서 $\det(\boldsymbol{R})=+1$은 삼차식이지만, 열벡터가 오른손 좌표계를 이룬다는 조건을 외적 관계로 쓰면 이차 제약이 된다. 목적함수도 이차이므로 PGO는 **QCQP**(Quadratically Constrained Quadratic Program, 이차 제약 이차 계획)로 쓸 수 있다. QCQP에는 Naum Shor가 1987년에 발표한 convex relaxation이 있었다.

Shor는 항등식 $\boldsymbol{x}^\top \boldsymbol{M}\boldsymbol{x} = \mathrm{tr}(\boldsymbol{M}\boldsymbol{x}\boldsymbol{x}^\top)$을 이용해 새 변수 $\boldsymbol{X} \triangleq \boldsymbol{x}\boldsymbol{x}^\top$을 도입했다(lifting). 그러면 원래 QCQP는 "$\boldsymbol{X} \succeq 0$이고 rank가 1"이라는 조건 아래에서 선형 목적함수를 최소화하는 문제가 된다. 여기서 rank-1 제약을 버리면 볼록한 **SDP**(semidefinite program, 반정부호 계획)가 된다. 변수 수는 $n$에서 $n(n+1)/2$로 늘지만 문제는 볼록해진다.

$$d^* = \min_{\boldsymbol{X}\in\mathbb{S}^n} \mathrm{tr}(\boldsymbol{C}\boldsymbol{X}) \;\; \text{s.t.} \;\; \mathrm{tr}(\boldsymbol{A}_i\boldsymbol{X})=b_i,\; \boldsymbol{X}\succeq 0.$$

이 relaxation이 쓸모 있는 까닭은 부등식 $d^* \le p^*$에 있다. SDP의 최솟값은 원래 QCQP 최솟값의 하한이다. 후보해 $\hat{\boldsymbol{x}}$가 있으면 $f(\hat{\boldsymbol{x}}) - d^*$가 그 후보가 최적에서 떨어진 정도의 상한이 된다. "certifiable"이라는 이름은 여기서 나왔다. 전역 최적해를 직접 구하지 못해도, 손에 든 해가 최적에서 얼마나 떨어져 있는지 상한은 구할 수 있다. SDP 해 $\boldsymbol{X}^*$의 rank가 1이면 $\boldsymbol{X}^* = \boldsymbol{x}^*\boldsymbol{x}^{*\top}$에서 얻은 $\boldsymbol{x}^*$가 원래 QCQP의 전역 최적해다. SLAM에서 이런 경우가 얼마나 자주 생기는지가 그 뒤 논문들의 주제가 됐다.

이 연구는 Carlone이 2015년 ICRA와 IROS에서 발표한 두 논문, [Carlone & Dellaert 2015 "Duality-based verification techniques for 2D SLAM"](https://doi.org/10.1109/ICRA.2015.7139835)과 [Carlone et al. 2015 "Lagrangian duality in 3D SLAM"](https://arxiv.org/abs/1506.00746)에서 시작했다. 두 논문은 후보해가 전역 최적인지 Lagrangian dual로 검증하는 방법을 내놓았고, 실험에서 duality gap이 0인 경우가 많음을 보였다. 언제 gap이 0인지는 답하지 못했다.

2017년에는 [Briales와 Gonzalez-Jimenez의 Cartan-Sync (RA-L 2017)](https://doi.org/10.1109/LRA.2017.2718661)가 pose synchronization 문제로 같은 연구를 이었다. 수학 쪽에는 Boumal, Absil, Sepulchre 등의 Riemannian optimization이, 최적화 쪽에는 2003년에 나온 Burer-Monteiro의 low-rank SDP factorization이 이미 있었다. SE-Sync는 이 도구들을 한 알고리즘으로 엮었다.

---

## 6b.3 SE-Sync

[Rosen, Carlone, Bandeira, Leonard의 SE-Sync (IJRR 2019)](https://arxiv.org/abs/1612.07386)는 certifiable SLAM의 대표 논문이다. Rosen은 MIT에서 John Leonard의 지도로 박사학위를 받았다. Leonard는 Ch.4에서 Durrant-Whyte와 함께 EKF-SLAM 틀을 만든 연구자로 나왔다. 공저자 Afonso Bandeira는 SDP와 synchronization 문제를 연구하는 수학자다. 이 논문은 Shor relaxation, translation 소거, Burer-Monteiro low-rank 매개화, Boumal의 Riemannian Staircase를 PGO 하나에 함께 적용했다.

SE-Sync는 다음 순서로 문제를 바꾼다. 첫째, 회전을 고정하면 translation이 선형 최소자승 문제가 된다. SE-Sync는 이 점을 이용해 $\boldsymbol{t}$를 닫힌 형태로 소거한다. graph SLAM 연구자들이 오래전부터 알던 사실이지만, SE-Sync는 이를 convex relaxation의 첫 단계로 삼았다. 둘째, 남은 회전만의 문제 $\min_{\boldsymbol{R}\in\mathrm{SO}(d)^n} \mathrm{tr}(\tilde{\boldsymbol{Q}}\boldsymbol{R}^\top\boldsymbol{R})$에 Shor relaxation을 적용해 SDP로 바꾼다. 셋째, $dn \times dn$ 크기의 이 SDP를 interior-point method로 그대로 풀면 포즈가 수천 개만 돼도 감당할 수 없다. 그래서 Burer-Monteiro 재매개화 $\boldsymbol{Z} = \boldsymbol{Y}^\top \boldsymbol{Y}$로 Stiefel manifold 위의 저차원 비제약 문제로 바꾼다.

이 방법은 먼저 **exact recovery**에 기댄다. 측정 노이즈가 어떤 상수 $\beta$보다 작으면 SDP relaxation의 해 $\boldsymbol{Z}^*$는 유일하고 rank가 $d$이며, 원래 MLE의 전역 최솟값을 정확히 되찾는다. 일반적인 벡터 QCQP에서는 rank-1이 조건이지만, 여기서는 $\boldsymbol{Z}=\boldsymbol{R}^\top\boldsymbol{R}$이고 $\boldsymbol{R}\in\mathbb{R}^{d\times dn}$이므로 정확한 해의 rank가 $d$다. 다만 $\beta$는 참값에 따라 달라서 미리 알 수 없다. 여기에 Boumal 등의 결과가 더해진다. Stiefel manifold 위에서 찾은 2차 임계점이 rank-deficient하면 그 점이 곧 전역 최솟값이라는 것이다. Riemannian Staircase는 이 두 결과를 이용한다. 작은 rank에서 시작해 2차 임계점을 찾고 rank-deficiency를 검사한 다음, 조건이 맞지 않으면 rank를 하나 올린다. rank가 $dn + 1$에 닿으면 모든 $\boldsymbol{Y}$가 row rank-deficient가 되므로 유한한 단계 안에 반드시 멈춘다. Handbook 6장에 따르면 실제로는 대개 한두 단계면 충분하다.

SE-Sync 논문은 합성 데이터(sphere, torus, grid)와 실측 데이터(garage, cubicle, rim)에서 실험했다. 모든 데이터에서 SE-Sync와 Gauss-Newton은 같은 전역 최적해에 도달했고, SE-Sync가 3.3배(garage)에서 15.7배(rim) 빨랐다. SE-Sync는 해와 함께 사후(a posteriori) certificate도 낸다. g2o나 GTSAM은 해만 돌려준다. certificate로 확인되면 그 해가 전역 최적임이 증명된다. 확인되지 않으면 전역 최적인지 판정할 수 없다. Lu-Milios 이후 20여 년 만에 backend가 해와 함께 전역 최적성의 증명을 내놓게 됐다.

> 📜 **예언 vs 실제.** Rosen 등은 SE-Sync 논문 결론에서 측정 일부에 outlier가 섞인 경우에도 강건하고 통계적으로 효율적인 추정으로 넓히는 일을 내다봤다. 더 넓은 polynomial optimization 문제에도 구조를 이용한 SDP relaxation으로 certifiably correct 알고리즘을 설계할 수 있다고 보았다. 이 예상은 상당 부분 맞았다. Yang과 Carlone의 TEASER 계열, 2023년 Holmes와 Barfoot의 landmark SLAM 확장, 2024년 Papalia 등의 CORA(거리 측정 확장)가 뒤따랐다. visual SLAM의 perspective projection은 유리함수라서 polynomial optimization에 그대로 넣기 어렵다. Han과 Yang의 [XM](https://arxiv.org/abs/2502.04640)(RSS 2025)은 학습한 depth로 2D keypoint를 3D로 올려, 목적함수에서 projection을 없앤 scaled bundle adjustment를 만들었다. 이 문제를 SfM 파이프라인에서 SDP relaxation으로 풀어 전역 최적성 certificate도 냈다.

> 🔗 **차용.** SE-Sync의 핵심인 Burer-Monteiro factorization은 [Burer & Monteiro (2003)](https://link.springer.com/article/10.1007/s10107-002-0352-8)의 low-rank SDP 해법이다. [Boumal, Voroninski, Bandeira (2016)](https://arxiv.org/abs/1606.04970)는 이 방법에 Riemannian optimization 관점을 적용해 2차 임계점이 전역 최적이 되는 조건을 보였고, Rosen이 이 결과를 SLAM에 가져왔다.

## 6b.4 Graph Laplacian과 Fisher Information

전역 최적해를 찾았더라도, 그 추정이 참값과 얼마나 가까운지는 따로 물어야 한다. Cramér-Rao Lower Bound와 Fisher Information Matrix(FIM)가 이 질문을 다룬다. 회전을 고정한 단순한 PGO 모델에서는 FIM이 그래프의 가중 reduced Laplacian과 단위행렬의 Kronecker product로 정확히 나온다.

$$\mathcal{I} = \boldsymbol{J}^\top \boldsymbol{\Sigma}^{-1} \boldsymbol{J} = \boldsymbol{L}_w \otimes \boldsymbol{I}_3.$$

그래서 그래프 구조만 알면 실제 측정 없이도 추정 정확도를 근사할 수 있다. Kirchhoff의 Matrix-Tree 정리에 따르면 reduced Laplacian의 행렬식은 가중 spanning tree 수와 같다. 이 값은 D-optimality(정보 행렬의 행렬식을 기준으로 삼는 실험 설계 기준)와 대응한다. 대수적 연결도(algebraic connectivity, Fiedler value)는 E-optimality(가장 나쁜 방향의 분산을 기준으로 삼는 기준)와 대응한다. 1847년 Kirchhoff가 전기 회로망을 분석하려고 증명한 정리가 측정 선택과 active SLAM(정보를 많이 얻도록 로봇의 움직임을 고르는 SLAM)의 이론 근거가 됐다. active SLAM에서 FIM을 최대화하는 문제는 Laplacian 스펙트럼을 다루는 문제로 바뀐다.

이 연결은 [Kasra Khosoussi, Shoudong Huang, Gamini Dissanayake 등의 2014년 이후 연구](https://doi.org/10.1177/0278364918823086)에서 정리됐다. Khosoussi는 University of Technology Sydney에서 Huang과 Dissanayake의 지도로 2017년 박사학위를 받았고, 그 뒤 MIT에서 박사후연구원과 연구원으로 일했다. 3D PGO로 일반화하면 Laplacian과 SE(3) adjoint representation이 Kronecker product로 결합해, 그래프 연결 정보와 기하 정보를 따로 다룰 수 있게 된다. 3D PGO에서 Laplacian은 FIM보다 차원이 6배 작다. 그래서 측정을 고를 때 FIM 대신 Laplacian으로 근사하면 계산이 가볍고, 이 결과는 loop closure 선택의 수학적 근거가 된다.

Ch.4 §4.5에서 본 EKF-SLAM의 inconsistency 문제도 같은 질문과 이어진다. Julier와 Uhlmann이 2001년 지적한 EKF의 과신(over-confidence)을 CRLB로 다시 보면, 근사 선형화가 Fisher information을 실제보다 크게 잡는 문제다. Handbook 6장은 6.1절에서 certifiable solver를, 6.2절에서 최적해의 정확도를 다룬다. 전역 최솟값을 찾는 문제와 그 정확도를 따지는 문제를 함께 봐야 하기 때문이다.

> 🔗 **차용.** [Kirchhoff의 Matrix-Tree 정리(1847)](https://en.wikipedia.org/wiki/Kirchhoff%27s_theorem)는 전기 회로망 분석 도구로 만들어져 조합론과 실험 설계 분야에서 쓰였다. 2010년대 Khosoussi 등의 연구로 SLAM의 측정 선택과 active SLAM에도 쓰이게 됐다.

## 6b.5 확장과 한계: TEASER, CORA, Lasserre relaxation

SE-Sync가 나온 뒤 연구는 outlier에 강한 certifiable estimator와, 거리, landmark, 비등방 잡음(anisotropic noise) 같은 측정 모델로 넓어졌다.

먼저 outlier 문제다. Ch.6 §6.7에서 본 것처럼, loop closure 검증을 통과한 잘못된 매칭이 그래프에 섞인다. outlier 비율이 어느 수준을 넘으면 Huber나 Cauchy kernel을 써도 최적화가 실패한다. certifiable 연구는 2017년 무렵부터 이 문제를 다뤘다.

대표적인 예가 [Yang, Shi, Carlone의 TEASER (TRO 2021)](https://arxiv.org/abs/2001.07715)다. TEASER는 3D 점군 정합 벤치마크에서 scale을 알 때 대응 가운데 outlier가 99%를 넘어도 견뎠다. 대응이 틀려도 비용이 일정 값 이상 커지지 않는 truncated least squares(TLS) 비용으로 문제를 다시 쓰고, scale, rotation, translation 추정을 분리해 차례로 푼다. scale과 translation은 adaptive voting으로 다항 시간 안에 풀고, rotation은 SDP로 relaxation해 certificate를 낸다. 뒤이은 [Yang & Carlone (TPAMI 2022)](https://arxiv.org/abs/2109.03349)는 TLS를 비롯한 robust 비용을 polynomial optimization 문제로 다시 쓰고, Lasserre 계층보다 작은 sparse SDP relaxation을 제안했다.

거리 측정을 함께 쓰는 range-aided SLAM은 [Papalia 등의 CORA (TRO 2024)](https://arxiv.org/abs/2302.11614)가 다뤘다. 거리 측정 항 $(\|\boldsymbol{t}_j - \boldsymbol{t}_i\| - \tilde r_{ij})^2$에는 노름(제곱근)이 들어 있어 그대로는 이차식이 아니다. CORA는 방향을 나타내는 보조 단위벡터 $\boldsymbol{b}_{ij} \in S^{d-1}$를 따로 변수로 두어 이 문제를 QCQP로 바꿨다. Handbook 6장에 따르면 이 relaxation은 앞의 문제들과 달리 노이즈가 작아도 언제나 exact하지는 않다. 로봇 여러 대가 서로 거리만 재고 상대 포즈를 재지 않으면 대개 exact하지 않았다. 그래도 여러 실제 SLAM 문제에서는 exact했고, 그래프의 연결 정도가 exact 여부에 크게 영향을 주었다.

Landmark 쪽에서는 [Holmes & Barfoot (RA-L 2023)](https://doi.org/10.1109/LRA.2023.3238173)이 Schur complement로 landmark를 미리 소거해 SE-Sync에 바로 넣을 수 있는 형태로 만들었다. Holmes, Khosoussi, Rosen은 Handbook 6장의 공저자다.

한계도 드러났다. anisotropic noise와 truncated-quadratic outlier까지 다루려고 POP(Polynomial Optimization Problem)로 일반화하면 Lasserre moment relaxation이 필요하다. moment relaxation이 만드는 SDP에는 중복 제약이 많아 **degenerate**해진다. 그러면 Riemannian Staircase의 수렴 보장에 필요한 constraint qualification이 대개 성립하지 않고, dual 해가 무수히 많아 구현도 어려워진다. Handbook은 Riemannian Staircase를 이런 SDP에 쓸 수 없다고 정리한다. 2022년 Yang 등은 이런 relaxation을 푸는 전용 solver를 내놓았지만, 아직 국소 solver보다 상당히 느리다. Visual SLAM과 VIO에서는 perspective projection과 IMU preintegration을 이 정식화에 넣는 문제도 남아 있다.

> 📜 **예언 vs 실제.** Carlone 등은 2015년 IROS 논문 결론에 "Many theoretical questions remain open, e.g., under which conditions the duality gap is zero?"라고 적었다. 10년이 지난 지금 답은 일부만 나왔다. SE-Sync의 exact recovery 정리가 "노이즈가 $\beta$ 이하"라는 충분조건을 주었지만, 실제 SLAM 인스턴스에서 $\beta$를 미리 계산하는 방법은 없다. 2026년에도 tightness가 언제 깨지는지 미리(a priori) 알려 주는 조건 대신, 문제마다 사후 certificate를 계산해 확인한다.

---

## 🧭 아직 열린 것

**Tightness가 깨지는 경계.** SE-Sync의 exact recovery 정리는 "노이즈 $\beta$ 이하"라는 충분조건이다. 실제 인스턴스에서 $\beta$를 미리 계산하는 일은 남은 과제다.

**Visual SLAM, VIO에 넣기.** perspective projection $\pi(\boldsymbol{X}) = [X/Z, Y/Z]$는 유리함수라 polynomial optimization에 넣으려면 변형이 필요하다. 분모를 곱해 다항식으로 바꿔도 feature마다 변수와 보조 제약이 늘어서, ORB-SLAM3처럼 map point가 수천 개면 SDP가 너무 커져 실시간으로 풀 수 없다. Forster의 2015년 IMU preintegration도 exponential map과 bias drift가 얽혀 POP로 쓰기 어렵다. 2026년에도 Ch.7, Ch.8, Ch.13에서 다루는 주요 visual SLAM, VIO 시스템은 certifiable 보장을 받지 못한다.

**Online certification과 규모.** SE-Sync는 배치 방법이다. iSAM2가 배치 SAM을 증분화했듯 certifiable solver도 증분화하려는 연구가 있다. 측정이 들어올 때마다 certificate를 갱신하는 방법으로 warm-start, rank 증분, 부분 certificate 합성이 연구되고 있다. 도시 규모 그래프에서 moment relaxation solver가 느린 것도 여전히 문제다.

**Outlier가 다수인 경우.** TEASER처럼 outlier가 대다수인 정합에서 잘 작동하는 추정기도 있지만, 그 보장은 특정 문제와 오염 조건에서만 성립한다. 일반적인 SLAM 문제로 넓히는 일은 아직 남아 있다. 그럴듯한 해가 여러 개일 때는 list-decodable regression 같은 다중 가설 방법도 연구된다. 2024년에는 Cheng, Shi, Carlone의 후속 작업이 나왔다.

Rosen, Khosoussi, Holmes, Dissanayake, Barfoot, Carlone이 함께 쓴 *The SLAM Handbook* 6장은 이 주제를 149~181쪽(2026년 4월 21일 공개본 기준)에 걸쳐 다룬다. 같은 10년 동안 Ch.12, Ch.13, Ch.16에서 다루는 학습 기반 SLAM은 신경망이 해를 직접 예측하는 쪽으로 나아갔다.

# Ch.7 — Feature 기반 SLAM: ORB-SLAM 세 편

Ch.6에서 본 graph SLAM 연구를 거치며 pose graph optimization은 SLAM의 표준 방법이 됐다. Kümmerle 등(2011)의 g2o와 Kaess 등(2012)의 iSAM2 덕분에 큰 지도도 거듭 최적화할 수 있게 됐고, loop closure 비용도 감당할 만해졌다. backend가 갖춰지자 남은 과제는 어떤 특징을 어떻게 뽑아 추적하느냐였다.

PTAM은 Klein과 Murray가 2007년에 tracking과 mapping을 두 스레드로 나눈 시스템으로, 작은 실내 장면에서만 돌았다. 2015년 Zaragoza 대학의 Raúl Mur-Artal은 이 구조에 Rublee(2011)의 ORB 서술자, Gálvez-López와 Tardós(2012)의 DBoW2 장소 인식, Strasdat의 covisibility 기반 지역 지도와 scale drift를 고려한 loop closing을 더해 ORB-SLAM을 만들었다. ORB-SLAM은 그 뒤 10년 가까이 비교 기준으로 쓰였다.

---

## 7.1 ORB-SLAM (2015)

[Mur-Artal, Montiel & Tardós 2015. ORB-SLAM](https://doi.org/10.1109/TRO.2015.2463671)은 IEEE Transactions on Robotics에 실렸다. 이름 그대로 ORB feature를 쓰는 SLAM이다. 논문은 tracking, mapping, relocalization, loop closing에 모두 같은 feature를 쓴 것을 첫 기여로 꼽았다.

시스템은 Tracking, Local Mapping, Loop Closing 세 스레드로 이루어진다. PTAM은 Tracking과 Mapping 두 스레드였고, Mur-Artal은 Loop Closing이라는 세 번째 스레드를 추가했다. Loop Closing 스레드는 DBoW2로 장소를 알아보고, Essential graph로 포즈 그래프를 최적화한다. 스레드를 이렇게 나눈 덕분에 Tracking 스레드는 지도를 고치는 동안에도 실시간으로 돈다. loop closure 뒤 전역 Bundle Adjustment를 네 번째 스레드로 돌리는 것은 ORB-SLAM2부터다.

> 🔗 **차용.** PTAM(Klein & Murray, 2007)의 Tracking–Mapping 분리가 ORB-SLAM의 Tracking–Local Mapping으로 그대로 이어졌다. 논문 서론은 PTAM의 주요 아이디어를 바탕으로 삼았다고 밝힌다.

ORB-SLAM 논문은 frontend의 feature를 고른 기준을 밝혔다. 추출에 이미지 한 장당 33 ms보다 훨씬 적게 걸려야 해서 SIFT와 SURF(각각 약 300 ms), A-KAZE(약 100 ms)를 뺐고, 장소 인식에는 회전 불변성이 필요해서 BRIEF와 LDB를 뺐다. 그렇게 고른 ORB(Oriented FAST and Rotated BRIEF)는 Rublee et al.이 2011년 ICCV에서 발표한 서술자로, FAST keypoint에 방향을 붙이고 BRIEF를 그 방향에 맞춰 회전시켰다. 원 논문은 SIFT보다 약 100배 빠르다고 보고했고, SIFT와 SURF의 라이선스 제약이 없다는 점을 또 하나의 장점으로 들었다. binary 서술자라서 Hamming 거리로 매칭하고, GPU 없이 CPU만으로도 실시간으로 돈다.

ORB는 image pyramid로 크기 변화에 대응한다. ORB-SLAM은 원본 이미지를 1.2배씩 줄여 8단계 피라미드를 만들고, 단계마다 따로 FAST keypoint를 검출한다. keypoint의 방향(orientation)은 intensity centroid로 정한다. 패치 안 픽셀 밝기의 1차 모멘트로 밝기 중심을 구하고, keypoint에서 그 중심을 향하는 방향각 θ만큼 BRIEF의 비교 쌍을 돌려 회전에 불변인 서술자를 만든다. 결과는 256비트 binary vector다. 두 서술자의 거리는 XOR한 뒤 1인 비트 수를 세는 Hamming 거리로 계산한다.

> 🔗 **차용.** [Rublee et al. 2011. ORB](https://doi.org/10.1109/ICCV.2011.6126544)의 서술자 이름이 시스템 이름이 됐다. ORB를 만든 사람은 Willow Garage의 Rublee, Rabaud, Konolige, Bradski다. Mur-Artal은 이미 있던 도구를 가져와 파이프라인을 짰다.

keyframe을 다루는 방식도 PTAM과 다르다. ORB-SLAM은 keyframe을 넉넉히 넣은 뒤, covisibility graph를 보고 중복된 keyframe을 지운다. **Covisibility graph**는 두 keyframe이 함께 보는 landmark 수를 엣지 가중치로 삼는 그래프다. 함께 보는 landmark가 15개 이상인 keyframe 쌍이 연결된다. Local Mapping은 이 그래프로 지역 window를 고르고, 그 안에서만 bundle adjustment를 돌린다.

**Essential graph**는 covisibility graph의 부분 그래프로, 함께 보는 landmark가 100개 이상인 엣지와 spanning tree, loop closure 엣지만 남긴다. 루프가 감지되면 이 그래프 전체를 포즈 그래프로 최적화한다. keyframe이 수천 개여도 Essential graph의 엣지는 적어서 최적화가 몇 초 안에 끝난다.

> 🔗 **차용.** [Strasdat et al. 2011. Double Window Optimisation](https://doi.org/10.1109/ICCV.2011.6126517)은 PTAM의 frontend를 쓰되 covisibility graph에서 뽑은 지역 지도에서만 추적했다. 안쪽 window에서는 BA를, 바깥 window에서는 포즈 그래프 최적화를 돌렸다. ORB-SLAM 논문은 covisibility로 지역 지도를 고르는 생각을 이 논문에서, 7자유도(similarity) 포즈 그래프로 loop를 닫는 생각을 Strasdat 등의 2010년 scale drift 연구에서 가져왔다고 밝힌다. Essential graph는 ORB-SLAM이 새로 정의한 희소 포즈 그래프다.

loop closure에 필요한 장소 인식은 DBoW2가 맡는다. [Gálvez-López & Tardós 2012. DBoW2](https://doi.org/10.1109/TRO.2012.2197158)는 binary 서술자로 vocabulary tree를 만든 첫 방법이다. binary 서술자를 k-medians(k-means++ seeding)로 계층적으로 군집화해 트리 모양 vocabulary를 만든다. 논문은 FAST keypoint와 BRIEF 서술자로 실험했고, ORB-SLAM은 같은 방식으로 ORB 서술자 vocabulary를 만들었다. 트리의 분기 수 $k_w$와 깊이 $L_w$가 정해지면 leaf 노드(word) 수는 $k_w^{L_w}$다. DBoW2 논문은 $k_w=10$, $L_w=6$으로 단어 100만 개짜리 vocabulary를 썼고, ORB-SLAM도 같은 크기의 vocabulary를 쓴다. word마다 TF-IDF(Term Frequency–Inverse Document Frequency) 가중치가 붙는다. keyframe 데이터베이스 전체에 자주 나오는 word일수록 IDF 가중치가 낮아서, 장소를 잘 구별하는 word가 더 큰 영향을 준다. keyframe은 이 가중 BoW(bag of words) 벡터로 나타내고, word마다 그 word가 나온 keyframe 목록(inverted index)을 둔다. 새 프레임의 서술자는 vocabulary tree를 깊이 $L_w$만큼만 내려가면 word가 정해지고, 후보 keyframe은 inverted index에서 바로 찾으므로 지도 전체를 훑을 필요가 없다.

Tracking 스레드는 프레임마다 현재 포즈를 추정한다. 이전 프레임과 feature를 매칭한 뒤 motion-only bundle adjustment로 포즈 $\mathbf{T}_{cw} \in SE(3)$를 다듬는다. 3D–2D 대응 $\{(\mathbf{X}_i, \mathbf{u}_i)\}$로 세운 기본 reprojection 목적함수는 다음과 같다.

$$\mathbf{T}^* = \arg\min_{\mathbf{T}} \sum_i \left\| \mathbf{u}_i - \pi(\mathbf{T}\mathbf{X}_i) \right\|^2$$

여기서 $\pi$는 카메라 투영 함수, $\mathbf{X}_i$는 맵 포인트의 월드 좌표, $\mathbf{u}_i$는 이미지 좌표다. 실제 포즈 최적화는 robust loss와 관측 가중치를 쓰고, 맵 포인트를 고정한 채 현재 카메라 포즈만 바꾼다. 추적을 잃었을 때 재위치 추정(relocalization)은 EPnP와 RANSAC으로 초기 포즈 후보를 구한다. 이웃 keyframe과 맵 포인트를 함께 고치는 local BA는 Local Mapping 스레드가 맡는다.

KITTI 시퀀스 00(564×496 m 범위, keyframe 1,391개)에서 ORB-SLAM의 keyframe 궤적 RMSE는 6.68 m였다(논문 Table V, 다섯 번 실행한 값의 중앙값). 단안 시스템이라 절대 scale은 알 수 없어서, 참값과 비교할 때는 similarity 변환으로 궤적을 맞춘 뒤 오차를 쟀다. 이 시퀀스에서 루프를 닫아 누적 오차를 줄인 것은 DBoW2와 Essential graph였다.

## 7.2 ORB-SLAM2 (2017) — stereo/RGB-D

ORB-SLAM(2015)은 단안 카메라만 지원했다. 단안 영상으로 복원한 지도와 궤적은 어떤 배율(scale)을 곱해도 관측과 똑같이 맞아서, 실제 크기를 알 수 없다.

[Mur-Artal & Tardós 2017. ORB-SLAM2](https://doi.org/10.1109/TRO.2017.2705103)는 stereo와 RGB-D를 지원해 이 문제를 풀었다. stereo는 두 카메라 사이 거리(baseline)를 알기 때문에 depth를 바로 삼각측량하고, RGB-D는 센서가 깊이를 직접 잰다. 어느 쪽이든 scale을 알 수 있다.

구조는 mono와 같은 세 스레드이고, 여기에 전역 BA를 맡는 네 번째 스레드가 붙는다. 센서 종류에 따라 달라지는 것은 frontend의 입력 처리다. stereo는 rectified 이미지 쌍에서 ORB를 추출하고 좌우 매칭으로 depth를 구한다. 좌우 대응이 있는 특징점은 **stereo 관측**으로, 한쪽에서만 검출된 특징점은 **monocular 관측**으로 쓴다. 깊이를 구한 점은 다시 가까운 점과 먼 점으로 나눈다. 깊이가 baseline의 40배보다 작으면 가까운 점이다. 가까운 점은 translation을 정확히 잡아 주고, 먼 점은 회전 추정에 주로 기여한다.

**Stereo 초기화**는 첫 프레임에서 바로 끝난다. mono 초기화는 두 프레임 사이의 fundamental matrix나 homography로 지도를 만들기 때문에 scale을 알 수 없다. Stereo는 첫 keyframe에서 좌우 이미지의 수평 시차(disparity) $d$, baseline $b$, 초점 거리 $f$로 depth를 계산한다.

$$Z = \frac{b \cdot f}{d}$$

ORB-SLAM2는 첫 프레임을 keyframe으로 삼아 원점에 두고, 깊이를 구한 stereo 특징점 전부로 초기 지도를 만든다. RGB-D 초기화도 원리가 같다. depth 이미지에서 픽셀 $(u, v)$의 depth 값 $Z$를 읽고, 역투영(back-projection)으로 3D 좌표를 얻는다. 어느 쪽이든 처음부터 scale이 정해진다.

EuRoC MAV(Micro Aerial Vehicle) 데이터셋 Machine Hall 01 시퀀스에서 ORB-SLAM2(stereo)의 translation RMSE는 0.035 m였다(Table II). 논문은 같은 표에서 ORB-SLAM2가 Stereo LSD-SLAM보다 정확했다고 보고했다. 다만 V2_03 시퀀스에서는 심한 motion blur 때문에 추적을 일부 잃었다.

Mur-Artal과 Tardós는 mono, stereo, RGB-D 세 모드를 한 코드베이스로 GitHub에 공개했다. 저장소의 star는 수천 개를 넘었고, ROS 예제도 함께 들어 있었다.

## 7.3 ORB-SLAM3 (2021): Atlas와 Visual-Inertial

2021년 IEEE Transactions on Robotics에 실린 [Campos et al. 2021. ORB-SLAM3](https://doi.org/10.1109/TRO.2021.3075644)는 저자가 바뀌었다. Carlos Campos와 Richard Elvira가 공동 1저자이고, Juan J. Gómez Rodríguez, J.M.M. Montiel, Juan D. Tardós가 함께 썼다. 모두 Zaragoza 대학 연구자이고, Mur-Artal은 저자 목록에 없다.

ORB-SLAM3는 **Atlas**(멀티맵)와 **Visual-Inertial** 모드를 추가했다.

Atlas는 서로 떨어진 지도 여러 개를 함께 유지한다. 추적이 실패하면 지금 지도를 닫고 새 지도를 시작하며, 나중에 같은 장소를 다시 지나면 두 지도를 합친다. ORB-SLAM과 ORB-SLAM2도 추적을 잃으면 기존 지도에서 재위치 추정을 시도했다. 그러나 재위치 추정에 실패한 뒤 새 지도를 시작하면 이전 지도와 함께 관리하거나 합치지 못했다. ORB-SLAM3는 Atlas 덕분에 추적에 실패해 다시 초기화해도 이전 지도를 버리지 않는다.

Visual-Inertial(VI) 모드는 IMU 데이터를 함께 쓴다. IMU 측정은 Forster 등의 preintegration 방식으로 처리한다. Forster 등은 이 방식을 RSS 2015에 발표하고, 2017년 IEEE TRO에 [On-Manifold Preintegration for Real-Time Visual-Inertial Odometry](https://doi.org/10.1109/TRO.2016.2597321)로 확장해 실었다. IMU는 카메라가 빠르게 움직여 영상만으로는 추적을 놓치기 쉬울 때 도움이 된다. 단안 카메라로는 알 수 없던 scale도 구할 수 있다. 가속도계는 미터 단위로 가속도를 재고, 중력 방향도 알려 주기 때문이다.

keyframe $i$와 $j$ 사이의 IMU 측정은 한 번만 적분해 둔다. 가속도계와 자이로스코프의 측정값을 $\tilde{\mathbf{a}}_t = \mathbf{a}_t + \mathbf{b}_a + \mathbf{n}_a$, $\tilde{\boldsymbol{\omega}}_t = \boldsymbol{\omega}_t + \mathbf{b}_g + \mathbf{n}_g$로 모델링하면(bias $\mathbf{b}$, noise $\mathbf{n}$), 두 keyframe 사이의 상대 회전, 속도, 위치 변화량은 다음과 같이 미리 적분(preintegration)한다.

$$\Delta\mathbf{R}_{ij} = \prod_{k=i}^{j-1} \mathrm{Exp}\bigl((\tilde{\boldsymbol{\omega}}_k - \mathbf{b}_g)\Delta t\bigr)$$
$$\Delta\mathbf{v}_{ij} = \sum_{k=i}^{j-1} \Delta\mathbf{R}_{ik}\,(\tilde{\mathbf{a}}_k - \mathbf{b}_a)\Delta t$$
$$\Delta\mathbf{p}_{ij} = \sum_{k=i}^{j-1}\!\left[\Delta\mathbf{v}_{ik}\Delta t + \tfrac{1}{2}\Delta\mathbf{R}_{ik}\,(\tilde{\mathbf{a}}_k - \mathbf{b}_a)\Delta t^2\right]$$

여기서 $\mathrm{Exp}(\cdot)$는 $\mathfrak{so}(3)$의 지수 사상이다. BA 중에 bias 추정값이 바뀌면 처음부터 다시 적분하지 않고 1차 선형 근사로 보정한다. ORB-SLAM3는 이 preintegrated 항($\Delta\mathbf{R}$, $\Delta\mathbf{v}$, $\Delta\mathbf{p}$)을 factor graph의 inertial edge로 넣어 visual reprojection residual과 함께 최적화한다.

> 🔗 **차용.** ORB-SLAM3의 관성 측정 처리는 Forster 등의 On-Manifold Preintegration(TRO 2017, 처음 발표는 RSS 2015)을 바탕으로 한다. Forster의 수식은 연속된 IMU 측정을 bias 보정과 함께 SO(3) manifold 위에서 적분한다. ORB-SLAM3는 이 결과를 factor graph 최적화에 넣었다.

EuRoC MAV 11개 시퀀스의 평균 ATE(절대 궤적 오차) RMSE에서 ORB-SLAM3(mono-inertial)는 0.043 m였다(Table II). 같은 표에서 VINS-Mono는 0.110 m, Kimera(stereo-inertial)는 0.119 m였다. 논문은 단일 세션 mono-inertial 기준으로 ORB-SLAM3가 VINS-Mono보다 2.6배 정확하다고 썼다.

## 7.4 2020년대에도 비교 기준으로 쓰이는 이유

2023년에도 학회 논문들은 ORB-SLAM3를 비교표에 넣었다.

ORB feature는 조명 변화에 어느 정도 강하다. binary 서술자라 계산이 빨라서 점을 많이 뽑아도 실시간으로 돌고, 그만큼 추적 실패가 줄어든다. learned feature는 특정 데이터셋에서 더 정확하지만, 학습 데이터와 다른 환경에서는 성능이 크게 떨어지기도 한다.

코드가 공개되어 있고 ROS와 함께 쓰기도 쉽다. 코드베이스 하나가 mono, stereo, RGB-D, IMU를 모두 지원하므로, 새 방법을 ORB-SLAM3(stereo)나 ORB-SLAM3(mono-inertial)과 설정별로 나란히 비교할 수 있다.

DROID-SLAM(Teed & Deng, NeurIPS 2021)은 여러 시퀀스에서 ORB-SLAM3보다 정확했다. 그러나 논문은 RTX 3090 GPU 두 장이면 실시간으로 돈다고 했고, EuRoC, TartanAir, ETH-3D 결과를 내려면 메모리 24 GB짜리 GPU가 필요하다고 적었다. 카메라가 빠르게 움직이는 TartanAir에서는 평균 8 fps로 실시간에 못 미쳤다. ORB-SLAM3는 CPU만으로 돌고, 사용자 보고에 따르면 ARM 임베디드 보드에서도 돌아간다.

---

## 📜 예언 vs 실제

> 📜 **예언 vs 실제.** Mur-Artal은 2015년 ORB-SLAM 논문 Section IX-C(Future Work)에서 먼저, 시차가 부족해 지도에 넣지 못한 먼 점(points at infinity)을 tracking에 써서 정확도를 높이자고 했다. 논문은 이런 점이 카메라 회전에 관해 정보가 많다고 적었다. 이어서 희소한 지도를 더 조밀한 복원으로 키우자고 했다. 잘 고른 keyframe은 포즈가 정확하고 covisibility 정보가 풍부해서 dense 지도의 초기값이자 골격이 될 수 있다고 봤다. 먼 점 활용은 VI-SLAM과 후속 연구에 일부 반영됐다. dense 복원은 2020년대 NeRF-SLAM과 Gaussian Splatting 연구가 희소한 keyframe에 dense 표현을 붙이는 방식으로 이어졌다. stereo, RGB-D, IMU 지원은 이 절에 없던 주제였고, ORB-SLAM2(2017)와 ORB-SLAM3(2021)에서 따로 다뤘다.

> 📜 **예언 vs 실제.** Campos 등은 2021년 ORB-SLAM3 논문 결론에서 ORB-SLAM3가 주로 실패하는 곳이 텍스처가 적은 환경이라고 적었다. 그리고 논문이 다룬 네 가지 data association 문제에 맞는 photometric 기법을 흥미로운 연구 방향으로 꼽았다. 저자들은 이 생각을 인체 내부 내시경 영상으로 지도를 만드는 데 시험하고 있었다. 2023–2025년에는 SuperPoint나 LightGlue 같은 learned frontend를 ORB-SLAM3에 붙이는 연구가 더 많이 나왔다. photometric 기법은 DSO, LDSO 같은 direct 방법에서 따로 발전했다. ORB-SLAM3 공식 저장소 main branch는 2026년 현재도 전통 ORB descriptor를 쓴다.

---

## 🧭 아직 열린 것

**지도의 장기 재사용.** Atlas로 지도 여러 개를 유지할 수는 있게 됐지만, 조명이 크게 달라지면 지도 병합이 실패할 수 있다. 아침에 지도를 만든 곳에 저녁에 다시 오면 같은 곳으로 알아봐야 하는데, 겉모습이 크게 바뀌면 DBoW2가 놓친다. 계절이 바뀌는 실외 환경에서는 이 문제가 장기 자율주행 연구의 과제로 남아 있다.

**전통 feature는 아직 기준선인가.** learned feature를 쓰는 시스템들이 표준 benchmark에서 ORB-SLAM3를 앞서기 시작했다. SuperPoint와 SuperGlue 조합, LightGlue, DINOv2 기반 feature가 특정 시퀀스에서 더 낮은 오차를 낸다. 학습 분포 밖의 환경에서 learned feature가 전통 ORB보다 나쁜 결과를 내는 경우가 보고된다.

**넓은 실외의 drift.** 도심 주행이나 수 km가 넘는 경로에서 ORB-SLAM3는 여전히 LiDAR SLAM보다 덜 정확하다. 조명과 날씨가 바뀌고, 물체가 움직이고, 텍스처 없는 구간이 겹치면 drift가 쌓인다.

---

ORB-SLAM 세 편이 feature 기반 SLAM의 표준이 되던 무렵, Newcombe와 Engel은 이미지의 밝기 값을 직접 쓰는 방법을 만들고 있었다. 두 방식은 2010년대 내내 함께 발전하며 서로를 비교 대상으로 삼았다. DSO 논문은 loop closure와 relocalization을 끈 단안 ORB-SLAM과 비교해 TUM monoVO와 ICL-NUIM에서 DSO가 더 정확했다고 보고했다(Ch.8 §3).

# Ch.7b — IMU Preintegration: IMU 측정을 factor graph의 제약으로

2009년 시드니 대학교 ACFR(Australian Centre for Field Robotics)의 Todd Lupton과 Salah Sukkarieh는 빠르게 움직이는 플랫폼에서 얻은 IMU 측정을 추정기에 넣는 문제를 다뤘다. IMU는 초당 수백 번 측정값을 내지만 keyframe은 초당 몇 개뿐이다. 그 사이에 쌓이는 측정 수십·수백 개를 한 묶음으로 다룰 방법이 필요했다. Lupton과 Sukkarieh가 IROS 2009에 낸 논문에서 preintegration(사전 적분)이 시작됐다. 6년 뒤인 2015년 RSS에서 Christian Forster는 Luca Carlone, Frank Dellaert, Davide Scaramuzza와 함께 이 방법을 SO(3) manifold 위에서 다시 정식화했다. Ch.7의 ORB-SLAM3, Ch.8의 VI-DSO, Ch.17의 LIO-SAM은 이 수식을 따로 유도하지 않고 Forster의 논문을 인용한다. FAST-LIO는 다른 방식을 쓴다. IMU 원측정으로 상태를 그대로 전파하고 iterated filter로 갱신한다.

---

## 7b.1 MEMS IMU의 보급

preintegration이 필요해진 것은 IMU가 싸진 뒤였다. 관성항법은 1950년대 항공우주 분야에서 시작됐다. 잠수함이나 미사일에 쓰던 ring laser gyro는 수만 달러짜리 장비여서 로봇 연구자들이 쓸 일이 없었다. 이 사정을 바꾼 것이 MEMS(Micro-Electro-Mechanical Systems, 반도체 공정으로 만든 초소형 기계 소자)다. Analog Devices의 ADXL 가속도계와 InvenSense의 MPU 시리즈가 나오면서 6축 IMU 가격이 몇 달러로 내려갔다. 2007년 첫 iPhone에 가속도계가 들어갔고, 2010년 iPhone 4에 자이로스코프가 들어갔다. 스마트폰이 수십억 대 팔리며 단가가 떨어지던 무렵, Visual SLAM 연구자들은 단안 카메라의 scale 문제(Ch.5 🧭)를 본격적으로 고민하고 있었다.

측정 모델은 간단하다. 가속도계는 중력이 섞인 specific force(비력) $\tilde{\mathbf{a}} = \mathbf{R}_w^b(\mathbf{a}^w - \mathbf{g}^w) + \mathbf{b}^a + \boldsymbol{\eta}^a$를 재고, 자이로스코프는 각속도 $\tilde{\boldsymbol{\omega}} = \boldsymbol{\omega}_b^b + \mathbf{b}^g + \boldsymbol{\eta}^g$를 잰다. 여기서 $\mathbf{b}$는 bias, $\boldsymbol{\eta}$는 white noise다. bias는 시간에 따라 천천히 변하므로 random walk로 모델링한다. bias는 온도와 전원 상태에 따라서도 조금씩 달라져 다루기 까다로웠다. MEMS 잡음은 고주파 성분이 크다. 가속도계 측정에는 늘 중력이 섞여 있다. 그래서 IMU를 쓰는 시스템은 중력 방향을 추정해 world frame을 그 방향에 맞추는 경우가 많다.

---

## 7b.2 첫 시도: Lupton & Sukkarieh (2009 / 2012)

어려움은 측정 주기의 차이에서 왔다. Ch.6에서 본 iSAM2는 keyframe마다 pose를 노드로 둔다. 그런데 IMU는 keyframe 사이에 측정을 수십 번 낸다. 측정마다 노드를 만들면 그래프가 감당할 수 없이 커지고, 측정을 버리면 정보를 잃는다.

Lupton과 Sukkarieh는 IROS 2009 논문 [Efficient Integration of Inertial Observations into Visual SLAM without Initialization](https://doi.org/10.1109/IROS.2009.5354267)에서 이 문제에 답했다. 2012년 IEEE TRO에는 확장판 [Visual-Inertial-Aided Navigation for High-Dynamic Motion in Built Environments Without Initial Conditions](https://doi.org/10.1109/TRO.2011.2170332)이 실렸다. 두 사람은 keyframe $i$와 $j$ 사이의 IMU 측정을 *한 번만* 적분해 상대 증분을 만들어 두었다. 이 증분은 초기 자세나 속도를 몰라도 계산할 수 있다. 증분을 제약 하나로 쓰면 IMU 원측정을 하나하나 추정기에 넣지 않아도 된다. "pre-integration"이라는 이름이 이 논문에서 나왔다.

구현에는 걸림돌이 있었다. 먼저 회전을 Euler angle로 나타냈다. Euler angle에는 특이점(gimbal lock)이 있고, 회전이 이루는 manifold 구조를 반영하지 못한다. 더 큰 문제는 bias였다. 최적화를 한 번 돌릴 때마다 bias 추정값이 바뀌고, bias가 바뀌면 증분도 달라진다. 증분을 매번 다시 적분하면 keyframe마다 측정 수백 개를 다시 처리해야 한다. Lupton과 Sukkarieh는 bias가 바뀐 만큼 증분을 1차 근사로 고치는 방법을 함께 내놓았다. 6년 뒤 Forster 등은 이 보정을 SO(3) 위에서 다시 정식화했다.

## 7b.3 Forster 등의 on-manifold preintegration (2015 / 2017)

2015년 RSS에서 University of Zurich(UZH)의 박사과정생 Christian Forster가 [IMU Preintegration on Manifold for Efficient Visual-Inertial Maximum-a-Posteriori Estimation](https://www.roboticsproceedings.org/rss11/p06.pdf)을 발표했다. 공저자는 지도교수 Davide Scaramuzza(UZH)와 Georgia Tech의 Luca Carlone(이후 MIT), Frank Dellaert(GTSAM을 만든 사람)였다. 2017년 IEEE TRO에는 확장판 [On-Manifold Preintegration for Real-Time Visual-Inertial Odometry](https://doi.org/10.1109/TRO.2016.2597321)가 실렸다. 저자들은 GTSAM의 iSAM2 위에 VIO를 구현했다. 실험에는 VI-Sensor로 기록한 430 m 실내 궤적을 썼고, 센서를 Google Tango 기기에 붙여 사무실 건물 둘레를 걸은 실외 궤적도 썼다.

Forster 등은 먼저 $\Delta\mathbf{R}_{ij}$를 SO(3)의 상대 회전으로 엄밀하게 정의했다. 이어 $\Delta\mathbf{v}_{ij}, \Delta\mathbf{p}_{ij}$를 *중력과 초기 상태에 독립*이 되도록 다시 정의했다. 이 양은 물리적인 속도·위치 변화량과 다르다. 상태에 의존하지 않도록 수학적으로 구성한 값이다. 그래서 한 번 계산한 preintegration 값으로 IMU factor를 여러 번 평가할 수 있다. residual에는 양 끝의 pose와 속도, 중력, bias 보정이 함께 들어간다. 다음으로 잡음 항을 지수 사상 바깥으로 빼내는 right Jacobian 기법을 써서 공분산 $\boldsymbol{\Sigma}_{ij}$를 해석적으로 전파했다.

마지막은 **bias 1차 Jacobian 보정**이다. 최적화를 반복하는 동안 bias가 조금 바뀌면, 미리 계산해 둔 편미분으로 증분을 1차 근사만큼 고친다. keyframe 사이를 처음 적분할 때 편미분을 함께 계산해 두면, bias가 조금 바뀌어도 다시 적분하지 않고 factor를 갱신할 수 있다. 계산이 이만큼 줄어서 IMU factor를 실시간 최적화에 넣기 쉬워졌다.

저자들은 preintegration 구현을 GTSAM 4.0에 공개했다. 그 뒤 여러 시스템이 수식을 직접 구현하지 않고 GTSAM의 `ImuFactor`를 `#include`해 썼다.

> 🔗 **공통 수학.** Forster의 on-manifold preintegration은 SO(3)의 지수 사상과 right Jacobian으로 회전의 불확실성을 다룬다. [Barfoot 2017. *State Estimation for Robotics*](https://doi.org/10.1017/9781316671528)는 이런 Lie group 계산을 상태 추정 전반에 걸쳐 정리했다. 이 책은 Forster의 2015년 논문보다 2년 뒤에 나왔다. 두 작업은 같은 수학을 쓴다.

> 🔗 **차용.** bias 1차 보정은 [Lupton & Sukkarieh 2012](https://doi.org/10.1109/TRO.2011.2170332)가 먼저 제시했다. Forster et al.은 자신들의 보정이 "similar to the bias correction in [Lupton & Sukkarieh] but operates directly on SO(3)"라고 적었다.

## 7b.4 실제 VIO 시스템들

2007–2022년에 나온 VIO 시스템은 필터 기반, 최적화 기반, direct 방식으로 나눠 볼 수 있다.

필터 기반 VIO는 Forster보다 먼저 나왔다. 2007년 University of Minnesota의 Anastasios Mourikis와 Stergios Roumeliotis가 ICRA에 낸 [MSCKF(Multi-State Constraint Kalman Filter)](https://doi.org/10.1109/ROBOT.2007.364024)에서 시작했다. MSCKF는 stochastic cloning(과거 상태를 복제해 필터에 남기는 기법)으로 과거 카메라 포즈 여러 개를 필터 상태에 남겨 둔다. 관측한 3D 점은 상태에 넣지 않는다. 대신 선형화한 관측식을 점 Jacobian의 left null space로 투영해, 점 위치 오차가 관측식에 끼치는 영향을 없앤다. preintegration 없이 EKF로 visual-inertial 추정을 실시간으로 돌린 초기 사례다. 2021년 화성에서 비행한 NASA JPL의 Ingenuity 헬리콥터는 MAVeN이라는 EKF로 위치를 추정했다. MAVeN도 base image를 찍은 시점의 위치와 자세를 복제 상태(clone state)로 필터에 넣는다. University of Delaware의 Guoquan Huang 그룹은 2020년 MSCKF 기반 [OpenVINS](https://doi.org/10.1109/ICRA40945.2020.9196524)를 오픈소스로 공개했다.

최적화 기반의 대표는 HKUST의 Tong Qin, Peiliang Li, Shaojie Shen이 2018년 TRO에 낸 [VINS-Mono](https://doi.org/10.1109/TRO.2018.2853729)다. VINS-Mono는 preintegration한 IMU 측정을 sliding window tightly-coupled BA에 factor로 넣는다. 초기화 단계에서 scale과 중력 방향을 따로 추정하는 절차도 정리했다. 코드가 공개되어 있어 2019–2022년 학회 논문들이 VIO 비교 기준으로 썼다. Ch.7의 ORB-SLAM3 논문 표를 보면, EuRoC 11개 시퀀스의 단안-관성 평균 ATE가 ORB-SLAM3는 0.043 m, VINS-Mono는 0.110 m였다.

direct 방식으로는 Ch.8에서 다룬 VI-DSO(ICRA 2018)와 [DM-VIO(RA-L 2022)](https://doi.org/10.1109/LRA.2021.3140129)가 있다. TUM Cremers 그룹은 VI-DSO에서 DSO의 photometric BA에 inertial factor를 더했다. DM-VIO에서는 *delayed marginalization*을 더했다. IMU 초기화가 끝나기 전에 marginalize하면 잘못된 scale이 prior에 굳는다. DM-VIO는 주 그래프 옆에 marginalization을 일정 keyframe 수만큼 늦게 하는 두 번째 factor graph를 둔다. IMU 초기화가 끝나면 이 그래프에 IMU factor를 넣고 다시 marginalize해, 주 시스템에 쓸 새 prior를 만든다.

## 7b.5 Observability

Minnesota의 Hesch, Kottas, Bowman, Roumeliotis는 2014년 TRO 논문에서 외부 기준이 없는 visual-inertial 시스템에 관측할 수 없는 방향이 **넷** 있음을 보였다. 전역 위치 3자유도와 중력축 둘레의 회전(yaw) 1자유도다. 이 네 방향으로 상태를 옮겨도 IMU와 카메라 측정값은 그대로다. GPS를 더하면 위치를, 자기장이나 외부 기준점을 더하면 yaw를 구할 수 있다.

*roll과 pitch는 관측된다*. 가속도계가 중력 방향을 재므로 수평을 알 수 있다. IMU를 붙이면 Ch.5에서 본 단안 카메라의 scale도 관측할 수 있다. 다만 아래처럼 운동이 충분해야 한다.

더 까다로운 것은 degenerate motion(관측 정보가 부족해지는 운동)이다. 전역 yaw는 어떻게 움직여도 관측할 수 없다. 여기에 시차나 가속이 부족하면 깊이·scale·bias까지 구별하기 어려워질 수 있다. 드론이 제자리 비행을 하거나 자동차가 일정한 속도로 직진할 때가 그렇다. 이륙, 제동, 선회는 정보를 더하지만, 어떤 동작 하나가 scale 추정을 보장하지는 않는다.

> 📜 **예언 vs 실제.** Forster et al.의 TRO 논문 결론(§IX)은 앞으로 할 연구를 따로 꼽지 않았다. 대신 preintegration과 structureless vision factor의 코드를 GTSAM 4.0에 공개한다고 밝혔다. 그 뒤 카메라–IMU 시간 offset은 Kalibr, VINS-Mono, OpenVINS가 추정 대상에 넣으면서 흔히 함께 추정하는 값이 됐다. 비동기 센서 문제에는 Le Gentil의 GP 연속시간 preintegration이 한 가지 답을 내놓았다.

---

## 7b.6 연속시간 preintegration

2021년 RSS에서 UTS(University of Technology Sydney)의 Cédric Le Gentil과 Teresa Vidal-Calleja가 [Continuous Integration over SO(3) for IMU Preintegration](https://roboticsproceedings.org/rss17/p078.pdf)을 발표했다. UTS는 Lupton이 연구한 ACFR과 같은 시드니에 있다.

Forster의 preintegration은 이산적이다. IMU 측정 사이에서는 값이 일정하다고 보고 Euler 적분을 한다. LiDAR나 event camera처럼 측정 시각이 IMU와 맞지 않는 센서가 섞이면, IMU 표본 사이 시각의 상태를 계산해야 한다. 측정 시각이 어긋난다고 구간 상수 근사가 깨지지는 않지만, 시간 보간이 얼마나 정확한지가 중요해진다. Le Gentil은 각속도를 **Gaussian Process**(GP)로 모델링해 연속 함수로 다뤘다. 아무 시각 $\tau$에서나 상태를 계산할 수 있으므로 비동기 측정을 그대로 넣을 수 있다. 논문은 IMU bias와 센서 사이 시간 차이를 보정하는 방법도 함께 냈다.

이 연구는 B-spline, STEAM, GPMP 같은 연속시간 추정 연구와 이어진다(Ch.7c).

---

## 7b.7 가져온 것들

> 🔗 **차용.** IMU factor를 factor graph에서 평가하고 최적화하는 구조는 Ch.6에서 본 [Dellaert의 GTSAM](https://gtsam.org/)을 그대로 따른다. `ImuFactor`는 GTSAM의 `NoiseModelFactor` 인터페이스를 구현하므로, visual reprojection factor와 함께 하나의 `Values` 객체로 최적화된다.

> 🔗 **차용.** bias를 random walk로 다루는 방식은 Ch.4에서 본 Kalman filter의 상태 전파 관습에서 왔다. 항법 분야는 Lupton 이전부터 bias를 상태에 넣고 process noise를 작게 주는 모델을 썼다. preintegration에서는 이 모델이 bias random walk factor가 됐다.

---

## 🧭 아직 열린 것

**관측 가능성을 실시간으로 감지하기.** 4차원 null space와 degenerate motion은 이론으로 정리됐다. Huang, Mourikis, Roumeliotis가 제안한 FEJ(First-Estimate Jacobian)는 선형화할 때 null space를 보존한다. 실행 중에 degenerate 구간의 시작과 끝을 알아내 제어 루프에 알려 주는 일은 남은 과제다.

**Preintegration과 continuous-time의 통합.** Forster의 이산 증분과 Le Gentil의 GP 연속 표현은 같은 문제를 다른 수학으로 푼다. LiDAR, event camera, 일반 카메라를 섞어 쓸 때 어느 표현을 기본으로 삼을지는 정해지지 않았다. B-spline 연속시간 BA는 Ch.7c에서 다룬다.

**학습 기반 IMU bias 모델.** bias random walk 가정은 navigation-grade IMU에서는 맞지만, consumer MEMS에서는 온도 hysteresis와 전원 과도 현상 때문에 어긋난다. TLIO와 RoNIN 같은 연구는 IMU만 쓰는 odometry를 신경망으로 학습했다. 최근에는 conditional diffusion으로 bias 분포를 모델링하려는 시도도 나왔다. 이런 학습 모델을 Forster의 factor에 어떻게 넣을지는 아직 정해지지 않았다.

---

Le Gentil의 연속시간 preintegration은 더 넓은 흐름의 한 갈래다. Ch.7c는 궤적 자체를 시간의 연속 함수로 두는 방법을 다룬다.

# Ch.7c — Continuous-Time Trajectory: 궤적을 시간의 연속 함수로

Ch.7b의 preintegration은 IMU 측정을 이산 keyframe 사이의 상대 factor 하나로 압축했다. 이 압축은 keyframe이라는 단위가 있어야 성립한다. 두 keyframe 사이에 들어온 관성 측정 100개를 factor 하나로 묶으려면 factor 양 끝의 시각이 분명해야 한다. 셔터가 이미지 전체에 한 번에 열리고 닫히는 카메라라면 이 가정에 문제가 없다. 그렇지 않은 센서도 있다.

rolling shutter 카메라로 찍은 이미지 한 장은 행마다 다른 시각의 자세로 투영된다. spinning LiDAR가 한 바퀴를 도는 사이에도 차량은 움직인다. IMU와 카메라도 서로 다른 주기로 측정값을 낸다. 2012년 ICRA에서 [Paul Furgale, Timothy Barfoot, Gabe Sibley](https://doi.org/10.1109/ICRA.2012.6225005)는 자세를 시간 t의 함수로 두고 이 센서들의 측정을 하나의 확률적 batch 추정 문제로 묶었다. 논문 제목은 "Continuous-time batch estimation using temporal basis functions"다. 세 사람은 유한한 개수의 temporal basis function(시간 기저 함수) 계수를 상태로 추정했다.

그 뒤 continuous-time trajectory는 rolling shutter 카메라, spinning LiDAR, event camera를 다루는 데 널리 쓰였다. 이 센서들은 한 프레임이나 한 scan 안에서도 측정 시각이 다르다. 앞 장의 visual-inertial 방법은 대부분 이산 keyframe을 바탕으로 했다.

## 7c.1 Discrete-time의 한계

Ch.7b의 preintegration은 IMU가 카메라보다 자주 측정한다는 문제를 다뤘다. 시간을 다루는 데에는 문제가 더 있다.

**Rolling shutter.** 소비자용 CMOS 카메라는 한 프레임을 위에서 아래로 일정 시간에 걸쳐 읽는다. 카메라가 빠르게 움직이면 첫 행과 마지막 행은 서로 다른 자세에서 찍힌다. Ch.8의 DSO와 LSD-SLAM은 프레임마다 자세가 하나라고 가정하므로 이 왜곡을 모델에 넣지 않았다. continuous-time 궤적을 쓰면 행마다 실제 노출 시각의 자세를 구할 수 있다.

**Spinning LiDAR의 motion distortion.** Ch.17에서 다루는 Velodyne HDL-64E는 기본 설정에서 10 Hz로 한 바퀴를 돈다. 차량이 10 m/s로 달리면 한 scan을 얻는 100 ms 동안 1 m를 이동한다. 그래서 한 scan의 점들은 저마다 다른 자세에서 찍힌다. LOAM은 이 왜곡을 odometry 루프 안에서 간접적으로 보정했다. 더 일반적인 방법은 점마다 그 점이 찍힌 순간의 자세를 구할 수 있는 궤적 표현이다.

**Event camera.** Ch.18에서 다루는 DVS는 픽셀마다 μs 단위로 비동기 이벤트를 낸다. 이벤트에는 프레임이 없다. Mueggler, Gallego, Scaramuzza는 [RSS 2015 논문](https://www.roboticsproceedings.org/rss11/p36.pdf)에서 궤적을 SE(3) 위의 cubic B-spline으로 표현해 event 기반 궤적 추정을 정식화했다.

**주기가 다른 여러 센서.** 고속 IMU를 측정 주기가 다른 여러 센서와 함께 쓸 때도 문제가 생긴다. 한 시스템에 200 Hz IMU, 20 Hz 카메라, 10 Hz LiDAR가 들어온다고 하자. 측정 시각마다 이산 상태 노드를 두면 상태 수가 측정 수만큼 늘고, factor graph가 지나치게 커진다.

이 문제들에서 측정 시각 $t_i$는 센서가 정한다. 관측은 아무 때나 들어오고, 추정기는 그 시각의 자세를 알아야 한다. continuous-time 표현은 측정 시각과 추정 시각, 조회 시각을 서로 떼어 내 이 문제를 다룬다.

## 7c.2 Parametric spline

Furgale·Barfoot·Sibley가 2012년에 고른 도구는 B-spline이었다. 궤적을 basis function의 합 $\mathbf{p}(t) = \sum_k \Psi_k(t)\,\mathbf{c}_k$로 쓰고, 계수 $\mathbf{c}_k$를 최적화 변수로 둔다. B-spline은 local support(국소 지지) 성질이 있다. 한 시점 t에서 0이 아닌 basis는 몇 개(보통 4개)뿐이다. 그래서 아무 시각 $t_i$의 자세든 일정한 비용으로 구할 수 있고, factor graph의 sparsity도 유지된다.

> 🔗 **차용.** B-spline의 수학은 [de Boor (1978) *A Practical Guide to Splines*](https://link.springer.com/book/10.1007/978-1-4612-6333-3)에 정리되어 있다. Furgale은 이를 로봇 자세 궤적에 쓰고, 계수를 최적화 변수로 두었다.

계수 간격을 좁게 잡으면 과적합이 생긴다. 넓게 잡으면 빠른 움직임을 놓친다. 간격은 경험으로 골랐다. 또 선형 B-spline을 SE(3)에 그대로 적용하면 보간 결과가 SE(3)를 벗어난다.

2013년 BMVC에서 [Steven Lovegrove, Alonso Patron-Perez, Gabe Sibley](https://doi.org/10.5244/C.27.93)는 "Spline Fusion"이라는 이름으로 cumulative B-spline을 제안했다. basis를 누적 곱 꼴 $T(t) = \prod_k \exp\bigl(\tilde\Psi_k(t) \log(T_k T_{k-1}^{-1})\bigr) \cdot T_0$로 다시 쓰면 각 인자가 Lie group 안에 머문다. 이 꼴은 그 뒤 rolling shutter, event camera, VIO 논문에서 널리 쓰였다. Basalt와 Mueggler의 event 궤적 추정, [Kerl·Stückler·Cremers의 ICCV 2015 dense rolling shutter RGB-D 추적](https://doi.org/10.1109/ICCV.2015.261)이 cumulative B-spline을 사용했다.

parametric spline은 계산이 가볍고 코드가 간단해서 실시간 VIO와 event 시스템에서 꾸준히 쓰였다. motion prior를 따로 두지 않으면, 관측이 드문 구간이 얼마나 매끄러운지는 basis와 제어점이 정한다. 계수나 미분에 prior를 더할 수도 있다. 다음 절의 GP 방식은 궤적의 사전 분포에서 출발한다.

## 7c.3 SDE 기반 GP와 STEAM

2014년 Toronto의 Barfoot 그룹은 다른 방식을 내놓았다. [Barfoot, Tong, Särkkä의 RSS 2014 논문 "Batch Continuous-Time Trajectory Estimation as Exactly Sparse Gaussian Process Regression"](https://www.roboticsproceedings.org/rss10/p01.pdf)은 궤적을 Gaussian process(가우시안 과정)로 둔다. 궤적의 사전 분포는 kernel $\mathcal{K}(t, t')$로 주어진다. 관측이 들어오면 posterior를 조건부 Gaussian으로 구한다.

GP를 그대로 쓰면 문제가 있다. 관측 수 $N$이 크면 kernel matrix $K$의 역행렬을 구하는 비용이 $O(N^3)$이다. Barfoot, Tong, Särkkä는 이 비용을 피할 수 있는 kernel 부류를 보였다. 궤적이 linear time-invariant stochastic differential equation(선형 시불변 확률 미분 방정식) $\dot{\mathbf{x}}(t) = A\mathbf{x}(t) + L\mathbf{w}(t)$의 해로 정의된다고 하자. 그러면 kernel $K$의 역행렬 $K^{-1}$은 block-tridiagonal이 된다. factor graph로 보면 연속한 상태 노드 사이에만 binary factor가 있고, 멀리 떨어진 노드 사이에는 factor가 없다.

> 🔗 **차용.** SDE와 GP의 관계는 [Särkkä 2013 *Bayesian Filtering and Smoothing*](https://users.aalto.fi/~ssarkka/pub/cup_book_online_20131111.pdf)에 정리되어 있다. Barfoot 그룹은 이 관계를 SLAM에 가져와, SDE에서 유도한 GP motion prior를 factor graph로 표현했다. Rasmussen-Williams의 GP 교과서는 kernel을 닫힌 꼴로 쓴다. 실시간 SLAM에는 희소한 역행렬이 필요하다. Särkkä의 SDE 표현으로 이 둘을 이을 수 있었다.

이 연구는 **STEAM**(Simultaneous Trajectory Estimation and Mapping)으로 이어졌다. 2015년 IROS에서 [Sean Anderson과 Barfoot의 "Full STEAM Ahead"](https://doi.org/10.1109/IROS.2015.7353368)는 SE(3) 위의 constant-velocity prior로 STEAM을 정식화했다. 상태는 자세와 body-centric 속도로 이루어진다. 속도는 white noise를 적분한 만큼 변하고, 자세는 그 속도를 따라 움직인다. 같은 해 Anderson, Barfoot, Tong, Särkkä는 비선형 운동 모델로 넓힌 저널 논문 ["Batch nonlinear continuous-time trajectory estimation as exactly sparse Gaussian process regression"](https://doi.org/10.1007/s10514-015-9455-y)을 *Autonomous Robots*에 실었다.

STEAM에서는 GP 보간도 쓸 수 있다. 제어점(control pose)을 몇 개만 두고, 제어점 사이 아무 시각의 자세를 posterior mean으로 구한다. spinning LiDAR의 한 scan 안에서 점 10,000개가 각자 다른 시각에 찍혀도 제어점은 scan당 하나만 둔다. 그래서 추정할 상태 수는 관측 수보다 훨씬 적다. 다만 관측마다 residual을 계산해 더하는 일은 여전히 해야 한다.

[STEAM 오픈소스](https://github.com/utiasASRL/steam) 저장소는 2015년에 시작됐고, 커밋을 가장 많이 남긴 사람은 Sean Anderson이다. Dellaert 그룹의 GTSAM에는 2026년에 GP motion prior가 들어갔다.

---

## 7c.4 Lie group 위의 continuous-time

parametric 방식이든 nonparametric 방식이든 SLAM에서는 SE(3) 위의 궤적이 필요하다. Euclidean 공간의 spline이나 GP를 SE(3)로 옮기려면 손을 더 써야 한다. 흔히 tangent space에서 선형 보간한 뒤 exponential map으로 SE(3)에 되돌린다.

B-spline 쪽에서는 TUM의 Sommer, Usenko, Schubert, Demmel, Cremers가 Lie group cumulative B-spline의 시간 미분을 점화식으로 다시 유도했다. 논문은 ["Efficient Derivative Computation for Cumulative B-Splines on Lie Groups"(CVPR 2020)](https://arxiv.org/abs/1911.08860)이다. 기존 방식은 spline 차수 $k$에 대해 $O(k^2)$번의 행렬 연산이 필요했는데, 이 방식은 $O(k)$번으로 줄였다. SO(3) spline에서는 제어점으로 미분한 Jacobian도 해석적으로 구했다. 논문은 camera-IMU calibration 실험에서 계산 시간이 줄어드는 것을 보였다.

GP 쪽에서는 Anderson과 Barfoot이 "local variable" 방식을 썼다. 각 제어 자세 $T_k$ 근처에서 local perturbation $\xi_k(t) = \log(T(t)\,T_k^{-1})$를 정의하고, 이 변수에 GP를 둔다. SE(3) 전체에서 GP를 직접 정의하기는 어렵다. 제어점 근처의 tangent space에서는 Euclidean GP를 쓸 수 있다. 제어점 사이를 넘어갈 때 adjoint가 쓰이는데, 그 수학은 Ch.7b preintegration의 on-manifold 논의와 같다.

> 🔗 **차용.** [Anderson과 Barfoot의 IROS 2015 논문](https://doi.org/10.1109/IROS.2015.7353368)은 Lie group의 local variable에 GP를 적용하는 방법을 정리했다. 이웃한 두 제어점 사이에서만 GP를 쓰고, 제어점을 넘어갈 때 adjoint로 보정한다. 이 방법은 그 뒤 여러 continuous-time LiDAR·VIO 논문에서 쓰였다.

여기서 비교한 spline 구현과 GP 구현은 motion prior를 두는 방식이 다르다. spline에서는 계수를 직접 추정할 수도 있고, 계수나 미분에 별도 사전 분포를 줄 수도 있다. GP에는 SDE에서 유도한 constant-velocity나 white-jerk 같은 사전 분포가 들어 있어서, 관측이 드문 구간을 prior가 채운다. spline에서는 이웃한 관측과 basis가 그 구간의 모양을 정한다. 둘을 결합하려는 시도(Johnson et al. 2020)도 있었다. 실무에서는 응용에 따라 한쪽을 고른다.

## 7c.5 응용: LiDAR, VIO, event camera

continuous-time 궤적은 처음에는 calibration에 주로 쓰였다. 2022년 무렵에는 다음 분야에서 자주 쓰였다.

**LiDAR motion distortion.** MINES ParisTech와 Kitware의 Pierre Dellenbach 등은 [CT-ICP](https://arxiv.org/abs/2109.12979)(arXiv 2021, ICRA 2022)에서 scan마다 시작 자세와 끝 자세를 두고 그 사이를 보간했다. 회전은 slerp로, 위치는 선형으로 보간한다. 앞 scan의 끝 자세와 다음 scan의 시작 자세는 같지 않아도 되고, 둘이 가깝도록 하는 제약을 둔다. 간단한 continuous-time 모델이다. 논문은 KITTI, NCLT, Newer College를 포함한 일곱 개 데이터셋에서 실험했다. KITTI odometry leaderboard에서는 코드를 공개한 방법 가운데 1위(평균 상대 이동 오차 0.59%)라고 보고했다.

> 🔗 **차용.** CT-ICP는 [Besl·McKay 1992 ICP](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf)에서 이어진 ICP의 point-to-plane 목적함수에 scan 안의 보간을 더했다.

같은 해 Toronto 그룹의 Keenan Burnett, Yuchen Wu 등은 ["Are We Ready for Radar to Replace Lidar in All-Weather Mapping and Localization?"](https://arxiv.org/abs/2203.10174)(RSS 2022)에서 radar만 쓰는 위치 추정, LiDAR만 쓰는 위치 추정, radar scan을 LiDAR 지도에 맞추는 위치 추정을 비교했다. 세 파이프라인의 odometry는 모두 Anderson과 Barfoot의 GP motion prior를 쓰는 continuous-time ICP였다. 같은 그룹의 Wu 등은 ["Picking up Speed"](https://doi.org/10.1109/LRA.2022.3226068)(RA-L 2023)에서 점마다 Doppler 속도를 함께 내는 Aeva FMCW LiDAR에 이 방법을 적용했고, [STEAM-ICP](https://github.com/utiasASRL/steam_icp) 코드를 공개했다. 이 속도 측정은 STEAM의 속도 상태와 바로 대응한다.

**Rolling shutter VIO.** [Kerl 등의 rolling shutter RGB-D 추적](https://doi.org/10.1109/ICCV.2015.261)(ICCV 2015)은 이미지의 행마다 그 행이 찍힌 시각의 자세를 B-spline 궤적에서 구했다. [Ctrl-VIO](https://doi.org/10.1109/LRA.2022.3202349)(RA-L 2022)는 B-spline 궤적으로 같은 방식을 rolling shutter VIO에 썼다. 공개 저장소 README는 spline 모듈을 Basalt에서 가져와 고쳤다고 밝힌다. global shutter를 가정하는 VIO와 달리 rolling shutter를 모델 안에서 처리한다.

**Event camera.** Ch.18에서 2010년대 event camera 연구의 어려움을 다룬다. 2020년대에는 continuous-time 궤적을 쓰는 event SLAM이 여럿 나왔다. 이 시스템들은 이벤트마다 μs 단위 타임스탬프로 B-spline이나 GP에서 그 순간의 자세를 구하고, event와 이미지의 일관성으로 residual을 계산한다.

## 📜 예언 vs 실제

> 📜 **예언 vs 실제.** Furgale·Barfoot·Sibley의 2012년 ICRA 논문은 고속 IMU와 sweeping laser가 discrete-time state를 비대하게 만드는 문제를 출발점으로 삼았고, 기존 rolling-shutter 보간 연구도 관련 사례로 언급했다. 논문이 직접 검증한 것은 camera–IMU calibration이었다. 이후 Barfoot·Tong·Särkkä(2014)가 SDE 기반 sparse GP를 정식화했다. rolling-shutter VIO와 event SLAM에서도 continuous-time trajectory가 쓰였다. 이 둘은 2012년 논문의 Future Work와는 따로 이어진 연구다. 그동안 visual SLAM에서는 이산 keyframe 기반 ORB-SLAM이 주류가 됐고, continuous-time 궤적은 주로 특수 센서에 쓰였다.

---

## 🧭 아직 열린 것

**학습 기반 continuous-time prior.** SDE에서 얻는 motion prior에는 constant-velocity나 white-jerk 같은 물리 가정이 들어 있다. 실제 주행·보행·UAV 궤적은 이 가정을 어기는 경우가 많다. 2023–2024년에는 neural SDE나 neural ODE로 데이터 기반 prior를 학습해 continuous-time factor graph에 넣으려는 시도가 나왔다. 실시간으로 도는 희소 구조를 유지하면서 학습한 prior를 쓰는 일은 남은 과제다.

**VIO와 continuous-time의 통합.** Ch.7b의 preintegration은 keyframe 기반 VIO의 사실상 표준이다. continuous-time 궤적이 preintegration을 대신할 수 있는지, 둘을 섞는 편이 나은지는 아직 가려지지 않았다. Le Gentil, Vidal-Calleja, Huang의 [GP 기반 preintegration](https://doi.org/10.1109/LRA.2020.2970940)(RA-L 2020)이 둘을 이으려 했다. 그러나 ORB-SLAM3나 VINS-Fusion처럼 널리 쓰이는 시스템은 여전히 이산 preintegration을 쓴다.

**임베디드 장치용 온라인 sliding window.** STEAM과 B-spline 기반 시스템은 제어점이 쌓이면 최적화가 느려진다. marginalization으로 과거 제어점을 제거하면서 continuous-time posterior의 일관성을 유지하기는 까다롭다.

---

continuous-time 표현과 Ch.7b의 이산 preintegration은 함께 쓸 수 있다. 앞에서 본 Le Gentil 등의 GP 기반 preintegration이 그런 예다. Ch.8은 다시 카메라로 돌아가 direct photometric 방법과 DSO, VI-DSO를 다룬다.

# Ch.8 — Direct 방법: DTAM에서 DSO까지

Richard Newcombe는 Imperial College에서 Andrew Davison의 박사과정 학생이었다. MonoSLAM은 EKF로 점 100개 안팎을 추적해 실시간으로 돌았다. 2011년 Newcombe는 GPU 한 장으로 화면의 모든 픽셀을 쓰면서도 실시간으로 도는 시스템을 만들었다. 그 시스템이 DTAM이다.

ORB-SLAM은 feature를 먼저 뽑고 그 feature만 추적한다. corner 검출과 ORB 서술자로 고른 점 1,000~2,000개를 남기고, 나머지 픽셀은 버린다. direct 방법(밝기를 직접 비교하는 방법)은 대응점의 기하 오차 대신 픽셀 밝기 차이를 측정값으로 쓴다. 모든 픽셀을 쓰는 dense 방법부터 일부만 선택하는 sparse 방법까지 여기에 속한다.

같은 무렵 뮌헨 TUM의 Daniel Cremers 그룹은 Gauss-Newton image alignment와 optical flow 같은 컴퓨터 비전 방법을 SLAM에 가져오고 있었다. Cremers의 학생 Jakob Engel은 2014년 LSD-SLAM을, 2016년 DSO를 내놓았다. 두 시스템은 쓰는 픽셀의 밀도가 다르다.

---

## 1. 모든 픽셀: DTAM

Newcombe, Lovegrove, Davison은 2011년 ICCV에서 [DTAM](https://doi.org/10.1109/ICCV.2011.6126513)을 발표했다. DTAM은 "Dense Tracking and Mapping in Real-Time"의 약자다. 이름대로 모든 픽셀을 써서 추적과 지도 작성을 실시간으로 한다.

시스템은 추적과 지도 작성 두 부분으로 이루어진다. 추적 단계에서는 dense 모델에서 합성한 영상에 현재 프레임 전체를 photometric alignment로 맞춘다. 특징점 추출이나 서술자 매칭 없이 픽셀 intensity 차이만 최소화한다. 지도 작성 단계에서는 keyframe 가까이에서 찍은 여러 프레임의 photometric 오차를 cost volume(픽셀마다 깊이 후보별 비용을 쌓은 3차원 배열)에 모은다. 이 비용에 regularization 항을 더한 에너지를 최소화해 keyframe의 inverse depth map을 구한다.

$$E(\mathbf{u}) = \frac{1}{|\mathcal{I}|}\sum_{i \in \mathcal{I}} \Bigl\| I_r\bigl(\pi(\mathbf{p}(\mathbf{u}))\bigr) - I_i\bigl(\pi(KT_i\mathbf{p}(\mathbf{u}))\bigr) \Bigr\|_1 + \lambda \, g\,\|\nabla \mathbf{u}\|_\epsilon$$

여기서 $\mathbf{u}$는 역 깊이(inverse depth) 맵, $\mathbf{p}(\mathbf{u})$는 $\mathbf{u}$로 역투영한 3D 점, $K$는 카메라 내부 행렬, $T_i$는 참조 프레임 기준 $i$번 프레임의 rigid body 변환, $\pi$는 원근 투영이다. 데이터 항은 프레임마다 photometric 오차의 L1 norm을 구해 평균한다. $\|\nabla \mathbf{u}\|_\epsilon$은 inverse depth gradient의 Huber norm이고, $g$는 참조 영상의 gradient가 큰 곳에서 작아지는 픽셀별 가중치다. Huber norm은 작은 gradient에는 제곱 norm을, 큰 gradient에는 L1 norm(total variation)을 쓴다. 그래서 면은 매끄럽게 하면서 깊이 경계는 남긴다. 이 최적화를 실시간으로 돌리려면 GPU가 필요하다. 논문은 당시 소비자용 GPU인 NVIDIA GTX 480 한 장에서 실행했다.

> 🔗 **차용.** 같은 해 Newcombe가 주도한 [KinectFusion](https://doi.org/10.1109/ISMAR.2011.6092378)(ISMAR 2011)은 depth sensor로 dense 재구성을 했다. 지도 표현에는 [Curless & Levoy 1996](https://doi.org/10.1145/237170.237269)의 TSDF(truncated signed distance function)를 썼다. DTAM은 단안(monocular) 카메라로 dense depth map을 추정했다.

DTAM은 실내 장면을 실시간으로 dense하게 복원해 보였다. 다만 조명 변화에 약했다. 논문이 시연한 곳은 실내의 작은 공간이었다.

## 2. Semi-dense: LSD-SLAM

Engel, Schöps, Cremers가 ECCV 2014에 낸 [LSD-SLAM](https://doi.org/10.1007/978-3-319-10605-2_54)(Large-Scale Direct Monocular SLAM)은 모든 픽셀을 쓰지 않는다. 그 대신 GPU 없이 CPU에서 실시간으로 돈다. LSD-SLAM은 semi-dense 방식이다. 이미지에서 gradient 크기가 임계값 이상인 픽셀만 쓴다. 벽의 평평한 부분은 버리고 edge 근처 픽셀만 남긴다. corner detector는 쓰지 않는다.

추적은 SE(3) direct image alignment다. 현재 프레임을 keyframe으로 warping해 photometric residual을 Gauss-Newton으로 최소화한다. 지도는 keyframe마다 semi-dense depth map을 하나씩 둔다. keyframe 사이의 관계는 Sim(3) pose graph로 관리한다. 그래서 단안 카메라의 scale drift도 함께 다룬다. 큰 loop closure 후보는 appearance 기반 검색(FAB-MAP)으로 찾는다. 후보마다 양쪽 방향으로 Sim(3) 정렬을 따로 하고, 두 결과가 통계적으로 비슷할 때만 받아들인다.

> 🔗 **차용.** Gauss-Newton photometric registration은 이미지 정렬 분야의 고전이다. [Lucas & Kanade 1981](https://www.ijcai.org/Proceedings/81-2/Papers/017.pdf) tracker와 그 inverse compositional 변형([Baker & Matthews 2004](https://doi.org/10.1023/B:VISI.0000011205.11775.fd))이 LSD-SLAM frontend의 바탕이다.

tracking과 mapping을 나눈 점은 PTAM과 같다. 다만 LSD-SLAM에는 ORB나 BRIEF 같은 binary descriptor가 없고, 픽셀 밝기만 측정값으로 쓴다.

논문은 실내뿐 아니라 실외의 큰 장면에서 만든 semi-dense 지도도 보여줬다. 조명 변화에는 약했다. 터널 진입, 창문 역광, 갑작스러운 플래시에서는 photometric consistency 가정이 깨진다. 그러면 시스템이 불안정해진다.

## 3. Sparse direct: DSO

Engel, Koltun, Cremers의 [DSO](https://doi.org/10.1109/TPAMI.2017.2658577)(Direct Sparse Odometry)는 2016년 arXiv에 먼저 공개됐고, 2018년 IEEE TPAMI에 실렸다. DSO는 LSD-SLAM보다 적은 픽셀을 쓴다. 그 대신 photometric calibration을 꼼꼼히 한다.

DSO는 새 keyframe마다 후보 픽셀 2,000개를 고른다. 최적화에 남기는 활성 점은 모든 활성 프레임을 합쳐 2,000개다. 후보를 고를 때는 영상 전체에 고르게 퍼지도록 하고, 주변보다 gradient가 큰 픽셀을 고른다. 이 점들로 sliding window bundle adjustment를 한다. 최적화 변수는 camera pose, inverse depth, affine brightness 파라미터 $(a_i, b_i)$다. 윈도우를 벗어난 프레임은 marginalization으로 제거한다. 이때 Schur complement로 해당 변수를 소거하므로 최적화 문제의 크기가 일정하게 유지된다. 전체 계산량은 창 크기와 픽셀 수, 반복 횟수에 달려 있다.

DSO는 카메라의 photometric 모델을 나눠서 다룬다. vignetting(렌즈 가장자리로 갈수록 어두워지는 현상)은 미리 캘리브레이션해 보정한다. camera response function(센서가 빛을 비선형으로 기록하는 특성, gamma curve)도 미리 역함수를 추정해 선형 밝기로 바꾼다. 프레임의 노출 시간 $t_i$는 입력 메타데이터로 받고, 남은 affine brightness 변화 $(a_i, b_i)$를 실시간으로 추정한다:

$$E_{pj} = \sum_{\mathbf{p} \in \mathcal{N}_p} w_{\mathbf{p}} \left\| \left( I_j\!\left[\mathbf{p}'\right] - \frac{t_j e^{a_j}}{t_i e^{a_i}} I_i[\mathbf{p}] - \left(b_j - \frac{t_j e^{a_j}}{t_i e^{a_i}} b_i\right) \right) \right\|_\gamma$$

여기서 $t_i, t_j$는 노출 시간, $(a_i, b_i)$와 $(a_j, b_j)$는 각 프레임의 affine brightness 파라미터(gain과 bias), $\|\cdot\|_\gamma$는 Huber loss이다. 위 잔차는 전처리 단계의 photometric calibration으로 vignetting을 보정한 intensity에 적용한다.

> 🔗 **차용.** Photometric camera calibration의 형식적 기반은 [Debevec & Malik 1997](https://doi.org/10.1145/258734.258884)의 HDR 복원 연구에서 왔다. DSO는 response function을 미리 보정하고, 실행 중에는 프레임별 affine brightness 파라미터만 추정한다.

논문은 TUM monoVO, EuRoC, ICL-NUIM 데이터셋에서 DSO를 단안 ORB-SLAM과 비교했다. ORB-SLAM은 loop closure 검출과 relocalization을 끄고 돌렸다. TUM monoVO와 ICL-NUIM에서는 DSO가 정확도와 강건성 모두 앞섰고, EuRoC에서는 ORB-SLAM이 더 정확했지만 더 자주 실패했다. 저자들은 그 이유로 EuRoC에 photometric calibration이 없다는 점과, 드론이 작은 loop를 돌거나 왔던 길을 되짚는 구간이 많아 ORB-SLAM의 local mapping이 작은 loop 여럿과 일부 큰 loop를 암묵적으로 닫을 수 있었다는 점을 들었다. ORB-SLAM이 10초 넘게 관측되지 않은 keypoint와는 매칭하지 못하게 하자 정확도는 DSO와 비슷해졌고 강건성은 여전히 낮았다.

> 📜 **예언 vs 실제.** DSO는 사전 photometric calibration을 요구했다. 2018년 Bergmann, Wang, Cremers는 [online photometric calibration](https://doi.org/10.1109/LRA.2017.2777002)을 RA-L에 냈다. 이 방법은 KLT로 추적한 대응점을 써서 노출 시간, response function, vignetting을 추정한다. direct VO와 나란히 실시간으로 돌며, 들어오는 프레임을 바로 보정한다. TUM monoVO 데이터셋에서 이 보정을 거친 auto-exposure 영상으로 DSO를 돌린 결과는 미리 보정한 영상으로 돌린 결과와 비슷했다.

> 📜 **예언 vs 실제.** DTAM 뒤 dense 재구성 연구는 주로 KinectFusion처럼 RGB-D depth sensor를 썼고, 단안 dense 재구성은 2020년대 NeRF와 3DGS 이후 다시 활발해졌다.

## 4. VI-DSO와 후속 연구

von Stumberg, Usenko, Cremers는 ICRA 2018에서 DSO에 IMU를 결합한 [VI-DSO](https://doi.org/10.1109/ICRA.2018.8462905)를 발표했다. direct 방법은 조명이 급변할 때 자주 실패한다. 이때 IMU 측정이 자세 추적을 돕는다. 단안 카메라의 scale 모호성도 IMU로 풀 수 있다.

VI-DSO는 DSO의 sliding window photometric bundle adjustment에 IMU preintegration factor를 더했다. 논문은 scale을 복원하고 어려운 조건에서도 덜 실패한다고 보고했다.

Cremers 그룹은 2022년 [DM-VIO](https://doi.org/10.1109/LRA.2021.3140129)에서도 direct photometric frontend에 IMU를 tightly coupled로 결합했다. 같은 그룹의 [Basalt](https://arxiv.org/abs/1904.06504)(RA-L 2020)는 direct 방식 대신 patch 기반 optical flow로 점을 추적하는 VIO다. direct VIO 연구와 VINS-Mono, OpenVINS 같은 feature 기반 VIO 연구는 같은 시기에 함께 나왔다.

> 🔗 **차용.** VI-DSO의 IMU factor는 [Forster et al. 2017. On-Manifold Preintegration (IEEE TRO)](https://doi.org/10.1109/TRO.2016.2597321)의 preintegration을 바탕으로 한다.

## 5. direct method의 한계

Direct method는 descriptor로 요약한 특징점 대신 영상 밝기 자체를 잔차에 넣는다. 픽셀을 고르는 범위는 방법마다 다르다. DTAM은 모든 픽셀의 밝기를 썼다. LSD-SLAM은 gradient가 있는 semi-dense 영역을 썼다. DSO는 주변보다 gradient가 큰 픽셀을 영상 전체에서 고르게 골랐다. 강한 gradient가 없는 영역에서는 임계값을 낮춰 약한 밝기 변화도 썼다. 그래서 corner가 드문 곳에서도 정보를 얻는다. 하지만 밝기가 거의 일정한 면에서는 자세가 바뀌어도 잔차가 거의 변하지 않는다.

**Photometric calibration.** DSO가 가정하는 vignetting 보정, response curve 보정, 노출 정보를 소비자용 카메라에서 얻으려면 따로 작업해야 한다. 스마트폰 카메라는 HDR 합성, auto-exposure, 실시간 화이트 밸런스를 내부 파이프라인으로 처리한다. 그 세부는 제조사만 안다. 이런 카메라에서는 DSO photometric 모델의 기본 가정이 맞지 않는다.

**조명 변화.** direct 방식은 photometric consistency(같은 점은 프레임이 바뀌어도 밝기가 같다는 가정)에 기댄다. 자동 노출, 역광, 플리커처럼 프레임 사이 밝기가 급변하면 이 가정이 바로 깨진다. DSO의 affine brightness 모델은 완만한 밝기 변화만 흡수한다. 실외에서 구름이 지나가거나 실내에서 형광등이 깜빡이는 장면에서는 추적이 실패할 수 있다.

**카메라 교체.** 통제된 데이터셋에서는 DSO가 ORB-SLAM보다 나은 시퀀스가 있었다. 다만 ORB-SLAM은 photometric calibration 없이 여러 카메라에서 돌고, 카메라를 바꿔도 바로 쓸 수 있다. DSO는 카메라마다 vignetting·response curve를 따로 캘리브레이션해야 했다.

**학습 기반 feature.** [SuperPoint](https://arxiv.org/abs/1712.07629)(2018) 같은 학습 기반 feature와 [LightGlue](https://arxiv.org/abs/2306.13643)(2023) 같은 학습 기반 matcher가 나왔다. 이들은 어려운 조건에서 손으로 설계한 descriptor보다 대응점을 더 잘 찾는다. 그러면서도 descriptor matching 방식을 그대로 쓴다.

## 🧭 아직 열린 것

**조명이 급변할 때의 direct tracking.** §5에서 본 photometric consistency 가정이 깨지는 문제는 아직 풀리지 않았다. VI-DSO처럼 IMU를 쓰면 나아진다. 조명 모델을 실행 중에 추정하는 방법으로는 §3에서 본 Bergmann 등의 online photometric calibration이 있다.

**Texture가 없는 장면.** feature 기반 방법은 corner가 없는 벽 앞에서 실패한다. direct 방식도 균질한 면에서는 자세가 바뀌어도 밝기 잔차가 거의 그대로다. 두 방식 모두 실내 복도, 대규모 창고, 균질한 실외 지형 같은 환경에서 약하다. LSD-SLAM은 gradient가 있는 픽셀만 골라 썼다. 그런 픽셀이 화면 한쪽에 몰리면 자세가 제대로 정해지지 않는 degeneracy가 생긴다.

**학습한 photometric 모델.** 지금 direct SLAM의 photometric 모델은 단순한 affine brightness 보정과 고정된 camera response function이다. neural radiance field 계열 연구는 장면의 appearance를 신경망으로 모델링한다. Ch.14의 iMAP은 이렇게 학습한 지도에서 렌더링한 색·깊이와 관측의 차이로 카메라 자세를 추적했다.

RGB-D 카메라는 depth를 직접 재므로 밝기가 변해도 dense 재구성을 할 수 있다. Ch.9는 RGB-D SLAM을 다룬다.

# Ch.9 — Dense/RGB-D: KinectFusion부터 BundleFusion까지

2011년 10월, Imperial College London의 Richard Newcombe는 ISMAR에서 KinectFusion을 발표했다. 데모 영상에서는 손에 든 Kinect 센서 하나로 방 전체를 실시간으로 3D 메시로 만들었다. KinectFusion은 Curless와 Levoy가 1996년 그래픽스 분야에서 내놓은 부호 거리 함수 표현, Besl과 McKay가 1992년 발표한 ICP 정합, Microsoft의 Kinect 센서를 함께 썼다. 같은 해 Newcombe는 단안 카메라 영상의 밝기로 dense 재구성을 한 DTAM(Ch.8)도 발표했다.

---

## 9.1 Kinect 이전의 dense 재구성

2011년 이전에도 dense 3D 재구성은 있었다. [Pollefeys 등(IJCV 2008)](https://doi.org/10.1007/s11263-007-0086-4)처럼 차량에서 찍은 영상과 GPS/INS로 도시 3D 모델을 실시간으로 만든 시스템도 있었지만, 대부분은 오프라인으로 처리했다.

오프라인 파이프라인은 스테레오나 structured light(구조광: 정해진 빛 무늬를 쏘아 그 무늬가 휘는 정도로 깊이를 재는 방식) 스캐너로 얻은 point cloud를 시간을 들여 합쳤다. 스캔 장비가 비싸서 연구실 밖에서는 쓰기 어려웠다. SLAM 연구자들은 sparse landmark만으로도 쓸 만한 결과를 얻고 있었고, dense 재구성은 주로 그래픽스 연구자들이 다뤘다.

[Curless와 Levoy의 1996년 SIGGRAPH 논문 "A Volumetric Method for Building Complex Models from Range Images"](https://graphics.stanford.edu/papers/volrange/volrange.pdf)는 이 시기 그래픽스 쪽 방법을 대표한다. 논문은 3D 공간을 균일한 복셀 그리드로 나누고, 복셀마다 센서 시선 방향으로 잰 표면까지의 부호 있는 거리를 가중치와 함께 누적한다. 이 값은 표면 근처에서만 의미가 있으므로 논문은 거리와 가중치를 측정점 주변으로 잘라서 쓴다. 뒤에 KinectFusion은 이 표현을 **TSDF(Truncated Signed Distance Function, 잘라 낸 부호 거리 함수)**라고 불렀다. 부호는 센서 쪽에서 표면을 향해 갈 때 표면 앞(빈 공간)이 양수, 표면 뒤(물체 내부)가 음수다. 잘라 낸다는 것은 값을 일정 한계 $t$ 안으로 묶는다는 뜻이어서 $\text{TSDF}(x) = \text{clip}(d(x), -t, +t)$가 된다. 새 깊이 프레임이 들어올 때마다 이 값을 가중 평균으로 갱신하면 노이즈가 조금씩 평균되어 표면이 점점 선명해진다. 표면은 TSDF 값이 0이 되는 곳(zero-crossing)에 marching cubes를 적용해 뽑는다.

이 방법은 정확했지만 복셀 그리드가 메모리를 많이 썼고, 당시 하드웨어로는 실시간으로 갱신할 수 없었다. 그 뒤 GPU로 그래픽스 밖의 범용 계산을 하게 되었고(GPGPU), Kinect가 나왔다.

## 9.2 KinectFusion과 TSDF

Microsoft는 2010년 11월 4일 Xbox 360용 Kinect를 북미에서 149.99달러에 출시했다. Kinect는 구조광으로 깊이를 재서 640×480 깊이 맵을 30 Hz로 내보냈다. 연구용 ToF 카메라보다 정밀도는 낮았지만 값이 훨씬 쌌다. 출시 엿새 뒤인 11월 10일 Hector Martin이 뒤에 libfreenect가 되는 오픈소스 드라이버를 공개했고, 연구자들도 곧 Kinect를 쓰기 시작했다.

Newcombe는 박사과정 중 Microsoft Research Cambridge의 Shahram Izadi 팀과 함께 Kinect depth 스트림으로 GPU 기반 dense SLAM을 만들었다. 그 결과가 2011년 ISMAR에서 발표된 [Newcombe et al. 2011. KinectFusion](https://doi.org/10.1109/ISMAR.2011.6092378)이다.

> 🔗 **차용.** KinectFusion의 지도 표현인 TSDF는 Curless & Levoy(1996)가 오프라인 3D 스캐닝을 위해 고안한 표현을 이어받았다. Newcombe 팀은 복셀을 GPU에서 병렬로 갱신해 실시간으로 돌렸다.

파이프라인은 다음 단계로 이루어진다.

깊이 전처리 단계에서는 원시 깊이 맵에 bilateral filter(경계는 살리고 노이즈만 줄이는 필터)를 걸고 표면 법선을 계산한다.

ICP 추적 단계에서는 현재 프레임의 point cloud를, 지금까지 쌓은 TSDF에서 ray-cast로 그려 낸 가상 표면에 맞춘다. [Besl & McKay(1992)](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf)의 **ICP(Iterative Closest Point, 가장 가까운 점끼리 대응시켜 정렬을 반복하는 방법)**를 point-to-plane 형태로 바꿔 쓴다. 영상 피라미드 3단계에서 거친 단계부터 고운 단계로 각각 최대 4·5·10회 반복한다. 반복할 때마다 GPU가 수많은 vertex-normal 대응에서 나온 정규방정식 항을 병렬로 더한다. 결과는 카메라의 6-DoF 자세다.

point-to-plane ICP의 목적함수는 다음과 같다. 현재 프레임의 포인트 $\mathbf{p}_i$를 변환 $T = (R, \mathbf{t})$로 옮기고, 대응 점 $\hat{\mathbf{p}}_i$(ray-cast 표면)와 법선 $\hat{\mathbf{n}}_i$로

$$E(R, \mathbf{t}) = \sum_i \bigl(\hat{\mathbf{n}}_i^\top (R\,\mathbf{p}_i + \mathbf{t} - \hat{\mathbf{p}}_i)\bigr)^2$$

을 최소화한다. Besl-McKay의 원래 point-to-point 오차($\|R\mathbf{p}_i + \mathbf{t} - \hat{\mathbf{p}}_i\|^2$)는 점 사이 거리 전체를 잰다. point-to-plane 오차는 그 차이의 법선 방향 성분만 재므로, 점이 표면을 따라 미끄러지는 방향의 어긋남에는 덜 민감하다. 작은 회전을 $R \approx I + [\boldsymbol{\omega}]_\times$로 근사하면 $E$는 6차원 벡터 $(\boldsymbol{\omega}, \mathbf{t})$에 대한 선형 최소자승 문제가 되고, GPU에서 parallel reduction으로 한 번에 푼다.

> 🔗 **차용.** KinectFusion의 추적은 Besl & McKay(1992)의 ICP를 이어받아 GPU에서 dense하게 돌렸다. ICP는 IEEE PAMI에 실린 3D 형상 정합 기법이다.

TSDF 통합 단계에서는 추정한 자세로 깊이 맵을 복셀 그리드에 투영해 TSDF 값을 갱신한다. 논문은 3 m³ 볼륨을 64³부터 512³ 복셀까지 여러 해상도로 나눠 시간을 쟀다(Fig. 13).

표면 렌더링 단계에서는 TSDF의 zero-crossing을 ray marching으로 찾아 표면의 vertex map과 normal map을 만든다. 이 결과가 다음 프레임 ICP 추적의 기준 표면이 된다.

> 🔗 **차용.** KinectFusion과 DTAM은 Newcombe가 같은 해 발표한 dense 시스템이고 둘 다 GPU를 쓴다. DTAM은 단안 영상의 밝기 오차를 최적화한다. KinectFusion은 depth를 ICP로 정합해 TSDF에 통합하므로, 지도 표현과 목적함수가 DTAM과 다르다.

KinectFusion은 30 Hz로 추적하면서 방 한 칸을 dense mesh로 복원했다. 프레임을 직전 프레임에 맞추지 않고 지금까지 합친 전체 모델에 맞추므로(model-to-frame), 방 크기의 볼륨 안에서는 추적 drift가 작았다. 다만 그 모델도 과거에 추정한 자세로 쌓은 것이라 절대 기준은 아니었다.

복셀 그리드는 미리 정한 공간만 덮어서, 카메라가 그 밖으로 나가면 더 기록할 수 없었다. loop closure도 없었다. Kinect의 IR 구조광은 햇빛 아래에서 패턴이 묻혀 실외에서는 쓰기 어려웠다.

## 9.3 Kintinuous — rolling volume

KinectFusion이 발표된 직후 Maynooth 대학의 Thomas Whelan과 MIT의 Michael Kaess, John Leonard 등은 볼륨 크기 문제를 다뤘다. 이들은 TSDF 볼륨이 카메라를 따라 움직이게 했다.

[Whelan 등의 Kintinuous](https://www.cs.cmu.edu/~kaess/pub/Whelan12rssw.pdf)는 2012년 7월 Sydney에서 열린 RSS 워크숍 "RGB-D: Advanced Reasoning with Depth Cameras"에서 발표됐다. Kintinuous는 TSDF 배열을 순환 버퍼로 다룬다. 카메라가 볼륨 경계에 가까워지면 볼륨을 카메라 쪽으로 옮기고, 볼륨 밖으로 밀려난 slice에서 point cloud를 뽑아 삼각형 메시에 덧붙인다. 그래서 메모리는 일정하게 유지되고 카메라는 계속 이동할 수 있다.

이 방식으로 복도처럼 긴 공간도 재구성할 수 있었다. 다만 loop closure는 여전히 없어서, 긴 경로를 돌아 출발점에 왔을 때 두 끝이 맞지 않았다. 표면은 세밀해도 전역 지도는 어긋났다.

## 9.4 ElasticFusion: Surfel과 비강체 변형

Whelan은 Kintinuous 다음 시스템에서 TSDF 복셀 대신 surfel을 썼다.

**surfel(surface element, 표면 요소)**은 위치, 법선, 반지름, 색을 지닌 점이다. 컴퓨터 그래픽스에서 [Pfister 등(2000)](https://www.merl.com/publications/docs/TR2000-10.pdf)이 렌더링용으로 제안했다. surfel은 격자 없이 표면 위에만 불규칙하게 놓인다.

Whelan 등은 ElasticFusion을 RSS 2015에 처음 발표했고, 2016년 IJRR에 [확장판](https://doi.org/10.1177/0278364916669237)을 냈다. ElasticFusion은 surfel 기반 dense 지도에 *non-rigid deformation*(비강체 변형)을 적용해 loop closure를 처리했다.

dense SLAM에서 loop closure는 어려웠다. 전역 메시나 복셀 그리드를 loop closure 결과에 맞춰 고치려면 비용이 컸다. ElasticFusion은 surfel을 deformation graph(변형 그래프)에 연결하고, loop closure를 찾으면 그래프를 변형해 오차를 지도 전체에 나눴다.

deformation graph의 노드 $g_k$마다 위치 $\mathbf{v}_k$, 회전 $R_k$, 이동 $\mathbf{t}_k$가 있다. surfel $s$는 가장 가까운 $K$개 노드의 영향을 받고, 변형 뒤 위치는

$$\tilde{\mathbf{p}}_s = \sum_{k \in \mathcal{N}(s)} w_k \bigl(R_k (\mathbf{p}_s - \mathbf{v}_k) + \mathbf{v}_k + \mathbf{t}_k\bigr)$$

로 계산한다(가중치 $w_k$는 거리가 멀수록 줄어든다). loop closure 제약이 들어오면 노드들의 $(R_k, \mathbf{t}_k)$를 Gauss-Newton으로 최적화해 오차를 지도 전체에 나눈다. 그래서 지도를 처음부터 다시 쌓지 않고도 dense 지도 전체를 고칠 수 있었다.

ElasticFusion 논문은 ICL-NUIM 합성 데이터셋에서 좋은 결과를 보고했다. kt0·kt1·kt2 시퀀스의 ATE RMSE는 1.4 cm 이하였고, 그중 kt0·kt1은 0.9 cm였다. kt3에서는 오차가 이보다 훨씬 컸다.

## 9.5 BundleFusion

[Dai et al. 2017. BundleFusion](https://doi.org/10.1145/3072959.3054739)은 Dai, Nießner, Zollhöfer, Izadi, Theobalt가 2017년 ACM Transactions on Graphics에 발표한 시스템이다. 이들은 GPU 연산을 많이 써서, 온라인 시스템에서도 모든 카메라 자세를 bundle adjustment로 실시간으로 함께 최적화하려 했다.

BundleFusion은 새 프레임이 들어올 때마다 지금까지 들어온 모든 RGB-D 입력으로 카메라 자세 전체를 다시 최적화한다. 최적화는 두 층으로 나눠 한다. 연속한 11프레임을 chunk 하나로 묶어 chunk 안에서 먼저 최적화하고, 각 chunk의 keyframe들을 전역으로 정렬한다. 대응은 sparse SIFT feature와 dense한 기하·밝기 정합을 함께 쓴다. 새 프레임은 매번 전역 최적화된 프레임들에 위치를 다시 맞춘다. 그래서 추적이 크게 실패해도 relocalization(재위치 추정)으로 돌아온다. 자세가 바뀌면 해당 프레임을 TSDF에서 빼고 새 자세로 다시 넣어(re-integration) 지도도 함께 고친다.

논문은 TUM RGB-D 등에서 기존 온라인 시스템보다 나은 결과를 보고했다.

> 📜 **예언 vs 실제.** BundleFusion 초록은 기존 온라인 시스템보다 낫고 품질은 오프라인 방법과 대등하면서 "unprecedented speed and scan completeness"를 보인다고 썼다. GPU 성능은 그 뒤로도 빠르게 올랐다. 그런데 2021년 이후 연구 관심의 일부는 COLMAP으로 자세를 구하고 NeRF로 장면을 표현하는 파이프라인으로 옮겨 갔다. 이 흐름은 주로 novel-view synthesis(새 시점 영상 합성)와 장면 표현을 다뤘다.

## 9.6 하드웨어와 알고리즘

Kinect 1세대는 구조광 방식이었다. 깊이 정밀도는 미터 범위에서 수 밀리미터였지만, 햇빛 아래에서는 IR 패턴이 잡히지 않았다. 2013년 11월 Xbox One과 함께 나온 Kinect 2는 ToF(Time-of-Flight: 쏜 빛이 돌아오는 시간으로 거리를 재는 방식) 센서를 썼고, 정밀도와 시야가 나아졌다. 이어 Intel RealSense 시리즈가 나왔다. 센서 종류가 늘면서 깊이 품질도 센서마다 달라졌고, 연구자들은 센서별 노이즈 특성에 맞춰 방법을 조정했다.

GPU 쪽에서는 CUDA 도구와 라이브러리가 자리를 잡았고, 2011년부터 2017년 사이 GPU의 처리량과 메모리 성능도 올라갔다. ElasticFusion과 BundleFusion이 점점 무거운 최적화를 실시간으로 돌릴 수 있었던 데에는 이런 하드웨어 발전과, 연구실에서 쉽게 구할 수 있을 만큼 싼 Kinect가 한몫했다고 본다.

> 📜 **예언 vs 실제.** KinectFusion의 한계였던 공간 범위, drift, 실외 사용은 그 뒤 연구 과제가 됐다. 공간 범위와 drift는 Kintinuous, ElasticFusion, BundleFusion이 차례로 다뤘다. 실외에서는 햇빛이 IR 구조광 패턴을 가려서, 초기 Kinect 기반 dense SLAM은 주로 실내에서 쓰였다. 실외 dense mapping에서는 LiDAR가 주요 센서가 됐다. 햇빛의 영향은 센서 방식마다 정도가 다르다.

---

## 9.7 dense 방식이 주류가 되지 못한 이유

2011년부터 2017년 사이 dense RGB-D SLAM은 Visual SLAM의 주된 방향이 될 것처럼 보였다. 그러나 2015년 이후 나온 실용 SLAM 시스템인 [ORB-SLAM2](https://arxiv.org/abs/1610.06475)와 [VINS-Mono](https://arxiv.org/abs/1708.03852)는 dense 지도를 기본으로 만들지 않았다.

먼저 메모리가 문제였다. KinectFusion은 복셀마다 TSDF 값과 가중치를 16비트씩 저장하므로, 512³ 볼륨 하나에 512 MB가 든다. 모바일 플랫폼이나 임베디드 시스템에서는 감당하기 어려운 크기였다. 해시 블록에 TSDF를 저장하는 [Voxblox](https://arxiv.org/abs/1611.03631)와 octree에 점유 확률을 저장하는 [OctoMap](https://www.hrl.uni-bonn.de/papers/wurm10octomap.pdf)은 저마다 다른 지도 표현으로 메모리 부담을 줄였지만, sparse 방식만큼 가볍지는 않았다. 실시간 dense 처리에는 GPU가 필요했는데, 자율주행 차량의 임베디드 프로세서나 드론의 가벼운 보드에서는 KinectFusion 수준의 파이프라인을 돌리기 어려웠다. 게다가 Kinect의 IR depth는 실외에서 쓰기 어려웠는데, 자율주행과 드론처럼 상용화 요구가 큰 분야는 대부분 실외였다.

dense 지도의 자료구조는 KinectFusion의 고정 볼륨에서 여러 방향으로 발전했다. [Museth(2013)의 VDB](https://doi.org/10.1145/2487228.2487235)는 동적으로 커지는 sparse root와 얕고 넓은 B+ tree를 결합했다. 값이 있는 영역에만 노드를 할당하면서도 임의 접근이 빠르다. 이 구조는 OpenVDB로 공개되어 큰 sparse volumetric 데이터를 다루는 데 널리 쓰인다. [Reijgwart 등(2023)의 wavemap](https://arxiv.org/abs/2306.01279)은 Haar wavelet으로 occupancy를 압축해 여러 해상도를 한 구조에 담았다.

지도를 연속 함수로 표현한 연구도 있었다. [O'Callaghan과 Ramos(2012)의 GPOM(Gaussian Process Occupancy Map)](https://doi.org/10.1177/0278364911421039)은 점유 지도 작성을 분류 문제로 보고 변형한 Gaussian Process로 풀었다. 그래서 가려진 영역이나 센서 빔 사이처럼 직접 관측하지 못한 곳도 분산과 함께 추정했다. [Ramos와 Ott(2016)의 Hilbert Map](https://doi.org/10.1177/0278364916684382)은 Hilbert space 특징 위에 logistic regression을 학습시켜, 데이터가 들어오는 대로 stochastic gradient descent로 갱신하는 연속 occupancy 지도를 만들었다.

[Behley와 Stachniss(2018)의 SuMa](https://www.ipb.uni-bonn.de/wp-content/papercite-data/pdf/behley2018rss.pdf)는 surfel 지도를 회전식 3D LiDAR 데이터에 적용했다. 현재 스캔을 surfel 지도에서 렌더링한 모델 뷰에 맞춰 자세를 추정했고, 도시 규모 환경에서 loop closure까지 온라인으로 처리했다(→ Ch.17).

2020년 NeRF가 나온 뒤 고품질 dense 재구성 연구는 NeRF와 3D Gaussian Splatting으로 옮겨 갔다. 그래도 RGB-D로 잰 깊이는 추적과 형상 학습 양쪽에서 제약으로 계속 쓰였다. TSDF 같은 volumetric 표현은 로봇 지도에 쓰이고, ICP는 LiDAR SLAM의 주요 정합 방법이 됐다.

---

## 🧭 아직 열린 것

**대규모 실외 dense 재구성.** 햇빛에 약한 것은 IR 구조광을 포함한 active depth 센서 전반의 문제다. LiDAR는 더 먼 거리를 재지만 색과 세밀한 표면 정보가 부족하다. 학습 기반 stereo depth 추정은 빠르게 나아지고 있지만, 어두운 곳, 반사면, 먼 거리에서는 아직 한계가 있다.

**동적 장면의 dense 재구성.** KinectFusion부터 BundleFusion까지 모두 장면이 움직이지 않는다고 가정했다. 사람이 걸어 다니는 공간을 dense하게 재구성하려면 움직이는 물체를 semantic segmentation이나 기하 residual로 걸러 내야 한다. [DynaSLAM](https://arxiv.org/abs/1806.05620)과 [MaskFusion](https://arxiv.org/abs/1804.09194) 등이 이 방향을 시도했다. 계산 비용과 robustness(강건성)를 실제 사용 수준으로 맞추는 일은 남은 과제다.

**복셀 지도의 메모리.** Voxblox와 OctoMap으로 메모리를 줄였지만, 건물 한 층이나 도시 블록 규모로 넓히고 해상도를 높이면 dense 지도의 메모리는 빠르게 커진다. 영역마다 해상도를 달리하는 방법으로는 §9.7에서 본 wavemap 같은 다해상도 구조가 나왔다. [Instant-NGP](https://arxiv.org/abs/2201.05989) 같은 implicit neural representation도 이 문제를 다룬다. 실시간 갱신 속도와 조회 속도를 함께 맞추는 일은 아직 남아 있다.

KinectFusion에는 loop closure가 없었다. 전에 본 장소를 알아보는 place recognition은 Ch.10에서 다룬다.

# Ch.10 — Place Recognition: FAB-MAP에서 NetVLAD, AnyLoc까지

Oxford 모바일 로보틱스 그룹의 Mark Cummins와 Paul Newman은 로봇이 이전에 지나간 장소를 알아보는 문제를 연구했다. VO(visual odometry, 영상만으로 이동량을 추정하는 방법)에는 drift가 쌓이므로, SLAM 시스템이 loop를 닫으려면 이 문제를 풀어야 한다. feature 기반, direct, dense 방식 모두 loop closure가 필요했다. 지금 보는 장면을 전에 어디서 봤는지 판단하는 일은 place recognition(장소 인식)이 맡았고, 이 분야는 tracking, mapping과 따로 발전했다.

---

## 10.1 BoW 이전의 place recognition

GPS가 잡히지 않는 실내, 터널, 고층 건물 사이에서 로봇이 loop를 닫으려면 과거 이미지 수천 장 가운데 지금 관측과 비슷한 것을 빨리 찾아야 한다. 모든 이미지와 하나씩 비교하면 이미지 수에 비례해 시간이 드는 선형 탐색이 되어, 이미지가 수만 장을 넘으면 실시간으로 처리하기 어렵다.

컴퓨터 비전에서는 Oxford의 Sivic과 Zisserman이 비슷한 검색 문제를 다뤘다. 이들이 2003년 ICCV에서 발표한 ["Video Google"](https://www.robots.ox.ac.uk/~vgg/publications/2003/Sivic03/sivic03.pdf)은 동영상 속 물체를 찾으려고 문서 검색의 TF-IDF(단어 빈도에 희귀도 가중치를 곱한 점수)를 이미지에 적용했다. SIFT 서술자를 k-means로 군집화해 "visual word"를 만들고, 이미지를 그 단어들의 빈도 벡터로 표현했다. inverted index(단어마다 그 단어가 나온 이미지 목록을 저장한 색인)를 쓰면 질의에 나온 visual word의 목록만 조회하면 되므로, 전체 영상을 훑지 않아도 된다. place recognition 연구자들은 이 방법을 곧 가져다 썼다.

---

## 10.2 FAB-MAP — 확률적 BoW와 Chow-Liu 트리 (2008)

Cummins와 Newman은 2008년 [Cummins & Newman. FAB-MAP: Probabilistic Localization and Mapping in the Space of Appearance](https://doi.org/10.1177/0278364908090961)를 발표했다.

FAB-MAP(Fast Appearance-Based Mapping)은 현재 장면이 데이터베이스의 어느 장소에 해당하는지, 혹은 새 장소인지를 확률로 판단한다. 비슷해 보이는 장소가 여러 곳 있으면 유사도가 가장 높은 후보가 틀릴 수 있어서, 유사도 점수만으로는 부족하다.

Cummins와 Newman은 이를 베이즈 추론 문제로 세웠다. 관측 $z_t$(visual word의 발생 여부 집합)가 주어졌을 때, 현재 위치가 데이터베이스의 각 장소 $\ell_i$일 확률을 계산한다:

$$P(\ell_i \mid z_t) \propto P(z_t \mid \ell_i) P(\ell_i)$$

어려운 부분은 $P(z_t \mid \ell_i)$다. visual word들이 서로 독립이라고 가정하면 naïve Bayes가 된다. 실제 visual word들은 서로 상관이 있다. "문"이라는 word가 등장하면 "문손잡이"라는 word도 같이 등장하기 쉽다. 독립 가정은 확률 값을 왜곡한다.

FAB-MAP은 **Chow-Liu tree**로 이 상관을 모델링했다. Chow-Liu tree는 word 쌍의 mutual information 합이 최대가 되도록 만든 트리 구조 그래프 모델이다. 두 word $e_i, e_j$ 사이의 mutual information은

$$I(e_i; e_j) = \sum_{e_i, e_j} P(e_i, e_j) \log \frac{P(e_i, e_j)}{P(e_i)P(e_j)}$$

로 정의되고, Chow-Liu 알고리즘은 이를 엣지 가중치로 삼아 최대 스패닝 트리를 구성한다. 이 트리로 joint likelihood를 분해하면

$$P(z_t \mid \ell_i) = \prod_k P(z_t^k \mid z_t^{\text{pa}(k)}, \ell_i)$$

가 된다. 여기서 $z_t^k \in \{0,1\}$은 $k$번째 word의 발생 여부이고, $\text{pa}(k)$는 트리에서 $k$의 부모 노드다. 이 분해는 word들이 함께 나타나는 패턴을 반영하므로, 복도처럼 비슷해 보이는 장소에서 false positive(잘못된 일치)가 줄어든다. vocabulary와 tree는 큰 이미지 집합으로 미리 학습한다.

FAB-MAP은 지금 위치가 데이터베이스에 없는 새 장소일 가능성도 따로 계산한다. 이 "new place" 가설을 넣자 false positive가 줄었다. loop closure에서 false positive가 하나만 나와도 지도 전체가 망가질 수 있다.

> 🔗 **차용.** FAB-MAP의 visual word는 Sivic & Zisserman의 "Video Google"(2003)에서 가져왔다. FAB-MAP은 문서 검색에서 쓰던 방법을 로봇의 장소 인식에 적용했다.

2011년 Cummins와 Newman은 [FAB-MAP 2.0](https://www.robots.ox.ac.uk/~mjc/Papers/cummins_newman_ijrr_fabmap2_2010_preprint.pdf)을 발표했다. 논문은 1,000 km 길이의 경로에서 appearance(겉모습)만으로 loop closure를 검출했다.

---

## 10.3 DBoW2 — binary descriptor와 vocabulary tree (2012)

FAB-MAP은 SURF 같은 부동소수점 서술자를 썼다. 2012년 무렵 SLAM 연구자들은 더 빠른 binary descriptor(BRIEF, ORB, BRISK 등)로 옮겨 가고 있었다. 부동소수점 서술자의 vocabulary를 그대로 쓰면 계산이 무거웠다.

Dorian Gálvez-López와 Juan D. Tardós(Universidad de Zaragoza)는 2012년 [Gálvez-López & Tardós. Bags of Binary Words for Fast Place Recognition in Image Sequences](https://doi.org/10.1109/TRO.2012.2197158)를 발표했다. Ch.7에서 본 **DBoW2**는 binary descriptor로 만든 vocabulary tree다. 서술자를 Hamming distance로 비교하므로 SIFT·SURF를 쓸 때보다 word를 훨씬 빨리 배정할 수 있었다.

이미지를 나타내는 BoW 벡터는 binary word의 빈도에 TF-IDF 가중치를 곱한 벡터다. $k$분기 $d$깊이 트리의 각 리프 노드 $w_i$에 TF-IDF 가중치

$$\eta_i = \frac{n_i}{n} \cdot \log \frac{N}{N_i}$$

를 준다. 여기서 $n_i$는 해당 이미지에 이 word가 나온 횟수, $n$은 총 word 수, $N$은 데이터베이스 이미지 수, $N_i$는 $w_i$를 포함한 이미지 수다. 두 이미지 $a$, $b$의 유사도는 L1-norm

$$s(\mathbf{v}_a, \mathbf{v}_b) = 1 - \frac{1}{2} \left\| \frac{\mathbf{v}_a}{|\mathbf{v}_a|} - \frac{\mathbf{v}_b}{|\mathbf{v}_b|} \right\|_1$$

으로 계산한다. Inverted index의 조회 비용은 word 수와 각 목록의 길이에 따라 달라진다.

> 🔗 **차용.** DBoW2의 vocabulary tree 개념은 Nistér & Stewénius의 2006년 ["Scalable Recognition with a Vocabulary Tree"](https://people.eecs.berkeley.edu/~yang/courses/cs294-6/papers/nister_stewenius_cvpr2006.pdf)(CVPR)에서 왔다. DBoW2는 이 구조를 binary descriptor에 맞게 바꾸고 가중치를 SLAM에 맞게 조정했다.

DBoW2는 오픈소스 라이브러리로 공개되어 널리 쓰였다. ORB-SLAM(2015)이 loop closure에 DBoW2를 썼고, ORB-SLAM2와 ORB-SLAM3도 DBoW2를 썼다. 공저자 Tardós는 ORB-SLAM 세 편 모두의 저자이기도 하다.

---

## 10.4 NetVLAD — CNN 기반 VPR (2016)

BoW 방식의 vocabulary는 특정 서술자로 특정 환경에서 학습한 것이다. 조명, 계절, 시점이 크게 바뀌면 visual word의 분포가 달라져서 미리 학습한 vocabulary가 잘 맞지 않았다.

Relja Arandjelović, Petr Gronat, Akihiko Torii, Tomáš Pajdla, Josef Sivic은 2016년 CVPR에서 [NetVLAD: CNN Architecture for Weakly Supervised Place Recognition](https://doi.org/10.1109/CVPR.2016.572)을 발표했다. 저자 Sivic은 2003년 "Video Google"의 저자이기도 하다.

NetVLAD는 **VLAD(Vector of Locally Aggregated Descriptors)** aggregation(국소 서술자를 이미지 하나의 벡터로 모으는 방법)을 미분 가능하게 만들었다.

VLAD는 2010년 [Jégou et al.](https://inria.hal.science/inria-00548637/file/jegou_compactimagerepresentation.pdf)이 제안했다. 각 local descriptor와 가장 가까운 cluster center(visual word) 사이의 차이를 cluster별로 더해 이미지 전체를 표현한다. cluster center $k$의 VLAD 부분 벡터는

$$\mathbf{V}(k) = \sum_{\mathbf{x}_i : \text{NN}(\mathbf{x}_i)=k} (\mathbf{x}_i - \boldsymbol{\mu}_k)$$

이고, 전체 VLAD 벡터 $\mathbf{V} = [\mathbf{V}(1)^\top, \ldots, \mathbf{V}(K)^\top]^\top$는 이를 모든 cluster에 대해 연결(concatenate)한 뒤 L2-normalize한 것이다. $K$ clusters, $D$차원 descriptor라면 최종 벡터는 $KD$차원이다. VLAD 벡터는 word마다 개수만 세는 BoW보다 정보를 많이 담는다.

> 🔗 **차용.** NetVLAD의 aggregation 설계는 Jégou et al.의 "Aggregating Local Descriptors into a Compact Image Representation"(CVPR 2010)의 VLAD를 이어받았다. NetVLAD는 VLAD의 hard assignment를 soft assignment로 바꿔 전체 파이프라인을 end-to-end로 학습할 수 있게 했다.

NetVLAD layer는 기존 VLAD의 nearest-neighbor 할당을 softmax로 완화한다:

$$\bar{a}_k(\mathbf{x}_i) = \frac{e^{\mathbf{w}_k^\top \mathbf{x}_i + b_k}}{\sum_{k'} e^{\mathbf{w}_{k'}^\top \mathbf{x}_i + b_{k'}}}$$

여기서 $\mathbf{x}_i$는 CNN에서 추출한 local feature, $\mathbf{w}_k$와 $b_k$는 학습 가능한 파라미터다. 이 soft 할당으로 NetVLAD 벡터를 누적하면

$$\mathbf{V}(k) = \sum_i \bar{a}_k(\mathbf{x}_i)\,(\mathbf{x}_i - \boldsymbol{\mu}_k)$$

이고, 전체 벡터 $\mathbf{V} = [\mathbf{V}(1)^\top, \ldots, \mathbf{V}(K)^\top]^\top$를 intra-normalization(각 부분 벡터 L2 정규화) 후 전체를 다시 L2-normalize하면 최종 VPR(visual place recognition) descriptor가 된다. gradient가 역전파되므로 CNN backbone과 함께 end-to-end로 학습할 수 있다.

저자들은 Google Street View Time Machine(같은 장소를 여러 시기에 찍은 Street View 이미지) 데이터로 같은 장소의 다른 시점 이미지 쌍을 양성 예, 다른 장소를 음성 예로 삼는 weakly supervised triplet loss를 썼다. GPS 위치를 약한 감독 신호로 써서 사람이 장소 레이블을 달지 않아도 학습할 수 있었다.

Pittsburgh 250k와 Tokyo 24/7 벤치마크에서 NetVLAD는 기존 VLAD 기반 방법과 학습하지 않은 CNN 표현을 크게 앞섰다. 낮과 밤처럼 조건이 바뀌어도 더 잘 버텼다. NetVLAD가 실제 SLAM 파이프라인에 바로 들어가지는 않았다. 추론 속도와 메모리 부담이 DBoW2보다 컸다.

---

## 10.5 Patch-NetVLAD, MixVPR, AnyLoc (2020-2023)

NetVLAD 뒤로 VPR 연구자들은 조건과 환경이 바뀌어도 성능이 유지되는 방법을 찾았다. 이 시기 VPR 논문들은 Mapillary Street Level Sequences(MSLS)와 계절 변화가 큰 Nordland 같은 데이터셋으로 평가했다.

2021년 Hausler et al.은 [Patch-NetVLAD](https://arxiv.org/abs/2103.01486)를 내놓았다. Patch-NetVLAD는 NetVLAD의 global descriptor로 후보를 먼저 찾고, 이미지를 patch로 나눠 patch별 NetVLAD 표현을 공간적으로 맞춰 보며 후보의 순위를 다시 매긴다. Tokyo 24/7에서 Recall@1은 NetVLAD의 64.8%에서 86.0%로 올랐다.

2023년 Ali-bey et al.의 [MixVPR](https://arxiv.org/abs/2303.02190)는 사전 학습된 backbone의 feature map을 MLP로 섞어(Feature-Mixer) global feature를 만들었다. 파라미터 수는 NetVLAD의 절반이 안 되면서 Pitts250k, MSLS, Nordland에서 기존 방법보다 높은 Recall@1을 보고했다.

Keetha et al.의 [AnyLoc: Towards Universal Visual Place Recognition](https://arxiv.org/abs/2308.00688)(RA-L 2024, arXiv 공개는 2023년)은 DINOv2의 self-supervised feature를 fine-tuning 없이 그대로 place recognition에 썼다.

> 🔗 **차용.** AnyLoc의 feature 추출은 Oquab et al.의 [DINOv2](https://arxiv.org/abs/2304.07193)(Meta AI, 2023)에서 사전 학습한 ViT 표현을 가져와 VLAD로 모은다. BoW와 VLAD 시절의 aggregation을 foundation model(대규모 데이터로 미리 학습해 여러 작업에 쓰는 모델) feature에 다시 적용했다.

DINOv2는 대규모 인터넷 이미지로 학습된 Vision Transformer(ViT)다. 여러 환경에 쓸 수 있는 범용 feature를 낸다. Keetha et al.은 DINOv2의 **facet**을 비교했다. facet은 ViT layer 안의 query(Q), key(K), value(V), token(patch feature) 출력을 가리킨다. 실험에서는 DINOv2의 value facet이 평균적으로 place recognition에 가장 좋았다. 이 value facet을 비지도 VLAD로 모으자, 재학습이나 fine-tuning 없이 도시, 실외, 실내, 항공, 수중, 지하 환경에서 하나의 방법이 동작했다. 논문은 기존 방법보다 최대 4배 높은 Recall@1을 보고했다.

센서 종류가 다른 데이터 사이의 장소 인식도 연구됐다. Lee et al.의 [(LC)²](https://arxiv.org/abs/2304.08660) (RA-L 2023)는 카메라 영상에서 얻은 disparity image와 LiDAR range image를 둘 다 2.5D depth image로 보고 서로 맞췄다. 이 cross-modal 일치를 pose graph의 loop 제약으로 넣어, 미리 만든 point cloud 지도 없이 LiDAR 기반 위치 추정을 했다. 조명이 나쁜 환경의 평가에는 Lee et al.의 [ViViD++](https://arxiv.org/abs/2204.06183) (RA-L 2022) 같은 데이터셋을 쓸 수 있다. ViViD++는 RGB, thermal, event, depth 카메라와 관성 센서를 함께 달고 같은 장소를 조명 조건을 바꿔 가며 반복 기록했다.

---

## 10.6 place recognition과 metric localization의 통합 시도 (2023-2024)

place recognition 모듈은 SLAM의 다른 부분과 떨어져 동작해 왔다. ORB-SLAM의 DBoW2 모듈은 mapping·tracking과 상관없이 이미지를 받아 loop 후보 ID만 내놓는다.

2023–2024년에는 Berton et al.의 [EigenPlaces](https://arxiv.org/abs/2308.10832)(2023)와 Izquierdo & Civera의 [SALAD](https://arxiv.org/abs/2311.15937)(2023 arXiv / CVPR 2024)가 시점 변화에 강한 global descriptor와 local feature aggregation을 발전시켰다. 두 방법이 내놓는 것도 데이터베이스에서 찾은 이미지다. metric pose(미터 단위의 실제 자세)가 필요하면 검색된 후보와의 기하 검증이나 별도의 localization 단계가 뒤따라야 한다.

2024년에는 3DGS(3D Gaussian Splatting)로 만든 장면 표현에서 place recognition용 descriptor를 뽑으려는 시도도 나왔다.

---

## 10.7 🧭 아직 열린 것

**계절·조명 극변.** Nordland(노르웨이 철도, 여름-겨울)와 Oxford RobotCar(1년치 계절 변화) 데이터셋에서는 이 어려움이 10년 넘게 보고된다. DINOv2 기반 방법이 이 격차를 줄였다.

**Place recognition과 metric localization의 통합.** ORB-SLAM 계열 파이프라인은 place recognition으로 후보 장소를 찾고, 서술자 매칭으로 기하 대응을 구한 뒤 PnP 같은 방법으로 자세를 추정한다. 두 과정을 표현 하나로 합쳤을 때 정밀도와 속도를 센서·장면·배포 조건마다 함께 만족하는지 확인하는 일은 남은 과제다.

**인식 가능한 장소 표현의 프라이버시.** 위치 추정용 지도도 복원 공격의 대상이 된다. [Pittaluga 등(CVPR 2019)](https://arxiv.org/abs/1904.03303)은 서술자가 붙은 SfM point cloud에서 장면 이미지를 되살렸다. 이 결과대로라면 가정, 병원, 사무실의 실내 지도를 만드는 상업용 로봇도 같은 위험을 안는다. 같은 해 [Speciale 등(CVPR 2019)](https://arxiv.org/abs/1903.05572)은 3D 점을 무작위 방향의 직선으로 바꾼 line cloud를 지도로 쓰자고 했다. 2021년 [Chelani, Kahl, Sattler](https://arxiv.org/abs/2103.05086)는 line cloud에서도 점의 위치와 이미지 내용을 대략 되살릴 수 있음을 보였다. 선을 아주 성기게 남기면 이미지의 세부는 되살리지 못했다. 저자들은 프라이버시를 지키는 장면 표현을 더 연구해야 한다고 결론에 적었다.

# Ch.11 — 학습 기반 단안 깊이 추정: Eigen에서 Depth Anything까지

monocular depth(단안 깊이) 추정은 컴퓨터 비전에서 오래된 ill-posed 문제(답이 하나로 정해지지 않는 문제)다. 카메라가 3D 세계를 2D로 투영할 때 깊이 정보를 잃으므로, 이미지 한 장을 만들어 낼 수 있는 3D 장면은 기하적으로 무수히 많다. 사람은 원근감, 폐색, 텍스처 기울기, 표면의 음영으로 단안 깊이를 판단한다. 2014년 NYU 대학원생 David Eigen은 CNN으로 이미지 한 장에서 깊이를 예측했다. 그 뒤 SLAM 파이프라인에 학습한 깊이를 넣는 연구가 이어졌다.

---

## 1. Eigen 2014 — 초기 CNN depth

2014년 이전에도 학습 기반 monocular depth 연구는 있었다. Stanford의 Ashutosh Saxena 등은 2005년 NIPS에서 [Markov Random Field(MRF)로 이미지 한 장의 depth map을 예측하는 방법](https://papers.nips.cc/paper/2921-learning-depth-from-single-monocular-images)을 발표했다. 후속 시스템 Make3D는 주로 실외 장면에서 superpixel마다 평면을 두어 거친 3D 구조를 예측했다. Make3D는 CNN 이전 학습 기반 단안 깊이 추정의 대표 사례다.

Eigen, Puhrsch, Fergus의 [Eigen et al. 2014](https://arxiv.org/abs/1406.2283)는 NIPS에서 발표됐다. 네트워크는 두 단계로 되어 있어, coarse network가 장면 전체의 깊이 구조를 예측하면 fine network가 국소 세부를 다듬는다. 저자들은 NYU Depth v2의 실내 장면 464개 가운데 학습용 249개 장면의 원시 영상에서 서로 다른 이미지 약 120,000장을 뽑아 학습했고, KITTI로도 따로 학습했다. 두 데이터셋에서 모두 같은 데이터로 학습한 Make3D보다 오차가 작았다.

> 🔗 **차용.** Eigen 2014는 Saxena 등이 정의한 문제, 곧 이미지 한 장에서 depth map을 예측하는 문제를 이어받았고, MRF 대신 CNN을 썼다.

**scale ambiguity**(척도 모호성)는 남았다. 네트워크가 내는 절대 스케일은 학습 데이터의 분포와 카메라 설정에 묶였다. NYU 실내에서 학습한 모델을 야외 영상에 쓰면 스케일이 틀리기 쉽다. 이 문제는 2024년에도 단안 metric depth(실제 미터 단위 깊이) 추정의 핵심 과제였다.

---

## 2. Garg → Godard — self-supervised depth

supervised depth 학습에는 정답 깊이가 붙은 데이터가 많이 필요했다. Kinect는 실내에서는 잘 작동했지만 햇빛 아래에서는 적외선 패턴이 보이지 않았다. 큰 실외 RGB-D 데이터셋을 만드는 데는 비용이 많이 들었다.

2016년 University of Adelaide의 [Ravi Garg 등](https://arxiv.org/abs/1603.04992)은 stereo 이미지 쌍을 학습 신호로 썼다. 왼쪽 이미지로 depth를 예측하고, 그 depth와 카메라 baseline으로 오른쪽 이미지를 재구성한다. 실제 오른쪽 이미지는 이미 있으므로, 재구성한 이미지와 실제 오른쪽 이미지의 밝기 차이(photometric loss)를 줄이도록 학습하면 정답 깊이가 필요 없다.

Clément Godard(UCL)는 2017년 이 아이디어를 [Godard et al. 2017](https://doi.org/10.1109/CVPR.2017.699)의 **MonoDepth**로 발전시켰다. 왼쪽 이미지 기준 disparity와 오른쪽 이미지 기준 disparity가 서로 맞아야 한다는 제약(left-right consistency)을 더했고, photometric loss에 구조적 유사도(SSIM)를 L1과 함께 넣었다. stereo 쌍은 학습할 때만 필요하고 추론에는 이미지 한 장만 쓴다. 원 논문은 KITTI에서 당시 비교 방식으로 평가해, 표에 실린 기존 self-supervised 방법보다 오차가 낮다고 보고했다.

> 🔗 **차용.** Garg와 Godard의 photometric loss는 stereo matching 문헌의 밝기 일치 제약을 depth network의 학습 신호로 쓴 것이다. 이 제약은 [Scharstein과 Szeliski(2002)](https://vision.middlebury.edu/stereo/taxonomy-IJCV.pdf)가 정리한 disparity 추정 방법들에 공통으로 들어 있다.

2019년 Godard의 *MonoDepth2* ([Godard et al. 2019, ICCV](https://arxiv.org/abs/1806.01260))는 stereo 쌍 없이 단안 video만으로도 self-supervised 학습을 한다. pose network가 연속 프레임 사이의 카메라 운동을 예측하면, 그 운동과 depth network의 출력으로 이웃 프레임을 현재 프레임 시점으로 warping한다. 두 네트워크는 이 warping 오차가 줄도록 함께 학습한다. MonoDepth2는 여기에 **minimum reprojection loss**와 **auto-masking** 등을 더했다. **minimum reprojection loss**는 픽셀마다 여러 소스 프레임 가운데 photometric error가 가장 낮은 것만 써서, 한 프레임에서 가려진(occluded) 영역의 오류를 줄인다. **auto-masking**은 픽셀마다 두 오차를 비교한다. 하나는 source frame을 warping 없이 그대로 비교한 identity reprojection error이고, 다른 하나는 예측 depth·pose로 warping한 오차다. 앞의 오차가 뒤의 오차 이하인 픽셀은 학습에서 뺀다. 이 조건으로 카메라가 멈춘 프레임이나 카메라와 비슷한 속도로 움직여 인접 프레임에서 겉보기 위치가 거의 변하지 않는 물체를 거른다.

움직이는 물체와 반사 표면에서는 photometric consistency(같은 점은 어느 프레임에서나 밝기가 같다는 가정)가 깨진다. 하늘처럼 texture가 없는 영역에서는 밝기 차이로 대응을 정할 수 없다. 단안 video로 학습하면 스케일도 정해지지 않는다.

---

## 3. MiDaS — 데이터셋 혼합

Intel의 René Ranftl 등은 [Ranftl et al. 2022](https://doi.org/10.1109/TPAMI.2020.3019967)에서 **MiDaS**를 발표했다. 논문 제목은 "Towards Robust Monocular Depth Estimation: Mixing Datasets for Zero-shot Cross-dataset Transfer"이고, 2020년 IEEE TPAMI에 온라인으로 먼저 공개된 뒤 2022년 44권 3호에 실렸다. MiDaS는 여러 데이터셋을 섞어 모델 하나를 학습했다.

데이터셋마다 depth의 단위와 스케일이 다르다. 학습에 쓴 ReDWeb은 웹의 stereo 이미지, MegaDepth는 인터넷 사진의 SfM 재구성, 3D Movies는 3D 영화에서 얻은 disparity다. 그대로 섞으면 데이터셋마다 loss가 재는 기준이 달라진다.

Ranftl 등은 **affine-invariant loss**를 썼다. loss를 계산할 때 이미지마다 예측과 정답에서 스케일과 시프트를 걷어 낸 뒤 비교한다. 예측과 정답 각각에서 중앙값을 빼 shift를 없애고, 중앙값에서 떨어진 절대편차의 평균으로 나눠 scale을 없앤다. 이렇게 정규화하면 데이터셋마다 단위가 달라도 함께 학습할 수 있다. 그 대가로 네트워크는 scale과 shift가 정해지지 않은 상대 깊이를 배운다.

초기 MiDaS는 NYU나 KITTI처럼 학습에 쓰지 않은 데이터셋에서도 잘 동작했다(zero-shot cross-dataset transfer). 이후 MiDaS 버전들은 학습 데이터셋을 최대 12개로 늘렸다. 야외와 실내처럼 분포가 다른 영상에서도 relative depth(상대 깊이)를 추정했지만, 절대 스케일은 복원하지 못했다.

Ranftl 팀은 2021년 [DPT(Dense Prediction Transformer)](https://arxiv.org/abs/2103.13413)를 따로 발표해 MiDaS의 backbone을 ViT 기반으로 바꿨다. MiDaS v3부터 DPT가 기본 구조가 됐고, v3.1(2022)은 여러 transformer backbone을 더한 판이다.

> 🔗 **차용.** Depth Anything은 DINOv2로 사전학습한 encoder에 DPT decoder를 붙였다.

---

## 4. Depth Anything — 데이터 규모 확대

2024년 1월 HKU와 TikTok의 Lihe Yang 등은 [Yang et al. 2024](https://arxiv.org/abs/2401.10891)에서 **Depth Anything**을 발표했다. 이들은 공개 데이터셋 6개에서 모은 labeled 이미지 150만 장에, 공개 대규모 데이터셋 8개에서 모은 unlabeled 이미지 6,200만 장을 더했다. unlabeled 이미지에는 모델이 만든 pseudo-label(가짜 정답)을 붙여 학습에 넣었다. 사전학습한 encoder(DINOv2)의 semantic feature와 맞추는 auxiliary loss도 더했다.

Depth Anything은 KITTI, NYUv2, Sintel, DDAD, ETH3D, DIODE의 zero-shot relative depth 평가에서 MiDaS v3.1보다 나은 결과를 보고했다. 모델은 ViT-S(24.8M), ViT-B(97.5M), ViT-L(335.3M) 세 크기로 공개됐다.

같은 해 나온 [Depth Anything v2](https://arxiv.org/abs/2406.09414)는 Virtual KITTI 2, Hypersim 같은 합성 데이터로만 teacher 모델을 학습했다. 그리고 이 teacher가 실제 영상에 붙인 pseudo-label로 student 모델을 학습했다. 합성 데이터에는 반사·투명 표면처럼 실제 데이터에서 정답을 달기 어려운 부분도 정확한 depth가 있다. 저자들은 v2가 v1보다 경계와 얇은 구조를 더 세밀하게 예측한다고 보고했다.

기본 Depth Anything 모델은 relative depth만 내고 절대 스케일은 내지 않는다. [ZoeDepth(Shariq Farooq Bhat et al. 2023)](https://arxiv.org/abs/2302.12288)는 relative depth로 사전학습한 모델에 도메인별 metric-bin head를 붙이고, 입력 영상의 도메인을 자동으로 판별해 맞는 head로 보내게 했다. [Depth Anything v2(2024)](https://arxiv.org/abs/2406.09414)는 relative-depth backbone을 metric label로 따로 fine-tuning한 모델도 공개했다. [Metric3D v2(2024)](https://arxiv.org/abs/2404.15506)는 입력을 canonical camera space로 변환해 초점거리 차이에서 오는 모호성을 줄인 뒤, 추론 결과를 camera parameter로 되돌려 metric depth를 얻는다. 이렇게 단안 모델이 여러 도메인에서 metric 깊이를 내게 됐다.

---

## 5. SLAM에서 쓰기

2017년 CNN-SLAM 무렵부터 monocular depth 모델을 SLAM에 넣으려는 시도가 있었다. 학습한 깊이가 특히 쓸모 있는 곳은 초기화다. Monocular SLAM은 두 프레임에서 triangulation을 하려면 카메라가 충분히 움직여 baseline이 생겨야 하고, scale도 처음부터 정해지지 않는다.

첫 프레임에 depth prior를 주면 초기화가 빨라지고 장면 구조의 초기값도 생긴다. metric depth 모델이거나 알려진 기준으로 scale을 보정한 prior라면 metric scale의 초기값도 줄 수 있다. [Teed와 Deng이 2021년 발표한 DROID-SLAM](https://arxiv.org/abs/2108.10869)은 recurrent optical flow 갱신과 BA를 한 네트워크 안에서 반복한다. DROID-SLAM을 바탕으로 한 후속 연구들은 monocular depth prior를 기하 초기화에 쓰는 방식을 실험했다.

scale 복원에도 쓰였다. 단안 visual odometry(VO)는 이동할수록 scale drift가 쌓인다. metric으로 보정한 depth 예측을 주기적으로 scale 기준으로 삼으면 이 drift를 줄일 수 있다. MiDaS 같은 relative depth 출력을 쓰려면 외부 metric 기준이 따로 있어야 한다.

> 📜 **예언 vs 실제.** Eigen은 2014년 논문 끝에서 surface normal 같은 3D 기하 정보를 함께 다루는 것을 다음 연구로 들었다. 이듬해 Eigen과 Fergus는 [depth, surface normal, semantic label을 한 multi-scale 네트워크로 예측하는 논문](https://arxiv.org/abs/1411.4734)(ICCV 2015)을 냈다. depth와 scene parsing을 함께 학습한 [PAD-Net](https://arxiv.org/abs/1805.04409)(CVPR 2018) 같은 multi-task 연구도 이어졌다.

---

## 🧭 아직 열린 것

**반사·투명 표면의 depth.** 유리, 물, 금속 반사면에서는 카메라에 찍힌 상이 그 표면의 위치를 알려 주지 않는다. Depth Anything v2는 합성 데이터로 이런 표면의 정답을 보충했다(§4). 투명 물체를 집는 로봇용 [ClearGrasp(Sajjan et al. 2020)](https://arxiv.org/abs/1910.02550) 같은 특정 상황용 방법도 있다.

**동적 장면에서 카메라 운동과 물체 운동의 분리.** 자동차, 사람, 자전거가 움직이는 장면에서는 photometric consistency가 성립하지 않는다. self-supervised 방법들은 대개 움직이는 물체를 masking해서 학습에서 뺐다. 움직이는 물체의 depth와 카메라 자체의 운동(ego-motion)을 함께 푸는 문제는 [Ranjan et al.(2019)](https://arxiv.org/abs/1805.09806)을 비롯한 여러 연구가 시도했다.

**Metric scale의 일반화.** ZoeDepth와 Depth Anything v2의 metric 모델은 metric label로 scale을 학습한다. Metric3D v2는 camera parameter를 입력으로 받아 보정한다. 그런데 intrinsic(초점거리 같은 카메라 내부 파라미터)이나 믿을 만한 메타데이터가 없는 CCTV·기록 영상도 많다. [UniDepth](https://arxiv.org/abs/2403.18913)(Piccinelli et al., CVPR 2024)와 Apple의 [Depth Pro](https://arxiv.org/abs/2410.02073)(Bochkovskii et al., ICLR 2025)는 카메라 intrinsic 없이 이미지 한 장에서 metric depth를 낸다고 발표했다. UniDepth 저자들은 ETH3D와 IBims-1처럼 장면 scale을 제대로 잡지 못하는 경우가 있다고 함께 적었다.

---

자세도 네트워크로 바로 추정하려는 연구가 있었다. 2015년 Cambridge의 [PoseNet](https://arxiv.org/abs/1505.07427)은 feature 추출이나 최적화 없이 이미지 한 장에서 절대 자세를 바로 출력했다. Ch.12는 이런 end-to-end 방법을 다룬다.
