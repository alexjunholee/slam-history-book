## 6.4 iSAM and iSAM2: Online Incremental Inference

Square Root SAM laid a clean theoretical foundation, yet it remained a batch solver: every time a new sensor reading arrived, re-factorizing $J^T J$ from scratch repeated massive amounts of work—costing $O(n^3)$ for dense matrices and still growing significantly for sparse ones depending on graph connectivity and elimination order.

In 2008, [Kaess, Ranganathan, and Dellaert solved that online bottleneck with **iSAM** (incremental Smoothing and Mapping)](https://www.cs.cmu.edu/~kaess/pub/Kaess08tro.pdf). Instead of rebuilding the entire QR decomposition at every step, iSAM appended the new rows for incoming factors and updated the upper-triangular matrix $R$ incrementally using Givens rotations.

Still, iSAM1 had a structural weak spot: its relinearization schedule. Because $R$ is built by linearizing nonlinear measurement models around a current estimate, drift away from that linearization point slowly erodes accuracy. iSAM1 compensated with **periodic full relinearization**—halting every few dozen steps to relinearize the entire factor graph and re-run QR decomposition from scratch, especially when loop closures triggered heavy fill-in inside $R$. In practice, an ostensibly incremental algorithm periodically fell back into batch mode.

In 2012, [iSAM2](https://doi.org/10.1177/0278364911430419) eliminated that batch fallback using a new data structure called the **Bayes tree**. Constructed from the chordal Bayes net produced by variable elimination, a Bayes tree groups tightly coupled variables into clique nodes linked by separator edges (their shared variables). When a new factor enters the graph, iSAM2 identifies only the cliques along the affected branch of the tree, converts that subtree back into a local factor graph, relinearizes, and re-optimizes—leaving the rest of the map untouched. Paired with **fluid relinearization**, which selectively updates only variables whose linearization drift crosses a threshold and propagates changes through separators no farther than necessary, iSAM2 replaced "everything, every cycle" with "only the affected cliques, only when needed." Even after a loop closure, affected cliques frequently remained bounded enough to avoid full global recomputation.

> 🔗 **Borrowed.** The Bayes tree extends the junction tree (join tree) lineage in probabilistic graphical models, represented by the elimination-order and chordal-graph inference techniques in textbooks such as Koller-Friedman's [*Probabilistic Graphical Models*](https://mitpress.mit.edu/9780262013192/probabilistic-graphical-models/). It brought a technique from AI inference into real-time robot SLAM.

Kaess and Dellaert packaged iSAM2 inside [GTSAM (Georgia Tech Smoothing and Mapping)](https://gtsam.org), an open-source C++ library with Python bindings whose development continued across Dellaert's work at Georgia Tech and Google, eventually powering autonomous vehicles, aerial drones, and manipulator calibration.

---

## 6.5 g2o: A General Graph Optimizer in the ROS Ecosystem

While the Georgia Tech group advanced incremental inference theory, a European collaboration across TUM (Munich) and Freiburg—Rainer Kümmerle, Giorgio Grisetti, Hauke Strasdat, Kurt Konolige, and Wolfram Burgard—built an extraordinarily versatile open-source solver. Presented at ICRA 2011, [g2o](https://doi.org/10.1109/ICRA.2011.5979949) (general graph optimization) aimed to "handle any kind of graph optimization in a plug-in manner," blending Burgard and Grisetti's Freiburg mobile-robotics heritage, Strasdat's monocular Visual SLAM insights, and Konolige's industrial software discipline.

The architecture of g2o cleanly separates three layers: *vertices* represent state variables, *edges* encode error functions and Jacobians, and a modular *linear solver* handles sparse matrix systems via pluggable backends such as Cholmod, CSparse, Eigen, or custom libraries. Users only specify vertex types and edge residuals, leaving g2o to drive Gauss-Newton or Levenberg-Marquardt optimization automatically.

Arriving just as ROS (Robot Operating System) swept through robotics labs in the early 2010s, g2o quickly became one of the primary engines behind graph SLAM, powering landmark systems such as ORB-SLAM and LSD-SLAM. Even so, the ROS ecosystem never standardized on a single solver: particle-filter mapping lived on in `gmapping`, and Google's Cartographer built on Ceres. g2o became enormously influential without claiming a monopoly.

---

## 6.6 Why the Field Converged Here

Tracing the arc from Chatila and Laumond (1985), Lu and Milios (1997), and Gutmann and Konolige (1999) through Folkesson and Christensen (2004), Thrun's group, Dellaert (2006), and Kaess (2012) reveals more than a series of faster linear-algebra tricks.

The real revolution was a shift in how SLAM modeled time and memory. EKF-SLAM tracks only the current state and its covariance, marginalizing out every past robot pose as soon as the robot moves on; past errors become frozen inside the current state, forcing an expensive $O(N^2)$ global covariance update whenever a loop closure discovers accumulated drift.

Graph SLAM refuses to forget the past. By keeping historical poses, landmarks, and observations inside the graph, a loop closure simply drops in a new edge, and re-optimization adjusts the entire trajectory consistently (→ Chapter 10 for time-continuous trajectories). Keeping past poses revisable is the fundamental divide separating graph optimization from filtering.

The computational contrast is equally sharp. While EKF-SLAM pays $O(N^2)$ in memory and update time for $N$ landmarks, sparse Cholesky or QR factorization cuts graph-update costs dramatically—depending on graph connectivity, variable-elimination order, fill-in, and the size of the updated region (since physical motion inside a bounded area does not automatically guarantee $O(N \log N)$ complexity by itself).

> 📜 **Prediction vs. outcome.** The limits of Dellaert's batch Square Root SAM (2006) led the same group toward incremental methods. iSAM handled the problem in 2008 with Givens-rotation updates, and iSAM2 improved loop-closure efficiency in 2012 with the Bayes tree. GTSAM, Ceres, and g2o all handle nonlinear least squares, but differ in their solvers and incremental data structures. The three papers resolved one problem in stages, largely along the predicted path.

Even marginalization proved cleaner in graph form. When real systems prune old poses to keep map size bounded, a graph converts their eliminated connections into a compact prior factor linking the remaining variables. Just as in filters, that compression introduces linearization approximations that require careful handling—motivating practical compromises such as sliding-window optimization and keyframe selection.

---

## 6.7 Nonlinearity and Robustness: The Layer of Practical Engineering

Moving from tidy factor-graph theory to messy real-world robots exposed a gap that consumed much of 2010s SLAM engineering.

First came **initialization sensitivity**. Because Gauss-Newton and Levenberg-Marquardt are local optimizers, starting far from the true trajectory sends them into twisted local minima—and a single false loop-closure match can yank the initial estimate off course, making front-end outlier rejection indispensable. Chapter 7 (Certifiable SLAM) examines how convex relaxations via semidefinite programming (SDP) tackle this local-minimum trap and certify global optimality.

Second came **fragility to outliers**. Standard squared error amplifies bad loop closures disproportionately, so both g2o and GTSAM let engineers swap in robust loss kernels such as Huber or Cauchy. Yet selecting and tuning the right kernel for a given sensor and environment remains largely an art guided by engineering experience even in 2026.

Third came **marginalization fill-in**. Although iSAM2's Bayes tree performs exact incremental inference, unbounded growth in variables forces deployed systems to marginalize out older poses—generating dense fill-in that must be carefully sparsified or approximated as prior factors without destabilizing the map.

> 📜 **Prediction vs. outcome.** g2o's generality lies in allowing users to define states as vertices and observation constraints as edges. New line, plane, inertial, or object constraints can be implemented through that interface; examples must be checked against the estimator and edge implementation actually used by each system. Chapter 9 describes preintegration, the standard way to place IMU factors in the graph. As of 2026, however, g2o itself prioritizes interface stability and compatibility with existing users over broad expansion of its built-in factors. Users commonly add new factor types through inheritance, forks, or wrappers.

---

## Still open

**Choosing a robust kernel.** While Huber, Cauchy, Geman-McClure, and DCS are all standard options, no principled theory prescribes in advance which robust loss will work best for a given sensor suite and environment; engineers still tune them by hand. Researchers are exploring learned cost functions, though integrating adaptive learned losses cleanly into online incremental backends remains unresolved.

**Non-Gaussian uncertainty in factor graphs.** Standard continuous optimization in GTSAM and g2o rests on Gaussian noise assumptions, extended piecemeal with robust kernels, max-mixtures, or hybrid factors. Capturing true multimodal pose hypotheses and loop-closure mismatch probabilities in real time without blowing up compute remains an open problem.

**Bayes tree growth in densely looped maps.** The Bayes tree shines when new constraints touch only local cliques. Once long-term operation packs a large map with dense, overlapping loop closures, affected subtrees and fill-in can expand rapidly, driving up memory and latency unless checked by hierarchical submapping or sparsification.

---

By the early 2010s, the debate between filters and graphs had largely settled: tools like g2o and GTSAM made optimization backends reliable enough that research momentum pivoted upward toward the front end. Instead of asking *how* to solve a loop closure, engineers began asking *which visual features* could recognize a revisited place across drastic viewpoint and lighting shifts.

Yet before leaving the backend behind, one nagging mathematical question still hung in the air: when g2o or GTSAM reports convergence, how can we know whether it actually found the true global minimum (→ Chapter 7)?


---

# Chapter 7. Certifiable Global Optimality

The trajectory from Lu and Milios to g2o and GTSAM gave SLAM fast, scalable backends, yet left one uncomfortable flaw intact: pose graph optimization is non-convex, so Gauss-Newton and Levenberg-Marquardt can silently settle into local minima. For years, practitioners leaned on a comfortable rule of thumb—*"start from a decent odometry guess, and it usually solves fine"*—even though deployed backends occasionally twisted into completely wrong maps without issuing any warning. Beginning in 2015, Luca Carlone at MIT set out to replace that empirical faith with mathematical guarantees. His work on Lagrangian duality catalyzed David Rosen's SE-Sync (2019), Briales and Gonzalez-Jimenez's Cartan-Sync, Yang and Carlone's TEASER, and Papalia's CORA—transforming SLAM backends from local optimizers that *usually* work into convex relaxations capable of issuing certificates of global optimality. Remarkably, every tool powering that transformation was borrowed from outside SLAM: Shor relaxation from operations research, Burer-Monteiro factorization from mathematical optimization, Riemannian optimization from differential geometry, and Kirchhoff's Matrix-Tree Theorem from nineteenth-century graph theory.

---

## 7.1 The Old Anxiety of Local Minima

As Chapter 6 §6.7 noted, sensitivity to initialization is the Achilles' heel of any graph SLAM backend. Because the objective is non-convex in the 3D rotation matrices $\boldsymbol{R}_i \in \mathrm{SO}(3)$, Gauss-Newton can slide into the wrong basin whenever the initial pose guess strays too far from the truth. The multi-story parking-garage example in Handbook §6.1 illustrates this starkly: out of four random initializations, only one lands at the same global minimum as SE-Sync, while the other three twist into absurd local minima with the garage floors visibly folded into one another.

Through the late 2000s, robotics engineers defended against that hazard in two practical ways: feeding the solver as clean an odometry initialization as possible, and aggressively pruning false loop closures at the front end. Both habits helped, yet neither could tell whether a converged solution was truly the global optimum. Around 2010, Shoudong Huang and Gamini Dissanayake highlighted a deeper snag: even starting from a good initial guess, ambiguous measurements can still stall the optimizer at the wrong solution. Around the same time, pose graph optimization (PGO) was formally proven NP-hard in the worst case—even though tools like g2o kept succeeding routinely on everyday robot logs.

By the mid-2010s, backend theorists zeroed in on that striking gap between worst-case complexity and real-world success. In optimization, convergence of Gauss-Newton guarantees at most local stationarity: under ideal second-order conditions, a local minimum exhibits zero gradient and a positive-semidefinite Hessian, and finite-precision numerical solvers may even halt early due to tolerances or poor conditioning. Worst of all, failure is hardest to spot precisely when a backend calmly reports convergence.

> 🔗 **Borrowed.** Chapter 6's robust kernels (Huber, Cauchy) and graduated non-convexity (GNC) share a common root in the robust statistics and duality theorem of [Black & Rangarajan (1996)](https://cs.brown.edu/people/mjblack/Papers/ijcv1996.pdf). One branch adjusted cost weights to damp out outliers; the other harnessed that same duality to steer around non-convexity.

---

## 7.2 Shor Relaxation — A Tool From Operations Research

Every bit of non-convexity in PGO traces back to the rotation constraint $\boldsymbol{R}_i \in \mathrm{SO}(d)$. Orthogonality ($\boldsymbol{R}^\top \boldsymbol{R} = \boldsymbol{I}$) is already quadratic, and although $\det(\boldsymbol{R})=+1$ looks cubic in three dimensions, right-handedness can be rewritten equivalently using quadratic cross-product relations among the matrix columns. Paired with a quadratic cost function, those constraints turn PGO into a standard **QCQP** (Quadratically Constrained Quadratic Program)—a class of problems for which operations research had developed a powerful convex relaxation back in 1987: [Naum Shor's relaxation](https://link.springer.com/article/10.1007/BF01582220).

Shor's trick rests on the trace identity $\boldsymbol{x}^\top \boldsymbol{M}\boldsymbol{x} = \mathrm{tr}(\boldsymbol{M}\boldsymbol{x}\boldsymbol{x}^\top)$. By introducing a lifted symmetric matrix variable $\boldsymbol{X} \triangleq \boldsymbol{x}\boldsymbol{x}^\top$, every quadratic term in the original QCQP becomes purely *linear* in $\boldsymbol{X}$, concentrating all non-convexity into two requirements: $\boldsymbol{X} \succeq 0$ and rank 1. Dropping that stubborn rank-1 constraint yields a pure convex **semidefinite program (SDP)**—expanding the search space from $n$ variables to $n(n+1)/2$, yet making global optimization tractable in polynomial time:

$$d^* = \min_{\boldsymbol{X}\in\mathbb{S}^n} \mathrm{tr}(\boldsymbol{C}\boldsymbol{X}) \;\; \text{s.t.} \;\; \mathrm{tr}(\boldsymbol{A}_i\boldsymbol{X})=b_i,\; \boldsymbol{X}\succeq 0.$$

The magic of this relaxation flows from weak duality, $d^* \le p^*$: the SDP optimum $d^*$ can never exceed the true global minimum $p^*$ of the original QCQP. Consequently, for any candidate solution $\hat{\boldsymbol{x}}$, comparing its objective value against $d^*$ via $f(\hat{\boldsymbol{x}}) - d^*$ immediately upper-bounds how far $\hat{\boldsymbol{x}}$ can possibly sit from global optimality—giving birth to the word "certifiable." Better still, whenever the SDP solution $\boldsymbol{X}^*$ happens to come out rank 1, it factors cleanly as $\boldsymbol{X}^* = \boldsymbol{x}^*\boldsymbol{x}^{*\top}$, certifying $\boldsymbol{x}^*$ as a true global minimizer of the original non-convex problem. The natural follow-up question was how often SLAM graphs enjoy that exact zero-gap miracle.

That question launched a wave of work with two 2015 papers by Luca Carlone at IROS and ICRA ([Carlone et al. 2015 "Lagrangian duality in 3D SLAM"](https://arxiv.org/abs/1506.00746) and [Carlone & Dellaert 2015 "Planar pose graph optimization"](https://doi.org/10.1109/ICRA.2015.7139264)). Having just completed his 2014 TRO survey of initialization methods for g2o and GTSAM—where he saw firsthand how often conflicting odometry and loop closures trapped local solvers—Carlone tested Lagrangian duality on real benchmarks and discovered empirically that the duality gap vanished in nearly every 2D PGO instance, while sketching the extension to 3D. Even though those 2015 papers could not yet specify exact conditions guaranteeing a zero gap, [Briales & Gonzalez-Jimenez (2017)](https://arxiv.org/abs/1702.03235) soon extended the framework to SO(3) synchronization with Cartan-Sync. Meanwhile, Nicolas Boumal, P.-A. Absil, and Rodolphe Sepulchre were advancing Riemannian optimization just as Burer and Monteiro's low-rank SDP factorization from 2003 waited in the wings—setting the stage for David Rosen and his collaborators to bring all the pieces together in 2019.

---

## 7.3 SE-Sync — What Rosen 2019 Assembled

Published in *IJRR* in 2019, [Rosen, Carlone, Bandeira, and Leonard's SE-Sync](https://arxiv.org/abs/1612.07386) became the landmark reference for certifiable SLAM. Rosen had earned his PhD at MIT under John Leonard—the same Leonard who, alongside Durrant-Whyte in Chapter 4, helped christen the name "SLAM" in the early 1990s—and teamed up with Carlone, Leonard, and applied mathematician Afonso Bandeira, who supplied the theoretical proof guaranteeing the global optimality of rank-deficient second-order critical points. Uniting robotics, SLAM, mathematical optimization, and applied mathematics, SE-Sync fused Shor relaxation, analytical translation elimination, Burer-Monteiro low-rank parameterization, and Boumal's Riemannian Staircase into a single PGO solver.

SE-Sync executes in three clean steps. First, noticing that translations reduce to linear least squares once rotations are fixed—a property Carlone had highlighted in his 2014 TRO survey—the algorithm eliminates $\boldsymbol{t}$ analytically in closed form (Problem 6.2). Second, Shor relaxation lifts the remaining rotation-only problem $\min_{\boldsymbol{R}\in\mathrm{SO}(d)^n} \mathrm{tr}(\tilde{\boldsymbol{Q}}\boldsymbol{R}^\top\boldsymbol{R})$ into a convex SDP (Problem 6.3). Third, because standard interior-point SDP solvers choke once a $dn \times dn$ matrix reaches a few thousand poses, Burer-Monteiro reparameterization ($\boldsymbol{Z} = \boldsymbol{Y}^\top \boldsymbol{Y}$) recasts the SDP into a compact, unconstrained optimization problem over the smooth Stiefel manifold (Problem 6.4).

Two complementary theorems underwrite the algorithm's reliability. Theorem 6.1 establishes **exact recovery**: whenever measurement noise stays below a threshold $\beta$, the SDP relaxation admits a unique solution $\boldsymbol{Z}^*$ of rank $d$ that recovers the exact global minimum of the original maximum-likelihood problem. (Unlike a vector QCQP whose exact solution has rank 1, SE-Sync stacks rotations as $\boldsymbol{Z}=\boldsymbol{R}^\top\boldsymbol{R}$ with $\boldsymbol{R}\in\mathbb{R}^{d\times dn}$, so an exact recovery has rank $d$.) The catch is that $\beta$ depends on the unknown ground-truth matrix and cannot be evaluated beforehand. Theorem 6.2—adapted from Boumal et al.—closes that practical gap by proving that any rank-deficient second-order critical point on the Stiefel manifold is a global minimum of the SDP. Together, the two theorems power the **Riemannian Staircase**: start at low rank, locate a second-order critical point, test for rank deficiency, and increment the rank by one if needed. Because every $\boldsymbol{Y}$ is guaranteed to be row-rank-deficient once rank reaches $dn + 1$, the staircase terminates in finitely many steps—and on typical SLAM benchmarks, a single step almost always suffices.

Across standard benchmarks such as `sphere`, `torus`, and `garage`, SE-Sync matched the speed of g2o and GTSAM while delivering something neither local solver could: an a posteriori certificate. Where g2o and GTSAM simply return an answer and fall silent, Rosen's solver outputs an explicit suboptimality bound—and whenever that bound hits zero, the map is provably globally optimal. (Conversely, a nonzero gap warns that optimality is uncertified, without proving the candidate suboptimal.) More than twenty years after Lu and Milios, a SLAM backend could finally prove its own solution right.

> 📜 **Prediction vs. outcome.** In §8.2 of the IJRR 2019 paper, Rosen wrote that *"the algebraic simplification we have shown could be extended to anisotropic noise, outliers, and a variety of sensor modalities."* That forecast proved largely prescient: Holmes and Barfoot's 2023 landmark-SLAM extension, Papalia's 2024 CORA for range measurements, and Yang and Carlone's TEASER line soon followed. Yet the most coveted prize—bringing SE-Sync-style certification to perspective projection in visual SLAM—remained unrealized as of 2026, because rational camera projection resists folding cleanly into polynomial optimization.

> 🔗 **Borrowed.** The Burer-Monteiro factorization at the heart of SE-Sync is the low-rank SDP method of [Burer & Monteiro (2003)](https://link.springer.com/article/10.1007/s10107-002-0352-8), later sharpened by [Boumal-Voroninski-Bandeira (2016)](https://arxiv.org/abs/1605.08101)'s Riemannian proof of the globality of second-order critical points, which Rosen brought into SLAM. From pure math to the robot backend, sixteen years.

---

## 7.4 The Unexpected Equivalence of Graph Laplacian and Fisher Information

Once a backend certifies that it has found the true global minimum, a natural second question arises: *how close is that global minimum to physical reality?* Classical estimation theory answers that question through the Cramér-Rao Lower Bound (CRLB) and the **Fisher Information Matrix (FIM)**. In a simplified PGO model with fixed rotations, Rosen, Khosoussi, and Barfoot uncovered a striking identity: the FIM equals nothing more than the Kronecker product of the graph's weighted reduced Laplacian with the identity matrix:

$$\mathcal{I} = \boldsymbol{J}^\top \boldsymbol{\Sigma}^{-1} \boldsymbol{J} = \boldsymbol{L}_w \otimes \boldsymbol{I}_3.$$

This compact equation carries remarkable power: purely from the *connectivity graph*—even before collecting a single physical sensor reading—one can quantify how accurate the final pose estimate will be. By Kirchhoff's Matrix-Tree Theorem, the determinant of the reduced Laplacian counts the graph's weighted spanning trees, linking directly to D-optimality (maximizing the determinant of the information matrix), while the graph's algebraic connectivity (Fiedler value) governs E-optimality (bounding worst-case estimation variance). By the 2020s, Kirchhoff's 1847 theorem for electrical resistor networks had become the mathematical foundation of measurement selection and active SLAM—turning "maximize information" into spectral optimization of the graph Laplacian.

[The post-2014 work of Kasra Khosoussi and Timothy Barfoot](https://arxiv.org/abs/1709.08601) (building from Khosoussi's Sydney doctorate under Dissanayake and Huang before continuing at MIT and Toronto) extended this bridge to full 3D PGO, where the Laplacian combines via Kronecker product with the SE(3) adjoint representation so topological structure and geometric weighting decouple cleanly. Because the reduced Laplacian is six times smaller than the full FIM, its spectrum offers a fast, rigorous mathematical criterion for the "loop-closure selection" problem left open in Chapter 6.

Equally illuminating, the CRLB lens casts fresh light on the EKF-SLAM consistency breakdown seen in Chapter 4's "Still open" section: the overconfidence Julier and Uhlmann exposed in 2001 amounts to linearization falsely inflating the Fisher information beyond its true physical limit. That is precisely why Handbook §6.2 pairs Fisher information analysis directly beside §6.1's convex relaxation—certifying a global minimum and measuring how trustworthy it is form two halves of the same theory.

> 🔗 **Borrowed.** [Kirchhoff's Matrix-Tree Theorem (1847)](https://en.wikipedia.org/wiki/Kirchhoff%27s_theorem), born as an analysis tool for electrical circuits, was transplanted through combinatorics into measurement-design literature and, in the 2010s through Khosoussi, became the language of SLAM active perception—completing a 180-year migration path.

## 7.5 Extensions and Limits — TEASER, CORA, and Lasserre's Wall

With SE-Sync having cracked clean pose graphs, certifiable optimization pushed outward along two fronts: resisting severe **outliers** and expanding beyond relative poses to handle range measurements, landmarks, and anisotropic noise.

Outliers demanded attention first. As Chapter 6 §6.7 noted, front-end loop-closure detectors inevitably let false matches slip through—and beyond a modest contamination ratio, even Huber or Cauchy robust losses collapse. Around 2017, researchers began crafting certifiably outlier-robust solvers, led prominently by [Yang, Shi, and Carlone's TEASER (TRO 2020)](https://arxiv.org/abs/2001.07715). On 3D point-cloud registration benchmarks, TEASER recovered globally optimal alignments even with up to 99% outlier correspondences by solving truncated least squares inside a graduated non-convexity (GNC) wrapper, decoupling scale, translation, and rotation into separate certifiable subproblems with SDP relaxation on rotation. Soon after, [Yang & Carlone (2022)](https://arxiv.org/abs/2109.03349) generalized this machinery via Lasserre moment relaxations under the banner of "certifiably robust estimation."

Sensor-modality extensions advanced alongside outlier robustness. For range-aided SLAM, [Papalia et al.'s CORA (2024)](https://arxiv.org/abs/2302.11614) tackled distance residuals $(\|\boldsymbol{t}_j - \boldsymbol{t}_i\| - \tilde r_{ij})^2$, whose implicit square root prevents them from forming a direct QCQP. By introducing an auxiliary unit-bearing vector $\boldsymbol{b}_{ij} \in S^{d-1}$ ("bearing lifting"), CORA reformulated range-aided SLAM into a clean QCQP, demonstrating tight relaxations in single-robot settings while showing that tightness can break down in multi-robot configurations—sharpening the boundary of where Shor relaxation holds. On the landmark front, [Holmes & Barfoot (2023)](https://arxiv.org/abs/2308.05631) applied the Schur complement to eliminate landmarks beforehand, yielding a reduced PGO directly solvable by SE-Sync; in 2025, Holmes, Khosoussi, and Rosen co-authored Chapter 6 of *The SLAM Handbook*.

Yet stubborn mathematical walls also emerged. Folding anisotropic noise and truncated-quadratic robust losses into a general Polynomial Optimization Problem (POP) requires Lasserre's moment relaxation, whose lifted SDP matrices frequently turn **degenerate**, breaking the constraint qualification conditions required for the Riemannian Staircase's convergence guarantee. (Degeneracy voids the guarantee without necessarily implying divergence on every instance.) Yang's 2022 sparse monomial basis partially sidesteps that bottleneck, though its specialized solver remains markedly slower than local Gauss-Newton. Meanwhile, Visual SLAM and VIO pose deeper algebraic hurdles around perspective projection and IMU preintegration, explored in the 🧭 section below.

> 📜 **Prediction vs. outcome.** At ICRA 2015, Carlone observed that a *"theoretical explanation for why most instances have a tight Lagrangian dual is needed."* A decade later, that answer remains half-finished: Rosen, Carlone, Bandeira, and Leonard proved exact recovery whenever noise sits below $\beta$, yet offered no way to evaluate $\beta$ ahead of time on a live problem. As of 2026, no **a priori** test predicts when tightness breaks; per-instance a posteriori certificates still carry the load.

---

## Still open

**The boundary where tightness breaks.** Although SE-Sync's exact-recovery theorem guarantees tightness for noise below $\beta$, computing $\beta$ on an actual problem instance remains impossible without knowing ground truth. An a priori diagnostic for tightness—along with a systematic characterization of how relaxations fail under severe outliers or ultra-sparse topologies—would directly guide real-world algorithm design.

**Integration with visual SLAM and VIO.** Pinhole perspective projection $\pi(\boldsymbol{X}) = [X/Z, Y/Z]$ is a rational function rather than a polynomial. Clearing the denominator introduces a fresh auxiliary variable and constraint for every landmark observation, quickly blowing up an SDP beyond real-time feasibility across the thousands of map points maintained by systems like ORB-SLAM3. Likewise, Forster's 2015 IMU preintegration intertwines Lie-group exponential maps with bias drift that resist clean POP reformulation. As of 2026, the visual and VIO mainstream covered in Chapter 8, Chapter 11, and Chapter 16 remains largely outside certifiable guarantees—the lineage's single biggest gap.

**Online certification and scale.** SE-Sync is fundamentally a batch solver. Just as Square Root SAM evolved into iSAM2 for incremental SLAM, certifiable estimation needs incremental solvers capable of updating certificates as each new measurement arrives. Warm starts, incremental rank elevation, and composing partial certificates remain active research problems, while general moment-relaxation solvers remain far too slow at city scale.

**Outlier-majority.** While estimators like TEASER achieve striking robustness even with 99% outliers in registration, those guarantees do not yet carry over universally to arbitrary SLAM graphs and sensor contamination patterns. When extreme ambiguity leaves multiple competing interpretations plausible, multi-hypothesis frameworks such as list-decodable regression—explored by Cheng, Shi, and Carlone around 2024—offer an intriguing direction, though none has yet matured into a standard tool alongside TEASER.

---

What began as a passing note on local-minimum pitfalls in graph SLAM matured over a decade into a full theoretical program (→ Chapter 6 §6.7)—commanding 34 pages in Chapter 6 of *The SLAM Handbook*, co-authored by Carlone, Khosoussi, Rosen, Holmes, Barfoot, and Dissanayake. Over that very same decade, the learning-based SLAM traditions of Chapter 15, Chapter 16, and Chapter 20 pursued an opposite philosophy: where one camp worked to *prove* mathematically that an estimate was globally optimal, the other trained neural networks to *predict* it directly. Whether those two worlds will eventually converge remains unanswered in 2026, and Chapter 23 gathers this chapter's 🧭 items under "gaps in backend theory."

With a dependable backend foundation now in place, Chapter 8 turns back to the front end—taking reliable graph optimization as a given and asking what kind of visual system runs on top of it.

# Chapter 8. Feature-Based SLAM: ORB-SLAM

By the early 2010s, Chapter 6's graph SLAM lineage had established pose-graph optimization as the standard backend language. Kümmerle's g²o (2011) and Kaess's iSAM2 (2012) made iterative optimization practical on large maps and brought loop-closure costs down to interactive speeds. Part 3 turns to the front end that feeds those graphs: which visual cues should a system extract, and how should it track them?

When Klein and Murray split tracking and mapping into two parallel threads in PTAM (2007), the design produced an impressive lab prototype that nonetheless broke down beyond small indoor workspaces. Eight years later at the University of Zaragoza, Raúl Mur-Artal combined that multi-threaded architecture with Rublee's ORB descriptor (2011), Gálvez-López's DBoW2 visual vocabulary (2012), and Strasdat's Essential graph (2011). PTAM had been a nimble proof of concept; ORB-SLAM became the field's ten-year standard.

---

## 8.1 ORB-SLAM (2015): A Tripod of Design Choices

Published in *IEEE Transactions on Robotics*, [Mur-Artal, Montiel & Tardós 2015. ORB-SLAM](https://doi.org/10.1109/TRO.2015.2463671) built a complete monocular SLAM pipeline around ORB features, resting on three tightly coordinated architectural decisions: a three-thread execution split, a binary descriptor, and a hierarchical graph structure.

Where PTAM ran two threads (Tracking and Mapping), ORB-SLAM introduced Loop Closing as a third. This dedicated thread recognizes revisited places with DBoW2, optimizes the pose graph over the Essential graph, and finally triggers global bundle adjustment (BA). Decoupling loop closing from local mapping keeps the Tracking thread running at frame rate without stalling during global map corrections.

> 🔗 **Borrowed.** PTAM's Tracking–Mapping split (Klein & Murray, 2007) carried directly into ORB-SLAM's Tracking–LocalMapping structure, a debt Mur-Artal acknowledged explicitly in §3 of the paper. By adding a third thread, ORB-SLAM isolated loop closure as an independent asynchronous module.

Choosing the ORB (Oriented FAST and Rotated BRIEF) descriptor solved patent, speed, and invariance constraints simultaneously. SIFT and SURF were encumbered by patents, while BRIEF was fast but brittle under in-plane rotation. Presented by Rublee et al. at ICCV 2011, ORB augmented FAST corners with rotation invariance and achieved roughly two orders of magnitude—about 100 times—faster computation than SIFT, with binary descriptors suited to real-time Hamming-distance matching on a CPU.

To gain scale invariance as well, ORB-SLAM constructs an 8-level image pyramid with scale factor $s$ (set to 1.2) and detects FAST keypoints independently at each level. An intensity centroid defines each keypoint's orientation: the first-order moment of patch intensity gives its center of mass, and the resulting angle $\theta$ rotates the BRIEF bit-comparison pattern to produce a 256-bit rotation-invariant descriptor. Matching two descriptors then reduces to an XOR followed by a popcount instruction.

> 🔗 **Borrowed.** The descriptor from [Rublee et al. 2011. ORB](https://doi.org/10.1109/ICCV.2011.6126544) gave the system its name. Rather than inventing a new feature extractor, Mur-Artal assembled proven components into a cohesive pipeline—and that front-end choice stayed in the system's name for the next decade.

ORB-SLAM also broke with PTAM's aggressive keyframe insertion policy, pruning redundancy through a **covisibility graph** whose edge weights count shared map landmarks between keyframes. Two keyframes are linked whenever they share at least 15 landmarks, and Local Mapping uses this graph to carve out a local window for bounded BA.

On KITTI sequence 00—a full 4.5 km loop—ORB-SLAM achieved 1.2% translation drift, whereas PTAM, its primary point of comparison at the time, failed to close the large loop at all. Although absolute scale remained ambiguous in both monocular systems, DBoW2 and the Essential graph enabled ORB-SLAM to detect the revisit and distribute accumulated drift across the trajectory.

For global loop correction, ORB-SLAM relies on a sparser subgraph called the **Essential graph**, which retains only the spanning tree, loop-closure edges, and strong covisibility links sharing 100 or more landmarks. When a loop is detected, the system optimizes the full trajectory as a pose graph over this sparse skeleton; even with thousands of keyframes, the edge count stays small enough that optimization finishes within seconds.

> 🔗 **Borrowed.** The Essential graph grew out of the hierarchical optimization strategy in [Strasdat et al. 2011. Double Window Optimisation](https://doi.org/10.1109/ICCV.2011.6126517). Strasdat had separated a local metric window from a global pose-graph window to curb optimization cost; Mur-Artal generalized that idea into the Essential graph.

Place recognition for both relocalization and loop closing is handled by DBoW2. [Gálvez-López & Tardós 2012. DBoW2](https://doi.org/10.1109/TRO.2012.2197158) organizes binary ORB descriptors into a vocabulary tree via hierarchical k-medians clustering (seeded with k-means++). Fixing a branching factor $k_w$ and tree depth $L_w$ yields $k_w^{L_w}$ leaf "words"—the DBoW2 paper demonstrates $k_w=10$, $L_w=6$ for a one-million-word vocabulary, and the public ORB-SLAM release ships with a vocabulary of comparable size. Each word is weighted by TF-IDF (Term Frequency–Inverse Document Frequency) so that rare, discriminative visual words outweigh ubiquitous ones, and each keyframe's weighted BoW vector is indexed in an inverted file. When a new frame arrives, descending the tree takes O(log(k^L))=O(L) comparisons, and the inverted index retrieves candidate keyframes directly without scanning the entire map.

At every incoming frame, the Tracking thread predicts the camera motion, matches features against the prior frame and local map, and refines the pose $\mathbf{T}_{cw} \in SE(3)$ via motion-only bundle adjustment. Given 3D–2D correspondences $\{(\mathbf{X}_i, \mathbf{u}_i)\}$ between world map points $\mathbf{X}_i$ and image observations $\mathbf{u}_i$, it minimizes the reprojection error

$$\mathbf{T}^* = \arg\min_{\mathbf{T}} \sum_i \left\| \mathbf{u}_i - \pi(\mathbf{T}\mathbf{X}_i) \right\|^2$$

where $\pi$ is the camera projection function. In practice, this optimization wraps the residual in a robust loss with observation weights, holding map points fixed while updating only the current camera pose; if tracking is lost, EPnP inside RANSAC generates initial pose hypotheses for relocalization, while the separate Local Mapping thread refines neighboring keyframes and map points through local BA.

---

## 8.2 ORB-SLAM2 (2017) — Stereo/RGB-D

For all its robustness, ORB-SLAM (2015) remained strictly monocular, leaving absolute scale unobservable: from pixels alone, a 10 m corridor is indistinguishable from a 100 m one. Mur-Artal and Tardós closed that gap two years later.

[Mur-Artal & Tardós 2017. ORB-SLAM2](https://doi.org/10.1109/TRO.2017.2705103) extended the architecture to stereo and RGB-D cameras. A stereo rig recovers metric scale from its calibrated baseline via triangulation, while an RGB-D sensor measures depth directly.

Crucially, the three-thread backbone remained unchanged; only the front end adapted to the sensor. In stereo mode, the system extracts ORB features from rectified left–right image pairs: features matched across both views yield **stereo observations** with direct depth estimates, whereas unmatched features are retained as **monocular observations** that still constrain rotation and distant structure. Points with depth are further partitioned into close and far landmarks using a threshold proportional to the baseline.

Unlike monocular mode—which must initialize from two frames via an Essential Matrix or Homography and still inherits scale ambiguity—**stereo initialization** succeeds on the very first frame. From horizontal disparity $d$ between the left and right images, baseline $b$, and focal length $f$, depth follows immediately as

$$Z = \frac{b \cdot f}{d}$$

Points whose depth $Z$ falls below $Z_{\max}=40b$ are immediately instantiated as 3D map points. RGB-D initialization works identically by reading $Z$ at pixel $(u, v)$ from the depth map and back-projecting into 3D. With metric scale fixed from frame one, Local BA can run right away.

On the EuRoC MAV Machine Hall 01 sequence, stereo ORB-SLAM2 achieved an absolute translation error of 0.035 m in Table II—outperforming Stereo LSD-SLAM, the primary baseline in that comparison—while ranking near the top of published methods on KITTI odometry.

When the paper appeared in *IEEE Transactions on Robotics* in May 2017, Mur-Artal and Tardós simultaneously pushed the source code to GitHub. A two-person team at Zaragoza had delivered monocular, stereo, and RGB-D SLAM inside one clean codebase; thousands of GitHub stars and widespread ROS wrappers soon followed.

---

## 8.3 ORB-SLAM3 (2021): Atlas and Visual-Inertial

Published in *IEEE Transactions on Robotics* in 2021, [Campos et al. 2021. ORB-SLAM3](https://doi.org/10.1109/TRO.2021.3075644) signaled a generational handoff at Zaragoza: Carlos Campos, who completed his doctorate under Tardós, took first authorship alongside Mur-Artal and Tardós.

ORB-SLAM3 introduced two major capabilities: the **Atlas** multi-map system and tightly coupled **Visual-Inertial** (VI) integration.

Atlas allows the system to maintain multiple disconnected maps concurrently. Earlier versions attempted to relocalize inside the active map when tracking broke, yet if recovery failed and a fresh map had to be initialized, the old map was lost. Atlas instead suspends the current map upon tracking failure and starts a new active map; whenever the camera later revisits previously mapped terrain, place recognition triggers a seamless merge into a unified map.

Visual-Inertial mode incorporates high-rate IMU measurements using the manifold preintegration framework that Forster et al. introduced at RSS 2015 ("IMU Preintegration on Manifold") and expanded in *IEEE TRO* 2016 as [On-Manifold Preintegration for Real-Time Visual-Inertial Odometry](https://doi.org/10.1109/TRO.2016.2597321). Inertial cues bridge aggressive motions where visual tracking would otherwise blur out, and accelerometer readings—together with the inferred gravity vector—resolve monocular scale ambiguity.

Rather than inserting every high-rate IMU sample into the factor graph, the system integrates all inertial measurements between consecutive keyframes $i$ and $j$ once. Modeling raw gyroscope and accelerometer readings as $\tilde{\boldsymbol{\omega}}_t = \boldsymbol{\omega}_t + \mathbf{b}_g + \mathbf{n}_g$ and $\tilde{\mathbf{a}}_t = \mathbf{a}_t + \mathbf{b}_a + \mathbf{n}_a$ (with slowly varying biases $\mathbf{b}$ and noise $\mathbf{n}$), the preintegrated rotation, velocity, and position increments take the form

$$\Delta\mathbf{R}_{ij} = \prod_{k=i}^{j-1} \mathrm{Exp}\bigl((\tilde{\boldsymbol{\omega}}_k - \mathbf{b}_g)\Delta t\bigr)$$
$$\Delta\mathbf{v}_{ij} = \sum_{k=i}^{j-1} \Delta\mathbf{R}_{ik}\,(\tilde{\mathbf{a}}_k - \mathbf{b}_a)\Delta t$$
$$\Delta\mathbf{p}_{ij} = \sum_{k=i}^{j-1}\!\left[\Delta\mathbf{v}_{ik}\Delta t + \tfrac{1}{2}\Delta\mathbf{R}_{ik}\,(\tilde{\mathbf{a}}_k - \mathbf{b}_a)\Delta t^2\right].$$

Here $\mathrm{Exp}(\cdot)$ maps elements of the Lie algebra $\mathfrak{so}(3)$ onto the rotation group. Whenever bias estimates update during bundle adjustment, a first-order Jacobian correction adjusts these increments without repeating the integration, allowing ORB-SLAM3 to optimize inertial factors jointly with visual reprojection residuals in a single factor graph. Chapter 9 traces the full derivation of these equations from Lupton's Euler-angle prototype to Forster's manifold formulation.

> 🔗 **Borrowed.** Campos built ORB-SLAM3's inertial backend directly on Forster et al.'s On-Manifold Preintegration (TRO 2016, originating at RSS 2015), embedding SO(3) manifold integration and analytical bias-Jacobian updates straight into the visual-inertial factor graph.

In Table II of the paper, mono-inertial ORB-SLAM3 achieves a mean RMSE ATE (Absolute Trajectory Error) of 0.043 m across all 11 EuRoC MAV sequences, compared with 0.110 m for VINS-Mono and 0.119 m for stereo-inertial Kimera.

Together, VI mode and Atlas enabled a drone or handheld camera to survive lost tracking, drastic illumination shifts, and fragmented sessions while merging everything back into a consistent map—an upgrade that transformed the system's operational reach, not merely its version number.

---

## 8.4 Why It Is Still the Baseline in the 2020s

Even in 2023 and beyond, conference papers routinely kept ORB-SLAM3 in their comparison tables as the standard yardstick against which new algorithms were measured.

Part of that endurance is algorithmic predictability: ORB features tolerate moderate illumination shifts, binary descriptors match rapidly, and extracting dense sets of corners in real time keeps tracking resilient. While learned features can achieve higher accuracy on familiar benchmarks, they can also fail unpredictably out of distribution; ORB's failure modes are thoroughly understood.

Reproducibility and engineering breadth matter just as much. Open-source code, mature ROS bindings, and thousands of field deployments mean labs naturally turn to ORB-SLAM3 as their first testbed. Having monocular, stereo, RGB-D, and visual-inertial modes unified in one repository makes it a common baseline across disparate hardware setups.

Nor have learned alternatives displaced it across the board. DROID-SLAM (Teed & Deng, 2021) outperforms ORB-SLAM3 on several benchmarks, yet as its own authors report, long sequences such as EuRoC and TartanAir demand a 24 GB-class GPU, and inference on TartanAir runs at 8 fps—short of real time. ORB-SLAM3 runs entirely on a CPU and operates reliably even on ARM and embedded boards.

---

## Prediction vs. outcome

> 📜 **Prediction vs. outcome.** In Section IX-C of the 2015 ORB-SLAM paper, Mur-Artal outlined two Future Work directions: "Points at Infinity," which proposed exploiting distant zero-parallax points to constrain rotation, and "Dense Map Reconstruction," which envisioned compact keyframes serving as the geometric scaffold for dense mapping. A decade later, VI-SLAM and related formulations had largely absorbed rotation stabilization from distant cues, while the NeRF-SLAM and 3D Gaussian Splatting waves of the 2020s revived the "sparse skeleton plus dense overlay" paradigm with neural and splat representations. Meanwhile, the modality extensions noted in the paper—RGB-D, stereo, and IMU—materialized systematically across ORB-SLAM2 (2017) and ORB-SLAM3 (2021).

> 📜 **Prediction vs. outcome.** In the Conclusions of the 2021 ORB-SLAM3 paper, Campos et al. singled out low-texture environments (such as endoscopic video) as the system's primary failure mode and advocated photometric techniques for all four data-association stages. Between 2023 and 2025, however, the broader community gravitated toward learned front ends like SuperPoint and LightGlue, leaving photometric alignment largely to the DSO and LDSO lineage. As of 2026, the official ORB-SLAM3 main branch still relies on classical ORB descriptors: the authors' photometric vision and the community's learned-feature momentum diverged.

---

## Still open

**Long-term map reuse.** Although Atlas enables multi-map storage and merging, appearance-based map merging still breaks down under drastic lighting changes. A morning map and an evening revisit represent the same physical space, yet DBoW2 frequently misses the match once shadows and color balance shift. Sustaining autonomy across day–night and seasonal cycles remains unresolved as of 2024.

**The place of the pure-vision baseline.** Learned front ends such as SuperPoint + SuperGlue, LightGlue, and DINOv2-derived descriptors now surpass ORB-SLAM3 on many curated sequences, yet their generalization outside training distributions remains uneven and can fall below classical ORB. Existing benchmarks are not yet broad enough to declare a universal replacement.

**Drift at large outdoor scale.** On multi-kilometer urban drives, ORB-SLAM3 still trails LiDAR SLAM. Purely visual localization over city-scale GPS-denied routes remains unsolved as of 2026: dynamic traffic, changing illumination, and textureless road stretches compound drift, leaving a persistent precision gap relative to survey-grade LiDAR.

---

Even as the ORB-SLAM trilogy was cementing feature-based SLAM as the practical default, two major developments unfolded alongside it. First, ORB-SLAM3's jump to visual-inertial autonomy rested directly on Forster's preintegration equations—a mathematical breakthrough with its own lineage, traced next in Chapter 9 (followed by its continuous-time generalization in Chapter 10). Second, Newcombe and Engel were pursuing the exact opposite front-end philosophy in Chapter 11: discarding keypoints altogether to optimize raw image brightness directly. The two visual schools marched to the same 2010s timetable from opposite starting points—ORB-SLAM3 leading EuRoC in 2021, while DSO bested ORB-SLAM2 in texture-poor TUM corridors—and together defined the limits of geometric vision.

# Chapter 9. IMU Preintegration

Sydney, 2009. At the Australian Centre for Field Robotics (ACFR), doctoral student Todd Lupton and his advisor Salah Sukkarieh faced a timing mismatch common to agile flight. An onboard IMU streams measurements at 200 Hz—far too many to insert as individual nodes into a factor graph—while camera keyframes arrive only a few times per second. How can dozens or hundreds of inertial samples between two keyframes be compressed into a single optimization factor? Lupton's IROS paper planted the seed of preintegration. Six years later, at RSS 2015, Christian Forster, Davide Scaramuzza, Luca Carlone, and Frank Dellaert lifted that seed onto the SO(3) manifold, turning the IMU into a first-class citizen of the factor graph. Those equations now sit quietly behind the phrase "we used Forster 2016" in ORB-SLAM3, VI-DSO, and LIO-SAM (→ Chapters 8, 11, 21), whereas FAST-LIO takes the alternative filter path of propagating raw IMU readings through iterated updates.

---

## 9.1 MEMS and the "democratization of sensors"

Preintegration only became an urgent SLAM problem once IMUs became cheap enough to put on every robot.

Strapdown inertial navigation originated in 1950s aerospace, where ring-laser gyroscopes for submarines and missiles cost tens of thousands of dollars—far beyond a typical university lab's budget. MEMS (Micro-Electro-Mechanical Systems) sensors erased that barrier. Analog Devices' ADXL series and InvenSense's MPU chips drove the cost of a six-axis IMU down to a few dollars. When the iPhone added an IMU in 2007, smartphone-scale manufacturing flooded robotics with miniature inertial sensors; by the early 2010s, research drones and handheld rigs carried MEMS IMUs as standard hardware, just as Visual SLAM was confronting the monocular scale ambiguity highlighted in Chapter 5 ("Still open").

Working with these chips begins with a straightforward physical measurement model. The accelerometer reports specific force $\tilde{\mathbf{a}} = \mathbf{R}_w^b(\mathbf{a}^w - \mathbf{g}^w) + \mathbf{b}^a + \boldsymbol{\eta}^a$ (gravity included), while the gyroscope reports angular velocity $\tilde{\boldsymbol{\omega}} = \boldsymbol{\omega}_b^b + \mathbf{b}^g + \boldsymbol{\eta}^g$, where $\mathbf{b}$ denotes slowly drifting sensor bias and $\boldsymbol{\eta}$ denotes white noise. Three practical consequences follow immediately: gravity is always folded into the acceleration reading, forcing the estimator to track or align with the vertical axis; biases drift over time as a random walk modulated by temperature and power fluctuations; and high-frequency MEMS noise accumulates rapidly if integrated blindly.

---

## 9.2 First attempt — Lupton & Sukkarieh (2009 / 2012)

At the heart of the problem lay a mismatch of clocks in the factor graph. Smoothing backends like Kaess's iSAM2 place state nodes at keyframe timestamps, yet the IMU fires dozens of times between consecutive keyframes (→ Chapter 6). Turning every inertial sample into its own graph node blows up the state dimension; throwing samples away forfeits high-rate motion cues.

In [Visual-Inertial-Aided Navigation for High-Dynamic Motion (IROS 2009, TRO 2012)](https://doi.org/10.1109/TRO.2011.2170332), Lupton and Sukkarieh proposed integrating all IMU readings between keyframes $i$ and $j$ *once* to form a single relative motion increment. Wrapping that summary into one factor kept raw inertial samples out of the graph and gave the technique its name: "pre-integration."

Yet two limitations held back Lupton's original formulation. First, it parameterized rotation with Euler angles, exposing the integrator to gimbal lock and ignoring the curved geometry of the rotation group. Second, and more painfully, any update to the estimated IMU bias during nonlinear optimization invalidated the preintegrated increment, seemingly forcing full reintegration across hundreds of samples per keyframe. Lupton introduced a first-order bias correction to avoid redoing that work, but the Euclidean machinery could not handle 3D rotations cleanly. Six years would pass before Forster recast both the integration and the bias correction directly on SO(3).

---

## 9.3 The decisive turn — Forster-Carlone (2015 / 2017)

At RSS 2015, ETH Zürich doctoral student Christian Forster joined Davide Scaramuzza (UZH), Luca Carlone (Georgia Tech, later MIT), and Frank Dellaert (Georgia Tech, creator of GTSAM) to present [IMU Preintegration on Manifold for Efficient Visual-Inertial Maximum-a-Posteriori Estimation](https://www.roboticsproceedings.org/rss11/p06.pdf), followed by the expanded journal paper [On-Manifold Preintegration for Real-Time Visual-Inertial Odometry](https://doi.org/10.1109/TRO.2016.2597321) in *IEEE TRO* 2017. The collaboration fused UZH's agile-drone experimentation, Georgia Tech's factor-graph framework, and Carlone's optimization rigor.

Their reformulation rested on three mathematical pillars. First, they defined the relative rotation $\Delta\mathbf{R}_{ij}$ natively on the SO(3) manifold and reformulated $\Delta\mathbf{v}_{ij}, \Delta\mathbf{p}_{ij}$ so that all three preintegrated quantities are *independent of gravity and the initial pose and velocity*. Because these quantities depend solely on raw inertial readings and bias estimates, the factor can be re-evaluated across optimization steps without repeating numerical integration, while the residual cleanly couples endpoint states, gravity, and bias updates. Second, using the right-Jacobian algebra of SO(3), they shifted white-noise perturbations to the outside of the exponential map, enabling exact analytical propagation of the preintegrated covariance $\boldsymbol{\Sigma}_{ij}$.

The third pillar made real-time bundle adjustment possible: **first-order linear bias correction on the manifold**. Rather than reintegrating hundreds of IMU samples whenever the optimizer tweaks a bias vector, the method computes partial derivatives with respect to gyroscope and accelerometer biases during the initial integration pass and applies a linear update via Jacobian-vector multiplication across all subsequent iterations. Extending Lupton's Euclidean approximation onto SO(3) turned a multi-millisecond reintegration bottleneck into a few-microsecond matrix multiply.

Once Forster's implementation landed in GTSAM as `ImuFactor`, adoption across the robotics community became effortless: subsequent SLAM systems rarely re-derived the algebra from scratch, simply linking against the factor.

> 🔗 **Borrowed.** Forster's manifold preintegration builds on the SO(3) right-Jacobian machinery later systematized in [Barfoot 2017. *State Estimation for Robotics*](https://doi.org/10.1017/9781316671528). Exponential maps and perturbation Jacobians were already standard in robotic state estimation; Forster translated IMU preintegration into that shared idiom, eliminating the singularities of Lupton's Euler-angle scheme.

> 🔗 **Borrowed.** The first-order bias Jacobian originated in [Lupton & Sukkarieh 2012](https://doi.org/10.1109/TRO.2011.2170332), a debt Forster et al. explicitly credit in TRO 2016 §VIII-B: "we follow [Lupton-Sukkarieh] but operate directly on SO(3)." Lifting that Euclidean trick onto the Lie group unlocked real-time optimization.

---

## 9.4 The three schools of practical VIO

With Forster's formulation in place, Visual-Inertial Odometry (VIO) matured along three distinct architectural schools between 2017 and 2022.

The first school comprises EKF-based filters, whose lineage predates preintegration. At ICRA 2007, Anastasios Mourikis and Stergios Roumeliotis at UC Riverside introduced the [MSCKF (Multi-State Constraint Kalman Filter)](https://doi.org/10.1109/ROBOT.2007.364024), maintaining a sliding window of past camera poses via stochastic cloning without storing 3D landmarks in the filter state; projecting linearized observation equations onto the left null space of the feature Jacobian eliminates feature-position errors cleanly. As an early, highly influential real-time VIO architecture built without preintegration, the MSCKF lineage later guided NASA JPL's Mars helicopter Ingenuity in 2021 and was modernized for research use in Guoquan Huang's open-source [OpenVINS](https://doi.org/10.1109/ICRA40945.2020.9196524) (2020).

The second school uses feature-based factor-graph optimization, exemplified by [VINS-Mono](https://doi.org/10.1109/TRO.2018.2853729) (TRO 2018) from Tong Qin and Shaojie Shen's group at HKUST. VINS-Mono embedded Forster's preintegration factor inside tightly coupled sliding-window bundle adjustment, paired with a dedicated initialization procedure to recover metric scale and the gravity vector. Released as open-source code, it served as the field's default VIO baseline from 2019 to 2022; in Chapter 8's comparison table across the 11 EuRoC sequences, ORB-SLAM3's 0.043 m average ATE was benchmarked directly against VINS-Mono's 0.110 m.

The third school pairs preintegration with direct photometric front ends: VI-DSO (2018), Basalt (2019), and [DM-VIO (2022)](https://doi.org/10.1109/LRA.2021.3140129) from Daniel Cremers's group at TUM (→ Chapter 11). These systems layer Forster's inertial factor onto photometric bundle adjustment; DM-VIO further introduced *delayed marginalization*, holding two marginalization priors in parallel until scale and gravity become observable so that premature marginalization cannot lock early initialization errors into long-term drift.

---

## 9.5 Observability — what cannot be seen

Adding an IMU resolves monocular scale, yet Visual-Inertial systems still leave fundamental degrees of freedom unobservable.

Theoretical analyses by Huang's group beginning in the early 2010s established that an unanchored VIO estimator possesses a **four-dimensional null space**: three global translation coordinates and global yaw about the gravity axis. No combination of camera frames and inertial readings can determine absolute world position or compass heading without external anchors such as GPS or magnetometers.

By contrast, *roll and pitch* become observable because the accelerometer senses gravity's vertical pull, and inertial excitation resolves the monocular scale ambiguity left open in Chapter 5 (→ Chapter 5).

Even so, degenerate motion profiles can collapse observability in practice. While global yaw remains unobservable under any trajectory, insufficient camera parallax or lack of acceleration variation blurs the boundary between scene depth, metric scale, and accelerometer bias. Prolonged hovering or constant-velocity straight-line motion leaves those states weakly constrained; although takeoffs, braking, and turns inject useful excitation, no isolated maneuver guarantees reliable scale recovery.

> 📜 **Prediction vs. outcome.** In §IX of their 2017 TRO paper, Forster et al. highlighted three open tasks: folding online time-offset and extrinsic calibration into the estimator, testing whether the bias random-walk model holds over long missions, and generalizing preintegration to asynchronous sensors such as rolling shutters and event cameras. By 2026, online temporal and extrinsic calibration had become standard practice across Kalibr, VINS-Mono, and OpenVINS; the random-walk bias model held up well on navigation-grade IMUs while still drifting under thermal and voltage swings on consumer MEMS; and asynchronous fusion found a promising answer in Le Gentil's Gaussian-Process continuous-time preintegration. Rather than converging on a single extension, the agenda branched into three.

---

## 9.6 The branch into continuous-time

At RSS 2021, Cédric Le Gentil and his advisor Teresa Vidal-Calleja at the University of Technology Sydney (UTS)—just a few kilometers from Lupton's ACFR—returned to the same timing problem from a continuous-time perspective in [Continuous Integration over SO(3) for IMU Preintegration](https://roboticsproceedings.org/rss17/p075.pdf).

Forster's discrete formulation assumes piecewise-constant inertial measurements between samples and integrates via discrete steps. Yet when fusing asynchronous sensors such as spinning LiDARs or event cameras, the estimator must query poses at arbitrary instants *between* IMU sample timestamps. While asynchrony does not invalidate piecewise-constant integration by itself, it makes sub-sample interpolation critical. Le Gentil modeled the inertial signal as a **Gaussian Process**, treating angular velocity as a continuous function so the state can be evaluated at any timestamp $\tau$—an idea that intersects directly with the B-spline, STEAM, and GPMP continuous-time trajectory frameworks.

---

## 9.7 Terrain of borrowings

> 🔗 **Borrowed.** The computational scaffolding that evaluates and optimizes an IMU factor comes directly from Chapter 6's [Dellaert GTSAM](https://gtsam.org/) ecosystem. Forster's `ImuFactor` plugs into GTSAM's `NoiseModelFactor` interface and coexists inside a single `Values` state container alongside visual reprojection factors—a direct inheritance of software architecture rather than mathematical equations.

> 🔗 **Borrowed.** Modeling slowly varying sensor bias as a random walk dates back to the Kalman-filter state-augmentation conventions covered in Chapter 4. Long before Lupton, navigation engineers augmented filter states with bias variables driven by small process noise; preintegration simply recast that convention as a bias random-walk factor inside a smoothing graph.

---

## Still open

**Real-time detection of visual-inertial observability.** Although the four-dimensional null space and degenerate motion regimes are well characterized in theory, runtime observability monitoring remains immature. First-Estimate Jacobian (FEJ) techniques pioneered by Hesch, Li, and Huang prevent spurious information gain along unobservable directions at the linearization point, yet as of 2026 no widely adopted runtime monitor detects entry into and exit from degenerate motion fast enough to warn a tightly coupled flight controller before estimation degrades.

**Unification of preintegration and continuous-time.** Forster's discrete increments and Le Gentil's continuous Gaussian-Process preintegration tackle the same sensor-fusion problem in different mathematical idioms. When combining frame cameras, LiDARs, and event cameras in a single estimator, choosing a unified trajectory parameterization remains an open engineering trade-off; continuous-time B-spline BA offers one bridge, yet most deployed pipelines still rely on Forster's discrete factor.

**Learning-based IMU bias models.** Whereas navigation-grade IMUs obey random-walk bias statistics cleanly, consumer MEMS units deviate substantially under temperature hysteresis and power-supply transients. Data-driven inertial odometry methods such as TLIO and RoNIN used LSTMs and Transformers to learn motion and bias corrections, and newer work models bias dynamics with conditional diffusion. How to embed learned bias priors cleanly inside Forster's analytical factor without forfeiting its theoretical guarantees remains an open question.

---

What began as Lupton's Euler-angle prototype stayed constrained for six years until Forster lifted both the integration and the bias Jacobian onto SO(3), and Le Gentil—working once again in Sydney—opened the continuous-time branch. Three generations of inertial research now sit behind a single factor line in ORB-SLAM3, VI-DSO, and LIO-SAM. Chapter 10 follows that continuous-time trajectory branch to its asynchronous sensors, while Chapter 11 returns to the visual front end where DSO and VI-DSO combine Forster's preintegration factor with direct photometric alignment.
