# Ch.13 — The Hybrid Victory: From CodeSLAM to DROID-SLAM

When Michael Bloesch presented CodeSLAM at CVPR 2018, he was affiliated with the Dyson Robotics Lab at Imperial College London and advised by Andrew Davison. Richard Newcombe had built DTAM in the same lab in 2011. Jan Czarnowski would release DeepFactors there in 2020, and Edgar Sucar and Tristan Laidlow would continue related work. Bloesch combined Davison's view of SLAM as probabilistic inference, developed since 2002, with the mid-2010s premise that representations could be learned.

---

## 13.1 CodeSLAM — latent code and the map

Traditional monocular SLAM estimated depth as an optimization variable, whether for a few hundred sparse landmarks or, as in [DTAM](https://www.doc.ic.ac.uk/~ajd/Publications/newcombe_etal_iccv2011.pdf) (Newcombe et al. 2011), for every pixel. The dimension of this variable space grew with image resolution. A 640×480 dense depth map for one keyframe contains 307,200 independent variables, making optimization expensive, initialization sensitive, and prior information difficult to incorporate.

[Bloesch et al. 2018. CodeSLAM](https://doi.org/10.1109/CVPR.2018.00271) optimized a low-dimensional **latent code** that generated the depth map rather than optimizing each depth value directly. A variational autoencoder (VAE) trained on real depth distributions learned a bottleneck space that approximated the manifold of realistic depth maps. Restricting optimization to this manifold reduced the number of variables from hundreds of thousands to hundreds.

> 🔗 **Borrowed.** CodeSLAM's latent depth representation uses the encoder-decoder latent-space structure established in [Kingma & Welling 2013. VAE](https://arxiv.org/abs/1312.6114). Training follows the VAE framework, but during SLAM inference, **z** becomes a MAP optimization variable without stochastic sampling. A representation developed for generative image models became, a decade later, a low-dimensional space for SLAM optimization.

For each keyframe, a VAE encoder extracts a latent code **z** from the image, and a decoder reconstructs a dense depth map from that code. The system jointly optimizes the camera pose and **z**. A photometric loss enforces consistency, while a latent prior regularizes **z** toward its prior distribution.

Written as an equation, the objective is:

$$E(\mathbf{z}, T) = \sum_{i,j} \rho\bigl(I_j(\pi(T_{ij}, D_\mathbf{z}(u_i), u_i)) - I_i(u_i)\bigr) + \lambda \|\mathbf{z}\|^2$$

$D_\mathbf{z}$ is the decoder, $\pi$ is the projection, $\rho$ is a robust cost, and $T_{ij}$ is the relative pose between keyframes. The latent-prior term $\lambda\|\mathbf{z}\|^2$ corresponds to the negative log-likelihood of the standard normal prior $p(\mathbf{z}) = \mathcal{N}(0, I)$ and arises directly from MAP inference under a Gaussian prior.

> 🔗 **Borrowed.** Dellaert and Kaess's [GTSAM](https://gtsam.org/tutorials/intro.html) factor graph provided the backend structure for DeepFactors. Czarnowski reformulated CodeSLAM's joint pose-latent optimization as an explicit factor graph in which a learned latent variable appeared alongside conventional pose nodes. Graph edges expressed the coupling between learned and geometric variables.

CodeSLAM surpassed earlier methods in reconstructing geometry from sparse input, but it did not operate in real time. Both VAE inference and the optimization loop were slow, a limitation the paper stated explicitly.

> 📜 **Prediction vs. outcome.** CodeSLAM showed that dense SLAM could incorporate a compact learned representation, but remained limited in speed and scale. DeepFactors (2020), from the same Imperial group, moved closer to real-time operation without reaching deployment-grade performance. Teed and Deng at Princeton later achieved broader support for monocular, stereo, and RGB-D inputs through a different design: a learned frontend combined with Dense Bundle Adjustment (DBA).

---

## 13.2 DeepFactors — Imperial Dyson Lab, factor graph integration

In 2020, Jan Czarnowski, also supervised by Davison at the Imperial Dyson Robotics Lab, released [Czarnowski et al. 2020. DeepFactors](https://doi.org/10.1109/LRA.2020.2969036). He sought to integrate CodeSLAM's approach into a complete SLAM pipeline.

DeepFactors extended CodeSLAM's latent-depth representation and joint optimization into an explicit factor graph, explicitly separated tracking from mapping, and introduced a keyframe-selection criterion. On an NVIDIA GTX 1080, tracking against keyframes ran at about 250 Hz, but computing the network Jacobian took several hundred milliseconds per keyframe and became the pipeline's bottleneck. The system demonstrated the approach without achieving deployment-grade real-time performance.

DeepFactors placed a learned representation in a factor graph as a node and applied geometric optimization in its latent space. Czarnowski's result favored replacing selected pipeline components with learnable modules rather than replacing the full pipeline end to end.

Around the same time, Daniel Cremers's group at TU Munich arrived at the same design principle from a different starting point. The Davison group paired CodeSLAM's VAE latent variables with a factor graph, whereas the Cremers group inserted neural predictions into its 2016 direct sparse odometry system, [DSO](https://arxiv.org/abs/1607.02565). [Yang, Wang, Stückler, Cremers 2018. DVSO](https://arxiv.org/abs/1807.02570) added neural depth to monocular DSO as "virtual stereo," synthesizing a second camera observation in a monocular setting. [Yang, von Stumberg, Wang, Cremers 2020. D3VO](https://arxiv.org/abs/2003.01060) incorporated depth, pose, and uncertainty as three self-supervised predictions and additional factors in DSO's factor graph. [Wimbauer et al. 2021. MonoRec](https://arxiv.org/abs/2011.11814) and [Wimbauer et al. 2023. Behind the Scenes](https://arxiv.org/abs/2301.07668) extended the approach to dense reconstruction of dynamic scenes and single-view density fields. Although the Cremers and Imperial groups were institutionally separate, both integrated neural predictions into classical optimization.

Princeton produced another form of the same hybrid design in 2021.

---

## 13.3 RAFT — recurrent optical flow

Zachary Teed and Jia Deng at Princeton presented [Recurrent All-Pairs Field Transforms (RAFT)](https://arxiv.org/abs/2003.12039) at ECCV 2020. RAFT addressed optical-flow estimation rather than SLAM.

RAFT's design later became the core of DROID-SLAM and consists of three parts.

1. Feature encoder: a CNN extracts feature maps from two images.
2. Correlation volume: the method stores similarities between all pixel pairs in a 4D volume with a four-level pyramid.
3. Update operator: a Gated Recurrent Unit (GRU) iteratively queries the correlation volume and refines the flow field.

The phrase "all-pairs" describes the method's distinguishing feature. Rather than examining only selected neighboring pixels, RAFT considers every candidate location and progressively refines the flow field at a fixed resolution. Unlike earlier coarse-to-fine methods such as PWC-Net, it keeps the flow field at one-eighth of the input width and height while querying the correlation pyramid, then upsamples the output. Against the best published results available at the time, the RAFT paper reported a 16% relative reduction in KITTI F1-all error and a 30% reduction in Sintel final-pass endpoint error.

RAFT did not originate in SLAM, but Teed recognized a structural similarity between its update operator and iterative bundle adjustment. A GRU refining a flow field could play a role analogous to an optimization step that refines pose and depth.

---

## 13.4 DROID-SLAM — the update operator and BA

At NeurIPS 2021, Teed and Deng presented [DROID-SLAM](https://arxiv.org/abs/2108.10869). DROID stands for "Differentiable Recurrent Optimization-Inspired Design."

Its architecture makes the hybrid design explicit.

The frontend has the same structure as RAFT. A CNN encoder extracts feature maps, an all-pairs correlation volume is built, and a GRU update operator iteratively estimates dense flow. The difference is that flow is estimated not between a single pair of images but simultaneously on every edge of a keyframe graph.

The backend performs DBA with pose and inverse depth as optimization variables. It uses the 2D correspondences from flow estimation as constraints for their joint optimization and solves the linear system efficiently with the Schur complement.

The **DBA layer** connects the two components. Flow and uncertainty estimates from the GRU enter DBA; the updated pose and depth then provide the reference for the next GRU iteration, forming a recurrent loop.

> 🔗 **Borrowed.** The idea behind DBA reaches back ten years to Newcombe's DTAM (2011), a precursor of photometric bundle adjustment over every pixel. DROID-SLAM combined that approach with the more robust correspondences supplied by learned flow, despite the separate institutional lineages of Newcombe and Teed.

> 🔗 **Borrowed.** Teed and Deng adapted DROID-SLAM's update operator directly from their work on RAFT. All-pairs recurrent refinement, originally designed for optical flow, proved structurally compatible with the iterative optimization of bundle adjustment.

On the EuRoC MAV dataset, DROID-SLAM recorded a lower RMSE ATE than ORB-SLAM3, then the state of the art. Evaluation covered synthetic TartanAir data as well as real indoor and outdoor sequences. The method was particularly robust to lighting changes and scarce texture compared with feature-based systems. In his later Handbook retrospective, Teed reported that on EuRoC V1_02, global optimization reduced the frontend-only ATE from 16.5 cm to 1.2 cm. Classical BA reached single-digit-centimeter accuracy using constraints supplied by learned correspondences.

DROID-SLAM differed from the end-to-end methods in Ch.12 by separating the roles of learning and geometry. PoseNet regressed pose directly without geometric constraints and did not generalize. Teed and Deng instead used learning for dense correspondence estimation and BA for enforcing geometric constraints. Neural networks handled feature extraction and dense matching, while geometric optimization maintained consistency and propagated uncertainty. The system replaced hand-designed features but retained the optimization structure, distinguishing the 2021 hybrid from the 2015 end-to-end approach.

---

## 13.5 The Imperial Dyson Lab lineage

The Imperial Dyson Robotics Lab connected CodeSLAM with several later hybrid systems.

Andrew Davison led SLAM research at Imperial for twenty years after MonoSLAM in 2002. His students and collaborators developed several related lines of work.

- **Richard Newcombe** (Davison advisee, Imperial): DTAM (2011), [KinectFusion](https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/ismar2011.pdf) (2011); later Oculus → Meta Reality Labs.
- **Michael Bloesch** (Davison advisee, Imperial): CodeSLAM (2018), touch and inertial SLAM research.
- **Jan Czarnowski** (Davison advisee, Imperial): DeepFactors (2020).
- **Edgar Sucar** (Davison group, Imperial): [iMAP](https://arxiv.org/abs/2103.12352) (2021), later extended to the NeRF-SLAM lineage.
- **Tristan Laidlow** (Davison group, Imperial): dense 3D reconstruction, later extended to the neural implicit SLAM lineage.

The group retained its emphasis on factor graphs and uncertainty as representations changed from sparse monocular landmarks to dense latent variables and then to implicit fields. In [FutureMapping](https://arxiv.org/abs/1803.11288) (2018) and [FutureMapping 2](https://arxiv.org/abs/1910.14139) (2019, with Ortiz), Davison proposed that a Spatial AI map should include both computational structure and multiple representations. The papers argued for combining diverse geometric and semantic representations in one probabilistic graph. CodeSLAM and DeepFactors were early experiments in that program.

Teed and Deng developed DROID-SLAM independently at Princeton. Nevertheless, DTAM by Newcombe and Davison was a conceptual predecessor of DROID-SLAM's DBA, showing that technical lineages need not follow direct institutional connections.

---

## 13.6 2023–2025 — extensions after DROID

After DROID-SLAM, researchers both extended its design and pursued alternatives.

[GO-SLAM](https://arxiv.org/abs/2309.02436) (Zhang et al. 2023) extended DROID-SLAM's tracking with online loop closure and full bundle adjustment, while mapping with an Instant-NGP-style neural implicit representation based on multi-resolution hash encoding. It combined DROID-family dense flow and BA for tracking with an implicit map, adding another hybrid layer.

[NICER-SLAM](https://arxiv.org/abs/2302.03594) (Zhu et al. 2023) followed a different design. Rather than building on DROID, it solved tracking and mapping jointly over a single hierarchical neural implicit representation. It pursued the same goal of RGB-only dense SLAM from outside the DROID lineage.

[SplaTAM](https://arxiv.org/abs/2312.02126) (Keetha et al. 2024) replaced the map representation with 3D Gaussian Splatting and based tracking on silhouette-guided differentiable rendering rather than DROID-style dense flow. It belongs more directly to the 3DGS lineage than to the DROID lineage.

[DPV-SLAM](https://arxiv.org/abs/2408.01654) (Lipson, Teed, Deng 2024) came from the same Princeton group as DROID-SLAM. Built on [DPVO](https://github.com/princeton-vl/DPVO) (Deep Patch Visual Odometry) rather than DROID, it added proximity-based loop closure and CUDA block-sparse BA. The resulting system was roughly 2.5× faster and used less memory than DROID-SLAM. Its main change was a patch-based sparse representation combined with efficient loop closure rather than a simple feature replacement.

Outside the DROID lineage, work in 2024–2025 followed Naver Labs' [DUSt3R](https://arxiv.org/abs/2312.14132) (Wang et al. 2023). DUSt3R changed the conventional SfM procedure by directly predicting pointmaps from two images, as Ch.16 discusses in detail. The same Revaud group then added symmetric multi-view processing and working memory in [Cabon et al. 2025. MUSt3R](https://arxiv.org/abs/2503.01661), extending the image-pair formulation to many frames in an attempt to support both offline SfM and online VO/SLAM with one network. DROID-family components also appeared in this ecosystem. [Li et al. 2024. MegaSAM](https://arxiv.org/abs/2412.04463) extended DROID-SLAM's differentiable DBA to dynamic scenes and uncalibrated video, jointly optimizing camera intrinsics at inference time. NVIDIA's [Huang et al. 2025. ViPE](https://arxiv.org/abs/2508.10934) combined DROID-SLAM's dense-flow network, cuvslam's sparse points, and a monocular depth network as three constraints in one DBA, producing a large-scale annotation pipeline for unconstrained video at YouTube scale. These systems applied DROID's learned-frontend, classical-backend design to the harder conditions of calibration-free and dynamic scenes.

Several approaches developed in parallel: GO-SLAM placed a neural map above DROID tracking; DPV-SLAM redesigned the system around lightweight patch odometry; NICER-SLAM and SplaTAM based tracking on implicit or splatting representations; and MegaSAM and ViPE extended DROID's DBA to uncalibrated and dynamic settings. Teed and Deng's 2021 combination of a learned frontend and classical backend supplied a starting point for several successors, while NICER-SLAM and SplaTAM pursued the same broader problem through separate representations.

> 📜 **Prediction vs. outcome.** DROID-SLAM established a reference architecture that combined differentiable DBA with end-to-end learning. Three years later, the same group improved efficiency with DPV-SLAM. GO-SLAM, NICER-SLAM, and SplaTAM instead replaced the map with implicit or Gaussian-splatting representations. As of 2026, these variations on DROID's "learned frontend plus classical backend" design had not converged on a general-purpose solution.

---

## 🧭 Still open

Generalization of learned priors beyond the training distribution remains a primary problem. The VAEs in CodeSLAM and DeepFactors learn the depth distribution of their training data. In substantially different environments, including open outdoor scenes, non-uniform textures, and nighttime conditions, a learned prior can direct optimization toward an incorrect solution. DROID-SLAM's flow estimator also performs worse outside its training domain. As of 2026, no learned SLAM system operated reliably in every environment. Training on diverse synthetic data such as TartanAir helps, but a sim-to-real gap remains.

Real-time operation remains another constraint. DROID-SLAM averages about 10–15 fps on an NVIDIA RTX 2080Ti and slows as the keyframe graph grows, with DBA as the bottleneck. As of 2026, it was still impractical for low-power applications requiring at least 30 Hz, such as mobile robots and AR/VR. Attempts to reduce computation through fewer keyframes or approximate BA incur performance trade-offs.

Integrating learned loop closure also remains unresolved. DROID-SLAM does not handle loop closure explicitly. In his later Handbook retrospective, Teed wrote that "DROID-SLAM doesn't include any relocalization module, so large loops with lots of drift cannot be closed." Unlike the local frontend, the backend performs global BA over the keyframes. Without a separate relocalization module, however, it can fail to recover the correspondences needed to close large loops after substantial drift. Some efforts have attempted to integrate learned loop closure, including the place-recognition work in Ch.10, into DROID's factor graph, but they have not converged on a single system. The connection between the NetVLAD lineage in Ch.10 and the DROID lineage in Ch.13 remains open.

---

DROID-SLAM used an inverse-depth map, a strong dense representation in 2021, but [NeRF](https://arxiv.org/abs/2003.08934) (Neural Radiance Field) had proposed a different option in 2020: representing a scene as a continuous function rather than as points, lines, planes, or meshes. Differentiable rendering offered another way to enforce photometric consistency.

At Imperial College in 2021, Edgar Sucar treated this as a SLAM problem rather than a rendering task: could an MLP replace the TSDF voxel grid entirely? His answer, iMAP, followed after fourteen months of work.


---

# Ch.14 — NeRF Enters SLAM: iMAP → NICE-SLAM

In 2021, Edgar Sucar at Imperial College used a learned representation not for tracking but for *the map itself*. His iMAP system adapted NeRF, a method developed outside SLAM.

In March 2020, Ben Mildenhall and his colleagues posted [Mildenhall et al. 2020. NeRF](https://arxiv.org/abs/2003.08934) to arXiv. It optimized a continuous volumetric scene function from images with known poses to synthesize unseen views. NeRF was initially presented as a solution to novel-view synthesis. At ICCV 2021, Sucar presented iMAP, showing how an implicit neural field could support joint estimation of the map and camera pose. iMAP was an early attempt to recast the dense-mapping problem of KinectFusion (Ch.9) in this representation.

NeRF followed several coordinate-based MLP representations of 3D introduced around 2019. [Park et al.'s DeepSDF](https://arxiv.org/abs/1901.05103) represented object surfaces with an MLP that mapped coordinates to signed distance. [Mescheder et al.'s Occupancy Networks](https://arxiv.org/abs/1812.03828) mapped the same input to occupancy probability. [Sitzmann et al.'s SRN](https://arxiv.org/abs/1906.01618) stored a scene feature vector at each coordinate and formed images through differentiable ray marching. All three mapped coordinates to a field value. Mildenhall et al.'s 2020 NeRF added volume-rendering integration and positional encoding, applying the formulation to view synthesis. iMAP inherited this entire one-year lineage rather than one paper alone.

---

## NeRF: MLP-based spatial representation

NeRF represents an entire 3D space implicitly in one MLP. Its inputs are a spatial coordinate $(x, y, z)$ and viewing direction $(\theta, \phi)$; its outputs are the color $(r, g, b)$ and density $\sigma$ at that position. Volume rendering combines these local values into an image of the full scene.

Rendering uses the volume rendering equation. A ray leaving camera origin $\mathbf{o}$ in direction $\mathbf{d}$ is sampled along parameter $t$:

$$\hat{C}(\mathbf{r}) = \int_{t_n}^{t_f} T(t)\,\sigma\!\left(\mathbf{r}(t)\right) \mathbf{c}\!\left(\mathbf{r}(t), \mathbf{d}\right)\, dt$$

Here $T(t) = \exp\!\left(-\int_{t_n}^{t} \sigma(\mathbf{r}(s))\, ds\right)$ is the accumulated transmittance, or the probability that the ray reaches $t$ without being blocked. A piecewise Riemann sum approximates the integral.

> 🔗 **Borrowed.** The volume-rendering equation comes from the classical graphics paper [Kajiya & Von Herzen (1984)](https://courses.cs.duke.edu/cps296.8/spring03/papers/RayTracingVolumeDensities.pdf). For nearly forty years, it served as a physics-based tool for offline rendering. Mildenhall used differentiable rendering to turn it into an optimization objective for reconstructing a scene from images.

Mildenhall et al. (2020) used positional encoding to address the difficulty MLPs have in learning high-frequency spatial signals. Projecting coordinates $(x, y, z)$ through sine and cosine functions at multiple frequencies allows the network to learn fine textures and sharp boundaries:

$$\gamma(p) = \left(\sin(2^0 \pi p),\, \cos(2^0 \pi p),\, \ldots,\, \sin(2^{L-1} \pi p),\, \cos(2^{L-1} \pi p)\right)$$

> 🔗 **Borrowed.** NeRF's positional encoding appeared in the original Mildenhall et al. (2020) paper. The same year, [Tancik et al. (2020)](https://arxiv.org/abs/2006.10739) "Fourier Features Let Networks Learn High Frequency Functions" explained why this technique works through neural tangent kernel (NTK) theory.

NeRF trains by comparing images captured from known camera poses with rendered outputs and minimizing a per-pixel L2 loss. After optimization, the MLP weights encode the scene's geometry and appearance without explicit voxels or a mesh.

The original NeRF also had clear limitations. Training took hours, and each model represented one scene whose camera poses had already been estimated by an external SfM system such as COLMAP. A SLAM system instead had to estimate poses and learn the map jointly at close to real-time speed.

---

## iMAP: early neural implicit SLAM

At ICCV 2021, Edgar Sucar of Imperial College's Dyson Robotics Lab presented [Sucar et al. 2021. iMAP](https://doi.org/10.1109/ICCV48922.2021.00612). **iMAP** (Implicit MAP) took RGB-D input, optimized camera poses, and represented the map with a single MLP.

The system alternates between two optimization loops. The *mapping* loop samples rays from the current keyframe and a random set of past keyframes to update the MLP. The *tracking* loop freezes the MLP and optimizes the current frame's pose against the rendering loss. Both loops use the same MLP.

The objective has two terms: a color loss $\mathcal{L}_{\text{color}} = \|\hat{C} - C\|_2^2$ and a depth loss $\mathcal{L}_{\text{depth}} = \|\hat{D} - D\|_2^2$. Because iMAP uses RGB-D input, direct depth supervision stabilizes geometry learning.

iMAP was a proof of concept that operated on small indoor scenes but had two structural limitations. First, the single MLP forgot earlier regions as it learned new ones, exhibiting catastrophic forgetting. Keyframe replay partially mitigated this effect without removing its cause. Second, the MLP's representational capacity became insufficient as scenes grew because every forward pass treated the entire space as one function.

> 📜 **Prediction vs. outcome.** In iMAP's conclusion, Sucar wrote that "future directions for iMAP include how to make more structured and compositional representations that reason explicitly about the self similarity in scenes." Structured and compositional representations became central to later work. Five months later, an ETH Zürich pre-release of NICE-SLAM partitioned space hierarchically with a multi-resolution voxel feature grid. Wang et al.'s Co-SLAM (2023) later combined hash-grid and coordinate encodings and reported 10–17 Hz on an RTX 3090 Ti. Explicit reasoning about self-similarity received less attention in mainstream NeRF-SLAM, and approaches that refined a single MLP also became less central.

---

## NICE-SLAM: hierarchical grid and scalability

Zihan Zhu and Songyou Peng at ETH Zürich addressed iMAP's single-MLP limitation in [Zhu et al. 2022. NICE-SLAM](https://arxiv.org/abs/2112.12130), presented at CVPR 2022. **NICE-SLAM** (Neural Implicit Scalable Coding for SLAM) replaced the single MLP with a multi-resolution voxel feature grid and a small MLP decoder.

NICE-SLAM partitions space into an explicit voxel grid and stores a learnable feature vector at each voxel. During rendering, trilinear interpolation combines features from the voxels surrounding a sample coordinate, and a small MLP decodes them into color and occupancy. Most spatial information resides in the grid, reducing the required MLP size.

NICE-SLAM organized three grid resolutions hierarchically. The coarse-to-fine grids represented geometry at multiple levels, while a separate color feature grid and decoder represented appearance. Adding a new region required updating only its corresponding voxel features, substantially reducing catastrophic forgetting elsewhere.

Like iMAP, NICE-SLAM froze the MLP and grid features while optimizing pose during tracking. During mapping, it updated the grid features. On Replica and ScanNet, the system handled larger spaces than iMAP and reconstructed finer details.

The grid introduced its own limitations because memory grew with the cube of resolution. The system could handle one or two indoor rooms but did not scale to multi-story buildings or outdoor environments. It also remained far from real-time operation.

At SIGGRAPH 2022, Thomas Müller's [Müller et al. 2022. Instant-NGP](https://nvlabs.github.io/instant-ngp/) combined multi-resolution hash encoding with a GPU implementation to accelerate training. Its public implementation demonstrated training in seconds on some demo scenes using supported NVIDIA GPUs. Instant-NGP was not a SLAM paper, but several later NeRF-SLAM systems adopted its hash encoding.

> 🔗 **Borrowed.** NICE-SLAM's multi-resolution feature grid was designed independently at roughly the same time as Instant-NGP's hash encoding, but Instant-NGP's hash grid soon replaced it in many NeRF-SLAM implementations. The feature grid also extends the grid-based representation of KinectFusion (Ch.9), replacing stored TSDF values with learned features.

---

## Co-SLAM and NeRF-SLAM: two integration directions

From late 2022 onward, systems following iMAP and NICE-SLAM developed in two directions: more efficient implicit representations and combinations of a NeRF map with a classical SLAM backend.

UCL's [Wang et al. (2023) **Co-SLAM**](https://arxiv.org/abs/2304.14377) followed the first direction. It combined a multi-resolution hash grid with one-blob encoding in a joint coordinate and parametric representation. The hash grid represented densely observed regions efficiently, while the coordinate encoding supplied a smooth prior over unobserved areas, balancing convergence speed with surface completeness. The paper reported 15–17 Hz on Replica with an RTX 3090 Ti, bringing NeRF-based SLAM close to real-time operation.

At the same CVPR, [Johari et al.'s **ESLAM**](https://arxiv.org/abs/2211.11704) from Idiap and EPFL addressed the same problem differently. It replaced the 3D feature grid with multi-scale axis-aligned feature planes, reducing memory growth from $O(n^3)$ to $O(n^2)$, and decoded TSDF rather than volume density to accelerate convergence.

Antoni Rosinol at MIT released [**NeRF-SLAM**](https://arxiv.org/abs/2210.13641) in 2022. It used DROID-SLAM to estimate poses and dense depth, then computed marginal covariances from the optimization Hessian. A separate Instant-NGP-based mapping module used these estimates and uncertainties to learn a radiance field.

> 🔗 **Borrowed.** NeRF-SLAM takes the pose and depth estimates produced by DROID-SLAM's recurrent updates and Dense Bundle Adjustment, and combines them with an Instant-NGP map. The radiance field does not replace the pose estimator; it builds a real-time dense map from that estimator's outputs.

NeRF-SLAM separates dense monocular estimation from neural mapping. Tracking does not depend on optimizing the current pose against the radiance field; the mapping module receives the poses, depth maps, and uncertainty produced by the SLAM module. This modular structure allows improvements to the estimator and map representation separately.

---

## The structural limitation of iMAP

iMAP showed that a single MLP could represent an entire scene and be updated near real time while jointly optimizing pose, although its measured performance remained limited.

A single MLP lacks locality: rendering any region requires evaluating the entire network. Learning a new region changes all weights and can degrade older regions through catastrophic forgetting. A growing scene also increases the spatial variation that one MLP must represent, requiring a larger network and more iterations. Representation capacity grows with parameter count, whereas scene complexity grows with spatial volume, making a nonlocal representation increasingly inefficient at larger scales.

NICE-SLAM's grid, Instant-NGP's hash encoding, and Co-SLAM's dual encoding all addressed locality. Partitioning space allows each component to represent its own region, reducing interference with previously learned areas and decoupling the rendering cost of one region from the total scene size.

---

## 🧭 Still open

**Real-time NeRF-SLAM.** As of 2023, iMAP and NICE-SLAM were far from real time. Co-SLAM reported 10–17 Hz on an RTX 3090 Ti but remained too slow for mobile and embedded robotic hardware. Gaussian Splatting (Ch.15) later addressed speed by returning to an explicit representation, while implicit neural fields still did not support conventional real-time SLAM at 30 fps or more without a consumer GPU. Instant-NGP greatly accelerated rendering, but the combined tracking-and-mapping loop remained constrained.

**Large-scale outdoor environments.** Methods such as [Block-NeRF](https://arxiv.org/abs/2202.05263) (2022, Tancik et al.) partition space into many local NeRFs, but do not yet integrate cleanly with SLAM's requirements for loop closure and global consistency. City-scale NeRF-SLAM remains an open problem.

**Semantic and editable implicit maps.** Because a NeRF map is optimized for rendering, inserting semantic labels and editing the map afterward are difficult. Removing an object or reclassifying a region is substantially harder than in a TSDF or point cloud. [LERF](https://arxiv.org/abs/2303.09553) aligns language features with space for semantic queries; it does not itself provide object deletion or editing. Semantic representations and editing are explored using tools such as [Nerfstudio](https://arxiv.org/abs/2302.04264), but real-time integration with SLAM remained a research problem as of 2026.

---

As iMAP and NICE-SLAM developed implicit fields, other researchers reconsidered explicit map representations. Millions of small ellipsoids placed throughout space promised faster rendering and more intuitive editing than a map encoded in MLP weights or a feature grid. Splatting already had predecessors such as EWA splatting in 2001. Bernhard Kerbl's SIGGRAPH 2023 paper demonstrated the combination of trainable 3D Gaussians and a fast differentiable renderer.


---

# Ch.15 — The Gaussian Splatting Era: From 3DGS to GS-SLAM

iMAP and NICE-SLAM represented space with an MLP, but their representations were difficult to edit directly. Updating the global MLP in iMAP could affect other regions; NICE-SLAM reduced that problem with local feature grids. NICE-SLAM also ran below 1 fps on an RTX 3090, far from real-time SLAM. Its scene representation remained difficult to inspect within the network parameters.

At SIGGRAPH in August 2023, Bernhard Kerbl of INRIA, Georgios Kopanas, Thomas Leimkuhler, and George Drettakis presented [their paper](https://arxiv.org/abs/2308.04079). Kerbl retained the differentiable scene optimization that NeRF had developed over the preceding three years but changed the representation's form. Instead of encoding scenes in MLPs or voxel feature grids, as iMAP, NICE-SLAM, and Co-SLAM did, 3DGS represented them with millions of explicit ellipsoidal Gaussian primitives. The SLAM community adopted the representation within six months. Its rasterization drew on Matthias Zwicker's twenty-year-old EWA splatting technique (2001), while its optimization retained the differentiable-rendering framework associated with NeRF.

---

## The structure of 3DGS

Kerbl represented scenes as an explicit set of Gaussians. Each Gaussian has a position (mean) $\boldsymbol{\mu} \in \mathbb{R}^3$, a covariance matrix $\boldsymbol{\Sigma} \in \mathbb{R}^{3 \times 3}$, a learnable opacity $o \in (0,1]$, and a color expressed in spherical harmonics coefficients. For training stability the covariance is factored into a scale vector $\mathbf{s}$ and a unit quaternion $\mathbf{q}$:

$$\boldsymbol{\Sigma} = \mathbf{R}\mathbf{S}\mathbf{S}^\top\mathbf{R}^\top$$

Rendering alpha-blends the projected 2D Gaussians in depth order. Each Gaussian's effective opacity $\alpha_i$ is the product of the learnable opacity $o_i$ and the 2D Gaussian density $G_i(\mathbf{x})$ evaluated at the pixel location. The pixel color $C$ is

$$C = \sum_{i \in N} c_i \alpha_i \prod_{j<i}(1 - \alpha_j), \quad \alpha_i = o_i G_i(\mathbf{x})$$

Unlike NeRF, which numerically approximates a volume-rendering integral, 3DGS runs directly through a GPU rasterization pipeline. Its tile-based rasterizer implements both forward and backward passes as custom CUDA kernels. On a single RTX 3090, it renders at more than 30 fps after training. This novel-view rendering rate cannot be compared directly as a speed ratio with NICE-SLAM's full tracking-and-mapping throughput.

Initialization uses a sparse point cloud from SfM. Training then iterates a **densification** procedure that splits, clones, and prunes Gaussians. When the view-space position gradient crosses a threshold, Gaussians with large scale split into two children, and Gaussians with small scale clone at the same position. Gaussians with low opacity are pruned periodically.

> 🔗 **Borrowed.** 3DGS's rasterization-based splatting descends directly from Zwicker et al.'s [EWA splatting (2001)](https://www.cs.umd.edu/~zwicker/publications/EWAVolumeSplatting-VIS01.pdf). Zwicker wrapped each point in an elliptical weighted-average kernel to render point clouds. Kerbl replaced that kernel with a learnable Gaussian and accelerated it with a GPU tile rasterizer.

---

## Structural fit between 3DGS and SLAM

Implicit representations posed several difficulties for SLAM. An MLP-based NeRF had to update the entire network for each new observation, while catastrophic forgetting made incremental learning difficult. Expanding the map required increasing the network's capacity. NICE-SLAM's voxel grid mitigated these problems but retained a trade-off between resolution and memory.

3DGS addressed these problems with an explicit representation. When a new keyframe arrives, the system can add Gaussians only to the corresponding region. Densification aligns naturally with keyframe insertion, while rendering retains NeRF-level quality at real-time speed. GS-SLAM papers began appearing in quick succession in late 2023.

---

## GS-SLAM: an early attempt

Chi Yan (HKU) and collaborators posted [Yan et al. 2023. GS-SLAM](https://arxiv.org/abs/2311.11700) on arXiv in November 2023. Several 3DGS-SLAM manuscripts appeared around the same time; GS-SLAM was among the early systems to combine 3DGS with tracking and mapping.

GS-SLAM followed the classical SLAM framework: tracking estimated the pose of the current frame, and mapping updated the Gaussian map. Yan introduced two mechanisms. Adaptive Gaussian expansion inserted Gaussians into low-coverage regions when a new keyframe was added. Geometry-aware Gaussian selection optimized only Gaussians that contributed substantially to the rendering loss, reducing computation during backpropagation.

Tracking optimizes the pose against a rendered photometric loss. GS-SLAM's tracking loss is an L1 color loss over sampled pixels:

$$\mathcal{L}_{track} = \sum_m \|\mathbf{C}_m - \hat{\mathbf{C}}_m\|_1$$

During mapping, Yan used a weighted sum of color L1 and depth L1 losses. Training the Gaussian map also inherited the original 3DGS objective, $(1-\lambda)\mathcal{L}_1 + \lambda\mathcal{L}_{D\text{-}SSIM}$ with $\lambda=0.2$, as its default form. The differentiable rasterizer makes this loss differentiable with respect to pose.

On the Replica dataset, GS-SLAM matched NICE-SLAM's PSNR at higher throughput. It nevertheless required an RGB-D camera and was not validated in large-scale outdoor environments.

---

## SplaTAM: silhouette-based densification

[Keetha et al. 2024. SplaTAM (CVPR)](https://arxiv.org/abs/2312.02126), by Nikhil Keetha at Carnegie Mellon and his colleagues, used a simpler densification method than GS-SLAM based on a silhouette mask.

The **silhouette mask** identifies regions in the current view that the existing Gaussians do not explain. SplaTAM adds new Gaussians to these empty areas of the rendered mask, using absence of coverage as a direct densification criterion.

Tracking optimizes the pose, while mapping optimizes the Gaussian parameters. Tracking holds the map fixed, and mapping updates the Gaussians. GS-SLAM also separates pose and map variables, so separation alone does not distinguish SplaTAM.

> 🔗 **Borrowed.** SplaTAM applies PTAM's keyframe-based map-management principle (Klein & Murray, 2007) to a new representation. Selective keyframe insertion, which PTAM used to maintain its map, becomes the trigger for Gaussian densification in SplaTAM.

On the Replica dataset SplaTAM recorded PSNR 34.11 dB. In the same paper's table, NICE-SLAM recorded 24.42 dB. The rendering-quality gap was clear.

In the Limitations & Future Work section of the 2024 CVPR paper, Keetha listed sensitivity to motion blur, depth noise, and aggressive rotation. He also identified removal of the dependence on known intrinsics and dense depth, along with improved scalability, as future work.

> 📜 **Prediction vs. outcome.** In SplaTAM's Limitations section (2024), Keetha identified sensitivity to motion blur, depth noise, and aggressive rotation, as well as dependence on known intrinsics and dense depth. Matsuki's MonoGS (CVPR 2024) removed the depth requirement with a monocular RGB system in the same year. Work on unknown intrinsics and large-scale operation remained in progress in 2024–2025.

---

## MonoGS: monocular RGB

[Matsuki et al. 2024. MonoGS (CVPR)](https://arxiv.org/abs/2312.06741), by Hidenobu Matsuki at Imperial College's Dyson Robotics Lab and his colleagues, removed the depth-sensor requirement. It performs 3DGS SLAM from a single monocular RGB camera.

Scale is a central difficulty in the monocular setting: projective geometry alone does not determine absolute metric scale. Matsuki optimized Gaussian geometry directly and added an isotropy loss, but the monocular trajectory remains scale-free.

$$\mathcal{L}_{iso} = \sum_k \| \mathbf{s}_k - \bar{s}_k \mathbf{1} \|_1$$

Here $\mathbf{s}_k \in \mathbb{R}^3$ is the scale vector of the $k$-th Gaussian, and $\bar{s}_k = \frac{1}{3}\sum_j s_{k,j}$ is the mean scale across its three axes. Isotropy regularization discourages large differences between those axis lengths. It reduces elongation along the viewing direction when viewpoint constraints are insufficient, limiting artifacts that interfere with rendering and tracking.

For tracking, Matsuki optimizes pose directly with the photometric loss between the Gaussian rendering and the observed image. New Gaussians at pixels with rendered depth are initialized around that depth with low variance; those without rendered depth are initialized around the rendered image's median depth with high variance. Multiview observations then refine these depth hypotheses. Neither initialization nor isotropy regularization recovers absolute metric scale.

> 🔗 **Distinction.** MonoGS uses neither a pretrained monocular depth predictor nor an external tracking module. The paper therefore does not support a direct MonoDepth2 lineage for its initialization.

Matsuki worked at Imperial's Dyson Robotics Lab, as did Sucar on iMAP and Bloesch on CodeSLAM under Davison's supervision. MonoGS reflects the lab's transition from implicit MLPs to explicit Gaussian representations.

In [the first arXiv version of MonoGS, released in 2023](https://arxiv.org/abs/2312.06741v1), average ATE RMSE on TUM-RGBD was 4.44 cm monocular and 1.58 cm RGB-D. Monocular trajectories were aligned to ground truth with scale adjustment; RGB-D trajectories used rigid alignment only. Rendering quality in the RGB-D setting on Replica reached an average PSNR of 37.50 dB, comparable to other same-generation GS-SLAM systems.

---

## RTG-SLAM and real-time processing

Speed remained a problem for GS-SLAM systems because neither GS-SLAM nor SplaTAM operated convincingly in real time. Peng Zhexi's group at Zhejiang University published [RTG-SLAM (SIGGRAPH 2024)](https://arxiv.org/abs/2404.19706) in 2024 with real-time performance as an explicit objective.

RTG-SLAM controls the number of Gaussians by optimizing only those that contribute substantially to the current camera view. It initializes Gaussians from surfels (surface elements), preserving geometry with fewer primitives. On the Replica dataset, it approached real-time throughput.

---

## Representation choices after 3DGS

The rapid growth of 3DGS papers after 2024 broadened the representation choices in SLAM mapping. TSDF and occupancy grids remain in use for embedded, planning, and safety applications, while NeRF and 3DGS are selected for different objectives. 3DGS papers emphasize rendering speed and explicit primitive updates, but that trend alone does not establish that the other representations left the mainstream.

The shift reflected both representation design and compatibility with available hardware. GPU rasterizers are more highly optimized than GPU ray marchers, and 3DGS's ability to use the existing graphics pipeline accelerated its adoption relative to NeRF.

> 🔗 **Borrowed.** 3DGS directly inherits differentiable scene optimization from NeRF. Mildenhall et al. (2020) established the use of gradients and a photometric loss to connect observations with rendering. Kerbl retained that framework while replacing the implicit MLP with explicit Gaussians.

> 📜 **Prediction vs. outcome.** In §7.4, Limitations, of the 3DGS paper (2023), Kerbl et al. identified elongated artifacts and popping in sparsely observed regions, the absence of regularization, and memory consumption of more than 20 GB during training and several hundred MB when rendering large scenes. They proposed antialiasing, more principled culling, and point-cloud compression as future work. The [Compact 3DGS](https://arxiv.org/abs/2311.13681) line and [Niedermayr et al.](https://arxiv.org/abs/2401.02436) directly addressed compression in 2024. The original paper did not explicitly propose dynamic-scene extensions such as [4DGS](https://arxiv.org/abs/2310.08528) and [Deformable 3DGS](https://arxiv.org/abs/2309.13101), or generation and editing systems such as [DreamGaussian](https://arxiv.org/abs/2309.16653) and [GaussianEditor](https://arxiv.org/abs/2311.14521), but these became separate research directions around 2024.

---

## 🧭 Still open

Memory scaling. The number of Gaussians grows linearly with scene size. A few hundred thousand primitives may suffice for the indoor Replica dataset, but an outdoor city block can require tens of millions. Researchers are studying Gaussian pruning and level-of-detail hierarchies, but no consensus exists on managing the trade-off between memory and rendering quality at large scale. The Compact 3DGS line (Lee et al. 2024, Niedermayr et al. 2024) explores compression.

Semantic integration. In 2023, [LERF](https://arxiv.org/abs/2303.09553) combined language features with NeRF, while [LangSplat](https://arxiv.org/abs/2312.16084) combined them with a Gaussian representation, and later work coupled semantic Gaussians to SLAM. A common protocol that compares real-time updates, tracking quality, and semantic accuracy across scenes and hardware has not settled. Interference between jointly optimized semantic and geometric variables remains a central evaluation target.

Dynamic scenes. 4DGS and Deformable 3DGS added a time dimension to Gaussians. In SLAM, dynamic objects move independently of the background and require separate treatment. GS-SLAM (Yan et al. 2023), SplaTAM (Keetha et al. 2024), and MonoGS (Matsuki et al. 2024) all retain a static-world assumption. Ch.15b separately traces SLAM's treatment of moving objects, from mask-based outlier rejection and multi-object factor graphs to deformable reconstruction.

3DGS also left its initialization unresolved. Gaussians could originate from an SfM point cloud or a depth sensor, but placing them required a known pose, while estimating a pose required an existing map. Systems handled this dependency differently: RGB-D methods used measured depth, while MonoGS formed initial depth hypotheses internally without an external depth predictor. DUSt3R and its successors, covered in Ch.16, instead learned geometry directly rather than initializing it from an existing representation.
