## 18.5 Manhattan-World 가정 — 좁아진 적용 범위와 보조 제약으로 남은 쓰임

Manhattan-world 가정을 쓴 SLAM도 같은 무렵 나왔다. 이 방식이 쓰이는 범위는 나중에 좁아졌다.

가정은 단순했다. [Coughlan & Yuille 1999](https://doi.org/10.1109/ICCV.1999.790349)의 Manhattan world 개념에 따라, 실내 구조는 대부분 세계 좌표계의 세 직교 축(x, y, z)에 맞춰 있다고 봤다. 벽, 바닥, 천장이 이 방향을 만든다. 이미지 속 평행선 묶음은 소실점(vanishing point)으로 모인다. 각 소실점은 카메라 회전 행렬 R과 방향 벡터 d로 `v = K R d`처럼 쓸 수 있다(K: 카메라 내부 행렬). 서로 직교하는 소실점 세 개를 찾으면 R의 세 열을 바로 구할 수 있다. IMU나 feature matching 없이 기하 제약만으로 회전의 drift를 누를 수 있다는 뜻이다. 이 아이디어를 visual odometry와 합치려는 시도가 이 무렵 나왔다.

긴 복도와 직사각형 방에서는 이 구조적 prior로 drift를 줄일 수 있었다. 그 밖의 환경이 문제였다. 야외로 나가거나, 둥근 구조물이 있거나, 구조가 불규칙한 산업 현장에 들어가면 Manhattan-world 가정 자체가 맞지 않았다. 그래서 이 가정은 맞는 환경에서만 골라 쓰는 보조 제약으로 남았다.

---

## 18.6 사라진 방법의 그 뒤

사라졌다는 말이 뜻하는 바는 사례마다 다르다. RatSLAM의 topological map 아이디어는 SeqSLAM으로 이어졌고, 그 뒤를 이은 방법들이 visual place recognition 분야에 남아 있다. SLAM++와 [LERF](https://arxiv.org/abs/2303.09553)(Kerr et al., ICCV 2023), [LangSplat](https://arxiv.org/abs/2312.16084)(Qin et al., CVPR 2024)은 모두 지도에 의미 정보를 붙인다. LERF와 LangSplat이 SLAM++를 직접 이었다고 볼 인용 근거는 없다. 서로 다른 표현에서 같은 목표가 나타난 경우로 보는 편이 정확하다.

Event camera SLAM은 다르게 흘러갔다. 처음에는 하드웨어 제약이 컸다. 2017년 ISSCC에서 Samsung이 640×480 해상도의 DVS를 발표했고([Son et al. 2017](https://doi.org/10.1109/ISSCC.2017.7870263)), 2021년에는 Sony와 Prophesee가 1280×720 해상도의 IMX636을 [발표](https://www.sony-semicon.com/en/news/2021/2021090901.html)했다. 고속 드론과 HDR 환경에서 쓰임새도 분명해졌다. Guillermo Gallego(TU Berlin) 등 event vision 연구자들은 [서베이](https://arxiv.org/abs/1904.08405)에서 event 기반 depth 추정과 ego-motion 추정 연구를 정리했다.

---

## 🧭 아직 열린 것

**Biologically-inspired SLAM.** foundation model이 대규모 비지도 학습으로 얻는 공간 표현을 인지 지도와 견주는 시각이 있다. transformer 내부 표현을 place cell과 같은 기제로 볼 수 있는지 검증하는 일은 남은 과제다. RatSLAM 같은 방법이 foundation model 안에서 다른 이름으로 돌아올지도 가설로 남아 있다.

**Event camera SLAM의 주류화.** 해상도가 높은 상용 event camera가 나오면서(§18.6) 연구 기반이 넓어졌다. frame 기반 pipeline과 합치는 문제, 새로운 event 표현, 실제 환경 benchmark를 늘리고 평가 기준을 세우는 일이 함께 진행 중이다.

**"Semantic map" 개념의 향방.** 2017년 무렵 빠르게 늘던 semantic SLAM 연구가 주춤한 뒤, semantic 표현은 움직이는 영역을 가려내는 일과 downstream task로 쓰임을 넓혔다. 2023년부터 LERF와 언어 기반 Gaussian splatting이 언어 feature를 dense scene representation에 붙이면서 다른 형태가 나왔다. Ch.15 🧭에서 본 것처럼 semantic Gaussian을 SLAM에 넣은 연구도 나왔다. 지금까지는 geometry가 먼저 갖춰진 뒤에 semantic이 쓰였다. representation이 바뀌면서 이 순서도 바뀔지는 아직 알 수 없다.


---

# Ch.19 — 오늘의 지도와 내일의 공란

2026년에는 AR 화면에 띄운 물체가 벽에 붙은 채 흔들리지 않는다. 실내 배송 로봇은 지도 없이 주방과 회의실을 구분하고, DUSt3R 계열 모델에 사진 몇 장을 넣으면 몇 초 만에 3D 구조가 나온다. SLAM이 다 풀렸다는 인식은 이런 장면에서 나온다.

풀린 것은 2003년 무렵의 문제다. 장면은 정적이고, 조명은 일정하고, 공간은 좁다고 가정하면 단안 카메라의 기하만으로 문제를 풀 수 있었다. 이 가정 아래서 EKF가 돌아갔고, graph SLAM이 루프를 닫았고, ORB-SLAM이 keyframe을 관리했다.

각 방법이 풀었다고 한 문제 바로 옆에 아직 풀리지 않은 문제가 있다. 앞 장들에서 다룬 이런 문제를 모아 보면 서로 다른 방법이 같은 제약에 걸려 있다.

---

## 19.1 조명과 환경 변화: 카메라 측광 모델의 한계

Visual SLAM을 실외에서 쓰기 시작한 뒤로 조명과 날씨 변화가 계속 문제가 됐다. 실제 조명과 날씨는 카메라 측광 모델(photometric model)이 가정하는 범위를 자주 벗어났다.

학습한 descriptor는 훈련 도메인에서는 ORB보다 낫다. 수중, 열화상, 저조도 영상에서는 결과가 들쭉날쭉하고, 어느 쪽이 나은지는 아직 가려지지 않았다(Ch.2 §2.7 참조). Ch.5에서 다룬, 어둡거나 움직임이 많은 장면에서 추적이 끊기는 문제도 그대로다. 2007년 PTAM은 논문 제목에 "Small AR Workspaces"를 넣어 쓰는 범위를 좁은 작업 공간으로 한정했다(Ch.5 참조).

Direct method에서는 이 문제가 방법의 바탕에 닿는다. direct method는 같은 점이 어느 프레임에서나 같은 밝기로 보인다고 가정한다(brightness constancy). 자동 노출이 바뀌거나, 역광이 들거나, 터널에서 밖으로 나오면 이 가정이 바로 깨진다. Bergmann 등의 online photometric calibration은 노출 시간, response function, vignetting을 direct VO와 나란히 실시간으로 추정한다(Ch.8 §🧭 참조). Place recognition도 같은 문제를 10년 넘게 안고 있다. [Nordland](https://nikosuenderhauf.github.io/projects/placerecognition/)와 [Oxford RobotCar](https://robotcar-dataset.robots.ox.ac.uk/)처럼 계절과 조명이 크게 바뀌는 데이터에서 [DINOv2](https://arxiv.org/abs/2304.07193) 기반 방법이 격차를 줄였다(Ch.10 §10.7 참조).

ORB-SLAM에서 지도를 오래 다시 쓰는 일도 같은 문제에 막힌다. ORB-SLAM3의 Atlas로 여러 지도를 함께 관리할 수 있게 됐다. 그래도 아침에 만든 지도로 저녁에 같은 장소를 알아보려 할 때 조명이 크게 다르면 실패할 수 있다(Ch.7 §🧭 참조).

---

## 19.2 정적 세계 가정: 가장 오래된 단순화의 한계

SLAM은 오래전부터 세계가 움직이지 않는다고 가정했다(static world assumption). 여러 방법이 이 가정에서 한계를 만났다.

COLMAP 같은 SfM 파이프라인은 정적 장면을 가정해서 움직이는 물체에 약하다. KinectFusion부터 BundleFusion까지 RGB-D dense SLAM도 모두 장면이 정적이라고 가정한다. DynaSLAM과 MaskFusion은 segmentation을 붙여 움직이는 물체를 다루려 했다. 계산 비용과 robustness를 함께 맞추는 일은 남은 과제다(Ch.9 §🧭 참조).

Self-supervised monocular depth는 움직이는 물체를 mask로 가려 학습에서 뺀다(Ch.11 §🧭 참조). GS-SLAM, SplaTAM, MonoGS 같은 초기 3DGS SLAM도 정적 세계를 가정했다(Ch.15 §🧭 참조). LiDAR SLAM에도 같은 문제가 있다. LOAM이 future work로 밝힌 과제와 별개로 움직이는 물체를 다루는 문제가 남아 있다(Ch.17 §🧭 참조).

오랜 시간에 걸친 변화와 변형(deformation)도 같은 문제에 속한다. 로봇이 다시 찾은 방에서 전에 본 물체가 보이지 않으면, 물체가 정말 없어졌는지(evidence of absence) 그 자리를 제대로 보지 못했을 뿐인지(absence of evidence) 가려야 한다. SLAM Handbook 15장은 이 문제를 change detection(변화 감지)의 과제로 다루고, Khronos가 loop closure 뒤에 변화 감지 단계를 돌려 둘을 가린다고 설명한다. [Schmid 등의 Panoptic Multi-TSDF](https://doi.org/10.1109/ICRA46639.2022.9811877)(ICRA 2022)는 물체마다 따로 submap을 두고 물체 단위로 변화를 추론해 오래 쓰는 지도를 최신 상태로 유지했다. 변형하는 장면에서는 카메라의 rigid motion과 물체의 rigid motion을 나누기 어렵다. Handbook은 이것을 **Floating Map Ambiguity**라고 부르고, 물체의 변위에 prior를 주어 둘을 나눈다고 설명한다. Handbook §15.5는 카메라 궤적과 지도의 변형을 둘 다 정확히 추정할 수 있는 조건을 열린 질문으로 남겼다. Khronos는 RGB-D 입력으로 이 변화 감지를 온라인으로 돌렸지만, 변형하는 장면은 다루지 않았다. 최소침습수술(MIS)용 SLAM에서는 NR-SLAM이 생체 내시경 영상으로 평가됐지만, 논문 스스로 깊이 불연속과 강한 변형이 함께 있는 장면에서는 지도를 만들고 넓히기 어렵다고 밝혔다(Ch.15b 참조).

---

## 19.3 Scale과 표현 메모리: 크기가 달라지면 문제가 달라진다

SLAM 시스템이 방 한 칸에서 건물로, 건물에서 도시로 커질 때마다 같은 문제가 모양을 바꿔 다시 나왔다.

단안 카메라만으로는 크기(scale)를 정할 수 없다는 사실은 1980년대 SfM 이론에서 이미 밝혀졌다. 단안 영상의 투영 기하만으로 얻은 궤적과 장면은 어떤 배율을 곱해도 관측과 똑같이 맞는다. metric scale을 정하려면 IMU나 depth 같은 정보가 더 필요하다(Ch.5 §🧭 참조). Ch.11의 monocular depth에서도 같은 문제가 나온다. [Metric3D v2](https://arxiv.org/abs/2404.15506)는 카메라 모델 차이를 canonical camera space로 바꾸어 metric depth를 냈고, [Depth Anything V2](https://arxiv.org/abs/2406.09414)는 metric depth label로 fine-tuning한 모델을 내놓았다. 스마트폰, CCTV, 기록 보관 영상, 위성 영상처럼 intrinsic을 모르는 영상에서 카메라에 상관없이 metric depth를 내는 일은 아직 풀리지 않았다(Ch.11 §🧭 참조).

TSDF 방식에서는 메모리 문제가 표현의 한계로 나타났다. [Voxblox](https://arxiv.org/abs/1611.03631)와 [OctoMap](https://octomap.github.io/)으로 비용은 줄었다. 그래도 dense 표현의 메모리는 지도 범위와 voxel 해상도에 따라 빠르게 늘어난다. 영역마다 해상도를 달리하는 wavemap 같은 다해상도 구조도 나왔다(Ch.9 §🧭 참조). NeRF-SLAM도 같은 한계에 막혔고, 도시 규모는 아직 풀리지 않았다(Ch.14 §🧭 참조). Gaussian Splatting에서도 장면 범위와 세부가 커지면 필요한 Gaussian 수가 늘어난다(Ch.15 §🧭 참조). Foundation 3D에서는 이 문제가 transformer의 계산 구조에서 온다. 모든 image token 사이에 attention을 계산하면 메모리가 token 수의 제곱으로 늘어서 긴 시퀀스를 다루기 어렵다. Spann3R의 incremental 방식은 부분적인 답이다(Ch.16 §🧭 참조).

크기 문제는 **데이터 이동 비용**으로도 나타난다. 전력을 많이 먹는 것은 프로세서와 메모리 사이에서 비트를 옮기는 물리적 비용이다. Davison은 Handbook Ch.18 §18.8에서 12번째 SLAM 지표로 "on-device data movement, measured in bits × millimetres"를 제안한다(p.547). Handbook Ch.16의 식들도 표현마다 복잡도를 나눠 적는다. label마다 따로 둔 flat voxel map은 $O(L\cdot V/\delta^3)$이다(Eq. 16.34). metric-semantic hierarchy는 $O(V/\delta^3+N_\text{objects}+N_\text{rooms}+\cdots)$이다(Eq. 16.35). topological 3D scene graph처럼 기하 층을 더 작게 표현하면 $O(N_\text{sub-sym}+N_\text{objects}+N_\text{rooms}+\cdots)$가 된다(Eq. 16.36). 마지막 단계에서는 기하 표현이 바뀌어 원래 voxel 지도의 정보를 일부 잃는다.

## 19.4 학습 기반 시스템의 불확실성 calibration

Ch.4에서 다룬 Julier와 Uhlmann의 EKF inconsistency 분석 이후, SLAM 시스템이 자기가 어디 있는지 모른다는 사실을 얼마나 정확히 아는지는 이 분야의 질문으로 남아 있다.

비가우시안 불확실성은 EKF의 핵심 가정과 부딪힌다. 실제 센서 오차는 봉우리가 여럿이거나(multi-modal) 꼬리가 두꺼운(heavy-tail) 경우가 흔하다. Stein particle, normalizing flow, learned uncertainty가 시도되고 있고, 실시간 시스템에서는 아직 검증되지 않았다(Ch.4 §4.8 참조). Graph SLAM에서 환경과 센서에 맞는 robust kernel을 미리 정하는 일도 남은 과제다(Ch.6 §🧭 참조). [Ch.6b](chapter_06b_certifiable.md)의 tightness 경계도 같은 문제다. SE-Sync가 정확한 해를 찾는다는 보장은 노이즈가 $\beta$ 이하라는 충분조건으로 주어진다. 실제 문제에서 $\beta$를 미리 계산하는 일, certifiable 방법을 visual SLAM과 VIO로 넓히는 일, 새 측정이 들어올 때마다 SDP를 다시 풀어 certificate를 갱신하는 online certification은 모두 아직 남아 있다.

학습 기반 방법에서는 문제가 더 어렵다. Bayesian PoseNet이 불확실성을 추정하려 한 뒤로도, learned uncertainty가 OOD(훈련 분포 밖) 입력에서 calibrated인지는 아직 확인되지 않았다(Ch.12 §🧭 참조). DROID-SLAM 계열에서 보았듯 learned prior는 훈련 도메인 밖에서 성능이 떨어져도 얼마나 떨어졌는지 겉으로 드러나지 않을 수 있고, 학습한 모델은 그럴듯한 모양으로 실패하기도 한다. geometric 방법에도 잘못된 지역해나 지나친 확신처럼 드러나지 않는 실패가 있다. [TartanAir](https://arxiv.org/abs/2003.14338) 같은 합성 데이터를 써도 sim-to-real gap이 남는다(Ch.13 §🧭 참조).

Foundation 3D에서는 이 문제가 loop closure를 어떻게 정의할지의 문제로 이어진다. DUSt3R 계열에서 pointmap 기반 교정을 지도 전체에 퍼뜨리는 일을 MASt3R-SLAM은 기존 방식으로 처리한다. 이것이 원리적인 해법인지는 불확실하다(Ch.16 §🧭 참조).

Davison은 Handbook Ch.18에서 문제를 다시 세운다. *"100장으로 3D 모델을 만든 네트워크에 이미지 1장이 추가되면 전체를 다시 돌려야 하는가"*(p.528). 장기 표현과 fusion이 필요하다고 보면 probabilistic state estimation과 modular scene representation이 필요해진다. 그가 대안으로 든 [GBP Learning](https://arxiv.org/abs/2311.14649)(Nabarro et al., ICML 2024)은 신경망 weight를 factor graph의 random variable로 넣어 *"training time"*과 *"test time"*의 구분을 없애는 방향이다(§18.7, pp.543–545). 이 방향이 문제를 원리적으로 푸는지는 아직 알 수 없다.

## 19.5 센서 융합과 새 모달리티

Visual SLAM과 LiDAR SLAM은 같은 시기에 같은 문제를 다른 센서로 풀었다. 둘을 합치려는 시도가 이어졌지만 하나의 방법으로 모이지는 않았다.

LVI-SAM은 visual-inertial subsystem과 lidar-inertial subsystem을 factor graph로 묶었고, 저자들은 이를 tightly coupled 시스템이라고 불렀다. 두 subsystem은 서로 정보를 주고받으면서도 필요하면 따로 돌 수 있게 짜여 있다. 두 센서를 한 추정기에서 함께 다루는 표준 설계를 정하는 일은 남은 과제다(Ch.17 §🧭 참조). solid-state LiDAR가 널리 쓰이면서 알고리즘이 따라가지 못한 부분도 있다. LOAM은 360°로 도는 scan line을 가정했다. solid-state LiDAR는 시야(FoV)가 좁고 스캔 패턴이 반복되지 않아 관측 조건이 다르다. FAST-LIO2와 Livox LOAM이 일부를 다루지만, 여러 센서 종류에 두루 맞는 방법을 만드는 일은 아직 끝나지 않았다(Ch.17 §🧭 참조).

wide-baseline 매칭에도 남은 문제가 있다. 시점이 크게 바뀌면 Harris나 ORB 같은 hand-crafted local feature의 성능이 떨어진다. 몇 도부터 떨어지는지는 데이터마다 다르다. DUSt3R에는 전통적인 sparse matching 단계가 없다. 이것이 descriptor 문제를 푼 것인지는 아직 판단하기 이르다(Ch.2 §2.7 참조). Place recognition과 metric localization도 파이프라인에서 따로 떨어져 있다. 2023–2025년에 두 과정을 하나의 표현으로 합치려는 연구가 나왔지만, 위치 정밀도와 처리 속도를 함께 얻는 문제가 남았다(Ch.10 §10.7 참조).

Event camera는 새 모달리티가 나왔을 때 알고리즘이 얼마나 늦게 따라오는지 보여 준다. 2017년 Samsung의 640×480 DVS와 2021년 Sony·Prophesee의 1280×720 센서처럼 해상도가 높은 event camera가 나왔다(Ch.18 §18.6 참조). frame 기반 pipeline과 합치는 문제, event 표현, 실제 환경 benchmark는 아직 함께 진행 중이다(Ch.18 §🧭 참조).

이 책이 다루지 않은 모달리티도 있다. **4D imaging radar**와 **legged/proprioceptive SLAM**이다. Radar는 안개나 비처럼 카메라와 LiDAR가 함께 약해지는 조건을 보완한다. Oxford Radar RobotCar(2020), nuScenes의 radar 채널, Arbe와 Mobileye 등의 4D imaging radar 개발로 radar는 자율주행 연구와 제품 개발의 한 축이 됐다. Legged SLAM은 2020년대에 ANYmal, Spot, Unitree가 실외에 배치되면서 운동학(kinematic) prior와 접촉(contact) prior를 융합하는 별도의 연구 흐름이 됐다. 두 분야 모두 visual, LiDAR, foundation 3D와 출발점도 benchmark도 달라서 각각 따로 역사를 쓸 만한 크기다.

## 19.6 알고리즘 구조를 하드웨어에 맞추기

Davison은 Handbook Ch.18에서 알고리즘의 그래프 구조를 실리콘의 그래프 구조에 맞추는 문제를 앞에 내세운다.

Handbook은 프로세서가 해마다 빨라진다는 전제를 *"this has stopped being true"*라고 정리하고, 단일 코어 clock speed가 약 4 GHz에서 더 오르지 않게 됐다고 설명한다(Handbook Ch.18, pp.528–529). 반면 몸에 걸치는 Spatial AI 기기는 안경 한 짝 크기(65 g, 1 W 미만)에 맞춰야 한다(p.522). Handbook은 이 차이 때문에 분야가 **heterogeneous·specialized·parallel** 아키텍처로 갈 수밖에 없다고 본다.

Handbook은 서로 다른 실리콘 사례를 나란히 든다. [Apple Vision Pro의 R1](https://www.apple.com/uk/newsroom/2023/06/introducing-apple-vision-pro/)(2023)은 카메라와 센서의 새 이미지를 12 ms 안에 디스플레이로 보내도록 설계됐다. [Meta Aria Gen 2](https://ai.meta.com/blog/aria-gen-2-research-glasses-under-the-hood-reality-labs/)(2025)는 기기 안의 machine perception에 전용 coprocessor를 쓴다. Graphcore IPU는 칩 하나에 저마다 메모리를 가진 코어 1,216개를 두고, 코어끼리 메시지를 주고받는다. Manchester 대학의 [SCAMP5](https://personalpages.manchester.ac.uk/staff/p.dudek/papers/carey-iscas2013.pdf)는 256×256 픽셀마다 처리기를 두고 1.2 W로 동작한다. [SpiNNaker](https://apt.cs.manchester.ac.uk/projects/SpiNNaker/)는 ARM 코어를 최대 100만 개까지 묶는 neuromorphic 구조다. 칩마다 맞는 graph topology가 다르다. 어떤 알고리즘을 어느 실리콘에 어떻게 올릴지는 남은 과제다.

Davison이 후기에 연구한 **Gaussian Belief Propagation(GBP)**은 이 문제를 다룬다. Ortiz, Pupilli, Leutenegger, Davison은 [Bundle Adjustment on a Graph Processor](https://arxiv.org/abs/2003.03134)(CVPR 2020)에서 IPU 코어 1,216개로 GBP를 돌려 keyframe 125개와 점 1,919개로 된 실제 bundle adjustment 문제를 40 ms 안에 풀었다. 같은 문제를 CPU의 Ceres로 풀면 1,450 ms가 걸렸다. Murai 등의 [Robot Web](https://arxiv.org/abs/2202.03314)(IEEE TRO 2024)에서는 로봇마다 factor graph의 자기 조각을 맡고 메시지를 주고받으며 비동기 GBP로 위치를 추정했고, 시뮬레이션에서 최대 1,000대까지 시험했다. Davison은 *"We must get away from the idea that a 'god's eye view' of the whole structure of the graph will ever be available"*라고 쓴다(Handbook Ch.18, p.541). Factor graph를 기본 표현으로 두고, 전체 posterior를 한 번에 구하는 일은 포기한다. 메시지는 그래프 위를 "bubble"하듯 퍼지며 국소적으로 수렴한다. MASt3R-SLAM 같은 transformer 기반 시스템은 backend에서 GBP 대신 그래프 전체를 한 번에 푸는 2차 global optimization을 쓴다.

Davison이 제안한 12개 지표 가운데 11번 "power usage"와 12번 "on-device data movement"는 하드웨어 쪽 지표다(§18.8, p.547). 정확도와 함께 전력, 그리고 장치 안에서 옮기는 데이터의 비트 수와 거리로 시스템을 평가하자는 제안이다. TUM, KITTI, EuRoC 같은 주요 benchmark가 이 지표를 받아들일지는 정해지지 않았다. 알고리즘을 중심으로 쓴 이 책도 이 부분은 다루지 않았다.

## 19.7 Semantic 표현과 Open-World

[Ch.18 §18.4](chapter_18_dead_ends.md#184-semantic-slam--사물을-landmark로-쓰는-방식)는 semantic이 landmark 자리에서 밀려났다고 썼다. 좁은 의미로는 맞는 말이다. ORB-SLAM3와 MASt3R-SLAM의 지도는 point로 이루어진다. 같은 시기에 semantic은 지도의 위층으로 옮겨 가 실제 성과를 냈다.

metric-semantic mesh를 실시간으로 만든 [Kimera](https://doi.org/10.1109/ICRA40945.2020.9196885)(2020)와 scene graph를 계층으로 나누어 실시간으로 만든 [Hydra](https://doi.org/10.15607/RSS.2022.XVIII.050)(2022)는 Ch.18 §18.4에서 다뤘다. Handbook Ch.16은 Hydra를 *"first online system to produce fully hierarchical scene graphs that included objects, places, and rooms"*라고 부른다(§16.4.2). 그 위에 foundation feature가 얹혔다. [ConceptFusion](https://arxiv.org/abs/2302.07241)과 [VLMaps](https://arxiv.org/abs/2210.05714)(2023)는 CLIP feature를 dense map에 붙였다. [ConceptGraphs](https://doi.org/10.1109/ICRA57147.2024.10610243)(2024)는 open-vocabulary object node에, [Clio](https://doi.org/10.1109/LRA.2024.3451395)(2024)는 task-driven hierarchy에 붙였다. [LERF](https://arxiv.org/abs/2303.09553)와 [LangSplat](https://arxiv.org/abs/2312.16084)은 radiance field와 Gaussian splatting에 CLIP feature를 실었다.

이 흐름에서 새로 생긴 문제도 많다. Handbook Ch.16 저자들은 *"performing uncertainty quantification in hierarchical representations mixing discrete and continuous variables is still a largely unexplored problem"*이라고 쓴다(p.488). 사물 category나 방 ID 같은 이산 변수와 pose나 surface 같은 연속 변수가 섞인 그래프에서 불확실성을 어떻게 전파할지는 아직 거의 연구되지 않았다. scene graph를 실외와 비정형 환경으로 넓히는 문제도 풀리지 않았다. Clio는 Information Bottleneck으로 task에 맞춰 hierarchy를 다시 짠다(Handbook Ch.17, Eq. 17.8). 이 방식을 일반화하는 문제도 남아 있다.

지도가 아직 필요한지도 질문이다. Handbook Ch.17 §17.4.2 "Revisiting the Question of the Need for Maps"에서 Paull 등 Ch.17 저자들이 이 질문을 직접 다룬다. 긴 context를 받는 VLM에 지난 프레임을 모두 넣으면 explicit scene graph 없이 planning을 할 수 있는가? [OpenEQA](https://open-eqa.github.io/)와 [Mobility VLA](https://arxiv.org/abs/2407.07775)(2024)에서는 지도 없는 방식이 짧고 단순한 과제에서는 통했지만, 공간과 시간 범위가 길어지면 실패했다. Ch.17 저자들은 *"the need for an explicit map representation ... largely depend[s] on the spatial and temporal horizons of the considered tasks and remains an active area of research"*라고 쓴다(p.515).

SLAM과 생성형 로봇 정책의 관계도 같은 질문으로 이어진다. [RT-2](https://robotics-transformer2.github.io/)(2023), [OpenVLA](https://arxiv.org/abs/2406.09246)(2024), [π₀](https://www.physicalintelligence.company/blog/pi0)(2024) 같은 VLA 모델은 SLAM을 대신하는가, SLAM 위에서 돌아가는가. Handbook Ch.17 결론부는 *"true generalization and scalability to compositional tasks ... could be achieved through some form of explicit structure that is learned through a process such as SLAM. ... these two paradigms ... are entirely complementary"*라고 정리한다(§17.4.4, p.520). "complementary"가 어떤 아키텍처 결합을 뜻하는지는 아직 정해지지 않았다.

## 19.8 열린 질문의 구조

풀리지 않은 문제들은 남아 있는 방식이 저마다 다르다. Ch.5의 monocular scale ambiguity는 SfM 이론에서 증명된 기하학적 사실이고, 2026년에도 같은 정식화로 남아 있다. 정적 세계 가정의 한계는 20년 동안 모양을 바꿔 가며 다시 나왔다. Ch.3에서는 SfM의 문제로, Ch.9에서는 dense SLAM의 문제로, Ch.15에서는 Gaussian 표현의 문제로, Ch.17에서는 LiDAR SLAM의 문제로 나타났다. Foundation 3D에서 loop closure를 어떻게 다시 정의할지, learned uncertainty를 어떻게 calibrate할지는 최근에 떠오른 문제여서 역사가 짧다.

Ch.0은 SLAM이 풀렸다고 여겨지는 시대를 그렸다. 같은 2026년 *The SLAM Handbook*의 Epilogue 조언 모음에는 *"If someone tells you 'SLAM is solved,' don't listen to them"*이라는 문장이 실렸다. 분야 안에서도 같은 인식을 경계한 것이다. EKF의 국소 선형화와 단일 Gaussian 근사를 버린 particle filter, sparse feature를 버린 dense method, geometric prior 대신 learned prior를 쓰는 방법이 나왔다. 가정을 하나 내려놓을 때마다 전에 닫혔던 문제가 다른 모양으로 돌아왔다.

# Ch.0 — SLAM Solved?

In 2026, you pick up a phone and an AR layer sticks to the wall. Indoor delivery robots tell the kitchen from the conference room without being handed a map. Give a few photos to a [DUSt3R](https://arxiv.org/abs/2312.14132)-family model and a 3D structure emerges in seconds. By now, these are products rather than demos, part of the background. SLAM often looks like a more-or-less solved problem.

---

Go back to 2003 and the scene is different. Andrew Davison, in a lab at Imperial College London, demonstrated real-time 3D tracking with one laptop and one webcam. The system, called [MonoSLAM](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf), ran at 30 Hz on a desktop, tracked about ten features per frame, and maintained a sparse map of a few dozen landmarks. It covered one desk in one room; when the camera left the desk, the map diverged. That scale and limitation were representative of real-time monocular SLAM at the time.

Those systems tracked far fewer features per frame than a phone AR session does today. How did the tracking systems of 2003 develop into the AR systems of 2026?

---

SLAM's history is not a single development curve. It traces four traditions that ran independently before colliding and absorbing one another. Photogrammetrists solved bundle adjustment by hand a century ago. Roboticists began treating maps in the language of probability with [Smith-Cheeseman](https://arxiv.org/abs/1304.3111)'s 1986 stochastic spatial-relations framework, and the name "SLAM" was attached to this problem setting nine years later, in [Durrant-Whyte & Leonard's 1995 survey](https://ieeexplore.ieee.org/document/476131). Computer vision researchers focused on real-time feature tracking. The deep learning community of the 2020s is trying to absorb all of it into a single network.

The book asks not "how" but "why this way." Was the replacement of EKF-based SLAM by graph-based SLAM a natural technical evolution, or a contingency decided by a few people? Was the split between feature-based and direct methods foreseen from the start? Why has deep learning been so slow to replace the geometry pipeline? Counterfactuals matter only when the alternatives actually existed. Here, they did.

---

Tracing that path needs tools. A list of years gives a chronicle; an explanation of techniques gives a textbook. This history uses two lenses: lineage and prediction. Where did an idea come from? How did the future researchers expected differ from what actually unfolded?

Four devices recur throughout the book and guide each chapter.

**Lineage openings** sit in the first paragraph or two of a chapter. They show, through names and years, which intellectual inheritance the chapter's protagonist took on. No idea in SLAM was born in a vacuum. Follow the lineage and the terrain of borrowing becomes visible.

**🔗 Borrowed boxes** are margin annotations that state in one or two sentences where a specific technique came from: "ORB-SLAM's structure here came from Strasdat 2011." Researchers cite their sources, but often leave the lineage implicit. The box makes it explicit.

**📜 Prediction vs. outcome boxes** contrast what the original paper's Conclusion, Future Work, or Summary section anticipated with what actually happened. In §12, "Summary and Recommendations," the [Triggs 1999](https://dblp.org/rec/conf/dagstuhl/TriggsMHF99.html) bundle adjustment (BA) synthesis made the exploitation of large-scale sparse structure a central recommendation. In the 2010s, [COLMAP](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf) approached that problem from another direction, turning SfM over tens of thousands of images into an open-source production tool. The direction was right; the route was not. This device examines the gap between the future a researcher expected and the one that arrived.

**🧭 Still open** sits at the end of the chapter. It lists questions on that chapter's subject that remain unresolved as of 2026, drawing out the open problems hidden by the perception that SLAM is solved. Ch.19 gathers these items from every chapter and reassembles them by theme.

---

The book runs in six parts.

**Part 1: Prehistory** traces the tools that photogrammetry and classical computer vision built up before SLAM was born in robotics. Why is bundle adjustment still the skeleton of every optimization backend?

**Part 2: Classical SLAM** follows probabilistic mapping and the limits of the EKF through MonoSLAM, PTAM, graph-based SLAM, and optimality certification. How did joint mapping and estimation expand from filtering to optimization?

**Part 3: Maturity** covers ORB-SLAM, inertial preintegration, continuous-time estimation, direct methods, RGB-D, and place recognition. It traces how systems expanded beyond early real-time demonstrations to larger environments and more varied sensors.

**Part 4: Learning Fusion** covers monocular depth estimation, end-to-end SLAM, and hybrid methods that combine geometry with learning. Which computations did learning take over, and where did geometric constraints remain?

**Part 5: Representation** covers Neural Radiance Fields, 3D Gaussian Splatting, dynamic-scene representations, and 3D foundation models. Changes in how maps and scenes are represented also changed the relationship between tracking and reconstruction.

**Part 6: Dead Ends and Open Problems** pulls out the failed routes in SLAM's history and the structural unresolved problems still sitting behind today's perception that it is "solved."

---

A useful map needs boundaries. The relationship between foundation models and SLAM is treated as an open question arising from current research, without predicting a settled outcome. The book's material is what happened in the past and why. Nor does it set out to declare earlier research wrong. It asks what a choice meant under the constraints of its moment. Homogeneous coordinates, epipolar geometry, and EKF formulas are assumed knowledge. The task here is to trace lineage rather than explain concepts; choosing a camera or LiDAR belongs to another book.

For a systematic account of the equations, theorems, and proofs, see the [SLAM Handbook](https://github.com/SLAM-Handbook-contributors/slam-handbook-public-release). Edited by Carlone, Kim, Barfoot, Cremers, and Dellaert and published by Cambridge University Press in 2026, its 18 chapters cover the current theory and systems of SLAM. The present history records the path to that point.

The five editors close the Handbook with the line *"If someone tells you 'SLAM is solved,' don't listen to them."* The tendency to treat SLAM as solved, noted at the opening of this chapter, is a phenomenon within the field rather than its consensus.

---

When Davison stood in front of his webcam in 2003, he did not know exactly what he was starting. That demo video is still on the internet: the shaky frame, the blinking landmark dots, and a sparse map containing only dozens of points. The history between that room and today's systems is the subject of this book.

The record starts well before MonoSLAM. Before the acronym "SLAM" settled in the 1990s, and even before Smith-Cheeseman expressed a probabilistic map in equations, photogrammetrists were already recovering 3D structure from cameras. The next chapter traces that prehistory.


---

# Ch.1 — Photogrammetry and Bundle Adjustment: The 100 Years Before Triggs

The skeleton of today's SLAM optimization backend was born in German surveying. In the early twentieth century, Carl Pulfrich's method for hand-computing two-view triangulation on glass plates combined with Albrecht Meydenbauer's photogrammetric system to form a single surveying tradition. That tradition passed through Duane C. Brown's numerical formulation in 1958, and in 1999 Bill Triggs, Philip McLauchlan, Richard Hartley, and Andrew Fitzgibbon translated it into the language of computer vision. Their synthesis did not invent bundle adjustment; it made a century-old surveying inheritance usable by the computer vision community. Triggs et al. (1999) inherited the parallax principle from Pulfrich's geometry and the reprojection formulation from Brown's (1958) military surveying. Levenberg-Marquardt supplied the solver skeleton.

---

## 1. Early twentieth-century glass plates and stereophotogrammetry

In 1901, [Carl Pulfrich](https://en.wikipedia.org/wiki/Carl_Pulfrich) presented the **stereocomparator**, built by the Zeiss optical works, at the Hamburg conference of natural scientists (this was the formal unveiling, following a prototype stereoscopic rangefinder shown in Munich in 1899). The device photographed the same point from two camera viewpoints and computed distance by reading the coordinate difference on the glass plates. The principle was simple: the parallax between two views is inversely proportional to depth. The mathematics was Greek-era trigonometry; what was new was the precision of the optical instrument.

A generation earlier, [Albrecht Meydenbauer](https://www.uni-marburg.de/de/fotomarburg/histfoto/gliederung/messbilder/messbildverfahren) had systematized **architectural photogrammetry** for the preservation of buildings. In 1858, after nearly falling while surveying the exterior of Wetzlar Cathedral, he conceived of using photographs in place of direct measurement. In 1885 he founded the Royal Prussian Photogrammetric Institute (Königlich Preussische Messbild-Anstalt).

These two streams merged in twentieth-century aerial surveying. In aerotriangulation, an aircraft photographed terrain from above and pairs of images yielded three-dimensional maps. It was the age of hand calculators.

> 🔗 **Borrowed.** Modern SLAM's stereo depth estimation runs on the same principle as Pulfrich's stereocomparator. Depth comes from the baseline between two cameras and the parallax. A pixel array has replaced the glass plate of 125 years ago.

---

## 2. 1958, Brown, and numerical bundle adjustment

What Pulfrich and Meydenbauer had solved with optical instruments, Brown moved into equations.

[Duane C. Brown](https://digital.hagley.org/08206139_solution) was a surveying engineer in the United States Air Force ballistic missile development program. He worked on jointly estimating satellite orbits and ground coordinates, simultaneously optimizing many camera viewpoints and many ground control points.

In his 1958 report "A Solution to the General Problem of Multiple Station Analytical Stereotriangulation" (RCA-MTP Data Reduction Technical Report No. 43, AFMTC-TR-58-8), Brown left one of the early documents that formulated **bundle adjustment (BA)** numerically (Helmut Schmid is named as a co-inventor from the same period).

The core is the **reprojection error**. Minimize the difference between the 2D image coordinate $x_{ij} \in \mathbb{R}^2$ observed in camera $i$ and the predicted coordinate $\pi(K_i, R_i, t_i, X_j)$ obtained by projecting the 3D point $X_j \in \mathbb{R}^3$ through the intrinsic matrix $K_i$ and extrinsic matrix $[R_i | t_i]$:

$$E = \sum_{i,j} \| x_{ij} - \pi(K_i, R_i, t_i, X_j) \|^2$$

The name "bundle" comes from the bundle of rays extending out from each camera center to the observed 3D points. Camera poses and point locations are adjusted together so that those rays meet at the 3D points. Brown worked in military surveying, but bundle adjustment continued to develop in the photogrammetric literature.

> 🔗 **Translation.** Triggs et al. (1999) synthesized photogrammetric bundle adjustment for potential implementers in computer vision. The paper connected fields that approached the same optimization problem with different terminology and practices. Its account does not establish military classification as the cause of an independent rediscovery in computer vision.

---

## 3. Levenberg and Marquardt — pioneers of nonlinear optimization

Brown supplied the objective function; the tool that solved it came from somewhere else.

Reprojection error minimization is a nonlinear least-squares problem. There is no analytical solution, so iterative numerical optimization is needed.

In 1944, [Kenneth Levenberg](https://cs.uwaterloo.ca/~y328yu/classics/levenberg.pdf) published a method that interpolated between Gauss-Newton and steepest descent with a damping parameter $\lambda$. Larger $\lambda$ moves toward steepest descent for safe convergence; smaller $\lambda$ uses the fast convergence of Gauss-Newton. In its basic form, the strategy adds $\lambda \mathbf{I}$ to the matrix $\mathbf{J}^{\top}\mathbf{J}$ of the linearized normal equations, improving numerical stability. It was twenty years ahead of computer vision. In 1963, [Donald Marquardt](https://epubs.siam.org/doi/10.1137/0111030) independently rediscovered the same idea and formulated it more explicitly. The name settled as the **Levenberg-Marquardt (LM) algorithm**.

Another thirty-five years passed before the LM algorithm became the standard BA solver in computer vision.

---

## 4. 1999, Triggs et al. — a hundred years of inheritance integrated

Triggs and colleagues brought this numerical tool and the computational structure of BA together in a systematic synthesis for computer vision readers.

At the 1999 Vision Algorithms Workshop, Bill Triggs, Philip McLauchlan, Richard Hartley, and Andrew Fitzgibbon presented ["Bundle Adjustment — A Modern Synthesis"](https://link.springer.com/chapter/10.1007/3-540-44480-7_21).

The paper translated and synthesized BA theory scattered across twentieth-century surveying and aerial photogrammetry into the language of computer vision. Triggs et al. contributed two things. First, they made the structural properties of sparse BA explicit. Using the sparse block structure of the Hessian matrix (the Schur complement trick), joint camera-point optimization can be performed far more efficiently. Second, they treated gauge freedom (the arbitrariness of the reference frame) explicitly.

Seven years after this paper, Noah Snavely's [Photo Tourism (2006)](https://phototour.cs.washington.edu/Photo_Tourism.pdf) automatically reconstructed famous landmarks such as Notre-Dame and the Trevi Fountain from hundreds of photographs scattered across the Internet. Ten years later, Johannes Schönberger's [COLMAP (2016)](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf) released an open-source implementation of robust incremental structure from motion (SfM) for tens to hundreds of thousands of images. It turned a research line that had already reached the million-image range into a tool others could reproduce. Without Triggs's language, that path would have been much slower.

---

## 5. Reprojection Error — the formation of the concept

Triggs et al. described the error function being minimized. The function itself had a separate history.

There were two transitions before this error function took its present shape.

Early twentieth-century aerial triangulators measured error as "distance difference in the ground coordinate frame." Because they compared points directly in 3D space, a misaligned camera lens or poor calibration could be absorbed into the ground-coordinate residual and disappear from view.

Brown moved the comparison to the image plane in his 1958 report. He matched the projected location of a 3D point to the actual image observation in pixel units. Calibration error, lens distortion, and extrinsic-parameter error then surface together in one residual. The formulation is also cleaner statistically. Camera image noise can be modeled as an isotropic Gaussian in pixel units, and under that model reprojection-error minimization becomes maximum-likelihood estimation.

Triggs et al. (1999) standardized that formulation in the language of computer vision textbooks. As of 2026, reprojection-error minimization remains a core optimization problem for visual observations in factor graph-based SLAM backends.

> 🔗 **Borrowed.** The observation model for a visual landmark in SLAM, $z = \pi(K, T, p) + \epsilon$, directly inherits Brown's (1958) reprojection formula. A SLAM backend that minimizes this with Gauss-Newton has the same mathematical structure as a 1958 aerial triangulation solver.

---

## 6. The skeleton of the SLAM backend — through 2026

The acronym "SLAM" came into broad use through 1990s literature that included [Durrant-Whyte and Leonard's 1995 survey](https://ieeexplore.ieee.org/document/476131), but the backend mathematics inherits Brown's 1958 reprojection formulation almost unchanged. Modern systems still show that inheritance. ORB-SLAM3 jointly optimizes SE(3) poses and 3D landmark locations through g2o. LIO-SAM runs the LM algorithm on top of GTSAM's factor graph. DROID-SLAM gets its update direction from GRU-based optical flow, but its final bundle adjustment layer still uses the Schur complement trick.

Lie groups and factor graphs replaced the matrix notation of 1999, and neural networks took over descriptor computation, but the common structure of minimizing observation residuals persists. Visual BA uses reprojection errors from multiple viewpoints to estimate camera poses and the map, while LiDAR systems use sensor-specific constraints such as distance or point-to-plane residuals. Pulfrich's glass plate has become a pixel array, and hand calculation has moved to the GPU. The underlying estimation problem remains the same.

This continuity is both a strength and a weakness. The field can draw on accumulated optimization theory and practical validation. When BA's assumptions (static world, point features, Gaussian noise) fail in real environments, the supporting theory and validation no longer apply without checking those changed conditions.

---

> 📜 **Prediction vs. outcome.** Triggs et al. (1999) named scaling BA to large problems (thousands of cameras, millions of points) as the main challenge. Over the next twenty years, systems reached that scale. In 2006, Snavely's Photo Tourism reconstructed landmarks from hundreds of Internet photographs; in 2016, COLMAP standardized the robust incremental SfM implementation of that line. Later scaling required more than simply enlarging the optimization problem. The result depended on an engineering layer: incremental BA and visibility graph pruning, with vocabulary-tree loop closure on top.

---

## 🧭 Still open

**Global optimum guarantees for nonlinear BA.** The LM algorithm converges to a local minimum. With poor initialization, it converges to the wrong structure. Initialization methods such as the 5-point algorithm, PnP, and epipolar-geometry estimation appeared in turn, but the geometric solvers should be distinguished from the robust estimation procedures around them. RANSAC is used as an outer procedure to reject outliers, and iterative refinement can be applied to the resulting estimates. Convex-relaxation approaches that guarantee a global optimum in large-scale environments remain under study, but they are not yet practical at the speed and scale of real-time SLAM.

**The gap between photogrammetric accuracy and Visual SLAM.** Accuracy in aerial photogrammetry is assessed against the imaging conditions and the requirements of the delivered product. It uses calibrated cameras and high-quality GCPs (ground control points), and the optimization runs offline. Real-time Visual SLAM uses the same formulation under the constraints of GPS-denied environments, low-resolution cameras, and online estimation. Comparing the two fields requires distinguishing image-coordinate errors from ground-coordinate errors and stating the range, resolution, control-point conditions, and components being evaluated.

---

BA's assumptions (static world, point features, Gaussian noise) begin to break when the camera meets a moving object. Surveyors measured bridges, not robot soccer fields. The inheritance passed to computer vision in the form of a single question: which pixels in a moving image should serve as the "corresponding points" that bundle adjustment would later receive?


---

# Ch.2 — The Classical CV Toolbox: Harris to SIFT, and on to ORB

Bundle adjustment requires "corresponding points," the same physical location found independently in two or more images. The surveyor planted targets in the field by hand; computer vision had to hand that role to an algorithm. Feature detection and description began with that handoff.

In the late 1970s, Hans Moravec tried to locate salient points in the environment with a camera on the Stanford Cart project. The work was written up in his 1980 Stanford doctoral thesis, ["Obstacle Avoidance and Navigation in the Real World by a Seeing Robot Rover"](https://frc.ri.cmu.edu/~hpm/project.archive/robot.papers/1975.cart/1980.html.thesis/index.html). Moravec supplied a quantitative criterion for selecting trackable points from intensity changes in neighboring patches. In 1988, Chris Harris and Mike Stephens formalized that intuition in terms of the eigenvalues of the autocorrelation matrix. Lucas and Kanade had laid down the framework for pixel tracking seven years earlier. Lowe absorbed both ideas and built a descriptor invariant to scale and rotation. Rublee produced a faster, patent-free alternative. The SLAM front end runs on this lineage.

---

## 2.1 The idea of a corner: from Moravec to Harris

A point where an image patch changes substantially under a small camera motion is called a "corner." Moravec's (1977) criterion was simple. If the Sum of Squared Differences (SSD) against neighboring pixels is large in every direction (up, down, left, and right), the point counts as a corner.

Harris and Stephens replaced this with continuous differentiation at the 1988 Alvey Vision Conference in ["A Combined Corner and Edge Detector"](https://www.bmva.org/bmvc/1988/avc-88-023.html). For image $I$, shifting a window $W$ around point $(x,y)$ by $(\Delta x, \Delta y)$ and approximating the intensity change gives:

$$M = \sum_{(x,y) \in W} \begin{pmatrix} I_x^2 & I_x I_y \\ I_x I_y & I_y^2 \end{pmatrix}$$

The two eigenvalues $\lambda_1, \lambda_2$ of $M$ classify the point: two large eigenvalues indicate a corner, one large eigenvalue indicates an edge, and two small eigenvalues indicate a flat region. Harris avoided the eigenvalue decomposition altogether by using the score $R = \det(M) - k \cdot \text{tr}(M)^2$. $k$ is typically 0.04–0.06.

> 🔗 **Borrowed.** Harris's (1988) autocorrelation-matrix idea refined Moravec's (1977) SSD-based corner search through continuous differentiation. The prototype of the concept was in the Stanford Cart report.

In 1994, Jianbo Shi and Carlo Tomasi showed in ["Good Features to Track"](https://cecas.clemson.edu/~stb/klt/shi-tomasi-good-features-cvpr1994.pdf) (CVPR 1994) that using $\min(\lambda_1, \lambda_2)$ directly, in place of the Harris score, is more stable for optical-flow tracking. This criterion is the Shi-Tomasi corner detector. Thirty years later, OpenCV still exposes it under the same `goodFeaturesToTrack` function name.

---

## 2.2 The archetype of tracking: Lucas-Kanade and KLT

Harris's matrix $M$ finds the point. Finding the same point again in the next frame is a separate problem. Bruce Lucas and Takeo Kanade, in the 1981 paper ["An Iterative Image Registration Technique"](https://www.ijcai.org/Proceedings/81-2/Papers/017.pdf), formulated inter-frame pixel motion as a minimization problem under the brightness constancy assumption.

The brightness-constancy assumption states that the intensity of pixel $(x,y)$ is the same before and after the motion.

$$I(x, y, t) = I(x + u, y + v, t + 1)$$

A Taylor expansion followed by linearization gives:

$$I_x u + I_y v + I_t = 0$$

One equation, two unknowns. Lucas-Kanade adds the assumption that pixels inside a $3\times3$ or $5\times5$ window move with the same $(u,v)$, producing an overdetermined system solved by least squares.

$$\begin{pmatrix} \sum I_x^2 & \sum I_x I_y \\ \sum I_x I_y & \sum I_y^2 \end{pmatrix} \begin{pmatrix} u \\ v \end{pmatrix} = -\begin{pmatrix} \sum I_x I_t \\ \sum I_y I_t \end{pmatrix}$$

The matrix on the left is the same structure matrix $M$ as Harris's. Corner detection and optical flow rest on the same mathematics.

Tomasi and Kanade, in the 1991 tech report ["Detection and Tracking of Point Features"](https://cecas.clemson.edu/~stb/klt/tomasi-kanade-techreport-1991.pdf), gave a concrete implementation that selects tracking-window quality by the eigenvalue criterion and refines displacement through Newton-Raphson iteration. Bouguet (Intel, 2000) later added an image-pyramid-based coarse-to-fine strategy so the tracker would converge under large motion, and this combination became the KLT (Kanade-Lucas-Tomasi) tracker. Real-time VIO systems such as [VINS-Mono](https://arxiv.org/abs/1708.03852) (2018) still run a front end descended from this work. A least-squares tracker from 1981 runs inside the VIO of a smartphone-class drone more than forty years later.

> 🔗 **Borrowed.** Lucas-Kanade (1981) → KLT tracker → Qin et al.'s VINS-Mono (2018): optical flow proposed 37 years earlier survives unchanged as the feature-tracking backbone of real-time VIO.

---

## 2.3 SIFT — invariance and the patent

KLT fits the case of a single camera moving a little at a time. Connecting the same point across images taken by different cameras, on different days, is a different problem altogether. A change in viewpoint alters the patch's shape, size, and orientation for the same point, and a plain pixel comparison no longer works. That is why a **descriptor** is needed.

David Lowe (UBC) presented the idea at ICCV 1999. The talk was titled "Object Recognition from Local Scale-Invariant Features," and the demo compared 128-dimensional vectors to match the same object across different photographs. Five years later, Lowe published the full account, ["Distinctive Image Features from Scale-Invariant Keypoints"](https://www.cs.ubc.ca/~lowe/papers/ijcv04.pdf), in IJCV. It is the paper now cited as SIFT. SIFT (Scale-Invariant Feature Transform) runs in two stages.

**Detection stage.** Compute DoG (Difference of Gaussians) at several scales and select local extrema as keypoints. DoG is an approximation of the Laplacian of Gaussian. Let $L(x,y,\sigma) = G(x,y,\sigma) * I(x,y)$ denote the Gaussian-smoothed image:

$$D(x, y, \sigma) = L(x, y, k\sigma) - L(x, y, \sigma)$$

Here $k$ is the ratio between adjacent scales (typically $2^{1/s}$, where $s$ is the number of scales per octave). Searching for extrema across multiple octaves allows the same point to be detected under a change of scale.

**Descriptor stage.** A $16\times16$ window around the keypoint is divided into $4\times4$ blocks, and the 8-bin gradient-orientation histogram in each block is concatenated into a 128-dimensional vector. Rotating the patch into the keypoint's dominant gradient direction also provides rotation invariance.

The result was a 128-dimensional descriptor robust to scale, rotation, and partial affine deformation. Before KITTI and standardized SLAM benchmarks, that robustness made SIFT useful for matching images across changes in scale and viewpoint.

Lowe filed a patent on SIFT in March 2000, and it was granted in March 2004 (US6711293B1, with priority from March 1999). The patent imposed licensing fees for commercial use, and until it expired in March 2020 it was one of the motivations for efforts to replace SIFT.

> 📜 **Prediction vs. outcome.** In "9 Conclusions" of the 2004 SIFT paper, Lowe listed the descriptor's possible extensions as "view matching for 3D reconstruction, motion tracking and segmentation, robot localization, image panorama assembly, epipolar calibration." Most of those predictions proved accurate: SfM, SLAM, panoramas, and early vision-based robot localization leaned on SIFT in the late 2000s. SIFT's position in long-term correspondence weakened after CNNs arrived. Following AlexNet in 2012, object-recognition work shifted to CNNs, and learned descriptors such as SuperPoint and R2D2 gradually took over the local-descriptor role in SLAM. The application domains were predicted correctly; the descriptor technology changed.

---

## 2.4 SURF — a speed–accuracy compromise

SIFT's 128-dimensional descriptor was accurate but slow, taking hundreds of milliseconds per image on the desktop CPUs of the time. It was not usable for real-time SLAM. Herbert Bay (ETH Zürich) presented ["SURF: Speeded-Up Robust Features"](https://people.ee.ethz.ch/~surf/eccv06.pdf) at ECCV 2006. The method relied on two ideas.

SURF detects keypoints with the *determinant of the Hessian matrix* instead of DoG. It approximates the second Gaussian derivatives with box filters on an integral image to speed up computation. The descriptor is 64-dimensional, half of SIFT's. The neighborhood of the keypoint is split into $4\times4$ subregions, and in each subregion four values from Haar wavelet responses $d_x, d_y$, $(\sum d_x,\, \sum d_y,\, \sum|d_x|,\, \sum|d_y|)$, are concatenated into a $4\times4\times4=64$-dimensional vector. A 128-dimensional extension (SURF-128) exists, but the default is 64-dimensional.

SURF was 3–7 times faster than SIFT. But accuracy comparisons depended on the detectors, descriptor designs, and evaluation conditions as well as dimensionality, and Bay could not avoid a patent either (ETH Zürich patent). SIFT lost ground on speed; SURF lost ground on both accuracy and patent restrictions. ORB addressed both problems at once.

> 🔗 **Borrowed.** Lowe's (1999/2004) DoG scale-space → Bay's (2006) Hessian integral image: two answers for achieving scale invariance. DoG is theoretically elegant; the Hessian approximation is engineered to be fast.

---

## 2.5 ORB — binary descriptor and release from the patent

In 2011, Ethan Rublee (Willow Garage), Vincent Rabaud, Kurt Konolige, and Gary Bradski presented ["ORB: An Efficient Alternative to SIFT or SURF"](https://www.gwylab.com/download/ORB_2012.pdf) at ICCV. Willow Garage was also the birthplace of ROS, and the title reflected the goal: a feature that robotics researchers could use in practice.

ORB combines and improves two existing techniques.

**Detection.** [FAST](https://www.edwardrosten.com/work/rosten_2006_machine.pdf) (Features from Accelerated Segment Test, Rosten & Drummond 2006) tests a 16-pixel circle around a candidate and declares it a corner if a contiguous arc is sufficiently brighter or darker. It is more than 10 times faster than SIFT's DoG. ORB adds a Harris score on top of FAST and keeps only the strong responses.

**Descriptor.** [BRIEF](https://www.cs.ubc.ca/~lowe/525/papers/calonder_eccv10.pdf) (Binary Robust Independent Elementary Features, Calonder et al. 2010) compares the intensities of randomly chosen point pairs in the patch around a keypoint to produce a 256-bit string by default. Matching uses Hamming distance instead of Euclidean distance, so the distance is computed by XOR followed by a population count of the differing bits.

BRIEF's weak point was the lack of rotation invariance. Rublee built **rBRIEF (rotated BRIEF)** by rotating the patch to align with the FAST corner's intensity centroid. This supplied the missing orientation invariance.

$$\theta = \text{atan2}(m_{01},\, m_{10}), \quad m_{pq} = \sum_{x,y} x^p y^q I(x,y)$$

ORB ran 100 times faster than SIFT, carried no patent restriction, and entered OpenCV immediately. [ORB-SLAM](https://arxiv.org/abs/1502.00956) (Mur-Artal et al. 2015), as the name indicates, was built on ORB, and the line continued through the trilogy. ORB-SLAM3 still used the same front end in 2021.

> 🔗 **Borrowed.** Calonder et al.'s (2010) BRIEF → Rublee et al.'s (2011) ORB: adding intensity-centroid-based orientation estimation to a binary descriptor secured rotation invariance.

---

## 2.6 Learned descriptors

If ORB is the practical peak, the next question follows: are learned features better than hand-designed ones? Yi et al.'s 2016 [LIFT](https://arxiv.org/abs/1603.09114) (Learned Invariant Feature Transform, ECCV 2016) tried to replace the three stages of detection, orientation estimation, and description with CNNs. It connected three separately trained networks in a pipeline.

In 2018, DeTone et al.'s [SuperPoint](https://arxiv.org/abs/1712.07629) (CVPRW 2018) trained keypoint detection and a 256-dimensional descriptor jointly under a self-supervised scheme called homographic adaptation. It was pretrained on synthetic data and adapted to real images, and later became one of the learned local features widely tested in SLAM research.

Even so, traditional descriptors have not disappeared as of 2026. ORB is faster than SuperPoint on embedded devices, and its behavior is more predictable than that of learned descriptors, which can generalize unpredictably on out-of-domain images. DINOv2-based features have entered place recognition through systems such as [AnyLoc](https://arxiv.org/abs/2308.00688) (Keetha et al. 2023), but ORB-SLAM3 has used ORB since its 2021 release. Moravec's 1977 intuition still runs on robots in the 2020s.

---

## 2.7 🧭 Still open

**Generalization limits of learned descriptors.** SuperPoint, R2D2, DISK, and others outperform classical methods inside the training domain, but behave inconsistently in new environments (underwater, thermal, low-light). There is no consensus on which family is more reliable. The question remains open in 2026.

**Failure modes of wide-baseline matching.** Harris- or ORB-based matching can degrade under large viewpoint changes; the extent depends on the scene, rotation axis, and matching conditions. Affine-covariant detectors (ASIFT, MSER) patched part of the gap, but there is no complete solution. [DUSt3R](https://arxiv.org/abs/2312.14132) (Wang et al. 2023) opened a path by bypassing matching itself, though it is still too early to judge whether this is the end of the descriptor problem or a detour around it.

---

Harris's intuition and Lowe's invariance supplied the foundation, and Rublee's speed optimization made it practical. Together they formed a usable toolbox. Each technique was designed to operate on one or two images. Connecting dozens or hundreds of images simultaneously and with geometric consistency required another layer.

# Ch.3 — Structure from Motion: From Longuet-Higgins to COLMAP

While Harris and Lowe were refining how to detect salient points in one image, a different lineage asked what could be recovered when those points appeared in two images. Feature *detection* and spatial *reconstruction* developed side by side over the same period; only in the mid-2000s did they merge into one pipeline.

In 1981, H.C. Longuet-Higgins at the University of Sussex published a three-page paper in *Nature*, "[A Computer Algorithm for Reconstructing a Scene from Two Projections](https://cseweb.ucsd.edu/classes/fa01/cse291/hclh/SceneReconstruction.pdf)." He presented a linear algorithm for recovering camera motion and scene structure from eight corresponding point pairs in two photographs. His affiliation was the Laboratory of Experimental Psychology. Photogrammetry and motion-perception research preceded this paper, so it did not mark the beginning of all Structure from Motion (SfM), but it was an influential turning point in modern two-view geometry. Self-calibration, incremental SfM, Bundler, and large-scale reconstruction from internet photographs followed; Johannes Schönberger's COLMAP assembled that accumulated work into a robust general-purpose open-source pipeline in 2016.

---

## 3.1 Essential Matrix and the 8-point Algorithm

Longuet-Higgins began with a simple constraint. When two cameras capture the same point, an algebraic relation holds between the two image coordinates. Once the coordinate system is normalized, the relation can be written as a single matrix. He defined it as the **essential matrix** $\mathbf{E}$.

Let the two camera centers be $\mathbf{O}_1$ and $\mathbf{O}_2$, and let the corresponding points in normalized coordinates be $\mathbf{x}_1$ and $\mathbf{x}_2$. The constraint is:

$$\mathbf{x}_2^\top \mathbf{E} \mathbf{x}_1 = 0$$

$\mathbf{E}$ factors through the rotation $\mathbf{R}$ and translation $\mathbf{t}$ between the cameras as $\mathbf{E} = [\mathbf{t}]_\times \mathbf{R}$, where $[\mathbf{t}]_\times$ is the skew-symmetric matrix of $\mathbf{t}$.

Once scale ambiguity is removed, the essential matrix has five degrees of freedom. Before the nonlinear 5-point algorithm ([Nistér 2004](http://www.cad.zju.edu.cn/home/gfzhang/training/SFM/2004-PAMI-David%20Nister-An%20Efficient%20Solution%20to%20the%20Five-Point%20Relative%20Pose%20Problem.pdf)) solved it with five correspondences, the standard approach fixed one of the nine matrix entries as unit scale, treated the remaining eight as unknowns, and solved a linear system from eight correspondences. The rank-2 and unit-scale constraints were then enforced. This is the **8-point algorithm**. Longuet-Higgins himself gave a procedure that produced a unique solution from exactly eight points. The implementation was simple and computationally inexpensive.

Numerical stability was the problem. When image coordinates run into the hundreds or thousands of pixels, the entries of the coefficient matrix span sharply different scales, and the SVD becomes unstable.

> 🔗 **Borrowed.** Hartley's 1997 normalized 8-point algorithm ([In Defense of the Eight-Point Algorithm](https://www.cse.unr.edu/~bebis/CS485/Handouts/hartley.pdf)) applied a linear transform to image coordinates so that their mean was zero and their average distance was $\sqrt{2}$, and then estimated the fundamental matrix before transforming it back to the original coordinates. This serves a different purpose from normalizing coordinates with camera intrinsics. The geometry of Longuet-Higgins was left untouched; only the numerical conditioning was fixed. The normalization was widely adopted in later multiple-view-geometry texts and implementations.

The fundamental matrix $\mathbf{F}$ generalizes the essential matrix. Even without knowing the camera intrinsics $\mathbf{K}$, the relation $\mathbf{x}_2^\top \mathbf{F} \mathbf{x}_1 = 0$ holds. With intrinsics $\mathbf{K}_1$, $\mathbf{K}_2$ for the two cameras, the relationship is $\mathbf{F} = \mathbf{K}_2^{-\top} \mathbf{E} \mathbf{K}_1^{-1}$. For images from the same camera ($\mathbf{K}_1 = \mathbf{K}_2 = \mathbf{K}$) it simplifies to $\mathbf{F} = \mathbf{K}^{-\top} \mathbf{E} \mathbf{K}^{-1}$. In an SfM pipeline, when $\mathbf{K}$ is unknown $\mathbf{F}$ is estimated first; when $\mathbf{K}$ is known, $\mathbf{E}$ is solved directly.

---

## 3.2 Tomasi-Kanade Factorization

For ten years after 1981, SfM was studied mostly as the geometry between two photographs. Processing many photographs at once was a separate problem. Carlo Tomasi and Takeo Kanade at CMU provided one answer in 1992 with the **[factorization method](https://people.eecs.berkeley.edu/~yang/courses/cs294-6/papers/TomasiC_Shape%20and%20motion%20from%20image%20streams%20under%20orthography.pdf)**.

Given $F$ frames observing $P$ points, the image coordinates stack into a $2F \times P$ matrix $\mathbf{W}$. After subtracting each frame's point centroid to remove translation, $\mathbf{W}$ has rank at most three under an orthographic (scaled orthographic) camera model. The original paper (Tomasi & Kanade 1992) started from this assumption. Then:

$$\mathbf{W} = \mathbf{M} \mathbf{S}$$

where $\mathbf{M}$ is a $2F \times 3$ motion matrix and $\mathbf{S}$ is a $3 \times P$ structure matrix. Keeping only the top three singular values of $\mathbf{W}$ through SVD gives a rank-3 factorization. Because $\mathbf{M}\mathbf{A}$ and $\mathbf{A}^{-1}\mathbf{S}$ produce the same $\mathbf{W}$, a metric-upgrade step then determines the invertible matrix $\mathbf{A}$ from orthogonality and equal-norm constraints on the camera rows.

The procedure estimated every frame's motion and every point's 3D position through one low-rank SVD followed by the metric upgrade. Its cost is dominated by the SVD of a $2F \times P$ matrix, and its structure is simpler to implement than iterative nonlinear bundle adjustment.

> 🔗 **Borrowed.** Later literature places Nistér, Naroditsky, and Bergen's 2004 CVPR paper "Visual Odometry" at the point where real-time ego-motion estimation became an applied branch of this lineage. Instead of using Tomasi-Kanade's batch factorization directly, the work solved relative pose between frames inside a short window, trading batch accuracy for lower latency.

The limitation was the orthographic/affine assumption. An affine camera ignores perspective distortion. The model holds only when depth variation in the scene is small relative to the distance from the camera, as with small, distant objects. Error grew for close scenes, wide-angle lenses, and scenes with large foreground–background depth differences. From the late 1990s, researchers pursued perspective-camera extensions from several directions, leading back to bundle adjustment.

---

## 3.3 Hartley & Zisserman and the canonization

Tomasi-Kanade's factorization framed the multiple-view problem. The remaining tasks were to extend it to perspective cameras and unify the scattered mathematics in one language.

In 2000, Richard Hartley and Andrew Zisserman's 680-page textbook *[Multiple View Geometry in Computer Vision](https://www.robots.ox.ac.uk/~vgg/hzbook/)* appeared. It consolidated the SfM mathematics scattered from 1981 through the 1990s into the language of projective geometry.

Hartley & Zisserman did more than compile earlier results. They brought the essential matrix, fundamental matrix, homography, camera calibration, and bundle adjustment into one projective-geometry framework. Their treatment showed within one text that concepts developed separately shared the same foundation.

Bundle adjustment received particular attention. Hartley & Zisserman placed the reprojection-error minimization problem reviewed in Ch.1 through the synthesis by Triggs et al. (1999) inside the projective-geometry framework and included an explicit *robust cost function* $\rho$. Huber or Cauchy losses downweighted outliers that would otherwise break optimization on real data. The solver was Levenberg-Marquardt, and the sparsity of the Jacobian reduced computation.

Most SLAM and visual odometry (VO) papers in the early 2000s cited this textbook as their standard reference. With the definitions unified in one source, large-scale applications such as Photo Tourism could focus on implementation rather than redefining the basics.

---

## 3.4 Photo Tourism and Bundler — Internet-scale SfM

In 2006, Noah Snavely, Steven Seitz, and Richard Szeliski published the SIGGRAPH paper "[Photo Tourism](https://doi.org/10.1145/1179352.1141964)." They gathered photographs of tourist sites uploaded to the internet (the Florence Duomo, the Trevi Fountain in Rome) and reconstructed them in 3D.

The data were uncontrolled. Cameras, weather, and composition varied, and some images were unrelated indoor shots. This was not a systematically captured dataset but thousands of images uploaded in no particular order by thousands of people.

Snavely's pipeline first used SIFT detection and matching to find correspondences between image pairs. RANSAC with the fundamental matrix removed geometrically inconsistent matches. Incremental SfM started from highly connected image pairs and added cameras one at a time. After each addition, bundle adjustment reoptimized the full set of poses and points.

The datasets reported in the paper included the Notre Dame Cathedral (597 registered out of 2,635 candidates), the Trevi Fountain in Rome (360 out of 466), Yosemite Half Dome (325 out of 1,882), the Great Wall (82 out of 120), and Trafalgar Square (278 out of 1,893), with an average reprojection error of about 1.5 pixels on 1,611×1,128 images. The work became a turning point in assembling hundreds of uncontrolled internet photographs into consistent reconstructions.

Bundler implemented this pipeline. Snavely released it as open source, and it became the default starting point for SfM researchers.

## 3.5 COLMAP — engineering maturity

> 📜 **Prediction vs. outcome.** The "Discussion and future work" section of Snavely et al. 2006 states, "Ultimately, we wish to scale up our reconstruction algorithm to handle millions of photographs," and lists better image-registration ordering, lens-distortion modeling, repeated-structure handling, and disconnected-structure reconstruction as remaining problems. COLMAP (Schönberger 2016) and OpenSfM pursued scale, reaching tens to hundreds of thousands of images. The SLAM lineage addressed real-time and online processing separately through fixed-lag smoothers and loop closure, not through incremental refinement. This was progress toward scale, although the sizes cited here do not establish that the goal of millions of photographs was met.

In 2016, Johannes Schönberger and Jan-Michael Frahm published the CVPR paper "[Structure-from-Motion Revisited](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf)." Despite the modest title, the paper systematically redesigned the pipeline around ten years of improvements since Bundler.

COLMAP differed from Bundler most in three respects.

The first change was the order in which cameras were added. Bundler started from pairs with high connectivity but had no systematic criterion for which pair to extend first. COLMAP automated the choice of initial image pair and camera-registration order using triangulation angle, feature-track length, and visibility score. Reconstruction became substantially more stable.

The second change was the bundle-adjustment cadence. Running a full bundle adjustment after every camera addition is expensive. COLMAP alternated local bundle adjustment (optimizing only the recently added camera together with cameras that shared many points with it) with periodic global bundle adjustment.

The third change was geometric verification. For each pair of matched feature points, COLMAP ran RANSAC with two models in parallel: the fundamental matrix and homography. The fundamental matrix covered general non-planar scenes; the homography covered planar scenes or pure rotation. COLMAP compared the two models' inlier counts to classify the scene and filtered out matches that fit neither. It was more robust than Bundler to poor matches and planar degeneracy.

> 🔗 **Borrowed.** COLMAP's incremental bundle adjustment strategy modularized Snavely's Bundler pipeline and added quality control at each stage. The core mathematics of the algorithm (essential matrix estimation, triangulation, Levenberg-Marquardt) came from the Hartley & Zisserman textbook. COLMAP's contribution was the systematization of engineering judgment rather than new mathematics.

COLMAP became widely used for reasons beyond performance. The codebase was well organized, the documentation was adequate, and CUDA acceleration supported large image collections. After NeRF appeared in 2020, many NeRF training codebases took COLMAP's output (camera poses + sparse point cloud) as input, and the reference 3D Gaussian Splatting implementation used the same preprocessing. COLMAP became a common front end for 3D reconstruction research.

---

## 3.6 The split between SfM and SLAM

SfM and SLAM use the same mathematics yet solve different problems. The distinction came into sharp relief in the early 2000s.

SfM is *offline*. All images are gathered before processing, so there is no time constraint, and global bundle adjustment can be run multiple times with full access to the whole dataset. If a camera pose is wrong, the system can go back and recompute it.

SLAM is *online*. Sensor data streams in real time, and the robot's current position must be available immediately. The system cannot retain and revisit past data indefinitely, computation grows with the map, and accumulated drift must be corrected when the robot returns to a previously visited place.

The fields differ in the constraints of online processing. SLAM must detect revisits during motion and correct accumulated drift, potentially across many poses connected by the loop. SfM and SLAM share tools such as bundle adjustment and image retrieval, but differ in when and which states must be updated.

Uncertainty propagation differed as well. SLAM tracks the uncertainty of the current pose in real time and updates it with each new observation. A probabilistic representation in the form of EKF or factor graph is needed. In SfM, covariance can be computed after optimization finishes, and real-time tracking is not required.

Davison's [MonoSLAM (2003)](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf) called itself "real-time SfM." But its structure, which kept camera pose and landmarks together in an EKF state vector, differed from SfM's global batch optimization. Over the 2000s, the two fields split into independent lineages, each with its own problem setting.

---

## 3.7 🧭 Still open

**SfM with dynamic objects.** Mainstream general-purpose SfM pipelines, including COLMAP, assume a static world. Bundle adjustment is solved on the premise that scene points are stationary, so contaminated matches distort optimization around cars or pedestrians. RANSAC filters some of them, while Dynamic SfM research models segmentation or per-object motion. Among these public implementations, none has settled into a general-purpose tool with COLMAP's scope.

**The blurring boundary between SfM and SLAM.** In 2023, [DUSt3R](https://arxiv.org/abs/2312.14132) (Wang et al.) took two images into a single pretrained network and produced a dense point map and camera poses at once. It needed no feature matching, RANSAC, or bundle-adjustment initialization. Extended as [MASt3R](https://arxiv.org/abs/2406.09756) (2024), it handled tens of images. Modules of the traditional SfM pipeline are now being replaced one at a time. COLMAP became the front end for NeRF and 3DGS; the DUSt3R line is trying to replace that front end. Whether it will displace COLMAP or prevail only in specific domains remains unknown.

---

While SfM refined precise offline reconstruction, another question grew urgent in robotics. A moving robot had to estimate its pose immediately from images that had not yet been gathered. Under that pressure, the question Randall Smith and Peter Cheeseman [posed in 1986](https://people.csail.mit.edu/brooks/idocs/Smith_Cheeseman.pdf), how to propagate uncertain spatial relations, grew into a separate field called SLAM.
