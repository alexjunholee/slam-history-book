# Ch.10 — The Parallel Line of Place Recognition: From FAB-MAP to NetVLAD, and on to AnyLoc

Around 2003, while Davison was demonstrating real-time 3D tracking with a single webcam, Mark Cummins and Paul Newman at the Oxford Mobile Robotics Group were asking a different question: "How does a robot recognize a place it has visited before?" Because visual odometry (VO) accumulated drift, no SLAM system could close a loop without answering it. Place recognition developed through the 2000s alongside other components of Visual SLAM but followed its own lineage. FAB-MAP adapted Josef Sivic's bag-of-words (BoW) approach to robotics, DBoW2 made it practical, and NetVLAD introduced learning. In 2023, AnyLoc used foundation-model features without fine-tuning.

The ORB-SLAM, DSO, and KinectFusion lineages developed different approaches to tracking and mapping, but each required loop closure. Place recognition supplied the decision behind it: where has the system seen this scene before?

---

## 10.1 Place recognition before BoW

To close a loop without GPS, whether indoors, in a tunnel, or in an urban canyon, a robot must quickly find among thousands of candidates the image most similar to its current observation. Pixel-level comparison requires a linear scan, O(N), and becomes impractical in real time once the collection reaches tens of thousands of images.

Sivic and Zisserman were among the first computer vision researchers to address this problem in the early 2000s. Their ICCV 2003 paper ["Video Google"](https://www.robots.ox.ac.uk/~vgg/publications/2003/Sivic03/sivic03.pdf) applied TF-IDF from document retrieval to images. They clustered SIFT descriptors with k-means to form "visual words" and represented each image as a frequency vector over those words. An inverted index avoided scanning the full image collection by retrieving only the posting lists for visual words in the query, and place-recognition researchers quickly adopted the idea.

---

## 10.2 FAB-MAP — probabilistic BoW and the Chow-Liu tree (2008)

Mark Cummins and Paul Newman, at the Oxford Mobile Robotics Group, published [Cummins & Newman. FAB-MAP: Probabilistic Localization and Mapping in the Space of Appearance](https://doi.org/10.1177/0278364908090961) in 2008.

FAB-MAP (**Fast Appearance-Based Mapping**) asks whether a scene corresponds to a place already in the database or to an entirely new location. A simple similarity score cannot resolve this distinction: if dozens of corridors look alike, the highest score does not guarantee a correct match.

Cummins and Newman framed this as a Bayesian inference problem. Given an observation $z_t$ (the set of visual-word occurrences), they computed the probability that the current location is each database place $\ell_i$:

$$P(\ell_i \mid z_t) \propto P(z_t \mid \ell_i) P(\ell_i)$$

The hard part is $P(z_t \mid \ell_i)$. Assuming visual words are independent gives a naïve Bayes model, but in practice visual words are correlated. If the word "door" appears, the word "doorknob" tends to appear along with it. The independence assumption distorts the probability.

FAB-MAP modeled this correlation with a **Chow-Liu tree**. A Chow-Liu tree is a tree-structured graphical model that maximizes pairwise mutual information among words. The mutual information between two words $e_i, e_j$ is defined as

$$I(e_i; e_j) = \sum_{e_i, e_j} P(e_i, e_j) \log \frac{P(e_i, e_j)}{P(e_i)P(e_j)}$$

and the Chow-Liu algorithm uses this as an edge weight to build a maximum spanning tree. Factorizing the joint likelihood through this tree gives

$$P(z_t \mid \ell_i) = \prod_k P(z_t^k \mid z_t^{\text{pa}(k)}, \ell_i)$$

where $z_t^k \in \{0,1\}$ indicates the occurrence of the $k$-th word and $\text{pa}(k)$ is its parent in the tree. Unlike naïve Bayes, this factorization captures co-occurrence patterns across words and lowers false positives in visually similar places such as corridors. During training, the vocabulary and the tree are learned together from a large image set.

FAB-MAP also explicitly modeled the possibility that the current location was absent from the database. Adding this "new place" hypothesis reduced false positives, which can cause catastrophic failure in loop closure.

> 🔗 **Borrowed.** FAB-MAP's visual-word approach was transplanted directly from Sivic & Zisserman's "Video Google" (2003). The inverted-index logic of document retrieval was applied to a robot's memory of places.

In 2011, Cummins and Newman published [FAB-MAP 2.0](https://www.robots.ox.ac.uk/~mjc/Papers/cummins_newman_ijrr_fabmap2_2010_preprint.pdf). They sought to extend the processable map scale to around 1,000 km and demonstrated the system on a city-scale dataset.

---

## 10.3 DBoW2 — binary descriptors and the vocabulary tree (2012)

FAB-MAP used floating-point descriptors such as SIFT. Around 2012, the SLAM community was moving toward faster binary descriptors, particularly BRIEF, ORB, and BRISK. Retaining a SIFT vocabulary imposed a substantial computational cost.

In 2012, Dorian Gálvez-López and Juan D. Tardós of Universidad de Zaragoza published [Gálvez-López & Tardós. Bags of Binary Words for Fast Place Recognition in Image Sequences](https://doi.org/10.1109/TRO.2012.2197158). **DBoW2** uses a vocabulary tree of binary descriptors. Hamming-distance comparisons made word assignment tens of times faster than with SIFT.

DBoW2's structure is a vocabulary tree built by hierarchical k-means. The BoW vector representing an image is a TF-IDF–weighted binary-word frequency vector. Each leaf node $w_i$ of a tree with branching factor $k$ and depth $d$ carries the TF-IDF weight

$$\eta_i = \frac{n_i}{n} \cdot \log \frac{N}{N_i}$$

where $n_i$ is the word count of $w_i$ in the image, $n$ is the total word count, $N$ is the number of database images, and $N_i$ is the number of images containing $w_i$. The similarity between two images $a$, $b$ is given by the L1-norm

$$s(\mathbf{v}_a, \mathbf{v}_b) = 1 - \frac{1}{2} \left\| \frac{\mathbf{v}_a}{|\mathbf{v}_a|} - \frac{\mathbf{v}_b}{|\mathbf{v}_b|} \right\|_1$$

Lookup runs in O(log N) through an inverted index.

> 🔗 **Borrowed.** DBoW2's vocabulary-tree concept traces its lineage to Nistér & Stewénius's 2006 ["Scalable Recognition with a Vocabulary Tree"](https://people.eecs.berkeley.edu/~yang/courses/cs294-6/papers/nister_stewenius_cvpr2006.pdf) (CVPR). DBoW2 transplanted that structure into the binary-descriptor world and tuned the weighting scheme for SLAM.

DBoW2's influence came as much from deployment as from its algorithm. Released as an open-source library, it became the loop-closure module in ORB-SLAM (2015), ORB-SLAM2, and ORB-SLAM3. From 2015 through the mid-2020s, it served as the standard place-recognition component in the ORB-SLAM family and many systems built on it.

The Gálvez-López–Tardós collaboration also connected directly to later SLAM systems. Tardós subsequently led the ORB-SLAM trilogy with Mur-Artal and Campos, and DBoW2 supplied its place-recognition layer.

---

## 10.4 NetVLAD — CNN-based VPR (2016)

The BoW family had a fundamental limitation: its vocabulary was trained for a specific descriptor and environment. Large changes in lighting, season, or viewpoint shifted the distribution of visual words and could make a pretrained vocabulary fail.

At CVPR 2016, Relja Arandjelović, Petr Gronat, Akihiko Torii, Tomáš Pajdla, and Josef Sivic published [NetVLAD: CNN Architecture for Weakly Supervised Place Recognition](https://doi.org/10.1109/CVPR.2016.572). Sivic had co-authored "Video Google" in 2003, introducing BoW to image retrieval. Thirteen years later, he co-authored a method designed to move beyond its limitations.

NetVLAD made **VLAD (Vector of Locally Aggregated Descriptors)** aggregation differentiable.

VLAD is an aggregation scheme proposed in 2010 by [Jégou et al.](https://inria.hal.science/inria-00548637/file/jegou_compactimagerepresentation.pdf). It represents an entire image by accumulating the residual between each local descriptor and its nearest cluster center, or visual word. The VLAD sub-vector for cluster center $k$ is

$$\mathbf{V}(k) = \sum_{\mathbf{x}_i : \text{NN}(\mathbf{x}_i)=k} (\mathbf{x}_i - \boldsymbol{\mu}_k)$$

and the full VLAD vector $\mathbf{V} = [\mathbf{V}(1)^\top, \ldots, \mathbf{V}(K)^\top]^\top$ is the concatenation across all clusters, L2-normalized. With $K$ clusters and $D$-dimensional descriptors, the final vector is $KD$-dimensional. The VLAD vector carries much richer information than BoW's binary assignment.

> 🔗 **Borrowed.** NetVLAD's aggregation design directly inherits VLAD from Jégou et al.'s "Aggregating Local Descriptors into a Compact Image Representation" (CVPR 2010). NetVLAD replaced VLAD's hard assignment with a soft assignment and made the full pipeline trainable end to end.

The NetVLAD layer softens the nearest-neighbor assignment of classical VLAD into a softmax:

$$\bar{a}_k(\mathbf{x}_i) = \frac{e^{\mathbf{w}_k^\top \mathbf{x}_i + b_k}}{\sum_{k'} e^{\mathbf{w}_{k'}^\top \mathbf{x}_i + b_{k'}}}$$

Here $\mathbf{x}_i$ is a local feature extracted by the CNN, and $\mathbf{w}_k$ and $b_k$ are learnable parameters. Accumulating the NetVLAD vector with this soft assignment gives

$$\mathbf{V}(k) = \sum_i \bar{a}_k(\mathbf{x}_i)\,(\mathbf{x}_i - \boldsymbol{\mu}_k)$$

After intra-normalization (L2 on each sub-vector) and a final L2 normalization, the full vector $\mathbf{V} = [\mathbf{V}(1)^\top, \ldots, \mathbf{V}(K)^\top]^\top$ becomes the VPR descriptor. Unlike hard-assignment VLAD, the soft assignment permits gradients to propagate through the layer, so the CNN backbone can be trained end to end.

The training procedure also differed from earlier methods. Using Google Street View Time Machine data, the authors treated images of the same place at different times as positive pairs and images of different places as negatives under a weakly supervised triplet loss. GPS positions provided the supervision without manual labels.

On the Pittsburgh 250k and Tokyo 24/7 benchmarks, NetVLAD substantially outperformed the DBoW family and earlier VLAD-based methods. It was more robust to lighting and seasonal changes and tolerated some viewpoint differences. NetVLAD was not immediately integrated into practical SLAM pipelines, however, because its inference and memory costs exceeded those of DBoW2 and the ORB-SLAM ecosystem was already built around DBoW2.

---

## 10.5 Patch-NetVLAD, MixVPR, AnyLoc (2020–2023)

After NetVLAD, Visual Place Recognition (VPR) research increasingly focused on generalization.

In 2021, Hausler et al. introduced [Patch-NetVLAD](https://arxiv.org/abs/2103.01486). Rather than representing a place with a single global descriptor, it divides the image into patches and spatially combines their NetVLAD representations. On Tokyo 24/7, it improved Recall@1 by about 10 percentage points over NetVLAD, at the cost of more expensive inference.

In 2023, Ali-bey et al.'s [MixVPR](https://arxiv.org/abs/2303.02190) produced global features through Transformer-style feature mixing, seeking a balance between a lightweight design and high performance. VPR papers from this period commonly evaluated on Mapillary Street Level Sequences (MSLS) and seasonal-change datasets such as Nordland. Extreme lighting and seasonal changes remained common obstacles.

In 2023, Keetha et al.'s [AnyLoc: Towards Universal Visual Place Recognition](https://arxiv.org/abs/2308.00688) used self-supervised DINOv2 features for place recognition without fine-tuning.

> 🔗 **Borrowed.** AnyLoc uses pretrained ViT representations from Oquab et al.'s [DINOv2](https://arxiv.org/abs/2304.07193) (Meta AI, 2023) and applies VLAD aggregation to them. This connects the BoW–VLAD lineage that began with FAB-MAP to foundation-model features.

DINOv2 is a Vision Transformer (ViT) trained on large-scale internet imagery. It produces general-purpose features applicable across environments, although this does not eliminate biases in the pretraining data. AnyLoc emphasized DINOv2's **facets**. Each ViT attention head produces query (Q), key (K), and value (V) matrices as well as final patch features. Keetha et al. found experimentally that the value (V) facet provided the most semantically stable representation for place recognition. Q and K facets favored structural and geometric information, whereas the V facet emphasized semantics, supporting consistent place representations across seasonal and lighting changes. By applying VLAD aggregation to the V-facet representation, they produced a single model that operated across diverse indoor, outdoor, underground, and aerial environments. Across seven or more settings, including Pittsburgh, Tokyo, indoor factories, underground parking garages, and libraries, the model matched or surpassed earlier specialized methods.

Research then extended generalization across sensor modalities. Lee et al.'s [(LC)²](https://arxiv.org/abs/2304.08660) (RA-L 2023) projected camera imagery and LiDAR point clouds into a shared 2.5D depth image, enabling a 2D query to retrieve places from a LiDAR map. Datasets such as Lee et al.'s [ViViD++](https://arxiv.org/abs/2204.06183) (RA-L 2022) support cross-modal evaluation by synchronizing visible, thermal, event, LiDAR, inertial, and depth streams across indoor, outdoor, and underground settings.

---

## 10.6 Toward integrating place recognition and metric localization (2024–2025)

Place-recognition research has developed alongside other SLAM components since the early 2000s. ORB-SLAM embedded DBoW2, but kept place recognition as a black box separate from mapping and tracking: an image entered, and a loop-candidate ID emerged.

By 2024–2025, this boundary had begun to blur. Berton et al.'s [EigenPlaces](https://arxiv.org/abs/2308.10832) (2023) and Izquierdo & Civera's [SALAD](https://arxiv.org/abs/2311.15937) (2023 arXiv / CVPR 2024) explored using place-recognition descriptors directly for metric localization. They sought to estimate a 6-DoF pose from the place representation itself, rather than stopping after identifying a previously seen location.

Around 2024, researchers also began combining Gaussian-map representations with place recognition, following the rise of 3DGS (3D Gaussian Splatting) as a map representation.

> 📜 **Prediction vs. outcome.** In their 2011 FAB-MAP 2.0 paper, Cummins and Newman extended the scale of place recognition by demonstrating appearance-only loop closure on a 1,000 km trajectory. Compared with early FAB-MAP experiments on the Oxford campus and parts of the city, this was an increase by a factor in the tens. Later city-scale experiments with DBoW2 and large vocabularies reproduced the scale in practical SLAM. These methods increased the scale that could be handled, while deep learning added tools for reducing sensitivity to seasonal and lighting changes. Generalization across scale and appearance remains dependent on the environment.

> 📜 **Prediction vs. outcome.** In the introduction to the 2016 NetVLAD paper, Arandjelović et al. identified three challenges for place recognition: a CNN architecture, sufficient training data, and an end-to-end training procedure. NetVLAD directly addressed the architecture and training procedure, while VPR research over the next seven years focused on generalization across season, lighting, and viewpoint. In 2023, AnyLoc demonstrated a single multi-environment model using foundation-model features without fine-tuning. This marked a shift from specialized models toward general-purpose ones rather than a complete solution.

---

## 10.7 🧭 Still open

**Extreme seasonal and lighting change.** The Nordland dataset (a Norwegian railway in summer and winter) and Oxford RobotCar dataset (a year of seasonal change) have exposed the same limitation for more than a decade. DINOv2-based methods have narrowed the gap, but one model still does not maintain consistent precision and recall across conditions such as snow-covered winter and dense summer foliage. Place recognition under severe appearance changes remains an open problem as of 2026.

**Integration of place recognition and metric localization.** In most current SLAM pipelines, place recognition only identifies a previously seen location; subsequent descriptor matching or another matching method establishes geometric correspondences, from which a method such as PnP estimates the pose. Methods introduced between 2023 and 2025 attempted to merge both processes into one representation, but whether they meet accuracy and speed requirements depends on the sensors, scenes, and deployment conditions.

*Privacy of recognizable place representations.* Reconstruction attacks can use stored VPR representations to recover original images or 3D structure. This poses a practical concern for commercial robots that map homes, hospitals, and offices. No place-representation scheme yet guarantees privacy without sacrificing performance.

---

By this point, three SLAM lineages had matured. ORB-SLAM standardized the feature-based pipeline, DSO developed the photometric formulation, and KinectFusion and its successors established the capabilities and limits of dense mapping. Place recognition differed because it grew from image retrieval in computer vision rather than from SLAM itself, later supplying the loop-closure component that SLAM required. This separation let place recognition adopt deep-learning methods faster than the rest of the SLAM pipeline.

When AnyLoc appeared in 2023, it cited Sivic's work. He had introduced BoW to image retrieval in 2003 and co-authored NetVLAD in 2016, when learned aggregation moved beyond some of BoW's limitations. AnyLoc extended that lineage by applying foundation-model features to place recognition.

A different challenge came from a graduate student at NYU. His depth-estimation CNN tested whether geometry had to be recovered only through geometric methods.


---

# Ch.11 — The Return of Depth Estimation: From Eigen to Depth Anything

The feature-based, direct, RGB-D, and place-recognition lineages each matured around geometric methods. ORB-SLAM reconstructed the world through epipolar geometry, DSO relied on photometric consistency, KinectFusion aligned surfaces with ICP, and RGB-D fusion pipelines closed loops with geometric features. Learning had little role in these systems. That boundary began to shift with a computer vision paper by a graduate student at NYU rather than with a SLAM paper.

Monocular depth estimation was one of the oldest ill-posed problems in computer vision. In principle, a single image cannot determine depth because projection discards the third dimension. Humans nevertheless infer depth with one eye from perspective, occlusion, texture gradients, and surface shading. In 2014, David Eigen at NYU tested whether a CNN could learn those statistical cues. The experiment began a lineage that would alter the SLAM pipeline ten years later.

---

## 1. Eigen 2014 — early CNN depth

Monocular depth estimation research predated 2014. In 2005, Ashutosh Saxena at Stanford published [Make3D, a system that combined support vector machines (SVMs) with a Markov Random Field (MRF) to predict a depth map from a single image](https://papers.nips.cc/paper/2921-learning-depth-from-single-monocular-images). Make3D predicted coarse, piecewise-planar 3D structure primarily for outdoor scenes and became a representative learned monocular-depth system before CNNs.

[Eigen et al. 2014](https://arxiv.org/abs/1406.2283), by Eigen, Puhrsch, and Fergus, introduced a different approach. Its two-stage CNN used a coarse network to predict global structure and a fine network to refine local detail. Training used roughly 120,000 frames from 464 indoor scenes in NYU Depth v2. The method improved on Make3D by the standards of the time and demonstrated that a network could learn to estimate depth.

One weakness remained: **scale ambiguity**. The network's absolute scale depended on the training distribution and camera setting. A model trained on indoor NYU data could therefore produce incorrect scale on an outdoor scene. The issue remained central to monocular metric depth in 2024.

> 🔗 **Borrowed.** Eigen 2014 inherited the depth-estimation task from Make3D (Saxena 2005). It replaced the SVM and MRF with a CNN while retaining the task definition and evaluation metrics, including RMSE and threshold accuracy.

---

## 2. Garg → Godard — self-supervised depth

The bottleneck in supervised depth learning was data. The Kinect works well indoors, but outdoors, especially in sunlight, the infrared pattern washes out. Building a large-scale outdoor RGB-D dataset is expensive.

In 2016, [Ravi Garg at UCL introduced another approach](https://arxiv.org/abs/1603.04992): using stereo image pairs as the training signal. The system predicts depth from the left image, then uses that depth and the camera baseline to reconstruct the right image. Because the right image is observed, a photometric loss provides supervision without labels.

Clément Godard at UCL developed the idea into **MonoDepth** in [Godard et al. 2017](https://doi.org/10.1109/CVPR.2017.699). Its left-right consistency term imposes a two-way constraint between depths predicted from the left and right images. Adding structural similarity (SSIM) to the photometric loss improved stability in textureless regions. Stereo pairs were required only during training; inference used a single image. Under the paper's contemporary KITTI protocol, it reported lower error than the self-supervised methods listed in its comparison table.

> 🔗 **Borrowed.** Garg and Godard derived their photometric loss from the stereo-matching literature. They repurposed the intensity-consistency constraint from disparity estimation, [as organized by Scharstein and Szeliski (2002)](https://vision.middlebury.edu/stereo/taxonomy-IJCV.pdf), as the training signal for a depth network.

In 2019, Godard's *MonoDepth2* ([Godard et al. 2019, ICCV](https://arxiv.org/abs/1806.01260)) extended self-supervision to monocular video instead of stereo pairs. A depth network and a pose network train jointly: the pose network predicts camera motion between consecutive frames, and the depth estimate warps the previous frame into the current one. Both networks optimize the resulting warping error. **Minimum reprojection loss** selects the source frame with the lowest photometric error, reducing errors in occluded regions. **Auto-masking** excludes pixels that move at the same speed as the camera, including the case of a stationary camera observing stationary objects.

The design still had several limitations. Moving objects and reflective surfaces violated photometric consistency, while the textureless sky provided little signal. Scale also remained ambiguous because video supervision recovers only relative scale between frames.

---

## 3. MiDaS — mixing datasets

[Ranftl et al. 2020](https://doi.org/10.1109/TPAMI.2020.3019967), **MiDaS** (Mixing Datasets for Zero-shot Cross-dataset Transfer), led by René Ranftl at Intel, trained one model on multiple datasets rather than a single dataset.

Depth units and scales differ across these datasets. NYU contains indoor metric depth, KITTI provides outdoor LiDAR points, ReDWeb derives stereo data from movies, and MegaDepth uses SfM reconstructions. Combining them without normalization would give the network inconsistent targets.

Ranftl addressed the mismatch with an **affine-invariant loss**. Before comparison, the method normalizes each image's predicted and ground-truth depth through an affine transformation consisting of scale and shift. It subtracts the median to remove the shift and divides by the mean absolute deviation from that median to remove scale. This scale-and-shift-invariant normalization eliminates unit mismatches across datasets, so the network learns relative depth ordering rather than absolute distance.

The original MiDaS mixed several datasets and demonstrated zero-shot transfer to datasets excluded from training. Later MiDaS releases expanded the training mixture to as many as 12 datasets. The family estimated relative depth across distributions as different as indoor and outdoor imagery, but it did not recover absolute scale.

Ranftl's team separately released [**DPT** (Dense Prediction Transformer)](https://arxiv.org/abs/2103.13413) in 2021, replacing the MiDaS backbone with a ViT-based architecture. DPT became the default backbone from MiDaS v3 onward, followed by a refinement in v3.1 (2022). The change substantially improved performance.

> 🔗 **Borrowed.** DPT in MiDaS v3 used a ViT-based encoder, while the later Depth Anything used an encoder pretrained with DINOv2. Replacing the backbone became a common source of performance gains in the foundation-model era, and DPT (Ranftl 2021) provided an early large-scale demonstration in depth estimation.

---

## 4. Depth Anything — foundation scale

In January 2024, **Depth Anything**, developed by Lihe Yang's team at TikTok Research ([Yang et al. 2024](https://arxiv.org/abs/2401.10891)), approached depth estimation through training-data scale. It used 1.5M labeled images, merged from existing datasets, and 62M unlabeled images. The method generated pseudo-labels for the unlabeled set and included them in training, using semantic-segmentation features as auxiliary supervision to improve their quality.

The model surpassed MiDaS and earlier methods across the major KITTI, NYU, ScanNet, and DIODE benchmarks. Its ViT-L backbone contained 335M parameters. Inference was far from real-time, reflecting the method's emphasis on prediction quality.

[**Depth Anything v2**](https://arxiv.org/abs/2406.09414), released later the same year, trained a teacher on synthetic datasets including Virtual KITTI and Hypersim, then trained student models on real images pseudo-labeled by that teacher. Such data covers surfaces that are difficult to annotate in real imagery, including reflective and transparent materials. Version 2 visibly improved edge detail and thin structures over v1.

Depth Anything still produces relative depth without scale.

[**ZoeDepth** (Shariq Farooq Bhat et al. 2023)](https://arxiv.org/abs/2302.12288) combined relative-depth pretraining with domain-specific metric-bin heads and automatic routing. [**Depth Anything v2** (2024)](https://arxiv.org/abs/2406.09414) offered metric models obtained by fine-tuning a strong relative-depth backbone on metric labels. [**Metric3D v2** (2024)](https://arxiv.org/abs/2404.15506) handled ambiguity across focal lengths through a canonical-camera-space transformation and converted predictions back with camera parameters at inference. All three extended the relative-depth lineage toward metric prediction, but generalization across training domains and camera settings remained a separate problem.

---

## 5. Re-entry into SLAM

CNN-SLAM incorporated monocular depth predictions into SLAM in 2017. Later systems also used learned depth for initialization. Monocular SLAM requires a sufficient baseline to triangulate from two frames and has ambiguous scale from the outset.

Adding a depth prior to the first frame accelerates initialization and supplies an initial scene structure. A metric model, or a prior calibrated against a known reference, can also initialize metric scale. [DROID-SLAM, released in 2021 by Teed and Deng](https://arxiv.org/abs/2108.10869), combines recurrent optical flow with BA. Follow-up work in that lineage incorporated monocular depth priors into geometric initialization.

Metric-calibrated depth predictions can also act as periodic scale anchors for monocular visual odometry and suppress scale drift. A relative-depth output such as MiDaS, however, cannot determine absolute scale without an external metric reference.

> 📜 **Prediction vs. outcome.** Eigen's 2014 paper identified integration with 3D geometric information, such as surface normals, as a natural extension. PAD-Net, VPD, and other systems later implemented parts of this joint multi-task approach. By 2024, however, shared ViT backbones arguably had greater impact than explicit task combination. The field developed along a different path from the one proposed.

> 📜 **Prediction vs. outcome.** MiDaS (2020) used a scale-and-shift-invariant loss and focused on relative depth. ZoeDepth and the metric models of Depth Anything v2 later used fine-tuning on metric labels, while Metric3D v2 corrected camera-model variation through a canonical space. Metric prediction became more broadly useful, but scale generalization to unseen cameras and domains remained in progress.

---

## 🧭 Still open

**Depth on reflective and transparent surfaces.** For glass, water, and metallic reflections, the image does not directly represent the physical surface. This optical ambiguity remains difficult even with additional synthetic training data, and generalization to real reflective scenes is unstable. Specialized approaches such as [ClearGrasp (Sajjan et al. 2020)](https://arxiv.org/abs/1910.02550) exist, but no general solution does. Even foundation-scale models produce large structural errors in this regime.

**Separating ego-depth and object-depth in dynamic scenes.** Moving cars and pedestrians violate photometric consistency. Self-supervised methods often mask moving objects, avoiding rather than solving the problem. Several later studies, including [Ranjan et al. (2019)](https://arxiv.org/abs/1805.09806), have attempted to estimate moving-object depth separately from ego-motion, but a practical solution remains difficult.

**Generalization of metric scale.** ZoeDepth and the metric variants of Depth Anything v2 learn scale from metric labels, while Metric3D v2 explicitly handles camera-parameter variation. CCTV and archival imagery may still lack reliable intrinsics or metadata. Metric depth that generalizes independently of training domain and camera model remains difficult even for foundation models and was a central open question in 2025.

---

By 2024, while Depth Anything was advancing depth benchmarks, a Cambridge paper had posed another unresolved problem to the SLAM community for nine years: estimating absolute pose directly from a single image without feature extraction, optimization, or an initial map. The paper was [PoseNet](https://arxiv.org/abs/1505.07427).


---

# Ch.12 — The End-to-End Frustration

Eigen's network estimated metric depth from pixels, and SfMLearner obtained geometric supervision without labels. Once learning could infer shape, researchers asked whether one network could perform the entire SLAM task rather than only pose estimation or loop closure. Work from 2015 to 2018 did not produce a successful solution.

In 2015, Alex Kendall, a PhD student working under Roberto Cipolla at the Cambridge Computer Laboratory, trained a neural network on Google Street View images to estimate a 6-DoF pose from a single photograph. [Kendall et al. 2015. PoseNet](https://doi.org/10.1109/ICCV.2015.336) drew immediate attention at ICCV in Santiago de Chile. It suggested that a single CNN might replace the feature extraction, matching, optimization, and map management developed over thirty years of SLAM research. Dozens of papers explored that possibility between 2015 and 2018, and nearly all encountered the same limitations.

---

## 12.1 PoseNet

PoseNet followed [AlexNet (Krizhevsky et al. 2012)](https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks), adapting the high-level visual representations learned by ImageNet classification networks to pose estimation.

> 🔗 **Borrowed.** PoseNet uses the [GoogLeNet (Inception, Szegedy et al. 2014)](https://arxiv.org/abs/1409.4842) architecture as its backbone. It replaces the classification head with a 7-dimensional regression head for x, y, z, and four quaternion components, directly adapting an ImageNet feature hierarchy to localization.

On the Cambridge Landmarks dataset collected by Kendall, which included King's College Chapel, streets, a former hospital, and several other outdoor scenes, PoseNet achieved position errors of around 2 m and orientation errors of 5–8°, depending on the scene (§5 of the original paper). A single GPU produced a pose within 5 ms without feature extraction, RANSAC, or map lookup.

Follow-up studies changed different parts of the method. [Bayesian PoseNet (Kendall & Cipolla 2016)](https://arxiv.org/abs/1509.05909) estimated pose uncertainty through Monte Carlo Dropout. [Walch et al.'s LSTM PoseNet](https://arxiv.org/abs/1611.07890), first released in 2016 and presented at ICCV 2017, used LSTMs to process spatial relationships among features from a single image, rather than a temporal image sequence. [Kendall and Cipolla's 2017 study](https://arxiv.org/abs/1704.00390) examined loss functions for pose regression. Its reprojection loss compared the image coordinates of 3D points projected with ground-truth and predicted poses; it was not a photometric loss based on brightness differences.

As benchmark performance improved, however, the gap became visible. On the same scenes, [Active Search (Sattler et al. 2012)](https://www.graphics.rwth-aachen.de/media/papers/sattler_eccv12_preprint_1.pdf) and DenseVLAD achieved position errors of roughly 0.2 m. The PoseNet family rarely improved beyond errors of several meters, revealing a fundamental limitation of regressing an absolute pose from one image.

---

## 12.2 DeepVO

To address PoseNet's reliance on a single image, Sen Wang of Heriot-Watt University in Edinburgh and his co-authors used image sequences. They presented [Wang et al. 2017. DeepVO](https://arxiv.org/abs/1709.08429) at ICRA in 2017. A CNN influenced by FlowNet extracted optical-flow features from consecutive frame pairs, and an LSTM accumulated temporal context to estimate visual odometry directly.

> 🔗 **Borrowed.** DeepVO's training labels are KITTI's GPS/IMU ground truth, and its feature extraction design is borrowed directly from the optical flow CNN architecture of [FlowNet (Dosovitskiy et al. 2015)](https://arxiv.org/abs/1504.06852).

The LSTM was intended to use temporal context to suppress drift. DeepVO showed lower drift than DVO-SLAM or VISO2-M on parts of the KITTI sequences, but only under conditions resembling the training data in driving patterns, lighting, urban appearance, and speed profiles. When conditions differed, the accumulated context became a source of bias.

[Zhou et al. 2017. SfMLearner](https://arxiv.org/abs/1704.07813), released the same year by Tinghui Zhou at UC Berkeley, took a different approach. It jointly estimated depth and ego-motion through self-supervised learning, using photometric reprojection loss as the training signal and requiring no labels.

> 🔗 **Borrowed.** SfMLearner and [DSO (Engel et al. 2018)](https://arxiv.org/abs/1607.02565) share the principle of comparing brightness at geometrically corresponding image locations. DSO uses these differences to optimize poses and a map directly; SfMLearner uses them to train networks that predict depth and camera motion. SfMLearner's self-supervised approach continued in monocular-depth methods such as MonoDepth2. DROID-SLAM also uses differentiable geometry, but its pose and optical-flow supervision distinguishes it from this self-supervised line.

SfMLearner's evaluation on short VO snippets must be distinguished from ORB-SLAM's system performance over longer trajectories with loop closure.

---

## 12.3 Geometry, generalization, and uncertainty

Geometric constraints, generalization beyond the training distribution, and uncertainty estimation raised distinct questions for end-to-end pose regression and learned odometry around 2019–2020. [Sattler et al. (2019)](https://arxiv.org/abs/1903.07504), for example, examined the limits of absolute pose regression; these results should be distinguished from the temporal estimation problem addressed by learned odometry.

**First: absence of inductive bias.** Classical SLAM explicitly encoded geometric constraints accumulated over decades, including the epipolar constraint, rigid-body motion, scale invariance, and spatial continuity. A CNN had to infer them from data, while ImageNet classification offered little supervision for the metric geometry of 3D space. Even when a regression network estimated the correct pose, it was difficult to determine whether it had learned 3D structure or memorized combinations of lighting, color, and texture.

**Second: generalization beyond the training distribution.** A scene-specific PoseNet cannot directly supply absolute coordinates for an unseen scene. Learned odometry estimates relative motion, but deployment with a different camera, motion pattern, or image distribution requires its own validation. [TartanVO](https://proceedings.mlr.press/v155/wang21h.html), presented at CoRL 2020, treated cross-dataset generalization as a central design problem. Classical ORB-SLAM can also lose tracking when features or lighting change; recovery procedures and failure detection are necessary for both geometric and learned systems.

**Third: validating uncertainty estimates.** Path planning and obstacle avoidance need information about localization error as well as the estimated pose. An EKF updates covariance, and a factor graph can provide uncertainty around an estimate, but both depend on modeling and approximation choices. Bayesian PoseNet used dropout to estimate uncertainty and evaluated it for localization-error estimation and detection of whether the input showed the learned scene. These results do not guarantee calibration for arbitrary inputs outside the training distribution.

---

## 12.4 Reassessment

Kendall received his PhD at Cambridge in 2017 and co-founded Wayve that year. [His later research](https://alexgkendall.com/) included imitation learning and world models for autonomous driving, expanding from camera pose estimation to scene understanding and learned driving behavior.

[CNN-SLAM (Tateno, Tombari, Laina, and Navab, 2017)](https://arxiv.org/abs/1704.03489) fused CNN-predicted dense depth with depth measurements from direct monocular SLAM. It relied more on predicted depth in low-texture regions and on SLAM measurements where geometric estimation was reliable. It also used predicted depth to estimate absolute scale. Evaluated on two benchmarks, the method was an early example of combining learning and geometry.

> 📜 **Prediction vs. outcome.** The PoseNet paper (2015) proposed further work on training data obtained through multiview geometry, probabilistic extensions, and the limits on scene size that one model could learn. Bayesian PoseNet (2016) addressed probabilistic pose estimation and uncertainty evaluation. LSTM PoseNet's spatial feature processing does not demonstrate temporal integration, and these follow-up studies do not establish that all of the original tasks were resolved. Accuracy and generalization in absolute pose regression remained subjects of evaluation.

Some components remained useful in other settings. SfMLearner's photometric self-supervision continued in monocular-depth methods such as MonoDepth2 (Godard 2019). DROID-SLAM (Teed & Deng 2021) also uses differentiable geometry, but trains with pose and optical-flow supervision. DeepVO's LSTM-based temporal modeling also reappeared in modified form in visual-inertial learning research. The methods changed even as their individual ideas persisted.

> 📜 **Prediction vs. outcome.** In the SfMLearner paper (2017), Zhou identified dynamic-object handling and robustness to photometric noise as remaining tasks. Later self-supervised work, including [GeoNet (Yin & Shi 2018)](https://arxiv.org/abs/1803.02276), made partial progress. GeoNet jointly learned depth, optical flow, and camera motion while modeling static and dynamic regions separately.

---

## 12.5 The lesson that remained

Around 2020, a common design rule was to keep geometry explicit and use learning for features and priors.

> 🔗 **Borrowed.** CodeSLAM (Bloesch 2018) and DROID-SLAM (Teed & Deng 2021) implement this principle. Both retain the geometric structure of a factor graph or bundle adjustment and use learning for depth representation in CodeSLAM and for dense correspondence and recurrent updates in DROID-SLAM, retaining constraints that PoseNet had removed.

The classical pipeline was not uniformly superior to learning-based alternatives. PoseNet demonstrated operation under some lighting changes and motion blur where feature-based registration failed. In contrast, Sattler et al. (2019) found that the absolute pose regression methods they evaluated did not match the accuracy of structure-based localization. The comparison depended on the input conditions and evaluation task.

The important distinction was between directly regressing pose from an image and estimating pose from visual correspondences under geometric constraints. CodeSLAM and DROID-SLAM combined learned representations with the latter computation.

---

## 🧭 Still open

**Which inductive bias to inject, and how.** Even if geometry remains part of the algorithm, it is unclear which constraints should be encoded and at what level. Candidates include rigid-body motion and the epipolar constraint. Foundation models are again blurring this boundary, while GaussianSLAM and 3DGS-based systems explore how much geometry can reside within a learned representation.

**Calibration of learned uncertainty.** Bayesian PoseNet did not resolve this problem. Whether uncertainty estimates from deep learning remain calibrated to actual error, especially for out-of-distribution inputs, was still open as of 2026. Autonomous-driving applications make the question practically urgent.

**Redefining "end-to-end."** PoseNet implemented end to end as a learned direct mapping from image to pose. Since foundation models appeared in 2023, however, the term has begun to change. Researchers are again deciding which SLAM modules should be learned and which should remain explicit algorithms.

CodeSLAM, released by Andrew Davison's lab at Imperial College London in 2018, embodied this division between explicit geometry and learned representation.
