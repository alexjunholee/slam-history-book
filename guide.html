## 6.7 비선형성과 강건성: 실제 구현의 문제

물론 수학이 깔끔하다고 실전 시스템이 저절로 돌아가지는 않는다. 이론적 그래프 최적화를 움직이는 로봇에 올리자마자 세 가지 현실의 벽이 나타났다.

가장 먼저 부딪힌 것은 **초기값 의존성**이다. Gauss-Newton과 Levenberg-Marquardt는 본질적으로 국소 최적화기(local optimizer)이므로, 오도메트리에서 넘어온 초기 자세가 참값에서 크게 벗어나 있으면 엉뚱한 지역 최솟값(local minimum)에 빠져 헤어나지 못한다. 여기에 단 하나의 잘못된 loop closure 엣지(outlier)라도 섞여 들어가면, 최소자승의 제곱 오차가 그 가짜 엣지를 맞추려고 멀쩡한 지도 전체를 기괴하게 비틀어 놓는다. 결국 backend에 데이터를 넘기기 전 frontend 단계에서 오매칭을 철저히 걸러 내는 검증 장치가 사활이 걸린 문제로 떠올랐다(→ 7장).

두 번째 방어막은 **robust kernel**이었다. 표준 이차 손실이 outlier에 맥없이 무너진다는 사실이 드러나면서, 오차가 일정 수준을 넘어서면 가중치를 깎아 내리는 Huber나 Cauchy 같은 강건 비용 함수가 필수로 자리 잡았다. 오늘날 g2o와 GTSAM 모두 다양한 robust kernel을 기본 내장하고 있으며, 센서 특성과 환경에 맞춰 선택해 쓴다.

세 번째는 **장기 운용 시 주변화 근사**다. iSAM2의 Bayes tree가 아무리 영리해도 로봇이 하루 종일 주행하며 새 자세를 쌓아 가면 트리와 메모리는 결국 커진다. 실전 시스템은 오래된 자세를 주기적으로 주변화해 크기를 묶어 두는데, 변수를 지울 때마다 남은 변수들 사이에 새로운 연결이 빽빽하게 생기는 fill-in이 일어나 정보 행렬의 희소성을 잠식한다. 어디까지 남기고 어떤 prior factor로 근사할지에 따라 장기 주행 시스템의 정확도와 속도가 갈렸다.

> 📜 **예언 vs 실제.** g2o가 내세운 "일반성(generality)"은 사용자가 상태(vertex)와 제약(edge)만 정의하면 어떤 기하 문제든 같은 틀에서 풀 수 있다는 약속이었다. 그 약속은 놀라울 만큼 풍성하게 실현돼, 이후 연구자들은 점과 자세를 넘어 직선(line), 평면(plane), IMU 관성 사전적분, 심지어 3D 객체(object) 제약까지 저마다의 사용자 정의 엣지로 빚어 넣어 그래프 SLAM을 확장했다.

## 아직 열린 문제

**어떤 robust kernel을 쓸 것인가.** Huber, Cauchy, Geman-McClure, DCS 등 선택지는 많지만, 어느 환경에서 어떤 kernel과 파라미터가 최선인지는 여전히 엔지니어의 경험과 수작업 튜닝에 맡겨져 있다. Chebrolu 등(RA-L 2021)은 [adaptive robust kernel](https://doi.org/10.1109/LRA.2021.3061331)을 제안해 Barron의 일반화 kernel 모양을 최적화 도중 잔차 분포에 맞춰 자동으로 조율하려 했고 ICP와 BA에서 가능성을 보였지만, 범용 표준까지는 아직 갈 길이 남았다.

**비가우시안과 다중 가설의 표현.** GTSAM과 g2o의 표준 최적화기는 모든 잔차가 단봉 가우시안 분포를 따른다는 전제 위에 서 있다. 현실의 잘못된 loop closure 확률이나 "복도의 첫 번째 문인지 두 번째 문인지" 모호한 다중 가설을 담기 위해 robust kernel을 넘어 max-mixture, hybrid factor 같은 확장이 시도되고 있으나, 비가우시안 분포를 실시간 factor graph 안에서 매끄럽게 다루는 일은 여전히 어려운 숙제다.

**초대규모·고밀도 루프 환경의 확장성.** Bayes tree의 증분 효율은 새 factor가 건드리는 clique가 국소적일 때 극대화된다. 반대로 도시 규모의 거대한 지도 안에서 수많은 loop closure가 촘촘히 얽히면 영향을 받는 subtree와 fill-in이 급격히 커져 계산량과 메모리가 함께 뛴다. 이를 누르기 위해 지도를 계층적으로 쪼개거나 submap으로 묶어 관리하는 연구가 계속 이어지고 있다.

---

2010년대에 접어들어 g2o와 GTSAM이 사실상 표준 backend로 자리 잡으면서, SLAM backend를 둘러싼 방법론 논쟁은 한동안 수면 아래로 가라앉는 듯 보였다. 연구자들의 시선은 자연스레 어떤 특징을 뽑아 어떻게 루프를 알아볼 것인가 하는 frontend 쪽으로 옮겨 갔다.

하지만 backend의 수식을 가만히 들여다본 이론가들 앞에는 여전히 답 없는 근본 질문 하나가 버티고 있었다. g2o와 GTSAM이 "수렴했다"며 돌려준 그 해가, 과연 운 좋게 찾은 국소 최솟값(local minimum)이 아니라 진짜 **전역 최솟값(global minimum)**이라는 보장이 어디에 있는가?(→ 7장)

# 7장 전역 최적성 인증

Lu와 Milios에서 g2o, GTSAM으로 이어지며 그래프 SLAM이 천하를 통일한 듯 보였지만, 그 심장부에는 아무도 해결하지 못한 불안한 균열이 하나 남아 있었다. 포즈 그래프 최적화(PGO)는 본질적으로 비볼록(non-convex) 문제이기 때문에, Gauss-Newton이나 Levenberg-Marquardt가 아무리 매끈하게 수렴했더라도 그 답이 진짜 전역 최솟값이 아니라 엉뚱한 지역 최솟값(local minimum)일 위험을 늘 안고 있었다. 실무자들은 대체로 *"오도메트리 초기값만 그럴듯하면 잘 풀린다"*는 경험칙에 기대어 시스템을 돌렸다. 하지만 초기값이 크게 어긋나거나 모호한 루프가 걸린 날이면, backend는 기괴하게 뒤틀린 지도를 내놓고도 실패 신호 하나 없이 태연히 "수렴 완료"를 선언하곤 했다.

2015년, 당시 Georgia Tech에 몸담고 있던 Luca Carlone은 Frank Dellaert, MIT의 David Rosen, John Leonard 등과 함께 바로 이 암묵의 공백을 정조준했다. 최적화기가 내놓은 해가 정말 전역 최적해인지 수학적으로 **인증(certify)**할 수는 없을까? Lagrangian duality에서 출발한 이 물음은 Briales와 Gonzalez-Jimenez의 Cartan-Sync(2017), Rosen의 SE-Sync(2019), Yang과 Carlone의 TEASER, 그리고 Papalia 등의 CORA로 이어지며 certifiable SLAM이라는 새 영역을 열었다. 흥미롭게도 이 돌파구를 연 도구들은 모두 SLAM 바깥에 있었다. Shor relaxation은 operations research에서, Burer-Monteiro factorization은 수리 최적화에서, Riemannian optimization은 미분기하에서, 그리고 Kirchhoff의 Matrix-Tree 정리는 19세기 전기 회로망 이론에서 건져 올린 보물이었다.

---

## 7.1 지역 최솟값 문제

그래프 SLAM backend의 첫 번째 아킬레스건은 초기값 의존성이다(→ §6.7). 비용 함수가 비볼록해지는 근본 원인은 3차원 회전 행렬 $\boldsymbol{R}_i \in \mathrm{SO}(3)$가 만족해야 하는 곡선형 비선형 제약에 있다. 초기 자세 추정이 참값에서 조금만 멀어져도 Gauss-Newton은 엉뚱한 골짜기로 미끄러져 내려간다. *The SLAM Handbook* 6장의 그림 6.1을 보면, 여러 층으로 겹친 주차장을 주행한 실제 로봇 데이터에서 이 차이가 적나라하게 드러난다. 전역 최적해를 인증해 내는 SE-Sync는 주차장 층들을 칼같이 쌓아 올린 반면, 무작위 초기값에서 출발한 국소 최적화기는 전혀 엉뚱하게 뭉개진 지역 최솟값에 갇혀 버린다.

2000년대 후반까지 실전 엔지니어들은 두 가지 방어선으로 이 문제를 버텨 냈다. 오도메트리로 최대한 정확한 초기값을 넘겨주고, frontend에서 잘못된 loop closure(outlier)를 가혹하게 걸러 내는 전략이었다. 물론 효과는 있었지만, 정작 수렴한 결과가 전역 최적인지 판별할 심판은 어디에도 없었다. 2010년 무렵 Shoudong Huang과 Gamini Dissanayake는 설령 초기값이 좋아도 데이터가 모호하면 최적화기가 틀린 답에서 멈출 수 있음을 지적했고, 이윽고 PGO의 여러 특수 사례가 계산 복잡도 이론상 NP-hard라는 사실까지 밝혀졌다. 그런데도 희한하게 실전에서는 g2o로 문제가 대개 잘 풀렸다. 2010년대 중반 이론 연구자들은 바로 그 간극—*최악의 경우 NP-hard인 문제가 왜 실제 로봇 데이터에서는 이토록 잘 풀리며, 언제 틀리는지*—을 파헤치기 시작했다.

Gauss-Newton은 어디까지나 국소 조건만 보장한다. 이론적인 국소 최솟값에서는 기울기가 0이고 Hessian이 양의 준정부호여야 하지만, 실제 수치 solver는 정지 기준이나 수치 오차 때문에 그 조건에 닿기 전에 일찍 멈추기도 한다. backend가 아무런 경고 없이 조용히 멈추는 한, 사용자는 지금 눈앞의 지도가 진짜인지 가짜인지 알 도리가 없었다.

> 🔗 **차용.** Huber나 Cauchy 같은 robust kernel은 20세기 중반의 강건 통계학(robust statistics)에서 빌려 온 도구다. 1996년 [Black과 Rangarajan](https://doi.org/10.1007/BF00131148)은 이런 robust 비용 함수를 outlier 가중치도 함께 최적화하는 형태로 바꿔 쓸 수 있음을 보였다(Black-Rangarajan duality). 이 대응 관계는 훗날 SLAM과 3D 점군 정합에서 GNC(graduated non-convexity, 볼록에 가까운 쉬운 문제에서 시작해 서서히 원래의 비볼록 비용으로 옮겨 가는 기법)를 설계하는 이론적 디딤돌이 됐다.

## 7.2 Shor relaxation

PGO가 비볼록인 유일한 이유가 회전 제약 $\boldsymbol{R}_i \in \mathrm{SO}(d)$ 때문이라면, 이 제약을 다룰 수 있는 다른 수학으로 옮겨 적을 수는 없을까? 먼저 직교성 조건 $\boldsymbol{R}^\top \boldsymbol{R} = \boldsymbol{I}$는 명백한 이차 방정식이다. 3차원에서 오른손 좌표계를 강제하는 $\det(\boldsymbol{R})=+1$ 조건은 원래 삼차식이지만, 세 열벡터의 외적 관계($\boldsymbol{r}_1 \times \boldsymbol{r}_2 = \boldsymbol{r}_3$ 등)로 풀어 쓰면 역시 이차 제약으로 바뀐다. 목적함수 또한 자세들에 대한 이차식이므로, PGO 전체는 결국 **QCQP**(Quadratically Constrained Quadratic Program, 이차 제약 이차 계획)라는 표준 최적화 문제로 깔끔하게 번역된다.

바로 이 QCQP에 대해서는 1987년 소련의 수학자 Naum Shor가 이미 강력한 볼록 완화(convex relaxation) 기법을 만들어 두었다. Shor의 착안은 스칼라 대수의 항등식 $\boldsymbol{x}^\top \boldsymbol{M}\boldsymbol{x} = \mathrm{tr}(\boldsymbol{M}\boldsymbol{x}\boldsymbol{x}^\top)$에서 출발한다. 고차원의 대칭 행렬 변수 $\boldsymbol{X} \triangleq \boldsymbol{x}\boldsymbol{x}^\top$을 새로 도입해 문제를 한 차원 위로 끌어올리면(**lifting**), 원래의 모든 이차식은 $\boldsymbol{X}$에 대한 단순한 *선형식*으로 바뀐다. 비볼록성은 오직 "$\boldsymbol{X} \succeq 0$이고 **rank가 1**이다"라는 단 하나의 조건으로 집약된다. 이제 거기서 까다로운 rank-1 제약만 과감히 지워 버리면, 놀랍게도 전역 최적해를 다항 시간에 찾을 수 있는 순수 볼록 최적화 문제, 즉 **SDP**(semidefinite program, 반정부호 계획)가 탄생한다(변수 개수가 $n$개에서 $n(n+1)/2$개로 늘어나는 대가는 치러야 한다).

$$d^* = \min_{\boldsymbol{X}\in\mathbb{S}^n} \mathrm{tr}(\boldsymbol{C}\boldsymbol{X}) \;\; \text{s.t.} \;\; \mathrm{tr}(\boldsymbol{A}_i\boldsymbol{X})=b_i,\; \boldsymbol{X}\succeq 0.$$

이 완화가 마법을 부리는 지점은 부등식 $d^* \le p^*$에 있다. 완화한 SDP의 최솟값 $d^*$는 원래 풀려던 어려운 QCQP의 진짜 전역 최솟값 $p^*$보다 절대 클 수 없다(하한). 따라서 우리가 어떻게든 구한 후보해 $\hat{\boldsymbol{x}}$의 비용 $f(\hat{\boldsymbol{x}})$와 $d^*$의 차이인 $f(\hat{\boldsymbol{x}}) - d^*$를 재면, 지금 손에 쥔 해가 진짜 전역 최적에서 최대 얼마나 떨어져 있는지, 즉 **오차의 상한(suboptimality bound)**을 정확히 알 수 있다. **"certifiable(인증 가능한)"**이라는 수식어가 바로 여기서 나왔다. 게다가 만약 운 좋게 SDP의 해 $\boldsymbol{X}^*$의 rank가 정확히 1로 떨어지면($\boldsymbol{X}^* = \boldsymbol{x}^*\boldsymbol{x}^{*\top}$), 그 $\boldsymbol{x}^*$가 곧 원래 비볼록 PGO의 유일무이한 전역 최적해라는 수학적 **증명**까지 공짜로 얻는다.

SLAM에 이 렌즈를 처음 들이댄 것은 2015년 ICRA와 IROS에 실린 Luca Carlone의 두 논문, [Carlone & Dellaert (2015), "Duality-based verification techniques for 2D SLAM"](https://doi.org/10.1109/ICRA.2015.7139835)과 [Carlone et al. (2015), "Lagrangian duality in 3D SLAM"](https://arxiv.org/abs/1506.00746)이었다. 두 논문은 후보해가 전역 최적인지 Lagrangian dual로 검증하는 절차를 세웠고, 실제 벤치마크 실험에서 놀라울 만큼 많은 경우 duality gap($p^* - d^*$)이 정확히 0으로 떨어짐을 발견했다. 다만 *언제* gap이 0이 되는지까지는 아직 설명하지 못했다. 2017년에는 [Briales와 Gonzalez-Jimenez의 Cartan-Sync (RA-L 2017)](https://doi.org/10.1109/LRA.2017.2718661)가 pose synchronization 관점으로 이 맥을 이었고, 때마침 수리 최적화 쪽에서 2003년 무르익은 Burer-Monteiro의 low-rank SDP 분해와 Boumal·Absil·Sepulchre의 Riemannian optimization 기법이 맞물리며 결정타가 준비되고 있었다.

## 7.3 SE-Sync

[Rosen, Carlone, Bandeira, Leonard의 **SE-Sync** (*IJRR* 2019)](https://arxiv.org/abs/1612.07386)는 이 모든 수학적 조각을 단 하나의 고속 알고리즘으로 엮어 내며 certifiable SLAM의 대명사가 됐다. David Rosen은 MIT에서 John Leonard(Durrant-Whyte와 함께 EKF-SLAM 틀을 세운 바로 그 연구자다, → 4장)의 지도로 박사학위를 받았다. Rosen은 Carlone·Leonard, 그리고 SDP와 synchronization 이론의 대가인 수학자 Afonso Bandeira와 손잡고 Shor relaxation, 이동 변수 소거, Burer-Monteiro 매개화, Boumal의 Riemannian Staircase를 PGO 하나에 녹여 넣었다.

SE-Sync의 연산은 세 단계의 우아한 변환을 거친다. 첫째, 회전을 고정해 두면 이동 변수 $\boldsymbol{t}$는 단순한 선형 최소자승 문제가 된다는 점을 이용해(그래프 SLAM 연구자들이 예전부터 알던 성질이다) $\boldsymbol{t}$를 닫힌 형태로 미리 소거한다. 둘째, 오직 회전 변수만 남은 $\min_{\boldsymbol{R}\in\mathrm{SO}(d)^n} \mathrm{tr}(\tilde{\boldsymbol{Q}}\boldsymbol{R}^\top\boldsymbol{R})$에 Shor relaxation을 걸어 볼록한 SDP로 바꾼다. 셋째, 이 $dn \times dn$ 크기의 거대한 SDP를 일반 interior-point method로 풀면 자세가 몇천 개만 돼도 메모리가 터져 버리므로, Burer-Monteiro 저랭크 재매개화 $\boldsymbol{Z} = \boldsymbol{Y}^\top \boldsymbol{Y}$를 도입해 Stiefel manifold 위의 훨씬 작고 매끄러운 비제약 최적화 문제로 바꿔 푼다.

SE-Sync가 실전에서 전역 최적해를 확신하는 근거는 **exact recovery** 정리와 **Riemannian Staircase**의 결합이다. 먼저 측정 노이즈가 특정 임계 상수 $\beta$보다 작다면, SDP relaxation의 해 $\boldsymbol{Z}^*$는 유일하며 rank가 정확히 $d$로 떨어져 원래 최대우도 추정(MLE)의 전역 최적해를 한 치 오차 없이 복원한다는 것이 수학적으로 증명된다(일반 벡터 QCQP에서는 rank-1이 조건이지만, 여기서는 $\boldsymbol{Z}=\boldsymbol{R}^\top\boldsymbol{R}$이고 $\boldsymbol{R}\in\mathbb{R}^{d\times dn}$이므로 정확한 해의 rank가 $d$다). 물론 $\beta$는 알 수 없는 참값에 따라 달라 사전에 계산할 수 없다. 이때 Boumal 등이 증명한 정리가 구원투수로 등판한다. 이 정리에 따르면, Stiefel manifold 위에서 찾은 2차 임계점이 rank-deficient하면 그 점이 곧 원래 SDP의 전역 최솟값이다. SE-Sync의 Riemannian Staircase는 작은 rank에서 출발해 2차 임계점을 찾은 뒤 rank-deficiency를 검사하고, 조건을 못 채우면 rank를 한 칸씩 높여 다시 푼다. 이론상 rank가 $dn+1$에 닿으면 모든 $\boldsymbol{Y}$가 row rank-deficient해지므로 유한한 횟수 안에 반드시 종료하며, *SLAM Handbook* 6장에 따르면 실제 데이터에서는 대부분 한두 계단만 올라가도 답을 얻는다.

성능과 신뢰성 모두 압도적이었다. 합성 데이터(`sphere`, `torus`, `grid`)와 실측 데이터(`garage`, `cubicle`, `rim`) 전부에서 SE-Sync는 Gauss-Newton과 동일한 전역 최적해에 도달했을 뿐 아니라, 속도마저 `garage`에서 3.3배, `rim`에서는 무려 15.7배나 빨랐다. 무엇보다 g2o나 GTSAM이 해만 달랑 돌려주고 침묵하던 것과 달리, SE-Sync는 해와 함께 수학적인 **사후(a posteriori) 인증서**를 내놓았다. 인증을 통과하면 그 지도는 전역 최적임이 증명된 것이고, 통과하지 못하면 믿을 수 없는 불확실한 해임을 스스로 경고했다. Lu와 Milios 이후 20여 년 만에 비로소 SLAM backend가 스스로의 정답을 증명하는 눈을 뜬 것이다.

> 📜 **예언 vs 실제.** Rosen 등은 SE-Sync 결론에서 일부 측정에 outlier가 섞여도 견디는 강건한 인증 추정기와, 더 일반적인 polynomial optimization 문제 전반을 아우르는 구조적 SDP relaxation의 시대를 내다보았다. 그 전망은 이후 현실이 됐다. 점군 정합의 TEASER 계열, landmark SLAM을 다룬 Holmes와 Barfoot(2023), 거리 측정 기반의 CORA(Papalia et al., 2024)가 줄을 이었다. 한편 visual SLAM의 perspective projection은 분수식(유리함수)이라 다항 최적화에 곧바로 넣기 까다로웠는데, 2025년 RSS에서 Han과 Yang이 발표한 [XM](https://arxiv.org/abs/2502.04640)은 학습한 depth로 2D keypoint를 3D로 먼저 올려 projection 분모를 없앤 scaled bundle adjustment를 세우고, 이를 SfM 파이프라인에서 SDP relaxation으로 풀어 전역 최적성 인증서까지 받아 냈다.

> 🔗 **차용.** SE-Sync를 실시간 크기로 굴린 핵심 엔진인 Burer-Monteiro factorization은 [Burer와 Monteiro(2003)](https://link.springer.com/article/10.1007/s10107-002-0352-8)의 저랭크 SDP 해법에서 왔다. 여기에 미분기하의 눈을 얹어 2차 임계점이 전역 최적이 되는 조건을 뚫어 낸 것이 [Boumal, Voroninski, Bandeira(2016)](https://arxiv.org/abs/1606.04970)였고, Rosen이 이 수학을 곧바로 SLAM으로 가져왔다.

## 7.4 Graph Laplacian과 Fisher Information

"이게 진짜 전역 최솟값인가?"라는 질문에 답을 얻고 나면 곧장 두 번째 질문이 뒤따른다. *"그렇다면 그 전역 최적해는 실제 참값과 얼마나 가까운가?"* 추정의 정밀도 한계를 재는 고전적 잣대는 Cramér-Rao Lower Bound(CRLB)와 **Fisher Information Matrix(FIM)**다. 놀랍게도 회전을 고정한 단순 PGO 모델에서 FIM을 계산해 보면, 정확히 포즈 그래프의 가중 reduced Laplacian과 단위행렬의 Kronecker product로 떨어진다.

$$\mathcal{I} = \boldsymbol{J}^\top \boldsymbol{\Sigma}^{-1} \boldsymbol{J} = \boldsymbol{L}_w \otimes \boldsymbol{I}_3.$$

이 짧은 등식이 뜻하는 바는 엄청나다. 실제 센서 측정을 한 번도 해 보지 않고 그래프의 *연결 구조*만 쥐고 있어도 최종 추정 정확도가 어느 정도일지 미리 가늠할 수 있기 때문이다. 1847년 Gustav Kirchhoff가 전기 회로망의 전류를 풀려고 증명한 **Matrix-Tree 정리**에 따르면, reduced Laplacian의 행렬식은 그래프가 품은 가중 spanning tree의 총수와 같으며, 이는 곧 정보 행렬의 행렬식을 최대화하는 실험 설계 기준(D-optimality)과 정확히 맞닿는다. 또한 Laplacian의 두 번째로 작은 고윳값인 대수적 연결도(algebraic connectivity, Fiedler value)는 최악의 방향 분산을 억제하는 E-optimality에 대응한다. 19세기 전기 회로 정리가 21세기 로봇공학에서 "어느 경로로 움직여야 지도가 가장 정확해질까"를 계산하는 **active SLAM**과 loop closure 측정 선택의 수학적 심장으로 부활한 것이다.

이 연결 고리를 3D SLAM 전반으로 체계화한 주역은 [Kasra Khosoussi, Shoudong Huang, Gamini Dissanayake 등(2014년 이후)](https://doi.org/10.1177/0278364918823086)이었다(Khosoussi는 University of Technology Sydney에서 Huang과 Dissanayake의 지도로 2017년 박사를 받은 뒤 MIT로 옮겨 연구를 이었다). 3D PGO로 확장하더라도 Laplacian과 SE(3) adjoint 표현이 Kronecker product 형태로 깔끔히 결합해 그래프 위상 정보와 기하 정보를 분리해 다룰 수 있으며, Laplacian의 차원은 전체 FIM보다 6배나 작다. 덕분에 어느 loop closure를 남기고 버릴지 고를 때 무거운 FIM 대신 Laplacian 스펙트럼을 보면 계산이 훨씬 가벼워진다.

4장에서 본 EKF-SLAM의 **inconsistency(과신)** 문제 역시 이 CRLB의 눈으로 다시 보면 정체가 한눈에 드러난다. Julier와 Uhlmann(2001)이 짚은 EKF의 과신은 결국 잘못된 선형화로 Fisher information을 실제 물리적 한계보다 부풀려 계산하는 현상에 다름아니기 때문이다. *The SLAM Handbook* 6장이 6.1절에서 certifiable solver를 다루고 곧바로 6.2절에서 Fisher information과 추정 정확도를 나란히 배치한 것도, "최솟값을 확실히 찾는 일"과 "그 최솟값이 얼마나 믿을 만한지 재는 일"이 동전의 양면처럼 붙어 있기 때문이다.

> 🔗 **차용.** [Kirchhoff의 Matrix-Tree 정리(1847)](https://en.wikipedia.org/wiki/Kirchhoff%27s_theorem)는 원래 19세기 전기 저항 회로를 분석하기 위해 탄생해 조합론과 통계적 실험 설계를 거친 뒤, 2010년대 Khosoussi 등의 손을 거쳐 SLAM의 active mapping과 그래프 가지치기 기준으로 자리 잡았다.

## 7.5 확장과 한계: TEASER, CORA, Lasserre relaxation

SE-Sync가 순수 포즈 그래프의 문을 연 뒤, certifiable 연구는 현실의 더 거친 문제들—대규모 **outlier**가 판치는 환경, 거리 측정(range), landmark, 비등방 잡음(anisotropic noise)—쪽으로 뻗어 나갔다.

가장 먼저 부딪힌 난적은 **outlier**였다. 아무리 frontend가 깐깐해도 잘못된 loop closure가 섞여 들어가 일정 비율을 넘기면 Huber나 Cauchy kernel조차 맥없이 무너진다. 2017년 무렵부터 이 난제를 겨냥한 연구가 본격화됐고, 대표작이 [Yang, Shi, Carlone의 **TEASER** (*TRO* 2021)](https://arxiv.org/abs/2001.07715)다. TEASER는 3D 점군 정합 벤치마크에서 대응점의 **99% 이상이 가짜(outlier)**인 극한 상황에서도 scale이 주어졌을 때 정확한 변환을 건져 올렸다. 비결은 오차가 커지면 비용을 상수로 잘라 버리는 truncated least squares(TLS)로 문제를 다시 쓴 뒤, scale·rotation·translation을 분리해 scale과 translation은 다항 시간의 adaptive voting으로, rotation은 SDP relaxation으로 풀어 인증서까지 떼어 준 데 있다. 뒤이어 [Yang과 Carlone (*TPAMI* 2022)](https://arxiv.org/abs/2109.03349)은 TLS 같은 비볼록 강건 비용을 일반 다항 최적화 문제(POP)로 바꾸고, 무거운 Lasserre 계층보다 훨씬 가벼운 희소 SDP relaxation 체계를 제시했다.

센서 모달리티 확장에서는 UWB 같은 거리 측정을 결합한 range-aided SLAM을 다룬 [Papalia 등의 **CORA** (*TRO* 2024)](https://arxiv.org/abs/2302.11614)가 주목을 받았다. 거리 잔차 $(\|\boldsymbol{t}_j - \boldsymbol{t}_i\| - \tilde r_{ij})^2$에는 제곱근(노름)이 들어 있어 그대로는 QCQP가 되지 않는다. CORA는 두 점 사이의 방향을 나타내는 보조 단위벡터 $\boldsymbol{b}_{ij} \in S^{d-1}$를 변수로 끼워 넣어 이 문제를 깔끔한 QCQP로 바꿨다. 흥미롭게도 *SLAM Handbook* 6장에서 짚듯, CORA의 relaxation은 SE-Sync와 달리 노이즈가 아무리 작아도 *언제나* exact해지지는 않았다(예컨대 여러 로봇이 상대 자세 없이 거리만 서로 재는 경우). 그럼에도 그래프 연결이 튼튼한 다수의 실제 SLAM 환경에서는 exact recovery를 달성했다. 한편 landmark를 포함한 SLAM에서는 [Holmes와 Barfoot (*RA-L* 2023)](https://doi.org/10.1109/LRA.2023.3238173)이 Schur complement로 landmark 변수를 먼저 대수적으로 소거해 문제를 SE-Sync에 곧바로 태울 수 있는 형태로 다듬었다(Holmes, Khosoussi, Rosen은 바로 *SLAM Handbook* 6장의 공저자들이다).

그러나 벽도 뚜렷하다. 비등방 잡음과 truncated-quadratic outlier까지 한꺼번에 아우르려고 일반 POP로 넘어가면 **Lasserre moment relaxation**이 필요한데, 이 계층이 만들어 내는 거대한 SDP 행렬은 중복 제약이 무수히 얽혀 **degenerate**해지기 일쑤다. 그러면 Riemannian Staircase가 수렴을 보장받기 위해 기대던 constraint qualification이 깨지고 dual 해가 무수히 많아져 수치적 구현이 몹시 까다로워진다. 실제로 *Handbook*은 이런 SDP에는 Riemannian Staircase를 적용할 수 없다고 선을 긋는다. 2022년 Yang 등이 이 계층을 푸는 전용 solver를 내놓긴 했으나 여전히 국소 solver보다 한참 느리며, Visual SLAM의 perspective projection과 IMU preintegration을 이 다항식 틀에 무리 없이 담는 문제도 큰 난제로 남아 있다.

> 📜 **예언 vs 실제.** Carlone 등은 2015년 IROS 논문 말미에 *"Many theoretical questions remain open, e.g., under which conditions the duality gap is zero?"*라는 질문을 남겼다. 10년이 흐른 지금도 그 답은 절반만 채워졌다. SE-Sync는 노이즈가 $\beta$ 이하이면 exact하다는 충분조건을 증명하긴 했지만, 실제 현장의 데이터에서 그 $\beta$가 얼마인지 사전에 계산할 방법이 없기 때문이다. 그래서 2026년 오늘날에도 이론가와 엔지니어는 사전(a priori) 보장 대신 매 문제마다 풀고 난 뒤 **사후(a posteriori) 인증서**를 계산해 전역 최적 여부를 확인하는 전략을 쓴다.

## 아직 열린 문제

**Visual SLAM과 VIO에 인증을 얹기.** 핀홀 카메라의 perspective projection $\pi(\boldsymbol{X}) = [X/Z, Y/Z]$는 분모에 깊이 $Z$가 들어 있는 유리함수다. 다항 최적화에 넣으려고 분모를 양변에 곱해 다항식으로 바꾸면, 관측되는 feature마다 새 변수와 보조 제약이 눈덩이처럼 불어난다. ORB-SLAM3처럼 map point가 수천, 수만 개에 이르는 실시간 Visual SLAM에서 이 거대한 SDP를 제시간에 풀기란 불가능에 가깝다. Forster(2015)의 IMU preintegration 역시 Lie group 위의 exponential map과 bias drift가 얽혀 있어 다항식으로 쓰기 어렵다. 이 때문에 2026년 현재에도 주류 Visual SLAM과 VIO 시스템 대부분은 전역 최적성 인증 없이 국소 solver 위에서 돌아간다.

**Online certification과 규모 확장.** SE-Sync는 본질적으로 데이터를 모아 한 번에 푸는 배치(batch) 해법이다. Square Root SAM이 iSAM2로 증분화됐듯, certifiable solver 역시 새 측정이 들어올 때마다 인증서를 실시간으로 갱신하려는 연구가 warm-start, rank 증분, 부분 인증서 합성 등의 아이디어로 이어지고 있다. 도시 규모 그래프에서 무거운 moment relaxation solver의 속도를 끌어올리는 일 역시 갈 길이 멀다.

**극단적 outlier 환경의 일반화.** TEASER가 99% outlier를 뚫어 냈지만, 그 수학적 보장은 점군 정합 같은 특정 구조와 오염 조건 아래에서만 성립한다. 이를 일반적인 SLAM과 다중 모달 센서 문제로 넓히고, 그럴듯한 해석이 여러 개 공존할 때 단일 해 대신 후보 집합을 인증해 내는 list-decodable regression(Cheng, Shi, Carlone의 2024년 후속 연구 등)을 실용화하는 과제가 남아 있다.

---

Rosen, Khosoussi, Holmes, Dissanayake, Barfoot, Carlone이 공동 집필한 *The SLAM Handbook* 6장은 이 certifiable SLAM의 이론과 계보를 149~181쪽(2026년 4월 21일 공개본 기준)에 걸쳐 집대성한다. 한편 이들이 기하학적 인증의 대수학을 파고들던 같은 10년 동안, 또 다른 진영의 연구자들은 신경망이 이미지에서 곧바로 궤적과 지도를 예측하는 학습 기반 SLAM의 길을 넓히고 있었다(→ 23장 §23.4).

이제 1부와 2부에서 다룬 고전 기하(사진측량, 특징점, SfM)와 확률·그래프 최적화 backend(EKF, PTAM, g2o/iSAM2, SE-Sync)의 무기가 모두 손에 쥐어졌다. backend가 튼튼한 반석 위에 올라서자, 2010년대 중반 실전 Visual SLAM의 승부처는 다시금 *"어떻게 살아 움직이는 카메라의 이미지에서 특징을 뽑고, 방대한 키프레임을 엮어, 거대한 루프를 놓치지 않고 닫을 것인가"*라는 시스템 아키텍처의 문제로 돌아갔다. 그 모든 퍼즐을 하나로 조립해 낸 기념비적 시스템이 바로 **ORB-SLAM**이다(→ 8장).

# 8장 특징 기반 SLAM: ORB-SLAM

그래프 SLAM 연구가 성숙하면서 포즈 그래프 최적화는 SLAM backend의 표준으로 자리를 잡았다. Kümmerle 등(2011)의 g2o와 Kaess 등(2012)의 iSAM2 덕분에 대규모 지도도 거듭 최적화할 수 있게 됐고, loop closure에 드는 계산 비용도 실용적인 수준으로 내려왔다. backend가 튼튼해지자 자연스럽게 다음 질문이 frontend로 향했다. 영상에서 어떤 특징을 뽑아 어떻게 추적해야 수천 장의 프레임에 걸쳐 안정적인 제약을 만들어 낼 수 있을까?

단서 가운데 하나는 이미 2007년에 나와 있었다. Klein과 Murray의 PTAM은 tracking과 mapping을 두 스레드로 분리해 실시간 단안 SLAM의 가능성을 열었지만, 작은 실내 작업 공간을 벗어나지 못했다. 2015년 스페인 Zaragoza 대학의 Raúl Mur-Artal은 이 이원화 구조를 바탕으로 Rublee 등(2011)의 ORB 서술자, Gálvez-López와 Tardós(2012)의 DBoW2 장소 인식, 그리고 Strasdat의 covisibility 기반 지역 지도와 scale drift를 고려한 loop closing을 한데 엮어 ORB-SLAM을 완성했다. 그렇게 탄생한 ORB-SLAM 계열은 이후 10년 가까이 SLAM 연구의 기준선으로 쓰였다.

---

## 8.1 ORB-SLAM (2015)

2015년 IEEE Transactions on Robotics에 발표된 [Mur-Artal, Montiel & Tardós 2015. ORB-SLAM](https://doi.org/10.1109/TRO.2015.2463671)은 이름 그대로 ORB 특징점을 시스템 전체의 공통 언어로 삼은 단안 SLAM이다. 저자들은 tracking과 mapping뿐 아니라 relocalization과 loop closing까지 전 과정을 단 하나의 특징점 표현으로 일관되게 처리한 점을 첫 번째 기여로 내세웠다.

시스템은 Tracking, Local Mapping, Loop Closing이라는 세 스레드가 병렬로 맞물려 돌아간다. PTAM의 Tracking–Mapping 구조에 Loop Closing 스레드를 따로 덧붙여, DBoW2로 재방문 장소를 찾고 Essential graph 위에서 포즈 그래프 최적화를 돌리게 했다. 덕분에 지도를 고치고 루프를 닫는 무거운 작업이 진행되는 동안에도 Tracking 스레드는 끊김 없이 실시간 추적을 이어 갈 수 있었다(loop closure 뒤 전역 Bundle Adjustment를 전담하는 네 번째 스레드는 ORB-SLAM2에서 추가됐다).

논문에서는 frontend 특징점을 고른 기준도 분명히 못 박았다. 30 Hz 카메라 입력을 놓치지 않으려면 프레임당 특징 추출 시간이 33 ms보다 훨씬 짧아야 했는데, SIFT와 SURF는 약 300 ms, A-KAZE도 약 100 ms가 걸려 실시간 예산에 맞지 않았다. 반대로 계산이 빠른 BRIEF와 LDB는 회전 불변성이 없어 장소 인식에 쓰기 어려웠다. 두 조건을 모두 만족한 것이 Willow Garage의 Rublee 등이 2011년 ICCV에서 발표한 ORB(Oriented FAST and Rotated BRIEF)였다. FAST keypoint에 밝기 기반 방향을 부여하고 그 각도에 맞춰 BRIEF 비교 쌍을 회전시킨 ORB는 원 논문 기준으로 SIFT보다 약 100배 빨랐고, 당시 SIFT와 SURF를 얽어매던 특허·라이선스 제약에서도 자유로웠다. 게다가 binary 서술자라 GPU 없이 CPU만으로도 Hamming 거리를 계산해 빠르게 매칭할 수 있었다.

ORB-SLAM은 크기 변화와 회전 변화에 대응하기 위해 정교한 전처리를 거친다. 먼저 원본 영상을 1.2배씩 축소해 8단계 image pyramid를 만들고, 각 단계에서 FAST keypoint를 따로 검출한다. 이어 패치 안 픽셀 밝기의 1차 모멘트로 밝기 중심(intensity centroid)을 구한 뒤, keypoint에서 그 중심을 향하는 방향각 θ만큼 BRIEF 비교 쌍을 회전시켜 회전에 불변인 256비트 binary vector를 얻는다. 두 서술자 사이의 거리는 비트별 XOR 연산 뒤 1인 비트를 세는 Hamming 거리로 단번에 계산한다.

keyframe을 관리하는 전략도 PTAM과 정반대였다. 추적을 놓치지 않으려면 새 keyframe을 적극적으로 추가해야 하지만, 그대로 쌓아 두면 최적화가 금세 느려진다. ORB-SLAM은 일단 keyframe을 넉넉히 삽입한 뒤, **Covisibility graph**를 살펴 중복된 keyframe을 과감히 솎아 내는 전략을 택했다. Covisibility graph는 두 keyframe이 함께 관측하는 landmark가 15개 이상일 때 두 keyframe을 엣지로 잇고 그 개수를 가중치로 삼는 그래프다. Local Mapping은 이 그래프에서 현재 keyframe과 강하게 연결된 지역 window를 골라 그 안에서만 bundle adjustment를 돌린다.

한편 루프를 닫을 때는 그래프 전체를 그대로 쓰지 않고 **Essential graph**라는 더 희소한 골격을 꺼내 든다. Essential graph는 covisibility graph에서 함께 보는 landmark가 100개 이상인 엣지, spanning tree, 그리고 loop closure 엣지만 남긴 부분 그래프다. keyframe이 수천 개로 불어나도 Essential graph의 엣지 수는 적어 포즈 그래프 최적화가 몇 초 안에 끝난다.

loop closure의 방아쇠를 당기는 장소 인식은 [Gálvez-López & Tardós 2012. DBoW2](https://doi.org/10.1109/TRO.2012.2197158)가 맡는다. DBoW2는 binary 서술자로 vocabulary tree를 구축한 첫 기법으로, k-means++ seeding을 적용한 k-medians 군집화로 서술자를 계층적으로 묶어 트리 모양의 사전을 만든다. 원래 논문에서는 FAST keypoint와 BRIEF로 실험했고, ORB-SLAM은 같은 절차로 ORB vocabulary를 구축했다. 분기 수 $k_w$와 깊이 $L_w$로 이루어진 트리에서 말단 노드(word)의 수는 $k_w^{L_w}$가 되며, DBoW2와 ORB-SLAM 모두 $k_w=10$, $L_w=6$을 써서 단어 100만 개짜리 vocabulary를 구성했다. 각 word에는 데이터베이스 전체에서의 희귀도를 반영한 TF-IDF(Term Frequency–Inverse Document Frequency) 가중치가 매겨져, 장소를 잘 구별하는 단어일수록 더 큰 영향력을 행사한다. 새 프레임이 들어오면 서술자를 트리 깊이 $L_w$만큼 내려 보내 해당 word를 정하고, inverted index에서 그 word가 등장한 keyframe 목록만 조회하면 되므로 지도 전체를 훑지 않고도 루프 후보를 즉시 찾아낸다.

이렇게 짜인 구조 위에서 Tracking 스레드는 매 프레임 현재 자세를 추정한다. 직전 프레임과의 특징점 매칭으로 초기 자세를 잡은 뒤, 맵 포인트를 고정한 상태에서 현재 카메라 자세 $\mathbf{T}_{cw} \in SE(3)$만 다듬는 motion-only bundle adjustment를 푼다. 3D–2D 대응 $\{(\mathbf{X}_i, \mathbf{u}_i)\}$에 대한 기본 reprojection 목적함수는 다음과 같다.

$$\mathbf{T}^* = \arg\min_{\mathbf{T}} \sum_i \left\| \mathbf{u}_i - \pi(\mathbf{T}\mathbf{X}_i) \right\|^2$$

여기서 $\pi$는 카메라 투영 함수, $\mathbf{X}_i$는 맵 포인트의 월드 좌표, $\mathbf{u}_i$는 이미지 좌표를 뜻한다. 실제 최적화에서는 이상치의 영향을 줄이기 위해 robust loss와 관측 가중치를 함께 적용한다. 만약 추적을 잃으면 DBoW2로 비슷한 keyframe 후보를 찾은 뒤 EPnP와 RANSAC으로 초기 자세를 복구하는 relocalization에 들어간다. 한편 이웃 keyframe과 맵 포인트를 함께 다듬는 local BA는 Local Mapping 스레드가 이어받는다.

성능은 곧바로 수치로 입증됐다. KITTI 시퀀스 00(564×496 m 영역, keyframe 1,391개)에서 ORB-SLAM의 keyframe 궤적 RMSE는 6.68 m를 기록했다(논문 Table V, 다섯 번 실행한 값의 중앙값). 단안 시스템 특성상 절대 scale을 알 수 없어 참값과 비교할 때는 similarity 변환으로 궤적을 정렬해 오차를 쟀으며, 긴 주행에서 누적 오차를 붙잡아 준 주역은 바로 DBoW2와 Essential graph였다.

> 🔗 **차용.** ORB-SLAM의 Tracking–Local Mapping 이원 구조는 PTAM(Klein & Murray, 2007)에서 직접 이어졌다. 논문 서론 역시 PTAM의 핵심 설계를 토대로 삼았다고 밝힌다.

> 🔗 **차용.** 시스템의 이름 자체가 된 서술자는 Willow Garage의 Rublee, Rabaud, Konolige, Bradski가 발표한 [Rublee et al. 2011. ORB](https://doi.org/10.1109/ICCV.2011.6126544)다. Mur-Artal의 공헌은 검증된 부품들을 한데 꿰어 빈틈없는 파이프라인으로 조립한 데 있다.

> 🔗 **차용.** [Strasdat et al. 2011. Double Window Optimisation](https://doi.org/10.1109/ICCV.2011.6126517)은 PTAM의 frontend를 유지하되 covisibility graph로 고른 지역 지도에서만 추적하고, 안쪽 window에서는 BA를, 바깥 window에서는 포즈 그래프 최적화를 돌렸다. ORB-SLAM은 covisibility 기반 지역 지도 선택을 이 논문에서, 7자유도(similarity) 포즈 그래프로 루프를 닫는 발상을 Strasdat 등의 2010년 scale drift 연구에서 가져왔으며, 여기에 Essential graph라는 더 희소한 골격을 새로 얹었다.

## 8.2 ORB-SLAM2 (2017) — stereo/RGB-D

첫 번째 ORB-SLAM(2015)은 단안 카메라만을 위한 시스템이었다. 단안 영상만으로 복원한 지도와 궤적은 전체에 임의의 배율(scale)을 곱해도 투영 관측과 똑같이 맞기 때문에 실제 미터 단위의 크기를 복원할 수 없다.

2017년 발표된 [Mur-Artal & Tardós 2017. ORB-SLAM2](https://doi.org/10.1109/TRO.2017.2705103)는 stereo 카메라와 RGB-D 센서를 품어 이 scale 모호성을 정면으로 해결했다. stereo 카메라는 두 렌즈 사이의 간격(baseline)을 알기에 삼각측량으로 곧바로 깊이를 얻고, RGB-D 센서는 물리적으로 깊이를 직접 측정하므로 어느 쪽이든 첫 순간부터 절대 scale이 고정된다.

내부 아키텍처에서는 기존의 세 스레드 골격을 그대로 둔 채, loop closure가 끝난 뒤 전체 맵을 다듬는 전역 BA 전담 네 번째 스레드를 보탰다. 센서별로 달라지는 대목은 frontend의 입력 처리다. stereo 모드에서는 rectified 좌우 영상에서 ORB를 추출해 대응점을 찾고, 좌우 매칭에 성공한 점은 **stereo 관측**으로, 한쪽 영상에서만 잡힌 점은 **monocular 관측**으로 구분해 활용한다. 깊이가 계산된 stereo 점은 다시 baseline의 40배를 기준으로 가까운 점과 먼 점으로 나눈다. 가까운 점은 카메라의 translation을 정밀하게 붙잡아 주고, 먼 점은 시차 변화가 작아 회전 추정에 주로 기여하기 때문이다.

덕분에 **Stereo 초기화**는 단안처럼 두 프레임 사이의 시차를 기다릴 필요 없이 첫 프레임 한 장에서 곧바로 끝난다. 단안 초기화가 fundamental matrix나 homography에 기대어 임의 scale의 지도를 세웠다면, stereo는 첫 keyframe에서 좌우 영상의 수평 시차(disparity) $d$와 baseline $b$, 초점 거리 $f$로부터 깊이를 바로 계산한다.

$$Z = \frac{b \cdot f}{d}$$

ORB-SLAM2는 첫 프레임을 곧장 원점 keyframe으로 등록하고, 깊이를 구한 stereo 특징점 전체로 초기 지도를 띄운다. RGB-D 초기화도 원리는 같다. depth 영상의 픽셀 $(u, v)$에서 깊이 값 $Z$를 읽어 역투영(back-projection)으로 3D 좌표를 세우면 처음부터 scale이 정해진 지도가 만들어진다.

EuRoC MAV(Micro Aerial Vehicle) 데이터셋의 Machine Hall 01 시퀀스에서 stereo ORB-SLAM2는 translation RMSE 0.035 m를 달성하며(Table II), 같은 표에서 비교된 Stereo LSD-SLAM보다 높은 정확도를 보였다. 물론 한계도 드러나서, 심한 motion blur가 낀 V2_03 시퀀스에서는 추적을 일부 놓치기도 했다.

무엇보다 결정적이었던 것은 공개 방식이었다. Mur-Artal과 Tardós는 mono, stereo, RGB-D 세 모드를 하나의 깔끔한 C++ 코드베이스로 묶어 GitHub에 공개했고, ROS 예제까지 함께 실어 두었다. 저장소의 star는 수천 개를 넘어섰고, ORB-SLAM2는 연구실에서 곧바로 꺼내 쓸 수 있는 사실상의 표준 구현이 됐다.

---

## 8.3 ORB-SLAM3 (2021): Atlas와 Visual-Inertial

2021년 IEEE Transactions on Robotics에 실린 [Campos et al. 2021. ORB-SLAM3](https://doi.org/10.1109/TRO.2021.3075644)에서는 저자진이 세대교체를 이뤘다. Carlos Campos와 Richard Elvira가 공동 1저자를 맡고 Juan J. Gómez Rodríguez, J.M.M. Montiel, Juan D. Tardós가 함께 이름을 올렸으며, 모두 Zaragoza 대학 소속이되 Mur-Artal은 저자 목록에서 빠졌다.

ORB-SLAM3가 내놓은 핵심 확장은 **Atlas**(멀티맵 구조)와 **Visual-Inertial** 모드다. 먼저 Atlas는 서로 분리된 지도 여러 개를 하나의 시스템 안에서 함께 관리한다. 추적이 끊어졌을 때 기존 ORB-SLAM과 ORB-SLAM2는 현재 지도 안에서 relocalization을 시도할 뿐, 복구에 실패하면 앞선 지도를 유지한 채 새 지도를 띄우지 못했다. ORB-SLAM3는 추적이 실패하면 진행 중이던 지도를 닫고 곧바로 새 지도를 띄워 추적을 이어 가며, 나중에 로봇이 이전 지도의 영역을 다시 지나면 두 지도를 하나로 병합한다.

여기에 더해진 Visual-Inertial(VI) 모드는 카메라와 IMU 측정을 하나의 최적화로 묶는다. 카메라가 빠르게 회전해 영상이 흐려질 때도 IMU가 빈틈을 메워 추적을 지켜 줄 뿐만 아니라, 가속도계가 미터 단위의 가속도와 중력 방향을 재는 덕분에 단안 카메라로도 절대 scale을 복원할 수 있다. 관성 측정 처리는 Forster 등이 RSS 2015에서 처음 내놓고 2017년 IEEE TRO에 확장 발표한 [On-Manifold Preintegration for Real-Time Visual-Inertial Odometry](https://doi.org/10.1109/TRO.2016.2597321)를 따른다.

핵심 아이디어는 keyframe $i$와 $j$ 사이에 쏟아지는 IMU 측정을 매번 다시 적분하지 않고 미리 한 번만 묶어 두는 데 있다. 가속도계와 자이로스코프 측정을 각각 bias $\mathbf{b}$와 noise $\mathbf{n}$을 포함한 $\tilde{\mathbf{a}}_t = \mathbf{a}_t + \mathbf{b}_a + \mathbf{n}_a$, $\tilde{\boldsymbol{\omega}}_t = \boldsymbol{\omega}_t + \mathbf{b}_g + \mathbf{n}_g$로 모델링하면, 두 keyframe 사이의 상대 회전·속도·위치 증분은 다음과 같이 사전적분(preintegration)된다.

$$\Delta\mathbf{R}_{ij} = \prod_{k=i}^{j-1} \mathrm{Exp}\bigl((\tilde{\boldsymbol{\omega}}_k - \mathbf{b}_g)\Delta t\bigr)$$
$$\Delta\mathbf{v}_{ij} = \sum_{k=i}^{j-1} \Delta\mathbf{R}_{ik}\,(\tilde{\mathbf{a}}_k - \mathbf{b}_a)\Delta t$$
$$\Delta\mathbf{p}_{ij} = \sum_{k=i}^{j-1}\!\left[\Delta\mathbf{v}_{ik}\Delta t + \tfrac{1}{2}\Delta\mathbf{R}_{ik}\,(\tilde{\mathbf{a}}_k - \mathbf{b}_a)\Delta t^2\right]$$

여기서 $\mathrm{Exp}(\cdot)$는 $\mathfrak{so}(3)$의 지수 사상이다. bundle adjustment 도중 bias 추정값이 조금 바뀌더라도 처음부터 적분을 되풀이할 필요 없이 1차 선형 근사로 증분을 즉시 보정할 수 있다. ORB-SLAM3는 이렇게 만든 preintegrated 항($\Delta\mathbf{R}$, $\Delta\mathbf{v}$, $\Delta\mathbf{p}$)을 factor graph의 inertial edge로 꽂아 넣고 visual reprojection residual과 함께 최적화한다.

결과는 뚜렷했다. EuRoC MAV 11개 시퀀스의 평균 ATE(절대 궤적 오차) RMSE에서 mono-inertial ORB-SLAM3는 0.043 m를 기록해, 같은 표(Table II)에 오른 VINS-Mono(0.110 m)와 stereo-inertial Kimera(0.119 m)를 크게 앞섰다. 논문에서는 단일 세션 mono-inertial 기준으로 ORB-SLAM3가 VINS-Mono보다 2.6배 정확하다고 강조했다.

> 🔗 **차용.** ORB-SLAM3의 관성 항 처리는 Forster 등의 On-Manifold Preintegration(TRO 2017, 초판 RSS 2015)을 그대로 가져다 썼다. 연속된 IMU 측정을 bias 보정과 함께 SO(3) manifold 위에서 미리 적분해 둔 뒤, 그 결과를 factor graph 최적화의 제약으로 결합하는 구조다.

## 8.4 2020년대에도 비교 기준으로 쓰이는 이유

딥러닝 기반 SLAM이 쏟아진 2023년 이후에도 학회 논문의 비교표에는 여전히 ORB-SLAM3가 빠지지 않는다. 가장 큰 비결은 실용성과 견고함의 균형에 있다. ORB 특징점은 웬만한 조명 변화에 크게 흔들리지 않으며, binary 서술자 특유의 가벼운 계산 덕분에 프레임마다 많은 점을 뽑아도 실시간 처리를 유지해 추적 실패를 줄인다. 반면 학습 기반 특징점은 특정 벤치마크에서 더 정밀한 대응을 찾다가도, 학습 데이터와 동떨어진 환경에 놓이면 성능이 급격히 무너지곤 한다.

여기에 비교 실험의 편의성까지 겹쳤다. 단일 코드베이스가 mono, stereo, RGB-D, IMU 조합을 모두 지원하고 ROS와도 매끄럽게 연결되니, 새 알고리즘을 제안하는 연구자로서는 센서 설정별로 ORB-SLAM3를 나란히 세워 검증하기가 가장 수월하다.

물론 DROID-SLAM(Teed & Deng, NeurIPS 2021)처럼 여러 벤치마크에서 ORB-SLAM3보다 낮은 오차를 기록한 시스템도 등장했다. 하지만 DROID-SLAM을 실시간으로 돌리려면 고성능 GPU가 뒷받침되어야 한다(→ 16장 「아직 열린 문제」). 반면 ORB-SLAM3는 CPU만으로도 거뜬히 동작하며 ARM 임베디드 보드 위에서도 실행된다는 점이 여전히 큰 강점으로 남아 있다.

---

## 예측과 실제

> 📜 **예언 vs 실제.** 2015년 ORB-SLAM 논문의 Section IX-C(Future Work)에서 Mur-Artal은 두 가지 방향을 짚었다. 첫째는 시차가 작아 지도에 올리지 못한 먼 점(points at infinity)을 tracking에 활용해 카메라 회전을 더 정밀하게 붙잡자는 제안이었고, 둘째는 정확하게 추정한 keyframe과 풍부한 covisibility 정보를 골격 삼아 희소한 지도를 조밀한(dense) 복원으로 키우자는 구상이었다. 먼 점 활용은 후속 VI-SLAM과 여러 연구에 일부 스며들었고, 희소한 keyframe 위에 조밀한 표현을 얹는 발상은 2020년대 NeRF-SLAM과 Gaussian Splatting 기반 SLAM에서 꽃을 피웠다. 정작 그 절에 적히지 않았던 stereo, RGB-D, IMU 통합이 ORB-SLAM2(2017)와 ORB-SLAM3(2021)를 통해 현실이 됐다는 점도 흥미롭다.

> 📜 **예언 vs 실제.** Campos 등(2021)은 ORB-SLAM3 논문 결론에서 텍스처가 부족한 환경을 가장 잦은 실패 원인으로 꼽으며, 자신들이 정식화한 네 가지 data association 문제에 photometric 기법을 접목하는 방향을 유망한 과제로 들었다. 실제로 저자들은 이 아이디어를 인체 내부 내시경 영상으로 지도를 만드는 연구에 시험하고 있었다. 그러나 2023–2025년의 실제 흐름은 DSO나 LDSO 같은 direct 방식과 별개로, ORB-SLAM3의 앞단에 SuperPoint나 LightGlue 같은 learned frontend를 갈아 끼우는 쪽으로 더 활발히 움직였다. 그럼에도 ORB-SLAM3 공식 저장소의 main branch는 2026년 현재까지도 여전히 전통적인 ORB 서술자를 기본값으로 유지하고 있다.

---

## 아직 열린 문제

**지도의 장기 재사용.** Atlas로 여러 지도를 따로 보관하다 합칠 수는 있게 됐지만, 조명이 극단적으로 달라지면 지도 병합 자체가 막힌다. 아침에 만든 지도를 저녁에 다시 찾아와 연결하려 해도 겉모습이 너무 달라지면 DBoW2가 같은 장소로 알아채지 못한다. 날씨와 계절이 바뀌는 실외 환경에서 지도를 장기간 재사용하는 일은 여전히 해결해야 할 과제다.

**전통 feature는 아직 기준선인가.** SuperPoint와 SuperGlue, LightGlue, DINOv2 기반 특징점을 얹은 시스템들이 표준 벤치마크에서 ORB-SLAM3보다 낮은 오차를 기록하기 시작했다. 하지만 학습 분포를 벗어난 낯선 환경에서는 여전히 전통적인 ORB보다 못한 결과를 내는 사례가 보고된다.

**넓은 실외의 drift.** 수 km를 달리는 도심 주행에서는 ORB-SLAM3도 LiDAR SLAM의 정밀도를 따라잡지 못한다. 시시각각 변하는 조명과 날씨, 움직이는 차량, 텍스처 없는 도로 구간이 겹치면 서서히 drift가 쌓여 버린다.

---

ORB-SLAM 세 편이 특징점 기반 SLAM의 기준을 세우던 바로 그 시기, Newcombe와 Engel은 특징점 추출 자체를 건너뛰고 픽셀 밝기 값을 직접 최적화하는 정반대 접근법을 밀어붙이고 있었다. 두 진영은 2010년대 내내 서로를 겨누며 발전했고, 실제로 DSO 논문에서는 loop closure와 relocalization을 끈 단안 ORB-SLAM과 비교해 TUM monoVO와 ICL-NUIM에서 더 높은 정확도를 보였다고 보고했다(→ 11장 §11.3). 한편 ORB-SLAM3가 단안 카메라의 한계를 넘기 위해 끌어다 쓴 IMU 사전적분(preintegration)은 그 자체로 독자적인 수학적 계보를 이루고 있었다. 다음 장에서는 2009년 시드니에서 싹터 SO(3) 다양체 위에서 완성된 이 관성 적분의 역사를 따라간다.

---

# 9장 IMU 사전적분

2009년 시드니 대학교 ACFR(Australian Centre for Field Robotics)의 Todd Lupton과 Salah Sukkarieh는 빠르게 기동하는 플랫폼에서 쏟아지는 IMU 측정을 SLAM 추정기에 어떻게 넣을지 고민하고 있었다. IMU는 1초에 수백 번씩 데이터를 내보내지만, 영상 keyframe은 1초에 몇 장 남짓이다. 그 사이에 쌓이는 수십, 수백 개의 관성 측정을 하나의 제약으로 압축해 다룰 방법이 필요했다. 두 사람이 IROS 2009에 발표한 논문이 바로 preintegration(사전적분)의 출발점이었다. 6년 뒤인 2015년 RSS에서 Christian Forster는 Luca Carlone, Frank Dellaert, Davide Scaramuzza와 손잡고 이 아이디어를 SO(3) manifold 위에서 엄밀하게 다시 세웠다. 그래서 오늘날 ORB-SLAM3, VI-DSO, LIO-SAM 같은 대표 시스템들은 수식을 새로 유도하지 않고 Forster의 논문을 그대로 인용한다(→ 8장, 11장, 21장). 반면 FAST-LIO는 preintegration 대신 IMU 원측정으로 상태를 곧장 전파한 뒤 iterated filter로 갱신하는 다른 길을 택했다.

---

## 9.1 MEMS IMU의 보급

preintegration 이론이 현실적인 필요로 떠오른 배경에는 IMU의 극적인 가격 하락이 있다. 관성항법 자체는 1950년대 항공우주 분야에서 시작됐지만, 잠수함이나 미사일에 들어가던 ring laser gyro는 수만 달러를 호가해 로봇 연구자가 쉽게 만질 수 있는 장비가 아니었다. 이 장벽을 허문 것이 반도체 공정으로 만든 초소형 기계 소자 MEMS(Micro-Electro-Mechanical Systems)였다. Analog Devices의 ADXL 가속도계와 InvenSense의 MPU 시리즈가 보급되면서 6축 IMU 가격이 몇 달러 수준으로 떨어졌고, 2007년 첫 iPhone에 가속도계가, 2010년 iPhone 4에 자이로스코프가 차례로 탑재됐다. 스마트폰이 수십억 대씩 팔리며 센서 단가가 급락하던 바로 그 무렵, Visual SLAM 연구자들은 단안 카메라가 풀지 못하던 scale 모호성(→ 5장 「아직 열린 문제」)을 해결할 현실적인 짝을 찾고 있었다.

MEMS IMU의 측정 모델 자체는 간결하다. 가속도계는 중력이 섞인 비력(specific force) $\tilde{\mathbf{a}} = \mathbf{R}_w^b(\mathbf{a}^w - \mathbf{g}^w) + \mathbf{b}^a + \boldsymbol{\eta}^a$를 재고, 자이로스코프는 각속도 $\tilde{\boldsymbol{\omega}} = \boldsymbol{\omega}_b^b + \mathbf{b}^g + \boldsymbol{\eta}^g$를 잰다. 여기서 $\mathbf{b}$는 bias, $\boldsymbol{\eta}$는 white noise다. 수식은 간단해 보이지만 실제 MEMS 소자는 다루기가 만만치 않다. 고주파 잡음이 큰 데다, bias는 시간에 따라 서서히 흐르기 때문에 random walk로 모델링해야 하고, 온도와 전원 상태에 따라서도 조금씩 요동친다. 게다가 가속도계 측정에는 언제나 중력이 함께 실려 있으므로, IMU를 쓰는 시스템은 중력 방향을 함께 추정해 world frame을 중력축에 맞춰 정렬한다.

---

## 9.2 첫 시도: Lupton & Sukkarieh (2009 / 2012)

이론적 난관은 카메라와 IMU 사이의 극심한 측정 주기 차이에서 비롯됐다. iSAM2 같은 그래프 기반 추정기는 keyframe마다 pose 노드를 하나씩 세운다. 그런데 두 keyframe 사이에도 IMU는 수십 번씩 측정을 뱉어 낸다. 관성 측정마다 노드를 새로 세우면 그래프가 감당할 수 없을 만큼 비대해지고, 그렇다고 중간 측정을 버리면 귀중한 동역학 정보를 잃는다.

Lupton과 Sukkarieh는 IROS 2009 논문 [Efficient Integration of Inertial Observations into Visual SLAM without Initialization](https://doi.org/10.1109/IROS.2009.5354267)에서 이 딜레마를 정면으로 풀었고, 2012년 IEEE TRO에 확장판 [Visual-Inertial-Aided Navigation for High-Dynamic Motion in Built Environments Without Initial Conditions](https://doi.org/10.1109/TRO.2011.2170332)을 실었다. 핵심 발상은 keyframe $i$와 $j$ 사이의 IMU 측정을 *단 한 번만* 적분해 상대 증분을 미리 구해 두는 것이었다. 이 증분은 로봇의 초기 자세나 속도를 전혀 모르는 상태에서도 계산할 수 있어, 이를 하나의 factor로 묶어 두면 수많은 IMU 원측정을 일일이 추정기에 넣지 않고도 관성 정보를 고스란히 살릴 수 있다. "pre-integration"이라는 이름도 바로 이 논문에서 태어났다.

하지만 초기 구현에는 두 가지 걸림돌이 남아 있었다. 첫째, 회전을 Euler angle로 표현한 탓에 gimbal lock 같은 특이점이 생겼고 회전 공간이 지닌 manifold 구조도 제대로 반영하지 못했다. 둘째는 더 근본적인 문제인 bias였다. 최적화를 한 바퀴 돌 때마다 bias 추정값이 조금씩 바뀌는데, 그때마다 keyframe 사이의 IMU 측정 수백 개를 처음부터 다시 적분하면 실시간성이 무너진다. Lupton과 Sukkarieh는 이를 피하려고 bias 변화량에 맞춰 증분을 1차 근사로 고치는 방법을 함께 제안했고, 6년 뒤 Forster 팀이 바로 이 보정을 SO(3) 위에서 말끔하게 재정식화했다.

## 9.3 Forster 등의 on-manifold preintegration (2015 / 2017)

2015년 RSS에서 취리히 대학교(UZH) 박사과정생 Christian Forster는 지도교수 Davide Scaramuzza, 그리고 Georgia Tech의 Luca Carlone(이후 MIT)과 GTSAM 개발자 Frank Dellaert와 함께 [IMU Preintegration on Manifold for Efficient Visual-Inertial Maximum-a-Posteriori Estimation](https://www.roboticsproceedings.org/rss11/p06.pdf)을 발표했다. 2년 뒤인 2017년에는 IEEE TRO에 확장판 [On-Manifold Preintegration for Real-Time Visual-Inertial Odometry](https://doi.org/10.1109/TRO.2016.2597321)가 실렸다. 저자들은 GTSAM의 iSAM2 위에 VIO를 구현한 뒤, VI-Sensor로 기록한 430 m 실내 궤적과 Google Tango 기기를 들고 사무실 건물 둘레를 걸은 실외 궤적으로 성능을 검증했다.

Forster 등의 핵심 해법은 세 단계로 요약된다. 먼저 $\Delta\mathbf{R}_{ij}$를 SO(3) 위의 상대 회전으로 엄밀하게 정의했다. 이어 $\Delta\mathbf{v}_{ij}$와 $\Delta\mathbf{p}_{ij}$를 *중력과 초기 상태에 완전히 독립*이 되도록 재정의했다. 이렇게 만든 양은 실제 물리적 속도 변화량이나 위치 변화량과 그대로 일치하지는 않는다. 하지만 이 preintegration 값을 고정해 두면, 추정 상태가 바뀔 때마다 적분을 새로 할 필요 없이 IMU factor를 몇 번이고 다시 평가할 수 있다(양 끝의 pose·속도·중력·bias 보정은 residual 식 안에서 결합된다). 그다음 잡음 항을 지수 사상 바깥으로 끌어내는 right Jacobian 기법을 써서 공분산 $\boldsymbol{\Sigma}_{ij}$를 해석적으로 전파했다.

마지막 퍼즐은 **bias 1차 Jacobian 보정**이었다. keyframe 사이를 처음 적분할 때 bias에 대한 편미분을 미리 계산해 두면, 최적화 도중 bias 추정값이 조금 변하더라도 적분을 되풀이하지 않고 1차 근사로 증분을 즉시 고쳐 factor를 갱신할 수 있다. 이 계산 절감 덕분에 IMU factor는 비로소 대규모 실시간 그래프 최적화에 자연스럽게 녹아들었다.

저자들은 이 preintegration 구현을 GTSAM 4.0에 오픈소스로 공개했다. 이후 수많은 VIO와 LIO 시스템이 수식을 밑바닥부터 다시 짜는 대신 GTSAM의 `ImuFactor`를 `#include`해 쓰기 시작했다.

> 🔗 **공통 수학.** Forster의 on-manifold preintegration은 SO(3)의 지수 사상과 right Jacobian을 축으로 회전의 불확실성을 다룬다. [Barfoot 2017. *State Estimation for Robotics*](https://doi.org/10.1017/9781316671528)는 바로 이 Lie group 계산을 로봇 상태 추정 전반의 공통 언어로 엮어 낸 책이다. 출간 시점은 Forster의 2015년 논문보다 2년 늦지만, 두 작업은 같은 수학적 토대 위에 서 있다.

> 🔗 **차용.** bias 1차 보정의 원형은 [Lupton & Sukkarieh 2012](https://doi.org/10.1109/TRO.2011.2170332)에서 나왔다. Forster 등도 자신들의 보정이 Lupton과 Sukkarieh의 방식과 닮았으되 SO(3) 위에서 직접 작동한다는 점을 논문에서 명시했다("similar to the bias correction in [Lupton & Sukkarieh] but operates directly on SO(3)").

## 9.4 실제 VIO 시스템

2007년부터 2022년 사이에 등장한 VIO 시스템은 크게 필터 기반, 최적화 기반, 그리고 direct 방식이라는 세 줄기로 나뉜다. 흥미롭게도 필터 기반 VIO는 Forster의 논문보다 훨씬 먼저 출발했다. 2007년 University of Minnesota의 Anastasios Mourikis와 Stergios Roumeliotis가 ICRA에 발표한 [MSCKF(Multi-State Constraint Kalman Filter)](https://doi.org/10.1109/ROBOT.2007.364024)는 stochastic cloning(과거 상태를 복제해 필터 안에 남겨 두는 기법)으로 이전 카메라 자세 여러 개를 상태 벡터에 유지했다. 반면 관측된 3D 점은 상태에 넣지 않고, 선형화한 관측식을 점 Jacobian의 left null space로 투영해 점 위치 오차가 상태 추정에 스며들지 않게 소거했다. preintegration 없이도 EKF만으로 실시간 VIO를 구현한 이 선구적 설계는 2021년 화성 하늘을 난 NASA JPL의 Ingenuity 헬리콥터에도 이어졌다. Ingenuity의 항법 필터 MAVeN 역시 base image 시점의 위치와 자세를 clone state로 유지하는 EKF 구조였다. 또 2020년에는 University of Delaware의 Guoquan Huang 그룹이 MSCKF 기반 오픈소스 시스템 [OpenVINS](https://doi.org/10.1109/ICRA40945.2020.9196524)를 공개해 연구자들이 널리 쓰게 됐다.

최적화 기반 VIO의 간판은 HKUST의 Tong Qin, Peiliang Li, Shaojie Shen이 2018년 TRO에 발표한 [VINS-Mono](https://doi.org/10.1109/TRO.2018.2853729)였다. VINS-Mono는 preintegration한 IMU 측정을 sliding window 방식의 tightly-coupled BA에 factor로 넣고, 초기화 단계에서 scale과 중력 방향을 체계적으로 분리 추정하는 절차까지 완비했다. 코드까지 깔끔하게 공개되자 2019–2022년 학회 논문들이 앞다투어 VINS-Mono를 비교 기준으로 삼았다.

한편 direct 방식에서는 TUM Cremers 그룹이 VI-DSO(ICRA 2018)와 [DM-VIO(RA-L 2022)](https://doi.org/10.1109/LRA.2021.3140129)로 계보를 이었다. VI-DSO는 DSO의 photometric BA에 inertial factor를 결합했고, DM-VIO는 여기에 *delayed marginalization*을 보탰다. IMU 초기화가 채 끝나기 전에 옛 keyframe을 marginalize하면 틀린 scale이 prior에 영구히 박혀 버린다. DM-VIO는 주 그래프 옆에 marginalization을 일정 keyframe만큼 늦춰 처리하는 보조 factor graph를 하나 더 두어 이 문제를 피했다. IMU 초기화가 안정된 뒤에야 보조 그래프에 IMU factor를 넣어 다시 marginalize하고, 그렇게 정제된 새 prior를 주 시스템에 넘기는 방식이다.

## 9.5 Observability

VIO가 아무리 정교해져도 관측 정보 자체가 부족하면 해가 하나로 모이지 않는다. 2014년 Minnesota의 Hesch, Kottas, Bowman, Roumeliotis는 TRO 논문에서 외부 기준이 없는 visual-inertial 시스템에는 원리적으로 관측할 수 없는 방향이 **넷** 존재한다는 사실을 증명했다. 전역 위치 3자유도와 중력축을 중심으로 한 회전(yaw) 1자유도다. 세상 전체를 이 네 방향으로 평행이동하거나 회전시켜도 카메라 영상과 IMU 측정값은 털끝만큼도 달라지지 않는다. 전역 위치를 잡으려면 GPS가, yaw를 잡으려면 지자기 센서나 외부 랜드마크가 추가로 필요하다.

이와 달리 *roll과 pitch는 언제나 관측된다*. 가속도계가 늘 중력 벡터의 방향을 재어 수평 기준을 잡아 주기 때문이다. 단안 카메라의 scale 역시 IMU를 붙이면 관측 가능해지지만, 여기에는 운동이 충분해야 한다는 단서가 따른다.

실무에서 더 까다로운 대목은 바로 **degenerate motion**(관측 정보가 빈약해지는 운동)이다. 전역 yaw가 원천적으로 비관측인 상태에서 시차나 가속 변화까지 부족해지면 깊이·scale·bias가 서로 얽혀 구분되지 않는다. 드론이 제자리에 떠서 호버링하거나 자동차가 일정한 속도로 반듯하게 직진할 때가 대표적인 함정이다. 이륙·제동·선회 같은 가감속 기동이 정보를 불어넣어 주기는 하지만, 특정 동작 하나만으로 모든 상황에서 scale 추정이 보장되지는 않는다.

> 📜 **예언 vs 실제.** Forster 등(2017)은 TRO 논문 결론(§IX)에서 장황한 미래 과제를 늘어놓는 대신 preintegration과 structureless vision factor 코드를 GTSAM 4.0에 공개한다고 적는 것으로 갈음했다. 이후 실제 현장에서 카메라와 IMU 사이의 시간 offset은 Kalibr, VINS-Mono, OpenVINS가 앞다투어 추정 변수에 포함시키면서 표준적인 보정 항목으로 굳어졌고, 센서 시각이 아예 어긋나는 비동기 문제는 Le Gentil의 GP 연속시간 preintegration이라는 새로운 해법으로 이어졌다.

## 9.6 연속시간 preintegration

2021년 RSS에서 UTS(University of Technology Sydney)의 Cédric Le Gentil과 Teresa Vidal-Calleja는 [Continuous Integration over SO(3) for IMU Preintegration](https://roboticsproceedings.org/rss17/p078.pdf)을 발표했다. UTS가 Lupton의 연구실 ACFR과 같은 시드니에 자리 잡고 있다는 점도 묘한 우연이다.

Forster의 preintegration은 본질적으로 이산적이다. 인접한 IMU 표본 사이에서는 값이 일정하다고 보고 구간 적분을 쌓아 간다. 그런데 측정 시각이 IMU와 엇갈리는 LiDAR나 event camera 같은 센서가 들어오면 IMU 표본과 표본 사이의 임의 시각 $\tau$에서의 상태가 필요해진다. 시각이 어긋난다고 구간 상수 근사가 당장 무너지는 것은 아니지만, 시간 보간의 정밀도가 시스템 전체의 성능을 좌우한다. Le Gentil은 각속도를 **Gaussian Process**(GP)로 모델링해 연속 함수로 다루면서, 임의의 시각 $\tau$에서도 상태를 즉시 뽑아낼 수 있게 했다. 이를 바탕으로 비동기 센서 측정을 매끄럽게 융합할 뿐 아니라 IMU bias와 센서 간 시간 차이까지 함께 보정하는 방법을 제시했다.

이 시도는 곧 B-spline, STEAM, GPMP로 이어지는 더 넓은 연속시간 궤적 추정 연구와 맞닿는다(10장).

---

## 9.7 가져온 것

> 🔗 **차용.** IMU factor를 factor graph 안에서 평가하고 최적화하는 골격은 [Dellaert의 GTSAM](https://gtsam.org/) 설계를 그대로 따른다. `ImuFactor`가 GTSAM의 `NoiseModelFactor` 인터페이스를 구현하기 때문에, 개발자는 visual reprojection factor와 inertial factor를 하나의 `Values` 객체 안에 나란히 넣고 함께 최적화할 수 있다.

> 🔗 **차용.** bias를 random walk로 모델링하는 관행은 오래된 Kalman filter 상태 전파에서 물려받았다. 항법 공학에서는 Lupton 이전부터 bias를 상태 변수에 넣고 작은 process noise를 주는 방식을 써 왔고, preintegration에서는 이 관습이 bias random walk factor라는 그래프 노드로 옷을 갈아입었다.

---

## 아직 열린 문제

**관측 가능성을 실시간으로 감지하기.** 4차원 null space와 degenerate motion의 수학은 이미 정립됐다. Huang, Mourikis, Roumeliotis가 제안한 FEJ(First-Estimate Jacobian)처럼 선형화 과정에서 null space를 훼손하지 않는 기법도 자리 잡았다. 하지만 실제 운용 중에 지금 막 관측 정보가 사라지는 구간에 진입했는지, 언제 빠져나왔는지를 실시간으로 진단해 제어 루프에 경고해 주는 일은 여전히 미완으로 남아 있다.

**Preintegration과 continuous-time의 통합.** Forster의 이산 증분과 Le Gentil의 GP 연속 표현은 본질적으로 같은 관성 적분 문제를 서로 다른 수학으로 푼다. LiDAR, event camera, 일반 카메라가 뒤섞인 이종 센서 시스템에서 어떤 표현을 기본 뼈대로 삼아야 가장 효율적인지는 아직 합의되지 않았다(→ 10장).

**학습 기반 IMU bias 모델.** bias가 순한 random walk를 따른다는 가정은 고가의 navigation-grade IMU에서는 꽤 잘 맞지만, 값싼 consumer MEMS에서는 온도에 따른 이력 현상(hysteresis)과 전원 과도 현상 때문에 종종 어긋난다. TLIO와 RoNIN 같은 연구는 신경망으로 IMU만 쓰는 odometry를 학습했고, 최근에는 conditional diffusion으로 bias 분포를 직접 모델링하려는 시도까지 등장했다. 이렇게 학습된 복잡한 오차 모델을 Forster 방식의 factor graph에 어떻게 녹여 낼지는 아직 풀리지 않은 문제다.

---

Le Gentil의 연속시간 preintegration에서 보듯, 문제는 관성 센서에 그치지 않는다. 카메라의 셔터가 행마다 차례로 열리거나 LiDAR가 회전하며 점을 찍을 때, 이산적인 keyframe이라는 전제 자체가 흔들리기 시작한다. 다음 장에서는 아예 궤적을 시간의 연속 함수로 세우는 연속시간 궤적 추정(→ 10장)을 살펴본다.

# 10장 연속시간 궤적 추정

preintegration은 수백 개의 IMU 측정을 이산적인 두 keyframe 사이의 상대 factor 하나로 압축해 냈다. 하지만 이 영리한 압축에는 keyframe이라는 단위가 또렷하게 존재한다는 전제가 깔려 있다. 양 끝의 시각이 명확히 찍히는 global shutter 카메라라면 문제될 것이 없다. 그러나 현실의 모든 센서가 그렇게 깔끔하게 한 순간을 포착하지는 않는다.

소비자용 rolling shutter 카메라는 이미지 한 장 안에서도 위쪽 행과 아래쪽 행이 서로 다른 시각에 찍힌다. 회전하는 spinning LiDAR가 한 바퀴를 도는 사이에도 차량은 계속 앞으로 나아간다. 게다가 IMU, 카메라, LiDAR는 제각기 다른 주기로 데이터를 쏟아 낸다. 2012년 ICRA에서 [Paul Furgale, Timothy Barfoot, Gabe Sibley](https://doi.org/10.1109/ICRA.2012.6225005)는 아예 로봇의 자세를 시간 $t$의 연속 함수로 세워 이 모든 비동기 측정을 하나의 확률적 batch 추정 문제로 엮었다. "Continuous-time batch estimation using temporal basis functions"라는 제목의 이 논문에서 세 사람은 유한한 개수의 시간 기저 함수(temporal basis function) 계수를 상태 변수로 추정했다.

이 발상은 이후 rolling shutter 카메라, spinning LiDAR, event camera처럼 한 프레임이나 한 scan 안에서도 측정 시각이 계속 변하는 센서들을 다루는 표준 도구로 번져 나갔다. 이산 keyframe을 중심에 둔 visual-inertial preintegration(→ 9장)과 나란히, 시간을 연속으로 모델링하는 또 하나의 축이 세워진 것이다.

---

## 10.1 Discrete-time의 한계

preintegration이 해결한 것은 IMU가 카메라보다 훨씬 자주 측정값을 내면서 생기는 주기 차이였다. 하지만 실제 다중 센서 SLAM에서 시간과 얽힌 골칫거리는 거기서 그치지 않는다.

고전적인 이산 SLAM은 추정기가 정한 keyframe 시각에 맞추어 상태 노드를 세운다. 그러나 **Rolling shutter** 카메라는 한 프레임을 위에서 아래로 훑으며 읽어 들이기 때문에 카메라가 빠르게 회전하면 첫 행과 마지막 행이 서로 다른 자세에서 노광된다. DSO나 LSD-SLAM처럼 프레임당 자세를 하나만 두는 모델은 이 왜곡을 담아내지 못한다(→ 11장). **Spinning LiDAR의 motion distortion**도 같은 뿌리에서 나온다. 예를 들어 Velodyne HDL-64E가 10 Hz로 회전할 때 차량이 10 m/s로 달리면, 한 scan을 채우는 100 ms 동안 차가 1 m를 이동해 점마다 찍힌 자세가 달라진다. LOAM은 odometry 루프 안에서 이 왜곡을 간접적으로 펴 주었지만, 더 일반적인 해법은 각 점의 측정 시각에 해당하는 자세를 직접 조회할 수 있는 연속 궤적이다.

아예 프레임이라는 개념이 없는 센서도 있다. **Event camera**(DVS)는 픽셀 밝기가 변할 때마다 μs 단위로 비동기 이벤트를 뿜어 낸다. Mueggler, Gallego, Scaramuzza가 [RSS 2015 논문](https://www.roboticsproceedings.org/rss11/p36.pdf)에서 궤적을 SE(3) 위의 cubic B-spline으로 세워 event 기반 궤적 추정을 정식화한 것도 프레임 단위가 통하지 않았기 때문이다. 여기에 200 Hz IMU, 20 Hz 카메라, 10 Hz LiDAR처럼 **주기가 다른 여러 센서**를 함께 묶는 상황까지 겹치면 이산 그래프는 한계에 부딪힌다. 측정이 들어오는 시각마다 상태 노드를 세우면 그래프가 감당할 수 없이 커지기 때문이다.

이 모든 문제의 본질은 같다. 측정 시각 $t_i$를 추정기가 아니라 센서가 결정한다는 점이다. 연속시간 표현은 측정 시각, 상태 추정 시각, 궤적 조회 시각을 서로 분리해 이 얽힘을 풀어낸다.

## 10.2 Parametric spline

2012년 Furgale·Barfoot·Sibley가 연속 궤적을 세우기 위해 꺼내 든 도구는 B-spline이었다. 궤적을 기저 함수의 합 $\mathbf{p}(t) = \sum_k \Psi_k(t)\,\mathbf{c}_k$로 표현하고, 제어점 계수 $\mathbf{c}_k$를 최적화 변수로 잡는 방식이다. B-spline의 가장 큰 무기는 local support(국소 지지) 성질이다. 임의의 시각 $t$에서 값이 0이 아닌 기저 함수가 보통 4개 안팎으로 제한되므로, 어느 시각 $t_i$의 자세든 상수 시간 비용으로 조회할 수 있을 뿐 아니라 factor graph의 희소성(sparsity)도 고스란히 지켜진다.

다만 제어점 간격을 사람이 경험적으로 골라야 한다는 부담이 있었다. 간격이 너무 좁으면 잡음에 과적합되고, 너무 넓으면 급격한 기동을 따라가지 못한다. 게다가 유클리드 공간의 선형 B-spline을 그대로 적용하면 보간된 자세가 SE(3) 다양체를 벗어나 버린다.

이 걸림돌은 이듬해 BMVC 2013에서 해결됐다. [Steven Lovegrove, Alonso Patron-Perez, Gabe Sibley](https://doi.org/10.5244/C.27.93)는 "Spline Fusion"이라는 이름으로 cumulative B-spline을 제안했다. 기저 함수를 누적 곱 형태인 $T(t) = \prod_k \exp\bigl(\tilde\Psi_k(t) \log(T_k T_{k-1}^{-1})\bigr) \cdot T_0$로 다시 쓰면 각 항이 지수 사상을 통해 Lie group 안에 안전하게 머문다. 이 우아한 공식은 곧 rolling shutter, event camera, VIO 연구의 단골 도구가 됐다. Basalt와 Mueggler의 event 궤적 추정뿐 아니라 [Kerl·Stückler·Cremers의 ICCV 2015 dense rolling shutter RGB-D 추적](https://doi.org/10.1109/ICCV.2015.261)도 모두 이 cumulative B-spline 위에 세워졌다.

parametric spline은 계산이 가볍고 구현이 단순해 실시간 VIO와 event 시스템에서 오래 사랑받았다. 다만 별도의 motion prior를 얹지 않는 한 관측이 드문 구간의 매끄러움은 기저 함수와 제어점 배치에 맡겨야 한다(물론 계수나 미분에 prior를 추가할 수는 있다). 바로 이 지점에서 spline은 궤적의 사전 분포 자체를 출발점으로 삼는 Gaussian Process(GP) 방식과 갈라진다(→ §10.3).

> 🔗 **차용.** B-spline의 수학적 기초는 [de Boor (1978) *A Practical Guide to Splines*](https://link.springer.com/book/10.1007/978-1-4612-6333-3)에 집대성되어 있다. Furgale 등은 이 고전적인 스플라인 보간을 로봇 자세 궤적으로 옮겨 와 제어점 계수를 상태 추정 변수로 삼았다.

## 10.3 SDE 기반 GP와 STEAM

2014년 토론토 대학의 Barfoot 그룹은 spline과는 결이 다른 비모수적 해법을 들고 나왔다. Barfoot, Tong, Särkkä는 RSS 2014 논문 ["Batch Continuous-Time Trajectory Estimation as Exactly Sparse Gaussian Process Regression"](https://www.roboticsproceedings.org/rss10/p01.pdf)에서 궤적 전체를 하나의 Gaussian Process(가우시안 과정)로 모델링했다. 커널 $\mathcal{K}(t, t')$로 궤적의 사전 분포를 깔아 두고, 센서 관측이 들어오면 조건부 가우시안 분포로 사후 궤적(posterior)을 구하는 접근이다.

원래 GP 회귀에는 치명적인 약점이 있다. 관측 수 $N$이 늘어나면 $N \times N$ 커널 행렬 $K$의 역행렬을 구하는 데 $O(N^3)$ 비용이 들어 실시간 SLAM에 쓸 수 없다는 점이다. Barfoot, Tong, Särkkä는 특정 조건을 만족하는 커널 부류가 이 병목을 완벽히 우회한다는 사실을 짚어 냈다. 궤적이 선형 시불변 확률 미분 방정식(linear time-invariant SDE) $\dot{\mathbf{x}}(t) = A\mathbf{x}(t) + L\mathbf{w}(t)$의 해로 정의되면, 정밀도 행렬 $K^{-1}$이 정확히 block-tridiagonal 형태를 띤다. 이를 factor graph 언어로 번역하면 인접한 상태 노드 사이에만 binary factor가 걸리고 멀리 떨어진 노드 사이에는 연결이 없는 희소한 사슬 구조가 된다.

이 이론은 곧 **STEAM**(Simultaneous Trajectory Estimation and Mapping)이라는 구체적인 프레임워크로 열매를 맺었다. Sean Anderson과 Barfoot은 2015년 IROS 논문 ["Full STEAM Ahead"](https://doi.org/10.1109/IROS.2015.7353368)에서 SE(3) 위에 constant-velocity prior를 세워 STEAM을 정식화했다. 상태는 자세와 body-centric 속도로 이루어지며, 속도는 백색 잡음의 적분만큼 흔들리고 자세는 그 속도를 따라 흘러간다. 같은 해 Anderson, Barfoot, Tong, Särkkä는 이 틀을 비선형 운동 모델로까지 넓힌 저널 논문 ["Batch nonlinear continuous-time trajectory estimation as exactly sparse Gaussian process regression"](https://doi.org/10.1007/s10514-015-9455-y)을 *Autonomous Robots*에 실었다.

STEAM의 또 다른 장점은 GP 보간이다. 몇 개의 제어점(control pose)만 상태 노드로 두고, 그 사이 임의 시각의 자세는 GP posterior mean으로 즉시 보간해 꺼내 쓸 수 있다. 예를 들어 spinning LiDAR 한 scan에 점 10,000개가 각기 다른 타임스탬프를 달고 들어와도 제어점은 scan당 하나만 세우면 된다(물론 10,000개 점 각각의 residual을 계산해 더하는 일은 여전히 필요하다).

[STEAM 오픈소스](https://github.com/utiasASRL/steam) 저장소는 2015년에 문을 열었고 가장 많은 커밋을 남긴 주역은 Sean Anderson이었다. 한편 Dellaert 그룹의 GTSAM에도 2026년에 GP motion prior가 공식 통합됐다.

> 🔗 **차용.** SDE와 GP의 등가 관계는 [Särkkä 2013 *Bayesian Filtering and Smoothing*](https://users.aalto.fi/~ssarkka/pub/cup_book_online_20131111.pdf)에 정리되어 있었다. Rasmussen–Williams의 표준 GP 교과서가 닫힌 꼴의 커널을 주로 다루는 것과 달리, 실시간 SLAM에는 역행렬의 희소성이 절실했다. Barfoot 그룹은 Särkkä의 SDE 표현을 빌려와 GP motion prior를 곧장 희소 factor graph로 번역하는 다리를 놓았다.

## 10.4 Lie group 위의 continuous-time

parametric spline을 쓰든 nonparametric GP를 쓰든, 실제 로봇 궤적을 다루려면 결국 SE(3) 다양체 위에서 계산해야 한다. 유클리드 공간의 보간 공식은 회전군의 제약을 지키지 못하기 때문에, 대개 접공간(tangent space)에서 선형 연산을 한 뒤 지수 사상으로 SE(3)로 되돌리는 정교한 장치가 필요하다.

B-spline 진영에서는 뮌헨 공대(TUM)의 Sommer, Usenko, Schubert, Demmel, Cremers가 ["Efficient Derivative Computation for Cumulative B-Splines on Lie Groups"(CVPR 2020)](https://arxiv.org/abs/1911.08860)에서 계산 병목을 뚫었다. Lie group cumulative B-spline의 시간 미분을 점화식으로 재유도해, spline 차수 $k$에 대해 $O(k^2)$번 들던 행렬 연산을 $O(k)$번으로 떨어뜨린 것이다. SO(3) spline에서는 제어점에 대한 미분 Jacobian까지 해석적으로 구해 내어 camera-IMU calibration 실험에서 눈에 띄는 속도 향상을 입증했다.

GP 진영에서는 Anderson과 Barfoot이 "local variable" 전략으로 해답을 내놓았다. 각 제어 자세 $T_k$ 근방에서 국소 섭동 $\xi_k(t) = \log(T(t)\,T_k^{-1})$를 정의하고, SE(3) 전체가 아닌 이 국소 접공간 위에서 유클리드 GP를 돌리는 방법이다. 인접한 두 제어점 구간을 건너갈 때는 adjoint 행렬로 좌표를 이어 주는데, 이 다양체 변환의 수학적 골격은 앞 장에서 본 on-manifold preintegration과 정확히 맞닿아 있다(→ 9장).

결국 spline과 GP의 차이는 motion prior를 다루는 태도에서 가장 선명하게 드러난다. spline에서는 기저 함수와 제어점 간격, 혹은 별도로 얹은 정규화 항이 빈 구간의 형태를 정한다. 반면 GP는 SDE에서 직접 유도한 constant-velocity나 white-jerk 같은 물리적 사전 분포가 내장되어 있어 관측이 뜸한 구간을 확률적으로 메워 준다. 두 접근을 결합하려는 시도(Johnson et al. 2020)도 있었지만, 실제 현장에서는 구현의 단순함과 물리적 사전 분포의 엄밀함 사이에서 응용 목적에 맞게 한쪽을 택하는 편이다.

> 🔗 **차용.** [Anderson과 Barfoot의 IROS 2015 논문](https://doi.org/10.1109/IROS.2015.7353368)은 Lie group의 국소 변수에 GP를 얹는 실용적 해법을 정립했다. 두 제어점 사이 구간에서만 국소 GP를 평가하고 경계를 넘을 때 adjoint로 변환을 잇는 이 기법은 이후 수많은 연속시간 LiDAR·VIO 시스템의 표준 패턴이 됐다.

## 10.5 응용: LiDAR, VIO, event camera

초기 연속시간 궤적 추정은 주로 오프라인 센서 calibration에 머물렀다. 그러나 2022년 무렵에 이르러서는 실시간 주행과 고속 비전이라는 거친 현장으로 무대를 넓혔다.

**LiDAR motion distortion.** MINES ParisTech와 Kitware의 Pierre Dellenbach 등이 발표한 [CT-ICP](https://arxiv.org/abs/2109.12979)(arXiv 2021, ICRA 2022)는 복잡한 spline 대신 scan마다 시작 자세와 끝 자세 두 개만 두고 그 사이를 보간하는 영리한 타협을 택했다(회전은 slerp, 위치는 선형 보간). 또 앞 scan의 끝 자세와 다음 scan의 시작 자세는 굳이 딱 붙이지 않고 느슨한 근접 제약만 걸어 둔다. 이 간결한 연속시간 모델은 KITTI, NCLT, Newer College 등 7개 데이터셋에서 위력을 발휘했고, KITTI odometry 리더보드에서 코드 공개 방법 중 1위(평균 상대 이동 오차 0.59%)를 차지했다.

같은 해 토론토 그룹의 Keenan Burnett, Yuchen Wu 등은 ["Are We Ready for Radar to Replace Lidar in All-Weather Mapping and Localization?"](https://arxiv.org/abs/2203.10174)(RSS 2022)에서 radar 단독, LiDAR 단독, 그리고 radar-to-LiDAR 지도 정합을 나란히 비교하며 세 파이프라인의 odometry 모두에 Anderson–Barfoot의 GP motion prior 기반 연속시간 ICP를 심었다. 이어 Wu 등은 ["Picking up Speed"](https://doi.org/10.1109/LRA.2022.3226068)(RA-L 2023)에서 점마다 Doppler 속도까지 함께 뱉어 내는 Aeva FMCW LiDAR에 이 틀을 적용하고 [STEAM-ICP](https://github.com/utiasASRL/steam_icp) 코드를 공개했는데, 센서가 재는 Doppler 속도가 STEAM 상태 벡터의 속도 변수와 정확히 맞물리는 묘미를 보여 주었다.

**Rolling shutter VIO.** [Kerl 등의 rolling shutter RGB-D 추적](https://doi.org/10.1109/ICCV.2015.261)(ICCV 2015)에서 B-spline 궤적으로 이미지 행별 노출 시각의 자세를 찾아낸 데 이어, [Ctrl-VIO](https://doi.org/10.1109/LRA.2022.3202349)(RA-L 2022)에서는 Basalt의 spline 모듈을 개조해 rolling shutter VIO를 구현했다. global shutter 가정이 깨지는 고속 기동에서도 rolling shutter 왜곡을 우회하지 않고 모델 내부에서 직접 풀어낸 사례다.

**Event camera.** 2010년대에 센서의 난해함 때문에 고전하던 event camera 연구(→ 22장) 역시 2020년대에 접어들어 연속시간 궤적을 발판 삼아 활로를 열었다. 비동기 이벤트의 μs 단위 타임스탬프를 B-spline이나 GP에 그대로 질의해 순간 자세를 얻고, event와 영상 사이의 일관성으로 residual을 세우는 event SLAM이 잇따라 등장했다.

> 🔗 **차용.** CT-ICP는 [Besl·McKay 1992 ICP](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf)에서 물려받은 point-to-plane 정합 목적함수에 scan 내부의 연속 시간 보간을 얹어 고속 주행의 왜곡을 흡수했다.

---

## 예측과 실제

> 📜 **예언 vs 실제.** Furgale·Barfoot·Sibley(2012)는 고속 IMU와 sweeping laser가 이산 상태 공간을 부풀리는 문제를 겨냥하며 rolling-shutter 보간 사례를 함께 언급했지만, 정작 논문에서 직접 검증한 것은 camera–IMU calibration이었다. 그 뒤 Barfoot·Tong·Särkkä(2014)가 SDE 기반 sparse GP로 이론을 가다듬고, rolling-shutter VIO와 event SLAM이 2012년 논문의 Future Work와 별개의 줄기에서 연속시간 궤적을 실전 도구로 끌어올렸다. 그럼에도 주류 visual SLAM 시장은 여전히 이산 keyframe 기반인 ORB-SLAM이 차지했고, 연속시간 궤적은 주로 LiDAR·event·rolling shutter처럼 시간 분해능이 핵심인 영역에서 힘을 발휘했다.

---

## 아직 열린 문제

**학습 기반 연속시간 prior.** SDE에서 끌어온 motion prior는 constant-velocity나 white-jerk 같은 매끈한 물리 가정에 기댄다. 하지만 실제 도심 주행이나 보행, 드론 비행 궤적은 이런 이상적인 가정을 수시로 어긴다. 2023–2024년에는 neural SDE나 neural ODE로 실제 데이터에서 motion prior를 학습해 연속시간 factor graph에 넣으려는 시도가 나타났지만, 실시간 추정을 지탱하는 희소 블록 구조를 잃지 않으면서 학습된 prior를 결합하는 일은 아직 숙제로 남아 있다.

**VIO와 continuous-time의 통합.** keyframe 기반 VIO에서는 preintegration이 사실상의 표준이다. 연속시간 궤적이 preintegration을 완전히 대체할 수 있을지, 아니면 둘의 장점을 섞는 편이 나을지는 아직 결론이 나지 않았다. Le Gentil, Vidal-Calleja, Huang은 [GP 기반 preintegration](https://doi.org/10.1109/LRA.2020.2970940)(RA-L 2020)으로 두 진영을 이으려 했으나, 실제 현장에서 가장 널리 쓰이는 ORB-SLAM3나 VINS-Fusion은 여전히 이산 preintegration에 머물러 있다.

**임베디드 장치용 온라인 sliding window.** STEAM이나 B-spline 기반 추정기는 시간이 흘러 제어점이 누적될수록 계산 부담이 커진다. 과거 제어점을 marginalization으로 덜어 내면서도 연속시간 사후 분포의 일관성을 해치지 않고, 임베디드 보드 위에서 가볍게 돌아가는 기법에는 아직 다듬어야 할 부분이 많다.

---

Le Gentil 등의 GP 기반 preintegration에서 보듯, 연속시간 표현과 이산 preintegration은 배타적인 도구가 아니라 서로 맞물릴 수 있다. 지금까지 2부에서는 특징점 추적, 관성 사전적분, 연속시간 궤적, 그리고 certifiable backend에 이르기까지 SLAM의 뼈대를 이루는 기하적 추정 엔진을 살펴보았다. 이제 3부에서는 시선을 돌려 직접법(direct method)과 조밀 재구성(dense reconstruction)(→ 11장)으로 넘어간다. 특징점을 뽑아 추상화하는 과정을 아예 건너뛰고, 카메라가 찍은 픽셀 밝기와 깊이 측정 자체를 지도로 빚어낸 흐름이다.

# 11장 직접법: DTAM에서 DSO까지

2011년 Richard Newcombe는 소비자용 GPU 한 장만으로 화면의 모든 픽셀을 실시간 추적·복원하는 시스템 DTAM을 내놓았다. 당시 Newcombe는 Imperial College London에서 Andrew Davison의 지도를 받던 박사과정생이었고, 스승 Davison의 MonoSLAM은 EKF로 100개 안팎의 희소한 점만 추적하는 데도 벅찼다.

ORB-SLAM 계열의 특징점 기반(feature-based) 방법은 먼저 영상에서 코너를 검출해 ORB 서술자를 뽑고, 그중 1,000~2,000개의 점만 남긴 채 나머지 픽셀은 버린다. 반면 직접법(direct method)은 중간 요약 단계를 건너뛰고 픽셀 밝기 값 자체를 측정값으로 삼아 기하 오차가 아닌 밝기 차이(photometric error)를 최소화한다. 화면의 모든 픽셀을 다 쓰는 dense 방법부터 경계 근처만 취하는 semi-dense, 밝기 기울기가 큰 점 몇천 개만 고르는 sparse direct 방법까지 스펙트럼은 넓지만 뿌리는 하나다.

Imperial College의 Newcombe가 모든 픽셀을 밀어붙이던 바로 그 무렵, 뮌헨 공대(TUM)의 Daniel Cremers 그룹은 컴퓨터 비전의 고전인 Gauss-Newton 영상 정렬과 optical flow 기법을 SLAM으로 옮겨 심고 있었다. Cremers의 제자 Jakob Engel은 2014년 LSD-SLAM으로 GPU 없는 실시간 semi-dense SLAM을 열었고, 2016년에는 DSO로 정밀한 photometric calibration을 결합한 sparse direct odometry의 정점을 찍었다. 같은 직접법 안에서도 쓰는 픽셀의 밀도와 설계 철학이 극적으로 달라지는 과정이었다.

---

## 11.1 모든 픽셀: DTAM

2011년 ICCV에서 Newcombe, Lovegrove, Davison이 발표한 [DTAM](https://doi.org/10.1109/ICCV.2011.6126513)은 "Dense Tracking and Mapping in Real-Time"이라는 이름 그대로 화면의 모든 픽셀을 남김없이 동원해 추적과 지도 작성을 실시간으로 해냈다.

파이프라인은 추적과 지도 작성 두 축이 맞물려 돈다. 추적 단계에서는 지금까지 쌓은 dense 모델에서 합성해 낸 영상에 현재 카메라 프레임 전체를 photometric alignment로 직접 맞춘다. 특징점 검출이나 서술자 매칭 없이 오직 픽셀 밝기 차이만 줄여 자세를 찾는다. 지도 작성 단계에서는 keyframe 근처에서 찍은 여러 프레임의 photometric 오차를 깊이 후보별로 쌓아 3차원 배열인 cost volume을 만든다. 이어 여기에 공간적 매끄러움을 강제하는 regularization 항을 얹어 에너지를 구성하고, 이 에너지를 최소화해 keyframe의 inverse depth map을 복원한다.

$$E(\mathbf{u}) = \frac{1}{|\mathcal{I}|}\sum_{i \in \mathcal{I}} \Bigl\| I_r\bigl(\pi(\mathbf{p}(\mathbf{u}))\bigr) - I_i\bigl(\pi(KT_i\mathbf{p}(\mathbf{u}))\bigr) \Bigr\|_1 + \lambda \, g\,\|\nabla \mathbf{u}\|_\epsilon$$

여기서 $\mathbf{u}$는 역 깊이(inverse depth) 맵, $\mathbf{p}(\mathbf{u})$는 $\mathbf{u}$로 역투영한 3D 점, $K$는 카메라 내부 행렬, $T_i$는 참조 프레임 기준 $i$번 프레임의 rigid body 변환, $\pi$는 원근 투영이다. 데이터 항이 각 프레임의 photometric 오차를 L1 norm으로 재어 평균한다면, 두 번째 항의 $\|\nabla \mathbf{u}\|_\epsilon$은 inverse depth gradient에 Huber norm을 씌우고 참조 영상의 gradient가 큰 경계에서 작아지는 가중치 $g$를 곱한 것이다. Huber norm은 변화가 작은 곳에서는 제곱 norm으로 표면을 매끈하게 다듬고, 변화가 큰 곳에서는 L1 norm(total variation)으로 전환해 물체의 깊이 경계가 뭉개지지 않게 지켜 준다. 물론 픽셀 수십만 개에 대해 이런 비볼록 에너지를 매 프레임 풀려면 막대한 병렬 연산이 필요했고, 논문에서는 당시 최신 GPU였던 NVIDIA GTX 480 한 장에 기대어 실시간 성능을 끌어냈다.

DTAM은 단안 카메라만으로도 실내 책상 위 물체들을 실시간으로 빈틈없이 복원해 보여 주었다. 하지만 밝기 가정에 민감해 조명이 바뀌면 쉽게 흔들렸고, 시연 무대 역시 조명이 통제된 작은 실내 공간을 벗어나지 못했다.

> 🔗 **차용.** 같은 해 Newcombe가 Microsoft Research와 함께 내놓은 [KinectFusion](https://doi.org/10.1109/ISMAR.2011.6092378)(ISMAR 2011)은 능동 depth 센서로 조밀한 재구성을 해냈으며, 지도 표현으로 [Curless & Levoy 1996](https://doi.org/10.1145/237170.237269)의 TSDF(truncated signed distance function)를 가져왔다. DTAM은 depth 센서 없이 단안 카메라의 밝기 정보만으로 그에 필적하는 dense depth map을 추정하려 한 도전이었다.

## 11.2 Semi-dense: LSD-SLAM

2014년 ECCV에서 Engel, Schöps, Cremers가 발표한 [LSD-SLAM](https://doi.org/10.1007/978-3-319-10605-2_54)(Large-Scale Direct Monocular SLAM)은 모든 픽셀을 다 쓰겠다는 욕심을 내려놓는 대신, GPU 없이 CPU만으로도 실시간으로 동작하는 큰 규모의 단안 SLAM을 겨냥했다. 핵심 아이디어는 **semi-dense** 표현이었다. 텍스처가 없는 밋밋한 벽면은 어차피 밝기 변화가 없어 자세 추정에 아무런 정보를 주지 못하므로 버리고, 이미지에서 밝기 gradient가 임계값 이상인 경계(edge) 근처 픽셀만 골라 남긴 것이다. 물론 여기에도 코너 검출기는 들어가지 않는다.

추적에는 SE(3) direct image alignment를 쓴다. 현재 프레임을 keyframe에 warping한 뒤 photometric residual을 Gauss-Newton으로 줄여 나간다. 지도는 각 keyframe에 매달린 semi-dense depth map들의 집합이며, keyframe 사이를 7자유도 Sim(3) 포즈 그래프로 묶어 단안 카메라 특유의 scale drift까지 함께 보정한다. 큰 루프를 돌고 돌아왔을 때는 appearance 기반 검색(FAB-MAP)으로 후보를 찾은 뒤, 두 프레임 사이에 양방향으로 Sim(3) 정렬을 따로 돌려 두 결과가 통계적으로 일치할 때만 loop closure를 수락했다.

tracking과 mapping을 두 스레드로 나눈 골격은 PTAM과 닮았지만, ORB나 BRIEF 같은 서술자를 일절 쓰지 않고 오직 픽셀 밝기만으로 일관되게 시스템을 짰다는 점이 달랐다. 덕분에 LSD-SLAM은 실외의 넓은 거리까지 semi-dense 지도로 엮어 낼 수 있었다. 하지만 밝기 일관성이라는 근본 가정의 한계는 피하지 못해, 터널에 진입하거나 창문 역광을 마주하거나 플래시가 터지는 순간에는 추적이 급격히 불안정해졌다.

> 🔗 **차용.** LSD-SLAM의 frontend를 떠받치는 Gauss-Newton photometric registration은 영상 정렬 분야의 오랜 고전이다. [Lucas & Kanade 1981](https://www.ijcai.org/Proceedings/81-2/Papers/017.pdf) tracker와 연산 효율을 극대화한 inverse compositional 변형([Baker & Matthews 2004](https://doi.org/10.1023/B:VISI.0000011205.11775.fd))이 그 직계 조상이다.

## 11.3 Sparse direct: DSO

Engel, Koltun, Cremers의 [DSO](https://doi.org/10.1109/TPAMI.2017.2658577)(Direct Sparse Odometry)는 2016년 arXiv에 먼저 공개되고 2018년 IEEE TPAMI에 실렸다. 흥미롭게도 DSO는 LSD-SLAM보다 픽셀을 *더 적게* 쓰면서 오히려 정확도를 크게 끌어올렸다. 공간적 매끄러움을 강제하는 regularization을 과감히 덜어 내고, 그 연산 여유를 정교한 photometric calibration과 결합 최적화에 쏟아부은 덕분이다.

DSO는 새 keyframe이 들어올 때마다 영상 전체에 고르게 퍼지도록 후보 픽셀 2,000개를 뽑고, 전체 활성 윈도우를 통틀어 최적화에 남기는 활성 점 수도 2,000개 안팎으로 묶어 둔다. 점은 주변보다 gradient가 두드러진 픽셀 위주로 고른다. 이 점들을 모아 sliding window bundle adjustment로 camera pose, inverse depth, 프레임별 affine brightness 파라미터 $(a_i, b_i)$를 동시에 푼다. 윈도우를 빠져나가는 옛 프레임은 Schur complement를 이용한 marginalization으로 소거해 최적화 문제의 크기를 항상 일정하게 유지한다.

DSO를 차별화한 결정적 장치는 카메라의 영상 생성 과정을 물리적으로 쪼개어 모델링한 photometric calibration이었다. 렌즈 가장자리가 어두워지는 vignetting과 센서가 빛을 비선형으로 기록하는 camera response function(gamma curve)은 사전에 캘리브레이션해 선형 밝기 공간으로 되돌려 놓고, 프레임별 노출 시간 $t_i$는 메타데이터로 넘겨받은 뒤 남은 미세한 밝기 변화만 실시간 affine 파라미터 $(a_i, b_i)$로 추정했다. 이를 반영한 잔차식은 다음과 같다.

$$E_{pj} = \sum_{\mathbf{p} \in \mathcal{N}_p} w_{\mathbf{p}} \left\| \left( I_j\!\left[\mathbf{p}'\right] - \frac{t_j e^{a_j}}{t_i e^{a_i}} I_i[\mathbf{p}] - \left(b_j - \frac{t_j e^{a_j}}{t_i e^{a_i}} b_i\right) \right) \right\|_\gamma$$

여기서 $t_i, t_j$는 노출 시간, $(a_i, b_i)$와 $(a_j, b_j)$는 각 프레임의 gain과 bias에 해당하는 affine brightness 파라미터, $\|\cdot\|_\gamma$는 Huber loss다. 위 식은 전처리에서 vignetting과 response function을 이미 보정한 밝기 영상에 적용된다.

논문에서는 공정한 순수 odometry 비교를 위해 loop closure와 relocalization을 끈 단안 ORB-SLAM을 맞상대로 세웠다. 그 결과 photometric calibration이 제공된 TUM monoVO와 합성 데이터셋 ICL-NUIM에서는 DSO가 정확도와 강건성 모두에서 ORB-SLAM을 앞섰고, EuRoC에서는 ORB-SLAM이 더 낮은 오차를 내는 대신 추적을 더 자주 놓쳤다. 저자들은 그 까닭으로 EuRoC에 photometric calibration이 없다는 점을 지목했다. 이와 함께 드론이 작은 루프를 맴돌며 왔던 길을 되짚는 구간이 많아, ORB-SLAM의 local mapping이 사실상 작은 루프들을 암묵적으로 닫아 준 효과도 꼽았다. 실제로 ORB-SLAM이 10초 넘게 안 보인 keypoint를 다시 매칭하지 못하게 제한하자 두 방법의 정확도는 비슷해졌고 강건성은 여전히 DSO 쪽이 높았다.

> 📜 **예언 vs 실제.** DSO가 요구한 사전 photometric calibration은 실용화의 높은 문턱이었다. 그러나 2018년 Bergmann, Wang, Cremers가 RA-L에 [online photometric calibration](https://doi.org/10.1109/LRA.2017.2777002)을 발표하면서 사정이 달라졌다. KLT로 추적한 대응점의 밝기 변화를 단서로 노출 시간, response function, vignetting을 주행 중에 실시간 추정해 프레임을 즉시 보정하는 기법이다. 실제로 TUM monoVO에서 이 온라인 보정을 거친 auto-exposure 영상으로 DSO를 돌렸을 때, 미리 정밀 캘리브레이션을 마친 영상과 맞먹는 성능이 나왔다.

> 📜 **예언 vs 실제.** DTAM 이후 조밀 재구성 연구의 주력은 KinectFusion처럼 능동 RGB-D 센서를 쓰는 쪽으로 빠르게 이동했고, 단안 영상만으로 dense 지도를 복원하는 흐름은 2020년대 NeRF와 3DGS가 등장한 뒤에야 다시 본격적으로 불붙었다.

> 🔗 **차용.** DSO의 photometric calibration 틀은 [Debevec & Malik 1997](https://doi.org/10.1145/258734.258884)의 고전적인 HDR 영상 복원 연구에서 빌려 왔다. 비선형 response function을 미리 풀고 실행 중에는 프레임별 affine 밝기 변화만 쫓는 분리 전략이 거기서 나왔다.

## 11.4 VI-DSO와 후속 연구

direct 방법의 아킬레스건은 조명이 갑자기 출렁이는 순간에 추적이 쉽게 무너진다는 점이었다. 2018년 ICRA에서 von Stumberg, Usenko, Cremers는 DSO에 관성 센서를 결합한 [VI-DSO](https://doi.org/10.1109/ICRA.2018.8462905)를 내놓아 이 약점을 정면으로 보강했다. 단안 DSO의 sliding window photometric bundle adjustment에 IMU preintegration factor를 나란히 꽂아 넣자, 시각 정보가 흔들리는 구간에서도 IMU가 자세를 붙잡아 주어 실패율이 떨어졌을 뿐만 아니라 단안 카메라의 오랜 숙제였던 절대 scale까지 한꺼번에 복원됐다.

Cremers 그룹은 이어 2022년 [DM-VIO](https://doi.org/10.1109/LRA.2021.3140129)에서 delayed marginalization을 더해 direct VIO의 초기화 안정성을 한층 끌어올렸고, 같은 그룹의 [Basalt](https://arxiv.org/abs/1904.06504)(RA-L 2020)는 direct photometric BA 대신 patch 기반 optical flow로 점을 추적하는 또 다른 갈래를 개척했다. 이렇게 2010년대 후반과 2020년대 초반에는 direct VIO와 feature 기반 VIO(VINS-Mono, OpenVINS)가 팽팽히 맞서며 나란히 진화했다.

> 🔗 **차용.** VI-DSO에 들어간 IMU factor 역시 [Forster et al. 2017. On-Manifold Preintegration (IEEE TRO)](https://doi.org/10.1109/TRO.2016.2597321)의 공식을 그대로 채택했다.

## 11.5 direct 방법의 한계

직접법은 서술자라는 중간 요약을 덜어 내고 영상 밝기 자체를 잔차에 넣으면서 픽셀 활용 범위에 따라 다양하게 변주됐다. DTAM은 전체 픽셀을, LSD-SLAM은 기울기가 큰 semi-dense 영역을 취했고, DSO는 고르게 분산된 2,000여 점을 쓰되 텍스처가 적은 영역에서는 임계값을 낮춰 약한 기울기까지 포착했다. 덕분에 코너가 드문 장면에서도 정보를 쥐어짜 낼 수 있었지만, 아예 밝기가 고른 민무늬 벽면 앞에서는 카메라가 움직여도 밝기 잔차가 꿈쩍하지 않는다는 근본적 한계가 여전했다.

**Photometric calibration.** DSO가 전제하는 vignetting·response curve·노출 시간 정보는 일반 소비자용 카메라에서 손쉽게 얻기 어렵다. 스마트폰 카메라는 내부 파이프라인에서 HDR 합성, auto-exposure, 실시간 화이트 밸런스를 제조사만 아는 규칙으로 수시로 돌리기 때문에 DSO의 물리적 밝기 모델이 그대로 들어맞지 않는다.

**조명 변화.** 직접법은 같은 3D 점이 프레임이 바뀌어도 같은 밝기로 찍힌다는 photometric consistency 가정 위에 서 있다. DSO의 affine brightness 모델이 완만한 노출 변화는 흡수해 주지만, 구름이 지나가거나 실내 형광등이 깜빡이고 역광이 들이치는 급격한 변화 앞에서는 가정이 곧바로 깨진다.

**카메라 교체.** 통제된 벤치마크에서는 DSO가 ORB-SLAM을 앞서는 구간도 있었으나, 현장 투입의 문턱은 달랐다. ORB-SLAM은 카메라를 바꿔 끼워도 내장 파라미터만 알면 곧바로 돌릴 수 있는 반면, DSO는 카메라를 바꿀 때마다 vignetting과 response curve를 새로 캘리브레이션해야 하는 번거로움이 뒤따랐다.

**학습 기반 feature.** 설상가상으로 2010년대 후반 이후 [SuperPoint](https://arxiv.org/abs/1712.07629)(2018) 같은 학습 기반 특징점과 [LightGlue](https://arxiv.org/abs/2306.13643)(2023) 같은 학습 기반 매처가 등장하면서 특징점 진영이 크게 반격했다. 이 기법들은 극심한 조명·시점 변화에서도 대응점을 튼튼하게 잡아내는 동시에, 기존의 검증된 서술자 매칭 파이프라인에 그대로 얹힐 수 있었다.

## 아직 열린 문제

**조명이 급변할 때의 direct tracking.** photometric consistency가 무너지는 순간을 어떻게 버텨 낼지는 아직 완전히 풀리지 않았다. VI-DSO처럼 IMU를 붙이면 급격한 흔들림은 버틸 수 있고, Bergmann 등의 online photometric calibration처럼 주행 중에 밝기 모델을 추정하는 보완책도 있지만 근본적인 취약성은 남아 있다.

**텍스처가 없는 장면.** 특징점 방법이 코너 없는 벽 앞에서 길을 잃듯, 직접법에서도 밝기 변화가 거의 없는 흰 벽이나 균질한 복도·창고·평원에서는 자세 변화에 따른 잔차 기울기가 사라진다. 특히 LSD-SLAM처럼 밝기 기울기가 큰 픽셀만 취하는 방식에서는 그 픽셀들이 화면 한쪽 구석에 몰릴 경우 자세가 풀리지 않는 기하적 퇴화(degeneracy)가 발생한다.

**학습한 photometric 모델.** 고전 direct SLAM이 쓰는 photometric 모델은 고정된 camera response function과 단순한 affine 보정 수준에 머물러 있다. 최근 neural radiance field 계열 연구는 장면의 외관과 조명 반응을 신경망 자체로 모델링하며 이 틀을 깨고 있다. 예컨대 iMAP은 신경망으로 학습한 지도에서 렌더링한 색·깊이와 실제 관측을 비교해 카메라 자세를 추적했다.

한편 단안 카메라의 밝기 변화에 매달리는 대신, 아예 깊이 값을 직접 재는 RGB-D 센서를 손에 쥐면 조명이 흔들려도 훨씬 안정적으로 빈틈없는 3D 표면을 쌓아 올릴 수 있다. 다음 장에서는 DTAM과 같은 해에 발표되어 실내 3D 재구성의 판도를 바꾼 KinectFusion과 그 후예들을 살펴본다(→ 12장).

# 12장 RGB-D 조밀 재구성

2011년 10월 ISMAR 학회장, Imperial College London의 Richard Newcombe가 발표한 KinectFusion 데모 영상은 연구자들의 시선을 단숨에 사로잡았다. 손에 든 저렴한 Kinect 센서 하나로 방 안 이곳저곳을 훑고 지나가는 순간, 화면 속 3D 공간이 매끈하고 빈틈없는 메시로 실시간으로 빚어졌기 때문이다. 사실 이 기적 같은 파이프라인을 이루는 핵심 조각들은 모두 이미 존재하던 것들이었다. Curless와 Levoy가 1996년 컴퓨터 그래픽스 분야에서 고안한 부호 거리 함수(TSDF) 표현, Besl과 McKay가 1992년 발표한 ICP 정합 알고리즘, 그리고 Microsoft가 막 게임기용으로 내놓은 보급형 Kinect 센서다. 이 셋이 2011년 GPU 병렬 연산 위에서 마침내 한데 만났다. Newcombe가 단안 카메라의 밝기만으로 조밀 재구성을 시도한 DTAM(11장)을 내놓은 것과 정확히 같은 해의 일이었다.

---

## 12.1 Kinect 이전의 dense 재구성

2011년 이전이라고 해서 조밀한(dense) 3D 재구성 기술이 없었던 것은 아니다. [Pollefeys 등(IJCV 2008)](https://doi.org/10.1007/s11263-007-0086-4)처럼 차량에 실은 카메라와 GPS/INS를 결합해 도시 3D 모델을 실시간으로 구축한 시스템도 있었지만, 대부분의 dense 복원은 오프라인 후처리 작업이었다. 구조광(structured light: 정해진 빛 무늬를 투사해 그 왜곡 정도로 깊이를 재는 방식) 스캐너나 스테레오 매칭으로 긁어모은 point cloud를 몇 시간에 걸쳐 정합해 합치는 식이었고, 스캔 장비 자체가 고가여서 연구실 문턱을 넘기도 어려웠다. 당시 SLAM 주류는 소수의 희소한 랜드마크만으로도 궤적을 잘 뽑아내고 있었기에, 조밀한 표면 복원은 주로 컴퓨터 그래픽스 연구자들의 영역으로 남아 있었다.

그 그래픽스 진영의 고전이 [Curless와 Levoy의 1996년 SIGGRAPH 논문 "A Volumetric Method for Building Complex Models from Range Images"](https://graphics.stanford.edu/papers/volrange/volrange.pdf)다. 두 사람은 3D 공간을 균일한 복셀(voxel) 격자로 쪼갠 뒤, 각 복셀에 센서 시선 방향에서 잰 표면까지의 부호 있는 거리를 가중치와 함께 누적했다. 이 거리 값은 표면 바로 앞뒤에서만 기하학적 의미를 지니므로 측정점 주변의 일정 한계 $t$ 바깥은 잘라 내어 썼는데, 훗날 KinectFusion이 이를 **TSDF(Truncated Signed Distance Function, 잘라 낸 부호 거리 함수)**라고 명명했다. 부호는 센서에서 표면을 바라볼 때 표면 앞쪽(빈 공간)이 양수, 표면 뒤쪽(물체 내부)이 음수이며, 한계 $t$ 안으로 잘라 낸다는 것은 $\text{TSDF}(x) = \text{clip}(d(x), -t, +t)$로 묶는다는 뜻이다. 새 깊이 프레임이 들어올 때마다 복셀 값을 가중 평균으로 갱신하면 센서 잡음이 서서히 상쇄되며 표면이 또렷해지고, 최종 표면은 TSDF 값이 0이 되는 영점 교차면(zero-crossing)에 marching cubes를 돌려 3D 메시로 뽑아낸다.

원리는 명쾌했지만 1990년대 하드웨어로는 거대한 복셀 격자를 실시간으로 갱신할 엄두를 내지 못했다. 이 교착 상태를 깬 두 가지 변화가 바로 GPU를 범용 병렬 연산에 쓰는 GPGPU의 성숙과, 누구나 살 수 있는 가격의 Kinect 등장이었다.

---

## 12.2 KinectFusion과 TSDF

2010년 11월 4일 Microsoft는 Xbox 360용 Kinect를 북미 시장에서 149.99달러에 출시했다. 구조광 원리로 640×480 해상도의 깊이 맵을 30 Hz로 쏟아 내는 이 게임기 주변기기는 기존 연구용 ToF 카메라보다 정밀도는 다소 떨어져도 가격은 비교할 수 없이 쌌다. 출시 불과 엿새 뒤인 11월 10일, Hector Martin이 훗날 `libfreenect`로 이어진 오픈소스 드라이버를 공개하자 전 세계 로보틱스·비전 연구실이 즉각 Kinect를 사들이기 시작했다.

당시 박사과정생이던 Newcombe는 Microsoft Research Cambridge의 Shahram Izadi 팀과 손을 잡고 Kinect 깊이 스트림을 GPU 위에서 곧바로 처리하는 dense SLAM을 짰다. 그 결실이 2011년 ISMAR에 발표된 [Newcombe et al. 2011. KinectFusion](https://doi.org/10.1109/ISMAR.2011.6092378)이다.

KinectFusion의 실시간 루프는 네 단계가 맞물려 돌아간다. 먼저 **깊이 전처리** 단계에서 경계는 살리고 잡음만 죽이는 bilateral filter를 원시 깊이 맵에 씌운 뒤, 픽셀마다 표면 법선을 뽑는다. 이어 **ICP 추적** 단계에서는 현재 프레임의 point cloud를, 지금까지 누적한 TSDF 볼륨에서 ray-casting으로 그려 낸 가상 표면에 정합한다. 여기에는 [Besl & McKay(1992)](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf)의 **ICP**(Iterative Closest Point)를 point-to-plane 형태로 변형한 알고리즘이 쓰였다. 3단계 영상 피라미드에서 거친 해상도부터 고운 해상도 순으로 최대 4·5·10회 반복을 도는데, 매 반복마다 GPU가 수많은 정점–법선 대응에서 나온 정규방정식 항을 병렬로 합산해 카메라의 6-DoF 자세를 찾아낸다.

point-to-plane ICP에서 현재 프레임의 점 $\mathbf{p}_i$를 변환 $T = (R, \mathbf{t})$로 옮긴 뒤 ray-cast 표면의 대응점 $\hat{\mathbf{p}}_i$ 및 법선 $\hat{\mathbf{n}}_i$과 맞추는 목적함수는 다음과 같다.

$$E(R, \mathbf{t}) = \sum_i \bigl(\hat{\mathbf{n}}_i^\top (R\,\mathbf{p}_i + \mathbf{t} - \hat{\mathbf{p}}_i)\bigr)^2$$

Besl과 McKay의 원래 point-to-point 오차($\|R\mathbf{p}_i + \mathbf{t} - \hat{\mathbf{p}}_i\|^2$)가 두 점 사이의 유클리드 거리 전체를 줄이려 했다면, point-to-plane 오차는 법선 방향 성분만 재고, 표면을 따라 미끄러지는 접선 방향의 어긋남은 관대하게 넘기므로 수렴이 훨씬 빨라진다. 여기에 미소 회전 근사 $R \approx I + [\boldsymbol{\omega}]_\times$를 얹으면 $E$는 6차원 벡터 $(\boldsymbol{\omega}, \mathbf{t})$에 대한 선형 최소자승 문제가 되어 GPU에서 parallel reduction으로 한 번에 풀린다.

자세를 구한 뒤에는 **TSDF 통합** 단계로 넘어가 현재 깊이 맵을 복셀 격자에 투영해 TSDF 가중 평균을 갱신한다(논문 Fig. 13에서는 3 m³ 볼륨을 64³에서 512³ 해상도까지 달리하며 처리 시간을 측정했다). 마지막 **표면 렌더링** 단계에서는 TSDF의 zero-crossing을 ray marching으로 추적해 새 vertex map과 normal map을 그려 낸다. 이 가상 표면이 곧 다음 프레임 ICP 추적의 기준 모델이 된다.

이처럼 직전 프레임이 아니라 지금까지 누적한 전체 모델에 프레임을 맞추는 model-to-frame 추적 덕분에 KinectFusion은 30 Hz 실시간으로 방 한 칸을 깔끔하게 복원하면서도 좁은 공간 안에서 추적 drift를 억제할 수 있었다(물론 그 누적 모델 역시 과거 추정 자세에 기대고 있으므로 절대 오차에서 완전히 자유로운 것은 아니었다). 그러나 한계도 뚜렷했다. 미리 할당한 고정 복셀 격자를 카메라가 벗어나는 순간 더는 지도를 확장할 수 없었고, loop closure 기능도 없었다. 게다가 Kinect가 쏘는 적외선 구조광 패턴은 야외의 햇빛 아래에서 무력화됐다.

> 🔗 **차용.** KinectFusion의 체적 지도 표현은 Curless & Levoy(1996)가 오프라인 3D 스캐닝을 위해 고안한 TSDF를 그대로 물려받았다. Newcombe 팀의 돌파구는 GPU 병렬 연산으로 복셀 갱신을 30 Hz 실시간 영역으로 끌어내린 데 있다.

> 🔗 **차용.** 추적 엔진 역시 Besl & McKay(1992)가 IEEE PAMI에 발표한 고전 ICP를 GPU 위에서 조밀한 point-to-plane 형태로 병렬화한 결과물이다.

## 12.3 Kintinuous — rolling volume

KinectFusion이 발표되자마자 연구자들은 가장 답답한 병목이었던 고정 볼륨 크기 문제부터 공략했다. Maynooth 대학의 Thomas Whelan은 MIT의 Michael Kaess, John Leonard 등과 함께 TSDF 볼륨을 공간에 못 박아 두는 대신 카메라를 따라 굴러가게 만들었다.

2012년 7월 시드니 RSS 워크숍 "RGB-D: Advanced Reasoning with Depth Cameras"에서 발표된 [Whelan 등의 Kintinuous](https://www.cs.cmu.edu/~kaess/pub/Whelan12rssw.pdf)는 3차원 TSDF 배열을 순환 버퍼(cyclic buffer)로 다룬다. 카메라가 현재 볼륨 경계에 다가가면 볼륨을 카메라 진행 방향으로 한 칸씩 미끄러뜨리고, 반대편 경계 밖으로 밀려난 복셀 slice에서는 즉시 point cloud를 추출해 삼각형 메시에 덧붙여 저장한다. 덕분에 GPU 메모리는 일정하게 묶어 둔 채로 복도처럼 긴 공간을 끝없이 이어서 재구성할 수 있게 됐다.

그럼에도 한계는 절반만 해결됐다. 긴 복도를 한 바퀴 돌아 제자리로 돌아왔을 때 누적된 drift를 해소할 loop closure가 여전히 없었기 때문이다. 국소 표면은 촘촘하고 매끈했지만, 출발점과 끝점이 어긋난 전역 지도를 한꺼번에 펴 줄 방법이 필요했다.

## 12.4 ElasticFusion: Surfel과 비강체 변형

전역 복셀 격자나 삼각형 메시를 통째로 뜯어고치지 않고 dense 지도의 루프를 닫을 수는 없을까? Whelan은 Kintinuous 다음 프로젝트에서 아예 지도의 바탕을 TSDF 복셀이 아닌 **surfel**로 갈아 끼웠다.

**surfel(surface element, 표면 요소)**은 3D 위치와 법선, 반지름, 색상을 품은 납작한 원반 점으로, 컴퓨터 그래픽스에서 [Pfister 등(2000)](https://www.merl.com/publications/docs/TR2000-10.pdf)이 렌더링용으로 제안한 표현이다. 3차원 공간 전체를 균일 격자로 채우는 복셀과 달리, surfel은 실제 물체 표면 위에만 불규칙하게 놓인다.

Whelan 등이 RSS 2015에 처음 공개하고 2016년 IJRR에 [확장판](https://doi.org/10.1177/0278364916669237)을 실은 **ElasticFusion**은 바로 이 surfel 지도에 *비강체 변형*(non-rigid deformation)을 결합해 dense SLAM의 loop closure 난제를 풀었다. 거대한 복셀 볼륨은 한 번 틀어지면 처음부터 재통합해야 하지만, 점들의 집합인 surfel은 공간에 듬성듬성 배치된 변형 그래프(deformation graph)에 매달아 고무처럼 휘어 줄 수 있기 때문이다.

deformation graph의 각 노드 $g_k$는 공간 위치 $\mathbf{v}_k$와 회전 $R_k$, 이동 $\mathbf{t}_k$를 가진다. 모든 surfel $s$의 변형 후 위치는 인접한 $K$개 노드의 영향을 가중치에 따라 반영해 다음과 같이 계산된다(가중치 $w_k$는 노드와의 거리가 멀수록 작아진다).

$$\tilde{\mathbf{p}}_s = \sum_{k \in \mathcal{N}(s)} w_k \bigl(R_k (\mathbf{p}_s - \mathbf{v}_k) + \mathbf{v}_k + \mathbf{t}_k\bigr)$$

로봇이 이전에 지나간 장소를 다시 만나 loop closure 제약이 걸리면, ElasticFusion은 이 변형 그래프 노드들의 $(R_k, \mathbf{t}_k)$를 Gauss-Newton으로 최적화해 누적 오차를 지도 전체에 매끄럽게 분산시킨다. 지도를 처음부터 다시 쌓지 않고도 조밀한 전역 일관성을 되찾은 것이다.

합성 데이터셋 ICL-NUIM에서 ElasticFusion은 kt0·kt1·kt2 시퀀스 모두 1.4 cm 이하의 ATE RMSE를 기록했고, 그중 kt0와 kt1은 0.9 cm까지 떨어졌다(다만 kt3에서는 오차가 이보다 훨씬 컸다).

## 12.5 BundleFusion

비강체 변형이 사후적으로 지도를 구부려 오차를 나눈다면, 아예 GPU 자원을 아낌없이 투입해 모든 프레임의 자세를 처음부터 끝까지 온라인 bundle adjustment로 함께 풀 순 없을까? 2017년 ACM Transactions on Graphics에 실린 [Dai et al. 2017. BundleFusion](https://doi.org/10.1145/3072959.3054739)(Dai, Nießner, Zollhöfer, Izadi, Theobalt)이 바로 그 정공법이었다.

BundleFusion은 새 RGB-D 프레임이 들어올 때마다 지금까지 쌓인 전체 입력에 대해 카메라 자세를 전역적으로 다시 최적화한다. 계산량을 감당하기 위해 최적화는 두 층으로 나뉜다. 먼저 연속한 11개 프레임을 하나의 chunk로 묶어 국소 최적화를 돌리고, 각 chunk의 대표 keyframe들을 전역 계층에서 한꺼번에 정렬한다. 이때 대응점은 sparse SIFT 특징점과 dense 기하·밝기 정합을 함께 써서 튼튼하게 잡으며, 추적을 크게 잃더라도 곧장 전역 지도에서 relocalization으로 복귀한다. 더 놀라운 점은 지도 갱신 방식이다. 전역 최적화로 과거 프레임의 자세가 수정되면, BundleFusion은 그 프레임을 TSDF에서 빼낸(de-integration) 뒤 바뀐 자세로 실시간으로 다시 통합해(re-integration) 지도 자체를 항상 최신 전역 자세와 일치시켰다.

TUM RGB-D 등 주요 벤치마크에서 BundleFusion은 당시 온라인 시스템들을 능가하는 스캔 완성도와 정밀도를 입증했다.

> 📜 **예언 vs 실제.** BundleFusion 초록은 기존 온라인 기법을 넘어 오프라인 재구성에 필적하는 품질을 "전례 없는 속도와 스캔 완성도(unprecedented speed and scan completeness)"로 달성했다고 선언했다. 이후 GPU 성능은 계속 치솟았지만, 2021년 무렵부터 3D 비전 연구의 주된 관심은 RGB-D TSDF 통합 대신 COLMAP으로 자세를 구한 뒤 NeRF로 장면을 표현하는 쪽, 곧 고품질 novel-view synthesis와 신경망 기반 장면 표현으로 상당 부분 이동했다.

## 12.6 하드웨어와 알고리즘

돌이켜 보면 2011년부터 2017년까지 이어진 dense RGB-D SLAM의 황금기는 알고리즘과 하드웨어의 공진화였다. 1세대 Kinect는 구조광 덕분에 미터 거리에서 수 밀리미터 수준의 깊이 정밀도를 냈지만 햇빛 아래에서 무용지물이 됐다. 2013년 11월 Xbox One과 함께 출시된 Kinect 2는 빛의 비행 시간을 재는 ToF(Time-of-Flight) 방식으로 갈아타며 정밀도와 시야각을 끌어올렸고, 뒤이어 Intel RealSense 시리즈까지 가세해 연구자들에게 다양한 깊이 센서를 쥐여 주었다. 물론 센서마다 잡음 특성과 왜곡 양상이 달랐기에 알고리즘도 센서에 맞춰 진화해야 했다.

같은 기간 GPU 진영에서는 CUDA 생태계가 무르익고 연산량과 메모리 대역폭이 가파르게 성장했다. 연구실에서 누구나 손에 쥘 수 있던 싼 깊이 센서와 폭발하는 GPU 연산력이 맞물리지 않았다면, ElasticFusion의 비강체 변형이나 BundleFusion의 전역 실시간 re-integration은 2010년대 중반에 실현되기 어려웠을 것이다.

> 📜 **예언 vs 실제.** KinectFusion이 남긴 세 가지 숙제—공간 범위의 제한, 누적 drift, 실외 사용의 어려움—는 이후 연구의 로드맵이 됐다. 공간 범위와 drift는 Kintinuous, ElasticFusion, BundleFusion이 차례로 풀어냈지만, 햇빛이 적외선 패턴을 삼켜 버리는 실외 환경의 벽은 active IR 센서 자체의 물리적 제약 탓에 끝내 넘지 못했다(햇빛에 버티는 정도는 센서 방식마다 다르다). 결국 실외의 넓은 공간을 조밀하게 훑는 주력 센서의 자리는 LiDAR가 차지했다.

## 12.7 dense 방식이 주류가 되지 못한 이유

2011년부터 2017년 사이만 해도 dense RGB-D SLAM이 곧 모든 Visual SLAM의 표준이 될 것처럼 보였다. 하지만 정작 2015년 이후 실제 로봇과 드론 현장을 장악한 [ORB-SLAM2](https://arxiv.org/abs/1610.06475)와 [VINS-Mono](https://arxiv.org/abs/1708.03852)는 희소 특징점을 택했고, dense 지도를 기본 내장하지 않았다.

가장 현실적인 걸림돌은 메모리와 연산 예산이었다. KinectFusion처럼 복셀마다 16비트 TSDF 값과 16비트 가중치를 저장하면 $512^3$ 격자 하나에만 512 MB가 들어가, 모바일 기기나 임베디드 보드에서는 감당하기 버거웠다. 필요한 영역만 해시 블록으로 할당하는 [Voxblox](https://arxiv.org/abs/1611.03631)나 octree로 점유 확률을 쪼개 담는 [OctoMap](https://www.hrl.uni-bonn.de/papers/wurm10octomap.pdf)이 메모리 부담을 크게 덜어 주었지만 여전히 희소 랜드마크 지도만큼 가볍지는 못했다. 게다가 실시간 dense 추적에 필수였던 고성능 GPU는 드론이나 모바일 로봇에 싣기 무거웠고, 적외선 깊이 센서가 실외 햇빛에 취약하다는 점도 자율주행·야외 로보틱스의 요구와 어긋났다.

그렇다고 dense 지도 연구가 헛되이 사라진 것은 아니다. 자료구조 차원에서 KinectFusion의 고정 격자는 훨씬 영리한 계층 구조로 진화했다. 그래픽스와 시뮬레이션에서 출발한 [Museth(2013)의 VDB](https://doi.org/10.1145/2487228.2487235)(OpenVDB)는 동적으로 확장되는 희소 루트에 얕고 넓은 B+ tree를 엮어, 빈 공간은 건너뛰면서도 빠른 임의 접근을 보장했다. 최근에는 [Reijgwart 등(2023)의 wavemap](https://arxiv.org/abs/2306.01279)이 Haar wavelet으로 점유율(occupancy)을 압축해 다해상도 정보를 단일 구조에 담았다.

격자를 벗어나 공간을 연속 함수로 다루는 시도도 궤를 같이했다. [O'Callaghan과 Ramos(2012)의 GPOM(Gaussian Process Occupancy Map)](https://doi.org/10.1177/0278364911421039)은 점유 지도를 분류 문제로 삼아 변형된 Gaussian Process로 풀어, 가려진 사각지대나 센서 빔 사이 빈틈의 점유 확률을 분산과 함께 추정했다. [Ramos와 Ott(2016)의 Hilbert Map](https://doi.org/10.1177/0278364916684382)은 Hilbert 공간 특징 위에 로지스틱 회귀를 올려 데이터가 들어오는 즉시 stochastic gradient descent로 갱신하는 연속 점유 지도를 구현했다.

한편 ElasticFusion의 surfel 아이디어는 센서와 무대를 바꿔 살아남았다. [Behley와 Stachniss(2018)의 SuMa](https://www.ipb.uni-bonn.de/wp-content/papercite-data/pdf/behley2018rss.pdf)는 회전식 3D LiDAR 스캔을 surfel 지도에서 렌더링한 모델 뷰에 맞춰 추적함으로써 도시 규모 환경에서도 loop closure를 포함한 온라인 dense mapping을 해냈다(→ 21장).

2020년 NeRF의 등장 이후 고품질 시각 재구성의 무게중심은 NeRF와 3D Gaussian Splatting으로 넘어갔지만, RGB-D 깊이는 여전히 추적과 형상 학습의 튼튼한 제약으로 쓰인다. 무엇보다 TSDF 같은 체적 표현은 장애물 회피와 경로 계획을 위한 로봇 지도의 주류로 남았고, KinectFusion이 갈고닦은 GPU 기반 ICP는 LiDAR SLAM 정합의 핵심 엔진으로 자리 잡았다.

## 아직 열린 문제

**대규모 실외 dense 재구성.** 햇빛 아래에서 무력해지는 약점은 적외선 구조광을 비롯한 능동 깊이 센서 전반이 안고 있는 물리적 한계다. LiDAR는 멀리까지 정확히 재지만 색상과 조밀한 표면 질감이 빠지고, 학습 기반 스테레오 깊이 추정은 빠른 발전에도 불구하고 여전히 어두운 밤, 반사면, 먼 거리에서 흔들린다.

**동적 장면의 dense 재구성.** KinectFusion부터 BundleFusion까지 고전 dense SLAM은 세상이 정지해 있다고 가정했다. 사람과 차가 오가는 실제 공간에서 깔끔한 3D 지도를 쌓으려면, 움직이는 물체를 semantic segmentation이나 기하 residual로 실시간으로 가려내야 한다. [DynaSLAM](https://arxiv.org/abs/1806.05620)과 [MaskFusion](https://arxiv.org/abs/1804.09194)이 이 문을 두드렸지만, 계산 비용과 현실적인 강건성을 동시에 맞추는 일은 여전히 과제로 남아 있다.

**복셀 지도의 메모리.** Voxblox와 OctoMap이 메모리 장벽을 낮추긴 했어도, 건물 한 층이나 도시 블록을 높은 해상도로 채우려면 데이터 크기가 금세 감당할 수 없이 불어난다. wavemap 같은 다해상도 압축 구조나 [Instant-NGP](https://arxiv.org/abs/2201.05989) 같은 neural implicit 표현이 대안을 모색하고 있으나, 실시간 지도 갱신과 고속 공간 조회를 동시에 만족하는 표준 해법은 아직 완성되지 않았다.

---

3부에서 살펴본 직접법과 RGB-D 조밀 재구성은 픽셀 밝기와 깊이 값을 아낌없이 투입해 풍부한 3D 표면을 빚어냈지만, 정작 KinectFusion을 비롯한 초기 dense 시스템들이 가장 먼저 부딪힌 벽은 다름 아닌 loop closure의 부재였다. ElasticFusion과 BundleFusion이 지도를 구부리고 다시 합치는 기술을 마련하긴 했어도, 그에 앞서 "지금 내가 보는 이곳이 아까 지나온 그 장소"임을 알아보는 일은 전혀 다른 문제였다. 다음 4부에서는 수작업 특징 어휘에서 딥러닝 기반 전역 표현으로 진화하며 SLAM의 '기억'을 학습으로 풀기 시작한 장소 인식(place recognition)을 시작으로, 학습 기반 SLAM의 흐름을 따라간다(→ 13장).
