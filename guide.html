<head>
<meta charset="UTF-8">

<title>SLAM History Book — Spatial AI 계보 추적</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f7;
  --bg-sidebar: #f5f5f7;
  --bg-code: #f5f5f7;
  --bg-surface: #f5f5f7;

  --text: #1d1d1f;
  --text-body: rgba(0, 0, 0, 0.8);
  --text-muted: rgba(0, 0, 0, 0.56);
  --text-tertiary: rgba(0, 0, 0, 0.48);
  --text-heading: #1d1d1f;

  --accent: #0071e3;
  --link: #0066cc;

  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);

  --sidebar-width: 300px;
  --topbar-height: 52px;
  --progress-height: 3px;

  --shadow-elev: rgba(0, 0, 0, 0.22) 3px 5px 30px 0px;
}

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -0.022em;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  font-feature-settings: "kern", "liga", "calt";
  word-break: keep-all;
  overflow-wrap: break-word;
}

#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: var(--progress-height);
  background: linear-gradient(90deg, #0071e3, #2997ff);
  z-index: 10000;
  transition: width 0.1s linear;
  width: 0%;
}

#topbar {
  position: fixed;
  top: var(--progress-height);
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
}

#topbar .menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  margin-right: 12px;
  padding: 6px 10px;
  border-radius: 8px;
}

#topbar .menu-toggle:hover { background: rgba(0,0,0,0.04); }

#topbar .title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-heading);
  letter-spacing: -0.022em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#topbar .back-link {
  margin-left: 16px;
  color: var(--link);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  padding: 7px 14px;
  border-radius: 980px;
  border: 1px solid var(--border);
  letter-spacing: -0.014em;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

#topbar .back-link:hover {
  background: rgba(0, 113, 227, 0.06);
  border-color: var(--accent);
  color: var(--accent);
}

/* Language toggle — inline link style (no box) */
#topbar .lang-toggle {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  letter-spacing: -0.010em;
}
#topbar .lang-toggle a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 4px 2px;
  transition: color 0.15s;
  cursor: pointer;
}
#topbar .lang-toggle a:hover { color: var(--text); }
#topbar .lang-toggle a.active {
  color: var(--text-heading);
  font-weight: 600;
}
#topbar .lang-toggle .sep { color: var(--border-strong); }

#sidebar {
  position: fixed;
  top: calc(var(--progress-height) + var(--topbar-height));
  left: 0;
  width: var(--sidebar-width);
  height: calc(100vh - var(--topbar-height) - var(--progress-height));
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 999;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,0,0,0.16) transparent;
}

#sidebar::-webkit-scrollbar { width: 6px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.16); border-radius: 3px; }

#search-box {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.6);
  flex-shrink: 0;
}

#search-input {
  width: 100%;
  padding: 9px 12px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  font-family: inherit;
  letter-spacing: -0.016em;
  transition: border-color 0.15s, box-shadow 0.15s;
}

#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }
#search-input::placeholder { color: var(--text-muted); }

#toc-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 32px;
}

#toc-container::-webkit-scrollbar { width: 4px; }
#toc-container::-webkit-scrollbar-track { background: transparent; }
#toc-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

/* Chapter level (h1) */
.toc-item {
  display: block;
  padding: 8px 16px 8px 20px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.014em;
  border-left: 3px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  cursor: pointer;
}

/* Section (h2) */
.toc-item.toc-h2 {
  padding: 5px 16px 5px 36px;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: -0.012em;
}

.toc-item.toc-h2 + .toc-item:not(.toc-h2) { margin-top: 6px; }

.toc-item:hover {
  color: var(--text);
  background: rgba(0, 0, 0, 0.04);
}

.toc-item.toc-h2:hover { color: var(--text); }

.toc-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(0, 113, 227, 0.08);
  font-weight: 700;
}

.toc-item.toc-h2.active {
  font-weight: 500;
  color: var(--accent);
}

.toc-item.toc-hidden { display: none; }

.toc-group-label {
  display: block;
  padding: 22px 16px 6px 20px;
  font-size: 11px;
  font-weight: 700;
  color: rgba(0, 0, 0, 0.42);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.toc-group-label:first-child { padding-top: 8px; }
.toc-group-label.toc-hidden { display: none; }

.toc-no-results {
  padding: 20px 16px;
  color: var(--text-muted);
  font-size: 13.5px;
  text-align: center;
  display: none;
  letter-spacing: -0.014em;
}

#main-content {
  margin-left: var(--sidebar-width);
  margin-top: calc(var(--progress-height) + var(--topbar-height));
  min-height: calc(100vh - var(--topbar-height) - var(--progress-height));
  padding: 56px 56px 96px;
}

#content {
  max-width: 820px;
  margin: 0 auto;
}

#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  color: var(--text-heading);
  font-feature-settings: "ss01", "kern";
  scroll-margin-top: 72px;
}

#content h1 {
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  margin: 0 0 28px 0;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

#content h1:not(:first-of-type) {
  margin-top: 96px;
}

#content h1 + blockquote {
  border-left: none;
  background: transparent;
  text-align: center;
  font-size: 18px;
  color: var(--text-muted);
  padding: 8px 0 24px;
  letter-spacing: -0.018em;
}

#content h2 {
  font-size: 30px;
  font-weight: 600;
  line-height: 1.10;
  letter-spacing: -0.014em;
  margin: 56px 0 18px 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

#content h3 {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.16;
  letter-spacing: -0.012em;
  margin: 40px 0 12px 0;
}

#content h4 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -0.010em;
  margin: 28px 0 10px 0;
}

#content h5, #content h6 {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
  margin: 24px 0 8px 0;
}

#content p { margin: 0 0 16px 0; color: var(--text-body); }

#content a {
  color: var(--link);
  text-decoration: none;
  transition: color 0.15s;
}

#content a:hover { text-decoration: underline; text-underline-offset: 2px; }

#content ul, #content ol {
  margin: 0 0 16px 0;
  padding-left: 28px;
}

#content li { margin-bottom: 6px; color: var(--text-body); }
#content li > ul, #content li > ol { margin-top: 6px; margin-bottom: 6px; }

#content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 56px 0;
}

#content strong { color: var(--text); font-weight: 600; }

#content img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
  margin: 12px 0;
}

#content code {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.82em;
  letter-spacing: 0;
}

#content :not(pre) > code {
  background: var(--bg-code);
  padding: 2px 6px;
  border-radius: 5px;
  color: var(--text);
}

#content pre {
  background: var(--bg-code);
  border: none;
  border-radius: 12px;
  padding: 18px 20px;
  overflow-x: auto;
  margin: 0 0 20px 0;
  font-size: 13px;
  line-height: 1.55;
}

#content pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
}

#content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 20px 0;
  font-size: 15px;
  display: block;
  overflow-x: auto;
}

#content thead { background: var(--bg-surface); }

#content th {
  padding: 12px 16px;
  text-align: left;
  color: var(--text-heading);
  font-weight: 600;
  font-size: 14px;
  border-bottom: 1px solid var(--border-strong);
  letter-spacing: -0.012em;
}

#content td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text-body);
  letter-spacing: -0.016em;
}

#content tbody tr:hover { background: rgba(0, 113, 227, 0.04); }

#content blockquote {
  border-left: 3px solid var(--accent);
  background: var(--bg-surface);
  padding: 14px 22px;
  margin: 0 0 20px 0;
  border-radius: 0 8px 8px 0;
  color: var(--text-body);
}

#content blockquote p { margin-bottom: 8px; }
#content blockquote p:last-child { margin-bottom: 0; }

#content blockquote strong { color: var(--accent); }

.katex { font-size: 1.05em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 20px 0; }

::selection { background: rgba(0, 113, 227, 0.20); color: var(--text); }

mark.search-highlight {
  background: rgba(0, 113, 227, 0.18);
  color: inherit;
  padding: 1px 3px;
  border-radius: 3px;
}

/* Guide Overview (at top of content) */
.guide-overview {
  margin: 0 0 80px 0;
  padding: 0 0 48px 0;
  border-bottom: 1px solid var(--border);
}
.guide-overview .overview-header { margin-bottom: 44px; }
.guide-overview .overview-title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  color: var(--text-heading);
  margin: 0 0 10px 0;
}
.overview-group { margin-top: 36px; }
.overview-group:first-child { margin-top: 0; }
.overview-group-label {
  font-size: 11px;
  font-weight: 700;
  color: rgba(0, 0, 0, 0.42);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 0 0 18px 0;
}
.overview-chapter { margin: 0 0 22px 0; }
.overview-chapter:last-child { margin-bottom: 0; }
.overview-chapter-link {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 19px;
  font-weight: 600;
  color: var(--text-heading);
  text-decoration: none;
  letter-spacing: -0.014em;

.overview-chapter-link:hover { color: var(--accent); }
.overview-chapter-num {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 10px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.overview-sections {
  margin-top: 4px;
  font-size: 14px;
  line-height: 1.55;
  color: var(--text-muted);
  letter-spacing: -0.01em;

.overview-sections a {
  color: var(--text-muted);
  text-decoration: none;

  color: var(--border-strong);

@media (max-width: 1024px) {

@media (max-width: 900px) {

    box-shadow: none;

  #main-content { margin-left: 0; padding: 24px 24px 56px; }

  #content h1 { font-size: 36px; }
  #content h2 { font-size: 26px; margin-top: 44px; }
  #content h3 { font-size: 20px; }
  #content h4 { font-size: 17px; }
}

@media (max-width: 600px) {
  body { font-size: 16px; }
  #content h1 { font-size: 30px; }
  #content h2 { font-size: 22px; }
  #content h3 { font-size: 18px; }
  #main-content { padding: 20px 20px 48px; }

@media print {
  #progress-bar, #topbar, #sidebar, #sidebar-overlay, #search-box, .menu-toggle { display: none !important; }
  #main-content { margin: 0 !important; padding: 0 !important; }
  #content { max-width: 100%; color: #000; }
  #content h1, #content h2, #content h3, #content h4, #content strong { color: #000; }
  #content a { color: #1a0dab; text-decoration: underline; }
  #content pre, #content code { background: #f5f5f7; color: #000; border: none; }
  #content blockquote { background: #f5f5f7; border-left-color: #999; }
  #content table { border: 1px solid #ccc; }
  #content th, #content td { border: 1px solid #ccc; }
  body { background: #fff; }
}

# 0장 SLAM은 풀렸는가

2026년 오늘, 스마트폰 카메라로 방 안을 비추면 화면에 띄운 가상 물체가 벽에 못 박힌 듯 제자리를 지킨다. 실내 배송 로봇은 미리 입력받은 도면 없이도 주방과 회의실을 가려내며 오간다. [DUSt3R](https://arxiv.org/abs/2312.14132)와 그 후속 모델에 사진 몇 장만 넘겨주면 몇 초 만에 3차원 구조가 솟아오른다. 이 기능들이 이미 상용 제품 깊숙이 스며들어 사용자 눈에 띄지 않게 돌아가다 보니, 이제 SLAM은 사실상 풀린 문제라고 여기는 시선도 적지 않다.

---

불과 스무 해 남짓 전만 해도 사정은 전혀 달랐다. 2003년, Oxford 대학 공학과 Robotics Research Group에 몸담고 있던 Andrew Davison은 손에 쥔 카메라 한 대로 카메라 자신의 궤적을 실시간으로 쫓으면서 주변 지도를 그려 보였다. ICCV 2003에서 공개되고 훗날 [MonoSLAM](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf)이라는 이름으로 널리 알려진 이 시스템은 2.2 GHz Pentium 데스크톱 PC에서 초당 30프레임을 처리했다. 하지만 실시간의 대가는 가혹했다. 어느 순간에든 화면에 잡히는 특징을 6~10개 남짓으로 억눌러야 했고, 논문에 실린 20초짜리 실행에서 쌓아 올린 지도에도 특징점은 겨우 60개 안팎이었다. 실험 무대 역시 방 안 책상 주변을 벗어나지 못했다. Davison은 논문에서 이 좁은 반경 안에서는 EKF의 비선형성이 크게 문제되지 않지만, 카메라가 초기 좌표계에서 멀어질수록 오차가 눈덩이처럼 커질 수 있다고 짚었다. 당시 실시간 단안 SLAM이 감당할 수 있는 세계의 크기는 딱 그 책상 위만큼이었다.

책상 모서리의 점 몇 개를 붙들고 버티던 시스템이 어떻게 오늘날 손바닥 위 AR로 자라났을까?

---

그 여정은 어느 한 연구실의 단독 돌파구가 아니었다. 각자의 문제를 풀던 여러 학문 분야의 물줄기가 SLAM이라는 강으로 합쳐진 결과다. 사진측량학자들은 이미 1950년대 후반부터 여러 장의 사진에서 뻗어 나오는 광선 다발을 한꺼번에 맞춰 구조를 복원했다. 1986년 UAI 학회에서 발표되고 1988년 논문집에 실린 [논문](https://arxiv.org/abs/1304.3111)에서 Smith, Self, Cheeseman은 공간 관계의 불확실성을 확률 분포로 다루는 수학을 정립했고, 이때부터 로봇공학자들은 지도를 단순한 좌표 모음이 아니라 확률적 추정 대상으로 바라보기 시작했다. Durrant-Whyte와 Bailey의 2006년 [튜토리얼](https://www-personal.acfr.usyd.edu.au/tbailey/publications/slamtutorial1.htm)에 따르면, "SLAM"이라는 약어는 1995년 International Symposium on Robotics Research(ISRR)의 서베이 논문에서 처음 지면에 등장했다. 한편 컴퓨터 비전 연구자들은 영상 속 특징점을 실시간으로 찾아 추적하는 기법을 갈고닦았고, 2020년대에 들어서는 딥러닝 연구자들이 이 기하적 구성 요소들을 다시 학습 모델 안으로 끌어들이고 있다.

그렇다면 이 역사는 필연이었을까? EKF(확장 칼만 필터) 기반 SLAM이 graph-based SLAM에 자리를 내줄 때, 계산 효율이라는 기술적 필연과 몇몇 연구자의 설계 선택은 각각 어느 만큼 작용했을까? feature-based 방식과 direct 방식의 갈림길을 처음부터 내다본 이가 있었을까? 딥러닝은 왜 전통적인 기하 파이프라인을 이토록 더디게 대체하고 있을까? 당시 연구자들 앞에 놓였던 실제 선택지를 따라가 보면, 그때 다른 길을 택했더라면 역사가 어떻게 달라졌을지(counterfactual)도 가늠해 볼 수 있다.

[SLAM Handbook](https://github.com/SLAM-Handbook-contributors/slam-handbook-public-release)은 Carlone, Kim, Barfoot, Cremers, Dellaert가 편집을 맡아 Cambridge University Press에서 펴낸 책(서지 정보상 2026년)으로, 18개 장에 걸쳐 SLAM의 이론과 시스템을 집대성했다. 저자들은 맺음말(Epilogue)에 독자에게 남기는 짧은 충고들을 실었는데, 그중 한 문장이 이 책의 출발점을 정확히 찌른다. *"If someone tells you 'SLAM is solved,' don't listen to them."*

---

Davison의 2003년 데모 영상은 지금도 인터넷에서 찾아볼 수 있다. 화면은 거칠게 흔들리고, landmark를 표시한 점은 위태롭게 깜빡이며, 지도에 찍힌 점은 수십 개에 불과하다.

하지만 우리의 이야기는 MonoSLAM보다 훨씬 거슬러 올라간다. 1990년대에 "SLAM"이라는 이름이 굳기도 전, 심지어 Smith, Self, Cheeseman이 확률적 지도를 수식으로 쓰기도 전의 일이다. 사진측량학자들은 이미 1950년대 후반부터—아니, 그보다 앞선 19세기 말부터—사진 몇 장으로 3차원 세계를 다시 세우고 있었다.


---

# 1장 사진측량과 번들 조정

오늘날 SLAM 최적화 backend를 떠받치는 수학은 로봇공학이 아니라 측량학에서 태어났다. 19세기 후반 독일의 Albrecht Meydenbauer가 건축물을 사진으로 재는 방법을 체계화한 데 이어, 20세기 초 Carl Pulfrich는 두 시점에서 찍은 사진으로 거리를 읽어 내는 광학 기기를 내놓았다. 반세기가 흐른 1958년, 미국의 Duane C. Brown은 이 측량 문제를 수치 최소자승 문제로 정식화했다. 그리고 1999년 Bill Triggs, Philip McLauchlan, Richard Hartley, Andrew Fitzgibbon이 사진측량 문헌에 축적돼 있던 bundle adjustment 이론을 컴퓨터 비전 연구자의 언어로 번역해 내면서, 두 분야의 역사가 한데 만나게 된다.

---

## 1.1 20세기 초 유리판과 Stereophotogrammetry

1901년 함부르크 자연과학자 회의에서 [Carl Pulfrich](https://en.wikipedia.org/wiki/Carl_Pulfrich)는 Zeiss 광학연구소가 제작한 **입체 측량기(stereocomparator)**를 세상에 공개했다. 1899년 뮌헨에서 입체 거리계 시제품을 먼저 선보인 지 2년 만이었다. 원리는 명쾌했다. 서로 다른 두 위치에서 찍은 사진 건판을 나란히 놓고 같은 지점의 좌표 차이를 읽으면 거리를 계산할 수 있다. 두 시점 사이에서 같은 점이 어긋나 보이는 정도, 즉 시차(parallax)가 깊이에 반비례한다는 성질을 이용한 것이다. 삼각측량의 원리 자체는 고대 그리스 시대부터 알려져 있었지만, Pulfrich의 기기는 거기에 광학 계측의 정밀도를 실어 주었다.

그보다 한 세대 앞서 [Albrecht Meydenbauer](https://www.uni-marburg.de/de/fotomarburg/histfoto/gliederung/messbilder/messbildverfahren)는 문화재 보존을 위한 **건축 사진측량(architectural photogrammetry)**의 기틀을 다졌다. 1858년 베츨라 대성당 외벽을 실측하다 추락할 뻔한 아찔한 사고를 겪은 뒤, 그는 사람이 직접 줄자를 들고 기어오르는 대신 사진으로 건물을 재는 길을 찾았다. 그 집념은 1885년 프로이센 왕립 사진측량국(Königlich Preussische Messbild-Anstalt)의 설립으로 결실을 맺었다.

사진으로 공간을 재는 기술은 20세기에 들어 하늘로 올라갔다. 비행기에서 서로 겹치게 찍은 여러 장의 항공 사진과 지상의 기준점 몇 개를 엮어 촬영 위치와 지상 점의 좌표를 한꺼번에 구하는 기법을 aerotriangulation(항공 삼각측량)이라 불렀다. 물론 당시 계산을 수행하는 주체는 컴퓨터가 아니라 손과 기계식 계산기를 붙든 사람이었다.

> 🔗 **차용.** 현대 SLAM의 스테레오 깊이 추정은 Pulfrich의 stereocomparator와 같은 기하 원리 위에 서 있다. 두 카메라 사이의 거리(baseline)와 시차로 깊이를 역산한다는 점은 변함이 없다. 다만 Pulfrich가 유리 건판 위에서 눈으로 읽어 내던 좌표를 오늘날에는 이미지 센서의 픽셀 좌표가 대신할 뿐이다.

---

## 1.2 1958년 Brown과 수치 bundle adjustment

[Duane C. Brown](https://digital.hagley.org/08206139_solution)은 RCA 소속 엔지니어로, 플로리다 Patrick 공군기지의 미 공군 미사일 시험장(Air Force Missile Test Center)에서 측량 업무를 맡고 있었다. 그에게 떨어진 과제는 여러 관측 지점에서 찍은 카메라 자세와 여러 지상 점의 3차원 좌표를 동시에 추정하는 일이었다. Triggs et al.(1999)의 부록에 따르면, Brown과 동료들은 바로 이 미 공군 프로젝트를 위해 1957년부터 1959년 사이에 기본적인 bundle 방법의 뼈대를 세웠다.

1958년에 나온 보고서 "A Solution to the General Problem of Multiple Station Analytical Stereotriangulation"(RCA-MTP Data Reduction Technical Report No. 43, AFMTC-TR-58-8)은 **bundle adjustment**를 수치 계산 문제로 정식화한 기념비적 문헌이다. 비슷한 시기 해석적 사진측량을 연구하던 Helmut Schmid 역시 bundle adjustment의 공동 창시자로 나란히 꼽힌다. 다만 이 1958년 초기 정식화에서는 카메라 내부가 이미 교정돼 있다고 가정하고, 카메라 자세와 3차원 점 좌표만을 최적화 변수로 삼았다.

핵심 목표는 **reprojection error**를 줄이는 데 있다. 카메라 $i$가 실제로 관측한 2D 이미지 좌표는 $x_{ij} \in \mathbb{R}^2$이고, 3D 점 $X_j \in \mathbb{R}^3$을 카메라 내부 행렬 $K_i$와 외부 행렬 $[R_i | t_i]$로 이미지 평면에 투영한 예측 좌표는 $\pi(K_i, R_i, t_i, X_j)$이다. 이 두 좌표 사이의 거리를 재고, 모든 관측에 걸쳐 그 거리의 제곱합을 최소화한다.

$$E = \sum_{i,j} \| x_{ij} - \pi(K_i, R_i, t_i, X_j) \|^2$$

"Bundle"이라는 이름은 각 카메라 중심에서 3차원 점을 향해 뻗어 나가는 광선 다발(bundle of rays)에서 유래했다. 이 광선 다발들이 공간 속 3차원 점에서 오차 없이 만나도록 카메라 자세와 점 위치를 한꺼번에 비틀어 맞추는 작업이라는 뜻이다. 위 식은 오늘날 통용되는 일반화된 형태라 내부 행렬 $K_i$까지 표기에 담았지만, Brown의 1958년 보고서에서는 $K_i$를 고정된 기지값으로 두었다. 군사 측량 현장에서 태어난 bundle adjustment는 이후 수십 년 동안 사진측량 문헌 안에서 꾸준히 다듬어졌다.

> 🔗 **번역.** Triggs et al.(1999)은 초록에서 자신들의 논문이 사진측량의 bundle adjustment 이론과 기법을 "컴퓨터 비전 분야에서 이를 구현하려는 사람들"에게 건네기 위해 쓴 글임을 분명히 했다. 두 분야는 본질적으로 같은 최적화 문제를 각자의 용어와 관행 속에서 따로 풀고 있었고, 이 논문이 사진측량의 축적된 성과를 컴퓨터 비전 진영으로 번역해 온 셈이다. 군사 보안 때문에 컴퓨터 비전 연구자들이 이 방법을 처음부터 다시 발명해야 했다는 통설에는 직접적인 근거가 없다.

---

## 1.3 Levenberg와 Marquardt — 비선형 최적화

Brown이 세운 reprojection error 최소화는 비선형 최소자승 문제다. 투영 함수 $\pi$가 비선형이기 때문에 닫힌 꼴의 해가 존재하지 않으며, 결국 초기 추정치에서 출발해 해를 조금씩 고쳐 나가는 반복 수치 최적화에 의존해야 한다. 흥미롭게도 이 반복 계산이 발산하지 않도록 붙잡아 주는 수치 엔진은 측량학 바깥에서 먼저 만들어졌다.

1944년 [Kenneth Levenberg](https://cs.uwaterloo.ca/~y328yu/classics/levenberg.pdf)는 댐핑 파라미터 $\lambda$ 하나로 Gauss-Newton 방법과 steepest descent 방법 사이를 매끄럽게 오가는 기법을 발표했다. $\lambda$를 키우면 steepest descent에 가까워져 느리더라도 안전하게 내려가고, $\lambda$를 줄이면 Gauss-Newton처럼 해를 향해 성큼성큼 수렴한다. 기본 형태에서는 선형화한 정규방정식의 행렬 $\mathbf{J}^{\top}\mathbf{J}$ 대각 성분에 $\lambda \mathbf{I}$를 더해 행렬이 특이해지는 일을 막고 수치 안정성을 확보한다. 1963년 [Donald Marquardt](https://epubs.siam.org/doi/10.1137/0111030)가 같은 원리를 독자적으로 재발견해 한층 엄밀하게 정식화하면서, 이 방법은 오늘날까지 비선형 최소자승의 표준인 **Levenberg-Marquardt(LM) 알고리즘**으로 굳어졌다.

---

## 1.4 1999년 Triggs et al. — 사진측량의 결과를 정리하다

사진측량의 bundle adjustment와 수치 최적화의 LM 알고리즘이 컴퓨터 비전의 주류 문제와 정면으로 만난 결정적 계기는 1999년 ICCV와 함께 열린 Vision Algorithms Workshop이었다. 이 자리에서 Bill Triggs, Philip McLauchlan, Richard Hartley, Andrew Fitzgibbon이 발표한 ["Bundle Adjustment — A Modern Synthesis"](https://link.springer.com/chapter/10.1007/3-540-44480-7_21)는 측량학과 항공 사진측량 문헌 곳곳에 흩어져 있던 bundle adjustment(BA) 이론을 컴퓨터 비전의 언어로 집대성했다.

이 논문은 BA 문제가 지닌 희소 구조(sparsity)의 중요성을 낱낱이 파헤쳤다. 장면 속 한 3D 점은 전체 카메라 중 일부에만 찍히기 때문에, 선형화한 정규방정식의 행렬은 빈 칸이 대부분인 희소 블록 구조를 띤다. 여기서 점 변수를 먼저 대수적으로 소거하고(Schur complement) 카메라 변수만 남긴 작은 연립방정식을 풀면 계산량이 극적으로 줄어든다. 놀랍게도 논문에 따르면, Brown은 이미 1958년에 점 변수를 소거한 뒤 남은 카메라 방정식을 가우스 소거법으로 푸는 이 구조를 쓰고 있었다. 논문은 여기에 더해 기준 좌표계를 임의로 잡을 수 있기 때문에 생기는 자유도, 즉 gauge freedom 문제까지 체계적으로 정리했다.

이 이론적 번역은 곧 거대한 공학적 도약으로 이어졌다. 발표 7년 뒤인 2006년, Noah Snavely, Steven Seitz, Richard Szeliski는 [Photo Tourism(SIGGRAPH 2006)](https://phototour.cs.washington.edu/Photo_Tourism.pdf)을 통해 인터넷에서 긁어모은 불특정 다수의 사진만으로 노트르담 대성당이나 트레비 분수 같은 랜드마크를 자동 복원해 보였다. 다시 10년이 흐른 2016년, Johannes Schönberger와 Jan-Michael Frahm은 사진을 한 장씩 덧붙여 가며 재구성하는 incremental SfM을 한층 견고하게 다듬어 [COLMAP(CVPR 2016)](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf)을 공개했다. 비슷한 시기 대규모 연구 시스템들은 수백만 장에서 많게는 1억 장에 이르는 사진까지 한꺼번에 다루는 단계에 이르렀다.

---

## 1.5 Reprojection error가 지금 형태로 굳기까지

오늘날 우리에게 너무도 당연해 보이는 reprojection error 역시 처음부터 그 모습은 아니었다. 20세기 초 항공 삼각측량에서는 오차를 3D 지상 좌표계의 거리 차이로 재는 일이 흔했다. 그런데 3차원 공간에서 직접 거리를 비교하면 렌즈 왜곡이나 카메라 내부 교정에서 비롯된 오차가 지상 좌표 잔차 속에 뒤섞여, 어디서 문제가 생겼는지 가려내기가 어려웠다.

Brown은 1958년 보고서에서 이 비교의 기준을 3D 지상 좌표에서 2D 이미지 평면으로 옮겼다. 3차원 점을 이미지에 투영한 예측 위치와 실제 사진에서 측정한 픽셀 좌표를 같은 평면 위에서 맞대어 보자는 발상이었다. Triggs et al.(1999)의 부록에 따르면, 카메라 내부 파라미터까지 BA 안에서 함께 추정하는 self-calibration은 1964년 무렵 논의가 시작돼 1968년에 실제 구현으로 이어졌고, 렌즈 왜곡을 정교하게 묘사하는 카메라 모델 역시 1970년대 초에 크게 발전했다. 이 일련의 진전을 이끈 주역도 상당 부분 Brown과 동료들이었다.

여기에 통계적 해석이 더해지면서 공식은 완벽히 자리를 잡았다. 이미지 측정 노이즈가 등방성 가우시안 분포를 따른다고 가정하면, reprojection error 제곱합을 최소화하는 일은 정확히 최대우도 추정(MLE)과 일치한다. Triggs et al.(1999)이 이 공식을 컴퓨터 비전 연구자에게 익숙한 표기로 정리해 내면서, reprojection error는 다중 시점 기하와 SLAM의 공통 언어로 굳어졌다.

> 🔗 **차용.** 현대 SLAM에서 visual landmark의 관측 모델 $z = \pi(K, T, p) + \epsilon$은 Brown(1958)의 reprojection 공식을 그대로 물려받았다. Gauss-Newton으로 이 관측 잔차를 줄여 나가는 SLAM backend는 1958년 미 공군 기지의 항공 삼각측량 solver와 수학적으로 같은 골격을 공유한다.

---

## 1.6 오늘의 SLAM backend

반세기가 지난 지금도 그 뼈대는 건재하다. ORB-SLAM3는 g2o를 이용해 SE(3) 카메라 자세와 3D landmark 좌표를 한꺼번에 최적화하고, LIO-SAM은 GTSAM의 factor graph 위에서 비선형 최적화를 푼다. 딥러닝 시대의 대표 주자인 DROID-SLAM조차 GRU(gated recurrent unit) 기반 업데이트 연산자로 optical flow 보정량을 예측한 뒤, 맨 마지막에는 미분 가능한 dense bundle adjustment 층을 거쳐 기하학적 정합성을 맞춘다.

1999년의 투박한 행렬 표기는 Lie group과 factor graph라는 세련된 언어로 갈아입었고, 사람이 손으로 짜던 계산 일부는 신경망이 대신 맡게 됐다. 그럼에도 backend가 하는 본질적인 일은 여전히 관측 잔차를 최소화하는 것이다. 시각 BA는 여러 시점에 걸친 reprojection error로 자세와 지도를 깎아내고, LiDAR 시스템은 점과 점, 또는 점과 평면 사이의 거리처럼 센서의 물리적 특성에 맞는 잔차를 세울 뿐이다.

이 덕분에 SLAM 연구자는 사진측량 분야가 수십 년에 걸쳐 검증해 온 최적화 이론을 고스란히 가져다 쓸 수 있다. 다만 그 수학은 정적인 세계, 점 형태의 특징, 가우시안 노이즈라는 BA의 고전적 전제 위에서 완성된 것이므로, 현실의 동적 환경이 그 전제를 벗어나는 순간 한계도 함께 드러난다.

---

> 📜 **예언 vs 실제.** Triggs et al.(1999)은 마지막 절 "Summary and Recommendations"에서 문제의 희소 구조를 활용하는 일이 무엇보다 중요하다고 강조하며, 몇몇 예외적인 batch 문제를 제외하면 희소 분해에 기반한 Gauss-Newton 계열 방법을 권했다. 이후 SfM의 역사는 정확히 그 예언을 따라 거대해졌다. 물론 사진 수백만 장 규모로 덩치를 키우는 과정에서는 사진을 하나씩 추가할 때마다 BA를 국소적으로만 돌리거나, vocabulary tree로 닮은 이미지끼리만 추려 매칭하는 정교한 공학적 장치가 더해져야 했다.

---

## 아직 열린 문제

**비선형 BA의 전역 최적해 보장.** LM 알고리즘은 본질적으로 국소 최솟값(local minimum)을 찾는 방법이라 초기값이 참값에서 멀면 엉뚱한 3차원 구조에 갇힌다. 이 함정을 피하려고 epipolar geometry 추정, PnP(Perspective-n-Point, 3D 점과 영상 좌표로 카메라 자세를 복원하는 문제), 5-point algorithm 같은 기하 solver가 개발됐다. 실전에서는 이런 solver를 RANSAC 같은 강건 추정 틀 안에서 돌려 초기값을 얻고, 그 결과를 반복 최적화로 다듬는다. 대규모 환경에서 전역 최적해 자체를 수학적으로 보장하려는 convex relaxation 연구도 활발하지만(→ 7장), 실시간 SLAM이 요구하는 속도와 규모를 충족하며 이를 풀어내는 일은 여전히 과제로 남아 있다.

**사진측량의 정밀도와 Visual SLAM의 차이.** 항공 사진측량의 정확도는 엄격히 통제된 촬영 조건과 산출물 규격에 맞춰 관리된다. 잘 교정된 카메라와 정밀한 GCP(지상 기준점)를 동원하고, 최적화는 시간 제약 없는 오프라인에서 돌린다. 반면 실시간 Visual SLAM은 똑같은 수식을 들고나와 GPS도, 고해상도 계측 카메라도, 사후 계산의 여유도 없는 현장에서 매 프레임 답을 내놓아야 한다.

---

하지만 아무리 정교한 BA 공식이 준비돼 있어도, 식에 집어넣을 대응점 $(x_{ij})$가 없다면 최적화는 한 걸음도 내디딜 수 없다. 측량 현장에서 사람이 세우던 표적을 카메라 영상 속에서 스스로 찾아내고 짝짓는 일, 곧 특징점 검출과 서술자의 역사로 넘어가 보자(→ 2장).


---

# 2장 고전 특징점: Harris에서 ORB까지

Bundle adjustment가 카메라 자세와 3D 점 좌표를 한꺼번에 다듬으려면(→ 1장), 먼저 여러 이미지에서 같은 물리적 지점을 가리키는 대응점 쌍이 손에 들어와야 한다. 측량학에서는 사람이 직접 현장에 표적을 세워 대응점을 확보했지만, 움직이는 로봇을 다루는 컴퓨터 비전에서는 그 역할을 온전히 알고리즘에 맡겨야 했다. 결국 두 가지 질문이 피할 수 없는 과제로 떠올랐다. 하나는 이미지 속 어디에서 추적하기 좋은 점을 뽑을 것인가(feature detection)이고, 다른 하나는 시점이 달라져도 비교할 수 있게 그 점 주변의 생김새를 숫자 묶음으로 어떻게 요약할 것인가(description)였다.

그 실마리는 1970년대 후반 Stanford Cart 프로젝트에서 나왔다. 자율 주행 로버를 만들던 Hans Moravec은 1980년 Stanford 박사논문 ["Obstacle Avoidance and Navigation in the Real World by a Seeing Robot Rover"](https://frc.ri.cmu.edu/~hpm/project.archive/robot.papers/1975.cart/1980.html.thesis/index.html)에서 추적할 만한 점을 가려내는 기준을 세웠다. 작은 이미지 패치를 조금씩 밀어 볼 때 밝기가 얼마나 크게 요동치는지를 살피는 방식이었다. 반세기가 지난 오늘날에도 특징 기반 SLAM의 front-end는 대부분 Moravec이 던진 이 직관의 직계 후손들을 쓰고 있다.

---

## 2.1 코너라는 개념: Moravec에서 Harris까지

작은 창(window)을 어느 방향으로 조금만 밀어도 그 안의 밝기 패턴이 크게 달라지는 지점을 컴퓨터 비전에서는 "코너(corner)"라고 부른다. 평탄한 벽면은 어느 쪽으로 밀어도 비슷하고, 직선 경계(edge)는 선을 따라 밀면 변화가 없지만, 모서리나 뾰족한 질감은 사방 어느 쪽으로 움직여도 즉각 차이가 드러나기 때문이다. Moravec(1977)의 판별법은 소박했다. 창을 가로, 세로, 두 대각선, 즉 45도 간격의 네 방향으로 한 픽셀씩 옮겨 보며 원래 창과의 차이 제곱합(Sum of Squared Differences, SSD)을 구한 뒤, 네 값 중 최솟값이 충분히 크면 코너로 판정했다.

그러나 45도 간격만 살피는 방식은 카메라가 조금만 기울어져도 응답이 출렁이는 한계가 있었다. 1988년 Alvey Vision Conference에서 Chris Harris와 Mike Stephens는 ["A Combined Corner and Edge Detector"](https://www.bmva-archive.org.uk/bmvc/1988/avc-88-023.html)를 내놓으며 이 불연속성을 이미지 미분으로 해결했다. 점 $(x,y)$ 주변의 창 $W$를 임의의 미소 변위 $(\Delta x, \Delta y)$로 움직일 때 밝기 변화량을 테일러 근사로 펼치면, 모든 방향의 정보가 하나의 $2\times 2$ 행렬로 모인다.

$$M = \sum_{(x,y) \in W} \begin{pmatrix} I_x^2 & I_x I_y \\ I_x I_y & I_y^2 \end{pmatrix}$$

이제 행렬 $M$의 두 eigenvalue $\lambda_1, \lambda_2$를 들여다보면 점의 기하적 성격이 그대로 드러난다. 둘 다 크면 어느 방향으로 움직여도 밝기가 크게 변하는 코너이고, 하나만 크면 한쪽 방향으로만 변하는 엣지이며, 둘 다 작으면 밋밋한 평면이다. Harris는 당시 계산 부담이 컸던 eigenvalue 분해를 우회하려고 $R = \det(M) - k \cdot \text{tr}(M)^2$라는 간단한 판별식을 고안했다(실제 구현에서는 보통 $k$로 0.04~0.06을 쓴다).

1994년 CVPR에서 Jianbo Shi와 Carlo Tomasi는 ["Good Features to Track"](https://cecas.clemson.edu/~stb/klt/shi-tomasi-good-features-cvpr1994.pdf)을 발표하며 한 걸음 더 나아갔다. 이들은 "좋은 특징"이란 단순히 눈에 띄는 점이 아니라 *추적기가 끝까지 놓치지 않고 따라갈 수 있는 창*이라고 재정의하고, 두 eigenvalue 가운데 작은 값인 $\min(\lambda_1, \lambda_2)$가 문턱값을 넘으면 코너로 뽑는 기준을 제시했다(같은 기준은 1991년 Tomasi와 Kanade의 보고서에도 이미 등장한다). 오늘날 Shi-Tomasi 코너 검출이라 불리는 이 방법은 OpenCV의 `goodFeaturesToTrack` 함수 이름 속에 지금도 살아 숨 쉬고 있다.

> 🔗 **차용.** Harris(1988)는 Stanford Cart 연구를 집대성한 Moravec의 1980년 보고서(CMU-RI-TR-3)를 출발점으로 직접 인용하며, 4방향 이산 차분을 연속적인 미분 행렬로 일반화했다.

---

## 2.2 추적의 원형: Lucas-Kanade와 KLT

좋은 점을 찾았다면 다음 프레임에서 그 점이 어디로 이동했는지 따라가야 한다. 1981년 Bruce Lucas와 Takeo Kanade는 ["An Iterative Image Registration Technique"](https://www.ijcai.org/Proceedings/81-2/Papers/017.pdf)에서 연속 프레임 사이의 픽셀 이동을 최적화 문제로 정식화했다. 이들이 놓은 전제는 단 하나, 짧은 순간 동안 움직인 점은 이동 전후의 밝기가 변하지 않는다는 **밝기 불변 가정(brightness constancy assumption)**이었다.

$$I(x, y, t) = I(x + u, y + v, t + 1)$$

작은 이동 $(u, v)$에 대해 이 식을 1차 테일러 전개로 선형화하면 유명한 optical flow 구속 방정식을 얻는다.

$$I_x u + I_y v + I_t = 0$$

식 하나에 미지수는 $u, v$ 둘이라 한 픽셀만 봐서는 해가 정해지지 않는다. Lucas와 Kanade는 작은 창 안의 이웃 픽셀들이 모두 같은 속도 $(u, v)$로 함께 움직인다고 가정해 방정식 수를 늘렸고, 이를 최소자승 문제로 묶어 풀었다.

$$\begin{pmatrix} \sum I_x^2 & \sum I_x I_y \\ \sum I_x I_y & \sum I_y^2 \end{pmatrix} \begin{pmatrix} u \\ v \end{pmatrix} = -\begin{pmatrix} \sum I_x I_t \\ \sum I_y I_t \end{pmatrix}$$

여기서 눈여겨볼 대목은 왼쪽 계수 행렬이다. 이 행렬은 2.1절에서 본 Harris의 행렬 $M$과 토씨 하나 틀리지 않고 같다. 코너를 고르는 수학과 optical flow로 코너를 쫓는 수학이 사실상 같은 행렬의 안정성(가역성) 위에서 맞물려 돌아간다는 뜻이다.

1991년 Tomasi와 Kanade는 기술 보고서 ["Detection and Tracking of Point Features"](https://cecas.clemson.edu/~stb/klt/tomasi-kanade-techreport-1991.pdf)에서 추적하기 좋은 창을 eigenvalue 기준으로 선별하고 Newton-Raphson 반복으로 이동량을 정밀하게 다듬는 구현 방식을 정립했다. 이어 2000년 Intel의 Jean-Yves Bouguet이 해상도를 단계별로 낮춘 이미지 피라미드를 도입해 거친 해상도부터 굵직한 이동을 맞춘 뒤 고해상도로 좁혀 들어가는(coarse-to-fine) 구조를 얹으면서, 큰 움직임에서도 잘 수렴하는 오늘날의 **KLT(Kanade-Lucas-Tomasi) 추적기**가 완성됐다. 이 1981년산 아이디어는 [VINS-Mono](https://arxiv.org/abs/1708.03852)(TRO 2018) 같은 현대 실시간 VIO(visual-inertial odometry)의 front-end에서도 여전히 현역으로 뛴다.

---

## 2.3 SIFT — 불변성과 특허

KLT는 카메라가 조금씩 연속적으로 움직이는 영상에서는 발군이지만, 다른 카메라로 다른 날, 다른 거리와 각도에서 찍은 사진 두 장을 갖다 대면 맥을 못 춘다. 같은 지점이라도 주변 패치의 크기와 회전, 명암이 달라져 픽셀 밝기를 직접 견줄 수 없기 때문이다. 이 장벽을 넘으려면 시점이 바뀌어도 값이 크게 흔들리지 않는 수치적 지문, 즉 **서술자(descriptor)**가 필요했다.

1999년 ICCV에서 UBC의 David Lowe는 "Object Recognition from Local Scale-Invariant Features"를 발표해 점마다 뽑아낸 160차원 벡터만으로 서로 다른 사진 속 같은 물체를 찾아냈다. 5년 뒤인 2004년 *IJCV*에 실린 완성판 ["Distinctive Image Features from Scale-Invariant Keypoints"](https://www.cs.ubc.ca/~lowe/papers/ijcv04.pdf)에서 Lowe는 서술자를 128차원으로 다듬었다. 이 완성판은 컴퓨터 비전의 교과서적 표준이 됐으며, 오늘날 **SIFT(Scale-Invariant Feature Transform)**라고 하면 대부분 이 논문을 가리킨다. SIFT에서는 검출과 서술이라는 두 톱니바퀴가 맞물려 돌아간다.

**검출 단계**에서는 이미지를 여러 스케일로 흐려 가며 인접 스케일 간의 차이, 즉 DoG(Difference of Gaussians)를 계산해 그 극값을 keypoint로 삼는다. DoG는 계산량이 큰 Laplacian of Gaussian을 빠르게 근사한 것이다. Gaussian 스무딩 이미지를 $L(x,y,\sigma) = G(x,y,\sigma) * I(x,y)$라 할 때, 두 스케일 사이의 차이는 다음과 같다.

$$D(x, y, \sigma) = L(x, y, k\sigma) - L(x, y, \sigma)$$

이웃한 scale의 비율 $k$는 한 octave에 들어가는 scale 수 $s$에 따라 $2^{1/s}$로 정해진다. 여러 octave에 걸쳐 공간과 스케일 축 모두에서 극값을 찾기 때문에, 카메라가 멀어지든 가까워지든 같은 3D 지점을 일관되게 붙잡을 수 있다.

**서술자 단계**는 회전 불변성을 부여하는 과정이다. keypoint의 주된 gradient 방향을 먼저 계산해 그 방향으로 기준축을 돌린 뒤, 주변 $16\times 16$ 표본 창을 $4\times 4$ 블록으로 쪼갠다. 각 블록 안에서 gradient 방향을 8개 구간으로 묶어 히스토그램을 만들고 이를 한 줄로 이어 붙이면 128차원($4\times 4\times 8$) 벡터가 탄생한다. 방향을 정렬한 덕분에 이미지가 통째로 돌아가도 서술자 벡터는 거의 변하지 않는다.

Lowe(2004)가 보인 것처럼 SIFT는 회전과 크기 변화에 불변일 뿐 아니라 affine 변형, 노이즈, 조명 변화에도 상당한 강건성을 보였다. 덕분에 SIFT는 KITTI 같은 SLAM 벤치마크가 등장하기 한참 전부터 서로 다른 시점의 사진들을 엮는 SfM과 장소 인식의 사실상 표준으로 군림했다.

다만 SIFT에는 기술 외적인 족쇄가 하나 채워져 있었다. UBC가 Lowe를 발명자로 2000년 3월 특허를 출원해 2004년 3월 등록을 마쳤기 때문이다(US6711293B1, 우선일 1999년 3월 8일). 특허가 만료된 2020년 3월까지 상업 제품에 SIFT를 넣으려면 라이선스 비용을 물어야 했고, 이 상업적 장벽 때문에 거꾸로 SIFT를 대체할 가볍고 자유로운 서술자를 찾아 나서는 연구 경쟁에 불이 붙었다.

> 📜 **예언 vs 실제.** Lowe는 2004년 논문의 "9 Conclusions"에서 SIFT가 물체 인식을 넘어 "view matching for 3D reconstruction, motion tracking and segmentation, robot localization, image panorama assembly, epipolar calibration"에 쓰일 것이라 내다봤다. 그 예언은 놀라울 만큼 적중해, 2000년대 후반의 SfM과 파노라마 합성, 초기 시각 로봇 위치 추정은 거의 SIFT의 독무대였다. 다만 2012년 AlexNet 이후 물체 인식의 주도권은 CNN으로 넘어갔고, SLAM의 국소 서술자 역시 점차 SuperPoint·R2D2 같은 학습 모델의 도전을 받게 된다.

## 2.4 SURF — 속도를 위해 근사하다

SIFT는 정확했지만 실시간 로봇에 올리기에는 너무 무거웠다. 후속 논문인 SURF의 벤치마크에 따르면 800×640 이미지 한 장에서 특징을 뽑고 서술자를 만드는 데만 SIFT는 무려 1,036 ms가 걸렸다. 1초에 한 장꼴이니 초당 30프레임으로 움직여야 하는 실시간 SLAM에는 언감생심이었다. 2006년 ECCV에서 ETH Zurich의 Herbert Bay, KU Leuven의 Tinne Tuytelaars, 그리고 두 대학에 모두 적을 둔 Luc Van Gool이 ["SURF: Speeded-Up Robust Features"](https://people.ee.ethz.ch/~surf/eccv06.pdf)를 발표했다. 이 논문은 검출과 서술 양쪽에서 계산량을 과감히 덜어낸 해답이었다.

SURF는 SIFT의 DoG 피라미드 대신 *Hessian 행렬의 행렬식*으로 특징점을 찾았다. 핵심 비결은 Gaussian 이차 미분을 box filter로 과감히 근사하고, 이를 **integral image(적분 영상)**로 처리해 필터 크기와 무관하게 상수 시간에 계산한 데 있다. 서술자 역시 SIFT의 절반인 64차원으로 줄였다. keypoint 주변을 $4\times 4$ 하위 영역으로 나눈 뒤, 영역마다 Haar wavelet 응답 $d_x, d_y$를 뽑아 $(\sum d_x,\, \sum d_y,\, \sum|d_x|,\, \sum|d_y|)$ 네 값만 추려 붙인 결과다(필요하면 128차원 SURF-128로 늘릴 수도 있었다).

속도 차이는 극적이었다. 같은 800×640 이미지 측정에서 SURF는 354 ms, 회전 불변성을 끈 U-SURF는 255 ms를 기록해 SIFT보다 3~4배 빨랐고, 검출기만 떼어 놓으면 SURF의 Fast-Hessian이 DoG보다 3배 넘게 빨랐다. 정확도는 평가 조건에 따라 SIFT와 엎치락뒤치락했다. 하지만 SURF 역시 특허로 묶여 있었다는 점에서는 SIFT와 처지가 같았다.

> 🔗 **차용.** Lowe(1999/2004)의 DoG scale-space → Bay(2006)의 Hessian integral image: 두 기법 모두 크기 변화에 흔들리지 않는 특징을 노렸지만, Bay는 적분 영상 위의 box filter 근사로 Hessian 계산을 갈아치워 속도를 끌어올렸다.

## 2.5 ORB — 특허 없는 binary 서술자

실시간 SLAM이 바라는 조건은 까다로웠다. SIFT보다 수십 배 빠르면서, 회전과 크기 변화에도 견뎌야 하고, 무엇보다 특허 눈치를 보지 않고 누구나 코드에 집어넣을 수 있어야 했다. 2011년 ICCV에서 ROS를 개발하던 Willow Garage의 Ethan Rublee, Vincent Rabaud, Kurt Konolige, Gary Bradski가 ["ORB: An Efficient Alternative to SIFT or SURF"](https://www.gwylab.com/download/ORB_2012.pdf)를 발표했다. 이 논문은 바로 그 빈자리를 정확히 메웠다.

ORB의 전략은 무에서 유를 창조하는 대신, 이미 검증된 빠른 검출기와 가벼운 binary 서술자를 영리하게 고쳐 한데 묶는 것이었다.

**검출**에는 Rosten과 Drummond(2006)의 [FAST](https://www.edwardrosten.com/work/rosten_2006_machine.pdf)(Features from Accelerated Segment Test)를 가져왔다. 중심 픽셀을 둘러싼 반지름 원 위의 16개 픽셀을 훑어 중심보다 일정 문턱 이상 밝거나 어두운 점이 연속으로 길게 이어지면 코너로 찍는 방식이다. 미분도 행렬식도 없이 단순히 픽셀 밝기만 비교하므로 SIFT의 DoG와는 비교할 수 없이 빠르다. ORB는 FAST가 엣지 위에서도 반응하는 약점을 보완하려고 여기에 Harris 코너 점수를 매겨 강한 점만 추려 냈다.

**서술자**는 Calonder et al.(2010)의 [BRIEF](https://www.cs.ubc.ca/~lowe/525/papers/calonder_eccv10.pdf)(Binary Robust Independent Elementary Features)를 바탕에 두었다. keypoint 주변 패치에서 미리 정해 둔 점 256쌍의 밝기를 비교해, 한쪽이 밝으면 1, 어두우면 0을 적어 256비트 문자열을 만든다. 실수형 벡터의 유클리드 거리 대신 두 비트열을 XOR한 뒤 1인 비트 개수만 세는(popcount) Hamming 거리를 쓰니, 현대 CPU 명령어 한두 줄로 순식간에 매칭이 끝난다.

원래 BRIEF에는 이미지가 몇 도만 돌아가도 매칭률이 수직 낙하하는 문제가 있었다. Rublee와 동료들은 패치의 밝기 중심(intensity centroid)으로 주된 방향각 $\theta$를 구하고, 비교할 점 쌍의 좌표를 그 각도만큼 회전시켜 계산하는 **steered BRIEF**를 도입했다.

$$\theta = \text{atan2}(m_{01},\, m_{10}), \quad m_{pq} = \sum_{x,y} x^p y^q I(x,y)$$

그런데 점 쌍을 회전시키자 이번에는 비트 사이의 상관관계가 높아져 변별력이 떨어지는 부작용이 나타났다. 연구진은 학습 데이터를 동원해 분산이 크고 서로 상관관계가 낮은 256개 점 쌍만 탐욕적으로 골라내 이 문제를 잡았고, 이렇게 탄생한 서술자에 **rBRIEF(rotation-aware BRIEF)**라는 이름을 붙였다.

논문에 따르면 ORB는 SIFT보다 약 100배 빠르면서도 여러 벤치마크에서 대등한 매칭 성능을 보였다. 게다가 특허 부담이 전혀 없었던 덕에 OpenCV에 기본 탑재되며 삽시간에 퍼져 나갔다. 2015년 발표된 [ORB-SLAM](https://arxiv.org/abs/1502.00956)(Mur-Artal et al., TRO 2015)은 이름에까지 ORB를 내걸었고, 2021년의 ORB-SLAM3에 이르기까지 front-end의 핵심 엔진을 바꾸지 않았다.

> 🔗 **차용.** Calonder et al.(2010)의 BRIEF → Rublee et al.(2011)의 ORB: 단순한 binary 비교 서술자에 intensity centroid 방향 보정과 학습 기반 점 쌍 선택을 얹어, 속도는 유지한 채 회전 취약점을 메웠다.

## 2.6 학습 기반 서술자

사람이 미분과 히스토그램, 비트 비교 규칙을 손으로 짜는 대신 데이터에서 직접 특징 추출기를 학습시키면 더 강건한 서술자가 나오지 않을까? 2016년 ECCV에 발표된 Yi et al.의 [LIFT](https://arxiv.org/abs/1603.09114)(Learned Invariant Feature Transform)는 검출, 방향 추정, 서술자 계산이라는 전통 파이프라인의 세 단계를 각각 CNN으로 학습시켜 하나로 이은 첫 시도였다.

2018년 CVPRW에서 DeTone et al.이 내놓은 [SuperPoint](https://arxiv.org/abs/1712.07629)는 한 걸음 더 나아가 keypoint 검출과 256차원 서술자 생성을 단일 네트워크 안에서 동시에 학습했다. 이때 *homographic adaptation* 전략이 주효했다. 먼저 합성 기하 도형으로 코너의 감각을 익힌 뒤, 실제 이미지에 다양한 homography 변환을 걸어 얻은 예측을 자기 지도 정답처럼 삼는 방식이었다. 이후 SuperPoint는 SLAM 연구에서 학습 기반 특징점의 표준 시험대로 자리 잡았고, 최근에는 [AnyLoc](https://arxiv.org/abs/2308.00688)(Keetha et al., RA-L 2024)처럼 DINOv2 같은 대형 foundation model의 표현을 장소 인식에 끌어다 쓰는 흐름도 두드러진다.

그럼에도 2026년 현재, 사람이 설계한 서술자는 여전히 현장을 지키고 있다. 연산 자원이 빠듯한 임베디드 보드 위에서 ORB는 SuperPoint보다 훨씬 가볍고 빠르다. 무엇보다 학습 서술자는 훈련 분포를 벗어난 낯선 환경에서 성능이 예측 불가능하게 출렁이는 반면, ORB는 어떤 조건에서 강하고 어디서 무너지는지 엔지니어가 사전에 가늠하고 통제하기 쉽기 때문이다.

---

## 아직 열린 문제

**학습 기반 서술자의 일반화 한계.** SuperPoint, R2D2, DISK 같은 학습 서술자는 학습 데이터와 닮은 도심·실내 영상에서는 고전 기법을 앞서는 경우가 많다. 하지만 수중, 열화상, 극심한 저조도처럼 학습 분포 바깥의 장면으로 들어가면 결과가 들쭉날쭉하다. 고전 서술자와 학습 서술자 중 어느 쪽을 택할지는 2026년에도 여전히 환경과 하드웨어 제약에 따라 판단이 갈린다.

**Wide-baseline 매칭의 실패 모드.** Harris나 ORB는 카메라 시점이 크게 벌어지면(wide-baseline) 급격히 무력해진다. ASIFT나 MSER 같은 affine-covariant 검출기가 일부 구간을 메워 주긴 했지만 근본적 해결에는 이르지 못했다. 최근 [DUSt3R](https://arxiv.org/abs/2312.14132)(Wang et al., CVPR 2024)는 두 이미지에서 명시적인 대응점 매칭을 건너뛰고 픽셀별 3D 좌표(pointmap)를 곧바로 회귀하는 다른 길을 열어젖혔다. 이 접근이 지난 수십 년간 다듬어 온 특징점 서술자를 어디까지 대체할지는 아직 지켜볼 일이다.

---

지금까지 살펴본 기법들은 이미지 한 장에서 쓸 만한 점을 뽑거나 두 장 사이에서 짝을 짓는 기술이다. 그렇다면 이렇게 얻은 대응점들을 바탕으로 수십, 수백 장의 사진을 기하적 모순 없이 한 공간에 세우는 일은 어떻게 가능할까? 이제 Structure from Motion의 세계로 들어간다(→ 3장).

# 3장 SfM: Longuet-Higgins에서 COLMAP까지

Harris와 Lowe가 이미지 속에서 쫓을 만한 점을 골라내는 기술을 벼리는 동안, 또 다른 연구자 집단은 전혀 다른 방향에서 같은 산을 오르고 있었다. 이미 확보된 대응점들이 있을 때, 사진 두 장만으로 카메라가 어떻게 움직였고 장면의 3D 구조가 어떤 모양인지 어떻게 역산할 수 있을까? 특징을 *검출*하는 연구와 특징으로 *공간을 재구성*하는 연구는 한동안 각자의 트랙을 달리다, 2000년대 중반에 이르러 비로소 하나의 거대한 3D 복원 파이프라인으로 합류했다.

현대 컴퓨터 비전의 다중 시점 기하(two-view geometry)에서는 1981년 *Nature*에 실린 세 쪽짜리 짧은 논문이 출발선으로 자주 꼽힌다. 서식스 대학교 실험심리학 연구실의 H.C. Longuet-Higgins는 "[A Computer Algorithm for Reconstructing a Scene from Two Projections](https://cseweb.ucsd.edu/classes/fa01/cse291/hclh/SceneReconstruction.pdf)"에서 두 사진 속 같은 점 여덟 개의 좌표만 쥐여 주면 단순한 일차 연립방정식을 풀어 두 시점의 상대 자세와 장면의 3D 구조를 동시에 구할 수 있음을 증명했다. 사진측량이나 인간 운동 지각(motion perception) 문헌에 선행 연구가 없지 않았지만, 컴퓨터가 대수적으로 두 영상을 엮어 3차원을 복원하는 현대적 프레임은 바로 이 세 쪽에서 시동이 걸렸다.

## 3.1 Essential Matrix와 8-point Algorithm

Longuet-Higgins의 통찰은 명쾌했다. 두 대의 카메라가 같은 3차원 점을 바라보면, 양쪽 이미지 좌표 사이에는 반드시 만족해야 할 대수적 제약이 걸린다. 카메라 내부 파라미터로 좌표를 정규화하면, 이 기하적 관계는 단 하나의 $3\times 3$ 행렬로 압축된다. 논문에서 $Q$라고 적었던 이 행렬이 오늘날 우리가 **essential matrix** $\mathbf{E}$라 부르는 대상이다.

서로 대응하는 두 정규화 좌표를 $\mathbf{x}_1$, $\mathbf{x}_2$라 하면 다음의 **epipolar constraint**가 성립한다.

$$\mathbf{x}_2^\top \mathbf{E} \mathbf{x}_1 = 0$$

$\mathbf{E}$는 두 카메라 사이의 회전 $\mathbf{R}$과 이동 $\mathbf{t}$를 $\mathbf{E} = [\mathbf{t}]_\times \mathbf{R}$ 형태로 품고 있다(여기서 $[\mathbf{t}]_\times$는 $\mathbf{t}$의 skew-symmetric 행렬이다).

스케일의 모호성을 제하면 $\mathbf{E}$의 실제 자유도는 5다. 따라서 이론상 대응점 5쌍만 있으면 해를 정할 수 있고, 실제로 사진측량에서는 오래전부터 점 5개로 푸는 방법을 알고 있었다. 문제는 5개만으로 해를 구하려면 3차 연립방정식 다섯 개를 반복 계산으로 풀어야 해 연산이 까다롭고 해의 후보도 여러 개로 갈린다는 점이었다. 훗날 David Nistér가 효율적인 비선형 [5-point algorithm](http://www.cad.zju.edu.cn/home/gfzhang/training/SFM/2004-PAMI-David%20Nister-An%20Efficient%20Solution%20to%20the%20Five-Point%20Relative%20Pose%20Problem.pdf)(2004)을 완성하기 전까지, 연구자들에게는 빠르고 단순한 선형 해법이 필요했다. Longuet-Higgins는 대담한 타협을 택했다. $3\times 3$ 행렬의 원소 9개 중 스케일 하나를 고정해 미지수를 8개로 보고, rank-2 같은 비선형 기하 제약은 일단 미뤄 두었다. 그렇게 대응점 8쌍을 모아 일차 연립방정식으로 $\mathbf{E}$를 먼저 푼 뒤 사후에 제약을 맞추는 전략을 세웠다. 구현이 놀라울 만큼 간단하고 계산도 가벼웠던 이 **8-point algorithm**은 순식간에 널리 퍼졌다.

물론 대가도 있었다. 픽셀 좌표는 수백에서 수천 단위에 이르는 반면 동차 좌표의 마지막 원소는 1이기 때문에, 좌표값 그대로 연립방정식 행렬을 쌓으면 원소 크기가 몇 자릿수씩 벌어져 SVD(특이값 분해) 결과가 노이즈에 몹시 취약해졌다.

한편 내부 파라미터 $\mathbf{K}$를 모르는 카메라에는 essential matrix를 일반화한 **fundamental matrix** $\mathbf{F}$가 쓰인다. $\mathbf{K}_1, \mathbf{K}_2$를 각각 두 카메라의 내부 행렬이라 할 때 $\mathbf{F} = \mathbf{K}_2^{-\top} \mathbf{E} \mathbf{K}_1^{-1}$(같은 카메라라면 $\mathbf{F} = \mathbf{K}^{-\top} \mathbf{E} \mathbf{K}^{-1}$)로 정의되며, 여전히 $\mathbf{x}_2^\top \mathbf{F} \mathbf{x}_1 = 0$을 만족한다. 이 덕분에 현대 SfM 파이프라인은 $\mathbf{K}$를 알면 $\mathbf{E}$를 바로 풀고, 모르면 $\mathbf{F}$부터 추정해 들어가는 유연함을 얻었다.

> 🔗 **차용.** Richard Hartley는 8-point algorithm의 수치 불안정성을 단숨에 바로잡았다. 1997년 논문 ["In Defense of the Eight-Point Algorithm"](https://www.cse.unr.edu/~bebis/CS485/Handouts/hartley.pdf)에서 그는 이미지마다 점들의 무게중심을 원점으로 옮기고 원점까지의 평균 거리가 $\sqrt{2}$가 되도록 스케일을 맞춘 뒤 $\mathbf{F}$를 풀고, 마지막에 원래 좌표계로 되돌리는 절차를 제안했다. 이 절차는 카메라 내부 파라미터로 좌표를 정규화하는 것과는 목적이 다른 순수한 수치 조건 개선이었지만, Longuet-Higgins의 기하를 건드리지 않고도 성능을 극적으로 끌어올렸다. 덕분에 이 정규화 8-point 방법은 다중 시점 기하 교과서의 불변의 표준이 됐다.

## 3.2 Tomasi-Kanade Factorization

Longuet-Higgins 이후 약 10년간 SfM 연구는 주로 사진 두 장 사이의 기하를 파고드는 데 머물렀다. 판을 흔든 것은 1992년 *IJCV*에 실린 Carlo Tomasi(Cornell)와 Takeo Kanade(CMU)의 **[factorization method](https://people.eecs.berkeley.edu/~yang/courses/cs294-6/papers/TomasiC_Shape%20and%20motion%20from%20image%20streams%20under%20orthography.pdf)**였다. 이들은 두 장씩 끊어 보는 대신 연속된 수많은 프레임을 하나의 큰 행렬에 담아 한꺼번에 풀어 버리는 발상을 내놓았다.

프레임 $F$장에서 점 $P$개를 끝까지 추적하면, 그 이미지 좌표들을 $2F \times P$ 크기의 관측 행렬 $\mathbf{W}$에 차곡차곡 쌓을 수 있다. 각 행에서 그 프레임의 점 좌표 평균을 빼 이동 성분을 지우면, 정사영(orthographic) 카메라 모델에서는 놀랍게도 $\mathbf{W}$의 rank가 항상 3 이하가 된다. 논문에서 rank theorem이라 부른 이 성질 덕분에 $\mathbf{W}$는 두 행렬의 곱으로 깔끔하게 쪼개진다.

$$\mathbf{W} = \mathbf{M} \mathbf{S}$$

여기서 $\mathbf{M}$은 $2F \times 3$ 모션 행렬, $\mathbf{S}$는 $3 \times P$ 구조 행렬이다. $\mathbf{W}$를 SVD해 가장 큰 특이값 3개만 남기면 곧바로 rank-3 분해를 손에 쥘 수 있다. 다만 임의의 가역 행렬 $\mathbf{A}$에 대해 $\mathbf{M}\mathbf{A}$와 $\mathbf{A}^{-1}\mathbf{S}$ 역시 같은 $\mathbf{W}$를 만든다. 따라서 **metric constraints**(후속 문헌에서는 흔히 metric upgrade라 부른다)로 $\mathbf{A}$를 확정 지어야 하는데, 이는 카메라 축을 뜻하는 행들이 서로 직교하고 길이가 1이어야 한다는 제약이다.

단 한 번의 SVD와 행렬 보정만으로 모든 프레임의 움직임과 모든 점의 3D 좌표를 동시에 건져 올리는 우아함 덕분에, factorization은 반복 비선형 최적화인 bundle adjustment보다 구현이 훨씬 단출하고 매력적으로 보였다.

하지만 이 우아함은 정사영·affine 카메라라는 좁은 가정 위에서만 성립했다. 원근 왜곡(perspective distortion)을 무시하는 affine 모델은 망원 렌즈로 멀리 있는 작은 물체를 찍을 때처럼 장면 내 깊이 차이가 카메라까지의 거리에 비해 미미할 때만 잘 맞았다. 광각 렌즈를 달고 실내를 누비거나 카메라 바로 코앞의 물체를 찍는 환경에서는 오차가 걷잡을 수 없이 커졌다. 1990년대 후반 연구자들이 factorization을 원근 모델로 확장하려 씨름하다 결국 한계에 부딪히면서, 컴퓨터 비전 진영은 다시금 사진측량의 낡지만 정직한 무기—bundle adjustment—를 찾아 나서게 된다.

## 3.3 Hartley & Zisserman의 교과서

2000년 출간된 Richard Hartley와 Andrew Zisserman의 교과서 *[Multiple View Geometry in Computer Vision](https://www.robots.ox.ac.uk/~vgg/hzbook/)*은 1981년 이후 20년 가까이 개별 논문 속에 파편화돼 있던 SfM의 수학을 사영기하(projective geometry)라는 단 하나의 일관된 문법으로 통합했다. essential matrix, fundamental matrix, homography, 카메라 교정, 그리고 bundle adjustment가 모두 같은 기하와 표기법으로 설명되자, 연구자들은 비로소 흩어져 있던 퍼즐 조각들이 한 그림이었음을 직관적으로 깨닫게 됐다.

특히 이 책은 그동안 사진측량의 전유물처럼 여겨지던 bundle adjustment를 전면에 내세웠다. 사영기하의 틀 안에서 reprojection error 최소화를 다시 정식화한 뒤, 현실 데이터의 오매칭(outlier)에 휘둘리지 않도록 Huber나 Cauchy 같은 *robust cost function* $\rho$를 얹고, Levenberg-Marquardt와 Jacobian의 희소 구조를 결합해 실전용 레시피로 내놓은 것이다. 이 책은 이후 20년간 거의 모든 SLAM과 VO(visual odometry) 논문의 참고 문헌 첫머리를 지켰다.

## 3.4 Photo Tourism과 Bundler — 인터넷 규모 SfM

교과서의 수식이 비통제 환경의 야생 데이터에서도 통한다는 사실이 2006년 SIGGRAPH 논문 "[Photo Tourism](https://doi.org/10.1145/1179352.1141964)"에서 만천하에 증명됐다. Noah Snavely, Steven Seitz, Richard Szeliski는 전문 측량 장비를 쓰는 대신 관광객들이 Flickr에 무작위로 올려놓은 사진들을 긁어모아 파리 노트르담 대성당과 로마 트레비 분수를 3차원으로 되살렸다.

인터넷에서 긁어모은 사진들은 카메라 기종도, 촬영 날짜와 날씨도, 화각도 제각각인 데다 전혀 상관없는 사진까지 뒤섞여 있었다. Snavely의 파이프라인은 먼저 SIFT로 특징점을 뽑아 이미지 쌍 사이의 대응점을 잇고, RANSAC으로 fundamental matrix를 추정해 기하에 맞지 않는 가짜 매칭을 쳐냈다. 그런 다음 대응점이 가장 탄탄한 이미지 쌍에서 출발해 카메라를 한 장씩 붙여 나가고(incremental SfM), 카메라가 추가될 때마다 bundle adjustment를 돌려 전체 자세와 점 좌표를 다듬었다.

실험 결과는 당시로선 경이로웠다. Flickr에서 모은 노트르담 대성당 사진 2,635장 중 597장을 한 공간에 정렬했고, 트레비 분수(466장 중 360장), 요세미티 하프돔(1,882장 중 325장), 트라팔가 광장(1,893장 중 278장)을 재구성했다. 한 사람이 한 카메라로 찍은 만리장성(120장 중 82장)과 프라하 구시가 광장(197장)도 거뜬히 복원했다. 등록된 이미지의 평균 해상도는 1,611×1,128 픽셀이었고 평균 reprojection error는 약 1.5 픽셀 수준이었다. Snavely가 이 파이프라인을 **Bundler**라는 이름으로 오픈소스로 공개하자, Bundler는 곧 SfM 연구 전체가 딛고 서는 출발선이 됐다.

> 📜 **예언 vs 실제.** Snavely et al.(2006)은 논의 절에서 "Ultimately, we wish to scale up our reconstruction algorithm to handle millions of photographs"라는 포부를 적으며, 카메라가 늘수록 굼떠지는 등록 속도, 렌즈 왜곡 모델, 반복 패턴이나 텍스처 부족 장면, 서로 이어지지 않는 섬처럼 쪼개진 재구성을 숙제로 남겼다. 10년 뒤 COLMAP 논문(Schönberger & Frahm, CVPR 2016)에서는 로마 사진 75,000장 가운데 21,000장을 단일 모델로 정렬해 보였고, 같은 시기 수백만 장 규모를 겨냥한 대규모 시스템들도 차례로 등장했다(→ 1장 §1.4).

## 3.5 COLMAP — 공학적으로 다듬은 SfM

Bundler가 가능성을 열었다면, 그 잠재력을 누구나 믿고 쓸 수 있는 완성도로 끌어올린 것은 2016년 CVPR에 발표된 Johannes Schönberger와 Jan-Michael Frahm의 "[Structure-from-Motion Revisited](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf)"였다. 두 사람은 공개 시스템인 Bundler와 비공개 시스템인 VisualSFM을 곁에 두고 incremental SfM의 매 단계를 처음부터 끝까지 해부해 다시 설계한 뒤, 그 결실을 **COLMAP**이라는 이름으로 공개했다.

이들이 가장 먼저 손을 댄 대목은 *다음에 어떤 이미지를 붙일 것인가*였다. 잘못 고른 사진 한 장이 연쇄적인 등록 실패와 왜곡된 삼각측량을 불러온다고 보았기 때문이다. COLMAP은 이미 복원된 3D 점이 새 이미지에 몇 개나 보이는지뿐 아니라 그 점들이 화면 전체에 얼마나 고르게 퍼져 있는지까지 점수로 매겼다. 실험해 보니 결국 등록되는 이미지의 총량은 같더라도, 이 분산 기준을 따랐을 때 최종 카메라 위치 오차가 가장 작았다.

최적화 주기 역시 실용적으로 손질했다. 카메라 한 장을 붙일 때마다 전체 bundle adjustment를 돌리면 규모가 커질수록 시간이 감당되지 않는다. COLMAP은 VisualSFM의 전략을 따라, 새 이미지를 붙일 때는 그 이미지와 가장 밀접히 연결된 이웃 이미지들만 묶어 local bundle adjustment를 돌리고, 전체 모델을 아우르는 global bundle adjustment는 모델 크기가 일정 비율 이상 불어났을 때만 가동했다.

여기에 기하 검증의 그물을 한층 촘촘히 짰다. 우선 이미지 쌍마다 fundamental matrix를 맞춰 inlier가 충분한 쌍만 통과시킨 뒤, 같은 쌍에 homography를 함께 맞춰 본다. homography는 평면 장면이거나 카메라가 제자리에서 회전만 한 경우를 설명하므로, homography inlier 비중이 상대적으로 낮아야 비로소 깊이감이 있는 일반 3D 장면으로 인정한다. 내부 파라미터를 아는 경우에는 essential matrix로 점을 삼각측량해 시차 각도(triangulation angle)로 제자리 회전(panoramic)과 평면 장면을 가려냈다. 심지어 사진 모서리의 워터마크나 날짜 스탬프 때문에 전혀 다른 장소의 사진이 엉뚱하게 연결되는 사고까지 이 단계에서 차단했다. 재구성은 반드시 충분한 시차가 확보된 일반 쌍에서 시작하며, 제자리 회전 쌍에서는 점을 삼각측량하지 않는다.

COLMAP이 3D 비전 생태계의 표준으로 굳어진 데에는 알고리즘 밖의 미덕도 컸다. 깔끔한 코드와 친절한 문서, 그리고 CUDA 가속 덕분에 대용량 데이터도 무리 없이 돌아갔기 때문이다. 2020년 NeRF가 등장하고 뒤이어 3D Gaussian Splatting이 붐을 일으켰을 때, 대부분의 학습 파이프라인은 COLMAP이 뽑아낸 카메라 자세와 희소 점군을 당연한 입력처럼 받아 썼다. COLMAP은 사실상 현대 3D 재구성의 관문이 됐다.

> 🔗 **차용.** COLMAP의 뼈대는 Bundler와 동일한 incremental SfM이다. essential matrix 추정, 삼각측량, Levenberg-Marquardt 같은 핵심 수학은 Hartley & Zisserman 교과서에서 한 치도 벗어나지 않았다. COLMAP을 특별하게 만든 것은 이미지 선택 순서, 다층 기하 검증, 최적화 주기를 다듬은 엔지니어링의 총합이었다.

---

## 3.6 SfM과 SLAM이 나뉘다

이처럼 SfM과 SLAM은 같은 사영기하와 최소자승 수학을 뿌리에 두고 있으면서도, 2000년대 초반에 이르러 서로 다른 문제를 푸는 별개의 분야로 갈라섰다. 갈림길을 만든 결정적 기준은 **시간**이었다.

SfM은 촬영이 모두 끝난 뒤 *오프라인*에서 데이터를 만진다. 시간 제약이 없으니 전체 사진을 몇 번이고 다시 훑으며 global bundle adjustment를 반복하고, 중간에 자세가 틀어졌으면 되돌아가 다시 풀 여유가 있다.

반면 움직이는 로봇 위에서 돌아가는 SLAM에는 그런 사치가 허락되지 않는다. 센서 데이터가 밀려드는 그 순간마다 로봇의 현재 위치를 즉각 내놓아야 한다. 지나간 프레임 전체를 매번 다시 최적화할 수도 없고, 지도가 커질수록 한 프레임에 쓸 수 있는 시간 예산은 더욱 빠듯해진다. 그러다 로봇이 한 바퀴를 돌아 처음 출발했던 장소로 되돌아오면(loop closure), 그사이 누적된 오차(drift)를 한꺼번에 바로잡아 루프 위의 과거 자세들까지 되돌려 고쳐야 한다.

불확실성을 다루는 태도 역시 갈렸다. SLAM은 새 관측이 들어올 때마다 현재 자세의 불확실성을 실시간으로 갱신해야 하므로 EKF나 factor graph 같은 확률적 상태 표현을 중심에 두는 반면, SfM은 최적화가 끝난 뒤에 사후적으로 공분산을 계산해도 무방했다.

2003년 ICCV 논문 "[Real-Time Simultaneous Localisation and Mapping with a Single Camera](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf)"에서 Andrew Davison은 바로 이 경계선을 콕 집어 말했다. 당시까지 성공을 거둔 SfM 기법들은 예외 없이 영상을 모두 모은 뒤 일괄 처리하는 오프라인 알고리즘뿐이라는 것이다. 그는 카메라로 실시간 위치 추정을 하려면 불확실성 전파를 중시해 온 로봇공학의 SLAM 계보가 오프라인 SfM보다 훨씬 가까운 출발점이라고 주장하며, 자신의 시스템을 "sequential Simultaneous Localisation and Mapping or Structure from Motion"이라 불렀다. 2000년대를 지나며 두 분야는 각자의 문제 정의와 평가 기준을 가진 독자적 영역으로 확고히 자리 잡았다.

> 🔗 **차용.** Nistér, Naroditsky, Bergen의 2004년 CVPR 논문 "Visual Odometry"는 SfM의 기하 기법을 카메라 자체의 움직임(ego-motion)을 실시간으로 추정하는 데 끌어들인 초기 대표작이다. 전체 데이터를 한꺼번에 푸는 대신 짧은 구간 안의 상대 자세를 순차적으로 풀어, 전역 최적화보다 정밀도는 다소 양보하더라도 즉각적인 응답 속도를 얻어 냈다.

---

## 아직 열린 문제

**움직이는 물체가 있는 장면의 SfM.** COLMAP을 포함한 범용 SfM 파이프라인은 세계가 완전히 정지해 있다고 가정한다. 모든 3D 점이 고정돼 있다는 전제로 bundle adjustment를 돌리기 때문에, 자동차와 보행자가 오가는 거리에서는 움직이는 물체 위의 매칭이 최적화를 통째로 왜곡한다. RANSAC이 일부를 걸러 내 주긴 하지만 근본 해법은 아니어서, Dynamic SfM 연구에서는 semantic segmentation이나 객체 단위 모션 모델을 결합해 정적 배경과 동적 물체를 갈라내려 한다.

**흐려지는 SfM과 SLAM의 경계.** 2023년 12월 Wang 등이 발표한 [DUSt3R](https://arxiv.org/abs/2312.14132)는 카메라 내부 파라미터도 자세도 모르는 사진 두 장을 Transformer에 곧바로 넣어, 픽셀마다 3D 좌표가 담긴 pointmap을 한 번에 예측해 냈다. 카메라 자세와 픽셀 대응은 오히려 그 pointmap에서 사후적으로 뽑아낸다. 사진이 석 장 이상이면 쌍마다 얻은 pointmap을 global alignment로 하나의 좌표계에 맞춘다. 뒤이은 [MASt3R](https://arxiv.org/abs/2406.09756)(Leroy et al., 2024)는 여기에 dense local feature 출력까지 더해 매칭 정밀도를 끌어올렸다. 전통적인 SfM 파이프라인의 모듈이 하나씩 신경망으로 대체되면서, NeRF와 3DGS 전처리를 COLMAP 대신 DUSt3R 계열로 넘기려는 시도도 늘고 있다. 학습 기반 모델이 COLMAP의 아성을 완전히 대신할지, 아니면 특정 영역을 나눠 갖게 될지는 아직 단언하기 이르다.

---

SfM 연구자들이 오프라인 3D 재구성의 정밀도를 벼리는 동안, 로봇공학자들은 당장 눈앞에서 굴러가는 로봇을 위해 "데이터가 다 모이기 전에, 불확실성을 껴안은 채 지금 위치를 추정하는" 전혀 다른 수학을 세우고 있었다. 그 이야기는 1986년 Randall Smith와 Peter Cheeseman이 던진 [한 가지 질문](https://people.csail.mit.edu/brooks/idocs/Smith_Cheeseman.pdf)에서 시작된다(→ 4장).


---

# 4장 EKF-SLAM

사진측량과 SfM, bundle adjustment의 세계는 본질적으로 여유가 있었다. 촬영을 모두 마친 뒤 모든 이미지를 책상 위에 펼쳐 놓고 오프라인으로 계산하면 그만이었기 때문이다. Hartley와 Zisserman의 사영기하, RANSAC, Levenberg-Marquardt는 정지된 장면을 정교하게 측량하는 데 더할 나위 없는 도구였지만, 당장 눈앞에서 바퀴를 굴리는 로봇이 *"내가 지금 어디에 있는가"*에 즉답해야 하는 문제와는 결이 달랐다. 로봇이 미지의 공간을 누비며 지도를 그리는 동시에 자기 위치를 추정하는 문제를 확률론의 언어로 풀어내기 시작한 것은 1980년대 중반에 이르러서다.

Durrant-Whyte와 Bailey는 2006년 튜토리얼에서 그 역사적 기점을 1986년 샌프란시스코에서 열린 IEEE Robotics and Automation 학회(ICRA)로 짚는다. 당시 지도 작성과 위치 추정에 통계적 추정 이론을 접목하려던 Peter Cheeseman, Jim Crowley, Hugh Durrant-Whyte 등은 학회 기간 내내 복도와 강연장을 오가며 일관된 확률적 지도를 어떻게 만들 것인가를 두고 열띤 토론을 벌였다. 그 직후 몇 년 사이 SRI International의 Randall Smith와 Cheeseman, 그리고 Durrant-Whyte가 landmark 사이의 기하적 관계와 불확실성을 통계로 정식화한 논문들을 잇달아 내놓았고, Oxford에서는 Durrant-Whyte와 그의 박사과정 학생 John Leonard가 이 수학을 실제 자율 이동 로봇에 얹어 오늘날 우리가 아는 EKF-SLAM의 원형을 빚어냈다.

---

## 4.1 불확실한 공간 관계의 수학 — Smith, Self, Cheeseman (1988)

출발선은 소박하지만 날카로운 질문 하나였다. 로봇이 A 지점에서 B 지점까지의 상대 거리를 재고, 다시 B에서 C까지의 상대 거리를 쟀을 때, A에서 C에 이르는 위치와 그 오차의 크기는 어떻게 계산해야 할까? 1986년 SRI International의 Randall Smith, Matthew Self, Peter Cheeseman은 로봇이 이동하며 쌓은 불확실한 측정값들을 일관되게 합성하는 수학을 정립했고, UAI 1986 발표를 거쳐 1988년 논문집에 기념비적 논문 ["Estimating Uncertain Spatial Relationships in Robotics"](https://arxiv.org/abs/1304.3111)을 실었다.

이들이 꺼내 든 무기는 1960년 세상에 나와 레이더 추적과 탄도 계산, 위성 궤도 추정의 표준으로 자리 잡고 있던 [Kalman 필터](https://doi.org/10.1115/1.3662552)였다. Smith, Self, Cheeseman은 Kalman 필터의 공분산 전파 방정식을 공간 변환의 합성(composition)에 맞게 다시 짰다. 핵심은 로봇의 pose $\mathbf{x}_r$과 지도의 모든 landmark 위치 $\mathbf{m}_i$를 하나의 거대한 state vector로 묶고, 전체의 결합 공분산 행렬 $\mathbf{P}$를 통째로 유지하는 데 있었다.

$$\mathbf{x} = [\mathbf{x}_r^\top,\ \mathbf{m}_1^\top,\ \ldots,\ \mathbf{m}_N^\top]^\top$$

$$\mathbf{P} = \begin{bmatrix} \mathbf{P}_{rr} & \mathbf{P}_{rm} \\ \mathbf{P}_{mr} & \mathbf{P}_{mm} \end{bmatrix}$$

여기서 결정적인 역할을 하는 것은 대각선 바깥에 자리한 비대각 블록 $\mathbf{P}_{rm}$이다. 이 블록은 로봇 자신의 위치 불확실성과 각 landmark의 위치 불확실성이 서로 얼마나 단단히 얽혀 있는지를 기록한다. 로봇이 자기가 어디 있는지 정확히 모른 채 관측한 landmark들은 필연적으로 로봇 위치 추정의 공통 오차를 나눠 갖게 되므로, 모든 landmark 추정치는 서로 상관될 수밖에 없다. Smith, Self, Cheeseman은 이 논문에서 이 상관관계를 버리지 않고 끝까지 함께 추적해야만 지도가 모순 없이 수렴한다는 사실을 꿰뚫어 보았다.

하지만 이 통찰이 곧장 받아들여지지는 않았다. 모든 landmark를 한 state에 담아 관측마다 갱신하면 계산량이 landmark 수의 제곱($O(N^2)$)으로 불어나는 데다, 당시에는 지도 오차가 정말 수렴하는지조차 수학적으로 증명되지 않았다. 그래서 한동안 연구자들은 landmark 사이의 상관관계를 인위적으로 줄이거나 아예 지워 버리는 근사법에 매달렸다. 그러다 1995년 무렵에 이르러서야 연구자들은 결합 문제를 쪼개지 않고 하나로 풀 때 비로소 추정이 수렴하며, 그동안 귀찮은 짐처럼 여겨 지우려 들었던 상관관계야말로 SLAM 문제의 본질이라는 사실을 깨달았다. 이 깨달음과 함께 Smith-Self-Cheeseman의 정식화는 EKF-SLAM의 표준 교과서가 됐다.

> 🔗 **차용.** Smith-Self-Cheeseman(1988)의 공간 관계 수학은 Kalman(1960)의 공분산 전파 방정식을 그대로 이어받았다. 원래 하늘을 나는 단일 표적을 쫓기 위해 고안된 필터링 수학이, 로봇 자신과 그 주변 환경 전체를 동시에 추적하는 공간 추정 이론으로 탈바꿈한 순간이었다.

---

## 4.2 "SLAM"이라는 이름

흥미롭게도 Smith, Self, Cheeseman의 1988년 논문 어디에도 "SLAM"이라는 단어는 나오지 않는다. 이 문제가 지금의 이름을 얻기까지는 몇 해가 더 필요했다. 1991년 John Leonard와 Hugh Durrant-Whyte는 IROS에 ["Simultaneous Map Building and Localization for an Autonomous Mobile Robot"](https://doi.org/10.1109/IROS.1991.174711)을 발표하며, 지도 작성과 위치 추정을 별개의 모듈로 떼어 놓고는 풀 수 없으며 반드시 *동시에* 다뤄야 한다는 핵심을 제목에 못 박았다. 당시 학계에서는 같은 문제를 CML(concurrent mapping and localization) 등 여러 이름으로 부르며 혼용하고 있었다.

Durrant-Whyte와 Bailey의 튜토리얼에 따르면, 우리가 익히 아는 "SLAM"이라는 약어는 1995년 International Symposium on Robotics Research(ISRR)에서 발표된 이동 로봇 서베이 논문(Durrant-Whyte, Rye, Nebot)에서 공식 지면에 처음 등장했다. SLAM 문제의 수학적 구조와 수렴 성질 역시 이 자리에서 처음으로 체계화됐다. 같은 해 Durrant-Whyte는 Oxford를 떠나 Sydney 대학으로 적을 옮겼고, MIT Sea Grant의 AUV 연구실에서 일하던 Leonard는 이듬해 MIT 교수진에 합류했다. 두 대륙을 거점으로 뻗어 나간 "Simultaneous Localization and Mapping"이라는 이름은 그 뒤 십 년 안에 분야 전체를 아우르는 고유명사로 굳어졌다.

> 🔗 **병행 계보.** [Bar-Shalom의 다중 표적 추적](https://archive.org/details/trackingdataasso0000bars)(multi-target tracking, 1988년 단행본)과 초기 SLAM은 미지의 상태 여러 개의 불확실성과 data association(어느 관측이 어느 대상에서 왔는지 가려내는 일)을 함께 푼다는 점에서 수학 구조가 맞닿아 있다. 움직이는 표적과 추적기의 구도를 정지한 landmark와 움직이는 로봇에 대입해 보면 두 문제의 닮은 꼴이 선명히 드러난다. 다만 현재 확인되는 인용 기록만으로는 Leonard와 Durrant-Whyte가 다중 표적 추적의 공식을 직접 끌어왔다고 단정하기는 어렵다.

## 4.3 EKF-SLAM의 공식

초창기 SLAM의 주무기는 단연 확장 칼만 필터(EKF)였다. 이미 항공우주와 제어공학에서 비선형 시스템 추정의 표준으로 검증된 EKF는 로봇이 움직일 때 상태를 예측하는 **predict** 단계와, 센서 관측이 들어왔을 때 추정을 바로잡는 **update** 단계를 끊임없이 번갈아 돈다.

먼저 로봇에 제어 입력 $\mathbf{u}$가 들어가면 비선형 모션 모델 $f(\cdot)$로 다음 상태를 예측하고, 그 선형 근사인 Jacobian $\mathbf{F}$로 공분산을 넓힌다.

$$\hat{\mathbf{x}}^- = f(\hat{\mathbf{x}}, \mathbf{u})$$
$$\mathbf{P}^- = \mathbf{F}\mathbf{P}\mathbf{F}^\top + \mathbf{Q}$$

이어 센서가 측정값 $\mathbf{z}$를 내놓으면 관측 모델 $h(\cdot)$의 Jacobian $\mathbf{H}$로 Kalman gain $\mathbf{K}$를 계산해 상태 벡터와 공분산 행렬을 한꺼번에 갱신한다.

$$\mathbf{K} = \mathbf{P}^-\mathbf{H}^\top(\mathbf{H}\mathbf{P}^-\mathbf{H}^\top + \mathbf{R})^{-1}$$
$$\hat{\mathbf{x}} = \hat{\mathbf{x}}^- + \mathbf{K}(\mathbf{z} - h(\hat{\mathbf{x}}^-))$$
$$\mathbf{P} = (\mathbf{I} - \mathbf{K}\mathbf{H})\mathbf{P}^-$$

수식은 다섯 줄로 깔끔하게 떨어지지만, 이 단순함 뒤에는 가혹한 계산 비용이 숨어 있었다. 원인은 상태 벡터의 차원이다. 6-DoF 로봇 pose에 3D landmark $N$개를 얹으면 상태 벡터 길이는 $6 + 3N$이 되고, 공분산 행렬 $\mathbf{P}$의 원소 수는 $(6 + 3N)^2$개, 즉 $O(N^2)$으로 불어난다. 센서 관측의 차원이 아무리 작아도(그래서 $\mathbf{S} = \mathbf{H}\mathbf{P}^-\mathbf{H}^\top + \mathbf{R}$의 역행렬 계산이 아무리 가벼워도), update 한 번이 끝날 때마다 행렬 $\mathbf{P}$ 전체를 훑어 고쳐야 하므로 어떤 경우든 $O(N^2)$의 계산량을 피할 수 없다. landmark가 100개일 때 $306 \times 306$(약 9.4만 원소)이던 행렬은 landmark가 1,000개로 늘면 단숨에 $3006 \times 3006$(약 900만 원소)짜리 거구로 비대해진다.

## 4.4 지도를 키우기 어렵다

이 이차적 증가의 벽은 곧 실전 시스템의 발목을 잡았다. [Davison의 ICCV 2003 논문](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf)에서는 full-covariance EKF-SLAM의 갱신 비용이 특징점 수 $N$의 제곱에 비례해 치솟기 때문에, 당시 2.2 GHz Pentium PC에서도 특징점이 100개 근처에 다다르면 갱신 시간이 급격히 늘어나 실시간 구동이 버거워진다고 솔직히 털어놓았다. 그 이상의 지도를 다루려면 필터의 원형을 훼손하는 근사 기법에 기댈 수밖에 없었다.

EKF는 로봇과 모든 landmark의 결합 분포를 단 하나의 덩어리로 붙들고 있기에, 새 landmark 하나가 지도에 들어오는 순간 기존 모든 landmark와의 상관관계가 연쇄적으로 살아난다. 2000년대 중반까지 연구자들이 이 병목을 뚫으려고 주로 매달린 해법은 **submap** 분할이었다. 거대한 환경을 서로 조금씩 겹치는 작은 구역들로 쪼갠 뒤 구역마다 독립된 작은 EKF를 돌리고, 구역 사이의 연결만 별도 그래프로 관리하는 방식이다. [Chong과 Kleeman(1999)](http://www.cs.cmu.edu/afs/cs/Web/People/motionplanning/papers/sbp_papers/integrated1/chong_feature_map.pdf)이 초음파 센서 배열로 넓은 실내 지도를 그리며 이 전략을 선보였다. 하지만 submap의 경계를 넘나들 때마다 정보가 유실되고 loop closure를 매끄럽게 처리하기가 까다로운 데다 구현마저 복잡해서, 실제 현장 시스템에 널리 뿌리내리지는 못했다.

> 🔗 **차용.** Chong과 Kleeman(1999)의 submap 분할과 현대 SLAM의 local window 최적화는 한 번의 계산에 올리는 변수 규모를 통제한다는 문제의식을 공유한다. ORB-SLAM의 local map이나 VINS-Mono의 sliding window 역시 같은 고민의 산물이다. 다만 지도를 쪼개는 기준과 과거 상태를 주변화(marginalization)하는 수학적 절차가 판이해, 앞의 submap 기법을 직접 계승했다고 보기는 어렵다.

## 4.5 Consistency 문제: Julier-Uhlmann의 반례

계산량보다 더 뼈아픈 결함은 2001년 ICRA에서 터져 나왔다. Simon Julier와 Jeffrey Uhlmann은 논문 ["A Counter Example to the Theory of Simultaneous Localization and Map Building"](https://doi.org/10.1109/ROBOT.2001.933280)에서, 계산량을 전혀 아끼지 않은 이상적인 full-covariance EKF-SLAM조차 수학적으로 일관되지 않은(inconsistent) 지도를 만들어 낸다는 사실을 증명했다. 이들이 든 가장 단순한 반례는 충격적이었다. 프로세스 잡음 없이 제자리에 꼼짝 않고 서 있는 로봇이 거리·방위 센서로 landmark를 반복 관측하는 상황에서도, 각도 불확실성이 0이 아닌 한 지도는 *반드시* 일관성을 잃는다는 것이다. 두 사람은 움직이는 로봇에서도 똑같은 현상이 벌어지며, 이 비일관성이 관측 갱신이 수백 번 누적된 뒤에야 수면 위로 드러난다고 경고했다.

후속 문헌에서는 이 논문을 인용하며 EKF-SLAM이 시간이 흐를수록 **과신(overconfident)**에 빠진다는 표현을 즐겨 쓴다. 로봇과 지도의 실제 오차는 점점 커지는데도 필터가 스스로 계산해 낸 공분산 행렬은 실제 오차보다 훨씬 작은 값으로 쪼그라든다.

원인은 EKF가 품고 있는 1차 Taylor 근사, 즉 **선형화 오차(linearization error)**에 있었다. 매 스텝 현재의 불완전한 추정치 근처에서 모션 모델과 관측 모델을 직선으로 잘라 근사하다 보니, 그 미세한 근사 오차가 갱신을 거듭하며 차곡차곡 쌓여 공분산을 실제보다 좁게 오그라뜨린다. 한번 자기 위치를 지나치게 확신하게 된 필터는 그다음부터 들어오는 새 센서 측정값을 불신해 거의 반영하지 않고, 결국 틀린 추정치에 스스로를 가둬 버린다.

2007년 [Shoudong Huang과 Gamini Dissanayake](https://doi.org/10.1109/TRO.2007.903811)는 이 병리의 해부도를 한층 정밀하게 그려 냈다. 이들은 매 단계 현재 추정값에서 새로 계산한 Jacobian들이 원래 시스템이 지켜야 할 기하적 항등 관계를 어기는 데 주목했다. 로봇이 landmark까지의 상대 위치만 재면서 로봇과 landmark의 절대 좌표를 동시에 갱신하는 구조에서는, 극단적인 경우 로봇 방향각 추정의 분산이 물리적으로 불가능한 0까지 수직 낙하하기도 했다. 이후 이어진 observability(가관측성) 분석 연구에서는 이 논문을 발판 삼아, 선형화 기준점이 프레임마다 흔들리면 원래 관측 불가능한 전역 방향(yaw) 자유도가 갑자기 관측 가능한 것처럼 둔갑해 필터가 근거 없는 정보를 주입한다는 사실까지 밝혀냈다.

> 📜 **예언 vs 실제.** Julier와 Uhlmann의 2001년 반례 이후 약 10년간 연구자들은 필터 자체를 고쳐 일관성을 되살리려 애썼다. Unscented Kalman Filter(UKF), Invariant EKF, robust covariance 같은 정교한 변형들이 줄지어 등장했다. 하지만 2026년의 시점에서 되돌아보면 이 문제의 주류 해법은 필터 밖, 즉 반복 최적화 기반 추정에서 나왔다. [iSAM](https://www.cs.cmu.edu/~kaess/pub/Kaess08tro.pdf)(Kaess et al., TRO 2008), [g2o](http://ais.informatik.uni-freiburg.de/publications/papers/kuemmerle11icra.pdf)(Kümmerle et al., ICRA 2011), GTSAM 같은 그래프 최적화 도구들이 지배적 위치를 차지했고, 필터 기반 VIO 역시 선형화 지점을 고정하는 기법 등을 얹어 나란히 발전했다. 반복 최적화는 과거 상태를 버리지 않으므로 언제든 더 정확한 해 근처에서 다시 선형화할 수 있다. 물론 최적화 기반이라도 상태를 주변화(marginalization)할 때의 선형화와 가관측성 관리는 여전히 세심하게 다뤄야 하는 과제로 남아 있다.

## 4.6 FastSLAM — 문제를 쪼개다

$O(N^2)$의 벽을 넘으려는 또 하나의 독창적인 시도는 2002년 AAAI에서 나왔다. Michael Montemerlo, Sebastian Thrun, Daphne Koller, Ben Wegbreit가 발표한 [FastSLAM](https://cdn.aaai.org/AAAI/2002/AAAI02-089.pdf)은 베이즈 네트워크의 조건부 독립성, 즉 **Rao-Blackwellization**을 정면으로 활용했다. 핵심 통찰은 놀라울 만큼 명쾌했다. 로봇이 지나온 *전체 경로* $x_{0:t}$를 알고 있다고 가정하면, 각 landmark의 위치를 추정하는 문제들이 뜻밖에도 *서로 완전히 독립*이 된다.

FastSLAM은 이 성질을 이용해 문제를 둘로 갈랐다. 로봇의 경로는 particle filter로 추적하고(각 particle이 가능한 경로 가설 하나를 품는다), 각각의 particle 안에서는 $N$개의 landmark마다 아주 작은 $3\times 3$(2D라면 $2\times 2$) EKF를 따로따로 돌렸다. landmark들이 서로 얽혀 거대한 $N \times N$ 공분산 행렬을 이룰 이유가 사라진 것이다.

물론 particle이 $K$개, landmark가 $N$개일 때 particle을 resampling할 때마다 각 particle이 거느린 landmark 지도 전체를 복사하면 한 스텝에 $O(KN)$ 비용이 들 수 있었다. 연구진은 landmark 추정치들을 이진 트리 자료구조에 담아 resampling 시 변경된 경로의 가지에만 새 노드를 할당함으로써 스텝당 비용을 $O(K \log N)$까지 극적으로 낮췄다. 게다가 particle 수를 100개 안팎으로 고정해도 여러 환경에서 거뜬히 동작함을 보였다.

시뮬레이션에서 FastSLAM은 particle 100개만으로 landmark 5만 개짜리 지도를 너끈히 소화했고, NASA 화성 탐사 모의 실험장에서 SICK 레이저를 단 Pioneer 로봇으로 수행한 실측 실험에서는 particle 10개만으로 평균 오차 8.3 cm라는 인상적인 기록을 남겼다. 그러나 환경이 더 넓어지고 루프가 길어지자 particle filter 특유의 **particle depletion(입자 고갈)**이라는 복병이 고개를 들었다. resampling을 거듭할수록 다양했던 경로 가설들이 빠르게 사라져 결국 대다수 particle이 미세하게 틀린 경로 하나를 복제하게 되고, 실제로 유효한 표본 수(effective sample size)가 바닥나면서 막상 loop closure 순간에 경로 가중치를 재조정할 여력이 남지 않았던 것이다. [FastSLAM 2.0](https://www.ijcai.org/Proceedings/03/Papers/165.pdf)(Montemerlo et al., IJCAI 2003)이 최신 관측까지 반영한 proposal distribution으로 한계를 넓혔지만, 필터라는 틀 안에서 거대 환경의 drift를 막는 데는 구조적 한계가 분명했다.

## 4.7 EKF의 퇴장

결국 EKF-SLAM을 주류의 자리에서 내려오게 만든 것은 2005년 이후 실전 성능을 증명한 그래프 기반 최적화였다. 1997년 [Feng Lu와 Evangelos Milios가 던진 포즈 그래프의 아이디어](https://doi.org/10.1023/A:1008854305733) 위에 [Olson, Leonard, Teller(2006)](https://april.eecs.umich.edu/pdfs/olson2006icra.pdf)의 빠른 해법이 얹혔고, 뒤이어 등장한 iSAM(2008)과 iSAM2는 희소 행렬 분해를 증분 방식으로 갱신해 그래프 최적화에서도 실시간 응답이 가능함을 입증했다.

결정적 승부처는 loop closure였다. 로봇이 한 바퀴를 돌아 출발점으로 되돌아왔을 때, EKF는 거대한 전체 공분산 행렬을 $O(N^2)$ 비용으로 다시 뜯어고쳐야 했을 뿐 아니라 이미 쌓인 선형화 오차 때문에 과거 궤적을 깔끔히 펴지도 못했다. 반면 포즈 그래프는 그래프에 loop closure 엣지 하나를 추가하고 희소 행렬을 다시 푸는 것만으로 전체 궤적을 훨씬 가볍고 정확하게 바로잡았다. 2010년 무렵을 지나며 새로운 SLAM 시스템의 backend는 급속히 그래프 최적화로 재편됐고, 필터 계열은 상태 크기를 작게 묶어 둘 수 있는 visual-inertial odometry(VIO) 영역에서 제2의 전성기를 맞았다(→ 9장).

> 📜 **예언 vs 실제.** Bailey와 Durrant-Whyte는 [2006년 *IEEE Robotics & Automation Magazine* 튜토리얼 2부](https://www.doc.ic.ac.uk/~ajd/Robotics/RoboticsResources/SLAMTutorial2.pdf)에서 EKF의 계산 병목을 돌파할 대안으로 갱신 분할, information form(정보 행렬)의 희소화, 그리고 submap을 꼽았다. 공분산의 역행렬인 information matrix는 큰 지도에서 비대각 성분이 대부분 0에 가까워 보였기에, Thrun 등은 작은 항을 0으로 잘라 내는 근사 희소화를 시도했다. 그러나 곧 Eustice 등이 이 근사 역시 비일관성을 부른다는 점을 지적했다. 같은 튜토리얼은 지나간 로봇 pose를 모두 state에 남겨 두면 information matrix가 어떤 근사 없이도 본래부터 희소해진다는 중요한 사실을 함께 짚었는데, 2010년대 SLAM의 표준으로 살아남은 것은 바로 이 "과거 pose를 남기는 factor graph와 반복 최적화"였다.

---

## 아직 열린 문제

**필터와 최적화가 함께 쓰인다.** EKF는 대규모 지도 작성의 주력에서는 물러났지만 완전히 사라진 것은 아니다. 2026년 현재에도 일부 자율주행 스택과 저전력 임베디드 플랫폼은 여전히 필터를 고수한다. 반복 최적화 기반 SLAM은 수렴 조건에 따라 매 프레임 실행 시간이 들쭉날쭉해 엄격한 실시간 마감(hard real-time)을 보장하기 어려운 경우가 있는 반면, sparse EKF나 UKF는 연산량이 예측 가능하고 가볍기 때문이다.

**비가우시안 불확실성.** EKF의 가장 뿌리 깊은 가정은 모든 불확실성이 단봉(unimodal) 가우시안 분포를 따른다는 것이다. 그러나 현실의 센서 오차는 꼬리가 두껍거나(heavy-tail) 여러 개의 봉우리가 솟은(multimodal) 형태를 띠는 일이 잦다. 특히 닮은 복도가 반복돼 로봇이 "여긴지 저긴지" 여러 위치 가설을 동시에 품어야 하는 perceptual aliasing 상황에서는 단일 가우시안이 무력하다. 이론상 비가우시안 분포를 다룰 수 있는 particle filter는 차원이 조금만 높아져도 계산이 폭발한다. 이 간극을 메우기 위해 Stein particle, normalizing flow, 학습 기반 불확실성 추정 같은 새로운 시도들이 계속되고 있다.

---

그래프 최적화가 EKF를 밀어내기 직전인 2003년, 바로 이 고전적인 EKF를 들고나와 카메라 단 한 대만으로 실시간 3D SLAM에 성공해 세상을 놀라게 한 연구자가 있었다. Andrew Davison의 MonoSLAM과 그 뒤를 이어 단안 SLAM의 설계 문법을 새로 쓴 PTAM의 이야기다(→ 5장).


---

# 5장 단안 실시간 SLAM: MonoSLAM과 PTAM

4장에서 보았듯 EKF-SLAM은 로봇 상태와 불확실성을 함께 추적하는 명쾌한 틀이었지만, landmark 수 $N$에 대해 공분산 행렬이 $O(N^2)$으로 부풀어 오르는 한계 때문에 지도를 크게 키우기 어려웠다. 2000년대 중반, 같은 Oxford 대학의 울타리 안에서 Andrew Davison과 Georg Klein 두 연구자는 바로 이 벽을 마주하고 단안 카메라 실시간 SLAM을 정반대의 해법으로 풀어냈다.

2003년 Oxford의 Davison은 손에 쥔 웹캠 한 대만으로 카메라의 6자유도 궤적과 주변 지도를 데스크톱 PC 위에서 실시간으로 그려 보였다. Smith-Self-Cheeseman의 확률적 공간 관계 수학과 Leonard·Durrant-Whyte의 EKF-SLAM 골격을 그대로 가져왔지만, 무거운 레이저 스캐너도, 스테레오 카메라도, IMU도 없이 오직 Shi-Tomasi 코너 검출기와 Kalman 필터의 예측-갱신 루프만으로 이룬 성과였다. 그리고 불과 4년 뒤인 2007년, 같은 Oxford 연구실에서 Georg Klein과 David Murray는 필터 자체를 과감히 내려놓고 tracking과 mapping을 두 개의 독립 스레드로 쪼갠 **PTAM**을 내놓았다. 이후 10년 넘게 쏟아진 Visual SLAM 시스템의 아키텍처는 대부분 Klein과 Murray가 그날 그린 청사진을 따랐다.

---

## 5.1 2003년의 데모

Davison이 ICCV 2003에서 [Real-Time Simultaneous Localisation and Mapping with a Single Camera](https://doi.org/10.1109/ICCV.2003.1238654)를 발표할 당시, SLAM 학계에서 카메라를 주 센서로 삼는 일은 이단에 가까웠다. Davison 자신이 논문에서 짚었듯, 당시 로봇공학자들은 거의 예외 없이 레이저 센서에 의존했다. 2D 레이저 스캐너는 거리를 곧바로 쟀고, 스테레오 카메라는 두 렌즈 사이의 시차로 픽셀 깊이를 즉각 뽑아낼 수 있었다. 반면 단안 카메라는 본질적으로 *방위(bearing)*만 줄 뿐 *깊이*를 주지 못한다. 3D 구조를 세우려면 최소한 서로 다른 두 시점의 프레임이 있어야 하는 데다, 처음 추정한 깊이의 막대한 불확실성이 EKF 상태 벡터 전체로 번져 나갔다. 그래서 이론상 가능하다는 것은 알았어도 30 Hz 실시간으로 돌리는 일은 난공불락으로 여겨졌다.

MonoSLAM은 바로 그 장벽을 뚫었다. 추가 하드웨어도, 까다로운 스테레오 캘리브레이션도 없이 값싼 카메라 한 대만으로 방 안의 3차원 구조를 실시간으로 빚어낸 첫 시연이었다.

---

## 5.2 EKF로 짠 단안 SLAM과 그 한계

2007년 *IEEE TPAMI*에 게재된 [MonoSLAM](https://doi.org/10.1109/TPAMI.2007.1049)은 Davison이 Ian Reid, Nicholas Molton, Olivier Stasse와 함께 ICCV 2003의 프로토타입을 완전한 이론과 시스템으로 다듬어 낸 결정판이다. 이들은 [Smith-Self-Cheeseman(1988)](https://arxiv.org/abs/1304.3111)과 [Leonard-Durrant-Whyte(1991)](https://ieeexplore.ieee.org/document/174711/)의 EKF-SLAM 정식화(→ §4.3)를 단안 카메라에 맞춰 정교하게 이식했다. 상태 벡터 $\mathbf{x} = (\mathbf{x}_v^\top, \mathbf{y}_1^\top, \ldots, \mathbf{y}_N^\top)^\top \in \mathbb{R}^{13+3N}$ 안에는 카메라 상태 $\mathbf{x}_v \in \mathbb{R}^{13}$(위치 3, 사원수 방향 4, 선속도 3, 각속도 3)과 3D landmark 좌표 $\mathbf{y}_i \in \mathbb{R}^3$이 함께 들어갔고, $(13+3N)\times(13+3N)$ 크기의 공분산 행렬 $\mathbf{P}$가 매 프레임 예측-갱신 루프를 돌며 갱신됐다. 손에 쥔 카메라에는 바퀴 오도메트리가 없어 다음 움직임을 가늠하려면 속도 예측이 필수였기에, 상태 벡터에 선속도와 각속도를 얹은 정속도(constant velocity) 운동 모델이 핵심 역할을 했다.

예측 단계에서는 운동 모델 $f$의 Jacobian $\mathbf{F}$로 공분산을 전파하고($\mathbf{P}^- = \mathbf{F}\mathbf{P}\mathbf{F}^\top + \mathbf{Q}$), 갱신 단계에서는 카메라 투영 함수의 Jacobian $\mathbf{H}_i$로 Kalman gain을 구해 상태와 공분산을 다듬었다. 모든 landmark 간의 상관관계가 공분산 행렬 $\mathbf{P}$ 안에 빠짐없이 유지된 덕에 불확실성 전파는 수학적으로 빈틈이 없었지만, 대가는 가혹했다. 공분산 갱신 $(\mathbf{I} - \mathbf{K}_i\mathbf{H}_i)\mathbf{P}^-$의 핵심 연산인 $(13+3N)^2$ 행렬 곱셈이 특징점 수 $N$의 제곱으로 치솟은 것이다. PAMI 논문은 이 때문에 30 Hz 실시간성을 지키려면 지도 전체에 유지할 수 있는 특징점이 "around 100"개로 묶일 수밖에 없다고 명시했다.

더 넓은 공간으로 나아가려면 어떻게 해야 할까? Davison은 논문 결론에서 sub-map 전략이 "certainly seems appropriate"하다고 적으면서도, 시각적 특징으로 이루어진 지도를 의미 있는 하위 구역으로 깔끔히 나누는 방법은 아직 모호하다고 솔직히 덧붙였다. 특징이 100개 남짓으로 제한된 조건에서 최선의 성능을 짜내기 위해, MonoSLAM은 [Shi-Tomasi(1994)](https://doi.org/10.1109/CVPR.1994.323794)의 "Good Features to Track" 기준으로 추적성이 뛰어난 특징점만 소수 정예로 골라 담았다. 논문에 따르면 광각 렌즈를 쓴 환경에서도 프레임당 고작 12개 안팎의 특징점이 화면에 들어오도록 깐깐하게 지도를 관리했다.

> 🔗 **차용.** Shi-Tomasi(1994)의 코너 점수는 PTAM보다 앞서 MonoSLAM에서 먼저 시각 SLAM의 핵심 선별 기준으로 자리 잡았다. 뒤이은 PTAM 역시 빠른 검출은 FAST-10에 맡기되, 실제 지도에 영구 편입할 점은 Shi-Tomasi 점수로 가려내는 절충을 택했다.

---

## 5.3 2007년, 같은 해

2007년은 단안 Visual SLAM 역사에서 가장 극적인 해였다. 한쪽에서는 MonoSLAM의 집대성인 PAMI 논문이 출간돼 EKF 기반 단안 SLAM의 정점을 찍었고, 같은 해 열린 증강현실 학회 ISMAR에서는 Georg Klein과 David Murray가 전혀 다른 패러다임의 논문 [Parallel Tracking and Mapping for Small AR Workspaces](https://doi.org/10.1109/ISMAR.2007.4538852)(**PTAM**)를 발표했다.

두 시스템의 인연은 놀라울 만큼 가까웠다. Klein은 Cambridge에서 Tom Drummond의 지도로 박사학위를 마친 뒤 Oxford로 건너와 David Murray 연구실의 박사후연구원으로 일하고 있었는데, 공교롭게도 바로 그 Murray가 몇 해 전 Davison의 Oxford 박사과정 지도교수였다. 스승이 같은 연구실의 두 세대가 필터와 최적화라는 정반대의 해법을 내놓은 셈이다. Klein과 Murray는 PTAM 논문에서 MonoSLAM이 소수의 고품질 특징점으로 희소한 지도를 유지하는 전략을 직접 언급했다. 이어 자신들은 개별 특징의 품질에 덜 까다로운 대신 훨씬 조밀한 지도를 쌓고, EKF를 쓰지 않고 tracking과 mapping을 물리적으로 분리하는 길을 택했다고 선언했다.

---

## 5.4 Tracking과 Mapping을 나누다

PTAM의 발상은 단순하지만 혁명적이었다. EKF-SLAM에서는 카메라의 현재 자세를 쫓는 일(tracking)과 3D 지도를 빚고 고치는 일(mapping)이 매 프레임 단 하나의 예측-갱신 루프 속에 묶여 있었다. 그러다 보니 지도가 조금만 커져도 매 프레임 돌아가는 갱신 루프가 느려지며 전체 시스템이 멈춰 섰다. PTAM은 이 두 일을 **두 개의 병렬 스레드**로 완전히 갈라놓았다.

**Tracking 스레드**는 오직 실시간 카메라 pose 추정에만 전념한다. 이미 만들어진 지도의 3D 점들을 현재 프레임에 투영하고 관측된 코너와 짝지어 매 프레임 빠르게 자세만 푼다. 한편 **Mapping 스레드**는 한 박자 느긋하게 백그라운드에서 돈다. 새 keyframe이 들어올 때마다 가장 최근 keyframe과 그에 가까운 4개, 총 5개를 묶어 local bundle adjustment를 돌리고, CPU에 여유가 나면 지도 전체를 대상으로 global bundle adjustment를 수행한다. Mapping 계산이 다소 밀리더라도 Tracking 스레드는 지체 없이 30 Hz로 계속 굴러가므로, 실시간 추적이 끊기지 않는다.

Mapping 스레드가 푸는 최적화는 keyframe 집합 $\mathcal{K}$와 3D 점 집합 $\mathcal{P}$에 걸쳐 robust reprojection error를 최소화하는 문제였다.

$$\min_{\{\mathbf{T}_k\}, \{\mathbf{p}_j\}} \sum_{k \in \mathcal{K}} \sum_{j \in \mathcal{P}_k} \rho\!\left(\left\|\mathbf{z}_{kj} - \pi(\mathbf{T}_k,\, \mathbf{p}_j)\right\|^2_{\mathbf{\Sigma}_{kj}}\right)$$

여기서 $\mathbf{T}_k \in SE(3)$는 keyframe $k$의 자세, $\mathbf{p}_j \in \mathbb{R}^3$는 3D 점 좌표, $\pi$는 카메라 투영 함수, $\mathbf{z}_{kj}$는 관측된 픽셀 좌표, $\mathbf{\Sigma}_{kj}$는 관측 공분산이며, $\rho$는 오매칭의 영향력을 깎아 내리는 Tukey biweight robust kernel이다. Klein과 Murray는 이 비선형 최적화를 풀기 위해 Hartley와 Zisserman 교과서(*Multiple View Geometry* 2판) Appendix 6.6에 실린 Levenberg–Marquardt bundle adjustment를 "almost textbook" 수준으로 곧이곧대로 구현했다고 밝혔다.

이 비동기 분리 구조 덕분에 단안 SLAM의 지도 규모는 단숨에 두 자릿수에서 수천 단위로 뛰어올랐다. PTAM 논문 시연에서 지도는 무난히 점 2,000~6,000개와 keyframe 40~120개를 품었고, 시스템은 최대 점 11,000개와 keyframe 280개까지도 돌아갔다(다만 keyframe이 100개를 넘어서면 global bundle adjustment가 새 keyframe 유입 속도를 따라잡지 못하는 한계는 남았다). 특징점 100개 안팎을 아슬아슬하게 유지하던 MonoSLAM과는 체급 자체가 달라졌다.

초기 지도를 세우는 방식에서도 결별했다. 사용자가 카메라를 옆으로 부드럽게 움직이면 PTAM은 [Nistér(2004)](https://doi.org/10.1109/TPAMI.2004.17)의 5-point 알고리즘 계열을 이용해 첫 두 keyframe 사이의 essential matrix $\mathbf{E}$를 추정하고 초기 3D 점군을 삼각측량으로 복원했다. essential matrix $\mathbf{E} = \mathbf{t}_\times \mathbf{R}$은 대응점 쌍 $(\mathbf{p}, \mathbf{p}')$에 대해 ${\mathbf{p}'}^\top \mathbf{E}\, \mathbf{p} = 0$을 만족하며 자유도가 5다. 최소 개수인 5쌍만으로 풀면 복소수 해를 포함해 최대 10개의 후보가 나오는데, Nistér가 이 5차 다항식 연립방정식을 초고속으로 푸는 대수적 해법을 열어 준 덕분에 RANSAC 루프 안에서 실시간 초기화가 가능해졌다.

> 🔗 **차용.** PTAM의 5-point 초기화는 Nistér(2004) "An Efficient Solution to the Five-Point Relative Pose Problem"에서 꽃피운 minimal solver 계보에 서 있다. PTAM 논문이 구현의 바탕으로 직접 인용한 것은 그 후속 연구인 Stewénius·Engels·Nistér(2006, ISPRS)였다.

> 🔀 **구조적 평행.** EKF-SLAM의 submap과 PTAM의 keyframe 지도는 계산량을 통제하려고 전체 지도를 지역 단위로 쪼개어 다룬다는 점에서 닮았다. 그러나 PTAM 논문이 submap 문헌을 설계 근거로 삼은 흔적은 보이지 않는다. Klein과 Murray는 모든 프레임을 지도에 다 넣지는 않고 mapping을 실시간 제약에서 해방하려는 실용적 계산 전략으로 keyframe을 택했고, 이 선택은 훗날 ORB-SLAM의 covisibility graph로 진화한다.

> 🔗 **차용.** PTAM의 Mapping 스레드가 돌리는 bundle adjustment는 1장에서 다룬 사진측량의 유산이다. 다만 흥미롭게도 PTAM은 [Triggs et al. 1999 "Bundle Adjustment — A Modern Synthesis"](https://doi.org/10.1007/3-540-44480-7_21)가 아니라 Hartley·Zisserman 교과서 Appendix 6.6을 직접적인 구현 청사진으로 삼았다.

## 5.5 새 구조가 퍼지다

논문 제목에 박힌 "Small AR Workspaces"라는 문구처럼 PTAM은 원래 책상 위 증강현실(AR)을 겨냥해 태어났다. Tracking 스레드가 흔들림 없이 실시간 궤적을 뱉어 주니 가상 물체를 실제 책상 위에 올려놓는 데 손색이 없었다. 이 실용성 덕분에 tracking과 mapping을 나누는 2-스레드 아키텍처는 연구실 담장을 넘어 순식간에 산업계와 후속 SLAM 전반으로 번져 나갔다.

상용 AR SDK들도 이 구조를 빠르게 흡수했다. 독일 AR 스타트업 Metaio(2015년 Apple에 인수)는 2012년 자사 SDK에 SLAM을 탑재했는데, 연구진의 [ISMAR 2014 발표 자료](https://jsturm.de/publications/data/sturm2014ismar.pdf)를 보면 이 상용 엔진 역시 local·global bundle adjustment와 relocalization을 갖춘 전형적인 PTAM형 sparse SLAM이었다. 2015년 Raúl Mur-Artal, J.M.M. Montiel, Juan D. Tardós가 발표한 [ORB-SLAM](https://arxiv.org/abs/1502.00956)(TRO 2015)은 PTAM의 두 스레드 골격을 고스란히 물려받은 뒤, 이미지 패치를 ORB 서술자로 갈아 끼우고 keyframe 관리를 covisibility graph로 체계화하며 loop closure 스레드를 덧붙여 완성도를 끌어올렸다. 2018년 Qin, Li, Shen의 [VINS-Mono](https://arxiv.org/abs/1708.03852)(TRO 2018) 역시 sliding window 최적화와 loop closure를 별도 스레드로 분리했는데, 이를 보면 PTAM의 병렬 구조가 VIO 영역까지 표준으로 자리 잡았음을 알 수 있다.

## 5.6 Davison과 Klein·Murray의 관점

그렇다면 2007년 두 논문의 차이는 단순한 성능 우열의 문제였을까? 속내를 들여다보면 두 팀은 처음부터 지향하는 문제 정의 자체가 달랐다.

Davison이 PAMI 논문에서 full-covariance EKF를 끝까지 고수한 까닭은 명확했다. 그가 겨냥한 시나리오는 로봇이 긴 복도를 따라 탐사하는 경우가 아니라, 제한된 작업 공간 안에서 카메라가 같은 특징점을 수없이 반복 관측하며 오래 머무는 상황이었다. EKF는 모든 landmark가 얼마나 불확실한지, 또 landmark끼리 어떤 상관관계로 얽혀 있는지를 공분산 행렬로 정직하게 추적한다. Davison의 시각에서 보면 bundle adjustment는 바로 그 정교한 불확실성 모델링을 일부 포기하는 대신 확장성을 사 오는 타협안이었다.

반대로 PTAM은 그 타협을 기꺼이 감수했다. AR 응용에서 가장 절실한 것은 카메라의 현재 pose를 밀림 없이 실시간으로 추적하는 일이지, 지도 점 하나하나의 공분산을 엄밀하게 유지하는 일이 아니었기 때문이다. 지도는 그저 주기적인 bundle adjustment로 적당히 깎아 다듬기만 해도 충분했다.

역사의 저울은 결국 PTAM 쪽으로 기울었다. 2010년대 SLAM의 대세는 그래프 최적화와 bundle adjustment가 장악했다. 흥미로운 점은 그 이후 Davison 연구실의 행보다. Davison 역시 factor graph 기반 추정을 거쳐 분산 확률 추론인 Gaussian Belief Propagation(GBP)과 Robot Web 연구로 시선을 넓혀 갔다. [SLAM Handbook](https://github.com/SLAM-Handbook-contributors/slam-handbook-public-release) Ch.18 "The Computational Structure of Spatial AI Systems"에서 Davison은 오늘날 기하 추정의 양대 기둥으로 EKF와 BA 같은 Gaussian 기반 기법을 꼽는다. 이어 그 자연스러운 확장으로 GBP를 소개하며, MonoSLAM과 PTAM을 손에 잡히는 오픈소스 연구 유산으로 나란히 회고한다.

---

## 예측과 실제

> **Davison 2007 PAMI MonoSLAM**: Davison은 결론에서 더 넓은 실내외 공간, 더 빠른 카메라 움직임, 가림과 조명 변화가 얽힌 복잡한 장면을 다음 과제로 지목했다. 구체적인 돌파구로는 sub-map 전략과 100 Hz 전 해상도 IEEE 1394 CMOS 카메라 도입을 꼽았고, 희소한 점 지도를 넘어 표면(surface) 같은 "higher-order entities"의 조밀한 표현으로 나아갈 수 있다고 내다봤다.
>
> 훗날 SLAM Handbook 15.5절은 현대 SLAM이 환경 변화와 빠른 움직임에 꽤 강건해졌다고 평가하면서도, 여러 극한 조건을 동시에 버텨 내는 효율적이고 강건한 SLAM은 여전히 열린 문제로 남겨 두었다(→ 19장, 23장). 한편 Davison이 결론에서 주요 수단으로 꼽지 않았던 IMU 결합은 본문에서 관련 연구로만 언급됐으나, 2010년대 Visual-Inertial Odometry(VIO) 붐의 핵심 엔진이 됐다.

> **Klein & Murray 2007 PTAM**: Klein과 Murray는 §8(Failure modes / Mapping inadequacies)에서 코너 기반 추적이 모션 블러에 취약하다는 점, 점 구름 위주 지도가 장면의 기하학적 구조를 이해하지 못한다는 점, 그리고 무엇보다 시스템이 "not designed to close large loops in the SLAM sense"라는 점을 솔직히 인정했다. 큰 루프를 닫지 못하는 이유로는 tracking의 M-estimator가 지도의 전역 불확실성을 알지 못한다는 점을 짚었다.
>
> 2015년 ORB-SLAM은 정확히 그 지점을 파고들었다. [DBoW2](http://doriangalvez.com/papers/GalvezTRO12.pdf) 외관 기반 장소 인식으로 큰 루프를 닫고 covisibility graph로 keyframe을 엮어 PTAM의 공간 제약을 부쉈다. 다만 모션 블러에 대한 취약성과 단순 점 구름 지도의 한계는 ORB-SLAM에서도 고스란히 숙제로 남았다.

## 아직 열린 문제

**단안 카메라의 scale 복원.** MonoSLAM부터 PTAM까지 순수 단안 카메라 시스템에는 피할 수 없는 기하학적 맹점이 있다. 장면 전체와 카메라 궤적을 똑같은 비율로 두 배 키우거나 절반으로 줄여도 카메라에 맺히는 영상은 한 픽셀도 달라지지 않는다는 **scale 모호성**이다. IMU를 결합하면 중력 가속도라는 물리적 자가 들어와 scale을 관측할 수 있지만, IMU 없는 순수 단안 시스템의 절대 scale 복원은 2026년에도 미해결이다. [MiDaS](https://arxiv.org/abs/1907.01341)나 [Depth Anything](https://arxiv.org/abs/2401.10891) 같은 학습 기반 단안 깊이 추정이 한 장의 사진에서 놀라운 상대 깊이를 뽑아내지만, 이를 미터 단위로 바꾸려면 지면 높이나 기지 물체 크기 같은 외부 닻이 필요하다. 미터 단위 깊이를 직접 예측한다는 모델들조차 훈련 분포를 벗어난 데이터셋에서는 scale이 어긋나는 사례가 여전히 보고된다(→ 14장 「아직 열린 문제」).

**어떤 환경에서나 도는 VO 시스템.** MonoSLAM은 작은 실내 책상 주변에 머물렀고, PTAM은 제목에서부터 "Small AR Workspaces"로 발을 뺐다. 훗날 ORB-SLAM2가 실내·실외·RGB-D를 아우르려 했지만, 조명이 급변하거나 하얀 벽처럼 텍스처가 메마른 복도에서는 지금도 추적이 맥없이 끊어진다. 카메라와 LiDAR, IMU를 함께 엮는 멀티센서 융합이 그 빈틈을 상당 부분 메워 가고 있을 뿐이다.

**어두운 곳과 움직이는 장면의 특징점 추적.** MonoSLAM도 PTAM도 밝기가 충분하고 세상이 정지해 있다는 전제 위에서 돌았다. 놀랍게도 2026년 오늘날의 특징점 기반 SLAM 대부분이 여전히 이 두 가정을 은연중에 공유한다. 어둠 속에서는 ORB 특징점이 잡히지 않고, 행인이 오가는 거리에서는 움직이는 사람 위의 점을 고정된 벽처럼 오인해 지도를 망친다. 학습 기반 optical flow나 semantic segmentation을 끌어와 이 오래된 가정을 깨려는 연구가 지금도 진행 중이다.

---

PTAM이 tracking과 mapping을 떼어 내 실시간 최적화의 물꼬를 텄지만, keyframe이 쌓이고 동선이 길어질수록 서서히 커지는 누적 오차(drift)를 루프 전체에서 한꺼번에 바로잡는 문제는 여전히 남아 있었다. 사실 그 문제를 푸는 그래프 최적화의 수학적 청사진은 PTAM보다 꼭 10년 앞선 1997년, 캐나다 York University의 두 연구자가 레이저 스캔 정합 문제를 다루며 이미 세상에 내놓아 둔 상태였다(→ 6장).

# 6장 그래프 SLAM

로봇이 복도를 따라 전진하며 레이저 스캔을 한 장씩 기존 지도에 갖다 붙이는(incremental registration) 방식에는 치명적인 약점이 있었다. 1997년 캐나다 York University의 Feng Lu와 Evangelos Milios가 정확히 짚어냈듯, 한 걸음마다 생기는 미세한 정합 오차가 지도에 그대로 굳어 버리면 몇 바퀴만 돌아도 지도가 뒤틀리고 출발점과 끝점이 어긋나기 때문이다. 두 사람은 스캔을 즉시 전역 지도에 박제하는 대신, 스캔마다 고유한 local frame을 남기고 프레임 사이의 상대적 제약 조건을 전부 보관한 뒤, 이 거대한 제약 연립방정식을 한꺼번에 풀어 전체 자세를 맞추는 해법을 제시했다. 레이저 스캔 정합을 배치 최대우도 추정과 결합한 이 1997년 논문은 훗날 **포즈 그래프 최적화(pose graph optimization)**라 불리는 패러다임의 깃발을 꽂았다.

물론 이 길의 문을 연 것이 Lu와 Milios만은 아니었다. 그보다 십여 년 앞선 1985년 LAAS의 [Chatila와 Laumond](https://www.semanticscholar.org/paper/Position-referencing-and-consistent-world-modeling-Chatila-Laumond/c34a678e40a7d80cb3683f07fc837179fd9bf3ee)가 이동 로봇의 참조 좌표계와 일관된 세계 모델링의 필요성을 일찍이 논의했고, 1999년에는 [Gutmann과 Konolige](https://www.semanticscholar.org/paper/Incremental-mapping-of-large-cyclic-environments-Gutmann-Konolige/3c1bda51b8ca59f1836ed1b96c485d905804989a)가 거대한 순환 환경을 증분 방식으로 매핑하며 자세 정합을 실증했다. 2000년대 초에는 Sebastian Thrun 그룹이 이를 *full SLAM* 문제로 정식화했고, [Folkesson과 Christensen(2004)](http://www.hichristensen.net/hic-papers/folkesson-icra2004.pdf), Konolige, Frank Dellaert 등이 저마다의 수학적 언어로 살을 붙였다. 2000년대 내내 EKF-SLAM이 $O(N^2)$ 공분산 행렬의 무게에 짓눌려 신음하는 동안(→ 4장), 과거의 모든 자세를 버리지 않고 그래프로 엮어 한꺼번에 다듬는 이 smoothing 철학은 조용히 세력을 키워 2010년대 SLAM backend의 왕좌를 차지했다.

---

## 6.1 레이저 스캔에서 포즈 그래프로: Lu-Milios 1997

[Lu & Milios (1997), "Globally Consistent Range Scan Alignment for Environment Mapping"](https://doi.org/10.1023/A:1008854305733) 이전의 레이저 지도 작성은 대개 인접한 두 스캔을 ICP(Iterative Closest Point) 같은 국소 정합으로 차례차례 이어 붙이는 데 머물렀다. ICP는 코앞의 두 스캔을 맞추는 데는 능숙했지만, 한 번 붙인 스캔의 오차를 되돌릴 수 없기에 수십 미터만 주행해도 누적 오차(drift)가 커지고, 루프를 돌아 처음 위치로 복귀하면 벽이 두 겹으로 갈라지곤 했다.

Lu와 Milios는 시야를 뒤집어 지도 작성을 그래프 위의 최적화 문제로 번역했다. 로봇이 스캔을 찍은 각 자세 $x_1, x_2, \ldots, x_n$을 그래프의 **노드**로 세우고, 두 자세 사이에서 얻은 상대 위치 측정값 $\hat{z}_{ij}$와 그 측정의 확신도(정보 행렬 $\Omega_{ij} = \Sigma_{ij}^{-1}$)를 **엣지**로 연결한 것이다. 그러면 일관된 지도를 찾는 일은 그래프 위 모든 엣지의 불일치 비용을 최소화하는 문제가 된다.

$$F = \sum_{(i,j) \in \mathcal{E}} e_{ij}^T \Omega_{ij} e_{ij}, \quad e_{ij} = z_{ij} - h(x_i, x_j)$$

여기서 $h(x_i, x_j)$는 현재 추정된 두 자세로부터 계산한 예측 상대변환이고, $z_{ij}$는 실제 센서(오도메트리나 스캔 매칭)로 관측한 상대변환이다.

이 그래프 표현의 진가는 **loop closure** 순간에 빛을 발했다. 로봇이 예전에 지나온 장소를 다시 알아봤을 때는 그 두 자세 사이에 새로운 엣지 하나만 덧붙이면 된다. 그런 뒤 전체 그래프를 다시 최적화하면 loop closure 제약이 엣지를 타고 흐르며 루프 위의 모든 과거 자세를 한꺼번에 바로잡는다. 매 스텝 거대한 공분산 행렬 전체를 $O(N^2)$으로 갱신해야 했던 EKF와는 구조 자체가 달랐다. 다만 Lu와 Milios의 1997년 원형은 모든 자세를 매번 처음부터 한꺼번에 푸는 배치(batch) 선형 시스템이었기에, 스캔 수가 늘어나면 계산이 무거워져 큰 환경에 곧장 쓰기는 버거웠다. 하지만 최적화로 지도의 전역 일관성을 세울 수 있음을 보인 이 한 발이, 이후 Gutmann·Konolige의 증분 계산, Folkesson·Christensen의 강건한 data association, Thrun 그룹의 대규모 실외 매핑으로 이어지는 거대한 흐름을 열었다.

> 🔗 **차용.** 포즈 그래프 최적화는 수학적으로 비선형 최소자승 문제다. [Levenberg(1944)](https://www.ams.org/qam/1944-02-02/S0033-569X-1944-10666-0/)와 [Marquardt(1963)](https://doi.org/10.1137/0111030)가 반세기 전 비선형 파라미터 추정을 위해 빚어 둔 댐핑 최소자승 해법이(→ §1.3), 레이저 로봇 지도의 backend 심장으로 고스란히 이식됐다.

## 6.2 정보 행렬의 희소성

Lu와 Milios의 씨앗이 거목으로 자라날 수 있었던 핵심 비밀은 후속 연구자들이 포착한 **정보 행렬(information matrix, $\Omega = \Sigma^{-1}$)의 희소성(sparsity)**에 있었다.

EKF-SLAM이 쥐고 있던 공분산 행렬 $\Sigma$는 빽빽하게 채워진 조밀(dense) 행렬이다. 로봇이 landmark 하나만 관측해도 그 오차가 로봇을 매개로 지도의 다른 모든 landmark와 얽히기 때문에, 비대각 항이 전부 0이 아닌 값으로 차오른다. 2D landmark가 $n$개일 때 공분산의 landmark 블록만 $2n \times 2n$ 크기이므로, 한 번의 갱신에 $O(n^2)$ 비용을 치러야 하는 굴레에서 벗어날 수 없었다.

놀랍게도 공분산 행렬의 역행렬인 정보 행렬 $\Omega$는 풍경이 완전히 달랐다. 과거 자세를 지우지 않고 남겨 둔 포즈 그래프에서는, 두 자세 $x_i$와 $x_j$ 사이에 직접적인 관측 엣지가 있을 때만 $\Omega$의 $(i,j)$ 블록이 0이 아닌 값을 갖는다. 로봇이 루프를 닫지 않고 전진만 할 때는 바로 이웃한 자세끼리만 연결되므로, $\Omega$는 대각선 주변만 채워진 띠 모양(banded), 더 정확히는 블록 삼중대각(block tridiagonal) 희소 행렬이 된다. 전체 원소의 절대다수가 깨끗한 0으로 비어 있는 것이다.

이 희소성을 파고든 시도는 필터 진영과 최적화 진영 양쪽에서 터져 나왔다. Sebastian Thrun 그룹의 [Sparse Extended Information Filter(SEIF)](http://www.cs.cmu.edu/~thrun/papers/thrun.tr-seif02.pdf)는 정보 행렬의 약한 연결을 인위적으로 잘라 내 계산 비용을 $O(n^2)$ 아래로 끌어내렸고(다만 정확한 비용과 일관성은 그래프 구조에 좌우된다, §6.6), 2006년 ICRA에서는 [Olson, Leonard, Teller](https://april.eecs.umich.edu/pdfs/olson2006icra.pdf)가 확률적 경사 하강법(SGD)의 변형으로 포즈 그래프를 푸는 기법을 내놓아 큰 주목을 받았다. 오도메트리 초기값이 심하게 찌그러져 있어도 빠르게 궤적을 펴내는 이 방법은 자세 3,500개·제약 5,600개짜리 합성 데이터와 자세 약 1,900개인 MIT Killian Court 실측 데이터에서 위력을 입증했고, Olson이 공개한 코드는 순식간에 여러 연구실로 퍼져 나갔다.

> 🔗 **차용.** 같은 시기 [Eustice 등의 exactly sparse delayed-state filter](https://web.mit.edu/2.166/www/handouts/eustice_et_al_ieeetro_2006.pdf) 역시 과거 로봇 상태를 보존하면 근사 없이도 정보 행렬이 정확히 희소해진다는 사실을 필터 틀 안에서 증명했다. 이 희소성의 수학적 통찰은 곧 Frank Dellaert의 factor graph 정식화와 Bayes tree로 만개하게 된다.

## 6.3 Factor Graph와 Square Root SAM

그래프 SLAM의 수학에 가장 우아하고 범용적인 옷을 입힌 것은 2006년 *IJRR*에 실린 Frank Dellaert와 당시 박사과정 학생 Michael Kaess의 [**Square Root SAM**](https://doi.org/10.1177/0278364906072768)이었다. Georgia Tech에서 확률 그래프 모델(probabilistic graphical model)을 연구하던 Dellaert는 SLAM을 단순한 행렬 방정식이 아니라 그래프 위의 베이즈 추론 문제로 다시 썼고, 그 언어로 **factor graph**를 택했다.

Factor graph는 구해야 할 미지수인 **변수 노드**(로봇 자세와 landmark 위치)와 센서 관측이나 사전 확률을 뜻하는 **factor 노드**를 엣지로 엮은 이분 그래프(bipartite graph)다. 각 factor $f_k(X_k)$는 자신과 맞닿은 소수의 변수들 사이에 걸린 확률적 제약을 표현하며, 전체 시스템의 결합 확률은 모든 factor의 곱으로 떨어진다.

$$p(X) \propto \prod_k f_k(X_k)$$

가장 그럴듯한 지도와 궤적 $X^*$를 찾는 MAP(Maximum A Posteriori) 추정은 이 곱을 최대화하는 일이며, 모든 factor의 오차가 가우시안을 따르면 곧바로 비선형 최소자승 문제와 같아진다.

여기서 Dellaert와 Kaess는 **QR 분해**라는 핵심 도구를 꺼내, $J^T J$를 직접 구하지 않고 Jacobian 행렬 $J$ 자체를 분해해 상삼각 행렬 $R$을 얻었다. $R^T R = J^T J = \Omega$를 만족하는 이 행렬 $R$을 논문에서는 **square root information matrix**라 불렀다. $R$이 얼마나 비어 있는가(희소성)는 변수를 어떤 순서로 소거하는지(variable elimination ordering)와 그래프의 연결 위상에 달려 있는데, AMD나 COLAMD 같은 그래프 기반 순서 정렬 알고리즘을 쓰면 분해 과정에서 0이던 자리가 채워지는 현상(fill-in)을 극적으로 억제할 수 있었다. 게다가 $J^T J$를 제곱해 만들지 않고 $J$에서 곧장 $R$을 뽑아내니 조건수(condition number)가 나빠지지 않아, EKF의 공분산 갱신보다 수치적으로도 훨씬 단단했다.

## 6.4 iSAM과 iSAM2: 온라인 증분 추론

Square Root SAM은 그래프 SLAM의 아름다운 표준형을 세웠지만, 결정적인 약점이 하나 있었다. 본질적으로 **배치(batch)** 알고리즘이었다는 점이다. 새 센서 관측이 하나 들어올 때마다 전체 Jacobian $J$를 다시 쌓고 QR 분해를 처음부터 새로 돌려야 했다(조밀 행렬 기준 $O(n^3)$, 희소 행렬이라도 연결 구조에 따라 무거워진다). 움직이는 로봇 위에서 매 프레임 답을 내놓기에는 벅찬 구조였다.

Kaess, Ranganathan, Dellaert는 2008년 *IEEE TRO*에 발표한 [**iSAM**(incremental Smoothing and Mapping)](https://www.cs.cmu.edu/~kaess/pub/Kaess08tro.pdf)에서 이 병목을 선형대수의 고전 기법인 **Givens rotation**으로 풀었다. 새 변수와 factor가 들어오면 기존 상삼각 행렬 $R$을 버리지 않고 새 행만 아래에 붙인 뒤, Givens rotation으로 대각선 아래의 원소만 국소적으로 지워 $R$의 상삼각 형태를 증분(incremental) 방식으로 복구한 것이다.

하지만 iSAM에도 어쩔 수 없는 타협이 남아 있었다. 비선형 factor를 선형화해 얻은 행렬 $R$은 특정 시점의 추정치 주변에서만 유효한 1차 근사였기에, 로봇이 움직이며 추정값이 처음 선형화 지점에서 멀어지면 근사 오차가 누적됐다. 게다가 루프가 여러 개 얽히면 $R$ 내부에 fill-in이 야금야금 번져 희소성이 무너졌다. 그래서 iSAM은 실험에서 100스텝마다 주기적 배치 재계산(periodic batch reordering & relinearization)으로 변수 순서를 다시 정하고 전체 관측을 다시 선형화해 $R$을 처음부터 새로 분해해야 했다.

이 마지막 주기적 리셋마저 완전히 지워 낸 결정판이 2012년 *IJRR*의 [**iSAM2**](https://doi.org/10.1177/0278364911430419)다. Kaess와 동료들은 행렬 $R$ 대신 **Bayes tree**라는 새로운 자료구조를 고안했다. factor graph에 변수 소거를 적용해 얻는 chordal Bayes net의 clique들을 노드로, clique 사이에 공유되는 변수(separator)를 엣지로 삼아 트리 구조를 만든 것이다. 이제 새 factor가 추가되면 Bayes tree에서 그 factor의 영향을 받는 일부 clique만 찾아내 잠깐 factor graph로 되돌려 풀고 트리에 다시 꽂으면 끝난다. 여기에 **fluid relinearization**을 얹어, 전체 변수를 주기적으로 다 뜯어고치는 대신 추정치가 선형화 지점에서 임계값 $\beta$ 이상 움직인 변수만 콕 집어 그 변수가 걸친 clique만 국소적으로 재선형화했다. 덕분에 거대한 loop closure가 터져도 실제 영향권에 드는 clique만 부분적으로 갱신하면 되므로, 진정한 의미의 상시 증분 추론이 완성됐다.

이 엔진은 [**GTSAM**(Georgia Tech Smoothing and Mapping)](https://gtsam.org)이라는 C++ 오픈소스 라이브러리(Python 바인딩 포함)로 세상에 나왔다. Dellaert가 2015년 이후 Skydio, Facebook, Google AI, Verdant Robotics 등을 거치며 산업계와 학계를 넘나드는 동안에도 GTSAM은 꾸준히 진화해, 오늘날 자율주행과 드론, 로봇팔 캘리브레이션에 이르기까지 광범위한 현장의 주력 backend로 쓰이고 있다.

> 🔗 **차용.** Bayes tree의 뿌리는 확률 그래프 모델 문헌의 **junction tree(join tree)** 알고리즘이다. Daphne Koller와 Nir Friedman의 교과서 [*Probabilistic Graphical Models*](https://mitpress.mit.edu/9780262013192/probabilistic-graphical-models/)가 체계화한 변수 소거 순서와 chordal 그래프 위 추론 이론을 실시간 로봇 SLAM의 증분 최적화 엔진으로 완벽히 이식한 것이 iSAM2다.

## 6.5 g2o: ROS 생태계의 범용 그래프 최적화기

미국에서 Dellaert와 Kaess가 GTSAM을 다듬던 같은 시기, 유럽과 캘리포니아의 또 다른 연합군은 조금 다른 실용적 철학으로 그래프 최적화의 표준 도구를 빚어냈다. 2011년 ICRA에서 Freiburg 대학의 Rainer Kümmerle·Giorgio Grisetti·Wolfram Burgard, Imperial College London의 Hauke Strasdat, 그리고 Willow Garage의 Kurt Konolige가 함께 [**g2o**(general graph optimization)](https://doi.org/10.1109/ICRA.2011.5979949)를 발표했다.

이름처럼 "범용성"이 목표였던 g2o는 2D 포즈 그래프든, 3D landmark bundle adjustment든, Sim(3) 스케일 드리프트 보정이든 아우르는 유연한 프레임워크를 지향했다. 사용자가 그래프의 노드(`vertex`)와 제약(`edge`), 그리고 오차 함수와 Jacobian만 플러그인처럼 정의해 끼워 넣으면, 내부 엔진이 Gauss-Newton이나 Levenberg-Marquardt로 희소 선형 시스템을 풀어 준다. 실제 선형대수 계산도 CHOLMOD, CSparse, Eigen 등 검증된 희소 solver 가운데 입맛에 맞게 바꿔 끼울 수 있게 설계했다.

타이밍도 절묘했다. 2010년대 초반 ROS(Robot Operating System)가 전 세계 로봇 연구실의 공통 운영체제로 번져 나가던 시점에, g2o는 곧바로 ROS 기반 SLAM의 대표 backend로 안착했다. 이후 컴퓨터 비전 SLAM의 양대 산맥이 된 ORB-SLAM과 LSD-SLAM이 모두 g2o를 심장으로 택했다(같은 시기 ROS에서 2D 라이다 매핑의 표준이 된 gmapping은 particle filter 계열을, Google의 Cartographer는 Ceres Solver를 썼다).

## 6.6 그래프 방법이 주류가 된 이유

필터에서 그래프로의 세대교체는 단순한 유행이 아니라 문제 설정의 근본적 차이에서 비롯됐다.

첫째는 **과거를 대하는 태도**다. EKF-SLAM은 현재 상태만을 유지하기 위해 지나간 로봇 자세들을 매 스텝 주변화(marginalization)로 지워 버린다. 일단 지워진 과거 자세의 선형화 오차는 현재 공분산 속에 영구히 박제돼, 나중에 loop closure가 일어나도 과거 궤적을 펴낼 방법이 마땅치 않다. 반면 그래프 SLAM은 지나온 자세와 관측을 그래프 안에 고스란히 살려 둔다. 덕분에 수백 미터 뒤에서 루프가 닫히더라도 전체 궤적과 과거 자세까지 한꺼번에 되돌려 고칠 수 있다(→ 10장).

둘째는 **계산 구조와 수치 확장성**이다. landmark가 $N$개일 때 EKF는 조밀한 공분산 행렬 때문에 무조건 $O(N^2)$ 비용을 물어야 했다. 그래프 SLAM은 희소 Cholesky나 QR 분해로 실제 연결된 이웃만 건드리므로 계산 부담이 극적으로 줄어든다(물론 정확한 복잡도는 그래프의 위상, 분해 시 발생하는 fill-in, 소거 순서, 재선형화 범위에 따라 달라지므로 좁은 공간을 돈다는 이유만으로 무조건 $O(N \log N)$이 보장되는 것은 아니다).

셋째는 **주변화(marginalization)의 투명성**이다. 변수가 끝없이 늘어나면 그래프 SLAM 역시 오래된 자세를 적분해 없애고 그 정보를 남은 변수들을 잇는 factor로 압축해야 한다. 이때 정보가 엉키면서 생기는 근사와 재선형화 제약을 놓고 어느 선에서 타협할지를, 엔지니어가 그래프 구조를 보며 예컨대 sliding window 크기나 keyframe 선택 전략으로 훨씬 명시적으로 통제할 수 있었다.
