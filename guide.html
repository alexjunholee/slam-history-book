## 20.6 Semantic foundation model을 지도에 쓰기

DUSt3R, MASt3R, VGGT가 점군과 카메라 자세라는 기하의 언어를 혁신하는 동안, 같은 시기의 SLAM 연구에서는 CLIP, DINO, SAM 같은 semantic foundation model을 지도에 이식하려는 시도가 나란히 자라고 있었다. 목표는 분명했다. 사람이 미리 적어 준 class 목록(dictionary) 바깥의 개념까지 지도가 이해하게 만드는 것이다.

계층적 semantic 지도를 실시간으로 쌓아 올린 대표 계보는 MIT Luca Carlone 연구실에 있다. [Nathan Hughes et al. 2022. Hydra: A Real-time Spatial Perception System for 3D Scene Graph Construction and Optimization (RSS)](https://arxiv.org/abs/2201.13360)는 Kimera(Rosinol et al., ICRA 2020)가 만든 metric-semantic mesh 위에 objects → places → rooms → buildings로 이어지는 3D scene graph를 실시간으로 세웠다. 다만 정해진 class만 알아보는 닫힌 집합(closed-set) 분류기를 썼기에, Handbook 16장이 지적하는 *"relatively small (e.g., 100-1000 labels) and predefined dictionary"*의 울타리 안에 갇혀 있었다. 그래도 Hydra는 실시간으로 동작하는 최초의 spatial perception system이라는 이정표를 세웠다.

이 닫힌 목록의 벽은 foundation model이 허물었다. ETH Zurich와 Google의 [Songyou Peng et al. 2023. OpenScene: 3D Scene Understanding with Open Vocabularies (CVPR)](https://arxiv.org/abs/2211.15654)는 CLIP feature를 3D 점군으로 distillation해, 사용자가 어떤 단어를 던지더라도 장면 속 점이 그 의미와 얼마나 맞닿아 있는지 짚어 냈다. 이어 Toronto·Montréal·MIT 등이 함께 발표한 [Qiao Gu et al. 2024. ConceptGraphs: Open-Vocabulary 3D Scene Graphs for Perception and Planning (ICRA)](https://arxiv.org/abs/2309.16650)는 단순 class 라벨 대신 VLM이 써 준 설명문을 그래프 노드의 속성으로 달고 객체 사이의 관계까지 LLM으로 서술하게 해, 사전에 등록되지 않은 개념도 3D 그래프에 묶을 수 있게 했다. 나아가 [Dominic Maggio et al. 2024. Clio: Real-time Task-Driven Open-Set 3D Scene Graphs (RA-L)](https://arxiv.org/abs/2404.13696)는 로봇에게 주어진 자연어 임무(task)를 기준으로 삼아, information bottleneck 원리에 따라 임무에 꼭 필요한 추상화 수준만 남기고 무관한 세부는 하나로 뭉개 버리는 과제 중심 scene graph를 구현했다.

한때 2017–2019년 무렵 유행했다가 주류에서 밀려났던 object-as-landmark 연구(→ 22장 §22.4)와 달리, semantic SLAM은 이처럼 기하 지도 위에 얹히는 계층적 scene graph의 모습으로 되살아났다. 심지어 기하 foundation model의 출력에 곧장 open-vocabulary 의미를 실어 나르는 융합도 등장했다. UT Austin과 NVIDIA 등의 [Fan et al. 2024. Large Spatial Model (LSM, NeurIPS)](https://arxiv.org/abs/2410.18956)은 DUSt3R로 초기화한 pointmap 예측 네트워크에 LSeg feature를 결합해, 자세 정보도 없는 두 장의 이미지만으로 3D 기하·외관·open-vocabulary semantic을 한 번의 forward pass로 동시에 뽑아냈다.

> 🔗 **차용.** Clio는 Carlone 그룹이 Hydra의 실시간 계층 구조에 과제 기반 추상화를 덧입혀 빚은 후속작이며, ConceptGraphs는 독립적인 open-vocabulary 객체 그래프 계보를 연 연구다.

---

## 20.7 SLAM에서 무엇이 남는가

기하와 의미를 거대 모델이 한꺼번에 뱉어 내는 시대에도, 막상 이를 실시간 SLAM 시스템으로 묶으려 들면 고전 SLAM의 뼈대가 다시 고개를 든다. MASt3R-SLAM이 대표적인 예다. MASt3R가 feature matching과 3D 대응의 내부를 완전히 갈아엎었지만, 시스템 차원에서 언제 keyframe을 찍고, 어떻게 loop closure를 찾으며, 지도를 어떻게 갈무리할지 결정하는 문법은 여전히 고전 SLAM에서 빌려 왔다.

앞에서 다룬 학습 기반 지도들 역시 예외가 아니었다. NeRF-SLAM은 지도를 radiance field로 바꾸면서도 keyframe 기반 tracking을 놓지 않았고, 초기 3DGS-SLAM인 MonoGS는 명시적 loop closure가 빠진 자리를 논문의 future work로 남겨 두어야 했다(18장).

2025년 MIT의 Dominic Maggio, Hyungtae Lim, Luca Carlone이 발표한 [VGGT-SLAM](https://arxiv.org/abs/2505.12549)(NeurIPS 2025)은 이 사실을 가장 단적으로 증명한다. VGGT가 지역 submap을 재구성해 내더라도, 시스템 전체가 무너지지 않으려면 이어지는 submap 사이의 15자유도 projective transform을 \(\mathrm{SL}(4)\) 다양체 위에서 최적화하고 loop-closure 제약까지 한데 풀어야 했다. *The SLAM Handbook* 13장(Teed, Deng, Chidlovskii, Revaud, Wimbauer, Cremers)이 DUSt3R를 논하며 내린 결론은 간명하다. *"a form of factor graph is still necessary"* (p.386). Transformer가 지역 기하를 빚어내더라도, 시간을 가로질러 전역 일관성을 붙드는 것은 여전히 그래프 최적화의 몫이다.

---

## 아직 열린 문제

**대규모 sequence 처리.** DUSt3R는 이미지 쌍마다 pointmap을 계산하므로 쌍의 개수가 입력 이미지 수의 제곱으로 늘어난다. VGGT 논문의 비교에서도 DUSt3R는 32장을 넘기자마자 GPU 메모리 한계에 부딪혔다. VGGT 자체는 한 번에 모든 시점을 묶어 H100 한 장에서 200장을 8.75초(최대 메모리 40.63 GB) 만에 처리했지만, 장시간 주행에서 쌓이는 1,000장이나 10,000장의 영상을 그대로 들이밀 수는 없다. Spann3R의 점진적 메모리 방식이 물꼬를 텄고 sparse attention이나 계층적 global alignment 같은 우회로가 모색되고 있지만, 대규모 실외 환경을 거침없이 삼키는 구조는 아직 완성되지 않았다.

**loop closure의 정의.** 고전 SLAM에서 loop closure란 다시 찾은 장소를 식별하고 누적된 drift를 그래프 전역에 퍼뜨려 고치는 절차다. 그러나 DUSt3R 계열의 pointmap 기반 지도에서 "재방문"을 어떻게 정의하고, 교정 신호를 어떤 방식으로 지도 전체에 전파할지는 아직 합의된 원리가 없다. 현재 MASt3R-SLAM조차 loop closure 후보를 찾는 데는 기존 이미지 검색 방식을 그대로 빌려 쓴다.

**metric scale의 일반화.** DUSt3R의 pointmap은 상대적인 깊이 비율은 맞혀도 미터 단위의 절대 크기(scale)는 알지 못한다. Metric3D나 Depth Anything v2가 단안 깊이 추정에서 metric scale 복원에 도전했듯, foundation 3D 역시 다양한 카메라와 환경을 가로질러 절대 scale을 일관되게 맞히는 과제를 안고 있다. 이미지만으로는 절대 크기가 기하적으로 결정되지 않으므로, GPS나 IMU 없이 얻어 내는 scale은 결국 학습한 prior에 기댄 추정일 수밖에 없다.

**SLAM에 쓰기.** 3DGS가 그랬듯 foundation 3D 모델들도 빠르게 SLAM의 심장부로 들어오고 있다. 2024–2025년 MASt3R-SLAM과 VGGT-SLAM은 모두 foundation 모델이 만든 출력을 고전적인 그래프 최적화로 엮어 내는 하이브리드 해법을 택했다. 끝없이 길어지는 영상 스트림을 실시간으로 소화하면서, §20.6에서 본 semantic 연구(Hydra, Clio, ConceptGraphs)까지 하나의 체계로 녹여 내는 일은 23장에서 마주할 다음 장의 질문으로 남는다(→ 23장).

---

이로써 16장에서 20장까지 이어진 학습 기반 SLAM의 흐름은 한 바퀴를 돌았다. 그런데 지금까지 우리가 훑어 온 모든 계보에는 단 하나의 공통점이 있었다. 고전 사진측량부터 MonoSLAM, ORB-SLAM, DSO, 그리고 DUSt3R에 이르기까지, 모두 *카메라*라는 눈으로 빛을 받아 세상을 읽는 이야기였다. 같은 시간, 그 바로 옆에서는 빛 대신 레이저 펄스와 전파로 거리를 직접 재는 전혀 다른 연구 공동체가 독자적인 역사를 써 내려가고 있었다.


---

# 21장 LiDAR SLAM: LOAM에서 FAST-LIO까지

사진측량에서 출발해 Foundation 3D에 이르기까지, 앞선 장들에서 살펴본 계보는 하나같이 카메라 영상을 입력으로 받았다. MonoSLAM, PTAM, ORB-SLAM, DSO, DUSt3R가 모두 그 줄기에 서 있다. 그런데 바로 같은 시기, 레이저를 쏘아 거리를 직접 재는 LiDAR 연구자들은 전혀 다른 뿌리 위에서 독자적인 방법론을 쌓아 올리고 있었다. [ICP (Besl·McKay, 1992)](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf)와 Lu–Milios의 pose network가 그 뿌리였다. 두 세계는 서로의 논문을 거의 인용하지 않았고, 쓰는 벤치마크도, 모이는 학회도 달랐다.

2014년 Ji Zhang이 RSS에서 LOAM을 발표하던 바로 그해, 카메라 진영에서는 LSD-SLAM이 나왔고 이듬해에는 ElasticFusion이 등장했다. 그러나 LOAM은 그 방법들과 거의 교차하지 않은 채 태어났으며, 이후 10년 동안에도 두 분야가 주고받은 기술적 유산은 의외로 많지 않았다.

심지어 레이저 너머에서는 또 하나의 독립 분야인 **radar SLAM**이 따로 자라났다. 하드웨어는 크게 회전식 기계 스캐너인 Navtech 계열과, 칩 하나에 송수신부를 집적한 4D mmWave radar로 갈린다. 특히 4D mmWave radar는 Doppler 효과를 이용해 각 반사점이 센서를 향해 다가오거나 멀어지는 시선 방향 속도(radial velocity)를 직접 재기 때문에, 스캔 사이의 대응점을 찾지 않고도 센서의 자기 움직임을 바로 뽑아낼 수 있다. 물론 어떤 radar를 쓰든 speckle, multipath, receiver saturation처럼 전파 고유의 노이즈를 따로 다루어야 한다. 이 계보는 Oxford의 [Cen & Newman 2018](https://doi.org/10.1109/ICRA.2018.8460687)에서 물꼬를 튼 뒤 Adolfsson·Magnusson의 CFEAR와 후속 TBV-SLAM, Burnett·Barfoot의 연속시간 기법으로 이어졌고, Oxford Radar RobotCar, Boreas, MulRan 같은 전용 데이터셋에서 비·안개·연기를 뚫는 전천후 내비게이션을 입증해 왔다(상세한 역사는 *SLAM Handbook*, Cambridge University Press, 2026년 4월 21일자 원고 9장 "Radar SLAM" 참조). 이 장에서는 그 가운데 주류 거리 센서로 자리 잡은 LiDAR SLAM의 계보를 LOAM에서 FAST-LIO까지 따라가 본다.

---

## 21.1 LOAM: edge와 plane으로 실시간 3D 정합

LOAM 이전에도 레이저 스캔을 엮어 지도를 그리는 고전은 이미 있었다. [Lu & Milios 1997. "Globally Consistent Range Scan Alignment for Environment Mapping" (Autonomous Robots)](https://doi.org/10.1023/A:1008854305733)는 궤적 전체를 한꺼번에 최적화하는 "network of poses"를 세웠다. 2D 레인지 스캔 하나하나를 노드로 삼고 스캔 사이의 상대 변환 제약을 edge로 묶은 이 구조가 훗날 포즈 그래프 SLAM의 원형이 됐다(→ 6장). 스캔을 맞대는 방법 역시 ICP 외에 [Biber·Straßer 2003. "The Normal Distributions Transform" (IROS)](https://doi.org/10.1109/IROS.2003.1249285)의 NDT가 있었다. NDT는 공간을 격자 셀로 쪼개 각 셀의 점군을 하나의 가우시안 분포로 요약한 뒤 새 스캔을 그 확률 분포에 맞추는 기법으로, 뒤에 Magnusson이 이를 3D로 확장했다.

하지만 2D에서 3D로 차원을 높이자 난제가 한꺼번에 몰려왔다. 회전하는 3D 레이저 스캐너는 한 바퀴를 도는 동안 포인트마다 찍힌 시각이 다르다. 센서가 움직이는 중에 그 이동량을 잘못 추정하면 포인트 클라우드가 뒤틀린 채 쌓이고 만다. LOAM 논문에서는 당시까지 일관된 3D 지도를 얻으려면 오프라인 일괄 처리에 의존해야 했고, 누적 오차(drift) 역시 대개 loop closure에 기대어 사후에 바로잡았다고 적는다. LOAM이 내건 목표는 loop closure 없이도 그에 버금가는 정확도를 실시간으로 뽑아내는 것이었다.

당시 3D LiDAR는 연구실에 두기엔 너무 비싼 장비였다(가격 변천은 → §21.5). 정작 LOAM 저자들조차 자체 실험에는 3D LiDAR를 쓰지 못하고, Hokuyo UTM-30LX 2D 레이저 스캐너를 모터로 끄덕이게 만든 자작 2축 LiDAR를 동원했으며 Velodyne 데이터는 KITTI 벤치마크로만 검증했다.

Carnegie Mellon 대학 Robotics Institute에서 Sanjiv Singh의 지도를 받은 Ji Zhang은 [Zhang & Singh 2014. "LOAM: Lidar Odometry and Mapping in Real-time" (RSS)](https://www.roboticsproceedings.org/rss10/p07.pdf)에서 계산량을 획기적으로 덜어 낼 기준을 찾았다. 모든 포인트를 다 맞추는 대신 포인트마다 곡률(smoothness) $c$를 계산해 두 종류의 기하 특징만 추려 낸 것이다. $c$는 같은 scan line 위에서 양옆 이웃 점들과의 위치 차이를 더해 구하는데, 이 값이 가장 큰 뾰족한 점은 **edge point**로, 가장 작은 매끈한 점은 **planar point**로 분류한다. 매칭에서는 edge point에 직전 sweep에서 찾은 edge 선분까지의 거리 제약을, planar point에 직전 sweep의 평면 패치까지의 거리 제약을 각각 걸었다. 점군 전체 대신 소수의 특징점만 건드리니 실시간 연산의 문이 열렸다.

LOAM의 또 다른 승부수는 주파수가 다른 두 루프의 분업이었다. **Lidar Odometry** 스레드는 약 10 Hz로 돌며 연속 스캔 사이의 6-DoF 움직임을 빠르게 거칠게 추정하고 그 결과로 스캔의 왜곡을 편다. 그 뒤를 **Lidar Mapping** 스레드가 1 Hz의 느린 호흡으로 따라붙어, 왜곡이 보정된 스캔을 누적 지도에 정밀하게 정합한다. 두 결과를 합치면 실시간 10 Hz 위치 출력이 나오면서도 오차가 천천히 쌓인다. 이 2단 주파수 분할 아키텍처는 훗날 LeGO-LOAM이 그대로 물려받았다.

2026년 10월 현재까지도 KITTI odometry 공개 순위표에 올라 있는 LOAM의 평균 translation error는 단 0.55%다.

> 🔗 **차용.** LOAM의 점군 정합은 Besl·McKay(1992)의 ICP 계보에서 출발하지만, 점 대 점 거리 대신 기하 특징(edge 선분과 planar 평면)까지의 거리를 최소화하는 변형으로 실시간성과 정확도를 동시에 챙겼다.

---

## 21.2 LeGO-LOAM: 지면을 먼저 분리하다

원판 LOAM은 도로 바닥을 찍은 지면 포인트와 건물·나무 포인트를 가리지 않고 한데 섞어 최적화했다. Stevens Institute of Technology의 Robust Field Autonomy Lab에서 Tixiao Shan과 지도교수 Brendan Englot은 [Shan & Englot 2018. LeGO-LOAM](https://doi.org/10.1109/IROS.2018.8594299)을 내놓으며 지면 분리를 파이프라인 맨 앞자리에 세웠다.

LeGO-LOAM은 먼저 3D 포인트 클라우드를 픽셀마다 거리를 담은 2D 영상인 range image로 펼친 뒤 지면 포인트를 떼어 내고, 남은 점들을 의미 있는 덩어리로 묶어(segmentation) 잡음을 걸러 낸다. 최적화도 두 단계로 쪼갰다. 먼저 지면에서 뽑은 planar feature만으로 높이($t_z$)와 roll·pitch 자세를 풀고, 이어서 수직 물체의 edge feature로 남은 평면 이동($t_x$, $t_y$)과 yaw 각도를 구한다. 두 단계 모두 Levenberg-Marquardt 최적화를 쓴다.

지상 차량으로 울퉁불퉁한 야지를 달린 실험에서 LeGO-LOAM은 LOAM보다 훨씬 적은 연산으로 비슷하거나 더 나은 정확도를 냈고, VLP-16 데이터를 저전력 임베디드 보드인 NVIDIA Jetson TX2 위에서 실시간으로 소화했다. 다만 [공개 구현 README](https://github.com/RobustFieldAutonomyLab/LeGO-LOAM)에서 밝히듯 수평 장착된 VLP-16을 기준으로 조율되어 있으며, 매 스캔에 지면이 늘 보인다는 전제로 작동한다.

바로 같은 해 Bonn 대학의 Jens Behley와 Cyrill Stachniss는 실외 LiDAR 지도의 그릇을 달리하는 실험을 했다. [Behley & Stachniss 2018. "Efficient Surfel-Based SLAM using 3D Laser Range Data in Urban Environments" (RSS)](http://www.roboticsproceedings.org/rss14/p16.pdf)에서 제안된 SuMa는 3D 지도를 **surfel**(작은 원반 모양의 표면 조각) 집합으로 쌓고, 새 스캔을 그 surfel 모델에 직접 맞췄다(scan-to-model). 실내 RGB-D 센서에서 ElasticFusion이 쓰던 surfel 표현을 도심 Velodyne 데이터로 옮겨 심은 것이다. 이듬해 나온 후속작 [Chen et al. 2019. "SuMa++" (IROS)](https://doi.org/10.1109/IROS40897.2019.8967704)는 surfel 위에 semantic segmentation 라벨을 붙여 달리는 자동차 같은 동적 점들을 걸러 냈다. 이로써 2018년 무렵 LiDAR SLAM은 LOAM식 특징점 방식, LeGO-LOAM식 지면 분리 방식, SuMa식 surfel 지도 방식이 각축을 벌이는 구도를 이뤘다.

---

## 21.3 FAST-LIO: tightly coupled LiDAR-IMU

회전식 LiDAR는 보통 1초에 10바퀴쯤 돈다. 한 바퀴를 도는 0.1초 동안에도 로봇이나 드론이 격렬하게 방향을 틀면 스캔 시작점과 끝점에서 센서 위치가 크게 달라져 점군이 일그러지는데, 이를 **motion distortion**이라 부른다. LOAM은 0.1초 동안 등속 운동을 한다고 가정해 왜곡을 폈지만, 급격한 기동 앞에서는 그 가정이 곧장 무너졌다.

이 틈새를 메우는 센서가 수백 Hz로 가속도와 각속도를 뱉어 내는 IMU다. 두 센서를 엮는 방식은 센서마다 따로 푼 결과를 나중에 합치는 **loosely coupled**와, 단일 추정기 안에서 두 센서의 원시 관측을 한꺼번에 다루는 **tightly coupled**로 나뉜다. tightly coupled 구조가 두 센서 사이의 물리적 상관관계를 더 촘촘하게 활용하지만, 실제 필드 성능은 센서 모델링과 캘리브레이션, 수치 구현의 완성도에 좌우된다.

홍콩대(HKU) MaRS Lab의 Wei Xu와 지도교수 Fu Zhang은 2021년 RA-L에 발표한 [FAST-LIO](https://arxiv.org/abs/2010.08196)에서 tightly coupled 방식을 극도로 가볍게 만드는 수학적 트릭을 선보였다. FAST-LIO는 iterated Extended Kalman Filter(iEKF)로 LiDAR 특징점과 IMU 측정을 하나로 묶었다. 이때 측정 점 개수가 수천 개로 불어나도 연산이 폭증하지 않도록 Kalman gain 공식을 새롭게 유도해, 계산 복잡도가 측정 개수가 아닌 **상태 차원**에만 비례하도록 뒤집었다. 덕분에 쿼드로터 탑재 컴퓨터에서도 한 스캔의 유효 특징점 1,200여 개를 통합하면서 iEKF 반복 전체를 25 ms 안에 마쳤다. iEKF는 매 측정 갱신마다 새로운 추정치 주변에서 선형화를 반복하는 구조여서, 한 번만 선형화하고 끝내는 일반 EKF의 선형화 오차도 크게 줄었다.

이듬해 TRO에 실린 후속작 FAST-LIO2([Xu et al. 2022](https://doi.org/10.1109/TRO.2022.3141876))는 한 걸음 더 나아가 LOAM 이래의 관습이던 특징점 추출 단계마저 없애 버리고 원시 포인트를 곧바로 지도에 정합했다. 손으로 깎은 특징점 규칙을 버리자 회전식이든 비반복 스캔 방식이든 가리지 않고 어떤 LiDAR에나 그대로 꽂아 쓸 수 있게 됐다. 지도는 **ikd-Tree**(incremental kd-Tree)에 담았는데, 포인트를 넣고 지울 때 트리 전체를 다시 짓지 않고 필요할 때만 국소 균형을 맞춘다. 저자들은 UAV, 핸드헬드 장치, 자동차를 아우르는 공개 데이터셋 19개 시퀀스에서 기존 방법들을 비교하며 넓은 실외 환경에서도 odometry와 mapping을 최대 100 Hz로 돌렸다고 보고했다.

같은 연구실의 [He et al. 2023. "Point-LIO: Robust High-Bandwidth Light Detection and Ranging Inertial Odometry" (Advanced Intelligent Systems)](https://doi.org/10.1002/aisy.202200459)는 아예 스캔 한 바퀴가 모이기를 기다리지 않는 극단으로 갔다. LiDAR 포인트가 하나 날아올 때마다 그 포인트가 찍힌 정확한 시각에 상태를 즉시 갱신하므로, 스캔 내부의 motion distortion이라는 문제 자체가 원천적으로 사라진다. 그 결과 odometry 출력 대역폭은 4~8 kHz까지 치솟았고, IMU 측정값을 운동 모델의 출력으로 취급하는 정식화 덕분에 IMU가 측정 한계를 넘어 포화된 상태에서도 초당 75 rad로 회전하는 기동을 놓치지 않고 추적했다.

> 🔗 **구분.** FAST-LIO는 원시 IMU 측정으로 상태를 앞으로 전파(forward propagation)하고, 스캔 안의 각 포인트를 시간 역순으로 되돌려(backward propagation) 왜곡을 편 뒤 iEKF로 한꺼번에 갱신한다. 반면 factor graph 진영에서 쓰는 방식은 [Forster et al. 2017. "On-Manifold Preintegration" (TRO)](https://doi.org/10.1109/TRO.2016.2597321)의 IMU preintegration factor이며, 바로 뒤에 볼 LIO-SAM이 이 방식을 택했다.

## 21.4 LIO-SAM: LiDAR와 IMU를 factor graph로 묶다

같은 시기 visual-inertial SLAM에서는 이미 factor graph가 표준 언어로 자리 잡고 있었고, LiDAR 쪽 역시 Lu–Milios의 pose network로 거슬러 올라가는 그래프 최적화의 기억을 갖고 있었다. Georgia Tech Frank Dellaert 연구실이 만든 [GTSAM](https://gtsam.org/)은 출처가 다른 센서 제약들을 모두 factor라는 공통 문법으로 엮어 주는 라이브러리였다.

LeGO-LOAM을 냈던 Tixiao Shan은 후속작 [Shan et al. 2020. LIO-SAM](https://doi.org/10.1109/IROS45743.2020.9341176)(IROS)에서 LiDAR-IMU 결합을 GTSAM의 factor graph 위로 올렸다. 그래프 구조의 최대 장점은 확장성이다. IMU preintegration, LiDAR odometry, GPS, loop closure 제약을 출처 구분 없이 한 그래프에 나란히 꽂아 넣을 수 있었다. IMU preintegration이 추정한 움직임은 스캔의 왜곡을 펴는 동시에 LiDAR odometry 최적화의 초기값을 대 준다. 실시간성을 지키기 위해 새 스캔을 지도 전체가 아니라 최근 keyframe 몇 장으로 엮은 국소 지도에만 정합한다. [공개 구현](https://github.com/TixiaoShan/LIO-SAM)에서는 실행 내내 유지되는 주 factor graph가 LiDAR odometry factor와 GPS factor를 풀고, 별도의 factor graph가 IMU와 LiDAR odometry factor로 IMU bias를 추정하면서 IMU 주기에 맞춰 위치를 내보낼 수 있게 주기적으로 초기화된다. README에서는 내장된 loop closure 기능이 LeGO-LOAM에서 가져온 ICP 기반 예제일 뿐이라며, 실전에서 쓰려면 Scan Context 같은 전용 장소 인식을 붙일 것을 권한다.

복잡해지는 파이프라인 속에서 의외의 역습도 있었다. 2023년 Bonn 대학의 [Vizzo et al. 2023. "KISS-ICP: In Defense of Point-to-Point ICP" (RA-L)](https://doi.org/10.1109/LRA.2023.3236571)는 "Keep It Small and Simple"이라는 이름 그대로 특징점 추출도, IMU 결합도, 복잡한 그래프도 다 덜어 냈다. 남긴 것은 고전적인 point-to-point ICP, 주행 속도와 상황에 맞춰 대응점 거리 기준을 스스로 조절하는 adaptive threshold, robust kernel, 단순한 등속 motion compensation, 그리고 균일한 point cloud subsampling뿐이었다. 그럼에도 파라미터 손질 하나 없이 자동차, UAV, segway, 핸드헬드 LiDAR 데이터 전반에서 당대 최신 기법과 맞먹는 정확도를 내면서, 3D LiDAR odometry의 기본기가 얼마나 탄탄한지를 다시 일깨웠다.

## 21.5 센서 가격 하락과 보급: 2007–2024

알고리즘이 연구실 밖으로 쏟아져 나온 배경에는 극적인 하드웨어 가격 붕괴가 있었다. 2007년 DARPA Urban Challenge에서 우승권 팀들의 차 지붕에 올라간 Velodyne HDL-64E는 한 대에 무려 75,000달러였다. 2011년 IEEE Spectrum이 조명한 Google의 자율주행 Prius 지붕에도 여전히 그 64채널 Velodyne이 얹혀 있었다([IEEE Spectrum 2011](https://spectrum.ieee.org/how-google-self-driving-car-works)). 당시 3D LiDAR는 국방 과제나 거대 기업 프로젝트의 전유물이었다. 2014년 9월 Velodyne이 16채널 VLP-16을 [7,999달러에 출시하며](https://www.prweb.com/releases/breaking_through_the_price_barrier_for_lidar_sensors_velodyne_introduces_3d_real_time_lidar_puck_at_7_999/prweb12139477.htm) 한 차례 문턱을 낮췄지만, 여전히 일반 대학 연구실이 여러 대를 사들이기엔 부담스러운 값이었다.

판이 완전히 뒤집힌 해는 2019년이었다. DJI에서 분사한 중국 업체 Livox가 그해 [Mid-40의 미국 소매가를 단돈 599달러로 발표](https://www.livoxtech.com/news/1)하면서 LiDAR가 드디어 카메라에 근접한 가격대로 내려왔다. 같은 해 1월 Ouster는 128채널 OS1-128을 [18,000달러에 선보였고](https://ouster.com/insights/blog/introducing-the-os-1-128-lidar-sensor), 2020년 10월에는 solid-state 센서 ES2를 공개하며 [2024년 차량 양산 기준 예상 가격을 600달러로 제시](https://investors.ouster.com/news-releases/news-release-details/ouster-announces-first-high-performance-true-solid-state-digital)했다. 물론 채널 수와 시야각, 측정 거리가 제각각이고 소매가와 양산 목표가의 기준도 다르지만, 10여 년 사이에 두 자릿수 배율로 값이 떨어진 흐름만큼은 분명했다.

센서가 싸지고 물리적 구조가 다양해지자 알고리즘도 변해야 했다. 새로 보급된 solid-state LiDAR는 기존 회전식보다 시야각(FoV)이 좁고, Livox 일부 제품은 같은 궤적을 되풀이하지 않는 꽃잎 모양의 비반복 스캔 패턴을 썼다. 360° 회전하며 고르게 찍히는 scan line 구조를 전제로 설계된 원판 LOAM은 이런 센서 앞에서 맥을 추지 못했다. 반면 특징점 가정을 버린 FAST-LIO와 FAST-LIO2는 회전식과 solid-state LiDAR를 모두 품었고, 시야각이 좁은 solid-state 센서에서도 안정적인 실측 성능을 입증했다.

## 21.6 Visual SLAM과 LiDAR SLAM이 따로 발전한 이유

카메라 SLAM과 LiDAR SLAM이 10년 넘게 평행선을 달린 까닭은 두 센서가 세상을 재는 물리 법칙부터 달랐기 때문이다. 카메라는 빛의 밝기와 색을 조밀한 격자에 담아내므로 keypoint, 서술자, photometric consistency(같은 물체 표면은 시점이 달라져도 밝기가 비슷하다는 가정)를 중심으로 기법이 자랐다. 반면 LiDAR는 3D 거리를 직접 찍어 형상을 얻는 대신 텍스처 정보가 없으니 edge, plane, range image를 붙잡았다. 다시 찾은 장소를 알아보는 place recognition에서조차 카메라는 DBoW2나 NetVLAD처럼 겉모습(appearance)을 비교하고, LiDAR는 [Scan Context(Kim·Kim, IROS 2018)](https://gisbi-kim.github.io/publications/gkim-2018-iros.pdf)나 [PointNetVLAD](https://arxiv.org/abs/1804.03492)처럼 점군의 3D 기하 분포를 훑었다.

공동체의 무대마저 갈라져 있었다. LOAM이 RSS, LeGO-LOAM과 LIO-SAM이 IROS, FAST-LIO가 RA-L, FAST-LIO2가 TRO에 실리는 동안, 카메라 계열의 이정표는 PTAM이 ISMAR, DTAM이 ICCV, LSD-SLAM이 ECCV, DUSt3R가 CVPR에 나오는 등 컴퓨터 비전 학회에서 더 자주 터져 나왔다.

두 줄기가 본격적으로 손을 맞잡기 시작한 것은 2020년대 초였다. Tixiao Shan은 LIO-SAM을 낸 지 1년 만에 [LVI-SAM (ICRA 2021)](https://arxiv.org/abs/2104.10831)을 발표해 하나의 factor graph 안에서 visual-inertial system(VIS)과 lidar-inertial system(LIS)을 단단히 엮었다. VIS는 LIS의 추정치로 초기화하고 LiDAR 점군에서 시각 특징점의 정확한 깊이를 빌려 오며, 반대로 LIS는 VIS의 추정을 scan matching의 초기값으로 쓴다. 둘이 서로를 떠받치되, 어두운 터널이나 특징 없는 복도에서 한쪽이 쓰러지면 살아남은 다른 쪽이 단독으로라도 주행을 이어 가도록 설계했다.

## 21.7 Visual-LiDAR 수렴 시도: 2024-2025

2024–2025년에 접어들며 센서 종류를 가리지 않고 공통 표현을 배우는 foundation model이 부상하자, 카메라와 LiDAR를 한 지붕 아래 통합하려는 시도 역시 새 국면을 맞았다. 한쪽에서는 LiDAR 점군과 카메라 영상을 하나의 특징 공간에 겹쳐 놓는 multi-modal 사전학습이 이어지고 있다. [CLIP(Radford et al., 2021)](https://arxiv.org/abs/2103.00020)이 이미지와 텍스트를 같은 embedding space에 정렬할 때 쓴 contrastive learning 문법을 그대로 빌려온 것이다.

다른 한쪽에서는 각 센서의 원시 출력을 geometric primitive나 neural field 같은 공통 3D 표현으로 먼저 번역한 뒤 단일 backend에서 함께 최적화하려는 시도가 자라고 있다. 그럼에도 현장의 주력 시스템들은 여전히 한 가지 주된 센서를 중심축으로 삼고 나머지 센서를 보조로 붙이는 구조에 머물러 있다.

---

## 예측과 실제

> Zhang·Singh는 2014년 LOAM 논문의 결론에서 loop closure로 drift를 바로잡는 일과, 자신들의 출력을 IMU와 함께 Kalman filter로 합쳐 drift를 더 줄이는 일을 future work로 적었다. 이 일은 10년 안에 이루어졌다. loop closure는 LIO-SAM(2020)이 factor graph에 넣었고, IMU 결합은 FAST-LIO(2021)와 FAST-LIO2(2022)가 iEKF 기반 tightly coupled 방식으로 풀었다.

---

## 아직 열린 문제

**Visual+LiDAR 완전 융합.** LVI-SAM 이후로도 카메라와 LiDAR를 단일 상태 추정기 안에서 tightly coupled로 엮는 방식은 연구실마다 설계가 제각각이다. 두 센서를 함께 굴리려면 시공간 외부 캘리브레이션이라는 까다로운 전제가 따라붙고, 한 추정기 안에서 두 모달리티를 가장 안정적으로 다루는 표준 아키텍처는 아직 합의되지 않았다.

**Solid-state LiDAR에 맞춘 알고리즘.** Livox 일부 모델의 비반복 스캔이나 solid-state 센서의 좁은 시야각에서는 어떤 방향의 운동을 관측할 수 있는지(observability)와 motion distortion의 형태가 기존 회전식과 전혀 다르게 나타난다. FAST-LIO2처럼 원시 포인트를 지도에 곧장 맞추거나 Livox 전용 구현([loam_livox](https://github.com/hku-mars/loam_livox))을 쓰는 대안은 나왔지만, 센서의 시야각과 스캔 패턴에 구애받지 않고 단일 설정으로 두루 통하는 일반 해법은 아직 남아 있다.

**동적 물체 처리.** 2014년 LOAM 논문이 future work 목록에 올리지도 않았던 문제지만, 환경이 정지해 있다는 오래된 가정은 LiDAR SLAM 역시 피해 가지 못한다. SuMa++처럼 semantic segmentation 라벨로 움직이는 점을 걷어 내는 흐름과, ERASOR·Dynablox처럼 순수 기하적 가시성 추론으로 동적 점을 골라내는 흐름이 나란히 다듬어지고 있다.

---

카메라와 LiDAR가 각자의 길에서 성숙한 주류 시스템을 빚어내는 동안, 그 바깥에서는 전혀 다른 발상에서 출발해 반짝였으나 끝내 중심 무대에 오르지 못했거나 완전히 다른 모습으로 변모해 버린 시도들도 있었다. 다음 장에서는 바로 그 "사라진 방법들"의 흔적을 짚어 본다.

# 22장 사라진 방법들

카메라 기반 SLAM과 LiDAR 기반 SLAM이 거대한 주류 고속도로를 닦아 나가는 동안, 로보틱스 연구자 일부는 그 어느 쪽에도 속하지 않는 샛길로 들어섰다. 쥐의 해마를 흉내 낸 생체 모방 지도, 프레임 없이 빛의 변화만 쏘아 대는 이벤트 카메라, 점이 아니라 의자와 탁자를 기본 단위로 삼는 semantic 지도, 복도의 직교성에 기대는 구조적 prior가 그 샛길들이었다.

이들은 모두 한때 굵직한 논문과 인상적인 초기 시연을 내놓고도 주류 파이프라인의 자리를 차지하지 못했다. 그러나 실패의 이유는 저마다 달랐고, 그 가운데 일부는 전혀 다른 이름과 모습으로 2020년대의 연구 속에 다시 나타났다.

## 22.1 RatSLAM — place cell 기반 위상 지도

2004년 ICRA에서 호주 University of Queensland의 Michael Milford, Gordon Wyeth, David Prasser가 발표한 [RatSLAM(Milford et al. 2004)](https://doi.org/10.1109/ROBOT.2004.1307183)은 쥐의 뇌에서 공간을 부호화하는 **place cell**과 **head direction cell**을 본떠 로봇의 위치를 추정했다. 시스템의 심장은 `(x, y, θ)` 세 축으로 배열된 경쟁 끌개 신경망(competitive attractor network), 곧 **pose cell**이다. 이 신경망 안에서 활성이 한곳에 뭉쳐 있는 덩어리(activity packet)가 로봇의 현재 위치와 방향을 뜻한다. 바퀴 엔코더가 이동량을 보고하면(path integration) 활성 덩어리가 격자 위를 옮겨 가고, 로봇이 전에 본 적이 있는 장면(local view)을 다시 마주치면 그 장면과 연결된 pose cell이 깨어나면서 덩어리의 위치를 교정한다.

그 야심은 2008년 IEEE TRO 논문 [Milford & Wyeth 2008](https://doi.org/10.1109/TRO.2008.2004520)에서 극적인 야외 시연으로 증명됐다. 연구진은 승용차 지붕에 노트북 내장 웹캠 단 한 대를 올려놓고 브리즈번 St Lucia 교외 도로를 100분 동안 66 km 달렸다. RatSLAM은 초당 10프레임으로 쏟아지는 저화질 영상을 실시간으로 소화하며 길이가 최대 5 km에 달하는 루프를 51개 넘게 닫았다. 결과물로 얻은 반계량 위상 지도(semi-metric topological map)가 덮은 면적은, 2007년까지 레이저 센서 하나로 작성된 가장 넓은 지도라고 보고된 기존 연구진의 지도보다 다섯 배 넘게 넓었다.

그런데도 RatSLAM은 SLAM의 주류가 되지 못했다. 장소가 쌓일수록 탐색 연산이 커진 문제도 있었지만, 더 치명적인 약점은 정밀도였다. RatSLAM이 빚어낸 위상 지도(topological map)는 "여기에 와 본 적이 있다"는 연결 관계를 훌륭하게 기억했다. 하지만 차선을 지켜야 하는 자율주행과 물체를 집어 올려야 하는 조작(manipulation)에서는 센티미터·미터 단위의 정확한 metric 좌표가 필요한데, 위상 지도는 그 좌표를 안정적으로 내주지 못했다.

그럼에도 RatSLAM이 남긴 불씨는 꺼지지 않았다. 정밀한 3D 기하 복원 없이도 장소를 알아볼 수 있다는 통찰은 곧장 장소 인식(place recognition) 연구로 번졌다. 2012년 Milford와 Wyeth가 내놓은 [SeqSLAM](https://doi.org/10.1109/ICRA.2012.6224623)은 단일 이미지 대신 연속된 이미지 시퀀스를 통째로 비교해 계절과 날씨가 뒤바뀐 도로에서도 장소를 찾아냈고, visual place recognition이라는 독립된 갈래의 주춧돌이 됐다.

> 🔗 **차용.** [O'Keefe와 Dostrovsky(1971)](https://pubmed.ncbi.nlm.nih.gov/5124915/)가 발견한 해마의 place cell은 신경과학에서 인지 지도 이론의 토대를 세웠다. RatSLAM은 바로 그 생물학적 메커니즘을 공학용 로봇 내비게이션 시스템으로 옮겨 심은 가장 대표적인 시도였다.

> 📜 **예언 vs 실제.** Milford와 Wyeth는 2008년 TRO 논문 결론에서 RatSLAM을 "vision-only SLAM의 대안적 접근"이라 부르며, 기존 state-of-the-art SLAM이 쩔쩔매는 거친 환경에서도 큰 오차와 모호한 풍경을 뚫고 거대 루프를 반복해서 닫아 보였다고 자평했다. 절반은 적중했다. 정밀 3D 위치 추정에서는 기하학 기반 SLAM에 밀렸지만, 위상 지도와 순차 기억이라는 아이디어는 오늘날까지 place recognition 연구 한복판에 살아남았다.

## 22.2 biologically-inspired SLAM의 공학적 한계

RatSLAM은 생물 모방 SLAM(biologically-inspired SLAM) 가운데 가장 완성도 높은 시스템이었다. 2000년대 중반부터 2010년대 초반까지 해마의 인지 지도, 내후각 피질(entorhinal cortex)의 grid cell, 수면 중 기억 재생(hippocampal replay)을 본뜬 SLAM 변형들이 뒤를 이었지만, 끝내 비슷한 벽에 부딪혔다.

생물학적 모델은 뇌가 공간을 *어떻게* 표상하는지 설명하려는 과학적 가설이다. 그러나 뇌가 *왜* 그런 근사 방식을 택했는지, 그리고 그 방식이 로봇 공학의 요구 스펙과 맞아떨어지는지는 전혀 다른 문제다. 쥐의 해마가 생존을 위해 굴을 찾아가는 조건과, 로봇 벤치마크가 요구하는 센서·연산·정확도 조건은 애초에 달랐다. 공학적 SLAM에서는 미터 이하의 일관된 정밀도, 예측 가능한 실시간 지연, 낯선 환경에서의 즉각적 적응, 수치적으로 검증 가능한 오차 한계가 필요하다. 인지 신경과학의 우아한 모델만으로는 그 까다로운 공학 명세를 보장하기 어려웠다.

## 22.3 Event SLAM — 하드웨어와 알고리즘 성숙 격차

또 하나의 샛길은 아예 카메라 센서 자체를 바꾸려는 시도에서 열렸다. 2006년 ISSCC에서 Patrick Lichtsteiner, Christoph Posch, Tobi Delbruck이 공개하고([ISSCC 2006](https://tilde.ini.uzh.ch/users/tobi/public_html/papers/lichtsteiner_ISSCC2006_D27_09.pdf)), 2008년 JSSC로 확장한([JSSC 2008](https://doi.org/10.1109/JSSC.2007.914337)) Dynamic Vision Sensor(DVS)가 출발점이었다. ETH Zürich의 Institute of Neuroinformatics(INI) 소속 Lichtsteiner·Delbruck과 빈 ARC Seibersdorf Research의 Posch가 만든 이 센서는 셔터로 모든 픽셀을 한꺼번에 읽어 들이는 대신, 각 픽셀이 밝기의 로그값 변화를 스스로 감시하다가 임계값을 넘기는 순간에만 밝아졌는지(ON) 어두워졌는지(OFF)를 마이크로초 타임스탬프와 함께 비동기(asynchronous)로 쏘아 올렸다. 말 그대로 프레임이 없는 카메라였다.

이벤트 카메라의 장점은 목록으로 나열하기 좋았다. 마이크로초 단위의 시간 해상도, 고속 기동에서도 전혀 번지지 않는 선명함, 터널 내부와 직사광선 아래를 한 화폭에 담는 넓은 동적 범위(HDR), 그리고 [Gallego 등의 서베이](https://arxiv.org/abs/1904.08405)가 짚은 칩 수준 약 10 mW의 극소 전력 소비까지—모두 기존 프레임 카메라가 쩔쩔매던 약점을 정조준하는 매력적인 숫자였다.

실제 SLAM 접목도 빠르게 뒤따랐다. 2014년 ICRA에서 [Weikersdorfer et al. 2014](https://doi.org/10.1109/ICRA.2014.6906882)가 DVS에 깊이 센서를 얹은 event 기반 3D SLAM을 선보였고, 2016–2018년 사이에는 취리히대 Davide Scaramuzza 연구실(RPG)의 Henri Rebecq 등이 [EVO](https://doi.org/10.1109/LRA.2016.2645143)(RA-L 2017)와 시뮬레이터 [ESIM](https://proceedings.mlr.press/v87/rebecq18a.html)(CoRL 2018)을 잇달아 내놓으며 event SLAM 파이프라인의 얼개를 세웠다. 훗날 [EventVLAD](https://ieeexplore.ieee.org/document/9635907/)(Lee & Kim, IROS 2021)처럼 이벤트 스트림에서 잡음을 걷어 낸 edge 영상을 복원해 NetVLAD 서술자를 뽑음으로써 극심한 조명 변화 속 장소 인식을 돌파하려는 시도까지 이어졌다.

그럼에도 event SLAM이 주류 무대로 올라서지 못한 데는 하드웨어와 알고리즘 사이의 성숙 격차가 가로놓여 있었다. 우선 초기 해상도가 너무 낮았다. JSSC 2008 논문의 DVS는 128×128 픽셀로, 당시 흔한 VGA(640×480) 카메라의 약 19분의 1에 불과했다. 특징점 매칭과 세밀한 지도 작성이 해상도에 직결되는 SLAM에서 이 열세는 뼈아팠다. 더 큰 벽은 알고리즘이었다. 수십 년간 프레임 단위의 정지 영상을 전제로 깎아 온 컴퓨터 비전과 SLAM의 수학 전체를 비동기 이벤트 스트림에 맞게 처음부터 다시 써야 했고, 그 재설계의 비용과 시간은 센서의 이론적 장점만큼 빨리 좁혀지지 않았다.

> 🔗 **차용.** DVS는 생물의 망막 신경절 세포가 정적인 배경보다 밝기 변화에 반응해 신호를 보내는 원리에서 착안한 뉴로모픽 센서였다. event SLAM은 바로 그 생체 모방 하드웨어 위에서 태어난 갈래다.

## 22.4 Semantic SLAM — 사물을 landmark로 쓰는 방식

2017년부터 2019년 사이 CVPR, ECCV, IROS 학회장은 "semantic SLAM" 논문으로 들끓었다. 딥러닝이 instance segmentation과 object detection을 실시간 수준으로 끌어올리자, 이 의미 인식을 SLAM의 뼈대 안으로 들이밀려는 시도가 봇물처럼 터진 것이다.

사실 그 선구는 딥러닝 붐보다 앞선 2013년 CVPR에 이미 나와 있었다. Imperial College London의 Renato Salas-Moreno, Richard Newcombe, Hauke Strasdat, Paul Kelly, Andrew Davison이 발표한 **SLAM++**([Salas-Moreno et al. 2013](https://doi.org/10.1109/CVPR.2013.178))는 점이나 패치 대신 *사물(object)*을 지도의 기본 원자로 삼았다. 미리 스캔해 둔 사물 3D 모델을 데이터베이스에 넣어 두고, 손에 든 RGB-D 카메라 영상에서 GPU 병렬 point pair feature 투표로 사물을 실시간 인식한 뒤 ICP로 자세를 맞추어 카메라와 함께 포즈 그래프에 올려 최적화했다. 의자 두 종류와 둥근 탁자 두 종류로 방 한 칸을 재구성한 실험에서, SLAM++는 같은 부피의 KinectFusion 지도와 견주어 지도 메모리를 약 70분의 1로 압축했다고 추산했다. 점 수천 개를 나열하는 대신 사물 수십 개로 방을 요약하면 지도가 가벼워질 뿐 아니라 장소 인식과 loop closure까지 사물 단위로 풀 수 있다는 매력적인 비전이었다.

뒤이어 [SemanticFusion](https://arxiv.org/abs/1609.05130)(McCormac et al., ICRA 2017)이 dense 지도에 semantic label을 입혔고, [MaskFusion](https://arxiv.org/abs/1804.09194)(Rünz et al., ISMAR 2018)이 움직이는 사물을 인식해 개별적으로 추적했다. 같은 시기 [SuperPoint](https://arxiv.org/abs/1712.07629)(DeTone et al., CVPRW 2018)처럼 신경망으로 keypoint detector와 local descriptor를 함께 학습하는 연구도 등장했지만 이는 여전히 점 단위에 머물렀고, semantic SLAM 연구자들은 사물 단위의 의미 이해를 기하 파이프라인의 심장부에 넣어야 환경 변화에도 흔들리지 않는 강건한 지도를 얻을 수 있다고 주장했다.

그러나 2019년까지는 ORB-SLAM2와 VINS-Mono가 벤치마크의 정점을 지켰고, 2020년에는 LIO-SAM이 바통을 이어받았다. 당시의 semantic SLAM 시스템들은 저마다 다른 실내 방과 임의의 사물 데이터셋에서 평가돼 공정한 수평 비교 자체가 어려웠고, 미리 학습된 segmentation 모델과 닫힌 class 목록 바깥을 만나면 무력해진다는 한계를 벗어나지 못했다.

무엇보다 결정적인 걸림돌은 **의존성의 방향**이었다. 사물을 landmark로 세운 SLAM은 segmentation이 빗나가면 지도 전체가 오염되는 취약점을 안고 있었다. 반면 고전적인 기하 파이프라인은 특징점 매칭 일부가 틀려도 RANSAC과 robust kernel로 묵묵히 버텨 냈다. 특정 사물 범주로 훈련된 semantic prior는 훈련 데이터 밖의 세계로 나가자마자 빛을 잃었다.

흥미롭게도 그다음에는 자리바꿈이 일어났다. 사물을 기하 landmark로 쓰려는 시도는 주류에서 물러났지만, semantic 자체는 사라지지 않고 파이프라인의 *바깥과 위층*으로 옮겨 가며 꽃을 피웠다. [SuMa++](https://doi.org/10.1109/IROS40897.2019.8967704)(Chen et al., IROS 2019)는 LiDAR 스캔에서 움직이는 물체를 걸러 내는 필터로 semantic을 썼고, [Kimera](https://doi.org/10.1109/ICRA40945.2020.9196885)(Rosinol et al., ICRA 2020)와 [3D Dynamic Scene Graphs](https://doi.org/10.15607/RSS.2020.XVI.079)(Rosinol et al., RSS 2020), [Hydra](https://doi.org/10.15607/RSS.2022.XVIII.050)(Hughes et al., RSS 2022)는 실시간 metric-semantic mesh 위에 계층적 3D scene graph를 구축했으며, [ConceptGraphs](https://doi.org/10.1109/ICRA57147.2024.10610243)(Gu et al., ICRA 2024)와 [Clio](https://doi.org/10.1109/LRA.2024.3451395)(Maggio et al., RA-L 2024)는 그 위에 open-vocabulary foundation feature를 얹었다. 기하를 대체하는 대신 기하 위에 의미를 쌓아 올리는 이 흐름은 2026년에도 계속되고 있다(→ [19장](#chapter-19), [20장](#chapter-20), [23장 §23.7](#237-semantic-표현과-open-world)).

> 🔗 **차용.** SLAM++의 사물 인식 엔진은 컴퓨터 비전의 model-based recognition 계보에서 왔다. 구체적인 3D 투표 기법은 Drost 등이 제안한 point pair feature 매칭 알고리즘을 GPU로 옮겨 구현한 것이다.

> 📜 **예언 vs 실제.** Salas-Moreno 등은 SLAM++ 논문 결론에서 자신들의 접근을 "보다 일반적인(generic) SLAM 방법으로 가는 첫걸음"이라 부르며, 변형된 사물 인스턴스를 포용하고 장기적으로는 시스템이 스스로 사물 범주를 발견해 정의하게 되기를 기대했다. 초록에서 내세운 지도 압축 효과는 같은 사물이 반복되는 실내 환경과 AR·조작 응용에서 분명히 확인됐다. 그러나 2026년 현재에도 주류 geometric SLAM의 바닥은 여전히 sparse point와 keyframe graph가 지키고 있으며, 시스템이 스스로 사물 클래스를 창조하는 단계에는 이르지 못했다. 대신 semantic은 동적 영역을 가려내는 필터와 SLAM 위층의 계획용 scene graph로 자리를 옮겼다.

---

## 22.5 Manhattan-World 가정 — 좁아진 적용 범위와 보조 제약으로 남은 쓰임

비슷한 시기에 반짝했던 또 하나의 우회로는 환경의 기하적 규칙성을 극대화한 Manhattan-world SLAM이었다. 아이디어는 [Coughlan & Yuille 1999](https://doi.org/10.1109/ICCV.1999.790349)의 Manhattan world 개념에서 왔다. 실내 건축물은 대부분 세계 좌표계의 세 직교 축(x, y, z)에 맞춰 지어지므로, 벽과 바닥·천장이 만들어 내는 평행선 묶음은 영상 속에서 세 개의 직교 소실점(vanishing point)으로 모인다. 각 소실점은 카메라 회전 행렬 `R`과 축 방향 벡터 `d`로 `v = K R d`(K: 카메라 내부 행렬)라는 깔끔한 대수 관계를 이루기 때문에, 서로 직교하는 소실점 세 개만 잡으면 IMU나 특징점 매칭 없이도 카메라 회전 `R`의 세 열을 곧장 계산해 회전 drift를 0으로 눌러 버릴 수 있었다.

이 구조적 prior를 visual odometry와 묶으려는 시도는 길고 반듯한 복도와 직사각형 방에서 인상적인 drift 억제 효과를 냈다. 문제는 문밖으로 한 걸음만 나가도 가정이 무너진다는 점이었다. 둥근 기둥이나 곡면 벽, 야외의 자연 지형, 비정형 파이프가 얽힌 산업 현장에 들어서면 직교 소실점 자체가 사라졌다. 결국 Manhattan-world 가정은 범용 SLAM의 주축이 되지 못한 채, 건축 실내라는 조건이 보장될 때만 꺼내 쓰는 보조 제약으로 물러났다.

---

## 22.6 사라진 방법의 그 뒤

"사라졌다"는 한마디로 묶기에는 각 갈래의 뒷모습이 저마다 다르다. RatSLAM의 위상 지도 발상은 SeqSLAM을 거쳐 오늘날 visual place recognition 연구의 혈관 속에 남아 있다. SLAM++와 [LERF](https://arxiv.org/abs/2303.09553)(Kerr et al., ICCV 2023)·[LangSplat](https://arxiv.org/abs/2312.16084)(Qin et al., CVPR 2024)은 지도에 의미를 싣는다는 목표를 공유하지만, 후자가 SLAM++의 직접적인 인용 계보를 이었다기보다는 새로운 3D 표현 위에서 같은 염원이 독립적으로 되살아난 경우에 가깝다.

반면 event camera SLAM의 궤적은 하드웨어가 뒤늦게 따라붙으며 다시 열리고 있다. 초기 128×128 해상도의 갑갑함을 딛고 2017년 ISSCC에서 Samsung이 640×480 DVS를 발표했고([Son et al. 2017](https://doi.org/10.1109/ISSCC.2017.7870263)), 2021년에는 Sony와 Prophesee가 1280×720 HD 해상도의 IMX636 센서를 [세상에 내놓았다](https://www.sony-semicon.com/en/news/2021/2021090901.html). 고속 레이싱 드론과 극단적 HDR 환경에서 event 센서의 진가가 재확인되면서, Guillermo Gallego(TU Berlin) 등이 정리한 [서베이](https://arxiv.org/abs/1904.08405)를 중심으로 event 기반 ego-motion과 깊이 추정 연구가 다시 탄력을 받고 있다.

---

## 아직 열린 문제

**Biologically-inspired SLAM.** 대규모 비지도 학습을 거친 foundation model이 내부에 빚어내는 공간 표현을 신경과학의 인지 지도와 나란히 놓고 바라보는 시각이 다시 고개를 들고 있다. transformer의 어텐션 패턴이나 잠재 공간이 실제로 해마의 place cell과 닮은 기제를 학습하는지 검증하는 과제는 아직 풀리지 않았으며, RatSLAM이 꿈꿨던 생물 모방 공간 기억이 전혀 다른 이름으로 돌아올지도 흥미로운 가설로 남아 있다.

**Event camera SLAM의 주류화.** 고해상도 상용 event camera가 손에 닿으면서 연구의 토양은 한결 넓어졌다(§22.6). 그럼에도 전통적인 프레임 기반 파이프라인과 매끄럽게 엮는 하이브리드 구조, 이벤트 스트림을 다루는 보편적 표현, 그리고 실제 환경에서의 공정한 표준 벤치마크를 세우는 일은 여전히 진행 중이다.

**"Semantic map" 개념의 향방.** 2023년 이후 LERF와 언어 기반 Gaussian splatting이 자연어 feature를 dense 3D 표현 속에 직접 심기 시작하면서 지도의 성격이 또 한 번 달라지고 있다. 지금까지는 기하 지도를 먼저 세운 뒤 그 위에 의미를 덧칠하는 순서가 당연시됐지만, 표현 자체가 언어와 기하를 한 몸에 품기 시작한 지금 그 순서마저 뒤바뀔지는 아직 아무도 단정하지 못한다.

---

지금까지 0장에서 22장까지, 우리는 사진측량의 기하학에서 출발해 필터와 그래프, 직접법과 딥러닝, LiDAR와 사라진 샛길들까지 SLAM 반세기의 계보를 모두 건너왔다. 이제 마지막 장에서는 그 모든 여정 끝에서 여전히 우리를 가로막고 서 있는 미해결 난제들을 한자리에 모아, SLAM이라는 분야가 아직 어디까지 가지 못했는지를 정직하게 가늠해 본다.

# 23장 열린 문제

2026년의 일상 풍경만 보면 SLAM은 이미 끝난 문제처럼 보인다. 스마트폰 AR 화면에 띄운 가상 가구는 벽에 못 박힌 듯 흔들리지 않고, 실내 배송 로봇은 사전 지도 없이도 주방과 회의실을 가려 찾아가며, DUSt3R 계열 모델에 사진 몇 장을 밀어 넣으면 몇 초 만에 그럴듯한 3D 구조가 쏟아진다. "SLAM은 다 풀렸다"는 착시는 바로 이 매끄러운 장면들에서 자란다.

그러나 냉정히 따져 보면, 실제로 풀린 것은 대략 2003년 무렵 정식화된 문제뿐이다. 곧 장면은 정적이고 조명은 일정하며 공간은 좁다는 전제 아래 단안 카메라의 기하만으로 궤적과 점군을 세우는 문제다. 바로 그 가정 아래서 EKF가 수렴했고, graph SLAM이 루프를 닫았으며, ORB-SLAM이 keyframe을 다스렸다.

지금까지 22개 장을 거치며 살펴본 것처럼, 각 패러다임이 "해결했다"고 선언한 자리 바로 옆에는 늘 풀리지 않은 그림자가 따라붙었다. 흩어져 있던 그 열린 문제들을 한 판 위에 모아 놓고 보면 놀라운 사실이 드러난다. 출발점도 센서도 전혀 달라 보이던 방법들이 결국 같은 근본 제약 앞에서 발걸음을 멈추고 있었다는 점이다.

---

## 23.1 조명과 환경 변화: 카메라 측광 모델의 한계

Visual SLAM이 실험실 형광등을 벗어나 야외로 걸어 나온 순간부터, 조명과 날씨 변화는 한 번도 해결된 적이 없는 숙제였다. 현실의 빛은 카메라 측광 모델(photometric model)이 가정하는 얌전한 범위를 수시로 찢어 놓는다.

딥러닝으로 학습한 서술자가 훈련 데이터 안에서는 ORB보다 나은 성적을 내더라도, 수중이나 열화상, 극심한 저조도 환경으로 들어가면 성능이 들쭉날쭉해지고 고전 기법과 학습 기법 중 무엇이 나은지조차 가리기 어려워진다(→ 2장 「아직 열린 문제」). 어둡거나 격렬히 흔들리는 장면에서 추적이 끊기는 취약점 역시 여전하다. 2007년 PTAM이 아예 논문 제목에 *"Small AR Workspaces"*를 못 박아 활동 무대를 좁은 책상 위로 한정했던 이유도 그 때문이다(→ 5장).

direct method에서는 이 한계가 방법론의 심장부를 찌른다. direct method는 같은 3D 점이 어느 프레임에서나 같은 밝기로 찍힌다는 brightness constancy 가정을 발판으로 삼는다. 카메라의 자동 노출이 움직이거나 역광이 쏟아지고, 어두운 터널에서 눈부신 바깥으로 빠져나오는 순간 그 발판이 통째로 무너진다. Bergmann 등의 online photometric calibration이 노출 시간·response function·vignetting을 direct VO와 함께 실시간으로 추정하며 방어선을 쳤지만(→ 11장 「아직 열린 문제」), 극단적인 빛 변화를 완전히 이겨 내지는 못했다. 장소를 기억해 다시 찾는 place recognition 역시 10년 넘게 같은 벽을 두드리고 있다. [Nordland](https://nikosuenderhauf.github.io/projects/placerecognition/)의 사계절 철길이나 [Oxford RobotCar](https://robotcar-dataset.robots.ox.ac.uk/)의 밤낮·비눈 데이터를 [DINOv2](https://arxiv.org/abs/2304.07193) 기반 표현이 상당 부분 좁혀 놓기는 했으나(→ 13장 「아직 열린 문제」), 장기간에 걸친 외관 변이는 여전히 난제다.

ORB-SLAM3처럼 Atlas 구조로 여러 세션을 넘나드는 다중 지도를 관리하게 되었음에도, 아침 햇살 아래 지어 놓은 지도로 저녁 어스름의 같은 골목을 다시 알아보려 들면 조명의 간극 앞에서 실패할 수 있다는 사실은 변하지 않았다(→ 8장 「아직 열린 문제」).

---

## 23.2 정적 세계 가정: 가장 오래된 단순화의 한계

SLAM이 탄생 이래 가장 오래 기대어 온 단순화는 "세상은 움직이지 않는다"는 정적 세계 가정(static world assumption)이다. 이 전제가 깨지는 지점마다 세대를 건너뛴 시스템들이 똑같은 한계에 부딪혔다. COLMAP 같은 SfM 파이프라인은 지나가는 행인과 차량 앞에서 궤적이 뒤틀리고, KinectFusion에서 BundleFusion으로 이어진 RGB-D dense SLAM 역시 정적 장면을 전제로 삼았다. DynaSLAM과 MaskFusion이 segmentation으로 움직이는 물체를 가려내거나 따로 추적하려 했으나, 실시간 연산 비용과 오인식에 대한 강건성을 동시에 잡는 일은 과제로 남았다(→ 12장 「아직 열린 문제」).

최신 학습 기법이라고 이 전제에서 자유로운 것은 아니다. 자기지도 단안 깊이 학습은 움직이는 물체를 마스크로 가려 손실 계산에서 떼어 내는 편법에 의존하고(→ 14장 「아직 열린 문제」), GS-SLAM·SplaTAM·MonoGS 같은 초기 3DGS SLAM도 예외 없이 세계가 멈춰 있다고 가정했다(→ 18장 「아직 열린 문제」). 카메라와 전혀 다른 물리로 세상을 재는 LiDAR SLAM에서조차, 2014년 LOAM이 future work에 적지 않았던 동적 물체 처리가 지금까지 미해결 과제로 남아 있다(→ 21장 「아직 열린 문제」).

시간 축을 조금만 더 늘려 잡으면 문제는 한층 교묘해진다. 로봇이 다음 날 다시 찾은 방에서 어제 보던 의자가 보이지 않을 때, 의자가 정말 치워진 것인지(**evidence of absence**) 아니면 책상 모서리에 가려 아직 못 본 것인지(**absence of evidence**) 구별해야 한다. *The SLAM Handbook* 15장은 이를 change detection의 핵심 난제로 지목하며, Khronos가 loop closure 뒤에 변화 감지 단계를 다시 돌려 둘을 가르는 해법을 소개한다. [Schmid 등의 Panoptic Multi-TSDF](https://doi.org/10.1109/ICRA46639.2022.9811877)(ICRA 2022)는 물체마다 독립된 submap을 두어 비활성 기억이 망가지지 않게 방어했다. 나아가 표면 자체가 휘고 늘어나는 변형 장면에서는 카메라의 강체 움직임과 물체의 강체 움직임을 가를 수 없는 **Floating Map Ambiguity**가 나타난다. Handbook §15.5는 변위 prior에 기대어 우회하는 대신 카메라 궤적과 지도 변형을 둘 다 정확히 복원할 수 있는 근본 조건을 열린 질문으로 남겨 두었다. Khronos가 RGB-D 입력에서 단기·장기 변화를 온라인으로 풀어냈지만 비강체 변형은 다루지 못했고, 최소침습수술(MIS)용 단안 SLAM인 NR-SLAM 역시 생체 내시경 평가에서 깊이 불연속과 격렬한 변형이 겹치면 지도를 넓히기 어렵다고 스스로 한계를 밝혔다(→ 19장).

---

## 23.3 Scale과 표현 메모리: 크기가 달라지면 문제가 달라진다

SLAM 시스템이 연구실 한 칸에서 다층 건물로, 다시 도시 전체로 무대를 넓힐 때마다 같은 크기 문제가 다른 얼굴을 하고 되돌아왔다. 가장 원초적인 장벽은 1980년대 SfM 이론이 이미 증명한 단안 scale 모호성이다. 단안 투영 기하만으로는 궤적과 3D 구조 전체를 어떤 배율로 늘이거나 줄여도 영상 관측과 완전히 일치하므로, 미터 단위의 절대 크기를 잡으려면 IMU나 깊이 센서 같은 외부 단서가 필요하다(→ 5장 「아직 열린 문제」). 이는 딥러닝 단안 깊이 추정에서도 마찬가지다. [Metric3D v2](https://arxiv.org/abs/2404.15506)가 카메라 모델 차이를 canonical camera space로 정규화해 metric depth를 뽑아내고 [Depth Anything V2](https://arxiv.org/abs/2406.09414)가 metric depth 라벨로 미세조정을 거쳤지만, 스마트폰·CCTV·아카이브 영상·위성 사진처럼 내부 파라미터조차 모르는 임의의 영상에서 보편적인 metric depth를 내는 문제는 여전히 풀리지 않았다(→ 14장 「아직 열린 문제」).

공간이 넓어질수록 지도를 담는 메모리의 천장도 빠르게 내려온다. [Voxblox](https://arxiv.org/abs/1611.03631)와 [OctoMap](https://octomap.github.io/)이 희소 해싱과 트리로 TSDF의 덩치를 줄이고 wavemap 같은 다해상도 구조가 등장했지만, dense 지도의 메모리는 영역과 해상도에 따라 가파르게 치솟는다(→ 12장 「아직 열린 문제」). NeRF-SLAM 역시 같은 메모리 벽에 막혀 도시 규모 실시간 주행에 닿지 못했고(→ 17장 「아직 열린 문제」), 3DGS도 장면 크기와 디테일에 비례해 Gaussian 개수가 불어났다(→ 18장 「아직 열린 문제」). 흥미롭게도 3D foundation model에서는 이 크기 문제가 transformer의 연산 구조로 옮겨 붙었다. 모든 image token 사이에 attention을 걸면 메모리가 token 수의 제곱으로 폭증하기 때문에, 수백·수천 장의 긴 시퀀스를 한꺼번에 집어삼킬 수 없다. Spann3R의 점진적 메모리 방식은 그 틈을 찌른 부분적 해법일 뿐이다(→ 20장 「아직 열린 문제」).

Davison은 이 크기 문제를 단순한 용량이 아니라 **데이터 이동 비용**이라는 물리학의 언어로 다시 번역한다. 실제 칩에서 전력을 태우는 주범은 연산 자체가 아니라 프로세서와 메모리 사이에서 비트를 실어 나르는 물리적 거리이기 때문이다. Davison은 Handbook Ch.18 §18.8에서 12번째 SLAM 평가 지표로 *"on-device data movement, measured in bits × millimetres"*를 제안한다(p.547). 같은 Handbook Ch.16의 복잡도 수식 역시 표현의 추상화 수준이 메모리 비용을 어떻게 바꾸는지 냉정하게 대조한다. 라벨마다 따로 격자를 파는 flat voxel map이 $O(L\cdot V/\delta^3)$(Eq. 16.34)을 요구하는 반면, metric-semantic 계층 지도는 $O(V/\delta^3+N_\text{objects}+N_\text{rooms}+\cdots)$(Eq. 16.35)로, 기하 층을 더욱 압축한 topological 3D scene graph는 $O(N_\text{sub-sym}+N_\text{objects}+N_\text{rooms}+\cdots)$(Eq. 16.36)로 줄어든다. 물론 마지막 단계까지 압축하면 원래 voxel 지도가 품고 있던 세밀한 기하 정보 일부는 포기할 수밖에 없다.

## 23.4 학습 기반 시스템의 불확실성 calibration

Julier와 Uhlmann이 EKF SLAM의 비일관성(inconsistency)을 폭로한 이후, "SLAM 시스템이 자신이 어디 있는지 *모른다는 사실*을 스스로 얼마나 정확히 아는가"는 이 분야의 영원한 질문이 됐다. 실제 센서의 오차 분포는 봉우리가 여럿이거나(multi-modal) 꼬리가 두꺼운(heavy-tail) 경우가 흔해 단일 가우시안 가정과 정면으로 충돌한다. Stein particle, normalizing flow, learned uncertainty가 대안으로 탐색되고 있지만 실시간 임베디드 검증까지는 갈 길이 멀다(→ 4장 「아직 열린 문제」). Graph SLAM에서도 환경과 센서마다 달라지는 아웃라이어 분포에 맞춰 robust kernel을 사전에 정하는 일은 여전히 경험에 기대며(→ 6장 「아직 열린 문제」), certifiable 최적화조차 현실의 벽 앞에 서 있다(→ [7장](#chapter-7)). SE-Sync의 전역 최적성 보장은 노이즈가 임계치 $\beta$ 이하라는 충분조건으로 주어지는데, 실전 데이터에서 $\beta$를 사전에 계산하거나, 이를 visual SLAM과 VIO로 확장하거나, 새 측정이 들어올 때마다 SDP를 새로 풀어 인증(certificate)을 실시간 갱신하는 일은 모두 과제로 남아 있다.

학습 기반 시스템으로 넘어오면 불확실성 문제는 한층 더 불투명해진다. Bayesian PoseNet 이후 수많은 연구가 신경망의 불확실성을 뽑아내려 했지만, 훈련 분포 밖(OOD) 입력이 들어왔을 때 그 불확실성이 실제 오차와 제대로 맞아떨어지는지(calibrated)는 아직 검증되지 않았다(→ 15장 「아직 열린 문제」). DROID-SLAM 계열처럼 learned prior에 기댄 모델은 훈련 도메인을 벗어나도 성능 저하를 겉으로 드러내지 않은 채 매끄럽고 그럴듯한 오답을 내놓기 쉽다. 물론 고전 기하학 기반 방법 역시 잘못된 지역해나 과도한 확신 같은 조용한 실패를 겪지만, [TartanAir](https://arxiv.org/abs/2003.14338) 같은 방대한 합성 데이터로 무장하더라도 sim-to-real gap이 남기는 불확실성의 빈틈은 여전히 좁혀지지 않았다(→ 16장 「아직 열린 문제」). Foundation 3D에서는 이 문제가 loop closure의 모호함으로 이어진다. MASt3R-SLAM조차 pointmap 기반 교정을 지도 전체로 퍼뜨리는 일에서는 여전히 기존 그래프 방식에 기대고 있어, 이 접근이 새 시대에 맞는 원리적 해법인지는 판단이 이르다(→ 20장 「아직 열린 문제」).

Davison은 Handbook Ch.18에서 이 지점을 가장 날카롭게 찌른다. *"100장으로 3D 모델을 만든 네트워크에 이미지 1장이 추가되면 전체를 다시 돌려야 하는가"* (p.528). 장기간 지도를 유지하고 새 관측을 끊임없이 녹여 넣으려면 결국 확률적 상태 추정과 모듈형 장면 표현이 다시 필요해진다는 진단이다. 그가 대안으로 제시한 [GBP Learning](https://arxiv.org/abs/2311.14649)(Nabarro et al., ICML 2024)은 아예 신경망 가중치 자체를 factor graph의 확률 변수로 올려 *"training time"*과 *"test time"*의 경계를 허물어 보려는 시도다(§18.7, pp.543–545). 이 급진적인 통합이 학습과 추론의 불확실성을 원리적으로 풀어낼 수 있을지는 이제 막 시험대에 올랐다.

## 23.5 센서 융합과 새 모달리티

카메라와 LiDAR는 같은 3차원 세상을 다른 물리량으로 읽으며 각자 성숙한 체계를 세웠지만, 둘을 완전히 하나로 합치는 표준 공식에는 아직 이르지 못했다. LVI-SAM은 visual-inertial과 lidar-inertial 서브시스템을 factor graph 하나로 엮어 tightly coupled 시스템이라 이름 붙였으나, 실제로 그 구조는 한쪽이 흔들릴 때 다른 쪽이 홀로 살아남을 수 있도록 느슨한 독립성을 남겨 둔 타협이었다. 서로 다른 물리 센서들을 단일 추정기 안에서 가장 안정적으로 결합하는 표준 아키텍처는 여전히 연구실마다 제각각이다(→ 21장 「아직 열린 문제」). 여기에 시야각이 좁고 스캔 패턴이 비반복적인 solid-state LiDAR가 보급되면서 360° 회전 스캔을 전제로 짰던 LOAM 계열의 가정이 깨졌고, FAST-LIO2나 Livox 전용 구현이 대응에 나섰지만 센서 종류와 스캔 패턴을 가리지 않는 보편 해법은 아직 미완이다(→ 21장 「아직 열린 문제」).

단일 카메라 안에서도 풀리지 않은 연결 고리가 많다. 시점이 크게 어긋나는 wide-baseline 환경에서는 Harris나 ORB 같은 hand-crafted 특징점이 급격히 무너진다. 이에 DUSt3R가 명시적 sparse matching을 건너뛰며 우회로를 열었지만, 이 접근이 서술자 문제를 근본적으로 끝낸 것인지 단정하기는 이르다(→ 2장 「아직 열린 문제」). 장소 인식과 정밀 metric localization을 하나의 통합 표현으로 합치려는 2023–2025년의 시도 역시 위치 정밀도와 실행 속도를 동시에 잡는 숙제를 안고 있다(→ 13장 「아직 열린 문제」).

새로운 센서가 등장할 때 알고리즘이 얼마나 더디게 뒤따라오는지를 보여 주는 대표 사례는 event camera다. 2017년 Samsung의 640×480 센서와 2021년 Sony·Prophesee의 1280×720 센서로 하드웨어 해상도 제약은 크게 풀렸지만(→ 22장 §22.6), 프레임 기반 파이프라인과의 융합, 비동기 이벤트 표현, 실세계 벤치마크 확립은 여전히 개척 중인 영역이다(→ 22장 「아직 열린 문제」).

나아가 안개와 폭우 속에서도 뚫리지 않는 **4D imaging radar**(Oxford Radar RobotCar, nuScenes, Arbe·Mobileye 등의 등장으로 자율주행의 한 축이 된)와, ANYmal·Spot·Unitree 같은 사족보행 로봇이 야외에 투입되면서 운동학(kinematic) 및 지면 접촉(contact) prior를 융합하는 **legged/proprioceptive SLAM**은 출발점과 벤치마크부터 판이하게 달라, 각각 따로 한 권의 역사를 써 내려가야 할 만큼 독자적인 거대 갈래로 자라고 있다.

## 23.6 알고리즘 구조를 하드웨어에 맞추기

지금까지 SLAM의 진보를 떠받친 보이지 않는 후원자는 CPU 클록 속도였다. 그러나 Davison은 Handbook Ch.18의 서두에서 그 시대가 끝났다고 선언한다. 프로세서가 매년 빨라지던 전제에 대해 *"this has stopped being true"*라고 못 박으며, 단일 코어 클록이 약 4 GHz 벽에 부딪힌 지 오래라고 짚는다(pp.528–529). 반대로 몸에 걸치는 미래의 Spatial AI 기기는 안경 한 짝의 무게와 열 한계—65 g, 1 W 미만—안에 갇혀야 한다(p.522). 이처럼 벌어지는 간극 때문에 SLAM은 결국 **이질적·특수목적·병렬(heterogeneous·specialized·parallel)** 실리콘 아키텍처에 알고리즘의 그래프 구조를 직접 맞추는 방향으로 갈 수밖에 없다. 이것이 그의 통찰이다.

실리콘 지형은 이미 그 방향으로 쪼개지고 있다. [Apple Vision Pro의 R1](https://www.apple.com/uk/newsroom/2023/06/introducing-apple-vision-pro/)(2023)은 카메라와 센서 입력을 12 ms 안에 디스플레이로 꽂아 넣는 초저지연 전용 칩이고, [Meta Aria Gen 2](https://ai.meta.com/blog/aria-gen-2-research-glasses-under-the-hood-reality-labs/)(2025)는 기기 내부 machine perception을 전담하는 coprocessor를 품었다. 1,216개의 독립 코어가 각자 로컬 메모리를 쥔 채 메시지를 주고받는 Graphcore IPU, 256×256 픽셀마다 초소형 프로세서를 심어 1.2 W로 도는 Manchester 대학의 [SCAMP5](https://personalpages.manchester.ac.uk/staff/p.dudek/papers/carey-iscas2013.pdf), ARM 코어를 최대 100만 개까지 엮는 뉴로모픽 구조 [SpiNNaker](https://apt.cs.manchester.ac.uk/projects/SpiNNaker/)까지, 칩마다 선호하는 통신 토폴로지가 판이하다. 어떤 SLAM 그래프를 어떤 실리콘에 어떻게 배치할지가 새로운 설계 축으로 떠올랐다.

Davison이 후기에 집중한 **Gaussian Belief Propagation(GBP)**은 바로 이 병렬 실리콘을 겨냥한 해법이다. Ortiz, Pupilli, Leutenegger, Davison은 [Bundle Adjustment on a Graph Processor](https://arxiv.org/abs/2003.03134)(CVPR 2020)에서 IPU 코어 1,216개 위에 GBP를 올려 keyframe 125개·3D 점 1,919개 규모의 실제 bundle adjustment를 단 40 ms 만에 풀었다(CPU에서 Ceres로 풀면 1,450 ms가 걸리던 문제다). 이어 Murai 등의 [Robot Web](https://arxiv.org/abs/2202.03314)(IEEE TRO 2024)은 수많은 로봇이 factor graph의 자기 조각만 쥔 채 비동기 메시지를 주고받으며 시뮬레이션상 최대 1,000대까지 분산 방식으로 위치를 추정하는 모습을 보였다. *"We must get away from the idea that a 'god's eye view' of the whole structure of the graph will ever be available"* (Handbook Ch.18, p.541). GBP는 그래프 전체를 한눈에 내려다보고 2차 행렬을 한꺼번에 역산하려는 집착을 버리고, 메시지가 그래프 위를 거품("bubble")처럼 퍼져 나가며 국소적으로 수렴하게 만든다. 흥미롭게도 MASt3R-SLAM 같은 최신 transformer 기반 시스템은 정반대로 backend에서 여전히 그래프 전체를 한 번에 푸는 2차 global optimization을 고수하고 있어, 두 흐름의 긴장은 당분간 이어질 전망이다.

그래서 Davison이 제안한 12가지 SLAM 지표 가운데 마지막 두 자리—11번 "power usage"와 12번 "on-device data movement"—는 정확도가 아니라 하드웨어 효율을 묻는다(§18.8, p.547). 몇 센티미터 더 정확한 궤적을 얻기 위해 기기 안에서 몇 와트를 태우고 몇 기가바이트를 옮겼는지를 함께 채점하자는 제안이다. TUM, KITTI, EuRoC 같은 기존 벤치마크 질서가 이 하드웨어 지표를 받아들일지는 아직 미지수다.

## 23.7 Semantic 표현과 Open-World

앞선 장에서 보았듯 사물을 기하 landmark로 삼으려던 semantic SLAM은 주류에서 밀려났다(→ [22장 §22.4](#224-semantic-slam-사물을-landmark로-쓰는-방식)). ORB-SLAM3도, 최신 MASt3R-SLAM도 지도의 바닥은 여전히 점으로 짠다. 대신 semantic은 지도의 한 층 위로 올라앉아 전혀 다른 전성기를 열었다.

실시간 metric-semantic mesh를 빚은 [Kimera](https://doi.org/10.1109/ICRA40945.2020.9196885)(2020)와 Handbook Ch.16이 *"first online system to produce fully hierarchical scene graphs that included objects, places, and rooms"*라고 평한(§16.4.2) [Hydra](https://doi.org/10.15607/RSS.2022.XVIII.050)(2022)가 그 토대를 놓았고(→ 22장 §22.4), 곧이어 그 위에 vision-language foundation feature가 얹혔다. [ConceptFusion](https://arxiv.org/abs/2302.07241)과 [VLMaps](https://arxiv.org/abs/2210.05714)(2023)가 CLIP feature를 dense 지도에 입혔고, [ConceptGraphs](https://doi.org/10.1109/ICRA57147.2024.10610243)(2024)는 open-vocabulary 객체 노드로, [Clio](https://doi.org/10.1109/LRA.2024.3451395)(2024)는 임무 맞춤형 계층 구조로 지평을 넓혔다. [LERF](https://arxiv.org/abs/2303.09553)와 [LangSplat](https://arxiv.org/abs/2312.16084)은 radiance field와 Gaussian splatting 속에 직접 언어 특징을 심었다.

그러나 의미가 지도 안으로 들어오면서 이전에 없던 새 난제들이 쏟아졌다. Handbook Ch.16 저자들이 짚듯, *"performing uncertainty quantification in hierarchical representations mixing discrete and continuous variables is still a largely unexplored problem"* (p.488). 사물 클래스나 방 번호 같은 이산 변수와 자세·표면 좌표 같은 연속 변수가 한 그래프 안에 뒤섞였을 때 불확실성을 어떻게 전파하고 통합할지는 아직 거의 개척되지 않았다. 실내 건축물 문법에서 벗어나 비정형 야외 환경으로 scene graph를 넓히는 일이나, Clio가 Information Bottleneck 원리로 임무에 맞춰 계층을 다시 엮던 방식(Handbook Ch.17, Eq. 17.8)을 임의의 과제로 일반화하는 문제도 남아 있다.

급기야 지도의 존재 이유 자체를 묻는 근본적 질문까지 제기됐다. Handbook Ch.17 §17.4.2 *"Revisiting the Question of the Need for Maps"*에서 Paull 등 저자들은 context window가 긴 VLM에 과거 영상을 통째로 집어넣으면 명시적 scene graph 없이도 로봇이 계획을 세울 수 있지 않느냐고 묻는다. [OpenEQA](https://open-eqa.github.io/)와 [Mobility VLA](https://arxiv.org/abs/2407.07775)(2024) 같은 실험에서 지도 없는 접근이 짧고 단순한 임무에서는 꽤 통했지만, 이동 거리와 시간 지평이 길어지자 무너졌다. Ch.17 저자들은 명시적 지도의 필요성이 결국 과제의 시공간 지평에 달려 있으며 활발히 연구 중인 문제라고 정리한다(*"the need for an explicit map representation ... largely depend[s] on the spatial and temporal horizons of the considered tasks and remains an active area of research"*, p.515).

이 질문은 곧바로 [RT-2](https://robotics-transformer2.github.io/)(2023), [OpenVLA](https://arxiv.org/abs/2406.09246)(2024), [π₀](https://www.physicalintelligence.company/blog/pi0)(2024) 같은 생성형 로봇 정책(VLA)과 SLAM의 관계로 이어진다. VLA 모델이 SLAM을 대체할 것인가, 아니면 SLAM이 닦아 놓은 구조 위에서 춤을 출 것인가. Handbook Ch.17 결론부는 조합 가능한(compositional) 과제에서 진정한 일반화와 확장성을 얻으려면 SLAM 같은 과정을 통해 학습되는 일종의 명시적 구조가 필요하며 두 패러다임은 전적으로 상호보완적이라고 적는다(*"true generalization and scalability to compositional tasks ... could be achieved through some form of explicit structure that is learned through a process such as SLAM. ... these two paradigms ... are entirely complementary"*, §17.4.4, p.520). 다만 그 "상호보완"이 구체적으로 어떤 아키텍처로 결합될지는 앞으로 우리가 써 내려가야 할 다음 장의 이야기다.

---

## 23.8 열린 질문의 구조

이 모든 열린 문제는 서로 다른 시간표와 성격으로 남아 있다. 단안 scale 모호성은 1980년대 SfM 이론이 못 박은 기하학적 불변의 사실이며 2026년에도 똑같은 수식으로 버티고 있다. 정적 세계 가정의 균열은 지난 20여 년간 숙주만 바꿔 가며 되살아났다—3장에서는 SfM의 아웃라이어로, 12장에서는 dense SLAM의 유령 표면으로, 18장에서는 Gaussian 표현의 한계로, 21장에서는 LiDAR SLAM의 잔상으로 모습을 바꿨다. 반면에 3D foundation model에서 loop closure를 어떻게 재정의할 것인가, 학습된 불확실성을 어떻게 calibrate할 것인가 하는 물음은 태어난 지 이제 몇 해 되지 않은 젊은 난제들이다.

0장은 세상이 "SLAM은 이미 풀렸다"고 말하는 시대에서 출발했다. 바로 그 2026년에 출간된 *The SLAM Handbook*의 Epilogue 조언 모음에는 다음 한 문장이 실려 있다. *"If someone tells you 'SLAM is solved,' don't listen to them."* 분야 내부의 역사는 왜 그 경고가 헛되지 않은지를 증언한다. EKF의 국소 선형화와 단일 가우시안 가정을 내려놓자 particle filter가 나타났고, sparse 특징점 가정을 내려놓자 dense method가 열렸으며, 고전 기하 prior를 내려놓자 learned prior의 시대가 열렸다. 그러나 가정을 하나 벗어던질 때마다, 이전에 해결된 줄 알았던 오래된 난제들이 전혀 다른 얼굴을 하고 다시 문 앞에 서 있었다.

# Chapter 0. Is SLAM Solved?

Pick up a smartphone in 2026 and an augmented-reality layer locks onto a wall as if painted there. Indoor delivery robots tell the kitchen from the conference room without ever being handed a floor plan. Feed a handful of photographs into a [DUSt3R](https://arxiv.org/abs/2312.14132)-family model, and a 3D scene emerges in seconds. Because these capabilities have disappeared into everyday products, it is tempting to assume that SLAM is essentially a solved problem.

---

Step back to 2003, and the picture looks very different. In a laboratory at Imperial College London, Andrew Davison demonstrated real-time 3D tracking using nothing more than a single laptop and a webcam. His system, [MonoSLAM](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf), ran at 30 Hz on a desktop computer, tracking roughly ten features per frame and maintaining a sparse map of a few dozen landmarks. Its entire world was a single desk in a single room; the moment the camera wandered past the desk's edge, the map could drift and diverge. That modest scale defined the frontier of real-time monocular SLAM at the time.

Those early systems tracked a tiny fraction of the features that a modern phone AR session handles effortlessly. How did the fragile tracking demos of 2003 grow into the spatial-computing infrastructure of 2026?

---

The answer does not follow a single straight line of progress. Instead, SLAM's history traces four distinct research traditions that matured independently before colliding and absorbing one another. Photogrammetrists were already solving bundle adjustment by hand more than a century ago. Roboticists began casting maps in the language of probability with [Smith and Cheeseman](https://arxiv.org/abs/1304.3111)'s 1986 framework for uncertain spatial relationships—a problem setting that acquired the name "SLAM" nine years later in [Durrant-Whyte and Leonard's 1995 survey](https://ieeexplore.ieee.org/document/476131). Meanwhile, computer vision researchers focused on finding and tracking visual features in real time, and in the 2020s the deep learning community began folding all of these geometric pieces into unified neural architectures.

Looking back across those converging paths raises real historical questions. Was the transition from EKF-based SLAM to graph-based SLAM an inevitable technical step, or a shift shaped by a handful of researchers' design bets? Did anyone foresee the divide between feature-based and direct methods from the beginning? And why has deep learning taken so long to displace the classical geometry pipeline? Counterfactual questions only make sense when genuine alternatives existed—and in SLAM, they did.

---

For a rigorous, textbook treatment of the underlying equations, theorems, and proofs, readers can turn to the [SLAM Handbook](https://github.com/SLAM-Handbook-contributors/slam-handbook-public-release). Edited by Carlone, Kim, Barfoot, Cremers, and Dellaert and published by Cambridge University Press in 2026, its 18 chapters survey the current theory and practice of the field.

Fittingly, the five editors close the Handbook with a pointed warning: *"If someone tells you 'SLAM is solved,' don't listen to them."* Far from being the field's consensus, the notion that SLAM is finished usually comes from mistaking mature commercial demos for solved science.

---

When Davison stood in front of his webcam in 2003, he could hardly have known everything that demo would set in motion. You can still find the video online: the jittery frame, the blinking landmark dots, and a sparse map holding only a few dozen points. The path connecting that laboratory room to today's spatial systems is the story of this book.

Yet our story starts long before MonoSLAM. Decades before the acronym "SLAM" took hold in the 1990s—and even before Smith and Cheeseman wrote a probabilistic map down in equations—photogrammetrists were already reconstructing 3D worlds from photographs. The next chapter traces that prehistory.


---

# Chapter 1. Photogrammetry and Bundle Adjustment

The mathematical backbone of today's SLAM optimization backend did not originate in robotics; it was born in German surveying. In the early twentieth century, Carl Pulfrich's optical method for reading depth from glass photographic plates merged with Albrecht Meydenbauer's architectural surveying system to establish a unified photogrammetric tradition. Half a century later, Duane C. Brown cast that tradition into numerical equations in 1958, and in 1999 Bill Triggs, Philip McLauchlan, Richard Hartley, and Andrew Fitzgibbon translated the accumulated surveying literature into the language of computer vision. Rather than inventing bundle adjustment from scratch, Triggs et al. (1999) unlocked a century-old inheritance for a new field—combining Pulfrich's parallax geometry and Brown's (1958) reprojection formulation with the Levenberg-Marquardt nonlinear solver.

---

## 1.1 Early twentieth-century glass plates and stereophotogrammetry

In 1901, [Carl Pulfrich](https://en.wikipedia.org/wiki/Carl_Pulfrich) formally unveiled the **stereocomparator**, manufactured by the Zeiss optical works, at the Hamburg conference of natural scientists (building on a prototype stereoscopic rangefinder he had shown in Munich in 1899). The instrument worked by photographing the same scene from two camera viewpoints and measuring the coordinate difference between corresponding points on the glass plates. Its underlying geometry was straightforward: the parallax between two views is inversely proportional to depth. While that trigonometric relationship had been known since Greek antiquity, Pulfrich's achievement was to pair it with precision optical instrumentation.

A generation earlier, [Albrecht Meydenbauer](https://www.uni-marburg.de/de/fotomarburg/histfoto/gliederung/messbilder/messbildverfahren) had pioneered **architectural photogrammetry** for documenting historic buildings. After nearly falling to his death while measuring the exterior of Wetzlar Cathedral in 1858, he set out to replace risky manual tape-measuring with photographs, an effort that culminated in the founding of the Royal Prussian Photogrammetric Institute (Königlich Preussische Messbild-Anstalt) in 1885.

In the twentieth century, these two streams converged in aerial surveying. Using **aerotriangulation**, aircraft photographed terrain from above so that overlapping pairs of images could be turned into three-dimensional maps—all computed by human operators working with hand calculators. The geometric logic established in that era still underpins modern robotics:

> 🔗 **Borrowed.** Modern SLAM's stereo depth estimation runs on the same principle as Pulfrich's stereocomparator. Depth still comes from the baseline between two cameras and the resulting parallax; a digital pixel array has simply replaced the glass plate of 125 years ago.

---

## 1.2 1958, Brown, and numerical bundle adjustment

What Pulfrich and Meydenbauer achieved with optical instruments, [Duane C. Brown](https://digital.hagley.org/08206139_solution) moved into numerical equations. Working as a surveying engineer on the United States Air Force ballistic missile program, Brown had to jointly estimate satellite orbits and ground coordinates—a task that meant optimizing many camera viewpoints and many ground control points at the same time.

In his 1958 report "A Solution to the General Problem of Multiple Station Analytical Stereotriangulation" (RCA-MTP Data Reduction Technical Report No. 43, AFMTC-TR-58-8), Brown produced one of the foundational formulations of numerical **bundle adjustment (BA)**, alongside Helmut Schmid as a co-inventor of the same era.

At the center of Brown's formulation sits the **reprojection error**. Suppose a 3D point $X_j \in \mathbb{R}^3$ is projected into camera $i$ through its intrinsic matrix $K_i$ and extrinsic pose $[R_i | t_i]$, producing a predicted 2D coordinate $\pi(K_i, R_i, t_i, X_j)$. Bundle adjustment minimizes the sum of squared differences between those predicted projections and the actual 2D image coordinates $x_{ij} \in \mathbb{R}^2$ observed in each image:

$$E = \sum_{i,j} \| x_{ij} - \pi(K_i, R_i, t_i, X_j) \|^2$$

The name "bundle" refers to the bundle of light rays radiating from each camera center toward the observed 3D points. Adjusting the camera poses and point coordinates together bends and aligns those bundles until corresponding rays intersect cleanly in 3D space. Although Brown developed the method for military surveying, bundle adjustment continued to mature quietly within the photogrammetry literature for decades before crossing over into computer vision.

> 🔗 **Translation.** Triggs et al. (1999) synthesized photogrammetric bundle adjustment specifically for implementers in computer vision, bridging two communities that had been tackling the same optimization problem with different terminology and conventions. Notably, their historical account does not support the popular claim that military classification forced computer vision researchers to rediscover the method from scratch.

---

## 1.3 Levenberg and Marquardt — pioneers of nonlinear optimization

Brown supplied the objective function, but the numerical engine capable of solving it came from outside surveying altogether. Because reprojection-error minimization is a nonlinear least-squares problem with no closed-form analytical solution, it requires iterative numerical optimization.

Fourteen years before Brown's report, [Kenneth Levenberg](https://cs.uwaterloo.ca/~y328yu/classics/levenberg.pdf) published a 1944 paper introducing a damping parameter $\lambda$ to interpolate smoothly between Gauss-Newton and steepest descent. Increasing $\lambda$ steers the step toward steepest descent for safe, reliable progress; decreasing $\lambda$ hands control back to Gauss-Newton for rapid convergence near the solution. In its basic form, the update adds $\lambda \mathbf{I}$ to the linearized normal-equation matrix $\mathbf{J}^{\top}\mathbf{J}$, preventing singularity and stabilizing each step. Twenty years ahead of computer vision, the idea was independently rediscovered and formalized in 1963 by [Donald Marquardt](https://epubs.siam.org/doi/10.1137/0111030), settling into the literature as the **Levenberg-Marquardt (LM) algorithm**.

Even then, another thirty-five years would pass before LM became the standard bundle-adjustment solver in computer vision.

---

## 1.4 1999, Triggs et al. — a hundred years of inheritance integrated

The convergence of photogrammetric bundle adjustment and the LM solver arrived at the 1999 Vision Algorithms Workshop, where Bill Triggs, Philip McLauchlan, Richard Hartley, and Andrew Fitzgibbon presented ["Bundle Adjustment — A Modern Synthesis"](https://link.springer.com/chapter/10.1007/3-540-44480-7_21).

Their paper translated a century of bundle-adjustment theory scattered across surveying and aerial photogrammetry into the working vocabulary of computer vision, making two lasting contributions. First, they exposed the computational value of sparse BA: because each 3D point appears in only a subset of cameras, the Hessian has a predictable sparse block structure that can be exploited via the Schur complement trick to make joint camera-point optimization dramatically faster. Second, they gave an explicit treatment of gauge freedom—the inherent arbitrariness of choosing a global reference frame.

That synthesis quickly bore engineering fruit. Seven years later, Noah Snavely's [Photo Tourism (2006)](https://phototour.cs.washington.edu/Photo_Tourism.pdf) automatically reconstructed landmarks such as Notre-Dame and the Trevi Fountain from hundreds of uncurated internet photographs. Another decade on, Johannes Schönberger's [COLMAP (2016)](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf) packaged robust incremental structure from motion (SfM) into open-source software capable of handling tens to hundreds of thousands of images, turning a technique that had already scaled into the million-image range into a reproducible community tool. Without the shared language established by Triggs et al., that transition would have taken far longer.

---

## 1.5 Reprojection Error — the formation of the concept

The error function at the core of Triggs et al.'s synthesis had its own history of conceptual shifts before reaching its modern form.

In the early twentieth century, aerial triangulators typically measured error as a spatial distance in the 3D ground coordinate frame. Yet comparing points directly in 3D had a subtle flaw: errors from a misaligned lens or imperfect camera calibration could be absorbed into the ground-coordinate residual and vanish from diagnosis.

In his 1958 report, Brown shifted the comparison plane from 3D ground space to the 2D image plane, measuring the discrepancy between a projected 3D point and its observed pixel location directly in pixel units. On the image plane, calibration errors, lens distortion, and extrinsic pose errors all surface cleanly in a single residual. Just as important, the formulation rests on solid statistical ground: if pixel noise is modeled as an isotropic Gaussian, minimizing the sum of squared reprojection errors coincides exactly with maximum-likelihood estimation. Triggs et al. (1999) canonized that formulation for computer vision textbooks, and as of 2026 reprojection-error minimization remains the workhorse objective for visual observations in factor graph-based SLAM backends.

> 🔗 **Borrowed.** The standard visual-landmark observation model in SLAM, $z = \pi(K, T, p) + \epsilon$, descends directly from Brown's (1958) reprojection formula. A modern SLAM backend minimizing this residual with Gauss-Newton shares the exact mathematical skeleton of a 1958 aerial triangulation solver.

---

## 1.6 The skeleton of the SLAM backend — through 2026

Although the acronym "SLAM" only entered broad circulation through 1990s literature such as [Durrant-Whyte and Leonard's 1995 survey](https://ieeexplore.ieee.org/document/476131), the mathematics inside modern SLAM backends still bears Brown's 1958 imprint. ORB-SLAM3 jointly optimizes SE(3) camera poses and 3D landmark positions through g2o; LIO-SAM runs the LM algorithm over GTSAM's factor graph; and even DROID-SLAM, which predicts optical-flow updates using a GRU network, passes its estimates through a final bundle-adjustment layer built on the Schur complement trick.

Over the decades, Lie groups and factor graphs have replaced the matrix notation of 1999, and neural networks have taken over parts of feature matching and flow estimation. Still, the core optimization pattern endures: visual BA balances multi-view reprojection errors to refine poses and structure, while LiDAR systems swap in sensor-appropriate residuals such as point-to-point or point-to-plane distances. Pulfrich's glass plate has become a digital sensor and hand calculators have given way to GPUs, yet the underlying estimation problem remains remarkably intact.

That continuity cuts both ways. On one hand, SLAM inherits decades of mature optimization theory and battle-tested solvers; on the other, when real-world scenes violate bundle adjustment's classical assumptions—a static world, discrete point features, and Gaussian noise—that inherited machinery can break down unless those assumptions are explicitly re-examined.

---

> 📜 **Prediction vs. outcome.** Triggs et al. (1999) identified scaling BA to massive problems (thousands of cameras and millions of points) as the defining challenge ahead. Over the next twenty years, SfM systems reached that scale—from Snavely's Photo Tourism (2006) assembling hundreds of internet photos to COLMAP (2016) standardizing robust incremental SfM. Yet scaling required more than just enlarging the linear solver; it depended on an outer engineering layer of incremental BA, visibility-graph pruning, and vocabulary-tree loop closure.

---

## Still open

**Global optimum guarantees for nonlinear BA.** Because the LM algorithm is a local optimizer, a poor initial guess can trap it in the wrong 3D reconstruction. Geometric initialization tools such as the 5-point algorithm, PnP, and epipolar-geometry estimation help place the solver in the right basin, though these minimal solvers must be distinguished from the robust estimation wrappers around them—such as running RANSAC to reject outliers before applying iterative refinement. Convex-relaxation methods that mathematically certify a global optimum in large-scale scenes are an active area of research, yet they still cannot match the speed and scale required for real-time SLAM.

**The gap between photogrammetric accuracy and Visual SLAM.** Accuracy in aerial photogrammetry is tightly governed by controlled imaging conditions and product specifications: calibrated metric cameras, high-precision ground control points (GCPs), and unconstrained offline computation. Real-time Visual SLAM applies the same optimization machinery in GPS-denied settings with consumer cameras and strict per-frame latency budgets. Any meaningful comparison between the two disciplines must therefore separate image-coordinate residuals from ground-coordinate accuracy and explicitly state the range, resolution, control-point conditions, and evaluation criteria involved.

---

Bundle adjustment's core assumptions—a static world, point features, and Gaussian noise—begin to fray the moment a camera encounters moving objects; surveyors, after all, measured bridges rather than robot soccer fields. Even in a static scene, photogrammetry's legacy handed computer vision a decisive prerequisite question: before bundle adjustment can align anything, which pixels across a sequence of moving images should serve as the "corresponding points"?


---

# Chapter 2. Classical Features: From Harris to ORB

Bundle adjustment depends on "corresponding points"—the same physical locations identified reliably across two or more images. In field surveying, humans planted physical targets to create those points; in computer vision, algorithms had to take over that job. Feature detection and description grew directly out of that handoff.

The lineage began in the late 1970s with Hans Moravec's work on the Stanford Cart project, documented in his 1980 Stanford doctoral thesis, ["Obstacle Avoidance and Navigation in the Real World by a Seeing Robot Rover"](https://frc.ri.cmu.edu/~hpm/project.archive/robot.papers/1975.cart/1980.html.thesis/index.html). Moravec offered a concrete rule for picking trackable points by measuring how much image intensity changed across neighboring patches. In 1988, Chris Harris and Mike Stephens formalized that intuition using the eigenvalues of an autocorrelation matrix, while Bruce Lucas and Takeo Kanade had already established the pixel-tracking framework seven years earlier. Later, David Lowe united detection and description in a form invariant to scale and rotation, and Ethan Rublee built a faster, patent-free binary alternative. Today's SLAM front ends still run on this sequence of ideas.

---

## 2.1 The idea of a corner: from Moravec to Harris

In computer vision, a "corner" is any point where a small image patch changes sharply regardless of which direction the camera nudges it. Sliding a patch across a flat wall produces little change, and sliding along a straight edge leaves the pattern unaltered along the edge itself; only a corner or distinct texture reveals motion in every direction. Moravec's (1977) detector captured this idea with a simple rule: shift a window one pixel in each cardinal and diagonal direction—up, down, left, and right—and if the minimum Sum of Squared Differences (SSD) against neighboring patches stays large across all directions, mark the point as a corner.

At the 1988 Alvey Vision Conference, Chris Harris and Mike Stephens replaced Moravec's discrete directional shifts with continuous differentiation in ["A Combined Corner and Edge Detector"](https://www.bmva.org/bmvc/1988/avc-88-023.html). Shifting a window $W$ around pixel $(x,y)$ in image $I$ by an arbitrary small displacement $(\Delta x, \Delta y)$ and expanding the intensity change yields a $2\times2$ structure matrix:

$$M = \sum_{(x,y) \in W} \begin{pmatrix} I_x^2 & I_x I_y \\ I_x I_y & I_y^2 \end{pmatrix}$$

Inspecting the two eigenvalues $\lambda_1, \lambda_2$ of $M$ immediately classifies the local geometry: two large eigenvalues signal a corner, a single large eigenvalue indicates an edge, and two small eigenvalues mark a flat region. To spare early hardware the cost of explicit eigenvalue decomposition, Harris introduced the response score $R = \det(M) - k \cdot \text{tr}(M)^2$, where $k$ is typically chosen between 0.04 and 0.06.

> 🔗 **Borrowed.** Harris's (1988) autocorrelation-matrix formulation generalized Moravec's (1977) SSD-based corner search into continuous image derivatives, building directly on the prototype laid out in the Stanford Cart report.

Six years later, Jianbo Shi and Carlo Tomasi showed in ["Good Features to Track"](https://cecas.clemson.edu/~stb/klt/shi-tomasi-good-features-cvpr1994.pdf) (CVPR 1994) that thresholding $\min(\lambda_1, \lambda_2)$ directly—instead of relying on the Harris response score—yields features that stay far more stable during optical-flow tracking. Known as the Shi-Tomasi corner detector, that criterion remains so practical that OpenCV still exposes it three decades later under the name `goodFeaturesToTrack`.

---

## 2.2 The archetype of tracking: Lucas-Kanade and KLT

Finding a distinctive corner in one frame is only half the task; the system still has to locate that exact same point in the next frame. In their 1981 paper ["An Iterative Image Registration Technique"](https://www.ijcai.org/Proceedings/81-2/Papers/017.pdf), Bruce Lucas and Takeo Kanade formulated frame-to-frame pixel motion as an optimization problem resting on the brightness constancy assumption—the premise that a moving surface point keeps the same intensity $(x,y)$ from one moment to the next:

$$I(x, y, t) = I(x + u, y + v, t + 1)$$

Applying a first-order Taylor expansion for small displacements $(u, v)$ linearizes this relation into the classic optical-flow constraint:

$$I_x u + I_y v + I_t = 0$$

Because a single equation cannot pin down two unknowns, Lucas and Kanade assumed that all pixels inside a small $3\times3$ or $5\times5$ window move together with the same velocity $(u,v)$, turning the problem into an overdetermined linear least-squares system:

$$\begin{pmatrix} \sum I_x^2 & \sum I_x I_y \\ \sum I_x I_y & \sum I_y^2 \end{pmatrix} \begin{pmatrix} u \\ v \end{pmatrix} = -\begin{pmatrix} \sum I_x I_t \\ \sum I_y I_t \end{pmatrix}$$

Notably, the matrix on the left is the exact same structure matrix $M$ that Harris used to find corners. Both corner selection and optical-flow tracking turn on the conditioning of the very same matrix.

In their 1991 technical report ["Detection and Tracking of Point Features"](https://cecas.clemson.edu/~stb/klt/tomasi-kanade-techreport-1991.pdf), Tomasi and Kanade turned this equation into an end-to-end tracker that screens windows by their eigenvalues and refines displacement via Newton-Raphson iteration. Jean-Yves Bouguet (Intel, 2000) later added a coarse-to-fine image pyramid so the solver could converge even across large frame-to-frame motions, completing what became known as the **KLT (Kanade-Lucas-Tomasi) tracker**. More than forty years after Lucas and Kanade's paper, real-time visual-inertial odometry pipelines such as [VINS-Mono](https://arxiv.org/abs/1708.03852) (2018) still rely on a KLT-descended front end.

> 🔗 **Borrowed.** Lucas-Kanade (1981) → KLT tracker → Qin et al.'s VINS-Mono (2018): the optical-flow formulation proposed 37 years earlier endures as the feature-tracking backbone of modern real-time VIO.

---

## 2.3 SIFT — invariance and the patent

KLT excels when a single camera glides smoothly from one frame to the next, but matching the same physical point across images captured by different cameras, on different days, or from sharply different angles is a much harder problem. Wide viewpoint changes warp, scale, and rotate the surrounding patch until raw pixel comparisons fail altogether. Overcoming that barrier called for a compact numerical **descriptor** that stays recognizable even when the viewpoint shifts.

David Lowe (UBC) introduced that idea at ICCV 1999 in a talk titled "Object Recognition from Local Scale-Invariant Features," matching objects across photographs using 128-dimensional vectors. Five years later, he published the definitive IJCV paper, ["Distinctive Image Features from Scale-Invariant Keypoints"](https://www.cs.ubc.ca/~lowe/papers/ijcv04.pdf), cementing **SIFT (Scale-Invariant Feature Transform)** as a cornerstone of computer vision. SIFT operates in two stages:

**Detection stage.** To locate keypoints consistently across changes in camera distance, SIFT computes the Difference of Gaussians (DoG)—a fast approximation to the Laplacian of Gaussian—across multiple image scales and selects local extrema across both space and scale. Letting $L(x,y,\sigma) = G(x,y,\sigma) * I(x,y)$ denote the Gaussian-smoothed image, the DoG response between adjacent scales is:

$$D(x, y, \sigma) = L(x, y, k\sigma) - L(x, y, \sigma)$$

In this expression, $k$ denotes the scale multiplier between adjacent levels (typically $2^{1/s}$, where $s$ is the number of scales per octave). Searching across multiple octaves ensures that the same physical point is recovered even as it grows larger or smaller in the frame.

**Descriptor stage.** Once a keypoint is detected, SIFT assigns a canonical orientation from its dominant local gradient direction so that subsequent measurements remain rotation-invariant. It then divides a $16\times16$ window around the keypoint into $4\times4$ sub-blocks, computes an 8-bin gradient-orientation histogram in each block, and concatenates the histograms into a 128-dimensional vector.

The resulting 128-dimensional descriptor proved remarkably resilient to changes in scale, rotation, and partial affine distortion. Long before KITTI or standardized SLAM benchmarks existed, that robustness made SIFT the default engine for matching photographs across wide viewpoint changes.

Yet SIFT also carried a legal constraint. Lowe filed a patent in March 2000 that was granted in March 2004 (US6711293B1, claiming priority from March 1999). Until the patent expired in March 2020, commercial deployments faced licensing fees—a barrier that spurred a race to invent faster, patent-free alternatives.

> 📜 **Prediction vs. outcome.** In "9 Conclusions" of the 2004 SIFT paper, Lowe forecast applications spanning "view matching for 3D reconstruction, motion tracking and segmentation, robot localization, image panorama assembly, epipolar calibration." Those predictions largely came true: SfM, SLAM, panorama stitching, and early visual robot localization all leaned heavily on SIFT in the late 2000s. After AlexNet arrived in 2012, however, object recognition migrated to CNNs, and learned local descriptors such as SuperPoint and R2D2 gradually challenged SIFT in SLAM. Lowe anticipated the applications accurately; what changed was the underlying descriptor technology.

---

## 2.4 SURF — a speed–accuracy compromise

For all its accuracy, SIFT was far too slow for real-time robotics, consuming hundreds of milliseconds per frame on desktop CPUs of the mid-2000s. At ECCV 2006, Herbert Bay (ETH Zürich) and colleagues offered a faster alternative in ["SURF: Speeded-Up Robust Features"](https://people.ee.ethz.ch/~surf/eccv06.pdf), built around two speedups.

First, instead of building a DoG scale pyramid, SURF detects keypoints using the *determinant of the Hessian matrix*, approximating second-order Gaussian derivatives with simple box filters evaluated in constant time over an integral image. Second, it halves the descriptor size to 64 dimensions by splitting the keypoint neighborhood into $4\times4$ subregions and summarizing Haar wavelet responses $d_x, d_y$ in each subregion with four sums—$(\sum d_x,\, \sum d_y,\, \sum|d_x|,\, \sum|d_y|)$—to form a $4\times4\times4=64$-dimensional vector (alongside an optional 128-dimensional SURF-128 variant).

SURF ran 3–7 times faster than SIFT, though relative accuracy varied with the detector, descriptor configuration, and test conditions—and Bay's method was likewise encumbered by an ETH Zürich patent. Where SIFT fell behind on speed, SURF struggled with both accuracy trade-offs and licensing restrictions, leaving an opening that ORB would soon fill.

> 🔗 **Borrowed.** Lowe's (1999/2004) DoG scale-space → Bay's (2006) Hessian integral image: two distinct engineering answers to scale invariance, trading DoG's theoretical elegance for the raw speed of box-filter approximations.

---

## 2.5 ORB — binary descriptor and release from the patent

What robotics needed was a feature pipeline orders of magnitude faster than SIFT, resilient to rotation and scale shifts, and completely free of patent restrictions. At ICCV 2011, Ethan Rublee, Vincent Rabaud, Kurt Konolige, and Gary Bradski—working at Willow Garage, the birthplace of ROS—delivered that tool in ["ORB: An Efficient Alternative to SIFT or SURF"](https://www.gwylab.com/download/ORB_2012.pdf).

Rather than inventing everything anew, ORB paired and upgraded two proven lightweight components:

**Detection.** For keypoint localization, ORB adopted [FAST](https://www.edwardrosten.com/work/rosten_2006_machine.pdf) (Features from Accelerated Segment Test, Rosten & Drummond 2006), which inspects a 16-pixel circle around each candidate pixel and flags a corner whenever a contiguous arc is noticeably brighter or darker than the center. More than 10 times faster than SIFT's DoG, FAST nonetheless fires along edges as well as true corners, so ORB ranks candidates with a Harris score to retain only the strongest corners.

**Descriptor.** For description, ORB built on [BRIEF](https://www.cs.ubc.ca/~lowe/525/papers/calonder_eccv10.pdf) (Binary Robust Independent Elementary Features, Calonder et al. 2010), which compares intensities at pairs of points inside a patch to pack a 256-bit binary string by default. Matching bit strings uses Hamming distance—implemented on modern CPUs with a fast XOR followed by a bit-count—rather than floating-point Euclidean distance.

Because raw BRIEF breaks down under image rotation, Rublee and colleagues introduced **rBRIEF (rotated BRIEF)**, computing each FAST corner's orientation from its intensity centroid and rotating the sampling patch accordingly before running the binary tests:

$$\theta = \text{atan2}(m_{01},\, m_{10}), \quad m_{pq} = \sum_{x,y} x^p y^q I(x,y)$$

Running roughly 100 times faster than SIFT and completely unencumbered by patents, ORB entered OpenCV immediately and spread across robotics. When Mur-Artal et al. released [ORB-SLAM](https://arxiv.org/abs/1502.00956) in 2015, they named the entire system after the descriptor, and ORB-SLAM3 continued to rely on that same front end in 2021.

> 🔗 **Borrowed.** Calonder et al.'s (2010) BRIEF → Rublee et al.'s (2011) ORB: pairing a binary comparison descriptor with intensity-centroid orientation estimation preserved speed while adding rotation invariance.

---

## 2.6 Learned descriptors

Once ORB reached the practical peak of hand-crafted efficiency, researchers asked whether neural networks trained directly on data could outperform human-designed filters and bit tests. In 2016, Yi et al.'s [LIFT](https://arxiv.org/abs/1603.09114) (Learned Invariant Feature Transform, ECCV 2016) offered an early answer by replacing detection, orientation estimation, and description with three separately trained CNNs linked into a single pipeline.

Two years later, DeTone et al.'s [SuperPoint](https://arxiv.org/abs/1712.07629) (CVPRW 2018) unified keypoint detection and 256-dimensional description inside a single network trained with a self-supervised scheme called homographic adaptation. Pretrained on synthetic geometric shapes and adapted to real photographs, SuperPoint quickly became the benchmark learned local feature in SLAM research. More recently, DINOv2-based representations have entered place recognition through systems like [AnyLoc](https://arxiv.org/abs/2308.00688) (Keetha et al. 2023).

Even so, classical descriptors have not vanished as of 2026. On resource-constrained embedded hardware, ORB remains far faster than SuperPoint, and its failure modes are easier to predict and bound than those of learned models encountering unfamiliar out-of-domain scenes. Since its 2021 release, ORB-SLAM3 has stayed with ORB—meaning Moravec's 1977 corner intuition still steers robots in the 2020s.

---

## Still open

**Generalization limits of learned descriptors.** Learned descriptors such as SuperPoint, R2D2, and DISK routinely outperform classical detectors within their training distribution, yet behave erratically when moved to underwater, thermal, or severe low-light imagery. As of 2026, no consensus settles which family is more dependable across arbitrary environments.

**Failure modes of wide-baseline matching.** Point matchers built on Harris or ORB degrade sharply under large viewpoint changes, depending on scene geometry, rotation axis, and matching thresholds. Affine-covariant detectors such as ASIFT and MSER cover part of that gap without offering a complete fix. More recently, [DUSt3R](https://arxiv.org/abs/2312.14132) (Wang et al. 2023) opened a different path by bypassing explicit feature matching altogether, though it remains too early to tell whether this marks the end of the descriptor problem or simply a detour around it.

---

Harris's corner intuition, Lowe's scale and rotation invariance, and Rublee's binary speed optimization assembled a remarkably durable front-end toolbox. Yet every technique in that toolbox operates on one image or matches a pair of images at a time. Stitching dozens, hundreds, or thousands of photographs into a single geometrically consistent 3D reconstruction required another layer altogether.
