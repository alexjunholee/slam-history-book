# Ch.7 — Feature-based Lineage: The ORB-SLAM Trilogy

Ch.6's graph SLAM work established pose graph optimization as the standard language of SLAM. Kümmerle's g²o (2011) and Kaess's iSAM2 (2012) made iterative optimization feasible on large maps and reduced loop-closure cost to a practical level. Part 3 therefore turns to the front end. Which features should a system extract, and how should it track them?

When Klein and Murray split tracking and mapping into two threads with PTAM in 2007, the result was a lab demo that broke down beyond small indoor scenes. At the University of Zaragoza in 2015, Raúl Mur-Artal combined that structure with Rublee's ORB descriptor (2011), Gálvez-López's DBoW2 visual vocabulary (2012), and Strasdat's Essential graph idea (2011). PTAM was a fast prototype; ORB-SLAM became a ten-year standard.

---

## 7.1 ORB-SLAM (2015): A Tripod of Design Choices

[Mur-Artal, Montiel & Tardós 2015. ORB-SLAM](https://doi.org/10.1109/TRO.2015.2463671), published in *IEEE Transactions on Robotics*, describes SLAM built on ORB features. Each major component reflects a separate design choice.

The system runs three threads: Tracking, Local Mapping, and Loop Closing. PTAM had used two (Tracking and Mapping); Mur-Artal added Loop Closing as a third. This thread recognizes places with DBoW2, optimizes the pose graph over the Essential graph, and finally runs global bundle adjustment (BA). The separation keeps Tracking real-time without making it wait for map edits.

> 🔗 **Borrowed.** PTAM's Tracking–Mapping split (Klein & Murray, 2007) carried directly into ORB-SLAM's Tracking–LocalMapping structure. Mur-Artal acknowledged the debt in §3 of the paper. ORB-SLAM added a third thread and isolated loop closure as an independent module.

Mur-Artal chose the ORB (Oriented FAST and Rotated BRIEF) descriptor for specific reasons. SIFT and SURF carried patent restrictions, while BRIEF was fast but weak under rotation. ORB added rotation invariance to FAST keypoints; Rublee et al. presented it at ICCV 2011. The original experiments reported roughly two orders of magnitude, or about 100 times, higher speed than SIFT, and its binary representation allows matching by Hamming distance in real time on a CPU.

ORB obtains scale invariance from an image pyramid. The original image is shrunk by a scale factor $s$ (1.2 in ORB-SLAM) over 8 levels, and FAST keypoints are detected independently at each level. An intensity centroid defines each keypoint's orientation: the first-order moment of pixel intensity gives the patch center, and the orientation angle $\theta$ rotates the BRIEF bit-comparison pairs. The result is a 256-bit rotation-invariant descriptor. XOR followed by popcount computes the Hamming distance between two descriptors.

> 🔗 **Borrowed.** The descriptor from [Rublee et al. 2011. ORB](https://doi.org/10.1109/ICCV.2011.6126544) gave the system its name. The Zaragoza team did not design ORB; Mur-Artal assembled an existing set of tools into a pipeline. That front-end choice remained in the system's name for the next ten years.

The keyframe-selection policy departs from PTAM's. PTAM added keyframes aggressively; ORB-SLAM removes redundancy using a covisibility graph. In the **covisibility graph**, edge weights count the landmarks shared between keyframes. Two keyframes connect when they share 15 or more landmarks. Local Mapping uses this graph to select a local window and runs BA only within it.

On KITTI sequence 00 (a full 4.5 km loop), ORB-SLAM recorded 1.2% translation drift. PTAM, the comparison target at the time, could not close the large loop. Absolute scale remained ambiguous in both monocular systems. The Essential graph and DBoW2 allowed ORB-SLAM to recognize the loop and absorb the drift.

The **Essential graph** is a subgraph of the covisibility graph. It keeps only edges with 100 or more shared landmarks, the spanning tree, and the loop-closure edges. When a loop is detected the whole graph is optimized as a pose graph. Even with thousands of keyframes the edges of the Essential graph stay sparse. Optimization finishes within seconds.

> 🔗 **Borrowed.** The Essential graph idea came from the hierarchical optimization structure of [Strasdat et al. 2011. Double Window Optimisation](https://doi.org/10.1109/ICCV.2011.6126517). Strasdat separated a local window from a global window to cut optimization cost. Mur-Artal generalized this into a sparse pose graph called the Essential graph.

Place recognition for loop closure is handled by DBoW2. [Gálvez-López & Tardós 2012. DBoW2](https://doi.org/10.1109/TRO.2012.2197158) is a vocabulary tree for binary descriptors. ORB descriptors are hierarchically clustered with k-medians (k-means++ seeding) to build a tree-structured vocabulary. Once the branching factor $k_w$ and depth $L_w$ are fixed, the number of leaf nodes (words) becomes $k_w^{L_w}$. The DBoW2 paper reports an example with $k_w=10$, $L_w=6$ trained into a vocabulary of one million words, and the public ORB-SLAM implementation uses a vocabulary of similar size. Each word carries a TF-IDF (Term Frequency–Inverse Document Frequency) weight: the more frequently a given word appears across the entire keyframe database, the lower its IDF weight, so discriminative words carry more influence. A keyframe is represented by this weighted BoW vector and stored in an inverted index. When a new frame arrives, descending the vocabulary tree to determine the word takes O(log(k^L))=O(L), and the inverted index pulls up candidate keyframes directly. The whole map is never traversed.

The Tracking thread estimates the current pose in every frame. After feature matching with the previous frame, motion-only bundle adjustment refines $\mathbf{T}_{cw} \in SE(3)$. The basic reprojection objective over 3D–2D correspondences $\{(\mathbf{X}_i, \mathbf{u}_i)\}$ is:

$$\mathbf{T}^* = \arg\min_{\mathbf{T}} \sum_i \left\| \mathbf{u}_i - \pi(\mathbf{T}\mathbf{X}_i) \right\|^2$$

Here $\pi$ is the camera projection function, $\mathbf{X}_i$ is a map point in world coordinates, and $\mathbf{u}_i$ is its image observation. Pose optimization uses a robust loss and observation weights, holding map points fixed while changing only the current camera pose. EPnP and RANSAC supply initial pose hypotheses during relocalization. The separate Local Mapping thread performs local BA over neighboring keyframes and map points.

---

## 7.2 ORB-SLAM2 (2017) — Stereo/RGB-D

ORB-SLAM (2015) was monocular only. A single camera cannot recover scale: image pixels alone cannot distinguish a 10 m corridor from a 100 m one. Mur-Artal and Tardós returned to this problem in 2016.

[Mur-Artal & Tardós 2017. ORB-SLAM2](https://doi.org/10.1109/TRO.2017.2705103) addresses the problem by adding stereo and RGB-D. Stereo has a known baseline and triangulates depth directly; RGB-D provides a measured depth value. Both recover metric scale.

The structure is the same three threads as mono. Only the front end changes with the sensor type. Stereo extracts ORB from a rectified image pair and computes depth by left-right matching. Features matched across the pair provide **stereo observations**, while features seen in only one image provide **monocular observations**. Points with depth estimates are further classified as close or far using a threshold proportional to the baseline length.

**Stereo initialization** runs immediately from the first frame, unlike monocular initialization. The monocular mode builds a map from the Essential Matrix or Homography between two frames and retains scale ambiguity. Stereo computes depth at the first keyframe from the horizontal disparity $d$ between left and right images, the baseline $b$, and focal length $f$:

$$Z = \frac{b \cdot f}{d}$$

Feature points with depth $Z$ below the threshold $Z_{\max}=40b$ are registered as 3D map points at once. RGB-D initialization works on the same principle. The depth value $Z$ at pixel $(u, v)$ is read from the depth image, and back-projection yields the 3D coordinate. In both cases, because scale is fixed, Local BA can run right after the first frame.

On the Machine Hall 01 sequence of the EuRoC MAV (Micro Aerial Vehicle) dataset, ORB-SLAM2 (stereo) recorded an absolute translation error of 0.035 m in Table II. The same table uses Stereo LSD-SLAM as the comparison target, showing lower error for ORB-SLAM2 under those evaluation conditions. ORB-SLAM2 also ranked near the top among methods then published on KITTI odometry.

On the day in May 2017 when the paper appeared in IEEE TRO, Mur-Artal and Tardós pushed the source to GitHub alongside it. Two people in the Zaragoza team released mono, stereo, and RGB-D modes on a single codebase. GitHub stars passed several thousand afterward, and ROS wrappers came out of the community.

---

## 7.3 ORB-SLAM3 (2021): Atlas and Visual-Inertial

[Campos et al. 2021. ORB-SLAM3](https://doi.org/10.1109/TRO.2021.3075644), published in IEEE Transactions on Robotics in 2021, has a different author list. The first author is not Mur-Artal but Carlos Campos. Mur-Artal is listed as a coauthor alongside Tardós. Campos had done his PhD at the University of Zaragoza under Tardós. The lineage moved down a generation.

ORB-SLAM3 added two core extensions: **Atlas** (multi-map) and **Visual-Inertial** mode.

Atlas holds several separate maps simultaneously. When tracking fails, the existing map is suspended and a new one starts; if the system later revisits the same place, it merges the maps. ORB-SLAM and ORB-SLAM2 already attempted relocalization in the existing map. When recovery failed and a new map was started, however, they lacked Atlas's ability to retain and merge separate maps. ORB-SLAM3 presents Atlas as a response to that limitation. ORB-SLAM3 reinitializes after failure while retaining the previous map.

Visual-Inertial (VI) mode integrates IMU data. Campos adopted the formulation that Forster et al. proposed at RSS 2015 as "IMU Preintegration on Manifold" and extended in IEEE TRO 2016 as [On-Manifold Preintegration for Real-Time Visual-Inertial Odometry](https://doi.org/10.1109/TRO.2016.2597321). The IMU bridges rapid motions that can make visual tracking fail. VI-SLAM also resolves a monocular camera's scale ambiguity: accelerometer measurements provide absolute scale together with the direction of gravity.

The IMU measurements between keyframes $i$ and $j$ are integrated once. With accelerometer and gyroscope readings modeled as $\tilde{\mathbf{a}}_t = \mathbf{a}_t + \mathbf{b}_a + \mathbf{n}_a$ and $\tilde{\boldsymbol{\omega}}_t = \boldsymbol{\omega}_t + \mathbf{b}_g + \mathbf{n}_g$, where $\mathbf{b}$ is bias and $\mathbf{n}$ is noise, the relative rotation, velocity, and position increments are

$$\Delta\mathbf{R}_{ij} = \prod_{k=i}^{j-1} \mathrm{Exp}\bigl((\tilde{\boldsymbol{\omega}}_k - \mathbf{b}_g)\Delta t\bigr)$$
$$\Delta\mathbf{v}_{ij} = \sum_{k=i}^{j-1} \Delta\mathbf{R}_{ik}\,(\tilde{\mathbf{a}}_k - \mathbf{b}_a)\Delta t$$
$$\Delta\mathbf{p}_{ij} = \sum_{k=i}^{j-1}\!\left[\Delta\mathbf{v}_{ik}\Delta t + \tfrac{1}{2}\Delta\mathbf{R}_{ik}\,(\tilde{\mathbf{a}}_k - \mathbf{b}_a)\Delta t^2\right].$$

Here $\mathrm{Exp}(\cdot)$ is the exponential map of $\mathfrak{so}(3)$. When bias shifts during BA, a first-order Jacobian correction avoids reintegration. ORB-SLAM3 adds these preintegrated terms as inertial edges in the factor graph and optimizes them jointly with the visual reprojection residual. Ch.7b gives the full derivation, from Lupton's Euler-angle attempt to Forster's manifold formulation.

> 🔗 **Borrowed.** Campos used the Forster et al. On-Manifold Preintegration formulation (TRO 2016, originating at RSS 2015) as the core of ORB-SLAM3's inertial integration. Forster's formulas integrate continuous IMU measurements on the SO(3) manifold with bias correction. ORB-SLAM3 incorporated the formulation into factor graph optimization.

On the mean RMSE ATE (Absolute Trajectory Error) across all 11 EuRoC MAV sequences, ORB-SLAM3 (mono-inertial) is reported at 0.043 m in Table II. In the same table VINS-Mono comes in at 0.110 m, and Kimera (stereo-inertial) at 0.119 m.

Combined, VI mode and Atlas let a UAV or handheld device return to a previous map after lighting changes or lost tracking. These additions changed the character of the system, not only its version number.

---

## 7.4 Why It Is Still the Baseline in the 2020s

In 2023, conference papers still included ORB-SLAM3 in comparison tables. New methods reported how much they improved on it. Although the algorithm had been stable since 2021, its benchmark role persisted.

ORB features remain reasonably stable under illumination change, the binary descriptor is fast to compute, and a system can extract many of them in real time to reduce tracking failures. Learned features are more accurate on some datasets but can fail in new environments. ORB's behavior is more predictable.

Reproducibility also matters. The code is public, ROS integration is solid, and thousands of real-world use cases are documented. Labs routinely run ORB-SLAM3 first when evaluating a new system. Because one codebase supports mono, stereo, RGB-D, and IMU, it provides a common baseline across several settings.

The learned alternatives do not beat it consistently. DROID-SLAM (Teed & Deng, 2021) beats ORB-SLAM3 on several sequences. But as the paper itself reports, large sequences such as EuRoC and TartanAir need a 24 GB-class GPU, and on TartanAir it runs at 8 fps, not real time. ORB-SLAM3, by contrast, runs CPU-only, and community reports confirm basic operation on ARM and embedded platforms.

---

## 📜 Prediction vs. outcome

> 📜 **Prediction vs. outcome.** Mur-Artal laid out two Future Work directions in Section IX-C of the 2015 ORB-SLAM paper. "Points at Infinity" proposed using distant points that lack parallax, and therefore cannot serve as ordinary map points, to estimate rotation. "Dense Map Reconstruction" suggested that compact keyframe selection could provide a skeleton for dense reconstruction. Ten years later, VI-SLAM and follow-on work had partly absorbed the first direction. The NeRF-SLAM and Gaussian Splatting line of the 2020s revisited the second with a "sparse skeleton + dense overlay" structure in different representations. The modality extensions the authors also identified (RGB-D, stereo, IMU) appeared in ORB-SLAM2 (2017) and ORB-SLAM3 (2021) under separate problem statements.

> 📜 **Prediction vs. outcome.** In the Conclusions of the 2021 ORB-SLAM3 paper, Campos et al. identified low-texture environments as the system's main failure mode and proposed photometric techniques suited to the four data-association problems, citing endoscopic imagery as one example. Between 2023 and 2025, the community concentrated more heavily on learned front ends such as SuperPoint and LightGlue, while photometric integration continued separately in DSO and LDSO. The official ORB-SLAM3 repository still uses the traditional ORB descriptor in its main branch as of 2026. The authors' photometric direction and the community's learned-feature work diverged.

---

## 🧭 Still open

Long-term map reuse. Atlas made multi-map maintenance possible, but map merging still fails under large lighting changes. A morning map and an evening revisit should merge as the same place, yet DBoW2 misses when appearance changes substantially. Groups working on long-term outdoor autonomy across seasonal change continue to study the problem. As of 2024, there is no complete answer.

The place of the pure-vision baseline. Learned-feature systems have begun to beat ORB-SLAM3 on standard benchmarks. SuperPoint + SuperGlue, LightGlue, and DINOv2-based features show lower error on particular sequences, but generalization remains separate. Outside the training distribution, learned features sometimes perform worse than traditional ORB. Existing experiments are not broad enough to support a claim of consistent superiority.

Drift at large outdoor scale. ORB-SLAM3 still lags LiDAR SLAM on urban driving and paths beyond several kilometers. Urban-scale localization in GPS-denied environments with a pure camera remains unsolved as of 2026. When changes in visual conditions, dynamic objects, and textureless stretches combine, drift accumulates. The gap to LiDAR survey precision is narrowing but has not closed.

---

During the years when the ORB-SLAM trilogy set the feature-based standard, Newcombe and Engel took the opposite approach: use image brightness directly instead of extracting feature points. The two lineages developed side by side through the 2010s, and comparisons exposed their respective limits. ORB-SLAM3 led the EuRoC benchmark in 2021, while DSO beat ORB-SLAM2 in the TUM corridors. They followed the same timetable from different starting points.

# Ch.7b — From a Shaking Sensor to a Constraint: The Invention of IMU Preintegration

Sydney, 2009. At ACFR (the Australian Centre for Field Robotics), doctoral student Todd Lupton was working through a problem with his advisor, Salah Sukkarieh. When a drone moves aggressively, the IMU produces measurements at 200 Hz, too many to place individually in a factor graph. Keyframes arrive only a few times per second; how can the dozens or hundreds of IMU measurements between them become a single unit? Lupton's answer at IROS became the seed of preintegration. Six years later, at RSS 2015, Christian Forster, Davide Scaramuzza, Luca Carlone, and Frank Dellaert carried that seed onto the SO(3) manifold, making the IMU a first-class citizen of the factor graph. Those equations sit behind the line "we used Forster 2016" in Ch.7's ORB-SLAM3, Ch.8's VI-DSO, and Ch.17's LIO-SAM. FAST-LIO instead propagates raw IMU measurements and performs iterated filter updates.

---

## 7b.1 MEMS and the "democratization of sensors"

Preintegration became necessary because IMUs became cheap.

Strapdown inertial navigation has its roots in 1950s aerospace. Ring laser gyros for submarines and missiles cost tens of thousands of dollars, beyond the reach of most robotics laboratories. MEMS (Micro-Electro-Mechanical Systems) changed that. Analog Devices' ADXL and InvenSense's MPU series reduced the price of a six-axis IMU to a few dollars. The iPhone received an IMU in 2007, and by the early 2010s research drones and handheld devices carried MEMS units as a matter of course. This price collapse, driven by billions of smartphones, coincided with Visual SLAM's growing concern with monocular scale ambiguity (Ch.5 §🧭).

The measurement model is simple. The accelerometer gives the specific force $\tilde{\mathbf{a}} = \mathbf{R}_w^b(\mathbf{a}^w - \mathbf{g}^w) + \mathbf{b}^a + \boldsymbol{\eta}^a$ with gravity included, and the gyroscope gives the angular velocity $\tilde{\boldsymbol{\omega}} = \boldsymbol{\omega}_b^b + \mathbf{b}^g + \boldsymbol{\eta}^g$. Here $\mathbf{b}$ is bias and $\boldsymbol{\eta}$ is white noise. Three consequences matter: gravity is always present, bias drifts slowly over time (random walk), and MEMS noise is high-frequency. An estimator must account for gravity and often aligns its world frame with that direction. It also needs a bias model that accounts for changes in temperature and power state.

---

## 7b.2 First attempt — Lupton & Sukkarieh (2009 / 2012)

The problem was the factor graph's time axis. Kaess's iSAM2, covered in Ch.6, takes keyframe-rate poses as nodes, while the IMU produces dozens of measurements between keyframes. Making every measurement a node makes the graph unwieldy; discarding them loses information.

In [Visual-Inertial-Aided Navigation for High-Dynamic Motion (IROS 2009, TRO 2012)](https://doi.org/10.1109/TRO.2011.2170332), Lupton and Sukkarieh integrated the IMU measurements between keyframes $i$ and $j$ *once* to build a relative increment. Treating that increment as one factor kept the raw measurements out of the graph. The name "pre-integration" came from this construction.

Two obstacles limited the implementation. It represented rotation with Euler angles, which suffer from gimbal lock and do not form a manifold. Bias posed the larger problem. A changed bias estimate changes the increment, and full reintegration would require reprocessing hundreds of measurements per keyframe. Lupton already proposed first-order bias correction to reduce that work. Six years later, Forster formulated the correction on SO(3) while accounting for the manifold structure of rotation.

---

## 7b.3 The decisive turn — Forster-Carlone (2015 / 2017)

At RSS 2015, Christian Forster, a doctoral student at ETH Zürich, joined Scaramuzza (UZH), Carlone (Georgia Tech, later MIT), and Dellaert (Georgia Tech, creator of GTSAM) to publish [IMU Preintegration on Manifold for Efficient Visual-Inertial Maximum-a-Posteriori Estimation](https://www.roboticsproceedings.org/rss11/p06.pdf). The extended version appeared in IEEE TRO 2017 as [On-Manifold Preintegration for Real-Time Visual-Inertial Odometry](https://doi.org/10.1109/TRO.2016.2597321). The paper united UZH's agile-drone experiments, Georgia Tech's GTSAM factor-graph language, and Carlone's optimization theory.

They made three changes. First, they defined $\Delta\mathbf{R}_{ij}$ rigorously as a relative rotation on the SO(3) manifold and redefined $\Delta\mathbf{v}_{ij}, \Delta\mathbf{p}_{ij}$ to make them *independent of gravity and the initial state*. These are not physical increments but mathematically state-independent quantities, allowing the IMU factor to be evaluated without repeating preintegration. Its residual still depends on endpoint poses and velocities, gravity, and bias correction. Second, they propagated the covariance $\boldsymbol{\Sigma}_{ij}$ analytically with a right-Jacobian construction that moves noise to the end of the exponential map.

The third change proved decisive: **linear correction via the bias first-order Jacobian**. When the bias shifts during BA, a first-order correction using precomputed partial derivatives replaces full reintegration. It is Lupton's Euclidean linearization applied on SO(3). The Jacobian is computed during the first integration between keyframes and reused through hundreds of graph-optimization iterations. A reintegration taking several milliseconds became a Jacobian-vector product taking several microseconds, allowing the IMU factor to enter real-time BA.

Adoption accelerated when Forster's implementation entered GTSAM as a reference. Later systems did not rewrite the equations; they included `ImuFactor`.

> 🔗 **Borrowed.** Forster's manifold preintegration uses the SO(3) right-Jacobian formalism later organized in [Barfoot 2017. *State Estimation for Robotics*](https://doi.org/10.1017/9781316671528). Exponential maps and Jacobians for small rotational variations were already the common language of robotic state estimation; Forster rewrote IMU preintegration in that language. Moving Lupton's Euler-angle formulation onto SO(3) removed the earlier limitation.

> 🔗 **Borrowed.** [Lupton & Sukkarieh 2012](https://doi.org/10.1109/TRO.2011.2170332) first proposed the bias first-order Jacobian. Forster et al. TRO 2016 §VIII-B acknowledges the debt explicitly: "we follow [Lupton-Sukkarieh] but operate directly on SO(3)." Moving the Euclidean approximation onto the manifold made the computation real-time.

---

## 7b.4 The three schools of practical VIO

Once Forster's formulation settled in, Visual-Inertial Odometry (VIO) systems branched into three lines between 2017 and 2022.

The first line is the filter family, whose roots precede Forster. At ICRA 2007, UC Riverside's Anastasios Mourikis and Stergios Roumeliotis introduced the [MSCKF (Multi-State Constraint Kalman Filter)](https://doi.org/10.1109/ROBOT.2007.364024). It retains past camera poses in the filter state through stochastic cloning. Observed 3D points are not added to the state; projecting the linearized observation equations onto the left null space of the feature Jacobian removes their dependence on feature-position errors. This was an early influential real-time visual-inertial system built on an EKF without preintegration. In 2021, NASA JPL's Mars helicopter Ingenuity used an MSCKF-family estimator on Mars. Guoquan Huang's group at the University of Delaware open-sourced [OpenVINS](https://doi.org/10.1109/ICRA40945.2020.9196524) in 2020.

The second line is the optimization family. Its representative system is [VINS-Mono](https://doi.org/10.1109/TRO.2018.2853729), published in TRO 2018 by Shaojie Shen's HKUST group with doctoral student Tong Qin. They placed Forster's formulation as an IMU factor inside tightly coupled sliding-window BA and provided a procedure for estimating scale and gravity direction separately during initialization. Released as code, it became the conference VIO baseline from 2019 to 2022. When Ch.7's ORB-SLAM3 reported an average ATE of 0.043 m over the eleven EuRoC sequences, VINS-Mono was the comparison method at 0.110 m in the same table.

The third line is the direct family: VI-DSO (2018), Basalt (2019), and [DM-VIO (2022)](https://doi.org/10.1109/LRA.2021.3140129), covered in Ch.8. TUM's Cremers group placed Forster's inertial factor on top of DSO's photometric BA. DM-VIO added *delayed marginalization*. Premature marginalization before IMU initialization converges can lock in a wrong prior and cause long-term drift, so the method maintains two marginalization priors in parallel and merges them only after gravity and scale become observable.

---

## 7b.5 Observability — what cannot be seen

Visual-Inertial systems do not see everything.

Analyses by Huang's group from the early 2010s converged on one conclusion: the null space of an unanchored visual-inertial system is **four-dimensional**. It contains three dimensions of global position and one dimension of yaw around gravity. IMU and camera alone can never recover absolute coordinates or rotation about the gravity axis. GPS restores position; a magnetic field or external anchor restores yaw. Pure VIO cannot observe this four-dimensional subspace.

*Roll and pitch*, however, are observable because the accelerometer provides a vertical reference through gravity. Adding an IMU also resolves the monocular scale ambiguity identified in Ch.5.

Degenerate motion is harder. Global yaw remains unobservable regardless of motion. Insufficient parallax or variation in inertial motion can make depth, scale, and bias harder to distinguish. Hovering or driving straight at constant speed warrants checking for this lack of excitation. Takeoff, braking, and turning can add information, but no single maneuver guarantees a reliable scale estimate.

> 📜 **Prediction vs. outcome.** Forster et al. in TRO 2017 §IX named three directions: integrating time synchronization with online extrinsic calibration, validating the bias random-walk assumption under long-term operation, and extending to asynchronous sensors such as event cameras and rolling shutter. As of 2026, the first has been standardized as VINS-Mono, Kalibr, and OpenVINS put the time offset onto the state vector; the second holds for navigation-grade IMUs but remains affected by temperature and power-supply variation on consumer MEMS; the third has found one branch of the answer in Le Gentil's GP continuous-time preintegration. The predictions were largely on target, but instead of the single extension the authors sketched, the line split into three.

---

## 7b.6 The branch into continuous-time

At RSS 2021, Cédric Le Gentil and his advisor Teresa Vidal-Calleja at UTS (University of Technology Sydney) released [Continuous Integration over SO(3) for IMU Preintegration](https://roboticsproceedings.org/rss17/p075.pdf). Again in Sydney, only a few kilometers from Lupton's ACFR, they approached the same problem from another angle.

Forster's preintegration uses discrete time. It assumes piecewise-constant IMU measurements between samples and applies Euler integration. Fusing asynchronous sensors such as LiDAR or event cameras requires evaluating states between IMU sampling times. Asynchrony itself does not invalidate the piecewise-constant approximation, but makes accurate temporal interpolation important. Le Gentil instead modeled the IMU as a **Gaussian Process**, treating angular velocity as a continuous function. The state can then be evaluated at any time $\tau$, allowing asynchronous measurements to enter naturally. This direction intersects the B-spline, STEAM, and GPMP lineages.

---

## 7b.7 Terrain of borrowings

> 🔗 **Borrowed.** The skeleton that evaluates and optimizes an IMU factor on a factor graph is the [Dellaert GTSAM](https://gtsam.org/) tradition from Ch.6 unchanged. Forster's `ImuFactor` plugs into GTSAM's `NoiseModelFactor` interface and is optimized inside a single `Values` object alongside visual reprojection factors. The inheritance was of software structure, not of mathematics.

> 🔗 **Borrowed.** The practice of treating bias as a random walk comes from the Kalman-filter state-propagation convention Ch.4 recorded. Well before Lupton, the navigation community used a model that "puts the bias in the state and gives it small process noise," and in the preintegration era this was reinterpreted as the bias random-walk factor.

---

## 🧭 Still open

**Real-time detection of visual-inertial observability.** The four-dimensional null space and degenerate-motion table are theoretically settled, but runtime detection remains unfinished. The FEJ (First-Estimate Jacobian) line of Hesch, Li, and Huang preserves the null space at the linearization point, yet as of 2026 no broadly agreed method detects entry into and exit from a degenerate regime and feeds that information back to the control loop. When drone control and VIO estimation share compute resources, the controller may detect estimator failure too late.

**Unification of preintegration and continuous-time.** Forster's discrete increments and Le Gentil's continuous GP representation solve the same problem in different mathematical languages. When combining LiDAR, event cameras, and frame cameras, the representation that should underpin the estimator remains an engineering choice. B-spline continuous-time BA offers a partial answer, but most deployed systems still use Forster's discrete factor.

**Learning-based IMU bias models.** The bias random-walk assumption holds on navigation-grade IMUs, but consumer MEMS depart from it because of temperature hysteresis and power-supply transients. The TLIO and RoNIN line used LSTMs and Transformers to learn bias models for IMU-only odometry; more recent work models the bias distribution itself with conditional diffusion. How this approach fits inside a Forster factor, and how much of preintegration's mathematics remains when a learned model supplies the bias dynamics, is the next question.

---

Lupton's idea remained limited by Euler angles for six years. Forster moved it and its bias-Jacobian correction to SO(3); Le Gentil, again in Sydney, extended it into continuous time. Three generations of work sit behind one line in ORB-SLAM3, one in VI-DSO, and one in LIO-SAM. Ch.7c follows the continuous-time branch, while Ch.8 continues the visual lineage with direct methods (DSO and VI-DSO) that use Forster's preintegration factor.


---

# Ch.7c — When Time Must Flow Smoothly: Continuous-Time Trajectory

Ch.7b's preintegration compressed IMU measurements into a relative factor between discrete keyframes. That compression presumes discrete endpoints: to fold the hundred inertial samples between two keyframes into one factor, each endpoint must have a definite timestamp. The assumption is harmless when a camera shutter opens and closes globally once per frame. Asynchronous sensors break it.

In 2012, in Toronto, [Paul Furgale, Timothy Barfoot, and Gabe Sibley](https://asrl.utias.utoronto.ca/~tdb/bib/furgale_iros12.pdf) formalized the question in an IROS paper. In an image captured by a rolling shutter, each row is projected from a different pose in time. A vehicle travels several meters while a spinning LiDAR completes one rotation, and the IMU produces samples at 1 kHz while the camera runs at 30 Hz. Furgale, Barfoot, and Sibley represented pose as a function of time $t$ rather than a frame and chose the B-spline. That choice became the standard starting point for continuous-time trajectory estimation.

Ten years later, the Handbook placed this branch alongside manifolds as one of SLAM's "two fundamental tools." Discrete keyframes cover most visual-inertial systems; continuous-time trajectory estimation addresses sensors that do not fit that clock.

---

## 7c.1 Limits of discrete-time

Ch.7b's preintegration handles one mismatch: the IMU runs faster than the camera. It does not address four others.

First, rolling shutter. A consumer CMOS camera reads one frame from top to bottom over tens of milliseconds. In a fast-moving camera, the first and last rows are captured from different poses. This distortion falls outside the photometric-consistency model assumed by Ch.8's DSO and LSD-SLAM. The Cremers group therefore added a B-spline trajectory to [Basalt](https://arxiv.org/abs/1904.06504) in 2019.

Second, spinning LiDAR motion distortion. As Ch.17 notes, the Velodyne HDL-64E completes one rotation at 10 Hz. If a vehicle moves at 10 m/s during those 100 ms, the vehicle travels a total of 1 m during one scan, and each point is captured from a different pose along that interval. LOAM corrected the distortion indirectly inside the odometry loop; a continuous trajectory instead provides the pose at the instant each point was captured.

Third, event cameras. The DVS described in Ch.18 produces asynchronous events at μs granularity per pixel. Events have no frame, so [Mueggler et al. 2015](https://arxiv.org/abs/1502.00796) formulated event SLAM on an SE(3) B-spline trajectory.

Fourth, a high-rate IMU may be fused with several sensors running at different frequencies. When a system ingests a 200 Hz IMU, a 20 Hz camera, and a 10 Hz LiDAR, placing a discrete state node at every measurement time is impractical. The factor graph swells when the number of states grows with the number of measurements.

The four problems share one structure: measurement time $t_i$ is not controlled. Observations arrive asynchronously, and the estimator must know the pose at each arrival. A continuous-time representation separates measurement time, estimation time, and query time.

---

## 7c.2 Parametric spline: the Furgale line

Furgale, Barfoot, and Sibley chose the B-spline in 2012. The trajectory is written as a sum of basis functions, $\mathbf{p}(t) = \sum_k \Psi_k(t)\,\mathbf{c}_k$, with coefficients $\mathbf{c}_k$ as the optimization variables. Local support is the defining property: at any time $t$, only a handful of bases (usually four) are nonzero. Querying the pose at an arbitrary time $t_i$ therefore has constant cost and preserves factor-graph sparsity.

> 🔗 **Borrowed.** The mathematical skeleton of the B-spline comes from [de Boor's 1978 *A Practical Guide to Splines*](https://link.springer.com/book/10.1007/978-1-4612-6333-3). Furgale lifted that structure onto SE(3) and placed the coefficients as variable nodes in the factor graph, transplanting a tool from numerical analysis into SLAM optimization.

The trade-offs were clear. Closely spaced coefficients overfit, while wide spacing misses fast motion, and the choice depended on experience. A linear B-spline applied directly to SE(3) also produces interpolated poses outside the manifold.

In 2013, Oxford's [Steven Lovegrove et al.](https://www.roboticsproceedings.org/rss09/p11.html) proposed the cumulative B-spline. Rearranging the basis as a cumulative product rather than a sum, $T(t) = \prod_k \exp\bigl(\tilde\Psi_k(t) \log(T_k T_{k-1}^{-1})\bigr) \cdot T_0$, keeps each factor on the Lie group. This became a standard representation in later rolling-shutter, event-camera, and VIO papers. Basalt, [Mueggler's event SLAM](https://arxiv.org/abs/1502.00796), and [Kerl et al. 2015 dense rolling shutter VO](https://doi.org/10.1109/ICCV.2015.172) all used the cumulative B-spline.

The parametric spline remains common in real-time VIO and event systems because computation is light and the code is simple. Without a separate motion prior, smoothness in sparsely observed intervals depends on the basis and control points. Priors can be added to coefficients or derivatives; the GP-based branch instead starts by specifying a prior distribution over trajectories.

---

## 7c.3 SDE-based GP: the Barfoot line and STEAM

In 2014, the Barfoot group in Toronto opened a second branch with ["Batch Continuous-Time Trajectory Estimation as Exactly Sparse Gaussian Process Regression"](https://www.roboticsproceedings.org/rss10/p01.pdf). Barfoot, Tong, and Särkkä treated the trajectory as a Gaussian process rather than a basis sum. A kernel $\mathcal{K}(t, t')$ defines the prior, and the posterior remains a conditional Gaussian when observations arrive.

A dense GP has one problem: with $N$ observations, inverting the kernel matrix $K$ costs $O(N^3)$. Barfoot, Tong, and Särkkä identified a family of kernels that avoids this cost. When the trajectory is the solution of a linear time-invariant stochastic differential equation $\dot{\mathbf{x}}(t) = A\mathbf{x}(t) + L\mathbf{w}(t)$, the inverse $K^{-1}$ of its kernel has a block-tridiagonal structure. In factor-graph terms, binary factors connect only consecutive state nodes, not distant ones.

> 🔗 **Borrowed.** Expressing an SDE-derived GP motion prior as a factor graph follows the SDE-GP connection in [Särkkä's 2013 *Bayesian Filtering and Smoothing*](https://users.aalto.fi/~ssarkka/pub/cup_book_online_20131111.pdf), which the Barfoot group brought into SLAM. The Rasmussen-Williams GP textbook writes the kernel in closed form, but real-time SLAM needs a sparse inverse. Särkkä's SDE representation supplied the bridge.

The result was **STEAM** (Simultaneous Trajectory Estimation and Mapping). At RSS 2015, [Sean Anderson and Barfoot 2015, "Full STEAM Ahead"](https://www.roboticsproceedings.org/rss11/p45.pdf) formalized STEAM with a constant-velocity prior. It augments the state with pose $\mathbf{p}(t)$ and velocity $\mathbf{v}(t)$, with pose following from the white-noise integral of velocity. Anderson tightened the sparsity proof that same year, and it became the foundation of the Barfoot group's later continuous-time papers.

STEAM's second advantage was GP interpolation. With only a small number of control poses, the estimator can query any intermediate pose as the posterior mean. Even when a spinning LiDAR captures 10,000 points at 10,000 instants within one scan, the model uses only one control point per scan. The number of estimated states can remain much smaller than the number of observations. Evaluating and accumulating the observation residuals still requires computation.

In 2019, Tang and Barfoot's [open-source STEAM release](https://github.com/utiasASRL/steam) gave academia and industry a directly usable library. The same year, the Dellaert group's GTSAM received a GP continuous-time factor in contrib. The two paths had converged.

---

## 7c.4 Continuous-time on the Lie group

Whether parametric or nonparametric, SLAM needs a trajectory on SE(3). Lifting a Euclidean spline or GP onto the group is not straightforward. The common approach works in the tangent space: interpolate linearly there, then return the result to the manifold with the exponential map.

On the B-spline side, [Sommer, Demmel et al. 2020, "Efficient Derivative Computation for Cumulative B-Splines on Lie Groups"](https://arxiv.org/abs/1911.08860) derived the SE(3) cumulative-spline Jacobian in closed form. The CVPR paper supplied a standard B-spline trajectory formulation with real-time derivatives for rolling-shutter VIO, event cameras, and visual-inertial systems. Basalt and later work from the Cremers group used this result.

On the GP side, Anderson and Barfoot proposed a "local variable" construction. Near each control pose $T_k$, they define a local perturbation $\xi_k(t) = \log(T(t)\,T_k^{-1})$ and run the GP on it. A GP is difficult to define directly on the global manifold, but a Euclidean GP can be defined in the tangent space around each control point. Crossing between control points introduces an adjoint, the same Lie-group operation that appears in Ch.7b's on-manifold preintegration. From 2015 onward, both tools used a common Lie-group grammar.

> 🔗 **Borrowed.** [Anderson-Barfoot 2015 ICRA](https://doi.org/10.1109/ICRA.2015.7138984) systematically developed the use of a GP in a Lie-group local variable. Several later continuous-time LiDAR and VIO papers used the same construction: run a GP between two consecutive control points and apply the adjoint when crossing between them.

One difference between the spline and GP implementations compared here is how they specify the motion prior. Spline coefficients can be estimated directly or given priors, as can their derivatives. A GP carries an SDE-derived prior, such as constant velocity or white jerk. Where observations are sparse, the prior supports the GP, while the spline relies on neighboring observations. Attempts to combine them (Johnson et al. 2020) have appeared, but the choice remains application-dependent.

---

## 7c.5 The line descends to applications: LiDAR and VIO

The range of applications expanded beyond early calibration work. Around 2022, continuous-time became a common solution in three areas.

First, LiDAR motion distortion. Paris's [Pierre Dellenbach et al. 2022, "CT-ICP"](https://arxiv.org/abs/2109.12979) parameterized each scan with two poses (a "start pose" and an "end pose") and interpolated linearly between them. Despite its simple model, CT-ICP beat prior LOAM and FAST-LIO accuracy on the KITTI, NCLT, and Newer College benchmarks. The same year, Toronto's [Keenan Burnett et al. 2022, "Are We Ready for Radar to Replace Lidar?"](https://arxiv.org/abs/2206.05432) and [STEAM-ICP](https://github.com/utiasASRL/steam_icp) applied GP-based continuous time to the Aeva FMCW LiDAR. The sensor reports Doppler velocity with each point, which maps directly to STEAM's velocity state. Without a continuous-time representation, that information could not enter the estimator directly.

Second, rolling-shutter VIO. Basalt, the [Cremers group rolling-shutter VO](https://doi.org/10.1109/CVPR.2016.71), and follow-ups to [OKVIS](https://doi.org/10.1177/0278364914554813) query each image row's capture time on a B-spline trajectory. Rather than assuming a global shutter, they model the rolling shutter directly.

Third, event cameras. After the 2010s difficulties described in Ch.18, several lines of event SLAM in the 2020s used continuous-time trajectories. Each event's μs timestamp is queried against a B-spline or GP to obtain the pose at that instant, and event-image consistency supplies the residual. Continuous-time trajectories fit event cameras because neither assumes frames.

> 🔗 **Borrowed.** CT-ICP is a combination that lays intra-scan continuous-time linear interpolation on top of a point-to-plane objective from the ICP family descended from [Besl and McKay 1992 ICP](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf). Classic registration and Furgale's continuous-time spirit met inside one system, thirty years apart.

---

## 📜 Prediction vs. outcome

> In the Future Work of their 2012 IROS paper, Furgale, Barfoot, and Sibley wrote two expectations. One was that "continuous-time representation will become the natural language for unifying rolling shutter and high-rate IMU sampling"; the other was "follow-up work proving compatibility with a sparse factor graph." Both were realized within a decade. Barfoot, Tong, and Särkkä 2014 completed the sparse GP proof, while rolling-shutter VIO and event SLAM of the 2020s use the cumulative B-spline as their standard representation. The authors did not anticipate one development. In 2012, the implicit division of labor placed discrete-keyframe ORB-SLAM in the mainstream and continuous time with specialty sensors. Development also moved in the opposite direction: when Burnett released STEAM-ICP using Doppler velocity from an FMCW LiDAR, continuous time became a way to exploit sensor-specific signals.

---

## 🔗 Borrowed (summary)

Three further lineages underpin the chapter.

Särkkä's SDE-GP textbook anchored the equations of Barfoot, Tong, and Särkkä 2014. De Boor's 1978 spline text supplied Furgale 2012 with its basis functions, and Anderson and Barfoot's 2015 local-variable technique brought GPs onto Lie groups. Continuous-time trajectory estimation brings numerical analysis, probability theory, and Lie-group differential geometry together within SLAM.

---

## 🧭 Still open

**Learning-based continuous-time prior.** The motion prior that an SDE provides embeds physical assumptions such as constant-velocity or white-jerk. Real driving, walking, and UAV trajectories often violate these assumptions. In 2023-2024, attempts appeared to learn data-driven priors with neural SDE or neural ODE and plug them into the continuous-time factor graph. A system that layers a learned prior while keeping real-time sparse structure is still at the validation stage.

**Integration of VIO and continuous-time.** Ch.7b's preintegration remains the dominant formulation in keyframe-based VIO. As of 2026, no consensus exists on whether continuous-time trajectories should replace preintegration or coexist with it in a hybrid. Le Gentil's [GP-augmented preintegration line](https://arxiv.org/abs/2007.04144) connects the two, but deployed systems such as ORB-SLAM3 and VINS-Fusion still rely on discrete-time preintegration.

**Online sliding window for edge deployment.** STEAM- and B-spline-based systems slow as control points accumulate. Marginalizing past control points while preserving the consistency of the continuous-time posterior remains technically difficult. Continuous-time SLAM cannot become a long-lived standard on embedded platforms such as cars and drones without solving this problem.

---

Ch.7b optimized discrete-time preintegration; this chapter followed the continuous-time alternative. The two tools need not compete. Since 2024, systems have placed an IMU preintegration factor and a continuous-time LiDAR factor side by side in one SLAM estimator. Ch.8 returns to the visual line, where DSO and VI-DSO use the Forster factor and the direct photometric approach develops separately from both preintegration supplements.

# Ch.8 — The Direct Lineage: From DTAM to DSO

Richard Newcombe was Andrew Davison's doctoral student. After seeing MonoSLAM's 30-landmark ceiling firsthand at Imperial College, he took the opposite approach in 2011: use every pixel. Davison had demonstrated real-time operation with the EKF premise that tracking a few points was sufficient. With a single GPU, Newcombe showed that a system could also operate in real time on the full image. DTAM descended directly from MonoSLAM while reversing its methodological choice.

The ORB-SLAM lineage in Ch.7 extracted features first and tracked only those features. Harris corners and ORB descriptors reduced an image to a few hundred points; the remaining pixels were discarded. Direct methods use pixel-intensity differences as measurements rather than geometric errors between matched features. They include dense methods using all pixels and sparse methods selecting only a subset.

In Munich that same year, Daniel Cremers was pursuing a related approach. He brought the variational machinery of computer vision, including Gauss-Newton image alignment and the formalism of optical flow, into a complete SLAM system. Cremers's student Jakob Engel introduced LSD-SLAM in 2014 and DSO in 2016. At different sampling densities, both methods compared pixel intensities directly instead of extracting features.

---

## 1. Every Pixel: DTAM

[Newcombe, Lovegrove & Davison 2011. DTAM](https://doi.org/10.1109/ICCV.2011.6126513), presented at ICCV 2011, stands for "Dense Tracking and Mapping in Real-Time." It performs tracking and mapping simultaneously, using every pixel while operating in real time.

The system has two parts. The tracking stage performs photometric alignment by comparing the entire current frame with a cost volume. It extracts no features and matches no descriptors, minimizing only pixel-intensity differences. The mapping stage estimates a depth map through multi-baseline stereo and maintains a smooth, dense 3D model with total variation regularization.

$$E(\mathbf{u}) = \sum_{i} \rho\left( I_i\bigl(\pi(KT_i\mathbf{p}(\mathbf{u}))\bigr) - I_r\bigl(\pi(\mathbf{p}(\mathbf{u}))\bigr) \right) + \lambda \,\text{TV}(\mathbf{u})$$

Here $\mathbf{u}$ is the inverse depth map, $\mathbf{p}(\mathbf{u})$ the 3D point obtained by back-projecting $\mathbf{u}$, $K$ the camera intrinsic matrix, $T_i$ the rigid body transform of frame $i$ relative to the reference frame, $\pi$ the perspective projection, $\rho$ the Huber loss, and $\text{TV}(\mathbf{u}) = \|\nabla \mathbf{u}\|_1$ the total variation regularizer. Running this optimization in real time requires a GPU. DTAM used a single Nvidia GTX 480, the commodity configuration described in the paper's §3.

> 🔗 **Borrowed.** DTAM's dense volumetric approach drew partly on depth-camera research, particularly the TSDF formulation of [Curless & Levoy 1996](https://doi.org/10.1145/237170.237269), but applied it to a monocular camera. [KinectFusion](https://doi.org/10.1109/ISMAR.2011.6092378) (2011, ISMAR), also led by Newcombe, developed the corresponding depth-sensor approach.

A video of an entire indoor scene being reconstructed in real time appeared on YouTube shortly after the 2011 ICCV talk and received tens of thousands of views. The limitations were equally visible: the system required a GPU, was fragile under lighting changes, and could not scale to large outdoor environments.

## 2. Tracking the Edges: LSD-SLAM

[Engel, Schöps & Cremers 2014. LSD-SLAM](https://doi.org/10.1007/978-3-319-10605-2_54) replaced DTAM's dense formulation with a semi-dense one and eliminated its dependence on a GPU. "Large-Scale Direct Monocular SLAM" tracks only pixels whose gradient magnitude exceeds a threshold. It ignores flat wall regions and retains pixels near edges with sufficient gradient. Rather than using a corner detector, it selects pixels solely by the strength of their intensity gradient.

The tracking stage performs direct image alignment in SE(3). It warps the current frame onto a keyframe and minimizes the photometric residual with Gauss-Newton optimization. The map is keyframe-based, and each keyframe carries its own semi-dense depth map. A pose graph maintains connections between keyframes. Loop closure finds candidates through appearance-based relocalization and verifies them with a depth-consistency check.

> 🔗 **Borrowed.** Gauss-Newton photometric registration is a classic of the image alignment field. The [Lucas & Kanade 1981](https://www.ijcai.org/Proceedings/81-2/Papers/017.pdf) tracker and its inverse compositional reformulation ([Baker & Matthews 2004](https://doi.org/10.1023/B:VISI.0000011205.11775.fd)) are the direct ancestors of LSD-SLAM's frontend. The Cremers group transplanted the language of the variational image-processing community into the entire SLAM pipeline.

LSD-SLAM ran in real time on a CPU. Its use of keyframes and pose-graph optimization superficially resembled PTAM's tracking-and-mapping split, but the underlying measurement differed: LSD-SLAM used pixel intensity rather than binary descriptors such as ORB or BRIEF.

LSD-SLAM also released footage of operation in large outdoor environments. A demo in which a semi-dense map was built while riding a bicycle for tens of meters showed that the direct approach could scale. On the KITTI benchmark, it was competitive with the leading feature-based methods of the time.

Lighting changes remained a serious problem. Entering a tunnel, facing backlight through a window, or encountering a sudden flash violated photometric consistency and could destabilize the system immediately.

## 3. Sparse Direct Perfected: DSO

[Engel, Koltun & Cremers 2018. DSO (PAMI)](https://doi.org/10.1109/TPAMI.2017.2658577) first appeared on arXiv in 2016. "Direct Sparse Odometry" is sparser than LSD-SLAM and uses far fewer pixels than DTAM, while applying a more thorough photometric calibration.

The system selects roughly 2,000 candidate pixels per keyframe, then keeps about 2,000 active points across all active frames combined in the optimization. Candidate count and active-point count are distinct. Selection considers both image coverage and gradient strength relative to the surroundings. DSO performs sliding-window bundle adjustment over the active points, optimizing camera pose, inverse depth, and affine brightness parameters $(a_i, b_i)$. It marginalizes frames that leave the window and uses the Schur complement to eliminate variables and limit the size of the remaining window problem. Total computation depends on window size, pixel count, and iteration count.

DSO separates the camera's photometric model into three layers. First, prior calibration corrects vignetting, the falloff in brightness toward the edges of the lens. Second, it inverts the camera response function, or gamma curve, in advance to convert the sensor's nonlinear light measurements into a linear intensity domain. Third, it uses exposure time $t_i$ as input metadata and estimates the remaining affine brightness changes $(a_i, b_i)$ online:

$$E_{pj} = \sum_{\mathbf{p} \in \mathcal{N}_p} w_{\mathbf{p}} \left\| \left( I_j\!\left[\mathbf{p}'\right] - \frac{t_j e^{a_j}}{t_i e^{a_i}} I_i[\mathbf{p}] - \left(b_j - \frac{t_j e^{a_j}}{t_i e^{a_i}} b_i\right) \right) \right\|_\gamma$$

Here $t_i, t_j$ are exposure times, $(a_i, b_i)$ and $(a_j, b_j)$ are the affine brightness parameters of each frame (gain and bias), and $\|\cdot\|_\gamma$ is the Huber loss. Photometric calibration corrects vignetting during preprocessing, and the residual above is applied to the corrected intensities. DSO was the first direct SLAM system to divide exposure variation, vignetting, and the response curve between a separate calibration stage and real-time optimization variables.

> 🔗 **Borrowed.** The formal basis of photometric camera calibration traces to the HDR-recovery work of [Debevec & Malik 1997](https://doi.org/10.1145/258734.258884). DSO likewise uses response-corrected intensities, but calibrates the response function in advance. The per-frame affine brightness parameters are the quantities adjusted online.

On the TUM monocular dataset, DSO was reported to outperform ORB-SLAM2 across several sequences. In feature-poor environments, such as indoor corridors with large flat walls, DSO achieved a lower ATE than ORB-SLAM2. These results supported the claim that photometric methods retain information discarded by feature extraction.

> 📜 **Prediction vs. outcome.** DSO required prior photometric calibration, and follow-up work soon addressed that dependency. In 2018, Bergmann, Wang, and Cremers proposed [online photometric calibration](https://doi.org/10.1109/LRA.2017.2777002), jointly estimating exposure time, the response function, and vignetting attenuation while the system ran. On the evaluated auto-exposure videos, the paper reported real-time calibration and VO accuracy on par with pre-calibrated input. This follow-up directly answered DSO's dependence on prior photometric calibration.

> 📜 **Prediction vs. outcome.** DTAM achieved real-time dense SLAM on a single GPU, leaving broader access to dense reconstruction as a natural next step. Pure monocular dense reconstruction did not become deployable in real time until NeRF and 3DGS emerged in the 2020s. KinectFusion, also led by Newcombe, instead achieved GPU-based dense reconstruction with an RGB-D depth sensor in 2011 by changing the sensor rather than solving the monocular problem.

---

## 4. VI-DSO and the Lineage Extended

At ICRA 2018, von Stumberg, Usenko, and Cremers presented [VI-DSO](https://doi.org/10.1109/ICRA.2018.8462905), which combined DSO with an IMU. Inertial measurements could support pose tracking during rapid lighting changes, a major failure mode for direct photometric methods. The IMU could also resolve the scale ambiguity of a monocular camera.

VI-DSO adds an IMU preintegration factor to DSO's windowed photometric bundle adjustment. The IMU preintegration scheme was borrowed from [Forster et al.'s 2017 paper](https://doi.org/10.1109/TRO.2016.2597321). This recovered scale and improved robustness under extreme lighting.

Follow-up work from the Cremers group, [Basalt](https://arxiv.org/abs/1904.06504) (2019) and [DM-VIO](https://doi.org/10.1109/LRA.2021.3140129) (2022), continued in the same direction. Both paired a direct photometric frontend with a tightly coupled inertial backend. This lineage developed in parallel with feature-based VIO systems such as VINS-Mono and OpenVINS, each with its own ecosystem.

> 🔗 **Borrowed.** VI-DSO directly uses the manifold preintegration formulation of [Forster et al. 2017. On-Manifold Preintegration (IEEE TRO)](https://doi.org/10.1109/TRO.2016.2597321), placing Forster's inertial layer above DSO's photometric layer.

---

## 5. Limits of the Direct Method

Direct methods use image intensity itself in the residual rather than features summarized by descriptors. Their sampling differs: DTAM uses dense photometric information, while LSD-SLAM uses semi-dense regions with intensity gradients. DSO selects pixels with sufficient gradient relative to their surroundings and spreads them across the image; where strong gradients are absent, it lowers the threshold to exploit weaker intensity variations. This can retain information where corners are scarce, but on nearly constant-intensity surfaces the residual is insensitive to pose changes.

As of 2026, however, most deployed systems remain feature-based for several reasons.

Direct methods depend on photometric calibration. The vignetting correction, response-curve correction, and exposure control assumed by DSO are not readily available from a consumer camera. Smartphone cameras apply HDR fusion, auto-exposure, and real-time white balance internally without exposing that pipeline to the user. These processes violate DSO's photometric assumptions.

Lighting changes remain difficult as well. Under auto-exposure or backlight, inter-frame brightness can change sharply and violate the direct method's assumption of photometric consistency. DSO's affine brightness model can absorb only gradual drift, so a passing cloud outdoors or a flickering fluorescent tube indoors remains a leading cause of tracking failure.

Although DSO beat ORB-SLAM2 on sequences from controlled datasets, engineers deploying systems on robots often chose ORB-SLAM. It runs on many camera models without separate photometric calibration and can continue working after a camera change. DSO requires vignetting and response-curve calibration for each camera.

Learned features such as [SuperPoint](https://arxiv.org/abs/1712.07629) (2018) and [LightGlue](https://arxiv.org/abs/2306.13643) (2023) also weakened the direct method's central criticism that features discard information. They retain more information than handcrafted descriptors while preserving the practical advantages of descriptor matching.

<!-- DEMO: photometric_calibration_demo.html -->

---

## 🧭 Still open

**Direct tracking under rapid lighting change.** The direct method assumes that a scene's brightness distribution remains stable across frames, an assumption violated by auto-exposure, strong backlight, and tunnel-to-outdoor transitions. VI-DSO's IMU assistance partially mitigates the problem, but no complete solution dynamically estimates the lighting model itself. Learning-based photometric correction is being explored as an alternative but is not yet deployable in real time.

**The shared weakness on textureless surfaces.** Feature-based methods fail on walls without corners, while the photometric residual in direct methods becomes largely insensitive to pose changes on surfaces without gradients. Both approaches are weak in indoor corridors, large warehouses, and homogeneous outdoor terrain. Semi-dense LSD-SLAM retained only pixels with a gradient, but it did not resolve the degeneracy that arises when those pixels are too sparsely distributed.

**A possible transition to a learned photometric model.** Current direct SLAM systems represent the photometric model with a simple affine brightness correction or a fixed camera response function. Neural radiance field research instead represents scene appearance with a neural network. Whether such a model can become part of real-time direct SLAM, and where that would place the boundary between direct and learned methods, remain open questions as of 2026.

A parallel approach had already appeared in 2011 through Newcombe's KinectFusion: replace the monocular camera with a different sensor. By measuring depth directly, an RGB-D camera enabled dense reconstruction without relying on brightness consistency. Direct methods tried to model photometric consistency, whereas RGB-D systems removed that assumption by changing the measurement source.

# Ch.9 — Dense/RGB-D: From KinectFusion to BundleFusion

When Richard Newcombe of Imperial College London presented KinectFusion at ISMAR in November 2011, its demo video drew more attention than the paper. A single handheld Kinect reconstructed an entire room as a 3D mesh in real time. DTAM, which Newcombe had released earlier that year, had pursued the same goal with a monocular camera; KinectFusion achieved it with an RGB-D sensor. The system combined the TSDF representation devised by Curless and Levoy for graphics in 1996, the ICP tracker introduced to robotics by Besl and McKay in 1992, and Microsoft's $150 Kinect sensor from 2010. Their combination began a brief, intense period of dense SLAM research. Davison's MonoSLAM (Ch.5) had used real-time, CPU-only processing to track sparse landmarks from a monocular camera. Newcombe's DTAM (Ch.8) then used a GPU for dense reconstruction through direct photometric optimization, while KinectFusion used the GPU with an RGB-D depth stream.

---

## 9.1 Dense reconstruction before Kinect

Dense 3D reconstruction was possible before 2011, but not in *real time*.

Offline pipelines could merge point clouds acquired by stereo or structured-light scanners, but indoor scanning rigs cost hundreds of thousands of dollars and saw little use outside laboratories. The SLAM community was already obtaining practical results from sparse landmarks, while dense reconstruction remained largely a graphics problem.

[Curless and Levoy's 1996 SIGGRAPH paper, "A Volumetric Method for Building Complex Models from Range Images"](https://graphics.stanford.edu/papers/volrange/volrange.pdf) introduced the **TSDF (Truncated Signed Distance Function)** to this graphics pipeline. The method partitions 3D space into a uniform voxel grid and accumulates at each voxel the signed distance to the nearest surface. Moving from the sensor toward the surface, the sign convention assigns a positive value to the free space in front of the surface and a negative value to the solid behind it. Truncation clips the absolute value at a threshold $t$, giving $\text{TSDF}(x) = \text{clip}(d(x), -t, +t)$. Each incoming depth frame updates the value by a weighted average, reducing noise and sharpening the surface over time. Marching cubes then extracts the surface at the TSDF's zero-crossing.

The method was accurate, but the voxel grid consumed substantial memory, and the available hardware could not update it in real time. For the next fifteen years, Curless and Levoy's paper remained primarily part of the graphics literature.

During those fifteen years, GPUs entered the GPGPU era and Kinect appeared.

---

## 9.2 KinectFusion and TSDF

Microsoft released Kinect for the Xbox 360 at about $150 in 2010. The sensor measured depth through structured light and streamed VGA-resolution depth maps at 30 Hz. Its precision was below that of research-grade ToF (Time-of-Flight) cameras, but its price was also far lower. Hackers responded first: open-source drivers appeared within weeks of the launch, followed by research applications.

Newcombe had by then moved to Microsoft Research Cambridge, where he was developing GPU-based dense SLAM with Shahram Izadi's team. They already had the outline of a pipeline when Kinect launched, and its depth stream supplied the remaining input. The result, presented at ISMAR 2011, was [Newcombe et al. 2011. KinectFusion](https://doi.org/10.1109/ISMAR.2011.6092378).

> 🔗 **Borrowed.** KinectFusion's core representation, the TSDF, was devised by Curless & Levoy (1996) for offline 3D scanning. Newcombe's team made it real-time via GPU parallel voxel updates.

The pipeline has four stages.

First, depth preprocessing denoises the raw depth map with a bilateral filter and computes surface normals.

Second, ICP tracking aligns the current frame's point cloud with the virtual surface ray-cast from the previous TSDF. A point-to-plane variant of **ICP (Iterative Closest Point)** from [Besl & McKay (1992)](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf) runs thousands of iterations on the GPU. Its output is the camera's 6-DoF pose.

The point-to-plane ICP objective transforms the current frame's point $\mathbf{p}_i$ by $T = (R, \mathbf{t})$ and matches it to $\hat{\mathbf{p}}_i$ on the ray-cast surface, whose normal is $\hat{\mathbf{n}}_i$. It then minimizes

$$E(R, \mathbf{t}) = \sum_i \bigl(\hat{\mathbf{n}}_i^\top (R\,\mathbf{p}_i + \mathbf{t} - \hat{\mathbf{p}}_i)\bigr)^2$$

Unlike the original Besl-McKay point-to-point cost ($\|R\mathbf{p}_i + \mathbf{t} - \hat{\mathbf{p}}_i\|^2$), this objective measures only the error along the normal and is therefore less sensitive to motion along the surface. With the small-rotation approximation $R \approx I + [\boldsymbol{\omega}]_\times$, $E$ becomes a linear least-squares problem in the 6-DoF vector $(\boldsymbol{\omega}, \mathbf{t})$. The GPU solves it through parallel reduction.

> 🔗 **Borrowed.** KinectFusion's tracking stage directly inherits ICP from Besl & McKay (1992), applying a classical robotics technique at GPU-scale density.

Third, TSDF integration projects the depth map into the voxel grid at the estimated pose and updates the TSDF values. The paper's main configuration uses a 512³ voxel grid covering a room-scale volume about 3 m on a side (§4.2, Fig. 13).

Fourth, surface rendering finds the TSDF's zero-crossing by ray marching to produce vertex and normal maps of the surface. The result becomes the reference surface for the next ICP step.

Newcombe presented the monocular dense SLAM system DTAM in the same year. The two projects were closely related: DTAM used the GPU to optimize monocular photometric consistency, while KinectFusion used it for depth integration. Several researchers worked on both.

> 🔗 **Borrowed.** The same researchers presented KinectFusion and DTAM in the same year. They share the use of a GPU for dense processing, but DTAM's photometric optimization and KinectFusion's depth alignment and TSDF fusion also differ in map representation and objective.

The 512³ TSDF updated at 30 Hz, and a single indoor room could be reconstructed as a dense mesh within minutes. Within a fixed room-scale volume, dense model-to-frame ICP used many surface measurements and produced low tracking drift. The model was still built from earlier pose estimates, however, and was not an absolute reference surface.

A 512³ voxel grid covers only a fixed spatial extent; once the camera leaves the room, voxels saturate or overwrite one another. The system had no loop closure, and Kinect's IR structured light did not work in sunlight. Outdoor use was therefore outside its scope from the outset.

---

## 9.3 Kintinuous — rolling volume

Soon after KinectFusion appeared, Whelan at Imperial College addressed this limitation by moving the fixed-size TSDF volume with the camera.

In July 2012, at the RSS workshop (RGB-D: Advanced Reasoning with Depth Cameras, Sydney), [Whelan et al. presented Kintinuous](https://www.cs.cmu.edu/~kaess/pub/Whelan12rssw.pdf), which introduced a "rolling TSDF volume." As the camera approached the boundary of the volume, slices on the far side were extracted as mesh and released, while new slices were attached in front. Memory stayed constant while the camera could move indefinitely.

A demo that traversed an entire indoor corridor exceeded KinectFusion's fixed spatial range, but loop closure was still missing. After a long corridor traversal returned to its origin, the mismatch between the two ends remained unresolved. This misalignment limited global map consistency independently of the level of surface detail.

---

## 9.4 ElasticFusion: Surfels and non-rigid deformation

After Kintinuous, Whelan replaced TSDF voxels with surfels.

A **surfel (surface element)** is a point with a position, normal, radius, and color. In computer graphics, [Pfister et al. (2000)](https://www.merl.com/publications/docs/TR2000-10.pdf) proposed the concept as a rendering representation. Unlike a regular voxel grid, a surfel structure follows the observed surface.

> 🔗 **Borrowed.** ElasticFusion adapted the surfel rendering technique of Pfister et al. (2000) as a SLAM map representation.

[Whelan et al. 2016. ElasticFusion](https://doi.org/10.1177/0278364916669237) combined a surfel-based dense map with loop closure through *non-rigid deformation*.

Loop closure had been difficult in earlier dense SLAM systems because updating a global mesh or voxel grid to satisfy a loop-closure constraint was expensive. ElasticFusion connected the surfel set to a deformation graph. When it detected a loop closure, it deformed the graph to distribute the error across the entire map, producing a non-rigid correction at the surfel-map level.

Concretely, each node $g_k$ of the deformation graph carries a position $\mathbf{v}_k$ and a rotation $R_k$ and translation $\mathbf{t}_k$. A surfel $s$ lies within the influence of its $K$ nearest nodes, and the surfel's deformed position is computed as

$$\tilde{\mathbf{p}}_s = \sum_{k \in \mathcal{N}(s)} w_k \bigl(R_k (\mathbf{p}_s - \mathbf{v}_k) + \mathbf{v}_k + \mathbf{t}_k\bigr)$$

The weight $w_k$ decreases with distance. When a loop-closure constraint is added, Gauss-Newton optimizes the graph nodes' $(R_k, \mathbf{t}_k)$ to distribute the error globally. The method can therefore correct the entire dense map consistently without rebuilding a TSDF from scratch.

The ElasticFusion paper reported strong indoor reconstruction results on the ICL-NUIM synthetic dataset. Sequences kt0·kt1·kt2 recorded ATE RMSE below 1.4 cm, with kt0·kt1 at 0.9 cm; kt3, in which global loop closure activates, was an unusually large exception. These figures apply to the paper's ICL-NUIM setting rather than to KITTI or TUM RGB-D.

---

## 9.5 BundleFusion: offline-SfM quality, online

In 2017, Dai, Nießner, Zollhöfer, Izadi, and Theobalt published [Dai et al. 2017. BundleFusion](https://doi.org/10.1145/3072959.3054739) in ACM Transactions on Graphics. KinectFusion and its successors had sought higher quality while preserving real-time operation. BundleFusion instead devoted extensive GPU computation to running SfM-grade bundle adjustment within an online system.

BundleFusion used hierarchical optimization. At the fastest layer, dense depth alignment between the current and previous frames provides an initial pose. The next layer corrects it through sparse frame-to-frame alignment with SIFT features. At the third layer, hierarchical global bundle adjustment re-optimizes the poses of accumulated frames, including earlier poses. This "retroactive pose correction" sought to approach online the result that an offline SfM pipeline obtains by aligning all data after collection. The system back-projects updated pose sequences into the TSDF for reintegration, preventing tracking errors from remaining embedded in the map.

Dai's team reported better results than ElasticFusion on TUM RGB-D. Its visual reconstruction quality approached that of the offline COLMAP pipeline by the standards of the time.

> 📜 **Prediction vs. outcome.** BundleFusion claimed real-time online global bundle adjustment at "unprecedented speed," proposing a way to bring offline SfM quality into online operation. GPU performance continued to increase, but from 2021 one major research path instead used COLMAP for camera poses and NeRF for scene representation. This was less a direct successor to online TSDF mapping than a turn toward novel-view synthesis and neural scene representation.

---

## 9.6 Co-evolution of hardware and algorithm

The six years from KinectFusion to BundleFusion reflect changes in both algorithms and hardware.

The first-generation Kinect used structured light. Its depth precision was a few millimeters at meter-scale range, but sunlight obscured the IR pattern. Kinect 2, released in 2013, switched to ToF, improving both precision and dynamic range. Intel's RealSense series followed. As sensor options expanded, algorithms could make different assumptions about depth quality, and researchers explored methods that either exploited lower noise or tolerated higher noise.

The CUDA ecosystem also matured. Between KinectFusion in 2011 and BundleFusion in 2017, GPU throughput and memory performance also improved. Any numerical comparison requires specifying the GPU models and arithmetic precision. The increasingly expensive real-time optimization in Whelan's ElasticFusion and Dai's BundleFusion depended on this hardware progress as well as on algorithm design.

Had Kinect been priced like research instrumentation rather than a consumer device, this line of work would probably have spread more slowly. A mass-market sensor helped set its pace.

> 📜 **Prediction vs. outcome.** The spatial range, drift, and outdoor limitations of KinectFusion's fixed 512³ volume shaped the research that followed. Kintinuous, ElasticFusion, and BundleFusion addressed volume extension in turn. Outdoor operation followed a different path because sunlight obscures IR structured-light patterns. Early Kinect-based dense SLAM remained largely indoors, while LiDAR became a main sensor for outdoor dense mapping. This limitation does not apply uniformly to every RGB-D sensing technology.

---

## 9.7 Why dense-only systems receded

Between 2011 and 2017, dense RGB-D SLAM appeared likely to become the main direction of Visual SLAM, but it did not.

Sparse backends continued to dominate. Practical SLAM systems after 2015, represented by [ORB-SLAM2](https://arxiv.org/abs/1610.06475) and [VINS-Mono](https://arxiv.org/abs/1708.03852), did not use dense maps by default. Several constraints reinforced this choice. A 512³ TSDF requires more than 512 MB, a substantial cost for mobile and embedded systems. [Voxblox](https://arxiv.org/abs/1611.03631), which stores TSDF values in hashed blocks, and [OctoMap](https://www.hrl.uni-bonn.de/papers/wurm10octomap.pdf), which stores occupancy probabilities in an octree, reduced memory use with different map representations but did not match sparse representations in efficiency. Real-time dense processing also required a GPU, making a KinectFusion-grade pipeline difficult to run on an autonomous vehicle's embedded processor or a lightweight drone platform. Kinect's IR depth sensing also failed outdoors, while commercially important applications such as autonomous driving and drones operated largely in outdoor environments.

During the same period, dense map data structures extended KinectFusion's fixed 512³ volume in several directions. [Museth's VDB (2013)](https://doi.org/10.1145/2487228.2487235) combined block hashing with an internal tree, leaving sparse regions empty while refining only the neighborhood of a surface. Released as OpenVDB, it became a major infrastructure for large sparse volumetric data and provides a useful comparison with the nvblox lineage in Ch.17. [Reijgwart et al. (2023)'s wavemap](https://arxiv.org/abs/2306.08125) compressed occupancy with a wavelet transform to adjust the trade-off between resolution and memory. Ramos and Ott pursued continuous-function representations. [O'Callaghan and Ramos (2012)'s GPOM (Gaussian Process Occupancy Map)](https://doi.org/10.1177/0278364911435991) used Gaussian Process regression to relate depth measurements and assign probabilities even to unmeasured voxels. [Ramos and Ott (2016)'s Hilbert Map](https://doi.org/10.1177/0278364916684382) learned Hilbert-space features with logistic regression to provide streamable probabilistic occupancy. [Behley and Stachniss (2018)'s SuMa](https://www.ipb.uni-bonn.de/wp-content/papercite-data/pdf/behley2018rss.pdf) adapted ElasticFusion's indoor RGB-D surfel representation to outdoor LiDAR, producing a surfel-based SLAM system that operated on KITTI (→ Ch.17). These approaches extended dense mapping from a single room to outdoor and city-scale environments while incorporating probabilistic uncertainty.

After NeRF appeared around 2020, high-quality dense reconstruction shifted toward NeRF and 3D Gaussian Splatting. The map representation changed, but measured RGB-D depth continued to constrain both tracking and the learned map geometry.

The period of dense RGB-D SLAM was brief, but its components persisted. TSDF representations entered occupancy mapping for autonomous driving, and ICP became a standard tracking method in LiDAR SLAM. Dense-only systems receded while their techniques spread into other architectures.

---

## 🧭 Still open

Large-scale outdoor dense reconstruction. Sunlight interference with IR structured light is a general limitation of active depth sensors. LiDAR operates at longer range but captures color and fine surface detail poorly. As of 2026, RGB-D still cannot densely process large outdoor environments. Learned stereo depth estimation has improved, but limitations in dark regions, on reflective surfaces, and at long range remain unresolved.

Dense reconstruction of dynamic scenes. Every system from KinectFusion to BundleFusion was designed for static scenes. Dense reconstruction in spaces occupied by moving people requires separating dynamic objects, using semantic segmentation, geometric residuals, or other motion-separation methods. [DynaSLAM](https://arxiv.org/abs/1806.05620) and [MaskFusion](https://arxiv.org/abs/1804.09194) attempted this, but their computational cost and robustness remained unsuitable for practical deployment.

Memory efficiency of voxel maps. Voxblox stores TSDF values in hashed blocks, while OctoMap stores occupancy probabilities in an octree; the two reduce memory use for different map representations. Dense representations at the scale of a building floor or city block nevertheless require tens of gigabytes. No general adaptive-resolution method automatically determines the appropriate resolution for each region. Implicit neural representations such as [Instant-NGP](https://arxiv.org/abs/2201.05989) address this problem, but real-time updates still trade off against query speed.

While dense SLAM reconstructed individual rooms as meshes, another lineage addressed the problem of recognizing a return to the same room. Place recognition, which asks whether a system has seen a place before, had developed at Oxford since 2003 independently of dense mapping. KinectFusion had no loop closure; the researchers working on that problem focused on recognizing locations rather than constructing denser maps.
