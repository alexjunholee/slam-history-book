> 📜 **Prediction vs. outcome.** In iMAP's conclusion, Sucar wrote that "future directions for iMAP include how to make more structured and compositional representations that reason explicitly about the self similarity in scenes." Structured and compositional representations soon became the field's main direction: five months later, an ETH Zürich pre-release of NICE-SLAM partitioned space hierarchically with a multi-resolution voxel feature grid, and Wang et al.'s Co-SLAM (2023) paired hash-grid and coordinate encodings to reach 10–17 Hz on an RTX 3090 Ti. By contrast, explicit reasoning about scene self-similarity drew far less attention in mainstream NeRF-SLAM, and single-MLP architectures faded from central use.

---

## 17.3 NICE-SLAM: hierarchical grid and scalability

Zihan Zhu and Songyou Peng at ETH Zürich tackled iMAP's single-MLP bottleneck in [Zhu et al. 2022. NICE-SLAM](https://arxiv.org/abs/2112.12130) at CVPR 2022. **NICE-SLAM** (Neural Implicit Scalable Coding for SLAM) replaced the monolithic network with a multi-resolution voxel feature grid paired with lightweight MLP decoders.

By anchoring learnable feature vectors directly on an explicit spatial grid, NICE-SLAM offloaded most geometric storage from network weights to local grid cells. During rendering, each sample coordinate trilinearly interpolates its surrounding voxel features, and a compact MLP decodes them into color and occupancy. Three hierarchical geometry grids capture coarse-to-fine structure alongside a separate color grid and decoder; crucially, mapping a new region updates only the local voxel features there, sharply curbing catastrophic forgetting across the rest of the map.

Following iMAP's split between tracking and mapping, NICE-SLAM froze the grids and decoders to optimize pose, then unfroze local features during mapping. On Replica and ScanNet, it scaled to larger indoor spaces with crisper reconstruction detail than iMAP. Even so, dense 3D voxel grids imposed their own wall: memory grew with the cube of spatial resolution, restricting the system to one or two rooms and keeping frame rates well below real time.

Relief arrived soon after from graphics. At SIGGRAPH 2022, Thomas Müller's [Müller et al. 2022. Instant-NGP](https://nvlabs.github.io/instant-ngp/) combined multi-resolution hash encoding with fused GPU kernels, demonstrating scene training in seconds on supported NVIDIA GPUs. Though not a SLAM paper, Instant-NGP's hash grid was rapidly absorbed into subsequent NeRF-SLAM pipelines.

> 🔗 **Borrowed.** NICE-SLAM's multi-resolution feature grid emerged independently around the same time as Instant-NGP's hash encoding, yet Instant-NGP's compact hash table soon displaced dense feature grids in many NeRF-SLAM systems. Conceptually, the feature grid also extends KinectFusion's voxel representation (Chapter 12), swapping hand-crafted TSDF values for learned local features.

---

## 17.4 Co-SLAM and NeRF-SLAM: two integration directions

From late 2022 onward, successors to iMAP and NICE-SLAM branched along two complementary tracks: redesigning the implicit encoding for speed and memory efficiency, or decoupling neural mapping from a classical SLAM tracker.

Along the representation track, UCL's [Wang et al. (2023) **Co-SLAM**](https://arxiv.org/abs/2304.14377) paired a multi-resolution hash grid with a one-blob coordinate encoding. The hash table let densely observed surfaces converge rapidly, while the smooth coordinate encoding regularized unobserved holes—a hybrid that pushed Replica throughput to 15–17 Hz on an RTX 3090 Ti, bringing neural implicit SLAM near real time. At the same CVPR, [Johari et al.'s **ESLAM**](https://arxiv.org/abs/2211.11704) from Idiap and EPFL attacked voxel memory growth directly by replacing the 3D grid with multi-scale axis-aligned feature planes, dropping memory complexity from $O(n^3)$ to $O(n^2)$ while decoding TSDF values instead of raw density for faster convergence.

Antoni Rosinol at MIT pursued the second, architectural track in [**NeRF-SLAM**](https://arxiv.org/abs/2210.13641) (2022). Rather than optimizing camera pose through slow ray-marching gradients, NeRF-SLAM entrusted tracking and dense depth estimation to DROID-SLAM, extracted marginal covariances from its Hessian, and fed those posed, uncertainty-weighted depth maps into a dedicated Instant-NGP mapping thread.

> 🔗 **Borrowed.** NeRF-SLAM builds directly on the poses, dense depths, and uncertainties output by DROID-SLAM's recurrent updates and Dense Bundle Adjustment, pairing them with an Instant-NGP radiance field. Rather than replacing the pose estimator, the neural field consumes its outputs to construct a dense photometric map in real time.

By separating dense monocular tracking from neural mapping, NeRF-SLAM ensured that pose estimation no longer waited on differentiable rendering—allowing trackers and neural map representations to advance independently.

---

## 17.5 The structural limitation of iMAP

Why did iMAP's single-MLP design hit a ceiling so quickly, even after proving that joint pose-and-map optimization was feasible?

The root cause is lack of spatial locality. Querying any point in a single MLP evaluates the entire network, and updating weights for a newly visited corner alters predictions everywhere else, inducing catastrophic forgetting. As the explored volume grows, one fixed-parameter network must absorb ever more spatial variation, demanding larger layers and more gradient steps. Parameter count scales with network width and depth rather than scene volume, making a global implicit function fundamentally mismatched to expanding environments.

NICE-SLAM's voxel grid, Instant-NGP's hash table, and Co-SLAM's dual encoding all restored locality by partitioning space into regional parameters—isolating updates from previously mapped rooms and decoupling per-ray rendering cost from overall map size.

---

## Still open

**Real-time NeRF-SLAM.** Despite major speedups over iMAP and NICE-SLAM, even Co-SLAM's 10–17 Hz on a desktop RTX 3090 Ti remained far too demanding for embedded or mobile robots, let alone 30+ fps operation without high-end GPUs. Instant-NGP accelerated ray queries dramatically, yet closing the full tracking-and-mapping loop in real time remained constrained—paving the way for explicit Gaussian Splatting in Chapter 18.

**Large-scale outdoor environments.** Partitioning space into many local radiance fields, as in [Block-NeRF](https://arxiv.org/abs/2202.05263) (2022, Tancik et al.), enables neighborhood-scale view synthesis, yet integrating partitioned fields with SLAM loop closures and global metric consistency remained unresolved at city scale.

**Semantic and editable implicit maps.** Because a NeRF stores geometry and appearance implicitly for rendering, editing individual objects or attaching semantic labels is far more awkward than modifying a point cloud or TSDF. [LERF](https://arxiv.org/abs/2303.09553) embedded language features for open-ended 3D queries without supporting object removal, and while toolkits such as [Nerfstudio](https://arxiv.org/abs/2302.04264) spurred rapid experimentation with semantic and editable radiance fields, real-time SLAM integration remained an open research problem as of 2026.

---

Even as iMAP and NICE-SLAM refined implicit fields, another camp questioned whether neural weights or voxel grids were needed at all. Millions of explicit 3D ellipsoids promised far faster rasterization and direct spatial editing than any implicit MLP—and splatting already had a twenty-year history stretching back to 2001 EWA splatting. At SIGGRAPH 2023, Bernhard Kerbl and his colleagues fused trainable 3D Gaussians with a custom tile-based differentiable rasterizer, triggering an immediate shift across dense SLAM.


---

# Chapter 18. 3D Gaussian Splatting-Based SLAM

Although iMAP and NICE-SLAM brought neural fields into SLAM, implicit representations remained awkward to edit and slow to run. Updating iMAP's global MLP risked corrupting previously mapped rooms, and while NICE-SLAM curbed that interference with local feature grids, it still ran below 1 fps on an RTX 3090—leaving scene geometry locked inside opaque network weights.

At SIGGRAPH in August 2023, Bernhard Kerbl, Georgios Kopanas, Thomas Leimkuhler, and George Drettakis of INRIA offered a decisive turn in [their paper](https://arxiv.org/abs/2308.04079). Rather than abandoning the differentiable photometric optimization that NeRF had refined over the previous three years, 3D Gaussian Splatting (3DGS) replaced MLPs and voxel grids with millions of explicit ellipsoidal Gaussian primitives. Its rasterizer drew directly on Matthias Zwicker's twenty-year-old EWA splatting technique (2001), while its optimization preserved NeRF's differentiable-rendering loop. Within six months, the SLAM community had built a new wave of systems around it.

---

## 18.1 The structure of 3DGS

In 3DGS, a scene is an explicit collection of anisotropic 3D Gaussians. Each primitive carries a center $\boldsymbol{\mu} \in \mathbb{R}^3$, a 3D covariance matrix $\boldsymbol{\Sigma} \in \mathbb{R}^{3 \times 3}$, a learnable opacity $o \in (0,1]$, and view-dependent color parameterized by spherical harmonics. To keep covariance positive semi-definite during gradient descent, $\boldsymbol{\Sigma}$ is factored into a scaling vector $\mathbf{s}$ and a unit rotation quaternion $\mathbf{q}$:

$$\boldsymbol{\Sigma} = \mathbf{R}\mathbf{S}\mathbf{S}^\top\mathbf{R}^\top$$

To render an image, 3D Gaussians are projected onto the image plane, sorted by depth, and alpha-blended in front-to-back order. Each primitive's effective opacity $\alpha_i$ multiplies its learnable opacity $o_i$ by the 2D Gaussian density $G_i(\mathbf{x})$ at pixel $\mathbf{x}$, yielding pixel color:

$$C = \sum_{i \in N} c_i \alpha_i \prod_{j<i}(1 - \alpha_j), \quad \alpha_i = o_i G_i(\mathbf{x})$$

Whereas NeRF approximates a continuous volume-rendering integral by marching samples along every ray, 3DGS feeds primitives straight into a GPU rasterization pipeline with custom CUDA tile-rasterizer kernels for both forward and backward passes. On a single RTX 3090, a trained scene renders at well over 30 fps—though this pure novel-view rendering speed cannot be compared directly as a simple speedup ratio against NICE-SLAM's full tracking-and-mapping loop.

Optimization typically starts from a sparse SfM point cloud and alternates parameter updates with adaptive **densification**—splitting, cloning, and pruning primitives. Where large view-space position gradients signal under-reconstructed detail, oversized Gaussians split into two children while tiny Gaussians clone themselves; meanwhile, near-transparent primitives whose opacity drops below a threshold are periodically culled.

> 🔗 **Borrowed.** 3DGS's rasterization-based splatting descends directly from Zwicker et al.'s [EWA splatting (2001)](https://www.cs.umd.edu/~zwicker/publications/EWAVolumeSplatting-VIS01.pdf), which wrapped point samples in elliptical weighted-average kernels for smooth point-cloud rendering. Kerbl replaced fixed kernels with learnable Gaussians and accelerated the pass with a GPU tile rasterizer.

---

## 18.2 Structural fit between 3DGS and SLAM

From a SLAM perspective, implicit fields fought against incremental mapping at an architectural level. A global MLP had to adjust shared weights for every new frame, inviting catastrophic forgetting and forcing capacity trade-offs as maps expanded; voxel grids localized those updates at the price of cubic memory growth.

An explicit Gaussian map aligned far more cleanly with incremental SLAM. Whenever a new keyframe reveals unobserved geometry, the system can insert Gaussians strictly in that local volume without disturbing distant regions. Densification pairs naturally with keyframe addition, while tile rasterization delivers NeRF-grade visual fidelity at interactive frame rates. Unsurprisingly, 3DGS-SLAM preprints began appearing in rapid succession before the end of 2023.

---

## 18.3 GS-SLAM: an early attempt

In November 2023, Chi Yan (HKU) and collaborators posted [Yan et al. 2023. GS-SLAM](https://arxiv.org/abs/2311.11700) to arXiv—one of the earliest attempts to wrap 3DGS inside a complete tracking-and-mapping pipeline.

Following classical SLAM separation, GS-SLAM alternates between estimating the current frame's pose and refining the Gaussian map. To make optimization tractable, Yan introduced two mechanisms: adaptive Gaussian expansion, which seeds new primitives in under-covered regions upon keyframe insertion, and geometry-aware Gaussian selection, which restricts backpropagation to primitives contributing meaningfully to the rendering residual.

During tracking, GS-SLAM optimizes camera pose by minimizing a rendered L1 photometric loss across sampled pixels:

$$\mathcal{L}_{track} = \sum_m \|\mathbf{C}_m - \hat{\mathbf{C}}_m\|_1$$

During mapping, it combines color and depth L1 losses alongside the original 3DGS photometric-structural objective, $(1-\lambda)\mathcal{L}_1 + \lambda\mathcal{L}_{D\text{-}SSIM}$ with $\lambda=0.2$—all end-to-end differentiable with respect to camera pose through the custom rasterizer. On Replica, GS-SLAM matched NICE-SLAM's PSNR at substantially higher throughput, though it still depended on an RGB-D sensor and remained unvalidated outdoors.

---

## 18.4 SplaTAM: silhouette-based densification

Soon after, Nikhil Keetha and colleagues at Carnegie Mellon simplified Gaussian densification in [Keetha et al. 2024. SplaTAM (CVPR)](https://arxiv.org/abs/2312.02126).

Like GS-SLAM, SplaTAM alternates between optimizing camera pose with the map frozen and updating Gaussian parameters with poses held fixed. What distinguishes SplaTAM is how it decides where the map needs new primitives: a **silhouette mask** flags pixels in the current view that existing Gaussians fail to cover, and SplaTAM seeds new Gaussians directly into those empty regions.

> 🔗 **Borrowed.** SplaTAM adapts PTAM's keyframe-based map-management principle (Klein & Murray, 2007) to an explicit Gaussian representation. Selective keyframe insertion—which PTAM used to expand a sparse landmark map—becomes the trigger for silhouette-guided densification in SplaTAM.

The visual gain over earlier neural-field SLAM was stark: on Replica, SplaTAM achieved a PSNR of 34.11 dB compared with NICE-SLAM's 24.42 dB in the paper's benchmark table. Even so, in the CVPR paper's Limitations & Future Work section, Keetha noted sensitivity to motion blur, depth noise, and rapid rotations, as well as reliance on known camera intrinsics, dense depth sensors, and limited spatial scalability.

> 📜 **Prediction vs. outcome.** In SplaTAM's Limitations section (2024), Keetha singled out sensitivity to motion blur, depth noise, and aggressive rotation alongside reliance on known intrinsics, dense depth, and small-scale scenes. Later that same year, Matsuki's MonoGS (CVPR 2024) eliminated the depth-sensor requirement with a monocular RGB formulation, while removing calibrated intrinsics and scaling to large outdoor scenes remained active challenges through 2024–2025.

---

## 18.5 MonoGS: monocular RGB

[Matsuki et al. 2024. MonoGS (CVPR)](https://arxiv.org/abs/2312.06741), developed by Hidenobu Matsuki and colleagues at Imperial College's Dyson Robotics Lab, dropped the depth camera altogether, running 3DGS SLAM from a single monocular RGB stream.

Moving to monocular RGB reintroduces SLAM's classic scale ambiguity: projective geometry alone cannot fix metric scale. Matsuki optimized Gaussian geometry directly from multiview photometric residuals and added an **isotropy loss** to stabilize under-constrained primitives, though the resulting monocular trajectory remains defined only up to an arbitrary scale factor:

$$\mathcal{L}_{iso} = \sum_k \| \mathbf{s}_k - \bar{s}_k \mathbf{1} \|_1$$

Here $\mathbf{s}_k \in \mathbb{R}^3$ denotes the axis scales of the $k$-th Gaussian and $\bar{s}_k = \frac{1}{3}\sum_j s_{k,j}$ their mean. Penalizing deviations from $\bar{s}_k$ keeps Gaussians from stretching into needle-like ellipsoids along viewing rays when parallax is weak, suppressing artifacts that otherwise destabilize both rendering and pose tracking.

For tracking, MonoGS optimizes pose directly against the photometric difference between rendered and observed pixels. New Gaussians at pixels with valid rendered depth are initialized near that depth with tight variance, while uncovered pixels start at the frame's median rendered depth with high variance so subsequent views can triangulate and refine them—though neither mechanism supplies metric scale.

> 🔗 **Distinction.** MonoGS uses neither a pretrained monocular depth predictor nor an external tracking module. Its initialization therefore does not derive from the MonoDepth2 lineage.

Coming out of Davison's Dyson Robotics Lab—following Bloesch's CodeSLAM and Sucar's iMAP—MonoGS marked the group's pivot from latent codes and implicit MLPs to explicit Gaussian primitives. In [the initial 2023 arXiv release of MonoGS](https://arxiv.org/abs/2312.06741v1), average ATE RMSE on TUM-RGBD reached 4.44 cm in monocular mode (after scale alignment) and 1.58 cm in RGB-D mode (with rigid alignment only), while RGB-D rendering on Replica averaged 37.50 dB PSNR—squarely alongside peer GS-SLAM systems.

---

## 18.6 RTG-SLAM and real-time processing

Even with fast CUDA rasterization, neither GS-SLAM nor SplaTAM ran comfortably in real time across the full tracking-and-mapping loop. In 2024, Peng Zhexi's group at Zhejiang University tackled throughput head-on in [RTG-SLAM (SIGGRAPH 2024)](https://arxiv.org/abs/2404.19706).

Rather than updating the entire primitive set, RTG-SLAM caps Gaussian count by optimizing only primitives that strongly affect the current view and initializing Gaussians from compact **surfels** (surface elements), preserving surface geometry with far fewer parameters. On Replica, that pruning brought the system close to genuine real-time throughput.

---

## 18.7 Representation choices after 3DGS

The surge of 3DGS papers after 2024 widened SLAM's map-representation toolkit without rendering earlier structures obsolete. TSDFs and occupancy grids remain workhorses for embedded robotics, path planning, and safety-critical navigation, while NeRF and 3DGS serve goals centered on photorealistic rendering and dense appearance. Emphasizing 3DGS's speed and explicit updates captures its strength, not the disappearance of other map types.

At the same time, 3DGS's rapid adoption owed as much to silicon as to geometry: modern GPUs are engineered around hardware rasterizers rather than volumetric ray marchers, so aligning scene representation with the graphics pipeline gave 3DGS a decisive engineering tailwind over NeRF.

> 🔗 **Borrowed.** 3DGS directly inherits differentiable scene optimization from NeRF. Mildenhall et al. (2020) established how photometric gradients connect pixel observations to 3D scene parameters; Kerbl preserved that optimization engine while swapping the implicit MLP for explicit Gaussians.

> 📜 **Prediction vs. outcome.** In §7.4 (Limitations) of the 2023 3DGS paper, Kerbl et al. flagged needle-like artifacts and "popping" in sparsely observed regions, the lack of geometric regularization, and heavy memory footprints—over 20 GB during training and several hundred megabytes at render time on large scenes—pointing toward antialiasing, principled culling, and point-cloud compression. Compression soon materialized in [Compact 3DGS](https://arxiv.org/abs/2311.13681) and [Niedermayr et al.](https://arxiv.org/abs/2401.02436) in 2024, while directions scarcely anticipated in the original paper—dynamic extensions like [4DGS](https://arxiv.org/abs/2310.08528) and [Deformable 3DGS](https://arxiv.org/abs/2309.13101), or generative editing pipelines like [DreamGaussian](https://arxiv.org/abs/2309.16653) and [GaussianEditor](https://arxiv.org/abs/2311.14521)—quickly branched into major subfields of their own.

---

## Still open

**Memory scaling.** Primitive counts grow roughly linearly with scene volume: a Replica room needs a few hundred thousand Gaussians, whereas an outdoor city block can demand tens of millions. Pruning heuristics, level-of-detail hierarchies, and compression lines such as Compact 3DGS (Lee et al. 2024, Niedermayr et al. 2024) explore ways to tame that footprint, yet no standard protocol balances memory against visual fidelity at large scale.

**Semantic integration.** Following [LERF](https://arxiv.org/abs/2303.09553) (2023) for NeRF, [LangSplat](https://arxiv.org/abs/2312.16084) (2023) attached open-vocabulary language embeddings to 3D Gaussians, and subsequent SLAM prototypes followed suit. Even so, the field lacks shared benchmarks evaluating live updates, tracking accuracy, and semantic fidelity together, and joint optimization of geometric and semantic attributes can still degrade both.

**Dynamic scenes.** While 4DGS and Deformable 3DGS added time to static splats, GS-SLAM (Yan et al. 2023), SplaTAM (Keetha et al. 2024), and MonoGS (Matsuki et al. 2024) all assumed a static world. Handling moving and deforming objects—from mask-based outlier rejection to multi-object factor graphs and non-rigid reconstruction—forms a distinct lineage traced in Chapter 19.

3DGS also left initialization caught in a familiar loop: seeding Gaussians requires known camera poses or depth, yet estimating poses requires an existing map. RGB-D pipelines leaned on depth sensors, while MonoGS bootstrapped depth hypotheses internally without an external depth network. A separate line of research led by DUSt3R bypassed that chicken-and-egg problem altogether by learning to predict 3D geometry directly from raw images (→ Chapter 20).


---

# Chapter 19. Dynamic and Deformable SLAM

GS-SLAM, SplaTAM, and MonoGS all retained SLAM's classic static-world assumption. Yet a parallel line of research had been grappling with moving and deforming environments almost from the start.

In 2015, Javier Fuentes-Pacheco, Ruiz-Ascencio, and Rendón-Mancha closed their survey [*Visual simultaneous localization and mapping: a survey*](https://link.springer.com/article/10.1007/s10462-012-9365-8) in *Artificial Intelligence Review* with a dedicated section on "Dynamic and Deformable Environments"—an early recognition that moving objects were more than mere outliers for RANSAC to discard. Eleven years later, the April 21, 2026 manuscript of the *SLAM Handbook* devoted 37 pages to the subject, co-authored by Lukas Schmid, José María Martínez Montiel, Shoudong Huang, Daniel Cremers, José Neira, and Javier Civera. Static scenes had been a convenient starting point, but autonomous vehicles, domestic service robots, and surgical endoscopes all operate in worlds that refuse to stand still.

---

## 19.1 Three axes

In Handbook Ch.15 §15.1, Schmid et al. overturn the conventional definition of "dynamic SLAM." Rather than treating dynamism as an intrinsic property of the environment, they define a scene as static or dynamic *relative to the observation*—specifically, the ratio between observation rate $\text{Obs}$ and scene change rate $\text{Dyn}$. When $\text{Dyn} \ll \text{Obs}$, motion unfolds continuously between consecutive frames; when $\text{Dyn} \gg \text{Obs}$, objects shift unnoticed between separate visits.

From that insight, the Handbook maps the field along three axes: an *observation axis* separating short-term frame-to-frame motion from long-term change across visits, a *reconstruction axis* spanning pose-only tracking, joint scene geometry, and full 4D spatio-temporal understanding, and a *time axis* separating online execution from offline reconstruction. Earlier surveys often equated dynamic SLAM with masking out moving objects—a task that occupies only one narrow corner of this three-dimensional space, explaining why researchers working in different corners frequently talked past one another under the same label.

---

## 19.2 Short-term: from masking to multi-object SLAM

The earliest response to short-term motion was simply to delete moving pixels before they could corrupt localization.

In 2018, Berta Bescos—then a doctoral student at the University of Zaragoza—published [DynaSLAM](https://arxiv.org/abs/1806.05620) in RA-L, pairing Mask R-CNN with the ORB-SLAM2 frontend to mask out people and cars prior to keypoint extraction. On the TUM-RGBD walking sequence, that straightforward filtering dropped ATE to single-digit centimeters.

Rather than discarding dynamic regions, other researchers tracked them alongside the background. Working under Lourdes Agapito at UCL, Martin Rünz introduced [Co-Fusion (Rünz & Agapito, 2017)](https://arxiv.org/abs/1706.06629) and [MaskFusion (Rünz et al., 2018)](https://arxiv.org/abs/1804.09194), assigning each moving object its own surfel model and jointly estimating camera and object trajectories. Taking a geometry-first route at ICRA 2018, Raluca Scona (Edinburgh) and Stefan Leutenegger (Imperial) presented [StaticFusion](https://arxiv.org/abs/1806.05628), clustering photometric residuals to segment dynamic regions without relying on semantic detectors—and thus avoiding segmentation failures.

A deeper integration brought moving objects directly inside the SLAM state vector. Led by Jun Zhang at QUT, [VDO-SLAM (Zhang et al., 2020)](https://arxiv.org/abs/2005.11052) placed both the camera pose $T_i^w \in SE(3)$ and each dynamic object's pose $T_{k,i}^w \in SE(3)$ into a unified factor graph, enforcing smooth linear and angular motion via constant-velocity factors and optimizing jointly over the product manifold. Bescos brought the same principle into ORB-SLAM2 with [DynaSLAM II (Bescos et al., 2021)](https://arxiv.org/abs/2010.07820), and Yuheng Qiu at CMU extended it to articulated bodies such as walking humans in [AirDOS](https://arxiv.org/abs/2109.09903) (RA-L 2022).

> 🔗 **Borrowed.** VDO-SLAM's factor-graph extension directly inherits the iSAM tradition established by Dellaert and Kaess in graph SLAM (→ Chapter 6). Dynamic SLAM modeled a moving car by inserting its pose variables and measurement factors straight into the map graph.

A third strategy bypassed semantic masks and object trackers altogether by leaning on inertial sensing. In [DynaVINS](https://arxiv.org/abs/2208.11500) (RA-L 2022), Song, Lim, Lee, and Myung at KAIST URL downweighted visual bundle-adjustment factors whenever features clashed with the pose prior from IMU preintegration. Their follow-up, [DynaVINS++](https://arxiv.org/abs/2410.15373) (RA-L 2024), recast that weighting as adaptive truncated least squares and closed a subtle failure mode in which dynamic outliers could poison IMU-bias estimation and trigger divergence.

The Handbook groups these threads under §15.2.3, "Dense Dynamic SLAM," highlighting Schmid's [Dynablox (Schmid et al., 2023)](https://arxiv.org/abs/2304.10049) for LiDAR moving-object segmentation alongside transformer-based [AnyCam](https://arxiv.org/abs/2503.23282) (2025), which recovers 4D structure directly from casual video in a modern continuation of Rünz's 2017 simultaneous tracking-and-reconstruction agenda.

---

## 19.3 Long-term: maps across time

Short-term methods track motion visible between consecutive frames; long-term dynamic SLAM confronts scenes that transform between visits—a chair shifted overnight, or a construction site reconfigured over weeks.

Drawing inspiration from human memory models, Mathieu Labbé (supervised by Michaud at Sherbrooke) began building [RTAB-Map](https://introlab.github.io/rtabmap/) in 2013 with a hierarchy of short-term, working, and long-term memory. Map nodes stayed in working memory during active exploration, migrated to long-term memory when unvisited, and were pruned once redundant—a design Labbé scaled to multi-session mapping in a 2019 JFR paper. In LiDAR mapping, Hyungtae Lim, Sungwon Hwang, and Hyun Myung at KAIST URL targeted lingering "ghost" trails of moving vehicles in [ERASOR](https://arxiv.org/abs/2103.04316) (2021), comparing vertical height profiles between accumulated maps and single scans before applying region-wise ground-plane fitting to strip away dynamic points.

At the heart of long-term mapping, Handbook §15.3 stresses a crisp epistemic distinction: **absence of evidence is not evidence of absence**. A map-maintenance algorithm must tell whether an object genuinely vanished or was merely occluded from the current viewpoint; otherwise, cleanup passes risk deleting permanent fixtures or mislabeling hidden regions as empty. Schmid's [Panoptic Multi-TSDF](https://arxiv.org/abs/2109.10165) (RA-L 2022) addressed this by giving each object its own TSDF submap governed by local consistency rules for active and inactive states. The same group's [Khronos](https://arxiv.org/abs/2402.13817) (2024) added graduated non-convexity for robust data association and ran deformable geometric change detection after loop closures, reconstructing *when* each object changed to yield a true 4D spatio-temporal map.

> 🔗 **Borrowed.** Panoptic Multi-TSDF fuses volumetric submapping—maintaining separate local TSDF volumes—with object-centric mapping, which treats individual objects as independent map models.

Point-cloud mapping pursued the same challenge from a LiDAR perspective. In 2026, Jang, Lee, Nahrendra, and Myung at KAIST URL introduced [Chamelion](https://arxiv.org/abs/2602.08189), pairing scene-mixing data augmentation with a dual-head network to detect structural changes without ground-truth supervision in transient sites such as construction zones and rearranged interiors—complementing Khronos's panoptic RGB-D 4D reconstruction with long-term point-cloud upkeep.

Still another research stream modeled *recurring* temporal patterns rather than one-off edits. Starting in 2014, Tomáš Krajník and Achim Lilienthal at Örebro University encoded periodic cycles—commuter flows, day-night illumination shifts—as Fourier **frequency maps**. In 2019, Martin Magnusson's group at KTH consolidated these ideas into Maps of Dynamics (MoD), embedding typical motion tendencies ("pedestrians usually keep left in this corridor") directly inside the map, while [Changing-SLAM (Schmid et al., 2023)](https://arxiv.org/abs/2301.09479) coupled Kalman filtering for short-term motion with semantic class matching for long-term changes inside an ORB-SLAM extension.

---

## 19.4 Deformable: when the shape itself changes

Even harder than moving rigid bodies are scenes where the background itself bends and stretches—a domain championed in robotics by Civera and Montiel at Zaragoza.

A landmark early system was [DynamicFusion](https://grail.cs.washington.edu/projects/dynamicfusion/), the CVPR 2015 Best Paper by Newcombe, Fox, and Seitz at Microsoft Research, which draped an embedded deformation graph over KinectFusion's canonical TSDF to reconstruct deforming faces and torsos in real time by optimizing per-node rotations and translations every frame. Follow-on RGB-D systems rapidly loosened its assumptions: Matthias Innmann at TU München incorporated color cues in [VolumeDeform](https://arxiv.org/abs/1603.08161) (2016); Miroslava Slavcheva introduced Killing-vector-field regularization in [KillingFusion](https://campar.in.tum.de/pub/slavcheva2017cvpr/slavcheva2017cvpr.pdf) (2017) so topologies could split or merge, such as fingers separating from a palm; and Wei Gao, supervised by Tedrake at MIT, swapped voxels for surfels in [SurfelWarp](https://arxiv.org/abs/1904.13073) (2019) to support open-ended exploration.

> 🔗 **Borrowed.** DynamicFusion directly adapted the embedded deformation graph introduced by Sumner, Schmid, and Pauly in computer graphics in 2007—turning a sparse mesh-animation rig into the state parameterization for real-time non-rigid SLAM.

Meanwhile, Zaragoza pushed deformable SLAM into the depth-free monocular regime. Juan Lamarca, completing his doctorate under Montiel, presented [DefSLAM](https://arxiv.org/abs/1908.08918) (RA-L 2021), combining an ORB frontend and Lucas-Kanade tracking with isometric non-rigid SfM (NRSfM) templates recomputed at each keyframe under a planar-topology assumption. In 2023, Juan J. Gómez Rodríguez from the same group lifted that topological restriction in [NR-SLAM](https://arxiv.org/abs/2308.04036), introducing a dynamic deformation graph and visco-elastic temporal regularization—a trajectory Handbook §15.4.2 terms the "monocular line of deformable SLAM."

Much of the practical pull came from minimally invasive surgery (MIS). Song at Tsinghua built [MIS-SLAM](https://ieeexplore.ieee.org/document/8458232) (2018) to track intraoperative organ deformation from stereo endoscopes, while the Jayender group at Children's National developed EMDQ (Expectation Maximization + Dual Quaternion) to estimate smooth deformation fields over SURF features for surgical navigation.

Yet non-rigid SLAM confronts a subtle theoretical barrier highlighted in Handbook §15.4.1 as **Floating Map Ambiguity**: without strong priors, image observations alone cannot separate a rigid motion of the deforming scene from a rigid motion of the camera. Vision by itself cannot tell whether a hand shifted 30 cm right or the camera shifted 30 cm left. Unlike standard monocular scale ambiguity, scale, camera trajectory, and surface deformation entangle into a single ill-posed problem; DefSLAM and NR-SLAM tame it with isometric and visco-elastic priors, but a principled general resolution remained absent as of 2026.

> 📜 **Prediction vs. outcome.** In §7 (Future Work) of DynamicFusion (2015), Newcombe pointed to larger environments, topological changes, and loop-closure integration as the next milestones. KillingFusion delivered topological transitions in 2017 and surfel-based SurfelWarp expanded spatial reach in 2019; by 2024, Khronos unified a deformation graph, loop closures, and change detection for long-term scenes whose object layouts evolve over time.

---

## 19.5 One way to read the connections

These contributions do not sort neatly into airtight schools, yet tracking co-authorships and institutional moves reveals three intertwined lineages. **The Zaragoza line** (Montiel, Neira, Civera, Lamarca, Rodríguez) carried monocular geometry from MonoSLAM (Chapter 5) and ORB-SLAM (Chapter 8) straight into DynaSLAM, DefSLAM, and NR-SLAM. **The dense dynamic-reconstruction line** ran from KinectFusion to DynamicFusion and from SLAM++ to Co-Fusion and MaskFusion, linking Davison, Newcombe, Agapito, Rünz, and Cremers across labs. Finally, **Schmid's path**—moving from Cremers's group at TUM through Carlone's lab at MIT to JPL—connects Dynablox, Panoptic Multi-TSDF, and Khronos. This three-part synthesis reflects the chapter's reading of the historical record rather than an explicit taxonomy from the Handbook.

---

## Still open

**Absence vs. evidence of absence.** Distinguishing an object that truly left the scene from one hidden behind occlusion remains foundational for long-term mapping. Schmid's Panoptic Multi-TSDF offered a partial solution via active submaps, and the Handbook notes extreme occlusion above 70% as a regime that remains acute (without treating 70% as a universal threshold specific to Panoptic Multi-TSDF). As of 2026, no paper claimed a complete, principled answer.

**Floating Map Ambiguity.** Deformable SLAM still leans on isometric and visco-elastic priors to disentangle camera motion from non-rigid object motion. While Lamarca's [2023 IJRR paper](https://arxiv.org/abs/2302.03710) characterized observability under specific conditions, no general theory dictates when visual measurements alone suffice.

**Online deformable SLAM.** Although DefSLAM and NR-SLAM run near real time, no monocular RGB pipeline performs Khronos-caliber change-aware 4D integration online; the optimization load still outstrips live budgets, and GPU-accelerated or learned-prior pipelines have yet to close the gap.

**The real-world gap in medical MIS.** Systems like MIS-SLAM and NR-SLAM perform reliably on phantoms and ex vivo tissue, yet falter amid real surgical conditions—blood, cautery smoke, instrument occlusions, and harsh endoscopic lighting. Gaussian-based approaches such as EndoGS (2024) are emerging, but clinical deployment remains out of reach.

---

Both NeRF-SLAM and 3DGS-SLAM accelerated or sharpened scene reconstruction while keeping the world static; dynamic SLAM relaxed that static premise inside classical and dense pipelines. Soon after, DUSt3R and its successors posed a more radical alternative: instead of refining a specialized SLAM pipeline piece by piece, why not learn 3D geometric priors directly from vast collections of images (→ Chapter 20)?


---

# Chapter 20. 3D Foundation Models: From DUSt3R to VGGT

In 2022, Philippe Weinzaepfel and Jerome Revaud at Naver Labs Europe introduced CroCo, a cross-view self-supervised pretraining scheme that learned visual features by comparing pairs of images of the same scene. What began as a feature-learning paper transformed into a calibration-free 3D reconstruction engine a year later when the same team adapted CroCo's architecture in DUSt3R to regress 3D pointmaps directly. From Grenoble the lineage jumped to Oxford's Visual Geometry Group (VGG), and by 2026 it had redrawn how Structure-from-Motion pipelines partition feature matching, calibration, and geometric reconstruction.

---

## 20.1 DUSt3R — learned pointmap

For roughly a decade after 2013, 3D reconstruction followed a fixed recipe: detect keypoints, match descriptors across views, estimate camera intrinsics and extrinsics, triangulate a sparse point cloud, and refine everything with bundle adjustment. [COLMAP (Schönberger & Frahm, 2016)](https://openaccess.thecvf.com/content_cvpr_2016/html/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.html) brought that pipeline to engineering maturity; accuracy climbed, yet the decomposition itself stayed untouched.

[Shuzhe Wang et al. 2023. DUSt3R: Geometric 3D Vision Made Easy](https://arxiv.org/abs/2312.14132) sidestepped the entire sequence. Given just two uncalibrated images—with no focal length, principal point, or lens parameters—DUSt3R directly outputs a dense **pointmap**: a 3D coordinate in a shared space for every pixel in both views.

Architecturally, DUSt3R carries over CroCo's ViT encoder-decoder transformer. Each image is encoded independently, after which twin decoders exchange information via cross-attention: self-attention models spatial context within a frame, while cross-attention learns cross-view correspondences implicitly from scale rather than hand-coded epipolar rules. To train that mapping, the authors assembled 8.5 million image pairs spanning Habitat, MegaDepth, ARKitScenes, Static Scenes 3D, BlendedMVS, ScanNet++, CO3D-v2, and Waymo, drawing ground truth from synthetic renders, depth sensors, and classical SfM reconstructions alike—meaning SfM itself supplied part, though not all, of the supervision for its learned successor.

> 🔗 **Borrowed.** DUSt3R builds on the Vision Transformer ([Dosovitskiy et al. 2020](https://arxiv.org/abs/2010.11929)) via Naver Labs Europe's own CroCo ([Weinzaepfel et al. 2022](https://arxiv.org/abs/2210.10716)). CroCo trained a cross-view transformer to reconstruct masked patches in one view using context from another; DUSt3R preserved that encoder-decoder skeleton and redirected it toward dense pointmap regression.

Because both predicted pointmaps sit in the first camera's coordinate frame, relative pose follows immediately from PnP-RANSAC over the predicted 3D points and their 2D pixel locations in the second view. Extending beyond two views—to three, ten, or dozens of images—requires solving a global alignment optimization that registers all pairwise pointmaps into one consistent world frame. Only in that outer registration step does an explicit bundle-adjustment-like optimization reappear, operating directly on predicted 3D pointmaps without feature matching or explicit camera models.

---

## 20.2 Making matching explicit: MASt3R

While DUSt3R excelled at direct 3D reconstruction, it recovered pixel-to-pixel correspondences only implicitly through aligned pointmaps—leaving it unable to serve as a drop-in replacement for explicit matchers like SuperPoint+SuperGlue or LightGlue.

[Vincent Leroy et al. 2024. Grounding Image Matching in 3D with MASt3R (ECCV)](https://arxiv.org/abs/2406.09756) closed that gap by adding a dedicated local-feature matching head to DUSt3R. Trained jointly with pointmap regression, the head produces per-pixel descriptors anchored in 3D geometry rather than purely 2D image appearance, turning dense correspondence matching into fast nearest-neighbor lookup.

> 🔗 **Borrowed.** MASt3R tackles the descriptor ambiguities that SuperGlue ([Sarlin et al. 2020](https://arxiv.org/abs/1911.11763)) resolved via contextual graph neural networks. Rather than reasoning over 2D keypoint graphs, MASt3R grounds descriptors directly in learned 3D structure.

Within months of MASt3R's release, SLAM groups began swapping out SuperPoint+SuperGlue in favor of its 3D-grounded matcher. In late 2024, [Riku Murai, Eric Dexheimer, Andrew Davison](https://arxiv.org/abs/2412.12392) at Imperial College London unveiled MASt3R-SLAM, pairing MASt3R correspondence matching in the frontend with graph-based global optimization in the backend—preserving classical SLAM's system architecture while replacing nearly all of its internal modules. Because MASt3R matches densely without prior calibration, photogrammetry and SfM pipelines (including COLMAP workflows) were by 2026 actively testing DUSt3R and MASt3R as initialization and matching stages.

> 📜 **Prediction vs. outcome.** Although the DUSt3R paper lacked a formal "Future Work" section, its reliance on pairwise inference plus offline global alignment clearly pointed toward streaming sequence processing and real-time SLAM. Within 6–12 months, Spann3R (August 2024) and MASt3R-SLAM (late 2024) delivered both extensions.

---

## 20.3 Spann3R — sequential processing

Batch reconstruction enjoys a luxury SLAM never has: seeing every image upfront. DUSt3R and MASt3R ingest an entire unordered collection and solve global alignment afterward, whereas a live SLAM system receives frames one by one and must update its map on the fly.

[Hengyi Wang & Lourdes Agapito 2024. 3D Reconstruction with Spatial Memory (Spann3R)](https://arxiv.org/abs/2408.16061) adapted DUSt3R for sequential streams by introducing a spatial-memory bank. Whenever a new frame arrives, cross-attention queries stored representations from previously processed frames, retrieving relevant historical geometry for each incoming pixel.

> 🔗 **Borrowed.** Spann3R adopts a cross-attention memory bank built directly atop DUSt3R's pretrained ViT encoder-decoder. Memory keys combine geometric decoder features with appearance features, indexing prior observations by both visual similarity and 3D proximity.

Like DUSt3R, Spann3R runs without camera calibration while updating its reconstruction incrementally frame by frame. Though not yet fully real-time, it bridged the gap from offline batch alignment to sequential SLAM.

---

## 20.4 VGGT — multi-view joint inference

Spann3R enabled sequential input, yet still inherited DUSt3R's pairwise structure. In early 2025, Jianyuan Wang, Minghao Chen, Nikita Karaev, Andrea Vedaldi, Christian Rupprecht, and David Novotny at Oxford's VGG group eliminated pairwise decomposition altogether—taking an arbitrary number of views simultaneously and predicting camera poses, depth maps, and 3D point clouds in a single forward pass.

[Jianyuan Wang et al. 2025. VGGT: Visual Geometry Grounded Transformer](https://arxiv.org/abs/2503.11651) replaced DUSt3R's $N(N-1)/2$ pairwise evaluations and subsequent global alignment with unified multi-view attention across all $N$ images at once.

> 🔗 **Borrowed.** There is a striking historical inversion here: classical SfM reconstructions helped supervise DUSt3R, yet VGGT absorbs into a single transformer pass the very stages classical SfM kept distinct—pairwise geometry estimation, view-graph construction, and global bundle adjustment.

In quantitative benchmarks against DUSt3R, VGGT delivered consistently higher pose accuracy and cleaner point clouds while running far faster without a global-alignment optimization loop—blurring the boundary between pose estimation and dense reconstruction even further.

---

## 20.5 Pose estimation and reconstruction converge

Classical computer vision long treated localization and reconstruction as twin halves of a hard problem: localization finds the camera inside a known map, reconstruction recovers geometry from known poses, and SLAM was hard precisely because it solved both simultaneously.

From DUSt3R to VGGT, shared neural representations increasingly fuse those halves together. DUSt3R still extracted camera poses from pairwise pointmaps and reconciled multiple views via global alignment, whereas VGGT emits poses and geometry in one forward pass—though downstream applications may still refine them differently. Neither model abandons multi-view geometry: epipolar constraints, triangulation, and bundle adjustment are still at work, only encoded implicitly inside transformer attention weights rather than written out as explicit solvers.

That shift carries an unmistakable engineering trade-off. When Schönberger's COLMAP fails, an engineer can inspect feature matches, residuals, or RANSAC thresholds; when DUSt3R misfires, the root cause hides inside millions of attention weights, putting interpretability back among SLAM's open challenges.

> 📜 **Prediction vs. outcome.** The MASt3R paper closed modestly, noting that calibration-free matching opened doors to diverse downstream tasks rather than predicting a wholesale pipeline overhaul. By 2026, commercial and open photogrammetry tools were indeed integrating DUSt3R and MASt3R as initialization modules—pointing toward hybrid insertion rather than complete replacement.

Even the institutional story is remarkable. Within just two years, a small Naver Labs Europe team led by Weinzaepfel, Revaud, and Leroy—tiny compared with Google Brain, DeepMind, or Meta AI—pushed from CroCo (2022) to DUSt3R (2023) to MASt3R (2024), before Davison's group at Imperial College London carried the thread into live SLAM with MASt3R-SLAM.

---

## 20.6 Another branch — semantic foundation enters the map

DUSt3R, MASt3R, and VGGT form the *geometric* branch of 3D foundation models, freeing pointmaps and pose estimation from camera calibration. Over the same period, starting around 2022, a parallel *semantic* branch brought foundation models such as CLIP, DINO, and SAM into the map, freeing scene understanding from fixed object dictionaries.

That semantic lineage traces back to Luca Carlone's group at MIT. [Nathan Hughes et al. 2022. Hydra: A Real-time Spatial Perception System for 3D Scene Graph Construction and Optimization](https://arxiv.org/abs/2201.13360) built an online hierarchy—objects → places → rooms → buildings—atop Kimera's (Rosinol 2020) metric-semantic mesh. Although limited to a closed set of roughly 100–1000 labels, Hydra proved that hierarchical semantic scene graphs could run in real time.

Vision-language foundation models soon dissolved that closed-set ceiling. [Songyou Peng et al. 2023. OpenScene: 3D Scene Understanding with Open Vocabularies (CVPR)](https://arxiv.org/abs/2211.15654) from the ETH/Pollefeys group distilled CLIP features onto 3D point clouds to support arbitrary natural-language queries ("how close is this point to a chair"). Shortly after, a Montréal–MIT team introduced [Qiao Gu et al. 2024. ConceptGraphs: Open-Vocabulary 3D Scene Graphs for Perception and Planning (ICRA)](https://arxiv.org/abs/2309.16650), pairing VLM object descriptions with LLM-inferred inter-object relations—an open-vocabulary object-graph design distinct from systems directly extending Hydra's hierarchy.

Within the Carlone group itself, [Dominic Maggio et al. 2024. Clio: Real-time Task-Driven Open-Set 3D Scene Graphs](https://arxiv.org/abs/2404.13696) carried Hydra's hierarchy into task-conditioned abstraction. Using an information-bottleneck formulation, Clio keeps only the scene details relevant to a natural-language instruction: asked to "clean near the coffee machine," it preserves fine objects around the counter while coarsening unrelated rooms.

> 🔗 **Borrowed.** Clio directly extends Hydra within the Carlone group by introducing task-driven abstraction. ConceptGraphs is an independent open-vocabulary object-graph lineage and should not be read as inheriting Hydra's objects-places-rooms hierarchy.

Even though object-as-landmark SLAM faded in 2017–2019, semantics returned vigorously at the scene-graph layer. Yet as of 2026, the semantic branch and DUSt3R's geometric branch remained largely separate: no unified end-to-end system attached CLIP embeddings directly onto VGGT's pointmaps or paired Clio's task-driven graphs with DUSt3R's uncalibrated geometry—a convergence left open for future work (→ Chapter 22 §22.4).

---

## 20.7 What classical SLAM still supplies

Look closely at MASt3R-SLAM and a striking architectural continuity emerges. Even after swapping feature extraction and matching for foundation models, it still leans on classical SLAM's scaffolding—keyframe selection, loop closure, and map management.

The same pattern holds across every recent wave: NeRF-SLAM kept keyframe-based tracking beneath an implicit field; 3DGS-SLAM adopted explicit Gaussians yet closed loops classically (→ Chapter 18); dynamic SLAM filtered or modeled moving objects in the frontend while keeping the backend intact (→ Chapter 19). Across a decade of upheaval, map representations turned over far faster than overall system architecture.

Foundation 3D proved no exception. In 2025, Dominic Maggio, Hyungtae Lim, and Luca Carlone at MIT released [VGGT-SLAM](https://arxiv.org/abs/2505.12549), using VGGT to reconstruct local submaps while optimizing 15-degree-of-freedom projective transforms between sequential submaps on \(\mathrm{SL}(4)\)—complete with loop-closure constraints. The transformer handles local geometry, while global graph optimization still holds the trajectory together. As Revaud observed in Handbook Ch.13, "a form of factor graph is still necessary." Achieving real-time performance over long sequences and merging that geometry with the semantic branch of §20.6 remained open challenges in 2026–2027.

---

## Still open

**Large-scale sequence processing.** Attention across all image tokens gives DUSt3R and VGGT memory complexity that grows quadratically with sequence length—tractable up to roughly 100 images, prohibitive at 1,000 or 10,000. Spann3R's streaming memory offers a partial bridge, yet sparse attention and hierarchical alignment have not yielded a consensus recipe for city-scale outdoor runs.

**Loop closure for pointmaps.** Classical SLAM detects revisited places and propagates metric corrections across a pose-landmark graph. How best to represent places and warp dense pointmaps consistently upon loop closure remains unsettled; MASt3R-SLAM relies on classical graph mechanisms, without proof that this is the principled long-term answer.

**Metric-scale generalization.** Like Metric3D or Depth Anything v2, DUSt3R recovers relative depth ratios between views rather than absolute metric scale. Without an IMU, GPS, or known physical baseline, scaling to unconstrained footage runs straight into the same projective physics that bounded monocular SLAM from the beginning.

**SLAM lineage or separate branch?** MASt3R-SLAM and VGGT-SLAM pulled 3D foundation models into SLAM pipelines across 2024–2025, yet real-time long-horizon execution and fusion with semantic scene graphs (Hydra → Clio alongside ConceptGraphs in §20.6) remain unresolved—no single architecture yet unites geometric and semantic foundation models.

---

Across Chapters 16 through 20, neural networks, radiance fields, Gaussians, and foundation transformers rebuilt the internal machinery of visual reconstruction while leaving keyframe management, loop closure, and graph backends standing overhead. Over those very same decades, an entirely separate community was wrestling with many of the same engineering problems—not through camera lenses, but through spinning beams of laser light.


---

# Chapter 21. LiDAR SLAM: From LOAM to FAST-LIO

Every lineage traced from Chapter 1 photogrammetry through Chapter 20 Foundation 3D shared one quiet premise: the sensor was a camera. MonoSLAM, PTAM, ORB-SLAM, DSO, and DUSt3R all interpreted the world through pixels. Over the same decades, however, an independent tradition grew up around laser rangefinders—built on Iterative Closest Point (ICP) and point-cloud registration rather than keypoints, photometric residuals, or visual descriptors. The two communities rarely cited one another, met at different conferences, and judged success on separate benchmarks.

Within that laser tradition, LOAM fused three strands: point-to-plane matching from Besl & McKay's 1992 ICP, the "network of poses" formulation from Lu & Milios's 1997 work on globally consistent scan alignment, and the urgent push for real-time outdoor autonomy sparked by the 2007 DARPA Urban Challenge. Ji Zhang's decisive 2014 insight was architectural: splitting high-frequency odometry from low-frequency mapping on a spinning Velodyne scanner—a two-tier template that became standard across LiDAR SLAM.

When Zhang presented LOAM at RSS 2014, the Visual SLAM community barely noticed, preoccupied as it was with ElasticFusion and LSD-SLAM. LOAM shared no codebase with camera-based pipelines, and the two researcher pools scarcely overlapped; both belonged to robotics yet evolved on parallel tracks for roughly a decade. LOAM rooted itself in [ICP (Besl·McKay, 1992)](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf), whereas the factor graphs already standard in Graph SLAM crossed into LiDAR systems only years later.

Radar SLAM branched along yet another independent path, split between spinning mechanically scanned sensors like the Navtech CIR series and single-chip 4D mmWave radars. Direct Doppler radial-velocity returns support correspondence-free odometry, paired with radio-specific noise models for speckle, multipath reflections, and receiver saturation. Its own arc runs from Oxford's radar localization in [Cen & Newman 2018](https://doi.org/10.1109/ICRA.2018.8460687), through Adolfsson and Magnusson's **CFEAR** and its successor **TBV-SLAM**, to Burnett and Barfoot's continuous-time ICP—supported by benchmarks including Oxford Radar RobotCar, Boreas, and MulRan. While radar's resilience in rain, fog, and smoke offers clear operational value, its history scarcely intersects the photogrammetry → SfM → Visual SLAM → learning → 3D foundation lineage covered here; a full technical treatment appears in Handbook of SLAM (2026) Ch.9.

---

## 21.1 LOAM: edges and planes, and the capture of KITTI

By 2014, Google's self-driving program—the precursor to Waymo—was already logging road miles, and momentum from the 2007 DARPA Urban Challenge remained strong. Because a Velodyne HDL-64E cost $75,000 per unit, 3D LiDAR research clustered inside well-funded labs able to field the hardware, among them Sanjiv Singh's Autonomous Mobile Robot Lab at Carnegie Mellon's Robotics Institute.

Range-based mapping itself predated LOAM by nearly two decades. [Lu & Milios 1997. "Globally Consistent Range Scan Alignment for Environment Mapping" (Autonomous Robots)](https://doi.org/10.1023/A:1008854305733) had modeled 2D laser scans as graph nodes linked by relative scan-to-scan edges and jointly optimized the trajectory—laying an early cornerstone of pose-graph SLAM (→ Chapter 6). Alongside Besl and McKay's ICP, [Biber and Straßer 2003. "The Normal Distributions Transform" (IROS)](https://doi.org/10.1109/IROS.2003.1249285) introduced NDT, aligning local Gaussian cell distributions in a formulation Magnusson later generalized to 3D. Yet those predecessors ran either in 2D or offline in 3D; LOAM delivered real-time 3D mapping on live vehicles.

In [Zhang & Singh 2014. "LOAM: Lidar Odometry and Mapping in Real-time" (RSS)](https://www.roboticsproceedings.org/rss10/p07.pdf), Ji Zhang—working under Singh—avoided registering every raw laser return. Instead, he scored local smoothness $c$ to separate sharp **edge points** (high curvature) from flat **planar points** (low curvature), matching only those sparse geometric classes: edge points against line segments and planar points against local surface patches in neighboring scans. Dropping the rest of the cloud slashed computation enough to run live.

To reconcile speed with global accuracy, Zhang split the pipeline into two asynchronous loops. **Lidar Odometry** runs at 10 Hz to track 6-DoF motion between consecutive sweeps, while **Lidar Mapping** runs at 1 Hz to register accumulated sweeps against the global point cloud and cancel drift. That division—fast frame-to-frame tracking paired with slower map-level refinement—quickly became canonical across LiDAR SLAM.

Once released, LOAM climbed near the top of the KITTI odometry leaderboard, posting a widely cited relative translation error of 0.78% on sequence 00 and 0.84% averaged across the evaluated sequences. Those numbers proved its strength on highway-scale scans, though differences in sensors and evaluation protocols preclude claiming any universal edge over visual odometry.

> 🔗 **Borrowed.** LOAM's geometric registration descends directly from Besl·McKay's (1992) ICP, but swaps brute-force all-point matching for selective edge-to-line and plane-to-plane alignment—a targeted refinement that bought both speed and accuracy.

---

## 21.2 LeGO-LOAM: cut the ground first

For all its success, LOAM treated every planar return alike—a blind spot on roads, where ground points dominate the scan and easily introduce noisy, ambiguous matches alongside building facades.

At Stevens Institute of Technology's Robust Field Autonomy Lab, Tixiao Shan and his advisor Brendan Englot tackled that bottleneck in [Shan & Englot 2018. LeGO-LOAM](https://doi.org/10.1109/IROS.2018.8594299). Projecting each 3D scan onto a 2D range image, LeGO-LOAM segments out the ground plane first, clusters the remaining above-ground objects, and runs a two-stage optimization: ground points constrain roll, pitch, and vertical translation, while object clusters solve for yaw and horizontal translation.

Cutting away raw ground clutter yielded sharp computational savings. Where original LOAM strained to keep up in real time on a lightweight 16-beam Velodyne VLP-16, LeGO-LOAM ran live on the same sensor even on an embedded NVIDIA Jetson. The trade-off was fragility whenever the ground assumption broke: in sparse scans, occluded alleys, rugged off-road terrain, or cluttered indoor rooms, segmentation errors could quickly degrade odometry. Still, LeGO-LOAM established an enduring pattern—structuring raw point clouds through modular preprocessing before optimization—that later systems like FAST-LIO and LIO-SAM built upon.

Around the same time, Jens Behley and Cyrill Stachniss at the University of Bonn bypassed edge and plane extraction altogether in favor of **surfels** (disk-shaped surface elements). Their **SuMa** system, presented in [Behley & Stachniss 2018. "Efficient Surfel-Based SLAM using 3D Laser Range Data in Urban Environments" (RSS)](http://www.roboticsproceedings.org/rss14/p16.pdf), summarized local neighborhoods as oriented surfels for scan-to-model registration, and [Chen et al. 2019. "SuMa++" (IROS)](https://doi.org/10.1109/IROS40897.2019.8967704) layered semantic segmentation on top to strip moving vehicles before surfel fusion. A surface representation popularized indoors by ElasticFusion (Chapter 12) had crossed into outdoor Velodyne mapping—leaving feature selection (LOAM), ground-first segmentation (LeGO-LOAM), and surfel accumulation (SuMa) competing side by side by 2018.

---

## 21.3 FAST-LIO — tightly coupled LiDAR-IMU

A spinning LiDAR typically sweeps at just 10–20 Hz. On a fast-moving vehicle or agile drone, the sensor translates and rotates significantly between the first and last laser firing of a single sweep, warping the point cloud with motion distortion that undermines LOAM-style scan matching.

An IMU, sampling at 100–400 Hz, fills that temporal gap. How tightly the two sensors are coupled, however, dictates accuracy under rapid motion: loosely coupled pipelines fuse separate inertial and laser estimates after the fact, whereas tightly coupled estimators place raw LiDAR returns and inertial measurements inside a single joint state—exploiting cross-correlations at the price of tighter mathematical integration.

At the University of Hong Kong (HKU)'s MaRS Lab, Wei Xu and his advisor Fu Zhang faced a demanding field testbed: quadrotors buffeted by rotor vibration and aggressive flight maneuvers. Their [**FAST-LIO**](https://arxiv.org/abs/2010.08196) (RA-L 2021) fused IMU measurements and LiDAR edge/plane residuals inside an **iterated Extended Kalman Filter (iEKF)**. By re-linearizing the measurement model repeatedly around each updated state estimate, an iEKF can cut linearization errors compared with a standard single-step EKF, though the realized gain depends on initialization quality and motion dynamics.

A year later, the same team pushed further in **FAST-LIO2** ([Xu et al. 2022](https://doi.org/10.1109/TRO.2022.3141876), TRO), dropping feature extraction to register raw points directly against a custom incremental data structure—the **ikd-Tree**. Because conventional kd-trees incur heavy rebuild overhead whenever new points arrive, the ikd-Tree restructures only affected branches incrementally, keeping nearest-neighbor queries real-time across millions of mapped points and delivering low drift across UAVs, handheld rigs, and ground vehicles alike.

The MaRS Lab then pushed temporal granularity to its limit in [He et al. 2023. "Point-LIO: Robust High-Bandwidth Light Detection and Ranging Inertial Odometry" (Advanced Intelligent Systems)](https://doi.org/10.1002/aisy.202200459). Rather than buffering a full sweep and deskewing intra-scan distortion afterward, Point-LIO updates the filter state at the exact timestamp of every arriving LiDAR point—cutting drift even further on high-agility platforms.

> 🔗 **Borrowed.** FAST-LIO imported into LiDAR SLAM the tightly coupled inertial fusion paradigm forged in Visual-Inertial SLAM. Whereas [Forster et al. 2016. "On-Manifold Preintegration" (TRO)](https://doi.org/10.1109/TRO.2016.2597321) formalized inertial factors for graph optimization, FAST-LIO realized tight LiDAR-inertial coupling inside an iterated EKF.

---

## 21.4 LIO-SAM: the factor graph crosses over to LiDAR

While Visual-Inertial SLAM had standardized around factor-graph backends like [GTSAM (Dellaert·Kaess, 2012)](https://gtsam.org/), most LiDAR pipelines through the late 2010s still relied on EKF filters or pairwise scan matching—leaving them less equipped to propagate global loop-closure corrections back through an entire trajectory.

In 2020, building on his LeGO-LOAM work, Tixiao Shan brought GTSAM squarely into LiDAR-inertial mapping with [Shan et al. 2020. LIO-SAM](https://doi.org/10.1109/IROS45743.2020.9341176). Its [public codebase](https://github.com/TixiaoShan/LIO-SAM) couples two factor graphs: a long-term mapping graph that binds keyframes with LiDAR odometry, GPS, and loop-closure factors, and a short-term IMU-preintegration graph that tracks high-rate state and sensor bias before resetting periodically to keep runtime bounded.

> 🔗 **Borrowed.** LIO-SAM carried the GTSAM factor-graph backend—cultivated by Dellaert in Visual SLAM from 2006 onward—directly into LiDAR-inertial mapping.

Choosing between FAST-LIO2 and LIO-SAM reflects a classic systems trade-off: LIO-SAM suppresses long-term drift more effectively when loop closures or GPS factors are available, at higher computational cost, whereas FAST-LIO2 excels in speed and raw precision for single-sensor real-time flight without external aids.

Meanwhile, after a decade in which LiDAR odometry accumulated edge/plane classifiers, surfels, and neural descriptors, [Vizzo et al. 2023. "KISS-ICP: In Defense of Point-to-Point ICP" (RA-L)](https://doi.org/10.1109/LRA.2023.3236571) at Bonn challenged the premise that complexity was mandatory. True to its name ("Keep It Small and Simple"), KISS-ICP paired vanilla point-to-point ICP with an adaptive correspondence threshold, motion compensation, and clean voxel subsampling—requiring no feature extraction, no learned descriptors, and minimal tuning—yet matched modern baselines on KITTI. That result demonstrated how far careful engineering of classical registration could reach, though it reflects modern compute and motion compensation rather than explaining the historical conditions under which LOAM first emerged.

---

## 21.5 Falling sensor prices and wider use: 2007–2024

The trajectory of LiDAR SLAM was shaped as much by hardware economics as by estimation theory.

At the 2007 DARPA Urban Challenge, the flagship Velodyne HDL-64E cost $75,000, restricting 3D LiDAR experimentation largely to defense contractors and well-endowed autonomous-driving labs. By 2012 the 32-beam HDL-32E hovered near $30,000, and by LOAM's 2014 debut the 16-beam VLP-16 had fallen to $7,999—still a major line item for an academic lab.

Over the ensuing decade, pricing splintered across a far broader spectrum. In 2019, DJI-backed Livox [announced a US retail price of $599 for the Mid-40](https://www.livoxtech.com/news/1); that same year Ouster's 128-channel OS1-128 retailed at $18,000, and in 2020 Ouster [announced a $600 target price for its solid-state ES2 in 2024 series-production programs](https://investors.ouster.com/news-releases/news-release-details/ouster-announces-first-high-performance-true-solid-state-digital). While sub-thousand-dollar units marked a genuine inflection point, those announcements do not imply a uniform 100-fold price drop across all LiDARs, given wide differences in beam count, range, field of view, and retail versus automotive-volume pricing.

Cheaper sensors also brought fresh algorithmic headaches. Solid-state LiDARs typically offer narrower fields of view than 360° spinning turrets, and several scan in non-repetitive rosette patterns—conditions under which LOAM's ring-based edge/plane logic breaks down. By contrast, FAST-LIO and FAST-LIO2 were built to accommodate both spinning and solid-state sensors, operating reliably under narrow fields of view and irregular sampling. Falling hardware prices thus transformed the algorithmic problem rather than solving it.

---

## 21.6 Why the Visual and LiDAR lineages split

Despite pursuing the same spatial estimation goal over the same decades, Visual SLAM and LiDAR SLAM operated almost as separate disciplines. Several structural forces kept them apart:

Measurement physics drove divergent math. Cameras capture dense texture and appearance, nudging researchers toward keypoints, descriptors, and photometric residuals; LiDAR directly measures 3D range, favoring edges, planes, surfels, and range-image geometry.

Institutional venues reinforced the divide. Visual SLAM lived primarily at CVPR and ICCV, whereas LiDAR SLAM anchored ICRA, IROS, and RSS—and during the early-to-mid 2010s, as Velodyne hardware flowed into Google and autonomous-driving startups, LiDAR expertise concentrated heavily in self-driving teams.

Even loop closure evolved incompatible vocabularies. Camera systems matched appearance via DBoW2 or NetVLAD, while LiDAR systems encoded 3D structural signatures with descriptors such as [Scan Context (Kim·Kim, 2018)](https://gisbi-kim.github.io/publications/gkim-2018-iros.pdf) and [PointNetVLAD](https://arxiv.org/abs/1804.03492): for the very same street corner, the two sensors were recognizing fundamentally different signals.

Early bridges finally emerged in the early 2020s as LiDAR-camera fusion reached top vision and robotics venues. Tixiao Shan's [LVI-SAM (2021)](https://arxiv.org/abs/2104.10831) grafted a visual-inertial subsystem onto LIO-SAM; although framed as a tightly coupled factor graph, its LiDAR-inertial (LIS) and visual-inertial (VIS) branches still run largely as semi-independent trackers that rescue each other upon failure, leaving a single seamlessly unified state estimator unfinished.

---

## 21.7 Visual-LiDAR convergence attempts: 2024–2025

From 2024 onward, sensor-agnostic foundation models renewed efforts to unite cameras and LiDAR inside one framework along two main paths. One line adapts the contrastive alignment of [CLIP (Radford et al., 2021)](https://arxiv.org/abs/2103.00020) from image-text pairs to LiDAR-camera pairs, mapping both modalities into a shared pretrained embedding space—work that remained largely experimental through 2023–2024. The other converts laser returns and camera pixels into common geometric primitives or neural fields handled by one backend, likewise remaining largely at the paper-prototype stage without widespread real-time deployment. By 2026, no unified mainstream lineage had displaced standalone specialists: FAST-LIO2 and ORB-SLAM3 continued to dominate their respective domains independently.

---

## Prediction vs. outcome

> In the conclusion of their 2014 LOAM paper, Zhang and Singh explicitly highlighted two items for future work: adding loop closure to bound long-term drift and fusing IMU measurements via a Kalman filter. Both materialized within a decade—VIO-style tightly coupled iEKF fusion in FAST-LIO (2021) and FAST-LIO2 (2022), and factor-graph loop closure in LIO-SAM (2020). What the 2014 conclusion left unmentioned was dynamic-object handling. By 2026, stripping moving pedestrians and vehicles from LiDAR scans in real time leaned heavily on deep-learning segmentation alongside geometric filters, with no single consensus solution across all dynamic scenes.

---

## Still open

**Full Visual+LiDAR fusion.** Even after LVI-SAM, no tightly coupled visual-LiDAR state estimator has emerged as a universal standard. Autonomous vehicles rely on LiDAR when rain or fog blinds cameras, yet cross-sensor calibration, asymmetric failure modes, and unified estimator design remain stumbling blocks—and 2024–2025 transformer-based fusion prototypes had yet to leave the lab.

**Algorithms optimized for solid-state LiDAR.** Classic LOAM baked in the ring structure of a 360° rotating scanner. Non-repetitive scan patterns (as in Livox units) and narrow fields of view alter motion distortion and geometric observability; while FAST-LIO2's direct point-to-map formulation and Livox LOAM tackle parts of that gap, no single framework spans the full diversity of solid-state optics and scan schedules.

**Dynamic object handling.** From Zhang's 2014 paper through 2026, mainstream LiDAR SLAM largely retained a static-world assumption. Real-time pipelines routinely offload moving-object masking to external segmentation networks while purely geometric in-loop filtering battles compute and stability limits; commercial autonomous-driving stacks remain proprietary, leaving open research without a settled standard.

---

Camera SLAM and LiDAR SLAM each matured into formidable engineering traditions, speaking separate technical dialects while converging only partially at their borders. Yet alongside both mainstreams ran quieter, more unorthodox lineages—biologically inspired cognitive maps, microsecond event cameras, object-centric semantic worlds—that never claimed the center of either community, yet left lasting marks on where SLAM is heading next.


---

# Chapter 22. Lost Lineages

While camera and LiDAR researchers built their respective mainstreams, others struck out along very different paths—some beginning with RatSLAM in 2004, well before LOAM, and others unfolding across the 2010s. Though none became the dominant paradigm, they left lasting imprints on SLAM's trajectory.

Each lineage sprang from a distinct scientific or hardware root: Milford and Wyeth's RatSLAM (2004) drew on O'Keefe and Dostrovsky's 1971 hippocampal place-cell discovery through cognitive-map theory; Event SLAM grew out of the silicon-retina tradition sparked by Lichtsteiner, Posch, and Delbruck's 2008 DVS sensor at ETH Zürich INI; and Salas-Moreno et al.'s SLAM++ (2013) pushed 1990s object-level scene understanding straight into the SLAM state vector. Along the way, each hit a different engineering wall. Yet running into a scaling ceiling or losing adoption to a more practical rival is not the same as an intellectual failure—and several of these "lost" ideas later resurfaced in unexpected forms.

---

## 22.1 RatSLAM — place cell-based topological map

At ICRA 2004, [Milford et al. 2004](https://doi.org/10.1109/ROBOT.2004.1302555) bypassed metric landmark geometry entirely, modeling place recognition after biology. **RatSLAM** mimicked **place cells** and **head direction cells** in the rodent hippocampus using a **Continuous Attractor Network (CAN)**: a 2D sheet of neurons sustaining a localized "bump" of activity that shifts with velocity and rotation commands (path integration) and snaps back whenever incoming camera views match stored place templates.

> 🔗 **Borrowed.** [O'Keefe and Dostrovsky (1971)](https://pubmed.ncbi.nlm.nih.gov/5124915/) discovered hippocampal place cells in neuroscience, laying the foundation for cognitive-map theory. RatSLAM translated that biological mechanism into a full engineering pipeline, though few mainstream SLAM systems later adopted it directly.

Between 2004 and 2008, Michael Milford and Gordon Wyeth at the Queensland University of Technology (QUT) put RatSLAM through demanding road trials across suburban Brisbane using a roof-mounted camera. In [Milford & Wyeth 2008](https://doi.org/10.1109/TRO.2008.2004520) (IEEE T-RO), it closed loops across tens of thousands of images over a 66 km route at a time when contemporary metric SLAM struggled beyond a few hundred meters.

Yet RatSLAM hit a wall when pressed for precision and scale. CAN computation grew with the number of stored places, and its topological graph excelled at recognizing "I have been here before" without reliably delivering meter-accurate 3D coordinates—the very quantities autonomous driving and robotic manipulation demanded.

> 📜 **Prediction vs. outcome.** Concluding their 2008 T-RO paper, Milford and Wyeth pitched RatSLAM as "an alternative approach to vision-only SLAM," highlighting repeatable loop closure over long routes despite drift and visual ambiguity—an alternative rather than a wholesale replacement. Although RatSLAM held its own on specialized benchmarks, post-2012 graph SLAM and visual odometry surged ahead in metric accuracy and speed; topological maps persisted within place recognition, while RatSLAM's metric-topological hybrid faded as a central system lineage.

Even as the full algorithm receded, its geometry-free view of place recognition took root. In 2012, Milford's group spun that insight into [SeqSLAM](https://doi.org/10.1109/ICRA.2012.6224623), turning image-sequence matching into a staple of visual place-recognition benchmarks.

---

## 22.2 The engineering limits of biologically-inspired SLAM

RatSLAM was the fullest expression of bio-inspired SLAM, yet not an isolated one: from the mid-2000s into the early 2010s, researchers explored SLAM designs grounded in cognitive maps, entorhinal grid cells, and hippocampal replay, only to encounter the same divide.

Neuroscience models *how* biological brains represent space; whether those mechanisms serve an engineering specification is another matter altogether. Evolution tuned the rat hippocampus for foraging and survival rather than sub-meter metric accuracy, deterministic real-time latency, rapid zero-shot deployment, or verifiable error bounds. Cognitive models offered no guarantees on those fronts, leaving a wide gap between biological plausibility and robotic utility.

Curiously, the question reopened in the 2020s as large-scale foundation models formed internal spatial representations that invited comparison with cognitive maps—though whether that parallel runs deeper than metaphor remains unresolved.

---

## 22.3 Event SLAM — the gap between hardware and algorithm maturity

In 2008, Patrick Lichtsteiner, Christoph Posch, and Tobi Delbruck at the ETH Zürich Institute of Neuroinformatics (INI) unveiled the [Dynamic Vision Sensor (DVS)](https://doi.org/10.1109/JSSC.2007.914337) at ISSCC. Instead of reading out full frames on a global shutter, each pixel independently monitors logarithmic brightness changes and fires asynchronous positive (ON) or negative (OFF) events with microsecond timestamps—a camera with no frames at all.

> 🔗 **Borrowed.** Inspired by change detection in the biological retina, the DVS event camera (Lichtsteiner et al. 2008) handed SLAM researchers new hardware before algorithms existed to exploit it—touching off a decade-long effort to close the software gap.

On paper, event cameras looked made for agile robotics: microsecond temporal resolution, near-immunity to motion blur during violent maneuvers, high dynamic range (HDR) spanning dark tunnels and glaring sunlight, and a fraction of the power draw of frame cameras.

Pioneering pipelines soon followed. At ICRA 2014, [Weikersdorfer et al. 2014](https://doi.org/10.1109/ICRA.2014.6906882) demonstrated event-based 3D SLAM alongside parallel event flow and depth estimators, and between 2016 and 2018 Henri Rebecq in Davide Scaramuzza's RPG lab at the University of Zurich built key infrastructure in [EVO](https://doi.org/10.1109/LRA.2016.2645143) (RA-L 2017) and the simulator [ESIM](https://proceedings.mlr.press/v87/rebecq18a.html) (CoRL 2018).

Out in everyday environments, however, early deployments ran into twin constraints. First-generation DVS chips offered just 128×128 pixels—far below VGA—starving feature matching and mapping of spatial detail, while frame-based vision algorithms refused to map cleanly onto asynchronous event streams. From 2014 to 2018, event SLAM shone in controlled high-speed or low-texture setups without overtaking conventional visual-inertial odometry in general scenes. Still, the paradigm branched productively: [EventVLAD](https://ieeexplore.ieee.org/document/9635907/) (Lee & Kim, IROS 2021), for instance, reconstructed edge images from event streams and fed them to NetVLAD, achieving resilient place recognition amid abrupt lighting shifts and severe blur where standard VPR failed.

---

## 22.4 Semantic SLAM — the shrinking of the object-as-landmark path

Between 2017 and 2019, semantic SLAM filled the programs of CVPR, ECCV, and IROS. Driven by rapid gains in deep object detection and instance segmentation, researchers sought to build maps out of meaningful objects rather than anonymous points—yet real-world implementations lagged far behind the rhetoric.

The touchstone predecessor was [Salas-Moreno et al. 2013](https://doi.org/10.1109/CVPR.2013.178)'s **SLAM++**, built with Andrew Davison at Imperial College. Instead of storing thousands of points or patches, SLAM++ treated *objects*—chairs, desks, monitors matched via ICP against a catalog of known 3D CAD models—as the map's atomic landmarks, compressing map size while anchoring loop closure in recognizable entities.

> 🔗 **Borrowed.** SLAM++ fused computer-graphics scene graphs with model-based 3D object recognition. A decade later, that object-centric impulse resurfaced in LERF and LangSplat, substituting open-vocabulary language features for rigid CAD catalogs.
