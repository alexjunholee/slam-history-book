# Chapter 12. RGB-D Dense Reconstruction

When Richard Newcombe of Imperial College London presented KinectFusion at ISMAR in November 2011, its live demonstration overshadowed the paper itself: a single handheld Kinect sweeping across a room and sculpting it into a dense 3D mesh in real time. Earlier that same year, Newcombe's DTAM had pursued dense reconstruction from monocular video alone; KinectFusion achieved it cleanly by switching to an RGB-D sensor. By fusing Curless and Levoy's 1996 TSDF volumetric representation from computer graphics, Besl and McKay's 1992 ICP surface tracker from robotics, and Microsoft's $150 Kinect sensor released in 2010, the system sparked a brief, intense era of dense SLAM. Where Davison's MonoSLAM (Chapter 5) had tracked sparse landmarks on a CPU and Newcombe's DTAM (Chapter 11) had turned to GPUs to optimize monocular photometry, KinectFusion paired GPU parallelism directly with an active depth stream.

---

## 12.1 Dense reconstruction before Kinect

Dense 3D scanning certainly existed before 2011—just not in *real time*.

Offline pipelines routinely registered point clouds from stereo rigs or structured-light scanners, yet dedicated indoor scanning hardware cost hundreds of thousands of dollars and rarely left specialized labs. In the 2000s, SLAM researchers already had reliable sparse-landmark tracking, leaving dense geometry largely to the computer graphics community.

In that graphics literature, [Curless and Levoy's 1996 SIGGRAPH paper, "A Volumetric Method for Building Complex Models from Range Images"](https://graphics.stanford.edu/papers/volrange/volrange.pdf), introduced the **TSDF (Truncated Signed Distance Function)**. The method carves 3D space into a uniform voxel grid, storing at each voxel the signed distance to the nearest observed surface: positive in free space in front of the surface, negative inside the solid behind it. Truncating the absolute distance at a threshold $t$ gives $\text{TSDF}(x) = \text{clip}(d(x), -t, +t)$, and each incoming depth frame updates every voxel via a running weighted average that suppresses sensor noise and sharpens geometry over time; marching cubes then extracts the clean mesh at the zero-crossing.

Despite its elegance, a dense voxel grid devoured memory, and 1990s hardware stood nowhere near updating millions of voxels at video rates. For fifteen years, Curless and Levoy's algorithm stayed confined to offline scanning—until programmable GPGPU compute and the consumer Kinect arrived together.

---

## 12.2 KinectFusion and TSDF

Microsoft launched the Xbox 360 Kinect in 2010 at roughly $150. Using structured infrared light, it streamed VGA depth maps at 30 Hz; while noisier than research-grade Time-of-Flight (ToF) cameras, its consumer price point invited immediate experimentation. Hobbyists released open-source drivers within weeks, and robotics labs followed close behind.

By then Newcombe had moved to Microsoft Research Cambridge, working on GPU-accelerated dense SLAM with Shahram Izadi's team. They already had the architecture sketched out when Kinect hit store shelves; plugging in its depth stream produced [Newcombe et al. 2011. KinectFusion](https://doi.org/10.1109/ISMAR.2011.6092378) at ISMAR 2011.

> 🔗 **Borrowed.** KinectFusion's map representation, the TSDF, came straight from Curless & Levoy (1996) in offline 3D graphics; Newcombe's team unlocked real-time operation by parallelizing voxel updates on the GPU.

The pipeline executes four GPU-accelerated stages per frame.

First, bilateral filtering smooths raw depth noise while preserving sharp edges, and surface normals are computed across the depth map.

Second, camera tracking aligns the live point cloud against a synthetic surface ray-cast from the current TSDF model via a GPU-parallel point-to-plane **ICP (Iterative Closest Point)** solver descended from [Besl & McKay (1992)](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf). Transforming each live point $\mathbf{p}_i$ by candidate pose $T = (R, \mathbf{t})$ toward its corresponding surface point $\hat{\mathbf{p}}_i$ and unit normal $\hat{\mathbf{n}}_i$ minimizes the normal-projected distance

$$E(R, \mathbf{t}) = \sum_i \bigl(\hat{\mathbf{n}}_i^\top (R\,\mathbf{p}_i + \mathbf{t} - \hat{\mathbf{p}}_i)\bigr)^2$$

Unlike Besl and McKay's original point-to-point residual ($\|R\mathbf{p}_i + \mathbf{t} - \hat{\mathbf{p}}_i\|^2$), penalizing only error along the surface normal allows smooth surfaces to slide freely without spurious drag. Under the small-angle approximation $R \approx I + [\boldsymbol{\omega}]_\times$, $E$ reduces to a linear least-squares system in the 6-DoF increment $(\boldsymbol{\omega}, \mathbf{t})$, solved rapidly on the GPU via parallel tree reduction.

> 🔗 **Borrowed.** KinectFusion's tracker directly inherits ICP from Besl & McKay (1992), scaling a classical registration algorithm up to dense per-pixel GPU execution.

Third, TSDF integration projects the depth map into the volume at the tracked pose and updates each voxel's weighted average. In the paper's canonical setup (§4.2, Fig. 13), a 512³ voxel grid spans a roughly 3 m room-scale cube.

Fourth, ray marching extracts the TSDF's zero-crossing surface to render predicted vertex and normal maps, supplying a clean, noise-averaged reference model for the next frame's ICP alignment.

Because Newcombe led both DTAM and KinectFusion in 2011 with overlapping collaborators, the two systems stood as siblings: DTAM pushed monocular photometric optimization onto the GPU, whereas KinectFusion harnessed the GPU for active depth alignment and volumetric fusion.

> 🔗 **Borrowed.** The same research group unveiled KinectFusion and DTAM in the same year. Both leveraged GPUs for real-time dense processing, yet DTAM's passive photometric energy and KinectFusion's depth-driven TSDF fusion diverged sharply in both map structure and objective.

Updating a 512³ TSDF at 30 Hz allowed a user to sweep out a room-scale mesh in minutes, and dense model-to-frame ICP suppressed local drift effectively inside that volume—though because the reference model itself accumulated from prior pose estimates, global drift could still creep in. More fundamentally, a fixed 512³ volume capped spatial range: walking out of the room exhausted the grid, no loop-closure mechanism existed to correct accumulated error, and sunlight washed out Kinect's infrared structured-light pattern, confining the system strictly indoors.

---

## 12.3 Kintinuous — rolling volume

Shortly after KinectFusion appeared, Thomas Whelan at Imperial College tackled its fixed-volume ceiling by letting the TSDF volume travel with the camera.

At the July 2012 RSS workshop on RGB-D perception in Sydney, [Whelan et al. presented Kintinuous](https://www.cs.cmu.edu/~kaess/pub/Whelan12rssw.pdf), introducing a **rolling TSDF volume**. As the camera moved toward the boundary of the active grid, trailing voxel slices were meshed out and freed from GPU memory while fresh slices were allocated ahead—keeping memory bounded while permitting arbitrarily long trajectories.

Demos traversing entire indoor corridors proved that dense RGB-D SLAM could outgrow a single room, yet loop closure remained missing. When a long corridor loop closed back to its starting doorway, the accumulated mismatch between the two ends stayed frozen in place, undermining global geometric consistency regardless of local mesh detail.

---

## 12.4 ElasticFusion: Surfels and non-rigid deformation

To make dense maps globally deformable for loop closure, Whelan abandoned regular voxel grids altogether in favor of **surfels**.

A **surfel (surface element)** represents a small oriented disk carrying a 3D position, surface normal, radius, and color—introduced to computer graphics as a lightweight rendering primitive by [Pfister et al. (2000)](https://www.merl.com/publications/docs/TR2000-10.pdf). Unlike a dense voxel array, surfels allocate memory only along observed surfaces.

> 🔗 **Borrowed.** ElasticFusion repurposed the surfel rendering primitive of Pfister et al. (2000) as a mutable SLAM map representation.

In [Whelan et al. 2016. ElasticFusion](https://doi.org/10.1177/0278364916669237), Whelan paired a surfel map with loop closure via *non-rigid space deformation*. Updating a global mesh or TSDF grid whenever a loop closes had always been prohibitively slow; ElasticFusion instead overlaid an embedded deformation graph onto the surfel cloud so loop constraints could warp the entire map smoothly in place.

Each deformation node $g_k$ holds a spatial anchor $\mathbf{v}_k$ together with a rotation $R_k$ and translation $\mathbf{t}_k$. Every surfel $s$ blends the transforms of its $K$ nearest graph nodes via distance-decaying weights $w_k$, yielding its deformed position

$$\tilde{\mathbf{p}}_s = \sum_{k \in \mathcal{N}(s)} w_k \bigl(R_k (\mathbf{p}_s - \mathbf{v}_k) + \mathbf{v}_k + \mathbf{t}_k\bigr)$$

When loop closure detects a revisit, Gauss-Newton optimizes the node transforms $(R_k, \mathbf{t}_k)$ to reconcile overlapping surfaces and spread residual error smoothly across the trajectory—restoring global consistency without rebuilding a volumetric grid from scratch.

On the synthetic ICL-NUIM indoor benchmark, ElasticFusion achieved sub-1.4 cm ATE RMSE across sequences kt0·kt1·kt2 (and 0.9 cm on kt0·kt1), with kt3 acting as an unusually large outlier where global loop closure engaged. Those figures reflect ICL-NUIM's controlled synthetic indoor setup rather than outdoor or handheld datasets like KITTI or TUM RGB-D.

---

## 12.5 BundleFusion: offline-SfM quality, online

In 2017, Angela Dai, Matthias Nießner, Michael Zollhöfer, Shahram Izadi, and Christian Theobalt raised the computational stakes further with [Dai et al. 2017. BundleFusion](https://doi.org/10.1145/3072959.3054739) in *ACM Transactions on Graphics*. Rather than trading accuracy for speed, BundleFusion threw massive GPU parallelism at running SfM-grade global bundle adjustment continuously online.

Its architecture layers three optimization tiers: fast dense frame-to-frame depth alignment supplies an initial pose, sparse SIFT feature matching refines local alignment, and hierarchical global bundle adjustment continuously re-optimizes the full history of frame poses. Whenever this retroactive optimization shifts earlier poses, BundleFusion de-integrates the stale frame contributions from the TSDF and re-integrates them at the corrected poses—preventing early tracking drift from fossilizing in the map.

On TUM RGB-D, Dai's team outperformed ElasticFusion, delivering visual surface fidelity that rivaled offline COLMAP reconstructions by 2017 standards.

> 📜 **Prediction vs. outcome.** BundleFusion touted real-time global bundle adjustment at "unprecedented speed," pointing toward online systems matching offline SfM quality. While GPU horsepower did keep climbing, the post-2021 wave largely bypassed online TSDF fusion altogether—pairing offline COLMAP poses with NeRF or neural scene representations aimed at photorealistic view synthesis rather than real-time voxel mapping.

---

## 12.6 Co-evolution of hardware and algorithm

The rapid arc from KinectFusion (2011) to BundleFusion (2017) reflects tight co-evolution between consumer depth hardware and GPU compute.

The original Kinect relied on structured infrared light, delivering millimeter-scale precision at close range while washing out in sunlight. Kinect 2 (2013) switched to Time-of-Flight (ToF) sensing with cleaner range accuracy and dynamic range, followed by Intel's RealSense family; as depth noise profiles changed, algorithms adapted accordingly.

At the same time, CUDA matured rapidly, multiplying GPU arithmetic throughput and memory bandwidth between 2011 and 2017. Because real-time execution in ElasticFusion and BundleFusion depended heavily on those hardware gains, any quantitative benchmark comparison must specify both the GPU model and numerical precision. Without consumer pricing on the original Kinect—bringing depth sensing from specialized instrumentation down to a mass-market game peripheral—this entire subfield would have grown far more slowly.

> 📜 **Prediction vs. outcome.** KinectFusion's fixed 512³ volume, drift, and indoor confinement set the agenda for its immediate successors: Kintinuous, ElasticFusion, and BundleFusion solved volume expansion and global consistency indoors, while outdoor dense mapping gravitated toward LiDAR because sunlight blinds IR structured light—a hardware boundary specific to active IR emitters rather than to every depth modality.

---

## 12.7 Why dense-only systems receded

Between 2011 and 2017, dense RGB-D SLAM looked poised to overtake visual SLAM; yet within a few years, sparse pipelines reclaimed the mainstream.

Practical systems deployed after 2015—led by [ORB-SLAM2](https://arxiv.org/abs/1610.06475) and [VINS-Mono](https://arxiv.org/abs/1708.03852)—opted for sparse landmarks by default, driven by hard engineering constraints. A raw 512³ TSDF consumes over 512 MB of memory, and while hashed-block TSDFs like [Voxblox](https://arxiv.org/abs/1611.03631) and octree occupancy maps like [OctoMap](https://www.hrl.uni-bonn.de/papers/wurm10octomap.pdf) trimmed that footprint, neither matched the lean efficiency of sparse graphs. Worse, dense pipelines required desktop-class GPUs unavailable on lightweight drones and embedded vehicles, and active IR depth sensors failed outdoors where commercial autonomous driving and aerial robotics operated.

Nevertheless, the volumetric and surfel data structures pioneered around KinectFusion branched outward into large-scale mapping. On the sparse volumetric side, [Museth's VDB (2013)](https://doi.org/10.1145/2487228.2487235)—released as OpenVDB—paired block hashing with a shallow internal tree to allocate detail strictly near surfaces (a foundation directly comparable to Chapter 21's nvblox), while [Reijgwart et al.'s (2023) wavemap](https://arxiv.org/abs/2306.08125) compressed 3D occupancy via wavelet transforms to trade resolution against memory dynamically. Seeking continuous probabilistic occupancy, [O'Callaghan and Ramos's (2012) GPOM (Gaussian Process Occupancy Map)](https://doi.org/10.1177/0278364911435991) and [Ramos and Ott's (2016) Hilbert Map](https://doi.org/10.1177/0278364916684382) replaced discrete voxels with kernel regression and streamable Hilbert-space features capable of inferring occupancy even in unobserved gaps. Meanwhile, [Behley and Stachniss's (2018) SuMa](https://www.ipb.uni-bonn.de/wp-content/papercite-data/pdf/behley2018rss.pdf) ported ElasticFusion's indoor surfel concept outdoors onto spinning LiDAR scans, operating across city-scale KITTI routes (→ Chapter 21).

By the early 2020s, high-fidelity dense reconstruction itself had shifted toward NeRF and 3D Gaussian Splatting—changing the scene representation even as measured RGB-D depth continued anchoring tracking and surface geometry. Dense-only RGB-D SLAM had a brief heyday, yet its core building blocks endured: TSDF grids entered autonomous-driving occupancy networks, and GPU ICP became a staple of LiDAR odometry.

---

## Still open

**Large-scale outdoor dense reconstruction.** Sunlight interference remains a physical barrier for active IR structured light, while LiDAR offers long range without dense color or fine texture. As of 2026, RGB-D sensors still cannot deliver dense outdoor mapping at large scale, and even learned stereo depth falters in deep shadow, on specular surfaces, and at long range.

**Dense reconstruction of dynamic scenes.** Every milestone from KinectFusion to BundleFusion assumed a static world. Mapping spaces filled with moving people demands separating dynamic objects via semantic segmentation, motion residuals, or explicit tracking; systems like [DynaSLAM](https://arxiv.org/abs/1806.05620) and [MaskFusion](https://arxiv.org/abs/1804.09194) demonstrated prototypes, yet compute cost and robustness continue to block practical deployment.

**Memory efficiency of voxel maps.** While hashed blocks in Voxblox and octrees in OctoMap cut memory overhead relative to dense arrays, building- or city-block-scale volumetric maps still swell to tens of gigabytes, and no universal scheme adapts voxel resolution automatically to geometric complexity. Neural hash encodings like [Instant-NGP](https://arxiv.org/abs/2201.05989) offer compact alternatives, but balancing real-time updates against fast queries remains an engineering trade-off.

---

While dense RGB-D SLAM focused on sculpting every surface inside a room, an independent lineage had been tackling a complementary question since 2003: how does a robot know it has *returned* to that room in the first place? KinectFusion launched without loop closure altogether; answering "have I been here before?" was the domain of place recognition—whose arc from Oxford's visual words to foundation-model descriptors is traced next in Chapter 13.

---

# Chapter 13. Place Recognition: From FAB-MAP to AnyLoc

Around 2003, even as Andrew Davison was demonstrating real-time 3D tracking from a single webcam, Mark Cummins and Paul Newman at the Oxford Mobile Robotics Group were asking a different question: how does a robot recognize a place it has visited before? Because any visual odometry pipeline drifts over time, no SLAM system can close a loop without answering it. Place recognition matured through the 2000s alongside tracking and mapping, yet followed a lineage of its own—rooted in computer vision's image-retrieval literature. FAB-MAP adapted Josef Sivic's bag-of-words model to robotics, DBoW2 turned it into a fast binary engine, NetVLAD brought end-to-end learning, and by 2023 AnyLoc repurposed foundation-model features with zero task-specific fine-tuning.

ORB-SLAM, DSO, and KinectFusion disagreed sharply on front-end tracking and map structure, yet every one of them needed loop closure—and place recognition supplied the trigger.

---

## 13.1 Place recognition before BoW

To close a loop in GPS-denied settings—whether indoors, underground, or inside an urban canyon—a robot must match its live camera frame against thousands of past views in milliseconds. Comparing images pixel by pixel requires an O(N) linear scan that breaks down in real time once a trajectory grows past tens of thousands of frames.

Josef Sivic and Andrew Zisserman broke that bottleneck in computer vision with their ICCV 2003 paper ["Video Google"](https://www.robots.ox.ac.uk/~vgg/publications/2003/Sivic03/sivic03.pdf). Borrowing TF-IDF indexing from text retrieval, they quantized SIFT keypoints via k-means clustering into discrete "visual words," represented each frame as a sparse word-frequency vector, and queried an inverted index so only frames sharing visual words with the query needed inspection. Robotics researchers recognized the fit almost immediately.

---

## 13.2 FAB-MAP — probabilistic BoW and the Chow-Liu tree (2008)

At Oxford, Mark Cummins and Paul Newman formalized visual-word matching for robotics in [Cummins & Newman. FAB-MAP: Probabilistic Localization and Mapping in the Space of Appearance](https://doi.org/10.1177/0278364908090961) (2008).

**FAB-MAP** (Fast Appearance-Based Mapping) addressed a subtle failure mode of raw similarity scores: in repetitive environments with dozens of look-alike corridors, the highest raw match score is often a false positive, and committing to a false loop closure can tear a pose graph apart.

Cummins and Newman therefore cast place recognition as Bayesian inference. Given a binary vector $z_t$ recording which visual words appear in the current image, FAB-MAP evaluates the posterior probability of every previously mapped location $\ell_i$:

$$P(\ell_i \mid z_t) \propto P(z_t \mid \ell_i) P(\ell_i)$$

Evaluating the observation likelihood $P(z_t \mid \ell_i)$ is the crux. Treating visual words as conditionally independent yields a naïve Bayes model that systematically overcounts correlated features: whenever the word for "door" appears, "doorknob" tends to appear alongside it, inflating confidence on generic architectural scenes.

To capture these dependencies tractably, FAB-MAP learns a **Chow-Liu tree**, a tree-structured graphical model that preserves the strongest pairwise dependencies across the vocabulary. Using pairwise mutual information

$$I(e_i; e_j) = \sum_{e_i, e_j} P(e_i, e_j) \log \frac{P(e_i, e_j)}{P(e_i)P(e_j)}$$

as edge weights, the Chow-Liu algorithm extracts a maximum-weight spanning tree over visual words $e_i, e_j$, factorizing the joint likelihood as

$$P(z_t \mid \ell_i) = \prod_k P(z_t^k \mid z_t^{\text{pa}(k)}, \ell_i)$$

where $z_t^k \in \{0,1\}$ indicates whether word $k$ is observed and $\text{pa}(k)$ is its parent in the tree. Learning both the vocabulary and tree structure offline on large image corpora allowed FAB-MAP to discount predictable co-occurrences and suppress false positives in repetitive corridors. Crucially, FAB-MAP also evaluated an explicit "new place" hypothesis—measuring the likelihood that the current view came from unvisited terrain—rather than forcing a match to the closest database candidate.

> 🔗 **Borrowed.** FAB-MAP transplanted the visual-word and inverted-index machinery straight from Sivic & Zisserman's "Video Google" (2003), turning web-scale video retrieval into a probabilistic memory of robot locations.

Three years later, [FAB-MAP 2.0](https://www.robots.ox.ac.uk/~mjc/Papers/cummins_newman_ijrr_fabmap2_2010_preprint.pdf) (2011) streamlined the inverted-index data structures to scale appearance-only loop closure across roughly 1,000 km of driving footage.

---

## 13.3 DBoW2 — binary descriptors and the vocabulary tree (2012)

Because FAB-MAP relied on floating-point SIFT descriptors, feature extraction and quantization remained heavy for real-time monocular SLAM. By 2012, the visual SLAM community was rapidly migrating to binary descriptors—BRIEF, ORB, and BRISK—making a floating-point vocabulary an awkward bottleneck.

In 2012, Dorian Gálvez-López and Juan D. Tardós at the University of Zaragoza published [Gálvez-López & Tardós. Bags of Binary Words for Fast Place Recognition in Image Sequences](https://doi.org/10.1109/TRO.2012.2197158). **DBoW2** organized binary descriptors inside a hierarchical vocabulary tree built with k-medians clustering, allowing fast Hamming-distance tree traversal that ran tens of times faster than SIFT-based quantization.

In a tree of branching factor $k$ and depth $d$, each leaf word $w_i$ carries a TF-IDF weight

$$\eta_i = \frac{n_i}{n} \cdot \log \frac{N}{N_i}$$

where $n_i$ counts occurrences of $w_i$ in the query frame, $n$ is the frame's total word count, $N$ is the database size, and $N_i$ counts how many database images contain $w_i$. Comparing two normalized BoW vectors for images $a$ and $b$ uses the L1 similarity score

$$s(\mathbf{v}_a, \mathbf{v}_b) = 1 - \frac{1}{2} \left\| \frac{\mathbf{v}_a}{|\mathbf{v}_a|} - \frac{\mathbf{v}_b}{|\mathbf{v}_b|} \right\|_1$$

while an inverted index keeps database lookup at O(log N).

> 🔗 **Borrowed.** DBoW2's hierarchical vocabulary tree comes directly from Nistér & Stewénius's CVPR 2006 paper ["Scalable Recognition with a Vocabulary Tree"](https://people.eecs.berkeley.edu/~yang/courses/cs294-6/papers/nister_stewenius_cvpr2006.pdf), adapted by Zaragoza to binary Hamming spaces and SLAM-specific temporal consistency checks.

DBoW2's dominance stemmed as much from software engineering as from speed. Open-sourced alongside the paper—and authored within the very Zaragoza group where Tardós went on to lead ORB-SLAM, ORB-SLAM2, and ORB-SLAM3 with Mur-Artal and Campos—DBoW2 became the default loop-closure module across a decade of feature-based SLAM systems.

---

## 13.4 NetVLAD — CNN-based VPR (2016)

For all its speed, bag-of-words place recognition shared a brittle assumption: its visual dictionary remained frozen for a fixed handcrafted descriptor and visual domain. Extreme shifts in illumination, weather, season, or viewpoint scrambled local keypoint patterns and caused BoW recall to collapse.

At CVPR 2016, Relja Arandjelović, Petr Gronat, Akihiko Torii, Tomáš Pajdla, and Josef Sivic introduced [NetVLAD: CNN Architecture for Weakly Supervised Place Recognition](https://doi.org/10.1109/CVPR.2016.572)—with Sivic now helping replace the very BoW paradigm he had popularized thirteen years earlier.

NetVLAD's key idea was to make **VLAD (Vector of Locally Aggregated Descriptors)** differentiable end to end. Originally proposed by [Jégou et al.](https://inria.hal.science/inria-00548637/file/jegou_compactimagerepresentation.pdf) in 2010, classical VLAD aggregates local descriptors by summing the residual between each descriptor and its nearest cluster center, or visual word, for each cluster $k$:

$$\mathbf{V}(k) = \sum_{\mathbf{x}_i : \text{NN}(\mathbf{x}_i)=k} (\mathbf{x}_i - \boldsymbol{\mu}_k)$$

Concatenating all $K$ sub-vectors of dimension $D$ into $\mathbf{V} = [\mathbf{V}(1)^\top, \ldots, \mathbf{V}(K)^\top]^\top$ and L2-normalizing produces a $KD$-dimensional global image descriptor far richer than a sparse BoW histogram.

> 🔗 **Borrowed.** NetVLAD built directly on Jégou et al.'s "Aggregating Local Descriptors into a Compact Image Representation" (CVPR 2010), replacing VLAD's non-differentiable hard cluster assignment with a learnable softmax so the entire network could train end to end.

Specifically, NetVLAD replaces hard nearest-neighbor assignment with a soft attention weight over each local CNN feature $\mathbf{x}_i$ and learnable parameters $\mathbf{w}_k$ and $b_k$:

$$\bar{a}_k(\mathbf{x}_i) = \frac{e^{\mathbf{w}_k^\top \mathbf{x}_i + b_k}}{\sum_{k'} e^{\mathbf{w}_{k'}^\top \mathbf{x}_i + b_{k'}}}$$

Accumulating residuals with this soft assignment yields a differentiable pooled representation,

$$\mathbf{V}(k) = \sum_i \bar{a}_k(\mathbf{x}_i)\,(\mathbf{x}_i - \boldsymbol{\mu}_k)$$

followed by per-cluster intra-normalization and a final global L2 normalization into $\mathbf{V} = [\mathbf{V}(1)^\top, \ldots, \mathbf{V}(K)^\top]^\top$. Because gradients flow cleanly back through the softmax weights into the CNN feature extractor, the backbone learns place-discriminative features directly from imagery.

Crucially, NetVLAD sidestepped manual labeling by mining Google Street View Time Machine imagery: GPS coordinates grouped photos of the same street across different years as positive pairs and distant streets as negatives under a weakly supervised triplet loss. On Pittsburgh 250k and Tokyo 24/7, NetVLAD decisively outperformed DBoW and classical VLAD under severe illumination and seasonal shifts—though higher GPU inference and memory costs, plus DBoW2's deep entrenchment in ORB-SLAM, kept NetVLAD largely outside real-time SLAM codebases at first.

---

## 13.5 Patch-NetVLAD, MixVPR, AnyLoc (2020–2023)

Once CNN place descriptors proved viable, Visual Place Recognition (VPR) research pushed hard toward cross-domain generalization across seasons, weather, and viewpoints.

In 2021, Hausler et al. introduced [Patch-NetVLAD](https://arxiv.org/abs/2103.01486), extracting multi-scale spatial patches and matching their local NetVLAD descriptors with geometric consistency checks—boosting Tokyo 24/7 Recall@1 by roughly 10 percentage points over NetVLAD at the cost of heavier matching time. In 2023, Ali-bey et al.'s [MixVPR](https://arxiv.org/abs/2303.02190) blended Transformer-style feature mixing to balance compact global descriptors with strong accuracy across benchmarks like Mapillary Street Level Sequences (MSLS) and the seasonal Nordland railway dataset.

Later in 2023, Keetha et al. took a qualitatively different leap with [AnyLoc: Towards Universal Visual Place Recognition](https://arxiv.org/abs/2308.00688), achieving broad generalization without any VPR-specific fine-tuning.

> 🔗 **Borrowed.** AnyLoc pairs off-the-shelf self-supervised ViT features from Oquab et al.'s [DINOv2](https://arxiv.org/abs/2304.07193) (Meta AI, 2023) with classical VLAD aggregation, bridging the BoW–VLAD lineage back to general-purpose vision foundation models.

Trained on massive web-scale image collections, DINOv2 learns rich visual representations that transfer widely (subject to pretraining data biases). Inspecting DINOv2's internal attention **facets**—query (Q), key (K), and value (V) projections alongside final tokens—Keetha et al. discovered that while Q and K facets emphasize low-level geometry, the value (V) facet preserves semantic invariance across extreme lighting and seasonal changes. Aggregating V-facet patch descriptors via VLAD yielded a single zero-shot model spanning seven or more disparate domains—from Pittsburgh and Tokyo streets to indoor factories, libraries, and underground garages—matching or surpassing task-specialized baselines.

Generalization soon expanded across sensor modalities as well: Lee et al.'s [(LC)²](https://arxiv.org/abs/2304.08660) (RA-L 2023) projected camera images and LiDAR scans into a shared 2.5D depth space so 2D cameras could localize inside LiDAR maps, supported by synchronized multi-modal benchmarks such as [ViViD++](https://arxiv.org/abs/2204.06183) (RA-L 2022) spanning visible, thermal, event, LiDAR, depth, and inertial streams.

---

## 13.6 Toward integrating place recognition and metric localization (2024–2025)

For over two decades, place recognition operated as an isolated black box inside SLAM: feed an image in, receive a candidate frame ID back, and leave metric pose estimation to separate keypoint matching and PnP.

By 2024–2025, that boundary began dissolving. Systems such as Berton et al.'s [EigenPlaces](https://arxiv.org/abs/2308.10832) (2023) and Izquierdo & Civera's [SALAD](https://arxiv.org/abs/2311.15937) (2023 arXiv / CVPR 2024) pushed global place descriptors toward viewpoint-invariant 6-DoF localization, while emerging pipelines began pairing place recognition directly with 3D Gaussian Splatting (3DGS) maps.

> 📜 **Prediction vs. outcome.** In FAB-MAP 2.0 (2011), Cummins and Newman scaled appearance-only loop closure up by more than an order of magnitude—from Oxford neighborhoods to a 1,000 km road trajectory—a scale later echoed in large-vocabulary DBoW2 SLAM runs. Yet scale alone did not cure appearance drift; deep learning supplied robustness to seasons and lighting, leaving universal invariance across unseen environments an ongoing challenge.

> 📜 **Prediction vs. outcome.** In NetVLAD's 2016 introduction, Arandjelović et al. named three prerequisites for deep place recognition: a tailored CNN architecture, abundant training imagery, and end-to-end training. NetVLAD supplied the architecture and weakly supervised objective, launching seven years of work on cross-season and viewpoint generalization—culminating in AnyLoc's 2023 demonstration that frozen foundation-model features could generalize across diverse environments without fine-tuning, marking a decisive pivot from bespoke models to universal visual backbones.

---

## Still open

**Extreme seasonal and lighting change.** Benchmarks like Nordland (Norwegian railways in summer versus winter) and Oxford RobotCar (spanning a full year of weather) have exposed the same vulnerability for over a decade. Although DINOv2-based descriptors narrowed the gap substantially, maintaining consistently high precision and recall between snowbound winter and lush summer foliage remains unsolved as of 2026.

**Integration of place recognition and metric localization.** Most deployed SLAM pipelines still treat place recognition strictly as coarse retrieval, relying on downstream local descriptor matching and PnP to recover metric 6-DoF pose. Emerging 2023–2025 architectures attempt to unify retrieval and pose regression in a single representation, yet whether unified models can match geometric pipelines across varied sensors and latency budgets remains context-dependent.

**Privacy of recognizable place representations.** Inversion and reconstruction attacks can recover recognizable imagery—or even 3D room geometry—from stored VPR feature descriptors, raising serious privacy concerns for robots operating in homes, hospitals, and offices. Designing compact descriptors that preserve matching accuracy while resisting visual inversion remains an open problem.

---

By the late 2010s, three classical SLAM pillars stood mature: ORB-SLAM for feature-based tracking, DSO for direct photometry, and KinectFusion's descendants for dense RGB-D geometry. Place recognition evolved somewhat apart—imported from web image retrieval to give all three systems loop closure—which enabled it to adopt deep learning faster than core tracking and bundle adjustment. When AnyLoc debuted in 2023, it still stood on Josef Sivic's shoulders: from Video Google (2003) to NetVLAD (2016) to foundation-model descriptors.

Yet a far more disruptive challenge to classical geometry had already begun in 2014—not from a SLAM group, but from a graduate student at NYU who asked whether a neural network could infer 3D depth from a single photograph without epipolar geometry at all.

---

# Chapter 14. Monocular Depth Estimation: From Eigen to Depth Anything

Through the mid-2010s, the feature-based, direct, RGB-D, and place-recognition lineages each matured around explicit geometry: ORB-SLAM triangulated points via epipolar constraints, DSO enforced photometric consistency, KinectFusion registered surfaces with ICP, and geometric verification anchored loop closures. Machine learning played almost no part in core depth or pose estimation. When that boundary finally shifted, the catalyst came not from a SLAM paper, but from a computer vision experiment by a graduate student at NYU.

Inferring depth from a single photograph was among the oldest ill-posed problems in vision: perspective projection collapses the third dimension, leaving infinitely many 3D scenes consistent with the same 2D image. Yet humans judge depth effortlessly with one eye using perspective convergence, occlusion, texture gradients, and shading. In 2014, David Eigen at NYU asked whether a convolutional neural network could learn those statistical cues directly from data—launching a lineage that would reshape SLAM initialization and scale recovery a decade later.

---

## 14.1 Eigen 2014 — early CNN depth

Data-driven monocular depth estimation did not start in 2014. Nearly a decade earlier, Ashutosh Saxena at Stanford had introduced [Make3D, combining support vector machines (SVMs) with a Markov Random Field (MRF) to predict coarse, piecewise-planar depth from single outdoor images](https://papers.nips.cc/paper/2921-learning-depth-from-single-monocular-images) (2005), establishing the pre-deep-learning benchmark.

In 2014, David Eigen, Christian Puhrsch, and Rob Fergus replaced those hand-engineered components with a two-stage CNN ([Eigen et al. 2014](https://arxiv.org/abs/1406.2283)). A coarse network predicted global scene layout, and a fine network refined local edges and object boundaries. Trained on roughly 120,000 frames across 464 indoor scenes from NYU Depth v2, the network substantially outperformed Make3D and proved that end-to-end CNNs could extract metric 3D structure from monocular pixels.

Yet one flaw persisted from the outset: **scale ambiguity**. Because absolute depth predictions remained tied to the training corpus and camera intrinsics, a network trained on indoor NYU bedrooms often misjudged metric scale when shown an outdoor street—a limitation still central to monocular metric depth a decade later in 2024.

> 🔗 **Borrowed.** Eigen (2014) inherited its task formulation directly from Make3D (Saxena 2005), swapping the SVM and MRF for a two-scale CNN while keeping the problem definition and standard evaluation metrics—RMSE and threshold accuracy—intact.

---

## 14.2 Garg → Godard — self-supervised depth

Supervised depth learning quickly hit a data bottleneck. While Kinect captured clean indoor depth maps, its infrared pattern washed out outdoors in sunlight, making large-scale outdoor RGB-D datasets costly and scarce.

In 2016, [Ravi Garg at UCL bypassed ground-truth depth labels](https://arxiv.org/abs/1603.04992) by turning stereo image pairs into a self-supervised training signal: predict a depth map from the left view, warp it across the known stereo baseline to reconstruct the right view, and train on the photometric reconstruction error against the real right image.

At UCL, Clément Godard refined that idea into **MonoDepth** ([Godard et al. 2017](https://doi.org/10.1109/CVPR.2017.699)), enforcing left–right consistency between depths predicted independently from each stereo image and combining L1 error with structural similarity (SSIM) to stabilize textureless surfaces. Stereo pairs were needed only during training; at test time, MonoDepth inferred depth from a single image while outperforming contemporary self-supervised baselines on KITTI.

> 🔗 **Borrowed.** Garg and Godard adapted their photometric training objective directly from classical stereo matching, repurposing the intensity-consistency assumptions of disparity estimation—[systematized by Scharstein and Szeliski (2002)](https://vision.middlebury.edu/stereo/taxonomy-IJCV.pdf)—as a differentiable supervisory signal for neural networks.

Two years later, [*MonoDepth2* (Godard et al. 2019, ICCV)](https://arxiv.org/abs/1806.01260) eliminated stereo cameras altogether in favor of raw monocular video. Training a depth network and a relative-pose network jointly to minimize photometric reprojection loss across adjacent frames, MonoDepth2 introduced two crisp mechanisms: **minimum reprojection loss**, which selects the lowest-error source frame per pixel to handle occlusions cleanly, and **auto-masking**, which ignores pixels moving at the same velocity as the camera (including static scenes observed by a stationary camera).

Even so, self-supervised video training carried clear blind spots: moving vehicles and specular reflections broke brightness constancy, featureless sky offered no gradient, and monocular video alone could recover depth only up to an unknown scale factor.

---

## 14.3 MiDaS — mixing datasets

Single-dataset models remained trapped inside their own visual domains until [Ranftl et al. 2020](https://doi.org/10.1109/TPAMI.2020.3019967) introduced **MiDaS** (*Mixing Datasets for Zero-shot Cross-dataset Transfer*). Led by René Ranftl at Intel, MiDaS asked how one depth network could learn simultaneously from wildly incompatible data sources.

Incompatible scales stood in the way: NYU provided indoor metric meters, KITTI supplied sparse outdoor LiDAR returns, ReDWeb offered uncalibrated stereo disparity from web videos, and MegaDepth stored up-to-scale SfM reconstructions. Training naively across those targets would feed the network contradictory supervision.

Ranftl resolved the clash with an **affine-invariant loss**. Before computing error, MiDaS normalizes both predicted and ground-truth disparity maps per image—subtracting the median to remove global shift and dividing by the mean absolute deviation from that median to factor out unknown scale. Stripping away absolute units freed the network to learn consistent relative depth ordering across radically different scenes.

Trained across multiple datasets—and expanding to as many as 12 datasets in later iterations—MiDaS achieved strong zero-shot generalization from cluttered rooms to outdoor landscapes, albeit strictly in relative rather than metric depth. In 2021, Ranftl's group followed up with [**DPT** (Dense Prediction Transformer)](https://arxiv.org/abs/2103.13413), swapping MiDaS's convolutional backbone for a Vision Transformer (ViT). DPT powered MiDaS v3 and its v3.1 (2022) refinement, delivering substantial gains in fine spatial structure.

> 🔗 **Borrowed.** MiDaS v3 adopted a ViT encoder via DPT, just as Depth Anything later adopted a DINOv2-pretrained encoder. Backbone upgrades became a primary driver of accuracy in foundation-era vision, and DPT (Ranftl 2021) offered one of the earliest large-scale demonstrations in dense depth prediction.

---

## 14.4 Depth Anything — foundation scale

In January 2024, Lihe Yang's team at TikTok Research scaled data-centric depth estimation to foundation proportions with **Depth Anything** ([Yang et al. 2024](https://arxiv.org/abs/2401.10891)). Pairing 1.5M labeled images merged across existing datasets with 62M unlabeled images, the pipeline trained on teacher-generated pseudo-labels regularized by auxiliary semantic-segmentation features.

With a 335M-parameter ViT-L backbone, Depth Anything surpassed MiDaS and prior models across KITTI, NYU, ScanNet, and DIODE—prioritizing broad zero-shot accuracy over real-time inference speed. Months later, [**Depth Anything v2**](https://arxiv.org/abs/2406.09414) trained a high-capacity teacher exclusively on synthetic datasets (including Virtual KITTI and Hypersim) before distilling pseudo-labels onto real images, capturing crisp boundaries, thin structures, and reflective or transparent materials that real sensors struggle to annotate.

Like MiDaS, base Depth Anything predicts relative depth without metric scale. To bridge back to metric units, [**ZoeDepth** (Shariq Farooq Bhat et al. 2023)](https://arxiv.org/abs/2302.12288) combined relative pretraining with domain-routed metric-bin heads, [**Depth Anything v2** (2024)](https://arxiv.org/abs/2406.09414) released metric checkpoints fine-tuned on metric datasets, and [**Metric3D v2** (2024)](https://arxiv.org/abs/2404.15506) normalized focal-length differences via a canonical camera space before rescaling predictions at test time. Still, generalizing metric scale reliably across unseen cameras and scenes remained a separate challenge.

---

## 14.5 Re-entry into SLAM

Once monocular depth networks matured, they flowed straight back into SLAM—starting with CNN-SLAM in 2017 and accelerating through the 2020s. Monocular SLAM normally stalls until camera translation builds enough parallax to triangulate initial points, and even then its scale remains arbitrary.

Injecting a learned depth prior on frame one resolves initial structure immediately—and if the depth model is metric or calibrated against a known reference, it anchors metric scale from the start. Follow-on systems building on [DROID-SLAM (Teed & Deng, 2021)](https://arxiv.org/abs/2108.10869), which couples recurrent optical flow with bundle adjustment, demonstrated how monocular depth priors tighten geometric initialization, while metric-calibrated predictions can serve as periodic scale anchors to curb monocular scale drift (unlike purely relative models such as MiDaS, which still need an external scale cue).

> 📜 **Prediction vs. outcome.** Eigen's 2014 paper anticipated fusing depth prediction with complementary 3D cues like surface normals, a multi-task thread later explored by PAD-Net and VPD. By 2024, however, scaling shared self-supervised ViT backbones proved far more decisive than explicit multi-task heads—shifting the field along a different axis than originally sketched.

> 📜 **Prediction vs. outcome.** MiDaS (2020) deliberately sacrificed absolute scale via its scale-and-shift-invariant loss to unlock cross-dataset relative depth. Subsequent work like ZoeDepth, metric Depth Anything v2, and Metric3D v2 restored metric predictions through targeted fine-tuning and canonical camera transforms, yet reliable metric generalization across arbitrary unseen cameras remains an active frontier.

---

## Still open

**Depth on reflective and transparent surfaces.** Glass, water, and mirrors violate ordinary surface shading because pixel appearance originates behind or off the surface rather than on it. Even with synthetic training corpora, foundation-scale models still suffer severe structural errors on reflective scenes, and specialized remedies such as [ClearGrasp (Sajjan et al. 2020)](https://arxiv.org/abs/1910.02550) fall short of a general solution.

**Separating ego-depth and object-depth in dynamic scenes.** Passing cars and pedestrians break the static-world assumption behind photometric self-supervision. Most self-supervised pipelines mask moving regions out rather than modeling them; despite efforts such as [Ranjan et al. (2019)](https://arxiv.org/abs/1805.09806) to disentangle ego-motion from independent object motion, robust dynamic depth estimation remains difficult in practice.

**Generalization of metric scale.** While ZoeDepth, metric Depth Anything v2, and Metric3D v2 made major strides when intrinsics are known, real-world footage from uncalibrated CCTV or archival cameras frequently lacks reliable metadata. Recovering accurate metric depth invariant to both domain shift and unknown camera models remained one of the field's central open problems in 2025.

---

Even while monocular depth networks were progressing from Eigen to Depth Anything, a much bolder question had already gripped the community starting in 2015: why stop at predicting depth, when a neural network might skip feature extraction, optimization, and map building altogether to regress camera pose straight from a single image? That provocation began with [PoseNet](https://arxiv.org/abs/1505.07427).

---

# Chapter 15. End-to-End Learning: From PoseNet to SfMLearner

Once Eigen demonstrated that a convolutional network could infer metric depth from raw pixels—and self-supervised pipelines soon began extracting geometric signals from unlabeled video—researchers posed an even bolder question: instead of merely predicting depth or recognizing revisited places, could a single neural network perform the entire SLAM task end to end? Between 2015 and 2018, dozens of papers chased that vision, and almost all ran into the same walls.

The wave broke at ICCV 2015 in Santiago de Chile, when Alex Kendall, a doctoral student working with Roberto Cipolla at the Cambridge Computer Laboratory, presented [Kendall et al. 2015. PoseNet](https://doi.org/10.1109/ICCV.2015.336). Trained on Google Street View and campus imagery, PoseNet regressed a 6-DoF camera pose directly from a single photograph—implying that one neural network might replace thirty years of feature extraction, RANSAC matching, bundle adjustment, and map maintenance.

---

## 15.1 PoseNet

Riding the momentum of [AlexNet (Krizhevsky et al. 2012)](https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks), PoseNet repurposed visual representations learned for ImageNet object recognition directly for camera localization.

> 🔗 **Borrowed.** PoseNet takes [GoogLeNet (Inception, Szegedy et al. 2014)](https://arxiv.org/abs/1409.4842) as its backbone, swapping out the softmax classification head for a 7-dimensional regressor predicting 3D translation (x, y, z) and a 4-component orientation quaternion—adapting an ImageNet feature hierarchy straight into a pose estimator.

Evaluated on Kendall's Cambridge Landmarks dataset—spanning King's College Chapel, city streets, and a former hospital—PoseNet achieved roughly 2 m translation error and 5–8° orientation error depending on the scene (§5 of the original paper), running in 5 ms on a single GPU with no feature matching, RANSAC, or map lookup.

Successive papers tackled PoseNet's rough edges. [Bayesian PoseNet (Kendall & Cipolla 2016)](https://arxiv.org/abs/1509.05909) used Monte Carlo Dropout to produce pose uncertainty estimates; [Walch et al.'s LSTM PoseNet](https://arxiv.org/abs/1611.07890) (released in 2016 and published at ICCV 2017) applied LSTMs over spatial feature maps within a single image rather than across temporal video frames; and [Kendall and Cipolla's 2017 study](https://arxiv.org/abs/1704.00390) replaced hand-tuned translation–rotation loss weights with a geometric reprojection loss comparing 3D scene points projected under predicted versus ground-truth poses (distinct from photometric brightness losses).

Even with those refinements, a stark accuracy gap remained: on the very same Cambridge scenes, classical structure-based methods such as [Active Search (Sattler et al. 2012)](https://www.graphics.rwth-aachen.de/media/papers/sattler_eccv12_preprint_1.pdf) and DenseVLAD localized within roughly 0.2 m—an order of magnitude sharper than PoseNet's multi-meter errors, exposing the limits of regressing absolute coordinates from an isolated image.

---

## 15.2 DeepVO

To move beyond single-frame absolute regression, Sen Wang and colleagues at Heriot-Watt University turned to temporal image sequences in [Wang et al. 2017. DeepVO](https://arxiv.org/abs/1709.08429) (ICRA 2017). A CNN modeled after FlowNet extracted optical-flow cues across consecutive frame pairs, feeding into an LSTM that accumulated motion history to regress relative visual odometry end to end.

> 🔗 **Borrowed.** DeepVO supervises its network against KITTI's GPS/IMU ground-truth trajectories while borrowing its paired-frame feature extractor directly from the optical-flow architecture of [FlowNet (Dosovitskiy et al. 2015)](https://arxiv.org/abs/1504.06852).

By carrying temporal context across frames, the LSTM was meant to curb drift—and on selected KITTI test stretches resembling the training set in driving speed, lighting, and urban layout, DeepVO posted lower drift than DVO-SLAM or VISO2-M. Once deployed outside those familiar motion and appearance regimes, however, that learned temporal memory turned into systematic bias.

That same year, Tinghui Zhou at UC Berkeley bypassed ground-truth pose labels altogether in [Zhou et al. 2017. SfMLearner](https://arxiv.org/abs/1704.07813), jointly training depth and ego-motion networks via self-supervised photometric view synthesis.

> 🔗 **Borrowed.** Both SfMLearner and [DSO (Engel et al. 2018)](https://arxiv.org/abs/1607.02565) measure brightness discrepancy across geometrically warped pixels—yet DSO optimizes poses and inverse depths directly at test time, whereas SfMLearner uses photometric warping error as a training loss to regress depth and relative motion. SfMLearner's self-supervised objective lived on in monocular depth estimators like MonoDepth2, while DROID-SLAM later retained differentiable geometry under supervised optical-flow and pose training.

Even so, evaluating SfMLearner on short multi-frame VO snippets remained a world apart from running full-trajectory SLAM like ORB-SLAM with long-term mapping and loop closure.

---

## 15.3 Geometry, generalization, and uncertainty

By 2019–2020, critiques from researchers such as [Sattler et al. (2019)](https://arxiv.org/abs/1903.07504)—whose analysis targeted single-image absolute pose regression rather than sequential learned odometry—crystalized three foundational weaknesses across pure end-to-end learning pipelines.

**First: absence of inductive bias.** Classical SLAM builds directly on hard-won mathematical priors: epipolar geometry, SE(3) rigid-body kinematics, projective invariance, and temporal continuity. An unconstrained CNN trained from ImageNet weights had to rediscover 3D metric geometry implicitly from finite data, leaving it unclear whether a network that nailed a benchmark pose truly understood 3D structure or had merely memorized color, texture, and lighting shortcuts.

**Second: generalization beyond the training distribution.** A scene-specific PoseNet memorizes one environment's coordinate frame and cannot transfer to a new city block. Even sequential learned odometry—which estimates relative motion—requires fresh validation whenever camera intrinsics, speed profiles, or visual domains shift, motivating cross-dataset designs like [TartanVO](https://proceedings.mlr.press/v155/wang21h.html) (CoRL 2020). While classical ORB-SLAM can also fail when texture vanishes or exposure spikes, geometric systems expose explicit failure states and recovery routines rather than silently drifting out of distribution.

**Third: validating uncertainty estimates.** Downstream motion planners and obstacle avoidance stacks require calibrated uncertainty alongside pose estimates. EKFs propagate covariance explicitly and factor graphs expose local Hessian approximations (each subject to modeling assumptions), whereas Bayesian PoseNet's dropout variance—though helpful for flagging unfamiliar inputs or rough error trends—offers no reliable calibration guarantee once inputs leave the training distribution.

---

## 15.4 Reassessment

Kendall completed his PhD at Cambridge in 2017 and co-founded Wayve later that year, broadening [his research](https://alexgkendall.com/) from camera pose regression into end-to-end imitation learning and world models for autonomous driving.

Meanwhile, systems like [CNN-SLAM (Tateno, Tombari, Laina, and Navab, 2017)](https://arxiv.org/abs/1704.03489) pointed toward a more pragmatic middle ground: blending CNN-predicted dense depth with direct monocular SLAM measurements, leaning on learned priors in textureless regions while trusting geometric alignment where gradients were strong—and anchoring absolute scale from the network's depth predictions.

> 📜 **Prediction vs. outcome.** PoseNet (2015) outlined three next steps: scaling training data via multiview geometry, adding probabilistic uncertainty, and probing the scene-capacity limits of a single network. Bayesian PoseNet (2016) tackled probabilistic uncertainty, yet Walch et al.'s LSTM PoseNet explored spatial rather than temporal recurrence, leaving PoseNet's core accuracy and generalization gaps unresolved against structure-based localization.

Even as naive pose-regression systems stalled, individual ideas from the 2015–2017 wave survived in redesigned forms: SfMLearner's photometric self-supervision seeded MonoDepth2 (Godard 2019), differentiable geometry powered supervised optimization in DROID-SLAM (Teed & Deng 2021), and recurrent temporal features resurfaced in learned visual-inertial odometry.

> 📜 **Prediction vs. outcome.** In SfMLearner (2017), Zhou flagged moving objects and photometric noise as key open problems. Follow-on self-supervised networks such as [GeoNet (Yin & Shi 2018)](https://arxiv.org/abs/1803.02276) made partial headway by jointly estimating depth, optical flow, and ego-motion while disentangling rigid background from dynamic regions.

---

## 15.5 The lesson that remained

By around 2020, a clear engineering consensus had emerged: keep explicit 3D geometry in the loop, and deploy neural networks where classical heuristics struggle—feature extraction, dense correspondence, and learned priors.

> 🔗 **Borrowed.** CodeSLAM (Bloesch 2018) and DROID-SLAM (Teed & Deng 2021) exemplify this synthesis: both preserve explicit factor-graph or bundle-adjustment optimization while delegating dense depth representation (CodeSLAM) or dense optical-flow updates (DROID-SLAM) to neural networks, restoring the geometric constraints that PoseNet had discarded.

Classical pipelines did not win unconditionally: PoseNet could still produce coarse poses under heavy motion blur or severe lighting shifts where keypoint matchers collapsed. Yet Sattler et al. (2019) showed that across standard accuracy benchmarks, pure absolute pose regression fell far short of structure-based localization—turning on whether a task prized graceful degradation or centimeter precision.

The decisive boundary lay between *regressing pose directly from raw appearance* and *solving for pose from learned correspondences under explicit geometric constraints*. CodeSLAM and DROID-SLAM committed firmly to the latter.

---

## Still open

**Which inductive bias to inject, and how.** Even when geometry stays inside the system, it remains unsettled which constraints—from rigid-body motion to epipolar geometry—should be hard-coded versus learned, and at which layer. Foundation models and 3DGS-based SLAM systems continue shifting that boundary, testing how much geometry can live directly inside a learned scene representation.

**Calibration of learned uncertainty.** Bayesian PoseNet left uncertainty calibration unfinished. Ensuring that neural uncertainty estimates track true geometric error reliably—especially under out-of-distribution shifts critical to autonomous driving—remained unresolved as of 2026.

**Redefining "end-to-end."** PoseNet equated "end-to-end" with a single feedforward mapping from image to pose. Since the arrival of 3D foundation models around 2023, the label itself has shifted, reopening the debate over which SLAM modules belong inside a differentiable network and which should stay explicit algorithms.

---

The hard lessons of 2015–2018 gave birth to a new hybrid paradigm: pair learned representations with classical bundle adjustment rather than replacing geometry outright. Released by Andrew Davison's lab at Imperial College London in 2018, CodeSLAM embodied that exact division of labor—launching the hybrid synthesis examined next in Chapter 16.

---

# Chapter 16. Combining Learning and Geometry: From CodeSLAM to DROID-SLAM

When Michael Bloesch presented CodeSLAM at CVPR 2018, he was working under Andrew Davison at Imperial College London's Dyson Robotics Lab—the very group where Richard Newcombe had built DTAM in 2011 and where Jan Czarnowski (DeepFactors, 2020), Edgar Sucar, and Tristan Laidlow would soon carry dense learned mapping forward. Bloesch's system bridged two traditions that had rarely spoken the same language: Davison's view of SLAM as probabilistic inference, honed since 2002, and the mid-2010s conviction that visual scene representations could be learned from data.

---

## 16.1 CodeSLAM — latent code and the map

Traditional monocular SLAM treated depth directly as an optimization variable, whether across a few hundred sparse landmarks or, as in [DTAM](https://www.doc.ic.ac.uk/~ajd/Publications/newcombe_etal_iccv2011.pdf) (Newcombe et al. 2011), at every pixel. That choice meant the state space scaled with image resolution: a single 640×480 dense depth map packed 307,200 independent variables, inflating compute, sharpening sensitivity to initialization, and leaving little room to enforce prior structure.

Rather than optimizing each pixel's depth directly, [Bloesch et al. 2018. CodeSLAM](https://doi.org/10.1109/CVPR.2018.00271) optimized a compact **latent code** that generated the entire depth map. Trained on real depth distributions, a variational autoencoder (VAE) learned a low-dimensional bottleneck approximating the manifold of plausible depth maps. Restricting inference to that manifold compressed the optimization space from hundreds of thousands of per-pixel depths to a few hundred latent variables.

> 🔗 **Borrowed.** CodeSLAM's latent depth representation builds on the encoder-decoder bottleneck introduced in [Kingma & Welling 2013. VAE](https://arxiv.org/abs/1312.6114). Although training follows the standard VAE objective, during SLAM inference **z** becomes a deterministic MAP optimization variable without stochastic sampling. A framework conceived for generative image modeling was thus repurposed, years later, as a compact parameterization for geometric SLAM optimization.

In operation, the VAE encoder extracts an initial latent code **z** from each keyframe image, and the decoder reconstructs a dense depth map from **z**. The system then jointly optimizes camera poses and latent codes by minimizing photometric inconsistency across views alongside a prior penalty that pulls **z** toward a standard normal distribution:

$$E(\mathbf{z}, T) = \sum_{i,j} \rho\bigl(I_j(\pi(T_{ij}, D_\mathbf{z}(u_i), u_i)) - I_i(u_i)\bigr) + \lambda \|\mathbf{z}\|^2$$

Here $D_\mathbf{z}$ denotes the decoder, $\pi$ the camera projection, $\rho$ a robust cost function, and $T_{ij}$ the relative pose between keyframes. The regularization term $\lambda\|\mathbf{z}\|^2$ corresponds to the negative log-likelihood of the standard normal prior $p(\mathbf{z}) = \mathcal{N}(0, I)$, arising directly from MAP inference under a Gaussian prior.

> 🔗 **Borrowed.** Dellaert and Kaess's [GTSAM](https://gtsam.org/tutorials/intro.html) factor graph would later provide the backend structure for DeepFactors (§16.2). Czarnowski reformulated CodeSLAM's joint pose-latent optimization as an explicit factor graph in which a learned latent variable appeared alongside conventional pose nodes, letting graph edges capture the coupling between learned and geometric states.

CodeSLAM outperformed earlier methods at recovering dense geometry from sparse views, yet it could not run in real time—both VAE evaluation and the iterative optimization loop were too slow, a limitation the authors acknowledged openly.

> 📜 **Prediction vs. outcome.** CodeSLAM proved that dense SLAM could embed a compact learned representation inside geometric optimization, even though speed and scale remained bottlenecks. DeepFactors (2020), from the same Imperial group, pushed closer to real-time operation without reaching deployment-grade throughput. Teed and Deng at Princeton later achieved broad support across monocular, stereo, and RGB-D inputs via a different architecture altogether: pairing a learned correspondence frontend with Dense Bundle Adjustment (DBA).

---

## 16.2 DeepFactors — Imperial Dyson Lab, factor graph integration

Two years after CodeSLAM, Jan Czarnowski—also advised by Davison at the Imperial Dyson Robotics Lab—released [Czarnowski et al. 2020. DeepFactors](https://doi.org/10.1109/LRA.2020.2969036) in an effort to turn CodeSLAM's core idea into a complete SLAM pipeline.

DeepFactors embedded CodeSLAM's latent-depth parameterization and joint optimization inside an explicit factor graph, separated tracking from mapping, and added a keyframe-selection policy. On an NVIDIA GTX 1080, frame-to-keyframe tracking ran at roughly 250 Hz, yet computing the network Jacobian took several hundred milliseconds per keyframe and stalled the mapping loop. Even so, DeepFactors proved the design's viability and pointed toward a broader lesson: rather than replacing the entire SLAM stack end to end, learning could be injected selectively into modular geometric optimization.

Around the same time, Daniel Cremers's group at TU Munich reached that same architectural principle from the opposite direction. Where Davison's lab embedded VAE latent codes into a factor graph, Cremers's team injected neural predictions into its 2016 direct sparse odometry framework, [DSO](https://arxiv.org/abs/1607.02565). [Yang, Wang, Stückler, Cremers 2018. DVSO](https://arxiv.org/abs/1807.02570) fed monocular neural depth into DSO as "virtual stereo" observations, and [Yang, von Stumberg, Wang, Cremers 2020. D3VO](https://arxiv.org/abs/2003.01060) went further by adding self-supervised predictions of depth, pose, and uncertainty as extra factors in DSO's graph. Subsequent systems—[Wimbauer et al. 2021. MonoRec](https://arxiv.org/abs/2011.11814) and [Wimbauer et al. 2023. Behind the Scenes](https://arxiv.org/abs/2301.07668)—carried this direct-plus-learned paradigm into dynamic dense reconstruction and single-view density fields. Despite having no institutional overlap with Imperial, Munich arrived at the same hybrid principle: keeping classical optimization intact while feeding it learned priors.

Across the Atlantic, a 2020 optical-flow network from Princeton soon supplied the building block for a very different hybrid SLAM architecture in 2021.

---

## 16.3 RAFT — recurrent optical flow

At ECCV 2020, Zachary Teed and Jia Deng at Princeton introduced [Recurrent All-Pairs Field Transforms (RAFT)](https://arxiv.org/abs/2003.12039). Although built purely for optical-flow estimation rather than SLAM, RAFT's architecture soon became the engine behind DROID-SLAM. Its pipeline rests on three components:

1. **Feature encoder:** a convolutional network extracts dense feature maps from each input image.
2. **Correlation volume:** pixel-to-pixel similarities across all pairs are compiled into a 4D correlation volume organized as a four-level pyramid.
3. **Update operator:** a Gated Recurrent Unit (GRU) repeatedly queries the correlation pyramid and refines the predicted flow field.

The phrase "all-pairs" captures what set RAFT apart. Rather than restricting search to a local neighborhood or relying on coarse-to-fine warping as PWC-Net had done, RAFT evaluates every candidate correspondence and refines the flow field at a fixed one-eighth image resolution before upsampling. Against the strongest published baselines of the time, RAFT cut KITTI F1-all error by 16% and Sintel final-pass endpoint error by 30%.

RAFT originated outside SLAM, yet Teed noticed a striking structural parallel between its recurrent update operator and iterative bundle adjustment: a GRU incrementally refining a pixel flow field looked remarkably like an optimizer iteratively refining camera poses and scene depth.

---

## 16.4 DROID-SLAM — the update operator and BA

At NeurIPS 2021, Teed and Deng turned that insight into [DROID-SLAM](https://arxiv.org/abs/2108.10869)—short for "Differentiable Recurrent Optimization-Inspired Design"—making the division of labor between learning and geometry explicit.

Its frontend mirrors RAFT: a CNN encoder extracts feature maps, builds an all-pairs correlation volume, and runs a GRU update operator to refine dense optical flow. Unlike RAFT, however, DROID-SLAM estimates flow simultaneously across every edge of a keyframe graph rather than between a single isolated image pair. Its backend then runs Dense Bundle Adjustment (DBA) over keyframe poses and per-pixel inverse depths, taking the GRU's 2D flow correspondences as geometric constraints and solving the resulting linear system via the Schur complement. What binds the two halves together is the **DBA layer**: flow estimates and confidence weights from the GRU flow into DBA, and the updated poses and depths feed back to re-anchor the next GRU iteration in a tightly coupled recurrent loop.

> 🔗 **Borrowed.** The core idea behind DBA dates back a decade to Newcombe's DTAM (2011), an early milestone in per-pixel photometric bundle adjustment. DROID-SLAM paired that dense optimization structure with far more resilient correspondences from learned flow, despite having no direct institutional lineage connecting Teed to Newcombe.

> 🔗 **Borrowed.** Teed and Deng carried DROID-SLAM's update operator straight over from RAFT. All-pairs recurrent refinement, originally crafted for two-frame optical flow, proved naturally compatible with the iterative updates of bundle adjustment.

On the EuRoC MAV benchmark, DROID-SLAM achieved a lower RMSE ATE than ORB-SLAM3, the reigning state of the art, while demonstrating strong accuracy on synthetic TartanAir sequences and real indoor and outdoor scenes—especially under lighting shifts and low-texture surfaces where sparse feature matchers falter. In a later Handbook retrospective, Teed noted that on EuRoC `V1_02`, global optimization dropped frontend-only ATE from 16.5 cm to 1.2 cm: classical bundle adjustment reached single-centimeter precision once fed with learned dense correspondences.

That division of labor separated the 2021 hybrid architecture from the 2015 end-to-end wave. Whereas PoseNet tried to regress camera pose directly from pixels without geometric constraints—and failed to generalize—Teed and Deng assigned dense feature extraction and correspondence matching to neural networks while leaving geometric consistency and uncertainty propagation to bundle adjustment. Neural modules replaced hand-crafted descriptors, not the underlying optimization geometry.

---

## 16.5 The Imperial Dyson Lab lineage

How did one laboratory end up bridging so many of these steps? Over the two decades following MonoSLAM in 2002, Andrew Davison's Dyson Robotics Lab at Imperial College London served as an incubator for successive waves of dense and learned SLAM:

- **Richard Newcombe** (Davison advisee, Imperial): DTAM (2011), [KinectFusion](https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/ismar2011.pdf) (2011); later Oculus → Meta Reality Labs.
- **Michael Bloesch** (Davison advisee, Imperial): CodeSLAM (2018), tactile and inertial SLAM research.
- **Jan Czarnowski** (Davison advisee, Imperial): DeepFactors (2020).
- **Edgar Sucar** (Davison group, Imperial): [iMAP](https://arxiv.org/abs/2103.12352) (2021), launching the NeRF-SLAM lineage.
- **Tristan Laidlow** (Davison group, Imperial): dense 3D reconstruction, later contributing to neural implicit SLAM.

Across those shifts—from sparse monocular landmarks to dense latent codes and neural implicit fields—the lab held fast to factor graphs and probabilistic uncertainty. In [FutureMapping](https://arxiv.org/abs/1803.11288) (2018) and [FutureMapping 2](https://arxiv.org/abs/1910.14139) (2019, with Ortiz), Davison articulated a vision of Spatial AI in which a map combines multiple geometric and semantic representations inside a single probabilistic graph; CodeSLAM and DeepFactors were early testbeds for that program.

By contrast, Teed and Deng built DROID-SLAM independently at Princeton. Yet Newcombe and Davison's DTAM stood as a clear conceptual precursor to DROID-SLAM's DBA—a reminder that technical lineages often cross-pollinate even without direct institutional ties.

---

## 16.6 2023–2025 — extensions after DROID

After DROID-SLAM, researchers pushed the hybrid paradigm along several distinct tracks—some swapping out its map representation, others accelerating its backend, and still others extending its DBA machinery to unconstrained video.

Several groups targeted the map representation itself. [GO-SLAM](https://arxiv.org/abs/2309.02436) (Zhang et al. 2023) kept DROID-SLAM's dense-flow tracking and augmented it with online loop closure, full bundle adjustment, and an Instant-NGP-style multi-resolution hash-encoded implicit map. [NICER-SLAM](https://arxiv.org/abs/2302.03594) (Zhu et al. 2023) pursued RGB-only dense SLAM from outside the DROID lineage altogether, optimizing tracking and mapping jointly over a single hierarchical neural implicit field. [SplaTAM](https://arxiv.org/abs/2312.02126) (Keetha et al. 2024) shifted to 3D Gaussian Splatting for the map and drove tracking via silhouette-guided differentiable rendering rather than dense optical flow, aligning it more closely with the 3DGS trajectory.

Within Princeton, the original DROID team focused instead on speed and memory. [DPV-SLAM](https://arxiv.org/abs/2408.01654) (Lipson, Teed, Deng 2024), built atop [DPVO](https://github.com/princeton-vl/DPVO) (Deep Patch Visual Odometry), replaced dense pixel grids with sparse learned patches and added proximity-based loop closure plus CUDA block-sparse BA, running roughly 2.5× faster with substantially lower memory than DROID-SLAM.

Meanwhile, a broader 2024–2025 wave emerged around Naver Labs' [DUSt3R](https://arxiv.org/abs/2312.14132) (Wang et al. 2023), which bypassed classical SfM pipelines by predicting 3D pointmaps directly from image pairs (examined in detail in Chapter 20). The same Revaud group extended pairwise inference to multi-view sequences with working memory in [Cabon et al. 2025. MUSt3R](https://arxiv.org/abs/2503.01661), aiming to handle both offline SfM and online VO/SLAM within one network. Even within this foundation-model ecosystem, DROID-style components resurfaced: [Li et al. 2024. MegaSAM](https://arxiv.org/abs/2412.04463) adapted DROID-SLAM's differentiable DBA to dynamic scenes and uncalibrated video by jointly optimizing camera intrinsics at inference time, and NVIDIA's [Huang et al. 2025. ViPE](https://arxiv.org/abs/2508.10934) fused DROID-SLAM's dense flow, cuvslam's sparse keypoints, and monocular depth predictions inside a single DBA backend to annotate YouTube-scale video. Together, these developments showed that Teed and Deng's 2021 separation of learned correspondence from geometric optimization had become a versatile template—even as parallel lineages like NICER-SLAM and SplaTAM tested whether implicit or Gaussian maps could replace it outright.

> 📜 **Prediction vs. outcome.** DROID-SLAM established an influential reference architecture by coupling differentiable DBA with end-to-end learned correspondence. Three years later, its creators streamlined the design in DPV-SLAM, while GO-SLAM, NICER-SLAM, and SplaTAM swapped the map representation for neural fields or Gaussian splats. By 2026, however, none of these variants on the "learned frontend plus classical backend" recipe had coalesced into a single general-purpose standard.

---

## Still open

**Out-of-distribution generalization.** Learned priors remain tethered to their training distributions. When environments diverge sharply from training data—in wide outdoor spaces, irregular textures, or nighttime scenes—the VAEs in CodeSLAM and DeepFactors can bias optimization toward wrong depths, and DROID-SLAM's flow estimator degrades as well. Diverse synthetic benchmarks such as TartanAir narrow the gap, yet a persistent sim-to-real divide meant that as of 2026 no learned SLAM system worked reliably across all environments.

**Real-time throughput at scale.** On an NVIDIA RTX 2080Ti, DROID-SLAM averages 10–15 fps and slows further as the keyframe graph expands, bottlenecked by DBA. As of 2026, that compute footprint remained out of reach for low-power mobile robots or AR/VR headsets demanding 30 Hz or more, and thinning keyframes or approximating BA inevitably trades away accuracy.

**Learned loop closure.** DROID-SLAM has no dedicated relocalization module; in his Handbook retrospective, Teed noted explicitly that "DROID-SLAM doesn't include any relocalization module, so large loops with lots of drift cannot be closed." Although its backend runs global BA across keyframes, severe accumulated drift prevents it from recovering the correspondences needed to snap large loops shut. Bridging the learned place-recognition lineage of Chapter 13 (such as NetVLAD) with DROID-style factor graphs in Chapter 16 remains an open integration challenge.

---

DROID-SLAM relied on inverse-depth keyframes—a potent dense representation in 2021—just as [NeRF](https://arxiv.org/abs/2003.08934) (Neural Radiance Field) was proposing a radically different alternative from computer graphics: encoding the entire 3D scene as a continuous function rather than as points, lines, planes, or meshes, and enforcing photometric consistency via differentiable rendering.

At Imperial College in 2021, Edgar Sucar reframed that graphics breakthrough as a SLAM problem: could a single MLP replace KinectFusion's TSDF voxel grid altogether? Fourteen months of work produced his answer—iMAP.

# Chapter 17. NeRF-Based SLAM

In 2021, Edgar Sucar at Imperial College shifted learned representations out of the tracking frontend and into *the map itself*. His iMAP system adapted NeRF—a technique born outside robotics—to turn an implicit neural field into a live SLAM map.

Just over a year earlier, in March 2020, Ben Mildenhall and his colleagues had posted [Mildenhall et al. 2020. NeRF](https://arxiv.org/abs/2003.08934) to arXiv, optimizing a continuous volumetric scene function from posed images to synthesize novel views. NeRF was conceived purely for offline rendering. At ICCV 2021, Sucar reframed it for SLAM, demonstrating that an implicit neural field could support joint optimization of both scene geometry and camera trajectory—in effect recasting the dense TSDF mapping of KinectFusion (Chapter 12) inside the weights of a neural network.

NeRF itself sat atop a sudden 2019 wave of coordinate-based 3D MLPs: [Park et al.'s DeepSDF](https://arxiv.org/abs/1901.05103) mapped 3D coordinates to signed distance, [Mescheder et al.'s Occupancy Networks](https://arxiv.org/abs/1812.03828) mapped them to occupancy probability, and [Sitzmann et al.'s SRN](https://arxiv.org/abs/1906.01618) stored local feature vectors rendered via differentiable ray marching. Mildenhall et al. unified this coordinate-field paradigm with volume-rendering integration and positional encoding to achieve photorealistic view synthesis. iMAP inherited that entire two-year lineage rather than any single paper.

---

## 17.1 NeRF: MLP-based spatial representation

At its core, NeRF encodes an entire 3D scene inside the weights of a single multilayer perceptron (MLP). Given a 3D position $(x, y, z)$ and viewing direction $(\theta, \phi)$, the network predicts local color $(r, g, b)$ and volume density $\sigma$. To turn those point queries into a rendered pixel, NeRF integrates along a camera ray leaving origin $\mathbf{o}$ in direction $\mathbf{d}$ over near and far bounds $t_n$ and $t_f$:

$$\hat{C}(\mathbf{r}) = \int_{t_n}^{t_f} T(t)\,\sigma\!\left(\mathbf{r}(t)\right) \mathbf{c}\!\left(\mathbf{r}(t), \mathbf{d}\right)\, dt$$

where $T(t) = \exp\!\left(-\int_{t_n}^{t} \sigma(\mathbf{r}(s))\, ds\right)$ is the accumulated transmittance—the probability that the ray travels to depth $t$ without hitting an occluding surface—approximated numerically by a piecewise Riemann sum.

> 🔗 **Borrowed.** The volume-rendering integral comes from the classic graphics paper [Kajiya & Von Herzen (1984)](https://courses.cs.duke.edu/cps296.8/spring03/papers/RayTracingVolumeDensities.pdf). For nearly four decades it served as a forward physics model for offline rendering; Mildenhall et al. made it differentiable, turning ray integration into an inverse optimization objective for reconstructing scenes from photographs.

Because standard MLPs struggle to represent high-frequency detail, Mildenhall et al. (2020) passed each spatial coordinate through a multi-frequency sine-cosine mapping before feeding it to the network, enabling sharp edges and fine textures:

$$\gamma(p) = \left(\sin(2^0 \pi p),\, \cos(2^0 \pi p),\, \ldots,\, \sin(2^{L-1} \pi p),\, \cos(2^{L-1} \pi p)\right)$$

> 🔗 **Borrowed.** Positional encoding appeared directly in Mildenhall et al. (2020). Later that year, [Tancik et al. (2020)](https://arxiv.org/abs/2006.10739) explained why Fourier features unlock high-frequency learning in coordinate MLPs through neural tangent kernel (NTK) theory in "Fourier Features Let Networks Learn High Frequency Functions."

Once trained against a per-pixel L2 photometric loss over posed input views, the MLP weights capture geometry and appearance with neither voxels nor meshes. Yet adapting the original NeRF to SLAM faced two steep hurdles: training took hours per scene, and camera poses were assumed known in advance from an external SfM pipeline such as COLMAP. A SLAM system had to recover camera poses and build the neural map together, near real time.

---

## 17.2 iMAP: early neural implicit SLAM

At ICCV 2021, Edgar Sucar of Imperial College's Dyson Robotics Lab answered that challenge with [Sucar et al. 2021. iMAP](https://doi.org/10.1109/ICCV48922.2021.00612). **iMAP** (Implicit MAP) ingested RGB-D streams and maintained a single MLP as its sole map representation, alternating between two tightly coupled optimization loops over that shared network.

In the *mapping* loop, iMAP samples rays from the latest keyframe alongside a random subset of past keyframes to update the MLP weights. In the *tracking* loop, it freezes those weights and optimizes the current camera pose against the rendering residual. Both loops minimize a combined photometric and geometric objective, $\mathcal{L}_{\text{color}} = \|\hat{C} - C\|_2^2$ and $\mathcal{L}_{\text{depth}} = \|\hat{D} - D\|_2^2$, using RGB-D depth measurements to anchor geometry during online updates.

As a proof of concept on small indoor rooms, iMAP succeeded, yet it immediately exposed two structural bottlenecks. Because every scene update modified the same global weights, learning a new room degraded previously mapped areas—a classic case of catastrophic forgetting that keyframe replay could only soften, never eliminate. Moreover, evaluating one monolithic MLP across an expanding space quickly exhausted its capacity and compute budget.
