<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>SLAM History Book — Spatial AI 계보 추적</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f7;
  --bg-sidebar: #f5f5f7;
  --bg-code: #f5f5f7;
  --bg-surface: #f5f5f7;

  --text: #1d1d1f;
  --text-body: rgba(0, 0, 0, 0.8);
  --text-muted: rgba(0, 0, 0, 0.56);
  --text-tertiary: rgba(0, 0, 0, 0.48);
  --text-heading: #1d1d1f;

  --accent: #0071e3;
  --link: #0066cc;

  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);

  --sidebar-width: 300px;
  --topbar-height: 52px;
  --progress-height: 3px;

  --shadow-elev: rgba(0, 0, 0, 0.22) 3px 5px 30px 0px;
}

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -0.022em;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  font-feature-settings: "kern", "liga", "calt";
  word-break: keep-all;
  overflow-wrap: break-word;
}

#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: var(--progress-height);
  background: linear-gradient(90deg, #0071e3, #2997ff);
  z-index: 10000;
  transition: width 0.1s linear;
  width: 0%;
}

#topbar {
  position: fixed;
  top: var(--progress-height);
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
}

#topbar .menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  margin-right: 12px;
  padding: 6px 10px;
  border-radius: 8px;
}

#topbar .menu-toggle:hover { background: rgba(0,0,0,0.04); }

#topbar .title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-heading);
  letter-spacing: -0.022em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#topbar .back-link {
  margin-left: 16px;
  color: var(--link);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  padding: 7px 14px;
  border-radius: 980px;
  border: 1px solid var(--border);
  letter-spacing: -0.014em;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

#topbar .back-link:hover {
  background: rgba(0, 113, 227, 0.06);
  border-color: var(--accent);
  color: var(--accent);
}

/* Language toggle — inline link style (no box) */
#topbar .lang-toggle {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  letter-spacing: -0.010em;
}
#topbar .lang-toggle a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 4px 2px;
  transition: color 0.15s;
  cursor: pointer;
}
#topbar .lang-toggle a:hover { color: var(--text); }
#topbar .lang-toggle a.active {
  color: var(--text-heading);
  font-weight: 600;
}
#topbar .lang-toggle .sep { color: var(--border-strong); }

#sidebar {
  position: fixed;
  top: calc(var(--progress-height) + var(--topbar-height));
  left: 0;
  width: var(--sidebar-width);
  height: calc(100vh - var(--topbar-height) - var(--progress-height));
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 999;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,0,0,0.16) transparent;
}

#sidebar::-webkit-scrollbar { width: 6px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.16); border-radius: 3px; }

#search-box {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.6);
  flex-shrink: 0;
}

#search-input {
  width: 100%;
  padding: 9px 12px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  font-family: inherit;
  letter-spacing: -0.016em;
  transition: border-color 0.15s, box-shadow 0.15s;
}

#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }
#search-input::placeholder { color: var(--text-muted); }

#toc-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 32px;
}

#toc-container::-webkit-scrollbar { width: 4px; }
#toc-container::-webkit-scrollbar-track { background: transparent; }
#toc-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

/* Chapter level (h1) */
.toc-item {
  display: block;
  padding: 8px 16px 8px 20px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.014em;
  border-left: 3px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  cursor: pointer;
}

/* Section (h2) */
.toc-item.toc-h2 {
  padding: 5px 16px 5px 36px;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: -0.012em;
}

.toc-item.toc-h2 + .toc-item:not(.toc-h2) { margin-top: 6px; }

.toc-item:hover {
  color: var(--text);
  background: rgba(0, 0, 0, 0.04);
}

.toc-item.toc-h2:hover { color: var(--text); }

.toc-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(0, 113, 227, 0.08);
  font-weight: 700;
}

.toc-item.toc-h2.active {
  font-weight: 500;
  color: var(--accent);
}

.toc-item.toc-hidden { display: none; }

.toc-group-label {
  display: block;
  padding: 22px 16px 6px 20px;
  font-size: 11px;
  font-weight: 700;
  color: rgba(0, 0, 0, 0.42);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.toc-group-label:first-child { padding-top: 8px; }
.toc-group-label.toc-hidden { display: none; }

.toc-no-results {
  padding: 20px 16px;
  color: var(--text-muted);
  font-size: 13.5px;
  text-align: center;
  display: none;
  letter-spacing: -0.014em;
}

#main-content {
  margin-left: var(--sidebar-width);
  margin-top: calc(var(--progress-height) + var(--topbar-height));
  min-height: calc(100vh - var(--topbar-height) - var(--progress-height));
  padding: 56px 56px 96px;
}

#content {
  max-width: 820px;
  margin: 0 auto;
}

#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  color: var(--text-heading);
  font-feature-settings: "ss01", "kern";
  scroll-margin-top: 72px;
}

#content h1 {
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  margin: 0 0 28px 0;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

#content h1:not(:first-of-type) {
  margin-top: 96px;
}

#content h1 + blockquote {
  border-left: none;
  background: transparent;
  text-align: center;
  font-size: 18px;
  color: var(--text-muted);
  padding: 8px 0 24px;
  letter-spacing: -0.018em;
}

#content h2 {
  font-size: 30px;
  font-weight: 600;
  line-height: 1.10;
  letter-spacing: -0.014em;
  margin: 56px 0 18px 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

#content h3 {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.16;
  letter-spacing: -0.012em;
  margin: 40px 0 12px 0;
}

#content h4 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -0.010em;
  margin: 28px 0 10px 0;
}

#content h5, #content h6 {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
  margin: 24px 0 8px 0;
}

#content p { margin: 0 0 16px 0; color: var(--text-body); }

#content a {
  color: var(--link);
  text-decoration: none;
  transition: color 0.15s;
}

#content a:hover { text-decoration: underline; text-underline-offset: 2px; }

#content ul, #content ol {
  margin: 0 0 16px 0;
  padding-left: 28px;
}

#content li { margin-bottom: 6px; color: var(--text-body); }
#content li > ul, #content li > ol { margin-top: 6px; margin-bottom: 6px; }

#content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 56px 0;
}

#content strong { color: var(--text); font-weight: 600; }

#content img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
  margin: 12px 0;
}

#content code {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.82em;
  letter-spacing: 0;
}

#content :not(pre) > code {
  background: var(--bg-code);
  padding: 2px 6px;
  border-radius: 5px;
  color: var(--text);
}

#content pre {
  background: var(--bg-code);
  border: none;
  border-radius: 12px;
  padding: 18px 20px;
  overflow-x: auto;
  margin: 0 0 20px 0;
  font-size: 13px;
  line-height: 1.55;
}

#content pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
}

#content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 20px 0;
  font-size: 15px;
  display: block;
  overflow-x: auto;
}

#content thead { background: var(--bg-surface); }

#content th {
  padding: 12px 16px;
  text-align: left;
  color: var(--text-heading);
  font-weight: 600;
  font-size: 14px;
  border-bottom: 1px solid var(--border-strong);
  letter-spacing: -0.012em;
}

#content td {

  letter-spacing: -0.016em;

#content blockquote {

}

#content blockquote p:last-child { margin-bottom: 0; }

#content blockquote strong { color: var(--accent); }

.katex { font-size: 1.05em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 20px 0; }

::selection { background: rgba(0, 113, 227, 0.20); color: var(--text); }

mark.search-highlight {

  color: inherit;
  padding: 1px 3px;
  border-radius: 3px;
}

/* Guide Overview (at top of content) */
.guide-overview {
  margin: 0 0 80px 0;
  padding: 0 0 48px 0;
  border-bottom: 1px solid var(--border);
}
.guide-overview .overview-header { margin-bottom: 44px; }
.guide-overview .overview-title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  color: var(--text-heading);
  margin: 0 0 10px 0;
}
.overview-group { margin-top: 36px; }

.overview-group-label {

  font-weight: 700;
  color: rgba(0, 0, 0, 0.42);
  text-transform: uppercase;
  letter-spacing: 0.08em;

.overview-chapter { margin: 0 0 22px 0; }
.overview-chapter:last-child { margin-bottom: 0; }
.overview-chapter-link {

  #content h2 { font-size: 26px; margin-top: 44px; }

  #content h4 { font-size: 17px; }

@media (max-width: 600px) {
  body { font-size: 16px; }
  #content h1 { font-size: 30px; }
  #content h2 { font-size: 22px; }

  #main-content { padding: 20px 20px 48px; }

@media print {
  #progress-bar, #topbar, #sidebar, #sidebar-overlay, #search-box, .menu-toggle { display: none !important; }
  #main-content { margin: 0 !important; padding: 0 !important; }
  #content { max-width: 100%; color: #000; }

  #content a { color: #1a0dab; text-decoration: underline; }
  #content pre, #content code { background: #f5f5f7; color: #000; border: none; }

# Ch.0 — SLAM Solved?

2026년에는 핸드폰 카메라로 방을 비추면 AR 화면에 띄운 가상 물체가 벽에 붙은 채 움직이지 않는다. 실내 배송 로봇은 미리 받은 지도 없이도 주방과 회의실을 구분한다. [DUSt3R](https://arxiv.org/abs/2312.14132)와 그 후속 모델에 사진 몇 장을 넣으면 몇 초 안에 3D 구조가 나온다. 이런 기능은 이미 제품에 들어가 있고, 그 뒤에서 SLAM이 사용자 눈에 띄지 않게 돈다. 그래서 SLAM을 거의 풀린 문제로 여기는 분위기가 있다.

---

2003년에는 사정이 달랐다. 당시 Oxford 대학 공학과의 Robotics Research Group에 있던 Andrew Davison은 손에 든 카메라 한 대로 카메라 위치를 실시간으로 추정하면서 지도를 만들어 보였다. ICCV 2003에 발표한 이 시스템은 나중에 [MonoSLAM](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf)이라는 이름으로 알려졌다. 논문에 따르면 시스템은 2.2 GHz Pentium 데스크톱 PC에서 1초에 30프레임을 처리했다. 어느 위치에서든 보이는 특징이 6~10개쯤 되도록 지도를 관리했고, 논문에 실린 20초 실행에서 만든 지도에는 특징이 60개쯤 있었다. 실험은 방 안 책상 주변에서 했다. 논문은 이 범위에서는 EKF의 비선형성 문제를 겪지 않았지만 카메라가 처음 좌표계에서 멀리 움직이면 문제가 커질 수 있다고 적었다. 당시 실시간 단안 SLAM이 다룰 수 있는 규모가 그 정도였다.

책상 주변에서 특징 몇 개를 따라가던 시스템이 어떻게 2026년의 핸드폰 AR까지 왔을까?

---

SLAM에는 따로 발전하던 여러 분야의 연구가 이어져 있다. 사진측량학자들은 1950년대 후반부터 여러 사진의 광선 다발을 한꺼번에 조정했다. Smith, Self, Cheeseman은 1986년 UAI 학회에서 발표하고 1988년 논문집에 실은 [논문](https://arxiv.org/abs/1304.3111)에서 물체 사이 공간 관계의 불확실성을 확률로 표현했다. 이때부터 로봇공학자들은 지도를 확률 분포로 다루기 시작했다. Durrant-Whyte와 Bailey가 2006년에 쓴 [튜토리얼](https://www-personal.acfr.usyd.edu.au/tbailey/publications/slamtutorial1.htm)에 따르면 "SLAM"이라는 약어는 1995년 International Symposium on Robotics Research(ISRR)에서 발표된 서베이 논문에 처음 나왔다. 컴퓨터 비전 연구자들은 특징점을 실시간으로 추적하는 기법을 다듬었다. 2020년대에는 딥러닝 연구자들이 이 구성 요소들을 학습 모델 안에 다시 담고 있다.

EKF(extended Kalman filter, 확장 칼만 필터) 기반 SLAM이 graph-based SLAM으로 바뀔 때 기술 발전과 몇몇 연구자의 선택은 각각 얼마나 작용했을까? Feature-based 방법과 direct 방법이 나뉘리라는 것을 처음부터 내다본 사람이 있었을까? 딥러닝은 왜 기하 계산으로 짠 파이프라인을 이렇게 더디게 대체하고 있을까? 이 책은 당시 연구자들 앞에 실제로 있던 선택지를 근거로, 다른 선택을 했다면 어떻게 됐을지(반사실 가정, counterfactual) 따져 본다.

---

사진측량에서 시작해 SLAM으로 이어진 아이디어가 어디서 왔는지, 연구자들이 당시 내다본 미래와 실제로 벌어진 일이 어떻게 달랐는지를 장마다 따라간다. 예를 들어 [Triggs 등(1999)](https://dblp.org/rec/conf/dagstuhl/TriggsMHF99.html)은 bundle adjustment를 정리한 논문의 마지막 절 "Summary and Recommendations"에서 문제 구조를 활용하는 일이 아주 중요하다고 쓰고, 배치(batch) 문제에는 몇 가지 예외를 두고 희소 분해를 쓰는 Gauss-Newton 방법을 권했다. [COLMAP(CVPR 2016)](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf)은 SfM(structure from motion, 여러 사진으로 카메라 위치와 3D 구조를 함께 복원하는 방법)을 입력 사진이 7만 장 넘는 문제까지 시험했고, 전체 구현을 오픈소스로 공개했다. 본문의 🔗 상자에는 어떤 기법이 어느 논문에서 왔는지 적었다. 📜 상자에서는 원 논문의 결론과 future work를 실제로 일어난 일과 견주어 본다. 장 끝의 🧭 항목에는 2026년에도 풀리지 않은 문제를 적었고, Ch.19에서 이 항목들을 모아 다시 다룬다.

---

이 책은 여섯 부로 나뉜다.

**1부: 선사시대**는 SLAM이 로봇공학에서 나오기 전에 사진측량과 고전 컴퓨터 비전이 만든 도구를 다룬다. bundle adjustment는 왜 지금도 최적화 backend의 바탕일까?

**2부: 고전 SLAM**은 확률적 지도 작성과 EKF의 한계에서 시작해 MonoSLAM·PTAM, graph-based SLAM, 최적해 인증까지 다룬다. 지도와 위치를 함께 추정하는 방법은 어떻게 필터에서 최적화로 옮겨 갔을까?

**3부: 성숙기**는 ORB-SLAM과 관성 사전적분·연속시간 추정, direct method, RGB-D, place recognition을 다룬다. 초기 실시간 시연 뒤에 SLAM이 더 넓은 환경과 여러 센서로 쓰임새를 넓힌 과정이다.

**4부: 러닝 융합기**는 monocular depth 추정, end-to-end SLAM, 기하와 학습을 결합한 하이브리드 방법을 다룬다. 학습한 모델은 기존 파이프라인의 어느 계산을 맡았고, 기하 제약은 어디에 남았을까?

**5부: 표현의 혁명**은 Neural Radiance Fields와 3D Gaussian Splatting, 동적 장면 표현, 3D foundation model을 다룬다. 지도와 장면을 표현하는 방식이 바뀌자 추적과 재구성의 관계도 달라졌다.

**6부: 막힌 길과 열린 문제**는 SLAM 역사에서 성과 없이 끝난 시도와, "풀렸다"는 인식과 달리 아직 남은 문제를 다룬다.

---

Foundation model과 SLAM의 관계는 아직 연구가 진행 중이어서 이 책에서는 결론을 내리지 않는다. 이 책은 과거에 무슨 일이 있었고 왜 그랬는지, 당시 제약 아래에서 그 선택이 어떤 뜻이었는지를 쓴다. 독자가 동차 좌표(homogeneous coordinates), epipolar geometry, EKF 공식은 이미 안다고 보고 썼다. 카메라나 LiDAR를 고르는 방법은 다루지 않는다.

수식과 정리·증명을 체계적으로 보려면 [SLAM Handbook](https://github.com/SLAM-Handbook-contributors/slam-handbook-public-release)을 읽으면 된다. Carlone, Kim, Barfoot, Cremers, Dellaert가 편집했고 Cambridge University Press에서 나온다(서지 정보상 2026년). 18개 장에 SLAM의 이론과 시스템을 정리했다. 이 역사서는 SLAM이 그렇게 정리되기까지 연구자들이 거친 과정을 기록한다.

Handbook 저자들은 맺음말(Epilogue)에 독자에게 남기는 말을 모아 실었고, 그 가운데 하나가 *"If someone tells you 'SLAM is solved,' don't listen to them"*이다. 이 책도 앞에서 말한 "거의 풀린 문제"라는 인식을 분야 안에 퍼진 분위기로 다룬다.

---

Davison의 2003년 데모 영상은 지금도 인터넷에서 볼 수 있다. 화면이 흔들리고, 랜드마크 점이 깜빡이고, 지도에는 점이 수십 개뿐이다.

이야기는 MonoSLAM보다 훨씬 앞에서 시작한다. "SLAM"이라는 약어가 1990년대에 자리 잡기 전, Smith, Self, Cheeseman이 확률적 지도를 수식으로 쓰기도 전에 사진측량학자들은 사진으로 3D 구조를 복원하고 있었다.


---

# Ch.1 — 사진측량과 bundle adjustment: Triggs 이전 100년

오늘날 SLAM 최적화 backend의 수학은 측량학에서 나왔다. 19세기 후반 독일의 Albrecht Meydenbauer는 건축물을 사진으로 측량하는 방법을 체계화했고, 20세기 초 Carl Pulfrich는 두 시점에서 찍은 사진으로 거리를 재는 광학 기기를 만들었다. 1958년 미국의 Duane C. Brown은 이 측량 문제를 수치 최소자승 문제로 정식화했다. 1999년 Bill Triggs, Philip McLauchlan, Richard Hartley, Andrew Fitzgibbon은 그때까지 사진측량 문헌에 쌓인 bundle adjustment 이론을 컴퓨터 비전 연구자가 읽을 수 있는 말로 정리했다.

---

## 1. 20세기 초 유리판과 Stereophotogrammetry

1901년 [Carl Pulfrich](https://en.wikipedia.org/wiki/Carl_Pulfrich)는 함부르크 자연과학자 회의에서 Zeiss 광학연구소가 만든 **입체 측량기(stereocomparator)**를 발표했다. 1899년 뮌헨에서 입체 거리계 시제품을 먼저 공개한 뒤였다. 이 장치로 두 시점에서 찍은 사진 건판을 놓고 같은 점의 좌표 차이를 읽으면 거리를 계산할 수 있었다. 두 시점 사이에서 같은 점이 어긋나 보이는 정도, 곧 시차(parallax)는 깊이에 반비례한다. 삼각법 자체는 고대 그리스부터 쓰였고, Pulfrich의 장치는 여기에 광학 기기의 정밀도를 더했다.

그보다 한 세대 앞서 [Albrecht Meydenbauer](https://www.uni-marburg.de/de/fotomarburg/histfoto/gliederung/messbilder/messbildverfahren)는 건축물 보존에 쓰는 **건축 사진측량(architectural photogrammetry)**을 체계화했다. 1858년 베츨라 대성당 외벽을 재다가 떨어질 뻔한 뒤, 그는 사람이 직접 올라가 재지 않고 사진으로 측량하는 방법을 궁리했다. 1885년에는 프로이센 왕립 사진측량국(Königlich Preussische Messbild-Anstalt)을 세웠다.

사진으로 측량하는 방법은 20세기 항공 측량으로 이어졌다. 비행기에서 겹치게 찍은 사진 여러 장과 지상 기준점 몇 개로 각 사진의 촬영 위치와 지상 점의 좌표를 구하는 방법을 aerotriangulation(항공 삼각측량)이라 한다. 계산은 사람이 손과 기계식 계산기로 했다.

> 🔗 **차용.** 현대 SLAM의 스테레오 깊이 추정은 Pulfrich의 stereocomparator와 원리가 같다. 두 카메라 사이의 거리(baseline)와 시차로 깊이를 구한다. Pulfrich는 유리 건판에서 좌표를 읽었고, 지금은 그 자리를 이미지 센서의 픽셀 좌표가 대신한다.

---

## 2. 1958년 Brown과 수치 bundle adjustment

[Duane C. Brown](https://digital.hagley.org/08206139_solution)은 RCA 소속으로 플로리다 Patrick 공군기지의 미 공군 미사일 시험장(Air Force Missile Test Center) 측량 업무를 맡은 엔지니어였다. 그가 다룬 문제는 여러 촬영 지점의 카메라 자세와 여러 지상 점의 좌표를 한꺼번에 추정하는 일이었다. Triggs et al.(1999)의 부록은 기본적인 bundle 방법을 Brown과 동료들이 1957~1959년 미 공군을 위해 개발했다고 적었다.

1958년 보고서 "A Solution to the General Problem of Multiple Station Analytical Stereotriangulation"(RCA-MTP Data Reduction Technical Report No. 43, AFMTC-TR-58-8)은 **bundle adjustment**를 수치 계산 문제로 정식화한 초기 문헌이다. 같은 시기 해석적 사진측량을 연구한 Helmut Schmid도 bundle adjustment를 처음 만든 사람으로 함께 거론된다. 이 1958년 방법은 카메라가 이미 교정돼 있다고 보고 카메라 자세와 점 좌표만 최적화했다.

**Reprojection error**는 카메라 $i$에서 관측한 2D 이미지 좌표 $x_{ij} \in \mathbb{R}^2$와, 3D 점 $X_j \in \mathbb{R}^3$을 내부 행렬 $K_i$와 외부 행렬 $[R_i | t_i]$로 투영한 예측 좌표 $\pi(K_i, R_i, t_i, X_j)$의 차이다. bundle adjustment는 이 차이의 제곱합을 최소화한다:

$$E = \sum_{i,j} \| x_{ij} - \pi(K_i, R_i, t_i, X_j) \|^2$$

"Bundle"이라는 이름은 각 카메라 중심에서 3D 점들로 뻗어 나가는 광선 다발(bundle of rays)에서 왔다. 이 광선들이 3차원 점에서 만나도록 카메라 자세와 점 위치를 함께 조정한다. 위 식은 오늘날 쓰는 형태여서 내부 행렬 $K_i$까지 변수로 두지만, Brown의 1958년 방법은 $K_i$를 알려진 값으로 놓았다. Brown의 작업은 군사 측량에서 시작했고, bundle adjustment는 그 뒤 사진측량 문헌 안에서 계속 다듬어졌다.

> 🔗 **번역.** Triggs et al.(1999)은 초록에서 이 논문이 사진측량의 bundle adjustment 이론과 방법을 "컴퓨터 비전 분야에서 이를 구현하려는 사람들"을 위해 정리한 글이라고 밝혔다. 두 분야는 같은 최적화 문제를 서로 다른 용어와 관행으로 다루고 있었고, 이 논문이 사진측량에 쌓인 결과를 컴퓨터 비전에 소개했다. 군사 보안 때문에 컴퓨터 비전이 이 방법을 따로 다시 발견해야 했다는 이야기에는 직접 근거가 없다.

---

## 3. Levenberg와 Marquardt — 비선형 최적화

Reprojection error 최소화는 비선형 최소자승 문제다. 닫힌 꼴의 해가 없어서 반복 수치 최적화로 푼다. 이 반복 계산을 안정시키는 방법은 측량학 바깥에서 나왔다.

1944년 [Kenneth Levenberg](https://cs.uwaterloo.ca/~y328yu/classics/levenberg.pdf)는 Gauss-Newton과 steepest descent 사이를 댐핑 파라미터 $\lambda$로 조절하는 방법을 발표했다. $\lambda$가 크면 steepest descent에 가까워져 안전하게 수렴하고, 작으면 Gauss-Newton처럼 빠르게 수렴한다. 기본 형태에서는 선형화한 정규방정식의 행렬 $\mathbf{J}^{\top}\mathbf{J}$에 $\lambda \mathbf{I}$를 더해 수치 안정성을 높인다. 1963년 [Donald Marquardt](https://epubs.siam.org/doi/10.1137/0111030)는 같은 아이디어를 따로 찾아내 더 명시적으로 정식화했다. 그 뒤 이 방법은 **Levenberg-Marquardt(LM) 알고리즘**이라는 이름으로 자리 잡았다.

---

## 4. 1999년 Triggs et al. — 사진측량의 결과를 정리하다

1999년 ICCV와 함께 열린 Vision Algorithms Workshop에서 Bill Triggs, Philip McLauchlan, Richard Hartley, Andrew Fitzgibbon은 ["Bundle Adjustment — A Modern Synthesis"](https://link.springer.com/chapter/10.1007/3-540-44480-7_21)를 발표했다.

이 논문은 측량학과 항공 사진측량 문헌에 흩어져 있던 bundle adjustment(BA) 이론을 컴퓨터 비전 용어로 다시 써서 한데 모았다. 논문은 BA 문제의 희소 구조를 자세히 다뤘다. 한 점은 일부 카메라에만 보이므로 정규방정식의 행렬이 희소 블록 구조를 이룬다. 점 변수를 먼저 소거하고(Schur complement) 카메라 변수만 남은 작은 연립방정식을 풀면 계산이 훨씬 빨라진다. 논문에 따르면 Brown의 1958년 방법이 이미 이렇게 점 변수를 소거한 뒤 남은 카메라 연립방정식을 가우스 소거법으로 풀었다. 논문은 기준 좌표계를 임의로 잡을 수 있어서 생기는 자유도(gauge freedom)도 따로 다루었다.

7년 뒤 Noah Snavely, Steven Seitz, Richard Szeliski의 [Photo Tourism(SIGGRAPH 2006)](https://phototour.cs.washington.edu/Photo_Tourism.pdf)은 인터넷에서 내려받은 사진으로 노트르담 대성당, 트레비 분수 같은 랜드마크를 자동으로 재구성했다. 노트르담 대성당은 사진 2,635장 가운데 597장, 트레비 분수는 466장 가운데 360장의 카메라 위치를 찾았다. 그로부터 10년 뒤 Johannes Schönberger와 Jan-Michael Frahm의 [COLMAP(CVPR 2016)](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf)은 사진을 한 장씩 더해 가며 재구성하는 incremental SfM을 더 견고하게 만들어 오픈소스로 공개했다. 논문은 입력 사진 7만 5천 장 가운데 2만 1천 장을 등록한 로마 재구성을 실었다. 그 무렵 연구 논문에서는 사진 수백만 장, 많게는 1억 장을 다루는 재구성 시스템도 나와 있었다.

---

## 5. Reprojection error가 지금 형태로 굳기까지

20세기 초 항공 삼각측량에서는 오차를 지상 좌표계의 거리 차이로 쟀다. 3D 공간에서 직접 비교하므로 렌즈나 캘리브레이션에서 생긴 오차가 지상 좌표 잔차에 섞여 따로 드러나지 않았다.

Brown은 1958년 보고서에서 비교하는 자리를 이미지 평면으로 옮겼다. 3D 점을 이미지에 투영한 위치와 실제로 관측한 이미지 좌표를 맞추는 방식이다. Triggs et al.(1999)의 부록에 따르면 카메라 내부 파라미터를 BA 안에서 함께 추정하는 self-calibration은 1964년 무렵 논의되기 시작해 1968년에 구현됐고, 렌즈 왜곡을 나타내는 카메라 모델은 1970년대 초에 크게 다듬어졌다. 이 발전도 상당 부분 Brown과 동료들이 이끌었다.

이미지 노이즈를 등방성 가우시안으로 놓으면 reprojection error 최소화는 최대우도 추정과 같아진다. Triggs et al.(1999)은 이 공식을 컴퓨터 비전 연구자에게 익숙한 표기로 정리했다.

> 🔗 **차용.** SLAM에서 visual landmark의 관측 모델 $z = \pi(K, T, p) + \epsilon$은 Brown(1958)의 reprojection 공식을 이어받았다. Gauss-Newton으로 이 오차를 최소화하는 SLAM backend는 1958년 항공 삼각측량 solver와 수학 구조가 같다.

---

## 6. 2026년의 SLAM backend

ORB-SLAM3는 g2o로 SE(3) 자세와 3D landmark 위치를 함께 최적화한다. LIO-SAM은 GTSAM의 factor graph로 비선형 최적화를 푼다. DROID-SLAM은 GRU(gated recurrent unit, 순환 신경망의 한 종류) 기반 업데이트 연산자로 optical flow 보정량을 구하고, 그 뒤에 미분 가능한 dense bundle adjustment 층을 둔다.

1999년의 행렬 표기는 Lie group과 factor graph로 바뀌었고, 사람이 설계하던 계산 일부는 신경망이 맡게 됐다. 지금도 backend는 관측 잔차를 최소화한다. 시각 BA는 여러 시점의 reprojection error로 카메라 자세와 지도를 추정하고, LiDAR 시스템은 점과 점 사이 거리나 점과 평면 사이 거리처럼 센서에 맞는 잔차를 쓴다.

그래서 SLAM 연구자는 사진측량에서 쌓인 최적화 이론과 검증 결과를 가져다 쓸 수 있다. 그 결과는 정적인 세계, 점 특징, 가우시안 노이즈라는 BA의 전제로 얻은 것이어서, 실제 환경이 이 전제와 다르면 그대로 쓸 수 없다.

---

> 📜 **예언 vs 실제.** Triggs et al.(1999)은 마지막 절 "Summary and Recommendations"에서 문제 구조를 활용하는 일이 아주 중요하다고 쓰고, 배치(batch) 문제에는 몇 가지 예외를 두고 희소 분해를 쓰는 Gauss-Newton 방법을 권했다. 이후 SfM은 이 방향으로 커졌다. 규모를 키우는 데에는 BA를 사진을 더할 때마다 부분적으로 돌리는 방법, vocabulary tree로 닮은 이미지끼리만 짝지어 매칭하는 방법 같은 엔지니어링이 함께 들어갔다.

---

## 🧭 아직 열린 것

**비선형 BA의 전역 최적해 보장.** LM 알고리즘은 국소 최솟값(local minimum)에 수렴한다. 초기값이 나쁘면 틀린 구조로 수렴한다. 초기값을 구하는 방법으로는 epipolar geometry 추정, PnP(Perspective-n-Point, 3D 점과 그 영상 좌표로 카메라 자세를 구하는 문제), 5-point algorithm 같은 기하 solver가 나왔다. 이런 기하 solver는 RANSAC처럼 이상치를 걸러 내는 강건 추정 절차 안에서 돌고, 그렇게 얻은 해를 반복 최적화로 다듬는다. 대규모 환경에서 전역 최적해를 보장하려는 convex relaxation 연구가 있고(Ch.6b 참조), 이를 실시간 SLAM에 필요한 속도와 규모로 돌리는 일은 남은 과제다.

**사진측량의 정밀도와 Visual SLAM의 차이.** 항공 사진측량의 정확도는 촬영 조건과 산출물이 요구하는 규격에 맞춰 평가한다. 교정된 카메라와 품질 좋은 GCP(지상 기준점)를 쓰고, 최적화는 오프라인에서 한다. 실시간 Visual SLAM은 같은 수식을 쓰지만 GPS가 없고, 카메라 해상도가 낮고, 추정을 바로 내놓아야 하는 조건에서 돈다.

---

BA를 돌리려면 먼저 최적화에 넣을 대응점을 찾아야 한다. Ch.2는 Harris corner와 optical flow로 이미지에서 이 대응점을 찾은 과정을 따라간다.

# Ch.2 — Classical CV 도구상자: Harris에서 SIFT까지, 그리고 ORB까지

Ch.1의 bundle adjustment는 카메라 자세와 3D 점을 함께 최적화한다. 이 최적화를 돌리려면 먼저 여러 이미지에서 서로 대응하는 점을 찾아야 한다. 측량에서는 사람이 현장에 표적을 세워 대응점을 만들었다. 컴퓨터 비전은 이 일을 알고리즘에 맡겨야 했다. 그래서 이미지에서 특징점을 찾는 문제(feature detection)와 찾은 점 주변을 비교할 수 있는 값으로 요약하는 문제(description)가 생겼다.

1970년대 후반 Hans Moravec은 Stanford Cart 프로젝트에서 카메라로 환경의 두드러진 점을 찾으려 했다. 그 작업은 1980년 Stanford 박사논문 ["Obstacle Avoidance and Navigation in the Real World by a Seeing Robot Rover"](https://frc.ri.cmu.edu/~hpm/project.archive/robot.papers/1975.cart/1980.html.thesis/index.html)로 정리됐다. Moravec은 패치를 조금씩 옮겨 볼 때 밝기가 얼마나 변하는지를 재서 추적할 점을 고르는 기준을 세웠다. 오늘날 특징 기반 SLAM의 front-end(이미지에서 관측을 뽑는 앞단)는 대부분 이 장에서 다루는 검출기와 서술자나 그 변형을 쓴다.

---

## 2.1 코너라는 개념: Moravec에서 Harris까지

창을 어느 방향으로 조금 옮기든 그 안의 영상이 크게 변하는 점을 "코너"라 부른다. Moravec(1977)의 기준은 단순했다. 창을 가로, 세로, 두 대각선, 이렇게 45도 간격의 네 방향으로 한 픽셀씩 옮겨 보고 원래 창과의 차이 제곱합(Sum of Squared Differences, SSD)을 잰다. 네 값 가운데 가장 작은 값이 충분히 크면 코너로 본다.

Harris와 Stephens는 1988년 Alvey Vision Conference에서 ["A Combined Corner and Edge Detector"](https://www.bmva-archive.org.uk/bmvc/1988/avc-88-023.html)를 발표했다. 이들은 Moravec의 기준이 45도 간격의 방향만 봐서 방향에 따라 응답이 달라진다고 지적하고, 이미지 미분으로 모든 방향의 작은 이동을 한꺼번에 다뤘다. 이미지 $I$에서 점 $(x,y)$ 주변 창 $W$를 이동량 $(\Delta x, \Delta y)$로 움직일 때 강도 변화를 근사하면:

$$M = \sum_{(x,y) \in W} \begin{pmatrix} I_x^2 & I_x I_y \\ I_x I_y & I_y^2 \end{pmatrix}$$

$M$의 두 eigenvalue $\lambda_1, \lambda_2$로 점의 성격을 구분한다. 둘 다 크면 코너, 하나만 크면 엣지, 둘 다 작으면 평탄한 영역으로 본다. Harris는 $R = \det(M) - k \cdot \text{tr}(M)^2$라는 점수로 코너를 가려서 eigenvalue를 직접 구하지 않아도 되게 했다. 실제 구현에서는 $k$로 보통 0.04~0.06을 쓴다.

> 🔗 **차용.** Harris(1988)는 Stanford Cart 연구를 정리한 Moravec의 1980년 보고서(CMU-RI-TR-3)를 출발점으로 인용했다.

1994년 Jianbo Shi와 Carlo Tomasi는 ["Good Features to Track"](https://cecas.clemson.edu/~stb/klt/shi-tomasi-good-features-cvpr1994.pdf)(CVPR 1994)에서 좋은 특징을 추적기가 잘 따라갈 수 있는 창으로 정의했다. 두 eigenvalue 가운데 작은 값 $\min(\lambda_1, \lambda_2)$가 정해 둔 문턱보다 크면 그 창을 고른다. 같은 기준은 1991년 Tomasi와 Kanade의 보고서에도 이미 나온다. 이 기준을 Shi-Tomasi 코너 검출이라 부른다. OpenCV는 이 방법을 `goodFeaturesToTrack` 함수로 구현했고, 지금도 같은 이름으로 쓴다.

---

## 2.2 추적의 원형: Lucas-Kanade와 KLT

찾은 점이 다음 프레임에서 어디로 갔는지는 따로 구해야 한다. Bruce Lucas와 Takeo Kanade는 1981년 ["An Iterative Image Registration Technique"](https://www.ijcai.org/Proceedings/81-2/Papers/017.pdf)에서 프레임 사이의 픽셀 이동을 최소화 문제로 정식화했다. 이때 밝기 불변 가정(brightness constancy assumption)을 둔다.

밝기 불변 가정은 한 점의 밝기가 움직이기 전과 뒤에 같다는 가정이다.

$$I(x, y, t) = I(x + u, y + v, t + 1)$$

테일러 전개 후 선형화하면:

$$I_x u + I_y v + I_t = 0$$

방정식은 하나인데 미지수는 둘이다. Lucas-Kanade는 작은 창 안의 픽셀들이 모두 같은 $(u,v)$로 움직인다고 가정해서 방정식을 미지수보다 많이 만들고, 이 연립방정식을 최소자승으로 푼다.

$$\begin{pmatrix} \sum I_x^2 & \sum I_x I_y \\ \sum I_x I_y & \sum I_y^2 \end{pmatrix} \begin{pmatrix} u \\ v \end{pmatrix} = -\begin{pmatrix} \sum I_x I_t \\ \sum I_y I_t \end{pmatrix}$$

왼쪽 행렬은 Harris의 행렬 $M$과 같다. 코너 검출과 optical flow는 같은 행렬을 계산한다.

Tomasi와 Kanade는 1991년 tech report ["Detection and Tracking of Point Features"](https://cecas.clemson.edu/~stb/klt/tomasi-kanade-techreport-1991.pdf)에서 eigenvalue로 추적하기 좋은 창을 고르고 Newton-Raphson 반복으로 이동량을 다듬는 구현을 내놓았다. 2000년 Intel의 Jean-Yves Bouguet은 이미지 피라미드로 구현을 확장했다. 해상도를 단계별로 낮춘 이미지를 만들고 거친 해상도부터 차례로 맞춰 가므로(coarse-to-fine) 이동이 클 때도 수렴한다. 이 조합을 KLT(Kanade-Lucas-Tomasi) 추적기라 부른다. [VINS-Mono](https://arxiv.org/abs/1708.03852)(TRO 2018) 같은 실시간 VIO(visual-inertial odometry, 카메라와 IMU를 함께 쓰는 위치 추정)도 front-end에서 KLT로 특징을 추적한다.

---

## 2.3 SIFT — 불변성과 특허

KLT는 한 카메라가 조금씩 움직이며 찍은 연속 프레임에서 잘 동작한다. 다른 카메라로 다른 날 찍은 이미지에서는 같은 점이라도 주변 패치의 모양, 크기, 방향이 달라서 픽셀 값을 바로 비교하기 어렵다. 이럴 때는 점 주변을 시점이 바뀌어도 크게 변하지 않는 벡터로 요약해 비교한다. 이 벡터를 **서술자(descriptor)**라 한다.

UBC의 David Lowe는 1999년 ICCV에 "Object Recognition from Local Scale-Invariant Features"를 발표하고, 점마다 만든 160차원 벡터를 비교해 서로 다른 사진에서 같은 물체를 찾아 보였다. 5년 뒤인 2004년에는 IJCV에 서술자를 128차원으로 다듬은 완성판 ["Distinctive Image Features from Scale-Invariant Keypoints"](https://www.cs.ubc.ca/~lowe/papers/ijcv04.pdf)를 실었다. 오늘날 SIFT(Scale-Invariant Feature Transform)를 인용할 때는 주로 이 논문을 쓴다. SIFT는 검출과 서술 두 단계로 이루어진다.

**검출 단계**: 여러 scale에서 DoG(Difference of Gaussians)를 계산하고, 그 극값을 keypoint로 고른다. DoG는 Laplacian of Gaussian의 근사다. $L(x,y,\sigma) = G(x,y,\sigma) * I(x,y)$를 Gaussian 스무딩 이미지라 하면:

$$D(x, y, \sigma) = L(x, y, k\sigma) - L(x, y, \sigma)$$

$k$는 이웃한 scale 사이의 비율로, Lowe는 이를 $2^{1/s}$로 정했다($s$는 octave 하나에 들어가는 scale 수). 여러 octave에서 극값을 찾으므로 영상 크기가 달라도 같은 점을 찾는다.

**서술자 단계**: keypoint 주변 $16\times16$ 표본 창을 $4\times4$ 블록으로 나누고, 블록마다 gradient 방향 히스토그램(8개 구간)을 만들어 이어 붙이면 128차원 벡터가 된다. 창을 keypoint의 주된 gradient 방향에 맞춰 돌린 다음 계산하므로 영상이 회전해도 서술자가 거의 같다.

Lowe(2004)는 SIFT keypoint가 회전과 크기 변화에 불변이고, affine 변형·노이즈·조명 변화에도 상당한 범위에서 견딘다고 보고했다. 그래서 SIFT는 KITTI 같은 SLAM 벤치마크가 나오기 전부터 시점과 크기가 다른 영상 사이의 대응점을 찾는 데 널리 쓰였다.

UBC는 Lowe를 발명자로 2000년 3월 SIFT 특허를 출원했고, 특허는 2004년 3월 등록됐다(US6711293B1, 우선일 1999년 3월 8일). 특허가 끝난 2020년 3월 전까지는 SIFT를 상업 제품에 쓰려면 라이선스가 필요했고, 그동안 SIFT를 대신할 방법을 찾는 연구가 이어졌다.

> 📜 **예언 vs 실제.** Lowe는 2004년 SIFT 논문의 "9 Conclusions"에서 물체 인식 말고도 keypoint를 쓸 수 있는 곳으로 "view matching for 3D reconstruction, motion tracking and segmentation, robot localization, image panorama assembly, epipolar calibration"을 꼽았다. 예언은 대부분 맞았다. 2000년대 후반의 SfM, SLAM, 파노라마 합성, 초기 영상 기반 로봇 위치 추정에는 SIFT가 쓰였다. 2012년 AlexNet 이후 물체 인식은 CNN으로 옮겨 갔고, SLAM에 쓰는 local descriptor도 SuperPoint·R2D2 같은 학습 서술자로 점차 바뀌었다.

---

## 2.4 SURF — 속도를 위해 근사하다

SIFT는 계산이 무거워 실시간 SLAM에 쓰기 어려웠다. SURF 논문의 측정에서는 800×640 이미지 한 장의 검출과 서술에 SIFT가 1,036 ms 걸렸다. ETH Zurich의 Herbert Bay는 KU Leuven의 Tinne Tuytelaars, ETH Zurich와 KU Leuven에 함께 적을 둔 Luc Van Gool과 함께 2006년 ECCV에 ["SURF: Speeded-Up Robust Features"](https://people.ee.ethz.ch/~surf/eccv06.pdf)를 발표하고 검출과 서술의 계산량을 함께 줄였다.

SURF는 DoG 대신 *Hessian 행렬의 행렬식*으로 keypoint를 찾는다. Gaussian 이차 미분은 integral image로 계산하는 box filter로 근사해서 빠르게 구한다. 서술자는 SIFT의 절반인 64차원이다. keypoint 주변을 $4\times4$ 하위 영역으로 나누고, 영역마다 Haar wavelet 응답 $d_x, d_y$로 $(\sum d_x,\, \sum d_y,\, \sum|d_x|,\, \sum|d_y|)$ 네 값을 구해 이어 붙이면 $4\times4\times4=64$차원이 된다. 128차원으로 늘린 SURF-128도 있지만 기본은 64차원이다.

같은 측정에서 SURF는 354 ms, 회전 불변성을 뺀 U-SURF는 255 ms가 걸려 SIFT보다 3~4배 빨랐다. 검출기만 보면 SURF의 Fast-Hessian이 DoG보다 3배 넘게 빨랐다. 정확도는 차원 수, 검출기와 서술 방식, 평가 조건에 따라 앞서기도 하고 뒤지기도 했다. SURF에도 특허가 걸려 있었다.

> 🔗 **차용.** Lowe(1999/2004)의 DoG scale-space → Bay(2006)의 Hessian integral image: 두 방법 모두 scale이 달라도 같은 점을 찾으려 했다. Bay는 integral image로 box filter를 계산해서 Hessian을 DoG보다 빠르게 근사했다.

---

## 2.5 ORB — 특허 없는 binary descriptor

2011년 Ethan Rublee, Vincent Rabaud, Kurt Konolige, Gary Bradski는 ICCV에 ["ORB: An Efficient Alternative to SIFT or SURF"](https://www.gwylab.com/download/ORB_2012.pdf)를 발표했다. 네 저자는 모두 ROS를 개발하던 Willow Garage 소속이었다.

ORB는 이미 있던 검출기와 서술자를 고쳐서 묶었다.

**검출**: [FAST](https://www.edwardrosten.com/work/rosten_2006_machine.pdf)(Features from Accelerated Segment Test, Rosten & Drummond 2006). FAST는 한 픽셀 둘레의 원 위에 있는 16개 점을 살펴서, 가운데보다 충분히 밝거나 어두운 점이 연속으로 길게 이어지면 코너로 본다. 비교 연산만 하므로 SIFT의 DoG보다 훨씬 빠르다. ORB는 FAST가 찾은 점에 Harris 점수를 매겨 응답이 강한 점만 남긴다.

**서술자**: [BRIEF](https://www.cs.ubc.ca/~lowe/525/papers/calonder_eccv10.pdf)(Binary Robust Independent Elementary Features, Calonder et al. 2010). BRIEF는 keypoint 주변 패치에서 무작위로 고른 점 쌍의 밝기를 비교해 비트열을 만든다. 기본 길이는 256비트다. 두 서술자는 Hamming 거리로 비교한다. 두 비트열을 XOR한 뒤 1인 비트 수를 세면(popcount) 거리가 나오므로 계산이 아주 빠르다.

BRIEF는 영상이 몇 도만 회전해도 매칭 성능이 크게 떨어졌다. Rublee와 동료들은 패치의 밝기 중심(intensity centroid)으로 방향을 구하고, 비교할 점 쌍의 위치를 그 방향만큼 돌려서 BRIEF를 계산했다(steered BRIEF). 그런데 이렇게 돌리면 비트들이 서로 비슷해져 변별력이 떨어졌다. 그래서 학습 데이터에서 분산이 크고 서로 상관이 낮은 점 쌍 256개를 골라 썼고, 이것을 **rBRIEF(rotation-aware BRIEF)**라 불렀다.

$$\theta = \text{atan2}(m_{01},\, m_{10}), \quad m_{pq} = \sum_{x,y} x^p y^q I(x,y)$$

논문은 ORB가 SIFT보다 약 100배 빠르면서 여러 상황에서 비슷한 성능을 낸다고 보고했다. ORB는 특허 부담이 없었고 OpenCV에 들어갔다. [ORB-SLAM](https://arxiv.org/abs/1502.00956)(Mur-Artal et al., TRO 2015)은 이름대로 ORB를 썼고, 2021년의 ORB-SLAM3까지 front-end의 ORB를 바꾸지 않았다.

> 🔗 **차용.** Calonder et al.(2010)의 BRIEF → Rublee et al.(2011)의 ORB: binary descriptor에 밝기 중심으로 구한 방향을 더하고 비교할 점 쌍을 학습으로 골라 회전에 강하게 만들었다.

---

## 2.6 학습 기반 descriptor

사람이 설계한 규칙 대신 데이터로 학습한 규칙을 쓰면 더 나을까? 2016년 Yi et al.이 발표한 [LIFT](https://arxiv.org/abs/1603.09114)(Learned Invariant Feature Transform, ECCV 2016)는 검출, 방향 추정, 서술자 계산을 모두 CNN으로 바꾸려 했다. 단계마다 따로 학습한 네트워크 셋을 차례로 이었다.

2018년 DeTone et al.의 [SuperPoint](https://arxiv.org/abs/1712.07629)(CVPRW 2018)는 keypoint 검출과 256차원 서술자를 한 네트워크로 함께 학습했다. 먼저 합성 도형 데이터로 학습하고, 실제 이미지에 homography 변환을 여러 번 걸어 얻은 검출 결과를 정답처럼 써서 다시 학습했다(homographic adaptation). SuperPoint는 그 뒤 SLAM 연구에서 널리 시험된 학습 특징 가운데 하나가 됐다. [AnyLoc](https://arxiv.org/abs/2308.00688)(Keetha et al., RA-L 2024)처럼 장소 인식에 DINOv2 같은 foundation model 특징을 쓰는 연구도 나왔다.

2026년에도 사람이 설계한 descriptor는 쓰인다. 임베디드 장치에서는 ORB가 SuperPoint보다 빠르다. 학습 서술자는 학습하지 않은 종류의 이미지에서 성능이 들쭉날쭉한데, ORB는 어떤 이미지에서 어떻게 동작할지 예측하기 쉽다.

---

## 2.7 🧭 아직 열린 것

**학습 기반 descriptor의 일반화 한계.** SuperPoint, R2D2, DISK 같은 학습 서술자는 학습한 것과 비슷한 이미지에서는 전통 방법보다 나은 경우가 많지만, 수중·열화상·저조도처럼 처음 보는 환경에서는 결과가 고르지 않다. 어느 쪽이 나은지는 2026년에도 환경마다 판단이 갈린다.

**Wide-baseline 매칭의 실패 모드.** Harris나 ORB로 매칭하면 시점이 크게 바뀔 때 성능이 떨어진다. 얼마나 떨어지는지는 장면, 회전축, 매칭 조건에 따라 다르다. ASIFT, MSER 같은 affine-covariant detector가 일부를 보완했지만 문제는 남아 있다. [DUSt3R](https://arxiv.org/abs/2312.14132)(Wang et al., CVPR 2024)는 두 이미지에서 대응점 매칭 단계 없이 pointmap을 직접 회귀한다. 이 방식이 descriptor를 어디까지 대신할지는 아직 알 수 없다.

---

이 장의 기법들은 이미지 한 장에서 점을 찾거나 두 장 사이에서 점을 잇는다. 이미지 수십, 수백 장을 기하적으로 어긋나지 않게 한꺼번에 연결하는 방법은 Ch.3의 SfM에서 다룬다.

# Ch.3 — Structure from Motion: Longuet-Higgins에서 COLMAP까지

Harris와 Lowe가 이미지에서 추적하기 좋은 점을 고르는 방법을 다듬는 동안, 다른 연구자들은 같은 점이 찍힌 사진 두 장에서 그 점의 3D 위치와 카메라 움직임을 알아내는 방법을 연구했다. 특징을 *검출*하는 연구와 특징으로 *공간을 재구성*하는 연구는 같은 시기에 따로 발전했고, 2000년대 중반에 하나의 파이프라인으로 합쳐졌다.

1981년 서식스 대학교 실험심리학 연구실의 H.C. Longuet-Higgins는 *Nature*에 세 쪽짜리 논문 "[A Computer Algorithm for Reconstructing a Scene from Two Projections](https://cseweb.ucsd.edu/classes/fa01/cse291/hclh/SceneReconstruction.pdf)"를 실었다. 두 사진에 찍힌 같은 점 여덟 개의 좌표만 있으면 연립 일차방정식을 풀어 두 시점의 상대 방향과 장면 구조를 구할 수 있다는 내용이었다. 사진측량과 운동 지각(motion perception) 연구에는 이보다 앞선 결과가 있었다. 그래도 현대 컴퓨터 비전의 two-view geometry는 이 논문에서 시작한다고 보는 경우가 많다.

---

## 3.1 Essential Matrix와 8-point Algorithm

Longuet-Higgins의 출발점은 단순했다. 두 카메라로 같은 점을 찍으면 두 이미지 좌표 사이에 대수 관계가 생긴다. 카메라 내부 파라미터로 좌표를 정규화하면 이 관계를 3×3 행렬 하나로 쓸 수 있다. 논문은 이 행렬을 $Q$라고 썼고, 지금은 **essential matrix** $\mathbf{E}$라고 부른다.

대응점의 정규화 좌표를 $\mathbf{x}_1$, $\mathbf{x}_2$라 하면 다음 식이 성립한다:

$$\mathbf{x}_2^\top \mathbf{E} \mathbf{x}_1 = 0$$

$\mathbf{E}$는 두 카메라 사이의 회전 $\mathbf{R}$과 이동 $\mathbf{t}$로 $\mathbf{E} = [\mathbf{t}]_\times \mathbf{R}$로 쓴다. 여기서 $[\mathbf{t}]_\times$는 $\mathbf{t}$의 skew-symmetric 행렬이다.

스케일을 빼면 essential matrix의 자유도는 5다. 대응점 5개로 푸는 비선형 5-point algorithm([Nistér 2004](http://www.cad.zju.edu.cn/home/gfzhang/training/SFM/2004-PAMI-David%20Nister-An%20Efficient%20Solution%20to%20the%20Five-Point%20Relative%20Pose%20Problem.pdf))이 나오기 전에는 다른 방법을 주로 썼다. 행렬의 원소 9개 가운데 스케일 하나를 고정해 미지수 8개로 보고, rank-2 같은 제약은 나중에 맞춘 채 대응점 8개로 선형 연립방정식을 푼다. 이것이 **8-point algorithm**이다. 논문에 따르면 사진측량에서는 점 다섯 개로 두 시점의 관계를 정할 수 있었지만, 그러려면 3차 연립방정식 다섯 개를 반복 계산으로 풀어야 했다. Longuet-Higgins는 점을 여덟 개로 늘리는 대신 연립 일차방정식만 풀면 되게 했다. 구현이 간단했고 계산량도 작았다.

약점은 수치 안정성이었다. 이미지 좌표가 수백~수천 픽셀 단위이면 계수 행렬의 원소 크기가 서로 크게 달라져 SVD(특이값 분해) 결과가 불안정해진다.

> 🔗 **차용.** Hartley는 1997년 정규화된 8-point algorithm([In Defense of the Eight-Point Algorithm](https://www.cse.unr.edu/~bebis/CS485/Handouts/hartley.pdf))을 내놓았다. 이미지마다 점들의 평균 위치가 원점에 오도록 옮기고, 원점까지 평균 거리가 $\sqrt{2}$가 되도록 크기를 맞춘다. 이 좌표로 fundamental matrix를 추정한 뒤 원래 좌표계로 되돌린다. 앞에서 말한, 카메라 내부 파라미터로 좌표를 바꾸는 정규화와는 목적이 다르다. Hartley는 Longuet-Higgins의 기하를 그대로 두고 수치 조건만 고쳤다. 이 절차는 그 뒤 다중 시점 기하 교재와 구현에 표준으로 들어갔다.

Fundamental matrix $\mathbf{F}$는 essential matrix를 일반화한 행렬이다. 카메라 내부 파라미터 $\mathbf{K}$를 알지 못해도 $\mathbf{x}_2^\top \mathbf{F} \mathbf{x}_1 = 0$이 성립한다. 두 카메라의 내부 파라미터를 각각 $\mathbf{K}_1$, $\mathbf{K}_2$라 하면 관계는 $\mathbf{F} = \mathbf{K}_2^{-\top} \mathbf{E} \mathbf{K}_1^{-1}$이다. 같은 카메라로 찍은 경우($\mathbf{K}_1 = \mathbf{K}_2 = \mathbf{K}$)에는 $\mathbf{F} = \mathbf{K}^{-\top} \mathbf{E} \mathbf{K}^{-1}$가 된다. SfM 파이프라인은 $\mathbf{K}$를 알면 $\mathbf{E}$를 바로 풀고, 모르면 $\mathbf{F}$를 먼저 추정한다.

---

## 3.2 Tomasi-Kanade Factorization

1981년 뒤 십 년 동안 SfM 연구는 주로 사진 두 장 사이의 기하를 다뤘다. 1992년 Carlo Tomasi(Cornell)와 Takeo Kanade(CMU)는 *IJCV*에 여러 프레임을 한꺼번에 처리하는 **[factorization method](https://people.eecs.berkeley.edu/~yang/courses/cs294-6/papers/TomasiC_Shape%20and%20motion%20from%20image%20streams%20under%20orthography.pdf)**를 발표했다.

프레임 $F$장에서 점 $P$개를 관측하면 이미지 좌표를 $2F \times P$ 행렬 $\mathbf{W}$로 쌓을 수 있다. 각 행에서 그 프레임의 점 좌표 평균을 빼 이동 성분을 없애면, 정사영(orthographic) 카메라 모델에서 $\mathbf{W}$의 rank는 3 이하가 된다. 논문은 이 사실을 rank theorem이라 불렀다. 이때 $\mathbf{W}$는 다음처럼 나뉜다:

$$\mathbf{W} = \mathbf{M} \mathbf{S}$$

$\mathbf{M}$은 $2F \times 3$ 모션 행렬, $\mathbf{S}$는 $3 \times P$ 구조 행렬이다. SVD로 $\mathbf{W}$의 특이값 가운데 큰 3개만 남기면 rank-3 분해를 얻는다. 그런데 $\mathbf{M}\mathbf{A}$와 $\mathbf{A}^{-1}\mathbf{S}$도 같은 $\mathbf{W}$를 만든다. 그래서 카메라 축을 나타내는 행들이 서로 직교하고 길이가 같아야 한다는 조건으로 가역 행렬 $\mathbf{A}$를 정한다. 논문은 이 조건을 metric constraints라 불렀고, 뒤의 문헌은 이 단계를 흔히 metric upgrade라 부른다.

SVD 한 번과 이 보정만으로 모든 프레임의 움직임과 모든 점의 3D 위치를 함께 구한다. 계산 비용은 대부분 $2F \times P$ 행렬의 SVD에서 나오고, 반복 비선형 최적화인 bundle adjustment보다 구조가 단순해 구현하기 쉬웠다.

factorization의 한계는 정사영·affine 가정이었다. Affine 카메라 모델은 원근 왜곡(perspective distortion)을 무시한다. 그래서 장면 안의 깊이 차이가 카메라까지 거리보다 충분히 작을 때, 예를 들어 멀리 있는 작은 물체를 찍을 때만 맞는다. 카메라에 가까운 장면, 화각이 넓은 렌즈, 앞뒤 깊이 차이가 큰 환경에서는 오차가 컸다. 1990년대 후반부터 여러 연구자가 원근 카메라 모델로 넓히려 했고, 이 흐름에서 컴퓨터 비전 연구자들은 사진측량의 bundle adjustment를 다시 찾아 쓰게 됐다.

---

## 3.3 Hartley & Zisserman의 교과서

2000년 Richard Hartley와 Andrew Zisserman의 교과서 *[Multiple View Geometry in Computer Vision](https://www.robots.ox.ac.uk/~vgg/hzbook/)*이 나왔다. 두 사람은 1981년부터 1990년대까지 여러 논문에 흩어져 있던 SfM 수학을 사영기하(projective geometry)로 정리했다. essential matrix, fundamental matrix, homography, camera calibration, bundle adjustment를 같은 표기와 같은 틀로 설명하자, 따로 다뤄지던 개념들이 같은 기하에서 나온다는 것이 분명해졌다.

이 책은 bundle adjustment를 비중 있게 다뤘다. Ch.1의 reprojection error 최소화 문제를 사영기하의 틀에서 다시 쓰고, 여기에 *robust cost function* $\rho$를 더했다. 이상치(outlier)가 섞인 실제 데이터에서도 최적화가 엉뚱한 해로 가지 않도록 Huber나 Cauchy 함수로 큰 오차의 영향을 줄인다. 최적화는 Levenberg-Marquardt로 풀고, Jacobian의 희소 구조로 계산량을 줄였다.

이 교과서는 그 뒤 SLAM·VO(visual odometry, 영상으로 카메라 이동을 추정하는 방법) 논문의 참고 문헌에 자주 올랐다.

---

## 3.4 Photo Tourism과 Bundler — 인터넷 규모 SfM

2006년 Noah Snavely, Steven Seitz, Richard Szeliski는 SIGGRAPH 논문 "[Photo Tourism](https://doi.org/10.1145/1179352.1141964)"을 발표했다. 이들은 Flickr에 올라온 관광지 사진(파리 노트르담 대성당, 로마 트레비 분수 등)을 모아 3D로 재구성했다.

수많은 사람이 제각기 찍어 올린 사진이라 카메라, 날씨, 구도가 저마다 달랐고 관계없는 사진도 섞여 있었다.

Snavely의 파이프라인은 먼저 SIFT로 특징을 찾아 이미지 쌍 사이의 대응점을 잇는다. 그다음 RANSAC으로 fundamental matrix를 추정해 기하적으로 맞지 않는 매칭을 버린다. 대응점이 많은 이미지 쌍에서 시작해 카메라를 하나씩 더해 가며(incremental SfM), 카메라를 더할 때마다 bundle adjustment로 모든 포즈와 점을 다시 최적화한다.

논문은 Flickr에서 내려받은 데이터셋으로 Notre Dame 대성당(2,635장 중 597장 등록), Trevi 분수(466장 중 360장), Yosemite Half Dome(1,882장 중 325장), Trafalgar Square(1,893장 중 278장)를 보고했다. 한 사람이 한 카메라로 찍은 Great Wall(120장 중 82장)과 Prague 구시가 광장(197장)도 실었다. 등록된 이미지의 평균 크기는 1,611×1,128 픽셀이었고, 평균 reprojection error는 약 1.5 픽셀이었다.

Snavely는 이 파이프라인을 Bundler라는 이름으로 공개했고, Bundler는 그 뒤 SfM 연구의 기본 도구가 됐다.

> 📜 **예언 vs 실제.** Snavely et al.(2006)은 논의 절에서 "Ultimately, we wish to scale up our reconstruction algorithm to handle millions of photographs"라고 썼다. 남은 과제로는 카메라가 늘수록 느려지는 계산(등록 순서를 바꿔 속도를 높이는 방안), 렌즈 왜곡 모델, 반복 구조가 있거나 특징이 약한 장면, 서로 연결되지 않은 여러 구조의 재구성을 꼽았다. 10년 뒤 COLMAP 논문(Schönberger & Frahm, CVPR 2016)은 로마 사진 75,000장 가운데 21,000장을 등록한 결과를 실었다. 수백만 장 규모는 같은 시기 다른 대규모 재구성 시스템이 다뤘다(Ch.1 §4).

## 3.5 COLMAP — 공학적으로 다듬은 SfM

2016년 Johannes Schönberger와 Jan-Michael Frahm은 CVPR 논문 "[Structure-from-Motion Revisited](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf)"를 발표했다. 두 사람은 공개 구현인 Bundler, 비공개 구현인 VisualSFM과 견주면서 incremental SfM의 단계를 하나씩 다시 설계했고, 결과를 COLMAP이라는 이름으로 공개했다.

카메라를 더하는 순서부터 바꿨다. 논문은 잘못 고른 이미지 하나가 카메라 등록 실패와 잘못된 삼각측량을 줄줄이 부를 수 있다고 봤다. COLMAP은 다음에 더할 이미지를 고를 때, 이미 3D 위치를 구한 점이 그 이미지에 몇 개 보이는지와 그 점들이 이미지 안에 얼마나 고르게 퍼져 있는지를 함께 점수로 매긴다. 보이는 점의 개수만 세는 방식, 보일 수 있는 점 가운데 실제로 보이는 점의 비율만 보는 방식과 비교한 실험에서, 결국 등록되는 이미지는 같았지만 이 점수로 순서를 정했을 때 카메라 위치 오차가 가장 작았다.

bundle adjustment를 돌리는 주기도 바꿨다. 카메라를 하나 더할 때마다 전체 bundle adjustment를 돌리면 비용이 크다. COLMAP은 이미지를 하나 등록할 때마다 그 이미지와 가장 많이 연결된 이미지들만 묶어 local bundle adjustment를 돌리고, 전체 bundle adjustment는 모델이 일정 비율만큼 커졌을 때만 돌렸다. 이 방식은 VisualSFM을 따른 것이다.

매칭을 기하적으로 검증하는 단계도 강화했다. COLMAP은 이미지 쌍마다 먼저 fundamental matrix를 추정해, inlier가 충분하면 그 쌍을 검증된 쌍으로 본다. 이어서 같은 쌍에 homography를 맞춰 inlier 수를 비교한다. Homography는 평면 장면이나 카메라가 제자리에서 회전만 한 경우를 나타내므로, homography inlier가 상대적으로 적으면 일반 장면으로 판단한다. 내부 파라미터를 아는 이미지는 essential matrix로 점을 삼각측량해 그 각도로 제자리 회전(panoramic)과 평면 장면을 가른다. 워터마크나 날짜 표시 때문에 서로 다른 장소의 사진이 이어진 쌍도 이 단계에서 걸러 낸다. 재구성은 제자리 회전이 아닌 쌍에서만 시작하고, 제자리 회전 쌍에서는 점을 삼각측량하지 않는다.

> 🔗 **차용.** COLMAP은 Bundler와 같은 incremental SfM이다. essential matrix 추정, triangulation, Levenberg-Marquardt 같은 핵심 수학은 Hartley & Zisserman 교과서에 있는 그대로다. COLMAP이 새로 정한 것은 이미지 순서, 검증, 최적화 주기 같은 단계별 판단이었다.

COLMAP이 널리 쓰인 데에는 성능 말고도 이유가 있었다. 코드가 잘 정리돼 있었고 문서가 충분했으며, CUDA 가속으로 큰 이미지 집합도 처리했다. 2020년 NeRF가 나온 뒤 많은 NeRF 학습 코드가 COLMAP이 낸 카메라 포즈와 sparse point cloud를 입력으로 받았고, 3D Gaussian Splatting의 대표 구현도 같은 전처리를 썼다. 그래서 COLMAP은 여러 3D 재구성 파이프라인이 공통으로 거치는 첫 단계가 됐다.

## 3.6 SfM과 SLAM이 나뉘다

SfM과 SLAM은 같은 수학을 쓰지만 처리 조건이 다른 문제를 푼다. 이 구분은 2000년대 초에 뚜렷해졌다.

SfM은 보통 이미지를 모두 모은 뒤 *오프라인*으로 처리한다. 시간 제약이 없으니 전체 데이터를 여러 번 다시 보면서 global bundle adjustment를 몇 번이고 돌리고, 카메라 포즈가 틀렸으면 돌아가 다시 계산한다.

움직이는 로봇에서 도는 SLAM에는 이런 여유가 없다. 센서 데이터가 실시간으로 들어오는 동안 로봇의 현재 위치를 그 자리에서 내놓아야 한다. 지난 데이터를 끝없이 다시 볼 수 없고, 지도가 커질수록 계산량도 커진다. 한 바퀴 돌아 처음 왔던 곳에 다시 오면, 그 사이 쌓인 위치 오차(drift)를 바로잡아야 한다. 이 보정은 루프 위의 여러 포즈를 한꺼번에 고친다.

불확실성을 다루는 방식도 달랐다. SLAM은 현재 포즈의 불확실성을 실시간으로 추적하면서 새 관측이 들어올 때마다 갱신하므로, EKF나 factor graph 같은 확률 표현이 필요하다. SfM은 최적화가 끝난 뒤에 covariance를 계산해도 된다.

Davison은 2003년 ICCV 논문 "[Real-Time Simultaneous Localisation and Mapping with a Single Camera](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf)"에서 이 차이를 직접 짚었다. 그는 성공한 SfM 방법들이 모두 영상 전체를 모아 한꺼번에 처리하는 오프라인 알고리즘이라고 지적했다. 그리고 카메라로 실시간 추정을 하려면 불확실성 전파를 중시하는 로봇공학의 SLAM 연구가 오프라인 SfM보다 더 가깝다고 주장했다. 결론에서는 자기 방법을 "sequential Simultaneous Localisation and Mapping or Structure from Motion"이라고 불렀다. 2000년대를 지나며 두 분야는 각자 문제를 따로 정의하는 별개의 연구 분야가 됐다.

> 🔗 **차용.** Nistér, Naroditsky, Bergen의 2004년 CVPR 논문 "Visual Odometry"는 카메라 자신의 움직임(ego-motion)을 실시간으로 추정하는 문제에 SfM 기법을 쓴 초기 연구로 널리 인용된다. 이 논문의 방법은 프레임 사이의 상대 포즈를 짧은 구간 안에서 차례로 푼다. 모든 데이터를 한꺼번에 최적화할 때보다 정확도는 조금 떨어지지만 결과가 빨리 나온다.

## 3.7 🧭 아직 열린 것

**움직이는 물체가 있는 장면의 SfM.** COLMAP을 비롯한 범용 SfM 파이프라인은 세계가 정지해 있다고 가정한다. 장면의 점이 움직이지 않는다고 보고 bundle adjustment를 풀기 때문에, 자동차나 보행자가 많은 장면에서는 움직이는 물체에서 나온 매칭이 최적화 결과를 틀어 놓는다. RANSAC이 일부를 걸러 내고, Dynamic SfM 연구는 segmentation이나 물체별 움직임을 모델에 넣는다.

**흐려지는 SfM과 SLAM의 경계.** 2023년 12월 Wang 등의 [DUSt3R](https://arxiv.org/abs/2312.14132)는 카메라 내부 파라미터도 포즈도 모르는 이미지 두 장을 Transformer 네트워크에 넣어, 픽셀마다 3D 좌표를 담은 pointmap을 바로 회귀했다. 카메라 포즈와 픽셀 대응은 이 pointmap에서 다시 구한다. 이미지가 셋 이상이면 쌍마다 얻은 pointmap을 한 좌표계로 맞추는 global alignment를 쓴다. 2024년 Leroy 등의 [MASt3R](https://arxiv.org/abs/2406.09756)는 이 네트워크에 dense local feature를 내는 출력을 더해 매칭 정확도를 높였다. 전통 SfM 파이프라인의 모듈이 하나씩 학습한 모델로 바뀌고 있고, NeRF·3DGS의 전처리를 COLMAP 대신 DUSt3R 계열 모델로 하는 연구도 나온다. 이 방식이 COLMAP을 실제로 대신하게 될지, 일부 분야에서만 쓰일지는 아직 모른다.

---

SfM 연구자들이 오프라인 재구성을 정밀하게 다듬는 동안, 움직이는 로봇은 이미지가 다 모이기 전에 자기 위치를 추정해야 했다. 이 요구에서 SLAM이라는 별개의 분야가 자랐고, 그 출발점은 Randall Smith와 Peter Cheeseman이 [1986년에 다룬 문제](https://people.csail.mit.edu/brooks/idocs/Smith_Cheeseman.pdf), 곧 불확실한 공간 관계를 어떻게 표현하고 전파할지였다.

# Ch.4 — Smith-Cheeseman과 EKF-SLAM의 흥망

사진측량, SfM, bundle adjustment는 촬영을 마친 뒤 모든 이미지를 한꺼번에 오프라인으로 처리할 여유가 있다고 보았다. Hartley-Zisserman의 기하, RANSAC(무작위로 뽑은 표본으로 모델을 세워 이상치를 걸러 내는 방법), Levenberg-Marquardt는 장면을 정밀하게 재는 도구였다. 움직이는 로봇이 *지금* 어디에 있는지 답하는 일은 이 도구들이 겨냥한 문제 밖에 있었다. 로봇이 지도를 만들면서 자기 위치를 추정하는 문제를 확률로 다루기 시작한 것은 1980년대 중반이다.

Durrant-Whyte와 Bailey의 2006년 튜토리얼은 그 출발점을 1986년 샌프란시스코에서 열린 IEEE Robotics and Automation 학회로 잡는다. 지도 작성과 위치 추정에 추정 이론을 쓰려던 Peter Cheeseman, Jim Crowley, Hugh Durrant-Whyte 등이 학회 기간 내내 일관된 지도를 어떻게 만들지 논의했다. 그 뒤 몇 년 사이에 SRI International의 Randall Smith와 Cheeseman, 그리고 Durrant-Whyte가 landmark 사이의 관계와 기하 불확실성을 통계로 다루는 논문을 냈다. Oxford에서 Durrant-Whyte와 그의 박사과정 학생 John Leonard는 이 수학을 로봇이 지도를 만들면서 동시에 자기 위치를 추정하는 문제에 적용했다.

---

## 4.1 불확실한 공간 관계의 수학 — Smith, Self, Cheeseman (1988)

1986년 SRI International의 Randall Smith, Matthew Self, Peter Cheeseman은 로봇이 여러 장소를 거치며 측정값을 쌓을 때 오차가 어떻게 전파되는지를 수식으로 쓰려 했다. 이 연구는 UAI 1986에서 발표됐고, 1988년 논문집에 ["Estimating Uncertain Spatial Relationships in Robotics"](https://arxiv.org/abs/1304.3111)로 실렸다. 질문은 분명했다. 로봇이 A에서 B를 측정하고 B에서 C를 측정했을 때, A에서 C까지의 불확실성은 어떻게 계산할까?

[Kalman 필터](https://doi.org/10.1115/1.3662552)는 1960년에 나와 레이더 추적, 탄도 계산, 위성 궤도 추정에 쓰이고 있었다. Smith, Self, Cheeseman은 Kalman의 공분산 전파 방정식을 공간 변환을 이어 붙이는 연산(composition)에 맞게 다시 썼다. 로봇 pose $\mathbf{x}_r$과 landmark 위치 $\mathbf{m}_i$를 state vector 하나에 담고, 전체의 joint covariance $\mathbf{P}$를 함께 유지한다.

$$\mathbf{x} = [\mathbf{x}_r^\top,\ \mathbf{m}_1^\top,\ \ldots,\ \mathbf{m}_N^\top]^\top$$

$$\mathbf{P} = \begin{bmatrix} \mathbf{P}_{rr} & \mathbf{P}_{rm} \\ \mathbf{P}_{mr} & \mathbf{P}_{mm} \end{bmatrix}$$

비대각 블록 $\mathbf{P}_{rm}$은 로봇 위치의 불확실성과 landmark 위치의 불확실성이 서로 얼마나 얽혀 있는지 나타낸다. 이 상관관계를 버리지 않고 함께 추적해야 추정이 일관된다. 튜토리얼에 따르면 이 논문은, 로봇이 상대 관측을 쌓아 가면 로봇 위치 추정의 공통 오차 때문에 landmark 추정치들이 모두 서로 상관된다는 것을 보였다. 그러면 지도 전체와 로봇 pose를 한 state에 담아 관측마다 갱신해야 하고, 계산량은 landmark 수의 제곱으로 는다. 계산량이 이렇게 큰 데다 지도 오차가 수렴하는지도 알려지지 않아서, 한동안 연구자들은 landmark 사이의 상관관계를 줄이거나 아예 없애는 근사를 썼다. 1995년 무렵 연구자들은 결합 문제를 하나의 추정 문제로 풀면 실제로 수렴하며, 지우려던 상관관계가 오히려 문제의 핵심이라는 것을 깨달았다. 이 논문의 틀은 그 뒤 EKF-SLAM의 기본 형태가 됐다.

> 🔗 **차용.** Smith-Self-Cheeseman(1988)의 공간관계 수학은 Kalman(1960)의 공분산 전파를 그대로 이어받았다. 움직이는 물체 하나를 추적하던 기법을 로봇과 지도 요소 전체를 함께 추적하는 데 썼다.

## 4.2 "SLAM"이라는 이름

Smith-Self-Cheeseman의 1988년 논문에는 "SLAM"이라는 단어가 없다. 1991년 Leonard와 Durrant-Whyte는 IROS에 ["Simultaneous Map Building and Localization for an Autonomous Mobile Robot"](https://doi.org/10.1109/IROS.1991.174711)을 발표했다. 지도 작성과 위치 추정을 따로 떼어 풀 수 없고 동시에(simultaneously) 해야 한다는 생각을 제목에 담은 초기 논문으로 자주 인용된다. 그 무렵 연구자들은 같은 문제를 CML(concurrent mapping and localization) 등 여러 이름으로 불렀다.

Durrant-Whyte와 Bailey의 튜토리얼에 따르면 "SLAM"이라는 약어는 1995년 International Symposium on Robotics Research(ISRR)에서 발표된 이동 로봇 서베이 논문(Durrant-Whyte, Rye, Nebot)에 처음 나왔다. SLAM 문제의 구조와 수렴 결과도 이 논문에서 처음 소개됐다. Durrant-Whyte는 같은 해 Oxford에서 Sydney 대학으로 옮겼고, MIT Sea Grant의 AUV 연구실에서 일하던 Leonard는 이듬해 MIT 교수가 됐다. "Simultaneous Localization and Mapping"을 줄인 이 이름은 그 뒤 10년 사이에 분야 전체가 쓰는 이름이 됐다.

> 🔗 **병행 계보.** [Bar-Shalom의 다중 표적 추적](https://archive.org/details/trackingdataasso0000bars)(multi-target tracking, 1988년 단행본)과 초기 SLAM은 모르는 상태 여러 개의 불확실성과 data association(어느 관측이 어느 대상에서 왔는지 정하는 일)을 함께 다룬다는 점에서 수학이 겹친다. 표적과 추적기의 관계를 landmark와 로봇 pose에 대어 보면 두 문제를 이해하기 쉽다. 그래도 지금 확인되는 인용만으로는 Leonard와 Durrant-Whyte가 이 대응을 직접 가져왔다고 말할 근거가 부족하다.

## 4.3 EKF-SLAM의 공식

SLAM에는 Extended Kalman Filter(EKF)가 먼저 쓰였다. EKF는 SLAM 이전부터 비선형 시스템 추정에 쓰이던 필터로, 예측(predict)과 갱신(update) 두 단계를 되풀이한다.

predict 단계에서는 로봇이 움직이면 모션 모델 $f(\cdot)$로 state를 예측하고, Jacobian $\mathbf{F}$로 공분산을 전파한다.

$$\hat{\mathbf{x}}^- = f(\hat{\mathbf{x}}, \mathbf{u})$$
$$\mathbf{P}^- = \mathbf{F}\mathbf{P}\mathbf{F}^\top + \mathbf{Q}$$

update 단계에서는 센서 측정값 $\mathbf{z}$가 오면 관측 모델 $h(\cdot)$의 Jacobian $\mathbf{H}$로 Kalman gain $\mathbf{K}$를 계산해 state와 공분산을 갱신한다.

$$\mathbf{K} = \mathbf{P}^-\mathbf{H}^\top(\mathbf{H}\mathbf{P}^-\mathbf{H}^\top + \mathbf{R})^{-1}$$
$$\hat{\mathbf{x}} = \hat{\mathbf{x}}^- + \mathbf{K}(\mathbf{z} - h(\hat{\mathbf{x}}^-))$$
$$\mathbf{P} = (\mathbf{I} - \mathbf{K}\mathbf{H})\mathbf{P}^-$$

EKF-SLAM은 이 두 단계를 반복한다. 구조는 단순하지만 지도가 커지면 계산량이 감당할 수 없이 늘어난다.

원인은 state 차원이다. 6-DoF pose에 3D landmark $N$개를 담으면 state vector 차원은 $6 + 3N$이고, 공분산 행렬의 원소는 $(6+3N)^2$개, 곧 $O(N^2)$개다. 관측 차원이 고정돼 있어도 update 한 번에 전체 공분산을 갱신하는 데 $O(N^2)$ 비용이 든다. Kalman gain은 상태–관측 공분산에 $\mathbf{S} = \mathbf{H}\mathbf{P}^-\mathbf{H}^\top + \mathbf{R}$의 역행렬을 곱해 계산한다. $\mathbf{S}$의 크기는 관측 차원으로 정해지므로 이 역행렬 계산은 작다. 계산량은 공분산 전체를 갱신하는 데서 커진다. landmark가 100개면 공분산은 $306 \times 306$, 약 9.4만 원소이고 1,000개면 $3006 \times 3006$, 약 900만 원소다.

---

## 4.4 지도를 키우기 어렵다

Ch.0에서 본 [Davison의 ICCV 2003 논문](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf)은 full-covariance EKF-SLAM의 update 비용이 feature 수 $N$의 제곱에 비례하며, 2.2 GHz Pentium에서 feature가 100개에 가까워지면 update 시간이 빠르게 늘어난다고 적었다. 그보다 넓히려면 따로 발표된 SLAM 근사 기법을 써야 했다.

EKF는 결합 분포 전체를 한 덩어리로 유지하므로, 새 landmark를 더하면 그 landmark와 기존 모든 landmark 사이의 상관관계가 바로 생긴다.

2000년대 중반까지 연구자들이 주로 시도한 해법은 submap이었다. 전체 지도를 서로 겹치는 작은 영역으로 나누고, 영역마다 따로 EKF를 돌린 뒤 영역 사이를 별도의 구조로 잇는다. [Chong과 Kleeman(1999)](http://www.cs.cmu.edu/afs/cs/Web/People/motionplanning/papers/sbp_papers/integrated1/chong_feature_map.pdf)은 초음파 센서 배열로 큰 실내 환경의 지도를 만들면서 이런 방식을 썼다. 그러나 submap 경계에서 정보가 빠지고, loop closure를 처리하기 어렵고, 구현이 복잡해서 실제 시스템에는 드물게 쓰였다.

> 🔗 **차용.** Chong-Kleeman(1999)의 submap 분할과 현대 SLAM의 local window 최적화는 한 번에 계산하는 범위를 줄인다는 목적이 같다. ORB-SLAM의 local map과 VINS-Mono의 sliding window도 목적이 같다. 다만 지도를 나누는 방식과 상태를 주변화(marginalization)하는 방식이 달라서, 앞의 방법을 직접 이어받았다고 보기는 어렵다.

## 4.5 Consistency 문제: Julier-Uhlmann의 반례

EKF-SLAM의 더 근본적인 결함은 2001년 ICRA에서 드러났다. Simon Julier와 Jeffrey Uhlmann은 full-covariance SLAM이 일관되지 않은 지도를 낸다는 것을 보였다. 가장 단순한 경우는 프로세스 잡음 없이 멈춰 있는 로봇이 거리·방위 센서로 landmark를 재는 경우다. 이때도 각도 불확실성이 0이 아니면 지도가 반드시 비일관된다는 것을 증명했다. 움직이는 로봇에도 같은 결론이 적용되는 듯하다는 것은 시뮬레이션으로 보였고, 이 비일관성은 관측 갱신이 수백 번 쌓인 뒤에야 드러난다고 덧붙였다. 그들이 ICRA 2001에 낸 논문 제목은 ["A Counter Example to the Theory of Simultaneous Localization and Map Building"](https://doi.org/10.1109/ROBOT.2001.933280)이었다.

이 논문을 인용하는 후속 문헌은 대개 EKF-SLAM이 시간이 지날수록 *overconfident*해진다고 요약한다. 실제 추정 오차는 커지는데 필터가 계산한 공분산은 실제보다 작은 값으로 수렴한다. 이런 상태를 inconsistency(비일관성)라 한다.

원인은 선형화 오차(linearization error)다. EKF는 비선형 모션 모델과 관측 모델을 1차 Taylor 전개로 근사한다. 이 근사 오차가 단계마다 쌓이면 공분산이 실제 오차보다 작아진다. 필터가 자기 위치를 지나치게 확신하면 그 뒤에 들어오는 측정값을 덜 반영하고, 오차는 고쳐지지 않은 채 쌓인다.

2007년 [Shoudong Huang과 Gamini Dissanayake](https://doi.org/10.1109/TRO.2007.903811)는 이 비일관성의 원인을 더 자세히 분석했다. 이들은 매번 현재 추정치에서 계산한 Jacobian들이 서로 지켜야 할 기본 관계를 어기는 것을 주된 원인으로 들었다. 로봇에서 landmark까지의 상대 위치만 재면서 로봇과 landmark의 절대 위치 추정치를 갱신하는 방식도 원인으로 꼽았다. 극단적인 경우에는 로봇 방향각 추정의 분산이 실제와 달리 0까지 줄어들 수 있다. 그 뒤 나온 observability 분석은 이 논문을 바탕으로, 선형화하는 시점에 따라 관측 가능한 자유도가 달라지고 필터가 관측할 수 없는 방향에 근거 없는 정보를 넣는다고 설명했다.

> 📜 **예언 vs 실제.** Julier와 Uhlmann의 2001년 반례 뒤로 일관된 추정을 하려는 필터 설계가 이어졌다. Unscented Kalman Filter(UKF), Invariant EKF, robust covariance 같은 필터 변형이 10년 가까이 나왔다. 2026년에 돌아보면 최적화 기반 추정도 이 문제를 다루는 주요 방법이 됐다. [iSAM](https://www.cs.cmu.edu/~kaess/pub/Kaess08tro.pdf)(Kaess et al., TRO 2008), [g2o](http://ais.informatik.uni-freiburg.de/publications/papers/kuemmerle11icra.pdf)(Kümmerle et al., ICRA 2011), GTSAM이 널리 쓰였고, 필터 기반 VIO도 함께 발전했다. 반복 최적화는 남겨 둔 상태를 다시 선형화할 수 있다. 그래도 일관성을 지키려면 관측할 수 없는 방향과 주변화 과정의 선형화를 함께 관리해야 한다.

---

## 4.6 FastSLAM — 문제를 쪼개다

2002년 AAAI에서 Michael Montemerlo, Sebastian Thrun, Daphne Koller, Ben Wegbreit가 발표한 [FastSLAM](https://cdn.aaai.org/AAAI/2002/AAAI02-089.pdf)은 EKF-SLAM의 $O(N^2)$ 비용을 다른 방식으로 줄였다.

FastSLAM은 Rao-Blackwellization을 썼다. 로봇 경로 $x_{0:t}$를 알면 landmark들의 위치 추정은 *서로 독립*이 된다. 그래서 경로는 particle filter로 표현하고(particle 하나가 가능한 경로 하나), particle마다 landmark별로 작은 EKF를 따로 돌린다.

landmark마다 EKF가 따로 있으니 $N \times N$ 공분산 전체를 유지할 필요가 없다. particle이 $K$개, landmark가 $N$개면 resampling 때 particle마다 landmark 추정을 복사해야 해서 단순하게 짜면 한 단계에 $O(KN)$이 든다. 논문은 landmark 추정을 트리에 담아 바뀐 부분만 새로 만들게 해서 이 비용을 $O(K \log N)$으로 줄였다. 논문은 particle 수를 100개 정도로 고정해도 여러 상황에서 잘 동작한다고 보고했다.

논문의 시뮬레이션에서 FastSLAM은 landmark 5만 개짜리 지도를 particle 100개로 만들었다. 실제 로봇 실험은 NASA 화성 탐사 연구용 작은 실험장에서 SICK 레이저를 단 Pioneer 로봇으로 했고, particle 10개로 만든 지도의 평균 오차는 8.3 cm였다. 그러나 지도가 커지면 particle depletion이 문제가 됐다. 대부분의 particle이 틀린 경로를 나타내게 되고, 실제로 쓸모 있는 표본 수(effective sample size)가 급격히 준다. loop closure 때 경로 가중치를 다시 맞추기도 어렵다. particle 수를 늘려도 넓은 환경에서 drift가 쌓이는 문제는 풀리지 않았다.

[FastSLAM 2.0](https://www.ijcai.org/Proceedings/03/Papers/165.pdf)(Montemerlo et al., IJCAI 2003)이 proposal distribution을 개선했지만 필터로 푸는 한 지도 크기의 한계는 남았다. 이 한계는 그 뒤 그래프 최적화가 넘었다.

---

## 4.7 EKF의 퇴장

2005년 이후 그래프 기반 방법이 실제로 쓸 만해지면서 EKF-SLAM은 주력에서 물러났다. [Feng Lu와 Evangelos Milios가 1997년에 내놓은 그래프 아이디어](https://doi.org/10.1023/A:1008854305733)에 [Olson, Leonard, Teller(2006)](https://april.eecs.umich.edu/pdfs/olson2006icra.pdf)의 빠른 solver가 더해졌고, iSAM(2008)과 iSAM2는 희소 행렬 분해를 증분으로 갱신해, 그래프 방법도 새 관측을 바로바로 반영할 수 있게 했다.

loop closure는 로봇이 전에 왔던 곳에 다시 왔을 때 지도의 오차를 바로잡는 단계다. EKF는 이때 전체 공분산 행렬을 갱신해야 해서 비용이 $O(N^2)$다. 그래프 최적화는 pose graph에 엣지 하나를 더하고 희소 행렬을 다시 분해하므로 비용이 훨씬 낮다.

2010년 무렵부터 새 SLAM 시스템의 backend는 주로 그래프 최적화를 썼다. 필터는 visual-inertial odometry 쪽에서 계속 쓰였다(Ch.7b 참조).

> 📜 **예언 vs 실제.** Bailey와 Durrant-Whyte는 [2006년 IEEE Robotics & Automation Magazine 튜토리얼 2부](https://www.doc.ic.ac.uk/~ajd/Robotics/RoboticsResources/SLAMTutorial2.pdf)에서 계산량을 줄이는 방법으로 갱신 분할, information form의 희소화, submap을 소개했다. Information form은 EKF의 공분산 대신 그 역행렬(information matrix)을 쓰는 형태다. 큰 지도에서는 이 행렬의 비대각 원소가 대부분 0에 가깝다. Thrun 등은 이 원소들을 0으로 만드는 희소화를 내놓았지만, Eustice 등이 이 방법이 일관되지 않다는 것을 보였다. 튜토리얼은 지난 로봇 pose를 모두 state에 남겨 두면 information matrix가 근사 없이 희소해진다는 점도 짚었다. 2010년대에 주로 쓰인 것은 지난 pose를 남겨 두는 factor graph와 반복 최적화였다.

---

## 4.8 🧭 아직 열린 것

**필터와 최적화가 함께 쓰인다.** EKF는 backend 주력에서 물러난 뒤에도 계속 쓰인다. 2026년에도 자율주행 시스템 일부는 필터를 쓴다. 최적화 기반 SLAM은 반복해서 수렴시켜야 하므로 정해진 시간 안에 결과를 낸다고 보장하기 어려울 때가 있다. 값싼 임베디드 시스템에서는 sparse EKF나 UKF를 다시 쓰기도 한다.

**비가우시안 불확실성.** EKF의 가장 근본적인 가정은 불확실성이 가우시안 분포를 따른다는 것이다. 실제 센서 오차는 봉우리가 여럿인(multimodal) 분포이거나 꼬리가 두꺼운(heavy-tail) 분포일 때가 많다. 서로 다른 장소가 같아 보여 위치 가설이 여럿 생기는 perceptual aliasing 상황에서는 가우시안 하나로 불확실성을 제대로 나타낼 수 없다. Particle filter는 이론상 비가우시안 분포를 나타내지만 state 차원이 높으면 쓰기 어렵다. Stein particle, normalizing flow, 학습 기반 uncertainty estimation이 시도되고 있다.

---

Ch.0에서 보았듯 Davison은 2003년에 바로 이 EKF로 카메라 한 대만 써서 실시간 SLAM을 해 보였다.

# Ch.5 — MonoSLAM → PTAM: 카메라 한 대로 하는 실시간 SLAM과 tracking·mapping 분리

EKF-SLAM은 로봇 상태와 불확실성을 함께 추정하는 지도 작성 방법이었지만, 공분산 행렬이 landmark 수 $N$에 대해 $O(N^2)$로 커져 지도를 키우기 어려웠다. Davison과 Klein은 이 문제를 서로 다른 방식으로 다뤘다.

2003년 Oxford의 Davison은 손에 들고 움직이는 카메라의 위치와 주변 지도를 데스크톱 PC에서 실시간으로 추정했다. Smith, Self, Cheeseman의 확률적 공간 관계 수학과 Leonard·Durrant-Whyte의 EKF-SLAM 틀을 가져왔지만, 센서는 카메라 하나뿐이었다. IMU도 스테레오 카메라도 레이저도 없이 Shi-Tomasi의 특징 검출 연산자와 Kalman 필터의 예측-갱신 루프만 썼다.

4년 뒤인 2007년, 같은 Oxford의 Klein과 Murray는 tracking과 mapping을 두 스레드로 나눈 시스템을 내놓았다. 그 뒤 10년 동안 나온 Visual SLAM 시스템 상당수가 이 구조를 따랐다.

---

## 1. 2003년의 데모

2003년 ICCV에서 Davison은 [Real-Time Simultaneous Localisation and Mapping with a Single Camera](https://doi.org/10.1109/ICCV.2003.1238654)를 발표했다. 단안 카메라 하나로 SLAM을 실시간으로 돌린 결과였다.

Davison이 논문에서 지적했듯 당시 SLAM 연구에서 카메라를 주 센서로 쓴 경우는 드물었고, 주로 레이저 센서를 썼다. 2D 레이저 스캐너는 거리를 직접 쟀고, 스테레오 카메라는 두 영상의 시차로 픽셀마다 깊이를 구했다. 단안 카메라로 3D 구조를 추정하려면 적어도 두 프레임이 필요했고, 처음 추정한 깊이의 불확실성이 EKF 상태 벡터 전체로 퍼졌다. 이론으로는 풀 수 있는 문제였지만, 실시간으로 돌리기는 어려웠다.

MonoSLAM은 단안 카메라만 썼으므로 추가 하드웨어도, 스테레오 캘리브레이션도 필요 없었다.

---

## 2. EKF로 짠 단안 SLAM과 그 한계

2007년 IEEE PAMI에 실린 [MonoSLAM](https://doi.org/10.1109/TPAMI.2007.1049)은 Davison, Ian Reid, Nicholas Molton, Olivier Stasse가 함께 쓴 논문으로, ICCV 2003 데모를 완성한 형태였다.

MonoSLAM의 상태 벡터는 [Smith-Self-Cheeseman(1988)](https://arxiv.org/abs/1304.3111)과 [Leonard-Durrant-Whyte(1991)](https://ieeexplore.ieee.org/document/174711/)의 정식화(Ch.4)를 단안 카메라에 그대로 옮겼다. 카메라 상태 $\mathbf{x}_v \in \mathbb{R}^{13}$(위치 3, 사원수 방향 4, 속도 3, 각속도 3)과 landmark 위치 $\mathbf{y}_i \in \mathbb{R}^3$를 벡터 하나 $\mathbf{x} = (\mathbf{x}_v^\top, \mathbf{y}_1^\top, \ldots, \mathbf{y}_N^\top)^\top \in \mathbb{R}^{13+3N}$에 담았다. $(13+3N)\times(13+3N)$ 공분산 행렬 $\mathbf{P}$는 프레임마다 예측-갱신 루프로 유지했다. 예측 단계에서는 카메라 운동 모델 $f$의 Jacobian $\mathbf{F}$로 공분산을 전파했고($\mathbf{P}^- = \mathbf{F}\mathbf{P}\mathbf{F}^\top + \mathbf{Q}$), 갱신 단계에서는 투영 함수의 Jacobian $\mathbf{H}_i$로 Kalman gain을 계산해 상태와 공분산을 갱신했다. 수식은 Ch.4 §4.3과 같다. 다른 점은 상태 벡터에 카메라의 속도와 각속도가 들어간 것이다. 손에 든 카메라가 어떻게 움직일지 예측하려면 운동 모델이 필요했다.

공분산 행렬은 모든 landmark 사이의 상관관계를 담고 있었다. 공분산 갱신 $(\mathbf{I} - \mathbf{K}_i\mathbf{H}_i)\mathbf{P}^-$에서 비용이 가장 큰 부분은 $(13+3N)^2$ 크기 행렬 곱셈이고, 이 비용은 $N$에 대해 $O(N^2)$로 는다. PAMI 논문은 이 때문에 실시간으로 유지할 수 있는 feature 수가 제한된다고 적었다. 자기 시스템에서는 30 Hz 기준 "around 100"개였다.

Davison은 논문 결론에서 더 넓은 공간으로 가려면 sub-map 전략이 "certainly seems appropriate"라고 적으면서도, 시각 특징 지도를 의미 있는 하위 블록으로 깔끔하게 나누는 방법은 아직 분명하지 않다고 덧붙였다.

MonoSLAM은 [Shi-Tomasi(1994)](https://doi.org/10.1109/CVPR.1994.323794)의 연산자로 눈에 띄는 영상 영역을 찾아 landmark로 삼았다. "Good Features to Track"은 추적하기 좋은 점을 고르는 기준이었다. MonoSLAM은 질 좋은 특징으로 이루어진 희소한 지도를 유지하는 쪽을 택했고, PAMI 논문에 따르면 광각 렌즈에서 프레임마다 특징 12개 정도가 보이도록 지도를 관리했다.

> 🔗 **차용.** Shi-Tomasi(1994)의 코너 기준은 PTAM보다 앞서 MonoSLAM에서 이미 쓰였다. PTAM은 추적용 코너를 FAST-10으로 검출하고, 지도에 넣을 점을 고를 때 Shi-Tomasi 점수를 썼다.

## 3. 2007년, 같은 해

2007년 ISMAR에서 Klein과 Murray는 [Parallel Tracking and Mapping for Small AR Workspaces](https://doi.org/10.1109/ISMAR.2007.4538852)를 발표했다. 같은 해 PAMI에는 MonoSLAM의 정식 논문이 실렸다.

Klein은 Cambridge에서 Tom Drummond의 지도로 박사학위를 받았고, PTAM을 발표할 때는 Oxford에서 David Murray와 함께 일하는 박사후 연구원이었다. Murray는 Davison의 Oxford 박사과정 지도교수이기도 했다. PTAM 논문은 MonoSLAM이 질 좋은 특징의 희소한 지도를 쓴다고 짚고, 자신들은 질은 낮아도 훨씬 조밀한 지도를 쓰며 EKF 대신 tracking과 mapping을 나누는 구조를 택했다고 적었다.

---

## 4. Tracking과 Mapping을 나누다

PTAM은 Tracking(카메라 pose 추적)과 Mapping(3D 지도 작성)을 두 스레드로 나눠 병렬로 돌렸다.

EKF에서는 이 둘이 한 루프 안에 섞여 있었다. 프레임마다 예측-갱신을 한 번씩 돌리면서, 카메라가 움직이면 상태를 예측하고 이미지에서 landmark를 찾으면 상태를 갱신했다.

PTAM의 Tracking 스레드는 프레임마다 카메라 pose만 추정한다. 지도에 있는 3D 점들을 현재 이미지에 투영하고 실제 관측과 매칭해서 pose를 실시간으로 계산한다. Mapping 스레드는 새 keyframe이 들어오면 가장 새 keyframe과 가까운 keyframe 4개, 모두 5개에 대해 local bundle adjustment를 돌리고, 시간이 남으면 전체 지도에 global bundle adjustment를 돌린다. Tracking 스레드가 따로 돌기 때문에 Mapping이 느려져도 추적은 멈추지 않았다.

Mapping 스레드의 bundle adjustment는 keyframe 집합 $\mathcal{K}$와 3D 점 집합 $\mathcal{P}$에 대해 reprojection error의 합을 최소화했다:
$$\min_{\{\mathbf{T}_k\}, \{\mathbf{p}_j\}} \sum_{k \in \mathcal{K}} \sum_{j \in \mathcal{P}_k} \rho\!\left(\left\|\mathbf{z}_{kj} - \pi(\mathbf{T}_k,\, \mathbf{p}_j)\right\|^2_{\mathbf{\Sigma}_{kj}}\right)$$
$\mathbf{T}_k \in SE(3)$는 keyframe $k$의 pose, $\mathbf{p}_j \in \mathbb{R}^3$는 3D 점, $\pi$는 카메라 투영 함수, $\mathbf{z}_{kj}$는 keyframe $k$에서 점 $j$를 관측한 픽셀 좌표, $\mathbf{\Sigma}_{kj}$는 측정 공분산, $\rho$는 robust kernel로, PTAM은 Tukey biweight 함수를 썼다. 논문은 이 최적화를 풀기 위해 Hartley·Zisserman 교재 Appendix 6.6에 실린 Levenberg–Marquardt bundle adjustment를 "almost textbook" 그대로 구현했다고 적었다.

> 🔗 **차용.** PTAM의 Mapping 스레드가 돌리는 bundle adjustment는 사진측량에서 온 방법이다. PTAM 논문이 구현 근거로 든 것은 Hartley·Zisserman의 *Multiple View Geometry*(2판) Appendix 6.6이고, [Triggs et al. 1999 "Bundle Adjustment — A Modern Synthesis"](https://doi.org/10.1007/3-540-44480-7_21)는 인용하지 않았다.

Mapping 스레드가 bundle adjustment를 비동기로 돌리자, 지도에 넣을 수 있는 landmark 수가 EKF의 $O(N^2)$ 제약에서 벗어났다. 논문에 실린 예에서 PTAM의 지도에는 점 2000~6000개와 keyframe 40~120개가 들어갔고, 점 11000개와 keyframe 280개까지 시험했다. 다만 keyframe이 100개를 넘으면 global bundle adjustment가 새 keyframe 추가 속도를 따라가지 못했다. feature 100개 안팎을 다루던 MonoSLAM과는 규모가 달랐다.

초기 지도를 만드는 방법도 달랐다. 초기화 단계에서 사용자가 카메라를 부드럽게 옆으로 옮기면, PTAM은 [Nistér 2004](https://doi.org/10.1109/TPAMI.2004.17)의 5-point 알고리즘 계열로 essential matrix를 추정하고 첫 keyframe 쌍에서 초기 3D 구조를 복원했다.

Essential matrix $\mathbf{E}$는 두 카메라 좌표계 사이의 기하 관계를 담은 $3\times 3$ 행렬로, 대응점 쌍 $(\mathbf{p}, \mathbf{p}')$에 대해 ${\mathbf{p}'}^\top \mathbf{E}\, \mathbf{p} = 0$을 만족한다. $\mathbf{E} = \mathbf{t}_\times \mathbf{R}$($\mathbf{t}_\times$는 이동 벡터의 반대칭 행렬, $\mathbf{R}$은 회전)로 쓸 수 있어서 자유도가 5다. 대응점 5쌍이면 문제를 정할 수 있지만 해가 하나로 정해지지 않고, 복소수 해까지 치면 후보가 최대 10개 나온다. Nistér는 이 5-point 연립방정식을 빠르게 풀어 RANSAC 루프 안에서 실시간으로 돌릴 수 있게 했다. PTAM은 초기화 때 이 solver를 RANSAC과 함께 써서 첫 두 keyframe 사이의 상대 pose를 추정하고, 초기 3D 점군을 삼각측량으로 복원했다.

> 🔗 **차용.** PTAM의 5-point essential matrix 초기화는 Nistér(2004) "An Efficient Solution to the Five-Point Relative Pose Problem"에서 시작한 minimal solver(필요한 최소 개수의 대응점으로 해를 구하는 solver) 연구를 따른다. PTAM 논문이 직접 인용한 것은 그 후속인 Stewénius·Engels·Nistér(2006, ISPRS)다.

> 🔀 **구조적 평행.** EKF-SLAM의 submap과 PTAM의 keyframe 지도는 모두 계산량을 관리하려고 전역 지도를 골라낸 지역 단위로 다룬다. 그러나 PTAM 논문이 submap 연구를 설계 근거로 인용한 흔적은 찾지 못했다. PTAM 논문이 keyframe을 쓰는 이유로 든 것은 매 프레임을 처리하지 않아도 되므로 mapping을 실시간으로 돌릴 필요가 없다는 점이다. 뒤이은 ORB-SLAM은 여기에 covisibility graph를 더했다.

## 5. 새 구조가 퍼지다

PTAM은 AR(증강현실) 작업 공간을 대상으로 설계됐다. 논문 제목에도 "Small AR Workspaces"가 들어 있다. Tracking 스레드가 안정적이고 실시간으로 확실히 돌았기 때문에 AR 응용에 바로 쓸 수 있었다.

상용 AR SDK에도 SLAM이 들어갔다. Metaio(독일 AR 스타트업, 2015년 Apple이 인수)는 2012년 SDK에 SLAM을 넣었다. 회사 연구진의 [발표 자료](https://jsturm.de/publications/data/sturm2014ismar.pdf)(ISMAR 2014)는 이 SDK의 sparse SLAM이 local·global bundle adjustment와 relocalization을 갖췄다고 적었다.

2015년 IEEE Transactions on Robotics에 Raúl Mur-Artal, J.M.M. Montiel, Juan D. Tardós가 발표한 [ORB-SLAM](https://arxiv.org/abs/1502.00956)은 PTAM의 구조를 이어받았다. 특징은 patch에서 ORB 서술자로 바꾸고, keyframe 관리에는 covisibility graph를 쓰고, loop closure를 새로 더했다.

2018년 IEEE Transactions on Robotics에 실린 Qin, Li, Shen의 [VINS-Mono](https://arxiv.org/abs/1708.03852)도 sliding window 최적화와 loop closure를 서로 다른 스레드에서 돌린다. tracking과 mapping을 나누는 구조가 VIO까지 퍼진 예다.

## 6. Davison과 Klein·Murray의 관점

PAMI 논문은 표준 full-covariance EKF를 고른 이유로 목표를 들었다. 제한된 공간 안에서 오래, 반복해서 위치를 추정하는 것이 목표였다. 논문은 이때 같은 특징을 되풀이해 관측하므로, 복도를 따라 탐사하다 가끔 루프를 닫는 로봇 지도 작성과 관측 패턴이 다르다고 적었다. EKF는 상태의 불확실성을 공분산 행렬로 명시해서 관리했다. landmark 하나하나가 얼마나 불확실한지, landmark끼리 공분산으로 어떻게 얽혀 있는지를 수식이 계속 추적했다. 이 관점에서 bundle adjustment는 불확실성 표현을 일부 포기하고 확장성을 얻는 최소자승 최적화였다.

PTAM은 그 손해를 받아들였다. AR 응용에서 중요한 것은 카메라 pose를 실시간으로 추적하는 일이었고, 지도의 불확실성을 센티미터 단위로 추적할 필요는 없었다. bundle adjustment로 지도를 주기적으로 다듬으면 충분했다.

그 뒤 SLAM 연구는 PTAM 쪽을 따랐다. 2010년대에는 graph 기반 최적화와 bundle adjustment가 주류가 됐다. Davison의 연구실은 factor graph 기반 추정을 거쳐 Gaussian Belief Propagation(GBP)과 Robot Web 연구로 옮겨 갔다. [SLAM Handbook](https://github.com/SLAM-Handbook-contributors/slam-handbook-public-release) Ch.18 "The Computational Structure of Spatial AI Systems"에서 Davison은 현재 기하 추정의 핵심 기법이 EKF와 BA 같은 Gaussian 기반 기법이라고 쓰고, 그 연장으로 GBP를 소개한다. 같은 장은 MonoSLAM과 PTAM을 실험해 볼 수 있는 오픈소스 연구 시스템의 예로 든다.

## 📜 예언 vs 실제

> **Davison 2007 PAMI MonoSLAM**: Davison은 결론에서 더 넓은 실내·실외 환경, 더 빠른 움직임, 가림과 조명 변화가 있는 복잡한 장면을 다음 과제로 꼽았다. 구체적인 수단으로는 sub-map 전략과 전체 해상도에서 100 Hz로 찍는 IEEE 1394 CMOS 카메라를 들었고, 희소한 지도를 표면 같은 "higher-order entities"의 dense 표현으로 넓힐 수 있다고도 적었다.
>
> SLAM Handbook 15.5절은 지금의 SLAM 시스템이 환경 변화와 움직임에 이미 꽤 강건하다고 보면서도, 여러 극한 조건에 함께 효율적이고 강건한 SLAM은 열린 문제로 남겼다. DynaSLAM 같은 시도는 Ch.15b에서 다룬다. IMU 결합은 Davison이 결론에서 꼽지 않았고(관련 연구는 본문에서 인용), 2010년대 Visual-Inertial Odometry(VIO) 연구에서 본격적으로 다뤄졌다.

> **Klein & Murray 2007 PTAM**: Klein과 Murray는 §8(Failure modes / Mapping inadequacies)에서 코너 기반 추적이 모션 블러에 약하다는 점, 점 구름 위주의 지도가 장면의 기하를 이해하지 못한다는 점, 그리고 시스템이 "not designed to close large loops in the SLAM sense"라는 점을 한계로 들었다. 큰 루프를 닫지 못하는 이유로는 tracking의 M-estimator가 지도의 불확실성을 알지 못한다는 점을 적었다.
>
> 2015년 ORB-SLAM은 이 한계를 직접 겨냥했다. [DBoW2](http://doriangalvez.com/papers/GalvezTRO12.pdf)로 이미지 외관을 비교해 loop closure를 하고, covisibility graph로 keyframe을 관리했다. 외관 기반 loop closure는 ORB-SLAM이 PTAM 구조에 더한 기능이다. 모션 블러와 점 구름 지도 문제는 ORB-SLAM에서도 그대로 남았다.

## 🧭 아직 열린 것

**단안 카메라의 scale 복원.** MonoSLAM부터 PTAM까지 단안 카메라 시스템은 모두 scale을 알 수 없다. 장면 전체를 같은 비율로 키우거나 줄여도 이미지는 똑같이 찍히기 때문이다. IMU를 더하면 중력 방향과 가속도계 값으로 scale을 관측할 수 있다. IMU 없는 순수 단안 시스템의 scale 복원은 2026년에도 풀리지 않았다. [MiDaS](https://arxiv.org/abs/1907.01341)나 [Depth Anything](https://arxiv.org/abs/2401.10891) 같은 학습 기반 monocular depth 추정은 이미지 한 장에서 상대 깊이를 구하지만, 이것을 미터 단위로 바꾸려면 지면 가정이나 크기를 아는 물체 같은 외부 기준이 필요하다. 미터 단위 깊이를 바로 낸다는 모델도 나왔지만, 학습하지 않은 데이터셋에서 scale을 틀리는 경우가 보고됐다(Ch.11 §🧭 참조).

**어떤 환경에서나 도는 VO 시스템.** MonoSLAM의 실험은 실내의 작은 공간에 머물렀다. PTAM은 스스로 "Small AR Workspaces"로 범위를 좁혔다. 그 뒤 ORB-SLAM2가 실내, 실외, RGB-D를 함께 다루려 했지만 조명이 극단적으로 바뀌거나 텍스처가 적은 공간에서는 지금도 추적이 끊긴다. 카메라, LiDAR, IMU를 함께 쓰면 이 가운데 일부를 넘을 수 있다.

**어두운 곳과 움직이는 장면의 특징점 추적.** MonoSLAM은 조명이 충분하고 장면이 정지해 있어야 돌았다. 2007년의 PTAM도 마찬가지였다. 2026년에도 feature 기반 SLAM 시스템 대부분은 이 두 가정을 말없이 깔고 있다. 어두운 곳에서는 ORB feature가 잘 검출되지 않는다. 움직이는 사람이 많은 장면에서는 움직이는 점을 정지한 점으로 잘못 분류한다. 학습 기반 optical flow나 semantic segmentation으로 이 문제를 피하려는 연구가 이어지고 있다.

---

PTAM의 tracking·mapping 분리로도 풀리지 않은 문제가 있었다. keyframe이 쌓일수록 누적 오차가 커져서, 루프를 돌아 같은 곳에 오면 지도가 크게 어긋났다. 이 문제를 푸는 그래프 최적화의 틀은 PTAM보다 10년 앞선 1997년, 캐나다 York University의 Feng Lu와 Evangelos Milios가 레이저 스캔 정합 문제를 다루면서 이미 내놓았다.

# Ch.6 — Graph SLAM

1997년 캐나다 York University의 Feng Lu와 Evangelos Milios는 레이저 스캔을 하나씩 누적 지도에 붙여 나가면 정합 오차가 쌓여 지도가 서로 맞지 않게 된다고 지적했다. 두 사람은 스캔마다 local frame(스캔을 찍은 자리의 좌표계)을 남기고, frame 사이의 상대 위치를 모두 보관했다. 그런 다음 이 제약들을 한꺼번에 풀어 전체 pose를 맞췄다. 두 사람의 1997년 논문은 레이저 스캔 정합과 배치 최대우도 추정을 하나의 절차로 묶어 보였다. 이 방향을 연 사람은 두 사람 말고도 있다. 그보다 10여 년 앞서 LAAS의 [Chatila와 Laumond(1985)](https://www.semanticscholar.org/paper/Position-referencing-and-consistent-world-modeling-Chatila-Laumond/c34a678e40a7d80cb3683f07fc837179fd9bf3ee)가 이동 로봇의 참조 좌표계와 일관된 월드 모델을 논의했다. 1999년에는 [Gutmann과 Konolige](https://www.semanticscholar.org/paper/Incremental-mapping-of-large-cyclic-environments-Gutmann-Konolige/3c1bda51b8ca59f1836ed1b96c485d905804989a)가 큰 순환 환경을 증분 방식으로 지도화하면서 자세 정합을 썼다. 2000년대 초에는 Thrun 그룹이 이 접근을 *full SLAM* 문제로 정식화했고, [Folkesson과 Christensen(2004)](http://www.hichristensen.net/hic-papers/folkesson-icra2004.pdf), Konolige, Dellaert도 저마다 정식화를 내놓았다. 이 연구들을 거치며 SLAM은 전체 궤적을 한꺼번에 추정하는 문제가 됐다.

2000년대의 EKF-SLAM은 landmark가 늘수록 $O(N^2)$ 공분산 갱신에 막혔다. PTAM(2007)은 tracking과 mapping을 나누고 keyframe에 BA를 돌려 실시간 최적화를 해 보였다. 필터와 함께 발전한 graph 기반 smoothing은 여러 연구 집단을 거쳐 SLAM backend의 주요 방법이 됐다.

## 6.1 레이저 스캔에서 포즈 그래프로: Lu-Milios 1997

[Lu & Milios 1997. "Globally Consistent Range Scan Alignment for Environment Mapping"](https://doi.org/10.1023/A:1008854305733)이 나오기 전에는 연속한 레이저 스캔을 ICP(Iterative Closest Point) 같은 국소 정합으로 이어 붙이는 일이 많았다. ICP는 두 스캔을 가까이에서 잘 맞춘다. 그러나 drift(누적 오차)가 쌓이면 수십 미터만 가도 지도가 뒤틀리고, 루프를 돌아 출발점에 오면 지도가 어긋난다.

로봇의 포즈 $x_1, x_2, \ldots, x_n$을 노드로, 포즈 쌍 사이의 상대 측정값을 엣지로 놓으면 지도 작성은 그래프의 비용을 최소화하는 문제가 된다. 엣지마다 두 포즈 사이의 상대변환 $\hat{z}_{ij}$와 그 불확실성 $\Omega_{ij}$가 붙는다. 전체 비용 함수는

$$F = \sum_{(i,j) \in \mathcal{E}} e_{ij}^T \Omega_{ij} e_{ij}, \quad e_{ij} = z_{ij} - h(x_i, x_j)$$

이다. $h(x_i, x_j)$는 두 포즈에서 기대되는 상대변환을 계산하는 함수이고, $z_{ij}$는 실제로 잰 상대변환이다. $\Omega_{ij} = \Sigma_{ij}^{-1}$는 측정 공분산의 역행렬로, 정보 행렬이라고 부른다.

loop closure(전에 왔던 곳을 알아보고 궤적을 닫는 일)도 같은 식으로 다룬다. 같은 장소를 다시 찾았을 때 얻은 상대 측정값을 엣지로 더하면, 최적화가 그 제약에 맞춰 모든 포즈를 고친다. EKF에서 loop closure는 공분산 전체를 $O(N^2)$ 비용으로 갱신하는 무거운 작업이었다. 포즈 그래프에서는 제약 하나가 엣지 하나다. 다만 그 제약을 추정에 반영하려면 그래프를 다시 최적화해야 한다.

> 🔗 **차용.** 포즈 그래프 최적화는 비선형 최소자승 문제다. 이런 문제는 [Levenberg(1944)](https://www.ams.org/qam/1944-02-02/S0033-569X-1944-10666-0/)와 [Marquardt(1963)](https://doi.org/10.1137/0111030)가 비선형 파라미터 추정용으로 만든 방법으로 풀어 왔다. 수십 년 된 수치 최적화 방법이 레이저 지도 작성의 backend에 쓰였다.

Lu와 Milios는 모든 포즈를 한 번에 푸는 배치(batch) 선형 시스템을 썼다. 스캔이 늘면 선형 시스템도 커져서 큰 환경에 바로 쓰기는 어려웠다. 그래도 최적화로 지도 전체를 일관되게 맞출 수 있음을 보였다. 그 뒤 Gutmann과 Konolige는 증분 계산을, Folkesson과 Christensen은 잘못된 data association(관측과 landmark의 대응)에 강한 방법을, Thrun 그룹은 큰 실제 환경에 적용하는 일을 중점으로 다뤘다.

## 6.2 정보 행렬의 희소성

Lu와 Milios의 논문이 나온 뒤 여러 그룹이 이 방법을 넓혔다. 이들이 공통으로 주목한 것은 정보 행렬(information matrix, $\Omega = \Sigma^{-1}$)의 **희소성(sparsity)**이었다.

EKF-SLAM의 공분산 행렬 $\Sigma$는 조밀(dense)하다. 로봇이 landmark를 하나 관측할 때마다 다른 모든 landmark와의 상관관계가 갱신된다. 2D landmark가 $n$개 있으면 공분산의 landmark 부분만 해도 $2n \times 2n$ 행렬이고, 갱신 비용은 $O(n^2)$다. landmark가 늘수록 실시간으로 돌리기 어려워진다.

포즈 그래프의 정보 행렬은 희소하다. 포즈 $x_i$와 $x_j$가 직접 측정으로 이어져 있을 때만 $\Omega$의 $(i,j)$ 블록이 0이 아니다. 로봇이 계속 움직이는 동안에는 이웃한 포즈끼리만 엣지로 이어지므로 $\Omega$는 띠 모양(banded) 희소 행렬이 된다. loop closure 없이 주행만 하면 이 행렬은 블록 삼중대각(block tridiagonal)이다.

Sebastian Thrun 그룹의 [Sparse Extended Information Filter(SEIF)](http://www.cs.cmu.edu/~thrun/papers/thrun.tr-seif02.pdf)는 이 희소성을 직접 이용해 계산 비용을 $O(n^2)$보다 크게 줄였다. 실제 비용은 그래프 구조에 따라 다르다(§6.6).

> 🔗 **차용.** [Eustice 등의 exactly sparse delayed-state filter](https://web.mit.edu/2.166/www/handouts/eustice_et_al_ieeetro_2006.pdf)도 필터에서 정보 행렬의 희소성을 이용할 수 있음을 보였다. 희소성을 이용한다는 생각은 Dellaert의 factor graph 정식화와 Bayes tree로 이어졌다.

2006년 ICRA에서 [Olson, Leonard, Teller](https://april.eecs.umich.edu/pdfs/olson2006icra.pdf)는 stochastic gradient descent의 변형으로 포즈 그래프를 최적화하는 방법을 발표했다. 오도메트리에서 온 초기값이 크게 틀려도 궤적을 빨리 되찾는 것이 목표였다. 논문은 포즈 3,500개와 제약 5,600개로 된 합성 문제, 포즈 약 1,900개인 Killian Court 실측 데이터로 이 방법을 시험했다. Olson의 구현 코드는 그 뒤 널리 퍼졌다.

## 6.3 Factor Graph와 Square Root SAM

2006년 Dellaert와 당시 박사과정 학생이던 Kaess는 [Square Root SAM](https://doi.org/10.1177/0278364906072768)을 IJRR에 발표해 SLAM backend를 factor graph로 정식화했다. Dellaert는 Georgia Tech에서 probabilistic graphical model(확률 그래프 모델)을 연구해 왔다. Square Root SAM은 SLAM을 Bayes 추론 문제로 쓰고, 그 추론을 factor graph에서 풀었다.

**Factor graph**는 변수 노드와 factor 노드를 엣지로 이은 이분 그래프다. 변수 노드는 로봇 포즈와 landmark 위치이고, factor 노드는 관측값이나 사전 확률(prior)이다. Factor $f_k(x_{i_1}, x_{i_2}, \ldots)$는 연결된 변수들 사이의 확률적 제약을 나타낸다. 전체 결합 확률은

$$p(X) \propto \prod_k f_k(X_k)$$

이며, MAP 추정은 이 확률을 최대로 만드는 $X^*$를 찾는다. factor가 Gaussian이면 이 문제는 비선형 최소자승 문제가 된다.

Jacobian 행렬 $J$를 QR 분해하면 상삼각(upper triangular) 행렬 $R$이 남는다. $R^T R = J^T J = \Omega$이며, 이 $R$을 "square root information matrix"라고 부른다. $R$이 얼마나 희소한지는 변수 제거(variable elimination) 순서와 factor graph의 연결 구조가 정한다. AMD나 COLAMD 같은 순서 정하기 방법으로 fill-in(분해 중에 새로 생기는 0이 아닌 항)을 줄이면 희소한 $R$을 얻는다.

이 방식은 EKF의 공분산 갱신보다 수치적으로 안정하다. 지도 전체의 landmark와 포즈를 함께 최적화한다.

## 6.4 iSAM과 iSAM2: 온라인 증분 추론

Square Root SAM은 배치(batch) 방법이었다. 새 관측이 들어올 때마다 $J^T J$ 전체를 다시 분해해야 한다. 조밀 행렬이면 비용이 $O(n^3)$이고, 희소 행렬이면 연결 구조와 소거 순서에 따라 달라진다. 어느 쪽이든 온라인 로봇 시스템에 쓰기는 어려웠다.

2008년 Kaess, Ranganathan, Dellaert가 IEEE TRO에 발표한 [**iSAM**(incremental Smoothing and Mapping)](https://www.cs.cmu.edu/~kaess/pub/Kaess08tro.pdf)은 이 문제를 Givens rotation으로 풀었다. 변수와 factor가 새로 들어오면 QR 분해를 처음부터 다시 하지 않는다. 새 행만 붙이고 Givens rotation으로 $R$을 고친다.

iSAM에는 주기적으로 배치 계산을 다시 해야 하는 약점이 있었다. 비선형 factor를 선형화해서 만든 $R$은 현재 추정값 근처의 1차 근사일 뿐이다. 로봇이 움직이며 추정값이 선형화 지점에서 멀어지면 근사 오차가 커진다. 루프가 있는 궤적에서는 $R$에 fill-in이 생겨 희소 구조도 무너진다. iSAM은 두 문제를 함께 다뤘다. 논문의 실험에서는 100스텝마다 변수 순서를 다시 정하고, 그때 측정 함수도 다시 선형화해 $R$을 처음부터 다시 분해했다.

2012년 Kaess 등이 IJRR에 발표한 [iSAM2](https://doi.org/10.1177/0278364911430419)는 Bayes tree라는 자료구조로 이 주기적 배치 계산을 없앴다. factor graph에 variable elimination을 적용하면 chordal Bayes net을 얻는데, Bayes tree는 이 Bayes net에서 만드는 트리다. Bayes net의 clique가 노드이고, clique끼리 공유하는 변수(separator)가 엣지다. factor가 새로 들어오면 Bayes tree에서 영향을 받는 clique를 찾고, 그 부분만 factor graph로 되돌려 다시 선형화하고 다시 푼다. **Fluid relinearization**은 추정값이 선형화 지점에서 임계값 $\beta$보다 많이 움직인 변수만 골라 다시 선형화하고, 그 변수가 걸린 clique만 다시 계산한다. loop closure가 생겨도 영향을 받는 clique가 일부에 그치는 경우가 많아 전체를 다시 계산하지 않아도 됐다.

> 🔗 **차용.** Bayes tree의 바탕은 확률 그래프 모델 문헌의 junction tree(join tree) 알고리즘이다. Koller와 Friedman의 [*Probabilistic Graphical Models*](https://mitpress.mit.edu/9780262013192/probabilistic-graphical-models/) 같은 표준 교과서가 다루는 소거 순서와 chordal 그래프 기반 추론이 여기에 해당한다. iSAM2는 인공지능 분야의 이 추론 기법을 실시간 로봇 SLAM에 가져왔다.

iSAM2는 [GTSAM(Georgia Tech Smoothing and Mapping)](https://gtsam.org) 라이브러리로 공개됐다. C++로 짰고 Python 바인딩이 있다. Dellaert는 2015년 이후 Skydio, Facebook, Google AI, Verdant Robotics에서도 일했고, 그동안에도 GTSAM 개발은 이어졌다. GTSAM의 공개 문서와 사례에는 자율주행, 드론, 로봇팔 보정 같은 응용이 들어 있다.

## 6.5 g2o: ROS 생태계의 범용 그래프 최적화기

Freiburg 대학의 Rainer Kümmerle, Giorgio Grisetti, Wolfram Burgard와 Imperial College London의 Hauke Strasdat, Willow Garage의 Kurt Konolige는 2011년 ICRA에서 [g2o](https://doi.org/10.1109/ICRA.2011.5979949)(general graph optimization)를 발표했다. g2o는 여러 종류의 그래프 최적화 문제를 플러그인 방식으로 풀도록 만든 오픈소스 구현이다.

g2o는 vertex, edge, solver를 따로 정의한다. vertex(변수 노드)와 edge(factor 또는 제약)가 그래프를 이루고, solver가 희소 선형 시스템을 푼다. 사용자가 vertex 타입과 edge의 오차 함수, Jacobian을 정의하면 g2o가 Gauss-Newton이나 Levenberg-Marquardt로 전체를 최적화한다. 희소 solver는 CHOLMOD, CSparse, Eigen 가운데 고르거나 외부 라이브러리로 바꿀 수 있다.

2010년대 초 ROS(Robot Operating System)가 모바일 로봇 연구에 널리 퍼지면서 g2o도 그래프 기반 SLAM의 대표 구현 가운데 하나가 됐다. ORB-SLAM과 LSD-SLAM이 g2o를 썼다. 같은 시기 ROS에서 널리 쓰인 gmapping은 particle filter 계열이고, Cartographer는 Ceres를 쓴다.

---

## 6.6 그래프 방법이 주류가 된 이유

필터와 그래프 방법은 문제를 세우는 방식부터 달랐다. EKF-SLAM은 현재 상태의 최적 추정값과 불확실성을 유지하면서 과거를 marginalize한다. 과거 포즈는 상태에서 지워지고, 누적 오차는 현재 추정값에 섞여 남는다. loop closure를 반영하려면 현재 공분산을 크게 갱신해야 한다.

그래프 SLAM은 과거 포즈를 상태에 남겨 둔다. 포즈, landmark, 관측값이 모두 그래프에 남는다. loop closure 엣지를 더해 다시 최적화하면 전체 궤적이 서로 맞게 고쳐지므로 이미 지나간 포즈도 수정할 수 있다. 이산 keyframe 대신 시간에 따라 연속인 궤적으로 그래프를 다시 세우는 방법은 Ch.7c(Continuous-Time SLAM)에서 다룬다.

계산 비용도 달랐다. landmark 수가 $N$이면 EKF의 갱신 비용과 저장 공간은 모두 $O(N^2)$다. 그래프 방법은 희소 Cholesky나 QR 분해를 쓰면 계산량이 크게 준다. 다만 갱신 비용은 그래프 연결, 분해 중의 fill-in, 소거 순서, 다시 계산할 영역에 달려 있다. 좁은 공간을 움직인다는 조건만으로 $O(N \log N)$을 보장할 수는 없다.

marginalization(변수를 적분해 없애고 그 정보를 남은 변수에 넘기는 일)도 그래프에서는 다루기 쉬웠다. 오래된 포즈를 marginalize하면 그 정보는 남은 변수들을 잇는 factor로 남는다. 필터도 과거 상태를 지우면서 그 정보를 현재 추정에 넘긴다. 어느 쪽이든 정보를 압축할 때 생기는 근사와 재선형화 제약을 따져야 한다. sliding window 최적화나 keyframe 선택 같은 공학적 절충은 여기서 나온다.

---

## 6.7 비선형성과 강건성: 실제 구현의 문제들

이론으로 정리된 그래프 최적화를 실제 시스템에서 돌리려면 손볼 곳이 많았다.

먼저 초기값이다. Gauss-Newton이나 LM 최적화는 초기 포즈 추정이 참값에서 크게 벗어나 있으면 지역 최솟값(local minimum)에 수렴한다. loop closure에 잘못된 대응이 섞이면 해가 엉뚱한 곳으로 간다. 그래서 backend에 넘기기 전에 loop closure를 검증하고 outlier를 걸러 내는 일이 중요해졌다. 볼록 완화(SDP)로 지역 최솟값을 피하고 해가 전역 최적임을 증명하는 연구는 Ch.6b(Certifiable SLAM)에서 다룬다.

표준 최소자승이 outlier에 약하다는 것도 금방 드러났다. Huber 비용이나 Cauchy 비용 같은 robust kernel을 쓰면 잘못된 매칭의 영향을 줄일 수 있다. g2o와 GTSAM 모두 robust kernel을 고를 수 있다. 어느 kernel을 쓸지는 환경과 센서 특성을 보고 정한다.

marginalization 근사도 문제다. iSAM2의 Bayes tree는 증분 추론을 정확하게 하지만, 변수가 계속 늘면 트리도 커진다. 실제 시스템은 오래된 포즈를 marginalize해서 트리 크기를 관리한다. marginalize할 때 생기는 fill-in은 정보 행렬을 조밀하게 만든다. 어디서 잘라 낼지, prior factor로 어떻게 근사할지에 따라 구현 품질이 달라진다.

> 📜 **예언 vs 실제.** g2o가 내세운 범용성은 사용자가 상태를 vertex로, 관측 제약을 edge로 정의하면 같은 최적화 틀에서 풀 수 있다는 뜻이었다. 이후 연구들은 line, plane, 관성, 객체 제약을 각자의 시스템에 맞는 사용자 정의 edge로 구현했다.

---

## 🧭 아직 열린 것

어느 robust kernel을 골라야 하는가. Huber, Cauchy, Geman-McClure, DCS 같은 선택지가 있다. Chebrolu 등은 kernel을 보통 사람이 골라 손으로 조정한다고 지적했다. 이들의 [adaptive robust kernel](https://doi.org/10.1109/LRA.2021.3061331)(RA-L 2021)은 Barron의 일반화 kernel을 써서, 최적화 도중 잔차 분포에 맞춰 kernel 모양을 정했다. 논문은 이 방법을 ICP와 bundle adjustment에서 시험했다.

Gaussian이 아닌 분포를 factor graph에서 어떻게 나타낼지도 아직 풀리지 않았다. GTSAM과 g2o의 기본 최적화는 residual이 Gaussian이라고 가정한다. robust kernel, max-mixture, hybrid factor 같은 확장이 이 가정을 넘어 loop closure가 잘못 매칭됐을 확률이나 여러 포즈 가설을 다루려 한다.

Bayes tree의 증분 효율은 새 factor가 건드리는 clique가 일부에 그칠 때 가장 크다. 대규모 지도에서 loop closure 제약이 조밀해지면 영향을 받는 subtree와 fill-in이 커져 계산량과 메모리가 늘 수 있다. 지도를 계층으로 관리하거나 submap으로 나눠 이 증가를 억제하려는 연구가 있다.

---

2010년대 들어 backend를 둘러싼 논쟁은 잦아들었다. g2o와 GTSAM이 널리 쓰이자 연구자들은 frontend로 관심을 옮겼다. 어떤 feature를 쓰고, 루프를 얼마나 멀리서 알아보느냐가 새 질문이 됐다.

그래도 g2o와 GTSAM이 내놓은 해가 정말 전역 최솟값인지는 여전히 물을 수 있었다. Ch.6b는 이 certifiability(해가 전역 최적임을 증명하는 문제)를 다룬다.
