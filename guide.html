# Ch.4 — Smith-Cheeseman and the Rise and Fall of EKF-SLAM

The photogrammetry, SfM, and bundle adjustment of Part I shared one assumption: either the camera remained still or there was time after capture to process every image offline as a batch. Hartley-Zisserman's geometry, RANSAC's robust estimation, and Levenberg-Marquardt's iterative optimization could measure the world, but they did not ask where a moving robot was *right now*. Part II begins with that question. The robot must build a map, locate itself, and maintain the estimate as uncertainty accumulates. Probabilistic mapping began with a small memo from SRI International.

In 1986 Randall Smith and Peter Cheeseman set out to formalize uncertainty in a robot's spatial measurements. Their work at SRI International inherited Kalman's (1960) filter mathematics but extended it from a single state estimate to an entire *network of spatial relationships*. Several years later, Hugh Durrant-Whyte in Sydney and John Leonard at MIT coupled that mathematics to a new problem statement: a robot estimates its own position while building a map. The acronym "SLAM" emerged from that union.

---

## 4.1 The mathematics of uncertain spatial relationships — Smith, Self, Cheeseman (1988)

In 1986 Randall Smith, Matthew Self, and Peter Cheeseman at SRI International set out to express how error propagates when a robot accumulates measurements across several places. Their work was presented at UAI 1986 and published in 1988 as ["Estimating Uncertain Spatial Relationships in Robotics"](https://arxiv.org/abs/1304.3111). The question was clear: when a robot measures B from A and then C from B, how is the uncertainty from A to C computed?

The [Kalman filter](https://www.cs.unc.edu/~welch/kalman/kalmanPaper.html) already existed. It had been used since 1960 for radar tracking, ballistic calculation, and satellite-orbit correction. Smith, Self, and Cheeseman reformulated Kalman's covariance-propagation equations for the composition of spatial transforms. They placed the robot pose $\mathbf{x}_r$ and landmark positions $\mathbf{m}_i$ in one state vector and maintained the joint covariance $\mathbf{P}$ over the entire state.

$$\mathbf{x} = [\mathbf{x}_r^\top,\ \mathbf{m}_1^\top,\ \ldots,\ \mathbf{m}_N^\top]^\top$$

$$\mathbf{P} = \begin{bmatrix} \mathbf{P}_{rr} & \mathbf{P}_{rm} \\ \mathbf{P}_{mr} & \mathbf{P}_{mm} \end{bmatrix}$$

The off-diagonal block $\mathbf{P}_{rm}$ records the crucial relation: robot-pose uncertainty and landmark-position uncertainty are *correlated*. Only by tracking that correlation can the estimate remain consistent. The paper demonstrated this explicitly, establishing a starting point for the SLAM field.

> 🔗 **Borrowed.** Smith-Self-Cheeseman's (1988) spatial-relationship mathematics inherits directly from Kalman's (1960) covariance propagation. A technique for tracking a single moving object became a framework for tracking a robot and every element of its map at once.

---

## 4.2 How the name "SLAM" settled in

There is no "SLAM" in the 1988 Smith-Self-Cheeseman paper. In the early 1990s, Hugh Durrant-Whyte, who had moved from Oxford to Sydney, and John Leonard at MIT used different names for the same problem in their respective labs. Once the groups began citing each other, they needed a shared term, and "SLAM" gradually became standard. Researchers' memories differ on which document used it first. No canonical first-use paper exists.

Leonard and Durrant-Whyte's 1991 paper, ["Simultaneous Map Building and Localization for an Autonomous Mobile Robot"](https://doi.org/10.1109/IROS.1991.174711), is often cited as an early mainstream robotics paper to state the problem in its title. The title captured the intuition before the acronym existed: mapping and localization are inseparable and must be performed simultaneously.

The name was "Simultaneous Localization and Mapping," abbreviated SLAM. For the next ten years, the field converged around it.

> 🔗 **Borrowed.** [Bar-Shalom's multi-target tracking](https://archive.org/details/trackingdataasso0000bars) (multi-target tracking, collected as a 1988 monograph) supplied a framework for estimating the states of many objects at once. Leonard and Durrant-Whyte can be read as mapping "target position" to "landmark position" and "tracker position" to "robot pose" inside that framework. This was a case of radar technology translated into indoor robot mapping.

---

## 4.3 The EKF-SLAM formulation

The Extended Kalman Filter (EKF) was already standard in nonlinear system estimation before 1988, making its application to SLAM unsurprising. It runs in two stages: predict and update.

During the predict stage, the motion model $f(\cdot)$ predicts the state as the robot moves, and the Jacobian $\mathbf{F}$ propagates the covariance.

$$\hat{\mathbf{x}}^- = f(\hat{\mathbf{x}}, \mathbf{u})$$
$$\mathbf{P}^- = \mathbf{F}\mathbf{P}\mathbf{F}^\top + \mathbf{Q}$$

During the update stage, a sensor measurement $\mathbf{z}$ arrives, and the Jacobian $\mathbf{H}$ of the observation model $h(\cdot)$ yields a Kalman gain $\mathbf{K}$ that updates the state and covariance.

$$\mathbf{K} = \mathbf{P}^-\mathbf{H}^\top(\mathbf{H}\mathbf{P}^-\mathbf{H}^\top + \mathbf{R})^{-1}$$
$$\hat{\mathbf{x}} = \hat{\mathbf{x}}^- + \mathbf{K}(\mathbf{z} - h(\hat{\mathbf{x}}^-))$$
$$\mathbf{P} = (\mathbf{I} - \mathbf{K}\mathbf{H})\mathbf{P}^-$$

These two stages define EKF-SLAM. The structure is simple, and that simplicity imposed a scalability ceiling from the start.

The problem is state dimension. A state containing a 6DOF pose and $N$ 3D landmarks has dimension $6 + 3N$; its covariance matrix contains $(6+3N)^2$ entries, an $O(N^2)$ structure. Even with a fixed observation dimension, updating the full covariance costs $O(N^2)$. The Kalman gain requires multiplying the state–observation covariance by the inverse of $\mathbf{S} = \mathbf{H}\mathbf{P}^-\mathbf{H}^\top + \mathbf{R}$; the size of $\mathbf{S}$ depends on the observation dimension. 100 landmarks gives $306 \times 306 \approx$ 94k entries; 1,000 landmarks gives $3006 \times 3006 \approx$ 9M. A regular PC in the early 2000s could maintain only tens to low hundreds of landmarks in real time.

[Andrew Davison's MonoSLAM (2003)](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf) was limited to a few dozen landmarks in its live demos because EKF-SLAM's $O(N^2)$ wall set the ceiling.

---

## 4.4 The scalability wall

When Davison ran real-time 3D tracking from a single webcam at ICCV 2003, he mapped a desk-sized space with a few dozen features. With no commercial SLAM systems available, a real-time monocular demo was rare. Its ceiling came from the size of the covariance matrix.

At 100 landmarks the covariance matrix is $306 \times 306$ (6DOF pose + 100 3D landmarks, state dimension $6 + 3 \times 100 = 306$). At 1,000 it is $3006 \times 3006$. Every time step that matrix has to be updated along with a matrix inversion. On top of that, because the EKF keeps the full joint distribution in one block, adding a new landmark immediately generates cross-correlations with every existing landmark. As the map grows, update cost grows quadratically.

The main workaround through the mid-2000s was submapping: partition the map into small overlapping regions, run an EKF inside each one, and connect them through a separate structure. [Chong and Kleeman (1999)](http://www.cs.cmu.edu/afs/cs/Web/People/motionplanning/papers/sbp_papers/integrated1/chong_feature_map.pdf) proposed an early form. Information loss at submap boundaries, difficult loop closure, and implementation complexity made these approaches hard to deploy.

> 🔗 **Borrowed.** Chong-Kleeman's (1999) submaps and local-window optimization in modern SLAM share the goal of limiting computation. ORB-SLAM's local map and VINS-Mono's sliding window reflect that concern. Their map partitioning and state marginalization differ, however, so the parallel does not establish direct inheritance of the same method.

---

## 4.5 The consistency problem: Julier-Uhlmann's counterexample

A deeper flaw in EKF-SLAM surfaced at ICRA 2001. Simon Julier and Jeffrey Uhlmann analyzed EKF-based SLAM through numerical experiments and showed that the filter trusts itself too much. Their IEEE ICRA paper was titled ["A Counter Example to the Theory of Simultaneous Localization and Map Building"](https://doi.org/10.1109/ROBOT.2001.933257). The title was provocative, and the content matched it.

Secondary literature summarizes the result this way: EKF-SLAM becomes asymptotically *overconfident*. Actual estimation error grows while the covariance (uncertainty) computed by the filter converges below its true value. This is inconsistency.

The cause sits in linearization error. The EKF approximates nonlinear motion and observation models by a first-order Taylor expansion. When this approximation error accumulates step by step, the covariance begins to underestimate the real error. Once the robot becomes overconfident that "I am here," the filter trusts subsequent measurements less, and errors pile up without correction.

In 2007 [Shoudong Huang and Gamini Dissanayake](https://doi.org/10.1109/TRO.2007.903811) analyzed the cause of this inconsistency more precisely. They found that basic constraints among Jacobians evaluated at the current state estimate break down, driving EKF-SLAM's inconsistency. As a result, the variance of the robot's heading angle (yaw) can wrongly converge to zero when it should remain nonzero. Later observability-based analyses start from this result: the system's observable degrees of freedom change with the linearization point, and the filter injects spurious information into unobservable directions.

> 📜 **Prediction vs. outcome.** After Julier and Uhlmann's 2001 counterexample, researchers spent nearly a decade designing consistent estimators. Filter variants included the Unscented Kalman Filter (UKF), Invariant EKF, and robust covariance methods. From the vantage point of 2026, however, optimization-based estimation became another major approach to the problem. [iSAM](https://www.cs.cmu.edu/~kaess/pub/Kaess08tro.pdf) (Kaess et al., 2008), [g2o](http://ais.informatik.uni-freiburg.de/publications/papers/kuemmerle11icra.pdf) (Kümmerle et al., 2011), and GTSAM became widely used, while filter-based VIO continued to develop. Iterative optimization can relinearize retained states, but this alone does not guarantee consistency. Unobservable directions and the linearization used during marginalization must also be managed.

---

## 4.6 FastSLAM — divide and conquer

[FastSLAM](https://cdn.aaai.org/AAAI/2002/AAAI02-089.pdf) attacked EKF-SLAM's $O(N^2)$ wall from another direction. Michael Montemerlo, Sebastian Thrun (Stanford), Daphne Koller, and Ben Wegbreit presented it at AAAI 2002.

Rao-Blackwellization supplies the key observation. Given the robot path $x_{0:t}$, the position estimates of each landmark become *mutually independent*. The path can therefore be represented by a particle filter (each particle standing for one possible path), with a separate landmark EKF running independently for each particle.

With $K$ particles and $N$ landmarks the per-step complexity is $O(K \log N)$, logarithmic in $N$ for fixed $K$ rather than quadratic as in EKF-SLAM (when using KD-tree-based landmark search). As landmark count rises, per-particle EKFs stay mutually independent, so there is no need to keep the full $N \times N$ covariance. $K$ is fixed at tens to hundreds, and the practical gain was large.

FastSLAM maintained real-time operation with a few hundred landmarks in indoor environments and saw rapid adoption. Problems accumulated nonetheless. Particle depletion came first: as the map grows, most particles represent poor paths, and the effective sample count drops sharply. Reweighting paths during loop closure is difficult, and adding more particles did not solve drift accumulation in large-scale environments.

[FastSLAM 2.0](https://www.ijcai.org/Proceedings/03/Papers/165.pdf) (Montemerlo et al. 2003) improved the proposal distribution, but the filter paradigm still imposed a scalability ceiling. Graph optimization eventually bypassed it.

---

## 4.7 The EKF's exit

Graph-based approaches became practical from 2005 onward, and EKF-SLAM receded from the main line. [Feng Lu and Evangelos Milios's 1997 graph idea](https://doi.org/10.1023/A:1008854305733) combined with [Olson-Leonard-Teller's (2006)](https://april.eecs.umich.edu/pdfs/olson2006icra.pdf) efficient solver and then with the real-time factorization techniques of g2o, GTSAM, and iSAM2. The EKF's advantage of incremental updates was no longer distinctive.

The difference appeared at loop closure, when map error must be corrected as the robot returns to its starting point. The EKF has to update the entire covariance matrix at that moment, at a cost of $O(N^2)$. Graph optimization adds one edge to the pose graph and refactors a sparse matrix, at far lower cost.

Around 2010, choosing the EKF as the backend for a new SLAM system became uncommon. It survived chiefly under special constraints, such as very limited compute resources or a requirement for real-time filtering.

> 📜 **Prediction vs. outcome.** Durrant-Whyte and Bailey's [2006 IEEE Robotics & Automation Magazine tutorial](https://people.eecs.berkeley.edu/~pabbeel/cs287-fa09/readings/Durrant-Whyte_Bailey_SLAM-tutorial-I.pdf) discussed SLAM's scalability and projected submap decomposition and the information filter as solutions for large-scale environments. The information filter (the EKF's inverse-covariance form) was expected to use a sparse information matrix to keep computation from slowing as landmark count grew. Development took another route. The information-filter family (SEIF and related methods) accrued marginalization error while forcing sparsity. Submaps entered some systems but did not become the mainstream solution. Factor graphs with iterative optimization dominated the 2010s.

---

## 4.8 🧭 Still open

Filter vs. optimization coexistence. The EKF's retreat from backend primacy does not mean it disappeared. As of 2026, some autonomous-driving implementations still prefer filter-based backends. Optimization-based SLAM needs iterative convergence, which can make real-time guarantees difficult. Sparse EKFs and UKFs reappear in low-cost embedded systems. The mix depends on the use case and its constraints.

Non-Gaussian uncertainty. The EKF assumes that uncertainty follows a Gaussian distribution. Real-world sensor errors are often multimodal or heavy-tailed. A single Gaussian severely oversimplifies actual uncertainty, especially when perceptual aliasing creates multiple location hypotheses (different places looking the same). Particle filters can represent non-Gaussian distributions in theory but become impractical in high-dimensional states. Stein particles, normalizing flows, and learning-based uncertainty estimation are being tried, but few forms have been validated inside real-time SLAM as of 2026.

---

While EKF-SLAM reached its real-time ceiling at around 100 landmarks, Andrew Davison at Imperial College used that same limited landmark budget to prove that a single camera could track in real time without other sensors. The numerical limit remained; the design around it changed.


---

# Ch.5 — MonoSLAM → PTAM: The Real-Time Daydream and the Split Revolution

EKF-SLAM provided a way to estimate a map together with its uncertainty, but its covariance matrix hit a structural wall that grew as $O(N^2)$ in the number of landmarks $N$. The theory was not wrong; the limit followed from the design. Davison and Klein responded in different ways.

In 2003, Davison at Oxford estimated the pose of a hand-held camera and a map of its surroundings in real time on a desktop PC. He carried over the probabilistic spatial-relations mathematics that Smith and Cheeseman had laid down in 1988 and the EKF-SLAM structure that Leonard and Durrant-Whyte had built on it, but used a single camera as the sensor. With no IMU, stereo rig, or laser, he combined the 1994 Shi-Tomasi corner detector with a Kalman predict-update loop. By the standards of the day, it was an unusual combination.

Four years later, in 2007, Klein and Murray at Oxford offered a different answer. They split tracking and mapping into two threads, an architecture that became the backbone of Visual SLAM for the next ten years.

---

## 1. The 2003 demo

At ICCV 2003, Davison presented [Real-Time Simultaneous Localisation and Mapping with a Single Camera](https://doi.org/10.1109/ICCV.2003.1238654). It was an early demonstration of real-time SLAM using a monocular camera alone.

The mainstream of SLAM at the time used laser sensors. LiDAR delivered 2D ranges directly, and stereo cameras recovered depth at the pixel level. A monocular camera had no depth information to begin with. Estimating 3D structure from a single camera required at least two frames, and uncertainty in the initial depth estimate propagated through the entire EKF state vector. The theory existed; real-time implementation remained difficult.

MonoSLAM used a single camera without an IMU or stereo rig, avoiding the extra hardware and stereo calibration those configurations require. It demonstrated the feasibility of monocular real-time SLAM, while the EKF's growing covariance matrix limited map size.

---

## 2. The beauty and the wall of the EKF

[MonoSLAM](https://doi.org/10.1109/TPAMI.2007.1049), published in IEEE PAMI in 2007 with Davison, Ian Reid, Nicholas Molton, and Olivier Stasse as co-authors, was the full account of the ICCV 2003 demo.

MonoSLAM's state vector transplanted the formulation of [Smith-Self-Cheeseman (1988)](https://arxiv.org/abs/1304.3111) and [Leonard-Durrant-Whyte (1991)](https://ieeexplore.ieee.org/document/174711/) (Ch.4) directly onto a monocular camera. It packed a camera state $\mathbf{x}_v \in \mathbb{R}^{13}$ (position 3, quaternion orientation 4, velocity 3, angular velocity 3) and landmarks $\mathbf{y}_i \in \mathbb{R}^3$ into one vector $\mathbf{x} = (\mathbf{x}_v^\top, \mathbf{y}_1^\top, \ldots, \mathbf{y}_N^\top)^\top \in \mathbb{R}^{13+3N}$. The system maintained the full $(13+3N)\times(13+3N)$ covariance $\mathbf{P}$ frame by frame in a predict-update loop. The predict step propagated the covariance through the Jacobian $\mathbf{F}$ of the camera motion model $f$ ($\mathbf{P}^- = \mathbf{F}\mathbf{P}\mathbf{F}^\top + \mathbf{Q}$); the update step computed the Kalman gain from the Jacobian $\mathbf{H}_i$ of the projection function and refreshed the state and covariance. The EKF predict-update equations are identical to those in Ch.4 §4.3. The state vector now carried camera velocity and angular velocity along with pose because a moving camera needs a dynamics model.

The dominant cost in the covariance update $(\mathbf{I} - \mathbf{K}_i\mathbf{H}_i)\mathbf{P}^-$ came from a $(13+3N)^2$ matrix multiplication, or $O(N^2)$ in the number of landmarks $N$. §III of the paper states that "about 100" features could be sustained at 30 Hz in real time.

> 🔗 **Borrowed.** MonoSLAM's EKF state vector transplants the Smith-Cheeseman-Durrant-Whyte (1988-1991) probabilistic spatial-relations representation directly onto a monocular camera. The Kalman filter itself had existed since 1960, but Leonard and Durrant-Whyte established the practice of placing robot pose and landmarks in one "augmented state vector" in 1991.

That number exposed the system's ceiling, which the paper acknowledged by proposing a submapping strategy as future work. Building a hierarchy inside an EKF was difficult because the covariance matrix carried every correlation between every pair of landmarks, with none omitted.

MonoSLAM's choice of [Shi-Tomasi (1994)](https://doi.org/10.1109/CVPR.1994.323794) corners followed the same constraint. "Good Features to Track" selected points likely to remain trackable. Restricting the state vector to such corners made the EKF update more stable. The PAMI paper states that map management kept about 12 features stably visible per frame with a wide-angle lens. The EKF ran as long as that bounded set tracked well.

> 🔗 **Borrowed.** The Shi-Tomasi 1994 corner detector was already in use in MonoSLAM, not first in PTAM. The design philosophy of "select good features, then track them" is the direct Shi-Tomasi → MonoSLAM → PTAM lineage.

---

## 3. 2007, the same year

That bounded feature count exposed the EKF's ceiling. Klein confronted the same limit at Oxford.

In 2007, Klein and Murray presented [Parallel Tracking and Mapping for Small AR Workspaces](https://doi.org/10.1109/ISMAR.2007.4538852) at ISMAR. The same year, PAMI carried the finished version of Davison's MonoSLAM. Their appearance in the same year reflected a direct lineage.

Klein had completed his doctorate under Tom Drummond at Cambridge and was working with Murray as a postdoctoral researcher at Oxford when PTAM appeared. Murray had also supervised Davison. PTAM continued MonoSLAM's demonstration of monocular real-time operation within this research lineage, but replaced the EKF with separate tracking and mapping threads.

The next problem was scale, and Klein discarded the EKF.

---

## 4. The split

PTAM separated tracking (camera pose tracking) from mapping (3D map construction) and ran them in two parallel threads.

In the EKF, the two tasks were coupled inside one loop. Each frame ran a predict-update cycle: predict the state when the camera moves, then update it once landmarks are found in the image.

PTAM separated the tasks. The tracking thread estimates only the camera pose in each frame. It matches the 2D projections of 3D points visible from the current keyframe set to the actual observations and computes the pose in real time. The mapping thread runs bundle adjustment whenever a new keyframe is added. Because tracking runs independently, slow mapping does not block it.

The bundle adjustment on the mapping thread minimized the sum of reprojection errors over a keyframe set $\mathcal{K}$ and a 3D point set $\mathcal{P}$:
$$\min_{\{\mathbf{T}_k\}, \{\mathbf{p}_j\}} \sum_{k \in \mathcal{K}} \sum_{j \in \mathcal{P}_k} \rho\!\left(\left\|\mathbf{z}_{kj} - \pi(\mathbf{T}_k,\, \mathbf{p}_j)\right\|^2_{\mathbf{\Sigma}_{kj}}\right)$$
where $\mathbf{T}_k \in SE(3)$ is the pose of keyframe $k$, $\mathbf{p}_j \in \mathbb{R}^3$ is a 3D point, $\pi$ is the camera projection function, $\mathbf{z}_{kj}$ is the observed pixel coordinate of point $j$ in keyframe $k$, $\mathbf{\Sigma}_{kj}$ is the measurement covariance, and $\rho$ is a robust kernel such as the Huber function. The mapping thread solved this optimization iteratively with Levenberg–Marquardt. Running asynchronously, it did not affect the real-time behavior of the tracking thread.

> 🔗 **Borrowed.** The bundle adjustment on PTAM's mapping thread directly applies [Triggs et al. 1999 "Bundle Adjustment — A Modern Synthesis"](https://doi.org/10.1007/3-540-44480-7_21). The hundred-year photogrammetry tradition covered in Part I moved into the center of a real-time SLAM backend. Large joint updates were costly in EKF-SLAM because of covariance-matrix size; splitting the threads let keyframe BA run asynchronously from tracking.

The split had large consequences. Because the mapping thread ran bundle adjustment asynchronously, the number of landmarks in the map was no longer bound by the EKF's $O(N^2)$ constraint. PTAM used hundreds of keyframes, each holding hundreds of patch features, compared with MonoSLAM's tens of landmarks.

PTAM also changed initialization. As the user moved the camera slowly, the system estimated the essential matrix with a 5-point algorithm from the [Nistér 2004](https://doi.org/10.1109/TPAMI.2004.17) line (the PTAM paper cites the follow-up Stewénius·Engels·Nistér 2006) and recovered the initial 3D structure from the first keyframe pair. This too was borrowed.

The essential matrix $\mathbf{E}$ is a $3\times 3$ matrix capturing the pure geometric relation between two camera frames, satisfying ${\mathbf{p}'}^\top \mathbf{E}\, \mathbf{p} = 0$ for corresponding point pairs $(\mathbf{p}, \mathbf{p}')$. $\mathbf{E}$ decomposes internally as $\mathbf{E} = \mathbf{t}_\times \mathbf{R}$ ($\mathbf{t}_\times$ is the skew-symmetric matrix of the translation, $\mathbf{R}$ is the rotation), so it has 5 degrees of freedom. Five point correspondences make the problem minimal, but they do not give a unique solution: the polynomial system has up to ten candidate solutions over the complex numbers. Nistér's contribution was to solve this system efficiently enough for a real-time RANSAC loop. PTAM used the solver during initialization to estimate the relative pose between the first two keyframes and triangulate the initial 3D point cloud.

> 🔗 **Borrowed.** PTAM's 5-point essential-matrix initialization follows the minimal-solver lineage opened by David Nistér's 2004 "An Efficient Solution to the Five-Point Relative Pose Problem" (the PTAM paper directly cites the follow-up Stewénius·Engels·Nistér 2006 ISPRS). Nistér's solver used the minimum number of correspondences needed to build a monocular camera's initial map. PTAM placed it inside a RANSAC loop to estimate the relative pose of the first two keyframes at near-real-time speed.

> 🔀 **Structural parallel.** Leonard-Durrant-Whyte submaps and PTAM's keyframe map both manage computation through selected local units. The PTAM paper, however, does not cite that submap lineage as a direct design source. It explains keyframe selection through parallel tracking and mapping and the needs of local bundle adjustment. ORB-SLAM later added a covisibility graph.

---

## 5. The diffusion of the new architecture

PTAM was designed for AR (augmented reality) workspaces; the paper's title states "Small AR Workspaces" explicitly. Because the tracking thread ran reliably in real time, it could be integrated directly into AR applications.

Commercial adoption was fast. In the early 2010s, Metaio (a German AR startup, acquired by Apple in 2015) and Qualcomm's Vuforia SDK adopted tracking/mapping split structures similar to PTAM's. These commercial SDKs helped spread stable planar AR on consumer smartphones.

The academic effect was more direct. [ORB-SLAM](https://arxiv.org/abs/1502.00956), published in 2015 by Raul Mur-Artal, J.M.M. Montiel, and Juan D. Tardós, inherited PTAM's structure. It swapped patch features for ORB descriptors, refined keyframe management with a covisibility graph, and added loop closure on top. Without PTAM, ORB-SLAM's blueprint would have been different.

Qin, Li, and Shen's [VINS-Mono](https://arxiv.org/abs/1708.03852) (2018) also uses two threads for sliding-window optimization and loop closure, extending the tracking/mapping split into Visual-Inertial Odometry (VIO).

---

## 6. Davison vs Klein & Murray — a view comparison

Two papers came out in 2007. MonoSLAM PAMI was the finished version of the 2003 demo. PTAM came out the same year, with a new structure that broke through MonoSLAM's limits.

One reason MonoSLAM retained the EKF was its explicit joint representation of state and uncertainty. The covariance matrix represented state uncertainty explicitly, tracking both the uncertainty of each landmark and the covariance between landmarks. From this viewpoint, bundle adjustment traded explicit uncertainty representation for scalability.

Klein & Murray paid that price willingly. What mattered in AR applications was real-time tracking of the camera pose. There was no need to track map uncertainty at the centimeter level. Refining the map periodically through bundle adjustment was enough.

The field accepted this trade. From the 2010s onward, graph-based optimization and bundle adjustment became mainstream, while EKF-SLAM receded except in applications with severely limited compute resources. MonoSLAM's concern with probabilistic consistency did not disappear. Rather than join the PTAM lineage directly, Davison's lab moved in stages toward factor-graph-based estimation and then Gaussian Belief Propagation (GBP) and the Robot Web. Twenty-three years later, in Ch.18 of the *SLAM Handbook*, Davison describes this trajectory as EKF → BA → factor graph → GBP. He does not name and assess MonoSLAM directly, but recasts the history around a general principle: each change of representation prompts a redesign of the system.

---

## 📜 Prediction vs. outcome

> **Davison 2007 PAMI MonoSLAM**: In the Conclusion, Davison named larger indoor and outdoor environments, faster motion, and complex scenes with occlusion and lighting changes as the next tasks. He specifically proposed a submap strategy and CMOS cameras running above 100 Hz, and suggested extending the sparse map to a dense representation of "higher-order entities" (surfaces, etc.).
>
> These predictions met different fates. Submaps, PTAM's keyframe structure, and ORB-SLAM's covisibility graph share a concern with limiting computation, but this comparison alone does not establish direct inheritance. No system, however, achieved hierarchical scaling while retaining the EKF; that hierarchy arrived with the shift to BA-based architectures. High-frame-rate cameras took concrete form through 2010s event-camera research. Robustness to dynamic scenes remains open as of 2026. DynaSLAM and FlowSLAM are among the attempts, but no solution has yet entered the baseline pipeline. Davison did not flag IMU integration directly in Future Work (though the body cites related work), and the VIO boom of the 2010s pursued that direction. The concern with probabilistic consistency survived in factor graphs and GBP. Twenty-three years later, in Handbook Ch.18, Davison discusses system redesign through changes of representation. Placing MonoSLAM within that lineage is the interpretation of this history.

> **Klein & Murray 2007 PTAM**: In §8 (Failure modes / Mapping inadequacies), Klein and Murray listed the system's limitations: corner-based tracking's vulnerability to motion blur, the geometric poverty of a point-cloud-centric map, and "not designed to close large loops in the SLAM sense." They stated plainly that global consistency across large loops was outside PTAM's design scope.
>
> In 2015 ORB-SLAM directly addressed those limitations. It added [DBoW2](http://doriangalvez.com/papers/GalvezTRO12.pdf)-based appearance loop closure and covisibility-graph-based keyframe management, and replaced patch features with ORB descriptors. ORB-SLAM took on the map-scaling task that PTAM had excluded. Klein & Murray did not explicitly identify appearance-based loop closure as the answer, but the limits they marked became the starting point for the subsequent lineage.

---

## 🧭 Still open

**Monocular scale recovery.** From MonoSLAM to PTAM, every monocular system carries scale ambiguity. A single image cannot determine absolute distance; this is a geometric fact. Adding an IMU makes scale observable through gravity direction and accelerometer readings. In pure monocular systems without an IMU, however, scale recovery remains unsolved even in 2026. Learning-based monocular depth estimation ([MiDaS](https://arxiv.org/abs/1907.01341), [Depth Anything](https://arxiv.org/abs/2401.10891)) estimates relative depth from a single image, but converting it to metric scale still requires an external reference (a ground-plane assumption, a known object size, and so on).

**Environmental generality of a single VO system.** MonoSLAM handled only indoor desktop scenes. PTAM explicitly limited its scope to "Small AR Workspaces." ORB-SLAM2 later tried to span indoor, outdoor, and RGB-D settings, but tracking still fails under extreme lighting changes or in low-texture spaces. As of 2026, no single pipeline robustly handles indoor corridors, outdoor downtowns, nighttime environments, and textureless white walls at once. Multimodal fusion (camera + LiDAR + IMU) covers some of this range, but the generality of a camera-only system remains unsettled.

**Feature tracking in low light and dynamic scenes.** MonoSLAM assumed sufficient lighting and a static scene; PTAM did the same in 2007. As of 2026, most feature-based SLAM systems still carry these assumptions implicitly. ORB features can fail entirely in low light, while scenes crowded with moving people cause dynamic points to be misclassified as static. Learning-based optical flow and semantic segmentation attempt to address the problem, but no system has become a real-time, general-purpose solution.

---

PTAM's tracking/mapping split left loop closure unresolved. As keyframes accumulated, so did error, becoming visible when the camera completed a loop. The PTAM paper itself declared loop closure, correcting accumulated error when the camera returned to a known place, out of scope. Elsewhere, graph-SLAM researchers had spent a decade preparing an answer.


---

# Ch.6 — The Graph SLAM Revolution

In a basement corridor at Carnegie Mellon in 1997, Feng Lu and Evangelos Milios were trying to align multiple laser scans into a globally consistent map. The EKF was the default, but they modeled relative measurements between poses as a graph and ran least-squares optimization on it. This produced global consistency without a Kalman filter. Lu and Milios were not alone. More than a decade earlier, [Chatila and Laumond (1985)](https://www.semanticscholar.org/paper/Position-referencing-and-consistent-world-modeling-Chatila-Laumond/c34a678e40a7d80cb3683f07fc837179fd9bf3ee) at LAAS had discussed reference frames and consistent world models for mobile robots in the language of smoothing. In 1999, [Gutmann and Konolige](https://www.semanticscholar.org/paper/Incremental-mapping-of-large-cyclic-environments-Gutmann-Konolige/3c1bda51b8ca59f1836ed1b96c485d905804989a) applied pose graph matching to incremental mapping of large cyclic environments, and in the early 2000s Thrun's group formalized the approach as the *full SLAM* problem and put it on a commercial trajectory. [Folkesson and Christensen (2004)](http://www.hichristensen.net/hic-papers/folkesson-icra2004.pdf), Konolige, and Dellaert followed with formulations of their own. Lu-Milios 1997 remains the most cited because it presented a complete pipeline ("laser scan matching plus batch least-squares"), not because it opened the direction alone. If Smith and Cheeseman supplied the mathematical basis for probabilistic mapping and Davison demonstrated real-time monocular SLAM, these contributors made parallel moves that reframed SLAM as graph inference. EKF-SLAM in the 2000s met an $O(N^2)$ covariance-update bottleneck as landmark count grew, while Klein and Murray's PTAM (2007) separately demonstrated real-time optimization through a BA-based keyframe structure and split tracking and mapping. Laboratories at CMU, LAAS, Stanford, and KTH had already been developing graph-smoothing alternatives to filtering.

---

## 6.1 From Laser Scans to Pose Graphs: Lu-Milios 1997

Before [Lu & Milios 1997, "Globally Consistent Range Scan Alignment"](https://doi.org/10.1023/A:1008854305733) appeared, alignment of successive laser scans was often handled by stitching together local matches from the ICP (Iterative Closest Point) family. ICP aligned two scans well locally, but as drift accumulated the map twisted after tens of meters. When the robot came back to close a loop, the starting point and the map no longer matched.

Lu and Milios represented the robot's pose sequence $x_1, x_2, \ldots, x_n$ as nodes and each relative measurement between poses as an edge. Map building then becomes energy minimization on the graph. Each edge carries the relative transform $\hat{z}_{ij}$ between two poses and its uncertainty $\Omega_{ij}$. The full cost function is

$$F = \sum_{(i,j) \in \mathcal{E}} e_{ij}^T \Omega_{ij} e_{ij}, \quad e_{ij} = z_{ij} - h(x_i, x_j)$$

where $h(x_i, x_j)$ computes the expected relative transform from the two poses, $z_{ij}$ is the actual measured relative transform, and $\Omega_{ij} = \Sigma_{ij}^{-1}$ is the information matrix, the inverse of the measurement uncertainty.

Loop closures fit this formulation naturally. When the robot revisits a place and obtains a new relative measurement, one edge adds the constraint to the graph, and full optimization adjusts every pose accordingly. An EKF updated the covariance at $O(N^2)$ cost to close a loop; a pose graph expresses the constraint with an additional edge, but still requires reoptimization to update its estimates.

> 🔗 **Borrowed.** The Lu-Milios formulation of pose graph optimization rests on the nonlinear least-squares algorithms of [Levenberg (1944)](https://www.ams.org/qam/1944-02-02/S0033-569X-1944-10666-0/) and [Marquardt (1963)](https://www.stat.cmu.edu/technometrics/70-79/VOL-14-03/v1403757.pdf). A numerical optimization technique developed decades earlier for nonlinear parameter estimation arrived at the backend of indoor laser mapping.

The Lu-Milios solution was a batch linear system that solved for all poses at once, growing with the number of scans. It was closer to a proof of concept than a field-ready system, but it showed that optimization rather than filtering could provide global consistency. During the same period, Gutmann-Konolige emphasized incrementality, Folkesson-Christensen the robustness of data association, and Thrun's group application at real-world scale. Each developed a different part of the same conclusion.

---

## 6.2 Discovering Sparsity: The Information Matrix and the Pose-Graph Extension

In the five years after the Lu-Milios idea was published, several groups pushed extensions in the same direction. The common discovery was the **sparsity** of the information matrix ($\Omega = \Sigma^{-1}$).

The covariance matrix $\Sigma$ of EKF-SLAM is dense. Every time the robot observes a new landmark, its correlation with every existing landmark is updated. With the robot pose marginalized and $n$ 2D landmarks, $\Sigma$ is a $2n \times 2n$ matrix and the update cost is $O(n^2)$. That is why real-time performance collapsed around 100 landmarks.

The information matrix of a pose graph is different. A nonzero term appears in the $(i,j)$ block of $\Omega$ only when poses $x_i$ and $x_j$ are directly connected by a measurement. Under continuous motion, edges connect only nearby poses; distant poses have no direct connection. $\Omega$ therefore has a banded sparse structure that reflects the graph topology. For a trajectory without loop closures, the structure is nearly tridiagonal.

Sebastian Thrun's group, through the [Sparse Extended Information Filter (SEIF)](http://www.cs.cmu.edu/~thrun/papers/thrun.tr-seif02.pdf), and Edwin Olson began exploiting this sparsity explicitly. A sparse linear solver could reduce computation far below $O(n^2)$. Actual complexity depended on graph structure, but $O(n \log n)$ became possible in realistic scenarios where a robot moves within a bounded region.

> 🔗 **Borrowed.** Thrun's sparse information filter (SEIF) and [Eustice's exactly sparse delayed-state filter](https://web.mit.edu/2.166/www/handouts/eustice_et_al_ieeetro_2006.pdf) showed that information-matrix sparsity was usable even in filter form. This insight set the stage for Dellaert's factor graph formulation and the Bayes tree data structure.

At ICRA 2006, [Olson, Leonard, and Teller](https://april.eecs.umich.edu/pdfs/olson2006icra.pdf) presented a stochastic-gradient method for optimizing pose graphs. It offered no convergence guarantee but ran fast enough on graphs of hundreds of nodes, and Olson's implementation spread through the community.

---

## 6.3 Factor Graphs and Square Root SAM

In 2006, Dellaert and his doctoral student Kaess published [Square Root SAM](https://doi.org/10.1177/0278364906072768), giving SLAM backends a new representation. Dellaert had worked on probabilistic graphical models at Georgia Tech. He treated SLAM as Bayesian inference and represented that inference on a factor graph.

In a **factor graph**, a bipartite graph with variable and factor nodes, the variable nodes are robot poses and landmark positions, while factor nodes represent observations or priors. A factor $f_k(x_{i_1}, x_{i_2}, \ldots)$ expresses a probabilistic constraint among the variables it connects. The full joint probability is

$$p(X) \propto \prod_k f_k(X_k)$$

and MAP estimation finds the $X^*$ that maximizes this probability. Under Gaussian factors, this becomes a nonlinear least-squares problem.

The least-squares structure supplied Dellaert's key observation. Applying QR decomposition to the Jacobian matrix $J$ leaves an upper-triangular matrix $R$. Because $R^T R = J^T J = \Omega$, $R$ is the "square root information matrix." Its sparsity depends not only on the Jacobian but also on variable-elimination order and factor-graph topology. A good ordering (e.g., AMD, COLAMD) minimizes fill-in and yields a sparse $R$.

This formulation is numerically more stable than the EKF covariance update. The full map of landmarks and poses can be optimized together in a consistent way, and a loop closure is expressed as the addition of a new factor.

## 6.4 iSAM and iSAM2: Online Incremental Inference

Square Root SAM was a batch method. Recomputing the full decomposition of $J^T J$ whenever a new observation arrived added substantial work. Dense factorization costs $O(n^3)$; sparse costs depend on connectivity and elimination order.

In 2008, [Kaess, Ranganathan, and Dellaert published **iSAM** (incremental Smoothing and Mapping)](https://www.cs.cmu.edu/~kaess/pub/Kaess08tro.pdf), which updated the factorization with Givens rotations. When a new variable and factor were added, iSAM appended only the new rows and updated $R$ rather than recomputing the QR decomposition.

iSAM1's intrinsic limit was its relinearization schedule. The $R$ obtained by linearizing nonlinear factors is only a first-order approximation near the current estimate. As the robot moved away from the linearization point, approximation error accumulated. iSAM1 responded with **periodic full relinearization**: every few dozen steps, it relinearized the entire factor graph and recomputed the QR decomposition. Fill-in within $R$ after loop closures signaled when to run this batch step. An apparently incremental algorithm therefore reverted to batch processing every cycle.

In 2012 [iSAM2](https://doi.org/10.1177/0278364911430419) solved this problem with a data structure called the Bayes tree. The Bayes tree is a tree built from the chordal Bayes net obtained by applying variable elimination to the factor graph. Its nodes are the cliques of the Bayes net, and its edges are the separators (shared variables between cliques). When a new factor is added, the cliques affected in the Bayes tree are identified, and only that subtree is turned back into a factor graph, relinearized, and reoptimized. The core is **fluid relinearization**. Only factors whose linearization error exceeds a threshold are selectively relinearized, and the effect propagates through Bayes tree separators only as far as needed. iSAM1's "everything, every cycle" schedule was replaced by "only the necessary factors, only the affected cliques". Even when a loop closure occurred, the set of connected cliques was often locally bounded, and full recomputation could be avoided.

> 🔗 **Borrowed.** The Bayes tree extends the junction tree (join tree) lineage in probabilistic graphical models, represented by the elimination-order and chordal-graph inference techniques in textbooks such as Koller-Friedman's [*Probabilistic Graphical Models*](https://mitpress.mit.edu/9780262013192/probabilistic-graphical-models/). It brought a technique from AI inference into real-time robot SLAM.

iSAM2 was packaged as the [GTSAM (Georgia Tech Smoothing and Mapping)](https://gtsam.org) library, with a C++ core and Python bindings. GTSAM development continued while Dellaert held his Georgia Tech position and also worked with Google. Its public documentation and examples cover applications including autonomous driving, drones, and robot-arm calibration.

---

## 6.5 g2o: A General Graph Optimizer in the ROS Ecosystem

While the Georgia Tech group refined the theory, Rainer Kümmerle, Giorgio Grisetti, Hauke Strasdat, Kurt Konolige, and Wolfram Burgard at TUM (Munich) and Freiburg built a practical open-source implementation. At ICRA 2011, they presented [g2o](https://doi.org/10.1109/ICRA.2011.5979949) (general graph optimization), designed to "handle any kind of graph optimization in a plug-in manner." The author list bridged Burgard and Grisetti's Freiburg robotics tradition, Strasdat's monocular SLAM experience, and Konolige's industrial engineering perspective.

The g2o design separates three concepts. Vertices (variable nodes) and edges (factors or constraints) form the graph, and a solver handles the sparse linear system. The user defines vertex types and the error function and Jacobian of edges, and g2o then runs the full optimization with Gauss-Newton or Levenberg-Marquardt. The sparse solver can be chosen among Cholmod, CSparse, and Eigen, or swapped out for an external library.

As ROS (Robot Operating System) spread through mobile-robot research in the early 2010s, g2o became one of the leading implementations for graph-based SLAM. ORB-SLAM and LSD-SLAM adopted it, but ROS SLAM did not converge on one backend: gmapping belongs to the particle-filter line, and Cartographer uses Ceres. g2o was influential without being universal.

---

## 6.6 Why the Field Converged Here

Chatila-Laumond (1985), Lu-Milios (1997), Gutmann-Konolige (1999), Folkesson-Christensen (2004), Thrun's group, Dellaert (2006), and Kaess (2012) started from different problems and developed tools for maintaining and solving graph constraints.

The shift changed the model of the problem, not only the algorithm. EKF-SLAM maintains the best estimate of the current state and its uncertainty while marginalizing away the past. Past poses disappear, and accumulated error remains inside the current estimate. Closing a loop then requires a costly update to the current covariance.

Graph SLAM retains the past. Poses, landmarks, and observations remain in the graph, and a loop closure becomes a new edge. Reoptimization adjusts the full trajectory consistently (for methods that use a time-continuous trajectory rather than discrete keyframes, see Ch.7c Continuous-Time SLAM). Keeping past poses revisable is the essential difference from filters.

Costs differ as well. EKF's update cost is $O(N^2)$ (in the number of landmarks $N$), and information storage is $O(N^2)$. Graph methods can reduce that complexity substantially with sparse Cholesky (or QR) decomposition. Update cost depends on graph connectivity, fill-in during factorization, elimination order, and the region that must be recomputed. Motion within a bounded physical region alone does not guarantee $O(N \log N)$ updates.

> 📜 **Prediction vs. outcome.** The limits of Dellaert's batch Square Root SAM (2006) led the same group toward incremental methods. iSAM handled the problem in 2008 with Givens-rotation updates, and iSAM2 improved loop-closure efficiency in 2012 with the Bayes tree. GTSAM, Ceres, and g2o all handle nonlinear least squares, but differ in their solvers and incremental data structures. The three papers resolved one problem in stages, largely along the predicted path.

The flexibility of marginalization played a part as well. When an old pose in the graph is marginalized, its information is preserved as a linking factor among the remaining variables. Filters also remove past states while transferring their information to the current estimate. Both approaches must account for approximation and relinearization constraints introduced by this compression. Engineering trade-offs like sliding-window optimization and keyframe selection come in here.

---

## 6.7 Nonlinearity and Robustness: The Layer of Practical Engineering

Implementation is less tidy than the theory. Much of 2010s SLAM engineering went into closing that gap.

The first problem is dependence on the initial value. Gauss-Newton or LM optimization converges to a local minimum when the initial pose estimate is far from the truth. A wrong loop-closure correspondence corrupts that initialization, making verification and outlier rejection central pre-backend tasks. Ch.6b (Certifiable SLAM) treats convex-relaxation methods (SDP) that avoid this local-minimum problem and certify global optimality.

Standard least squares is fragile to outliers, as practice quickly revealed. Robust Huber or Cauchy losses reduce the influence of wrong matches, and both g2o and GTSAM make them selectable. The choice depends on the environment and sensor, and as of 2026 still rests on the engineer's experience.

The third problem is marginalization approximation. iSAM2's Bayes tree provides exact incremental inference, but the tree grows with the variable count. Real systems marginalize old poses to keep it manageable, and the resulting fill-in can make the information matrix dense. Implementation quality depends on how this fill-in is truncated and approximated with a prior factor.

> 📜 **Prediction vs. outcome.** g2o's generality lies in allowing users to define states as vertices and observation constraints as edges. New line, plane, inertial, or object constraints can be implemented through that interface; examples must be checked against the estimator and edge implementation actually used by each system. Ch.7b describes preintegration, the standard way to place IMU factors in the graph. As of 2026, however, g2o itself prioritizes interface stability and compatibility with existing users over broad expansion of its built-in factors. Users commonly add new factor types through inheritance, forks, or wrappers.

---

## 🧭 Still open

Which robust kernel to choose. Huber, Cauchy, Geman-McClure, DCS, and others are available, but no principled method decides in advance which kernel is optimal for a given environment and sensor. The choice still rests on engineering judgment. Researchers are learning cost functions themselves, but integration into an online incremental system remains unresolved.

Representing non-Gaussian uncertainty inside a factor graph remains open. The basic continuous optimization in GTSAM and g2o starts from Gaussian residual models, although robust kernels, max mixtures, and hybrid factors provide extensions. Accurately representing loop-closure mismatch probabilities and multi-hypothesis poses in real time still lacks a general solution.

The Bayes tree is most efficient when a new factor affects only local cliques. As loop-closure constraints become dense in a large map, the affected subtree and fill-in can grow, increasing computation and memory. Hierarchical management and submap partitioning are ways to control that growth.

---

By the early 2010s, the backend debate had quieted. As tools such as g2o and GTSAM became widely used, attention moved to the layers above them. The question changed from "how to close a loop" to "which features can recognize one, and from how far away?" The front end became the new focus of competition.

One question remained unresolved: do g2o and GTSAM actually return the global minimum? Ch.6b treats that question of certifiability before the front-end lineage resumes in Ch.7.

# Ch.6b — Certifiable SLAM: Past the Local Minimum

The lineage from Lu-Milios to g2o and GTSAM left one issue unresolved: pose graph optimization is non-convex, so Gauss-Newton and LM may return local minima. Practitioners relied on a rule of thumb, "with an odometry initial guess, it usually solves fine," yet some deployed backends converged to the wrong solution without raising an alarm. In 2015 Luca Carlone at MIT began replacing that rule of thumb with mathematics. Carlone's work on Lagrangian duality led to Rosen's SE-Sync in 2019, Briales-Gonzalez-Jimenez's Cartan-Sync, Yang-Carlone's TEASER, and Papalia's CORA. Together, this lineage moved the backend from non-convex optimization that usually worked to convex surrogates with certificates of global optimality. The tools came from outside SLAM: Shor relaxation from operations research, Burer-Monteiro factorization from mathematical optimization, Riemannian optimization from differential geometry, and Kirchhoff's Matrix-Tree Theorem from graph theory.

---

## 6b.1 The Old Anxiety of Local Minima

Ch.6 §6.7 identified dependence on initial values as the first problem of a graph SLAM backend. The cost function is non-convex in rotation variables $\boldsymbol{R}_i \in \mathrm{SO}(3)$, so Gauss-Newton can enter the wrong basin when the initial estimate is far from the truth. The parking-garage example in Handbook §6.1 shows the symptom clearly: of four random initializations, one converges to the same global minimum as SE-Sync, while the other three settle at twisted local minima with the garage floor visibly folded.

Through the late 2000s, the community followed two responses: trust odometry to provide a good initial value, or enforce loop-closure verification and outlier removal at the front end. Both worked, but neither determined whether the converged value was the true minimum. Huang and Dissanayake pointed to a simple issue around 2010: even with a good initial guess, ambiguous data can stop the optimizer at the wrong answer. PGO was also formalized as NP-hard around the same time, although g2o usually worked in the field. Backend theorists of the mid-2010s focused on this gap between worst-case theory and average practice. Convergence of Gauss-Newton does not imply global optimality. Under ideal second-order conditions a local minimum has zero gradient and a positive-semidefinite Hessian, but a numerical solver may also stop earlier because of tolerances or conditioning. Failure is least visible when the backend reports convergence.

> 🔗 **Borrowed.** Ch.6's robust kernels (Huber, Cauchy) and this chapter's GNC share a root in the robust statistics and duality theorem of [Black & Rangarajan (1996)](https://cs.brown.edu/people/mjblack/Papers/ijcv1996.pdf). One branch changed cost weights to reduce outlier influence; the other used the same principle to navigate non-convexity.

---

## 6b.2 Shor Relaxation — A Tool From Operations Research

PGO's non-convexity comes from the rotation constraint $\boldsymbol{R}_i \in \mathrm{SO}(d)$. Orthogonality, $\boldsymbol{R}^\top \boldsymbol{R} = \boldsymbol{I}$, is quadratic. In three dimensions, $\det(\boldsymbol{R})=+1$ is cubic as written, but right-handedness can instead be expressed with quadratic cross-product relations among the columns. Together with the quadratic objective, these constraints give a **QCQP** (Quadratically Constrained Quadratic Program). Operations research had used a convex relaxation for QCQP since 1987: [Naum Shor's relaxation](https://link.springer.com/article/10.1007/BF01582220).

Using the identity $\boldsymbol{x}^\top \boldsymbol{M}\boldsymbol{x} = \mathrm{tr}(\boldsymbol{M}\boldsymbol{x}\boldsymbol{x}^\top)$, Shor introduces the lifted variable $\boldsymbol{X} \triangleq \boldsymbol{x}\boldsymbol{x}^\top$. The original QCQP then has a linear objective subject to $\boldsymbol{X} \succeq 0$ and rank 1. Dropping the rank-1 constraint leaves a convex **semidefinite program (SDP)**. The search space grows from $n$ to $n(n+1)/2$ in exchange for convexity.

$$d^* = \min_{\boldsymbol{X}\in\mathbb{S}^n} \mathrm{tr}(\boldsymbol{C}\boldsymbol{X}) \;\; \text{s.t.} \;\; \mathrm{tr}(\boldsymbol{A}_i\boldsymbol{X})=b_i,\; \boldsymbol{X}\succeq 0.$$

The duality inequality $d^* \le p^*$ makes the relaxation useful. The SDP minimum is a lower bound on the original QCQP minimum. For any candidate $\hat{\boldsymbol{x}}$, the quantity $f(\hat{\boldsymbol{x}}) - d^*$ upper-bounds its suboptimality. This is the source of the term "certifiable": even without solving the original problem globally, one can bound the solution's error from optimality. If the SDP solution $\boldsymbol{X}^*$ has rank 1, then $\boldsymbol{X}^* = \boldsymbol{x}^*\boldsymbol{x}^{*\top}$ and $\boldsymbol{x}^*$ is a global minimizer of the original QCQP. The papers that follow ask how often this occurs in SLAM.

Carlone's two papers at IROS and ICRA in 2015 ([Carlone et al. 2015 "Lagrangian duality in 3D SLAM"](https://arxiv.org/abs/1506.00746) and [Carlone & Dellaert 2015 "Planar pose graph optimization"](https://doi.org/10.1109/ICRA.2015.7139264)) are the starting point. They showed empirically that the duality gap is mostly zero in 2D PGO and suggested extension to 3D. Carlone had just finished his 2014 TRO survey of g2o/GTSAM initialization techniques and had seen how often, when odometry conflicted with loop closures, the optimizer halted at the wrong point. The 2015 paper reported "the empirical fact that the duality gap is typically zero" without giving a closed condition for when it holds.

In the same period, [Briales & Gonzalez-Jimenez (2017)](https://arxiv.org/abs/1702.03235)'s Cartan-Sync extended the program to SO(3) synchronization. On the mathematical side, Boumal-Absil-Sepulchre were refining Riemannian optimization, and Burer-Monteiro's low-rank SDP factorization had existed since 2003. Rosen and colleagues assembled these materials in one paper in 2019.

---

## 6b.3 SE-Sync — What Rosen 2019 Assembled

[Rosen, Carlone, Bandeira, Leonard's SE-Sync (IJRR 2019)](https://arxiv.org/abs/1612.07386) became the standard reference for certifiable SLAM. Rosen completed his doctorate with John Leonard at MIT; Leonard, together with Ch.4's Durrant-Whyte, had helped settle the name "SLAM" in the early 1990s. Afonso Bandeira, an expert in SDP and synchronization, contributed the theoretical proof for the globality of rank-deficient second-order critical points. The paper combined backgrounds in robotics, SLAM, mathematical optimization, and applied mathematics. It assembled Shor relaxation, translation elimination, Burer-Monteiro low-rank parameterization, and Boumal's Riemannian staircase around the single problem of PGO.

The method proceeds in three steps. First, because translation becomes linear least squares once rotation is fixed, $\boldsymbol{t}$ is eliminated in closed form (Problem 6.2). Carlone had noted this in his 2014 TRO survey, and Rosen made it the first step of the convex relaxation. Second, Shor relaxation lifts the remaining rotation-only problem $\min_{\boldsymbol{R}\in\mathrm{SO}(d)^n} \mathrm{tr}(\tilde{\boldsymbol{Q}}\boldsymbol{R}^\top\boldsymbol{R})$ to an SDP (Problem 6.3). Third, because the $dn \times dn$-dimensional SDP would overwhelm interior-point methods at a few thousand poses, Burer-Monteiro reparameterization $\boldsymbol{Z} = \boldsymbol{Y}^\top \boldsymbol{Y}$ turns it into a low-dimensional unconstrained problem on the Stiefel manifold (Problem 6.4).

Two theorems justify the method. Theorem 6.1 gives **exact recovery**: if measurement noise is below a constant $\beta$, the SDP relaxation has a unique solution $\boldsymbol{Z}^*$ of rank $d$ that recovers the global minimum of the original MLE. Unlike the rank-1 condition for a generic vector QCQP, SE-Sync uses $\boldsymbol{Z}=\boldsymbol{R}^\top\boldsymbol{R}$ with $\boldsymbol{R}\in\mathbb{R}^{d\times dn}$, so an exact solution has rank $d$. The caveat is that $\beta$ depends on the ground-truth matrix and is therefore unknown before the instance is solved. Theorem 6.2 applies a result of Boumal et al.: a rank-deficient second-order critical point on the Stiefel manifold is the global minimum. Together, the theorems enable the Riemannian Staircase. It starts at low rank, finds a second-order critical point, checks for rank deficiency, and increases the rank by one if the check fails. Once the rank reaches $dn + 1$, every $\boldsymbol{Y}$ is row-rank-deficient, so the process halts in finite steps. On practical datasets, one step usually suffices.

On standard benchmarks such as sphere, torus, and garage, SE-Sync converged at g2o/GTSAM speed while returning an a posteriori certificate. g2o and GTSAM were fast but silent on when to trust the answer; Rosen's algorithm returns one additional number, a suboptimality bound. When that bound is zero, the solution is provably globally optimal. Twenty years after Lu-Milios, a backend could certify global optimality. A remaining gap alone, however, does not prove that the candidate is suboptimal.

> 📜 **Prediction vs. outcome.** In §8.2 of the IJRR 2019 paper, Rosen wrote that "the algebraic simplification we have shown could be extended to anisotropic noise, outliers, and a variety of sensor modalities." The prediction partially held. Holmes-Barfoot's 2023 landmark-SLAM extension, Papalia's 2024 CORA range-measurement extension, and Yang-Carlone's TEASER line followed. The most ambitious extension, applying SE-Sync to the perspective projection of visual SLAM, had not arrived by 2026. Projection is a rational function and does not fold easily into polynomial optimization.

> 🔗 **Borrowed.** The Burer-Monteiro factorization at the heart of SE-Sync is the low-rank SDP method of [Burer & Monteiro (2003)](https://link.springer.com/article/10.1007/s10107-002-0352-8), later sharpened by [Boumal-Voroninski-Bandeira (2016)](https://arxiv.org/abs/1605.08101)'s Riemannian proof of the globality of second-order critical points, which Rosen brought into SLAM. From pure math to the robot backend, sixteen years.

---

## 6b.4 The Unexpected Equivalence of Graph Laplacian and Fisher Information

A different question remains after finding a global minimizer: how close is the estimate to the truth? The Cramér-Rao Lower Bound and Fisher Information Matrix provide the answer. In a simplified PGO model with fixed rotations, Rosen-Khosoussi-Barfoot showed that FIM is exactly a Kronecker product of the graph's weighted reduced Laplacian.

$$\mathcal{I} = \boldsymbol{J}^\top \boldsymbol{\Sigma}^{-1} \boldsymbol{J} = \boldsymbol{L}_w \otimes \boldsymbol{I}_3.$$

The graph structure alone yields an approximation of estimation accuracy without actual measurements. By Kirchhoff's Matrix-Tree Theorem, the determinant of the reduced Laplacian equals the number of weighted spanning trees, which corresponds to D-optimality (determinant of the information matrix). Algebraic connectivity (Fiedler value) corresponds to E-optimality (worst-case variance). By the 2020s, Kirchhoff's 1847 theorem for electrical circuits had become a theoretical basis for measurement selection and active SLAM. In active SLAM, "maximize FIM" translates into spectral manipulation of the Laplacian.

[The post-2014 work of Kasra Khosoussi and Timothy Barfoot](https://arxiv.org/abs/1709.08601) established this connection. Khosoussi did his doctorate in Sydney under Dissanayake and Huang, then went through MIT and Toronto. In the form generalized to 3D PGO, the Kronecker combination of the Laplacian and SE(3) adjoint representation appears, letting topological and geometric information be handled separately. That the "measurement selection criterion" can be approximated by a Laplacian six times smaller than the full FIM provides the mathematical basis for "loop closure selection," which Ch.6 left in place without developing.

The EKF-SLAM consistency problem in Ch.4 §4.8 also connects to this result. Read through the CRLB, the overconfidence Julier-Uhlmann identified in 2001 means that linearization overestimates Fisher information. Handbook §6.2 therefore places the FIM chapter next to convex relaxation. Finding the global minimum and estimating its accuracy form a pair.

> 🔗 **Borrowed.** [Kirchhoff's Matrix-Tree Theorem (1847)](https://en.wikipedia.org/wiki/Kirchhoff%27s_theorem), born as an analysis tool for electrical circuits, was transplanted through combinatorics into measurement-design literature and, in the 2010s through Khosoussi, became the language of SLAM active perception. A 180-year migration path.

---

## 6b.5 Extensions and Limits — TEASER, CORA, and Lasserre's Wall

After SE-Sync, work expanded in two directions: certifiable estimators robust to outliers, and extended measurement models for range, landmarks, and anisotropic noise.

Outliers came first. As Ch.6 §6.7 noted, imperfect loop-closure verification introduces mismatches into real-world pose graphs, and optimization collapses above a certain outlier ratio even with Huber or Cauchy kernels. By around 2017, certifiable methods needed to address them.

[Yang, Shi, Carlone's TEASER (TRO 2020)](https://arxiv.org/abs/2001.07715) is representative, finding the global optimum in 3D point-cloud registration with up to 99% outliers. It solves truncated least squares inside a GNC wrapper, with SDP relaxation on the rotation subproblem, and returns a certificate. The method splits scale, translation, and rotation into separate certifiable subproblems while preserving a global-optimality guarantee for each. The follow-up [Yang & Carlone (2022)](https://arxiv.org/abs/2109.03349) generalized this through Lasserre moment relaxation as "certifiably robust estimation."

[Papalia et al.'s CORA (2024)](https://arxiv.org/abs/2302.11614) extended the line to range-aided SLAM. Used directly, the range measurement $(\|\boldsymbol{t}_j - \boldsymbol{t}_i\| - \tilde r_{ij})^2$ contains the square root implicit in the norm and is not directly quadratic. Papalia introduced an auxiliary unit vector $\boldsymbol{b}_{ij} \in S^{d-1}$ and used bearing lifting to recast it as one. CORA showed that the relaxation is tight in the single-robot case but generally not exact in multi-robot settings, narrowing the conditions under which Shor relaxation works.

On the landmark side, [Holmes & Barfoot (2023)](https://arxiv.org/abs/2308.05631) used the Schur complement to eliminate landmarks in advance, leaving a PGO that SE-Sync can solve directly. Holmes, Khosoussi, and Rosen later co-authored Ch.6 of the Handbook in 2025.

Limits also appeared. Generalizing anisotropic noise and truncated-quadratic outliers to a POP (Polynomial Optimization Problem) calls for Lasserre's moment relaxation, but the derived SDP can be **degenerate**: constraint qualification conditions required by the Riemannian Staircase convergence guarantee can fail. This removes the guarantee; it does not establish that every run diverges. Yang's 2022 sparse monomial basis offers a workaround, but its specialized solver remains slower than a general local solver. Visual SLAM and VIO face further obstacles in incorporating perspective projection and IMU preintegration, treated in the 🧭 section.

> 📜 **Prediction vs. outcome.** At ICRA 2015 Carlone wrote that "theoretical explanation for why most instances have a tight Lagrangian dual is needed." Ten years later, only part of the answer had arrived. The exact-recovery theorem of Rosen-Carlone-Bandeira-Leonard gave a sufficient condition, "noise below $\beta$," but no way to compute $\beta$ in advance for an actual SLAM instance. As of 2026, no **a priori** condition predicts when tightness breaks; per-instance certificates serve in its place.

---

## 🧭 Still open

**The boundary where tightness breaks.** SE-Sync's exact-recovery theorem offered the sufficient condition "noise below $\beta$," but there is no way to compute $\beta$ on an actual instance. An a priori test for tightness would guide algorithm design. Systematic study of how relaxation fails under heavy outliers or extremely sparse graphs remains limited.

**Integration with visual SLAM and VIO.** Perspective projection $\pi(\boldsymbol{X}) = [X/Z, Y/Z]$ is rational, not polynomial. Multiplying through the denominator adds a new variable and auxiliary constraint per feature, and ORB-SLAM3's thousands of map points push the SDP beyond real-time scale. Forster's 2015 IMU preintegration tangles the exponential map with bias drift, resisting incorporation into POP. As of 2026, the visual/VIO mainstream of Ch.7, Ch.8, and Ch.13 sits outside certifiable guarantees. This is the lineage's largest unresolved gap.

**Online certification and scale.** SE-Sync is batch. Incremental certifiable SLAM, which resolves the SDP at each new measurement, is not mature. As iSAM2 did for conventional SAM, certifiable SLAM needs an incremental formulation. Warm starts, incremental rank increases, and composition of partial certificates remain open, while moment-relaxation solvers are still too slow at city scale.

**Outlier-majority.** Estimators such as TEASER have shown strong registration results with majority outliers. Those results do not guarantee identifiability or certification for arbitrary SLAM problems and contamination patterns. When several solutions remain plausible, multiple-hypothesis approaches such as list-decodable regression are also relevant. Cheng-Shi-Carlone pursued this direction around 2024, but no tool has become a standard comparable to TEASER.

---

The brief discussion of local-minimum convergence in Ch.6 §6.7 developed into a ten-year theoretical program. Ch.6 of *The SLAM Handbook*, co-authored by Carlone-Khosoussi-Rosen-Holmes-Barfoot-Dissanayake, devotes 34 pages to the subject, evidence of the lineage's current weight. During the same decade, the learning-based SLAM of Ch.12, Ch.13, and Ch.16 followed another path: one lineage tried to prove that a solution was global, while the other asked a neural network to predict it. Whether they will meet remains unanswered in 2026. Ch.19 groups this chapter's 🧭 items under "gaps in backend theory."
