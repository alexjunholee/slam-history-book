# Chapter 3. SfM: From Longuet-Higgins to COLMAP

While Harris and Lowe were figuring out how to pick reliable points out of a single image, a parallel community was asking what geometry can recover once those points appear across two or more images. Feature *detection* and spatial *reconstruction* advanced along separate tracks for more than two decades before converging into a single pipeline in the mid-2000s.

In 1981, H.C. Longuet-Higgins—working not in a robotics department, but in the Laboratory of Experimental Psychology at the University of Sussex—published a three-page paper in *Nature* titled "[A Computer Algorithm for Reconstructing a Scene from Two Projections](https://cseweb.ucsd.edu/classes/fa01/cse291/hclh/SceneReconstruction.pdf)." In it, he showed that given just eight corresponding point pairs across two photographs, a simple linear algorithm could recover both camera motion and 3D scene structure. Photogrammetrists and vision scientists had studied motion perception long before 1981, so his paper did not invent Structure from Motion (SfM) out of thin air; nonetheless, it became the modern catalyst for two-view geometry. Over the next thirty-five years, that spark led through self-calibration, incremental SfM, Bundler, and large-scale reconstruction from internet photographs, culminating in 2016 when Johannes Schönberger assembled the accumulated craft into COLMAP, a robust general-purpose open-source pipeline.

---

## 3.1 Essential Matrix and the 8-point Algorithm

Longuet-Higgins started from a crisp geometric observation: whenever two calibrated cameras observe the same 3D point, their normalized image coordinates obey a single bilinear constraint. That constraint collapses into a single $3\times 3$ matrix, which he defined as the **essential matrix** $\mathbf{E}$.

If the two camera centers sit at $\mathbf{O}_1$ and $\mathbf{O}_2$ and the corresponding normalized image points are $\mathbf{x}_1$ and $\mathbf{x}_2$, they satisfy:

$$\mathbf{x}_2^\top \mathbf{E} \mathbf{x}_1 = 0$$

Inside this matrix, the relative rotation $\mathbf{R}$ and translation $\mathbf{t}$ between the two views factor cleanly as $\mathbf{E} = [\mathbf{t}]_\times \mathbf{R}$, where $[\mathbf{t}]_\times$ is the skew-symmetric matrix of $\mathbf{t}$.

Once global scale is set aside, the essential matrix carries only five degrees of freedom. Yet solving directly from five correspondences requires handling nonlinear polynomial equations—a capability that had to wait for [Nistér's 2004](http://www.cad.zju.edu.cn/home/gfzhang/training/SFM/2004-PAMI-David%20Nister-An%20Efficient%20Solution%20to%20the%20Five-Point%20Relative%20Pose%20Problem.pdf) 5-point algorithm. Longuet-Higgins bypassed that complexity by fixing one of the nine matrix entries as unit scale, treating the remaining eight as independent unknowns in a linear system solved from eight correspondences, and enforcing the rank-2 and unit-scale constraints afterward. His **8-point algorithm** delivered a unique solution directly from eight points, making it fast, lightweight, and remarkably easy to code.

That linear shortcut, however, suffered from poor numerical conditioning. Because raw image coordinates span hundreds or thousands of pixels while homogeneous coordinates append a trailing 1, the columns of the linear system vary by orders of magnitude, rendering the singular value decomposition (SVD) hypersensitive to noise. Fortunately, the cure required no change to the underlying geometry:

> 🔗 **Borrowed.** Hartley's 1997 normalized 8-point algorithm ([In Defense of the Eight-Point Algorithm](https://www.cse.unr.edu/~bebis/CS485/Handouts/hartley.pdf)) applied a simple linear transform to each image's coordinates—shifting their mean to zero and scaling their average distance from the origin to $\sqrt{2}$—before estimating the fundamental matrix and transforming the result back. Unlike normalizing by camera intrinsics, this was purely a numerical conditioning step that left Longuet-Higgins's geometry untouched while transforming its reliability, quickly becoming standard textbook practice.

When camera intrinsics $\mathbf{K}$ are unknown, the same epipolar geometry generalizes from the essential matrix to the **fundamental matrix** $\mathbf{F}$, which satisfies $\mathbf{x}_2^\top \mathbf{F} \mathbf{x}_1 = 0$ directly in pixel coordinates. Given intrinsic matrices $\mathbf{K}_1$ and $\mathbf{K}_2$ for the two views, the two matrices relate by $\mathbf{F} = \mathbf{K}_2^{-\top} \mathbf{E} \mathbf{K}_1^{-1}$—simplifying to $\mathbf{F} = \mathbf{K}^{-\top} \mathbf{E} \mathbf{K}^{-1}$ when both photographs come from the same camera ($\mathbf{K}_1 = \mathbf{K}_2 = \mathbf{K}$). Modern SfM pipelines exploit this duality automatically, solving directly for $\mathbf{E}$ when $\mathbf{K}$ is calibrated and falling back to $\mathbf{F}$ when it is not.

---

## 3.2 Tomasi-Kanade Factorization

For roughly a decade after 1981, SfM research centered on pairs of views rather than full image sequences. Solving for an entire stream of photographs simultaneously posed a different algebraic challenge—one that Carlo Tomasi and Takeo Kanade at CMU answered in 1992 with their **[factorization method](https://people.eecs.berkeley.edu/~yang/courses/cs294-6/papers/TomasiC_Shape%20and%20motion%20from%20image%20streams%20under%20orthography.pdf)**.

Suppose $F$ frames track the same $P$ points throughout a sequence. Stacking every 2D measurement produces a $2F \times P$ measurement matrix $\mathbf{W}$. Subtracting each frame's point centroid eliminates camera translation, and under an orthographic (or scaled orthographic) camera model—the starting point of Tomasi and Kanade's 1992 paper—the centered matrix $\mathbf{W}$ has rank at most three. It therefore factors cleanly into motion and structure:

$$\mathbf{W} = \mathbf{M} \mathbf{S}$$

In this decomposition, $\mathbf{M}$ is a $2F \times 3$ motion matrix and $\mathbf{S}$ is a $3 \times P$ structure matrix. Truncating an SVD of $\mathbf{W}$ to its top three singular values immediately produces a rank-3 factorization. Because any invertible $3\times 3$ matrix $\mathbf{A}$ yields an equally valid product $(\mathbf{M}\mathbf{A})(\mathbf{A}^{-1}\mathbf{S})$, a subsequent metric-upgrade step pins down $\mathbf{A}$ by enforcing orthogonality and equal-norm constraints on the camera rows.

With a single low-rank SVD followed by that metric upgrade, Tomasi-Kanade recovered every camera pose and every 3D point simultaneously—far simpler to implement than iterative nonlinear bundle adjustment, with runtime governed mainly by the SVD of a $2F \times P$ matrix. Later real-time systems adapted this multi-frame intuition in a leaner, incremental way:

> 🔗 **Borrowed.** Later literature often marks Nistér, Naroditsky, and Bergen's 2004 CVPR paper "Visual Odometry" as the moment real-time ego-motion estimation crystallized into an applied lineage. Rather than running Tomasi-Kanade's batch factorization over a full sequence, it solved relative pose frame-by-frame inside a short window, trading global batch accuracy for low latency.

Ultimately, Tomasi-Kanade's elegance was boxed in by its orthographic and affine camera model. Because an affine camera ignores perspective foreshortening, the factorization holds closely only when depth variation within the scene is tiny compared to the distance from the camera, such as distant, compact objects. On wide-angle lenses, close-up scenes, or environments with large foreground-to-background depth differences, reconstruction error climbed quickly. By the late 1990s, attempts to extend factorization to full perspective cameras pushed researchers back toward bundle adjustment.

---

## 3.3 Hartley & Zisserman and the canonization

While Tomasi-Kanade framed the multi-view problem, the field still lacked a unified mathematical grammar capable of handling full perspective geometry across arbitrary numbers of cameras.

That synthesis arrived in 2000 with Richard Hartley and Andrew Zisserman's 680-page textbook, *[Multiple View Geometry in Computer Vision](https://www.robots.ox.ac.uk/~vgg/hzbook/)*. Drawing together nearly two decades of results scattered from 1981 through the 1990s, the authors unified the essential matrix, fundamental matrix, homography, camera calibration, and bundle adjustment under the single framework of projective geometry. Concepts that had matured in separate papers suddenly appeared as facets of one coherent theory.

Bundle adjustment played a starring role in that synthesis. Building on the Triggs et al. (1999) formulation reviewed in Chapter 1, Hartley and Zisserman cast reprojection-error minimization inside projective geometry and paired it explicitly with a *robust cost function* $\rho$—such as Huber or Cauchy—to damp out mismatched outliers that would otherwise derail optimization on real photographs. Using Levenberg-Marquardt alongside the sparse structure of the Jacobian, they delivered a practical blueprint for large-scale solvers.

Throughout the early 2000s, nearly every SLAM and visual odometry (VO) paper cited Hartley & Zisserman as its foundational reference. With shared definitions established in one textbook, researchers building systems like Photo Tourism could focus on scale and engineering rather than re-deriving basic geometry.

---

## 3.4 Photo Tourism and Bundler — Internet-scale SfM

In 2006, Noah Snavely, Steven Seitz, and Richard Szeliski proved that this textbook geometry could survive the chaos of uncurated consumer photos. In their SIGGRAPH paper "[Photo Tourism](https://doi.org/10.1145/1179352.1141964)," they harvested tourist snapshots of landmarks such as the Florence Duomo and Rome's Trevi Fountain directly from the internet and reconstructed them in 3D.

Unlike lab datasets, those collections were completely uncontrolled: cameras, lenses, lighting, weather, and framing varied wildly, mixed in with unrelated indoor shots uploaded in no order by thousands of strangers. Snavely's pipeline first extracted and matched SIFT features across image pairs, then applied RANSAC with the fundamental matrix to prune geometrically inconsistent matches. Starting from a strongly connected seed pair, incremental SfM registered cameras one at a time, re-running bundle adjustment over all poses and 3D points after each addition.

The results demonstrated that uncontrolled internet photo collections could yield coherent 3D models: Notre Dame Cathedral registered 597 out of 2,635 candidate images, the Trevi Fountain in Rome 360 out of 466, Yosemite Half Dome 325 out of 1,882, the Great Wall 82 out of 120, and Trafalgar Square 278 out of 1,893, achieving an average reprojection error of roughly 1.5 pixels on 1,611×1,128 images. Snavely released the underlying pipeline as open-source software under the name **Bundler**, giving the SfM community a common baseline to build upon. You can step through how incremental SfM adds cameras and adjusts bundles in the interactive demo below:

## 3.5 COLMAP — engineering maturity

> 📜 **Prediction vs. outcome.** In the "Discussion and future work" section of Snavely et al. (2006), the authors wrote, *"Ultimately, we wish to scale up our reconstruction algorithm to handle millions of photographs,"* flagging better registration ordering, lens-distortion modeling, repeated structures, and disconnected components as open hurdles. Ten years later, COLMAP (Schönberger 2016) and OpenSfM pushed robust open-source reconstruction to tens and hundreds of thousands of images, while SLAM pursued real-time online scale separately via fixed-lag smoothers and loop closure rather than offline incremental refinement. Even with that progress, the scale cited here reflects tens to hundreds of thousands of images rather than demonstrating that the million-image goal had been solved universally.

In 2016, Johannes Schönberger and Jan-Michael Frahm published "[Structure-from-Motion Revisited](https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf)" at CVPR. Behind that modest title lay a ground-up engineering overhaul incorporating a decade of lessons learned since Bundler, packaged into **COLMAP**.

Compared with Bundler, COLMAP transformed incremental SfM in three decisive ways. First, it replaced ad-hoc camera ordering with principled next-best-view selection: instead of picking whichever pair had the most raw connections, COLMAP scored initial pairs and subsequent camera additions by triangulation angle, feature-track length, and spatial visibility distribution, dramatically stabilizing reconstruction. Second, it restructured the bundle-adjustment schedule: rather than paying for a full global bundle adjustment after every single registered image, COLMAP ran fast local bundle adjustment over the newly added camera and its closest neighbors, triggering global bundle adjustment only periodically. Third, it strengthened geometric verification by running RANSAC on every matched pair with two competing models in parallel—the fundamental matrix for general 3D scenes and a homography for planar scenes or pure camera rotation—and comparing their inlier counts to classify the geometry and reject false matches before reconstruction could drift.

> 🔗 **Borrowed.** COLMAP's incremental bundle-adjustment pipeline modularized Snavely's Bundler workflow and inserted strict quality checks at every stage. Its core mathematical primitives—essential matrix estimation, triangulation, and Levenberg-Marquardt—remained straight out of Hartley & Zisserman; COLMAP's breakthrough was turning hard-won engineering judgment into a reliable system.

Beyond raw accuracy, COLMAP conquered 3D vision through practical craftsmanship: clean code, thorough documentation, and CUDA acceleration suited to large image collections. When NeRF arrived in 2020 and 3D Gaussian Splatting followed, their reference training pipelines assumed COLMAP camera poses and sparse point clouds as standard preprocessing inputs, making COLMAP the de facto gateway for modern 3D reconstruction research.

---

## 3.6 The split between SfM and SLAM

Even though SfM and SLAM share projective geometry and nonlinear least squares, they solve fundamentally different operational problems—a divergence that sharpened unmistakably in the early 2000s.

SfM operates *offline*: every photograph is collected before reconstruction begins, leaving no per-frame deadline and allowing global bundle adjustment to revisit and repair any camera pose across the entire dataset. SLAM, by contrast, must run *online* on a moving platform: sensor data streams in continuously, the robot needs its current pose right away, past frames cannot be reprocessed endlessly as the map expands, and accumulated drift has to be corrected promptly whenever the robot closes a loop back to a previously visited place.

That temporal constraint dictates two very different system designs. Because SLAM must detect revisits on the fly and propagate loop-closure corrections back through long chains of poses, it also has to track the uncertainty of the robot's current pose in real time—requiring probabilistic representations such as an Extended Kalman Filter (EKF) or factor graph. In offline SfM, parameter covariances can simply be extracted once optimization finishes.

When Andrew Davison presented [MonoSLAM (2003)](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf), he initially framed it as "real-time SfM." Yet keeping camera pose and 3D landmarks coupled inside a single EKF state vector stood worlds apart from SfM's offline batch optimization. Over the 2000s, the two communities grew into distinct traditions, each defined by its own latency constraints and benchmarks.

---

## Still open

**SfM with dynamic objects.** General-purpose SfM pipelines such as COLMAP still assume a rigidly static world. Because bundle adjustment expects every 3D point to stay put, feature matches on moving cars or pedestrians pull camera poses off course. RANSAC removes some of these contaminated correspondences, and Dynamic SfM methods introduce segmentation or per-object motion models, yet no public implementation has matched COLMAP's broad reliability on everyday dynamic scenes.

**The blurring boundary between SfM and SLAM.** In 2023, [DUSt3R](https://arxiv.org/abs/2312.14132) (Wang et al.) fed two images into a single pretrained transformer and directly predicted dense 3D point maps alongside camera poses—skipping feature matching, RANSAC, and bundle-adjustment initialization altogether. Its successor [MASt3R](https://arxiv.org/abs/2406.09756) (2024) extended the approach across tens of images. One by one, traditional SfM modules are being absorbed into learned networks, with DUSt3R-family models now vying to replace COLMAP as the front end for NeRF and 3DGS. Whether they will displace classical SfM completely or settle into complementary niches remains an open question.

---

While SfM perfected offline 3D reconstruction from completed image collections, robotics faced a far less forgiving reality: a moving robot had to estimate where it was *before* the journey ended, using noisy measurements as they arrived. Out of that pressure, the question Randall Smith and Peter Cheeseman [posed in 1986](https://people.csail.mit.edu/brooks/idocs/Smith_Cheeseman.pdf)—how to propagate uncertain spatial relationships step by step—grew into the discipline of SLAM.

# Chapter 4. EKF-SLAM

The photogrammetry, Structure from Motion, and bundle adjustment of Part I all shared a comfortable luxury: either the camera stayed still, or the system could wait until all photographs were collected and process them offline in a single batch. Hartley and Zisserman's projective geometry, RANSAC, and Levenberg-Marquardt could reconstruct a scene with extraordinary precision, yet none of them answered the question a moving robot faces at every instant: *where am I right now?* Part II begins with that real-time demand. An autonomous robot must build a map, localize itself inside it, and keep both estimates coherent as sensor uncertainty compounds—a line of probabilistic mapping that began with a short memo at SRI International.

In 1986, Randall Smith and Peter Cheeseman set out to formalize how spatial uncertainty propagates across a robot's measurements. Borrowing the mathematics of Kalman's (1960) filter, they expanded it from tracking a single state vector to maintaining an entire *network of spatial relationships*. A few years later, Hugh Durrant-Whyte in Sydney and John Leonard at MIT fused that probabilistic machinery with a new problem formulation: estimating a robot's pose while simultaneously constructing the map around it. Out of that union came the name "SLAM."

---

## 4.1 The mathematics of uncertain spatial relationships — Smith, Self, Cheeseman (1988)

At SRI International in 1986, Randall Smith, Matthew Self, and Peter Cheeseman tackled a concrete geometric question: if a robot measures frame B from frame A, and then measures frame C from frame B, how does uncertainty accumulate from A to C? Presented at UAI 1986 and published in 1988 as ["Estimating Uncertain Spatial Relationships in Robotics"](https://arxiv.org/abs/1304.3111), their paper cast spatial composition into probabilistic form.

The [Kalman filter](https://www.cs.unc.edu/~welch/kalman/kalmanPaper.html) was already well established by then, having guided radar tracking, ballistics, and satellite-orbit estimation since 1960. Smith, Self, and Cheeseman adapted Kalman's covariance-propagation equations to chains of spatial transforms. Instead of estimating the robot and the environment separately, they stacked the robot pose $\mathbf{x}_r$ and all landmark positions $\mathbf{m}_i$ into one joint state vector paired with a single joint covariance matrix $\mathbf{P}$:

$$\mathbf{x} = [\mathbf{x}_r^\top,\ \mathbf{m}_1^\top,\ \ldots,\ \mathbf{m}_N^\top]^\top$$

$$\mathbf{P} = \begin{bmatrix} \mathbf{P}_{rr} & \mathbf{P}_{rm} \\ \mathbf{P}_{mr} & \mathbf{P}_{mm} \end{bmatrix}$$

The off-diagonal block $\mathbf{P}_{rm}$ captured the central insight of probabilistic mapping: uncertainties in the robot's pose and in the landmark positions are tightly *correlated*. Only by tracking those cross-correlations explicitly could a robot update both its map and its own location consistently—a demonstration that laid the mathematical foundation for SLAM.

> 🔗 **Borrowed.** Smith-Self-Cheeseman's (1988) spatial-relationship mathematics inherits directly from Kalman's (1960) covariance propagation. A filter originally crafted to track a single moving target became a framework for jointly estimating a robot and every landmark in its map.

---

## 4.2 How the name "SLAM" settled in

Nowhere in the 1988 Smith-Self-Cheeseman paper does the word "SLAM" appear. Through the early 1990s, Hugh Durrant-Whyte—who had moved from Oxford to Sydney—and John Leonard at MIT were studying the exact same problem under different names in their respective laboratories. Once their groups began reading and citing each other's work, they needed a common label, and "SLAM" gradually caught on. Memories among researchers differ on which report printed the acronym first, and no single canonical "coining" paper exists.

Still, Leonard and Durrant-Whyte's 1991 IROS paper, ["Simultaneous Map Building and Localization for an Autonomous Mobile Robot"](https://doi.org/10.1109/IROS.1991.174711), stands out as an early milestone that placed the core idea right in its title: mapping and localization are inseparable and must be solved together. Once that phrase shortened into "Simultaneous Localization and Mapping"—SLAM—the field spent the next decade converging around it.

> 🔗 **Borrowed.** [Bar-Shalom's multi-target tracking](https://archive.org/details/trackingdataasso0000bars) (collected as a 1988 monograph) already offered a formal framework for tracking multiple objects simultaneously. Leonard and Durrant-Whyte effectively mapped "target position" to "landmark position" and "tracker position" to "robot pose," translating radar-tracking machinery into indoor mobile robotics.

---

## 4.3 The EKF-SLAM formulation

Because the Extended Kalman Filter (EKF) was already the standard tool for nonlinear state estimation well before 1988, applying it to SLAM was an obvious next step. Every cycle alternates between two stages: prediction and update.

In the predict stage, as the robot executes a control input $\mathbf{u}$, the motion model $f(\cdot)$ advances the state estimate while its Jacobian $\mathbf{F}$ propagates the covariance forward:

$$\hat{\mathbf{x}}^- = f(\hat{\mathbf{x}}, \mathbf{u})$$
$$\mathbf{P}^- = \mathbf{F}\mathbf{P}\mathbf{F}^\top + \mathbf{Q}$$

In the update stage, a new sensor observation $\mathbf{z}$ arrives. Using the Jacobian $\mathbf{H}$ of the observation model $h(\cdot)$, the filter computes the Kalman gain $\mathbf{K}$ and corrects both the state estimate and the joint covariance:

$$\mathbf{K} = \mathbf{P}^-\mathbf{H}^\top(\mathbf{H}\mathbf{P}^-\mathbf{H}^\top + \mathbf{R})^{-1}$$
$$\hat{\mathbf{x}} = \hat{\mathbf{x}}^- + \mathbf{K}(\mathbf{z} - h(\hat{\mathbf{x}}^-))$$
$$\mathbf{P} = (\mathbf{I} - \mathbf{K}\mathbf{H})\mathbf{P}^-$$

The algebra is compact and self-contained, yet that very compactness built a hard scalability ceiling directly into EKF-SLAM.

The bottleneck comes from state dimension. A state containing one 6DOF pose and $N$ 3D landmarks has length $6 + 3N$, meaning its covariance matrix holds $(6+3N)^2$ entries—growing as $O(N^2)$. Even when each sensor measurement has fixed dimension, refreshing the entire dense covariance matrix costs $O(N^2)$ per step, and computing the Kalman gain requires multiplying the state–observation covariance by the inverse of $\mathbf{S} = \mathbf{H}\mathbf{P}^-\mathbf{H}^\top + \mathbf{R}$ (whose size scales with the observation dimension). At 100 landmarks, the covariance matrix is already $306 \times 306 \approx$ 94k entries; by 1,000 landmarks, it balloons to $3006 \times 3006 \approx$ 9M entries. On an ordinary desktop computer of the early 2000s, real-time execution topped out at a few dozen to a couple hundred landmarks.

That $O(N^2)$ ceiling is precisely why [Andrew Davison's MonoSLAM (2003)](https://www.doc.ic.ac.uk/~ajd/Publications/davison_iccv2003.pdf) had to limit its live demos to a few dozen landmarks.

---

## 4.4 The scalability wall

When Davison unveiled real-time 3D tracking from a single handheld webcam at ICCV 2003, his map covered only a desk-sized workspace populated with a few dozen features. At a time when commercial SLAM did not yet exist, seeing a single camera run live in 3D was a breakthrough, yet the size of the covariance matrix dictated exactly how far that camera could roam.

With 100 landmarks, the state vector reaches $6 + 3 \times 100 = 306$ variables and the covariance matrix sits at $306 \times 306$; at 1,000 landmarks, it grows to $3006 \times 3006$. Every frame demands matrix updates and an inversion across that growing table. Worse still, because the EKF maintains one dense joint distribution, adding even a single new landmark immediately creates cross-correlations with every landmark already in the map, locking the update cost into quadratic growth.

Through the mid-2000s, the standard workaround was **submapping**: dividing the environment into small overlapping local regions, running an independent EKF inside each one, and linking the submaps through an outer coordination layer, as explored early on by [Chong and Kleeman (1999)](http://www.cs.cmu.edu/afs/cs/Web/People/motionplanning/papers/sbp_papers/integrated1/chong_feature_map.pdf). In practice, however, information lost across submap boundaries, awkward loop closures, and brittle implementation complexity kept submapping from becoming an easy general fix.

> 🔗 **Borrowed.** Chong-Kleeman's (1999) submaps and the local-window optimizations in modern SLAM share the goal of keeping computation bounded—a concern echoed in ORB-SLAM's local map and VINS-Mono's sliding window. Because their map partitioning and state marginalization mechanics differ, though, the parallel reflects a shared engineering constraint rather than direct algorithmic descent.

---

## 4.5 The consistency problem: Julier-Uhlmann's counterexample

Even if computers had been fast enough to swallow an $O(N^2)$ matrix, a deeper mathematical flaw surfaced at ICRA 2001. In a provocatively titled paper—["A Counter Example to the Theory of Simultaneous Localization and Map Building"](https://doi.org/10.1109/ROBOT.2001.933257)—Simon Julier and Jeffrey Uhlmann ran numerical experiments showing that EKF-SLAM systematically trusts its own estimates too much.

Later literature summarizes their finding as asymptotic *overconfidence*: as a trajectory lengthens, the filter's true estimation error grows while its reported covariance shrinks below the actual error. In filter terminology, the estimator becomes **inconsistent**.

Linearization error is the culprit. Because the EKF approximates nonlinear motion and observation models with first-order Taylor expansions evaluated at the current estimate, small approximation biases accumulate at every step and steadily deflate the computed covariance. Once the filter becomes overly certain that "the robot is right here," it downweights incoming sensor measurements, locking errors permanently into the map.

In 2007, [Shoudong Huang and Gamini Dissanayake](https://doi.org/10.1109/TRO.2007.903811) pinpointed the structural mechanism behind this collapse. Evaluating Jacobians at shifting state estimates breaks fundamental geometric relationships among those Jacobians, causing the estimated variance of the robot's heading angle (yaw) to collapse toward zero when physically it must remain nonzero. Subsequent observability analyses built directly on that insight: whenever the linearization point drifts, the system's observable subspace shifts with it, tricking the filter into injecting phantom certainty along unobservable directions.

> 📜 **Prediction vs. outcome.** Following Julier and Uhlmann's 2001 counterexample, researchers spent nearly a decade building more consistent filters—exploring the Unscented Kalman Filter (UKF), the Invariant EKF, and covariance-inflation schemes. By 2026, however, iterative optimization had emerged as another major answer, anchored by [iSAM](https://www.cs.cmu.edu/~kaess/pub/Kaess08tro.pdf) (Kaess et al., 2008), [g2o](http://ais.informatik.uni-freiburg.de/publications/papers/kuemmerle11icra.pdf) (Kümmerle et al., 2011), and GTSAM, even as filter-based VIO kept advancing in parallel. Optimization can relinearize past states, yet relinearization by itself does not guarantee consistency unless unobservable directions and marginalization linearization points are also handled carefully.

---

## 4.6 FastSLAM — divide and conquer

At AAAI 2002, Michael Montemerlo, Sebastian Thrun (Stanford), Daphne Koller, and Ben Wegbreit attacked EKF-SLAM's $O(N^2)$ bottleneck from a completely different angle with [FastSLAM](https://cdn.aaai.org/AAAI/2002/AAAI02-089.pdf).

Their breakthrough rested on **Rao-Blackwellization**: conditioned on a specific robot trajectory $x_{0:t}$, the positions of all landmarks become *mutually independent*. That conditional independence meant FastSLAM could represent possible robot trajectories with a particle filter—each particle carrying one candidate path—while running a tiny, independent EKF for every landmark inside each particle.

With $K$ particles and $N$ landmarks, using a KD-tree for landmark lookup brought the per-step cost down to $O(K \log N)$—logarithmic in $N$ rather than quadratic when $K$ is fixed. Because landmark EKFs inside each particle never cross-correlate, the algorithm avoids maintaining a dense $N \times N$ covariance matrix altogether. With $K$ typically set to tens or hundreds of particles, the practical speedup was dramatic.

FastSLAM handled hundreds of landmarks in real-time indoor runs and won rapid adoption, yet it traded one failure mode for another. As trajectories stretched out, **particle depletion** set in: most particles drifted onto poor paths, leaving too few effective samples to represent uncertainty properly. Reweighting particle histories during large loop closures proved brittle, and simply throwing more particles at the problem could not stop drift in expansive environments. Even after [FastSLAM 2.0](https://www.ijcai.org/Proceedings/03/Papers/165.pdf) (Montemerlo et al. 2003) sharpened the proposal distribution, filtering still hit an architectural wall—one that graph optimization would soon step right past.

---

## 4.7 The EKF's exit

Once graph-based optimization turned practical after 2005, EKF-SLAM stepped back from the center of the field. [Feng Lu and Evangelos Milios's 1997 pose-graph formulation](https://doi.org/10.1023/A:1008854305733), paired first with [Olson, Leonard, and Teller's (2006)](https://april.eecs.umich.edu/pdfs/olson2006icra.pdf) fast solver and then with the sparse real-time factorizations of g2o, GTSAM, and iSAM2, neutralized the EKF's longtime advantage in incremental speed.

The contrast became unmistakable whenever a robot closed a loop. Returning to a previously mapped spot forces an EKF to propagate corrections across its entire dense covariance matrix at $O(N^2)$ cost. A pose graph simply inserts one new constraint edge and updates a sparse matrix factorization for a fraction of the compute.

By around 2010, designing a brand-new SLAM backend around a standard EKF had become the exception rather than the rule, surviving mainly on tightly constrained hardware or in applications requiring strict real-time filtering.

> 📜 **Prediction vs. outcome.** In their influential [2006 IEEE Robotics & Automation Magazine tutorial](https://people.eecs.berkeley.edu/~pabbeel/cs287-fa09/readings/Durrant-Whyte_Bailey_SLAM-tutorial-I.pdf), Durrant-Whyte and Bailey examined SLAM scalability and pointed toward submap decomposition and the information filter as the likely paths to large-scale mapping. Because the information filter (the inverse-covariance dual of the EKF) works with a sparse information matrix, researchers hoped it would stay fast as landmark counts soared. History took a different turn: sparse information filters such as SEIF accumulated approximation errors when forcing sparsity during marginalization, and submaps saw only selective adoption, while factor graphs solved by iterative optimization swept the 2010s.

---

## Still open

**Filter vs. optimization coexistence.** Losing dominance as the default SLAM backend did not erase the EKF. Even in 2026, certain autonomous-driving stacks and low-cost embedded platforms still choose sparse EKFs or UKFs because their fixed per-step compute avoids the unpredictable convergence iterations of nonlinear optimization. Which paradigm wins depends closely on the platform's latency guarantees and compute budget.

**Non-Gaussian uncertainty.** Standard EKFs assume that uncertainty fits a single Gaussian bell curve, whereas real sensors often produce heavy-tailed or multimodal errors—especially under perceptual aliasing, when two different hallways look identical and create competing pose hypotheses. Particle filters handle multimodal distributions in principle yet collapse in high-dimensional state spaces. Alternatives such as Stein particles, normalizing flows, and learned uncertainty models are under active exploration, though few have been battle-tested inside real-time SLAM as of 2026.

---

Even as EKF-SLAM ran into its practical ceiling around 100 landmarks, Andrew Davison at Imperial College used that exact tight budget to prove a remarkable point: a single camera, working entirely without laser scanners, IMUs, or stereo rigs, could track in real time. The numerical bottleneck remained, yet the system design built around it was about to change the direction of Visual SLAM.


---

# Chapter 5. Real-Time Monocular SLAM: MonoSLAM and PTAM

EKF-SLAM gave robotics a way to estimate a map alongside its own uncertainty, yet its dense covariance matrix ran straight into an $O(N^2)$ scaling wall in the number of landmarks $N$. Nothing was wrong with the probability theory; the bottleneck was baked into the architecture. Over the span of four years, Andrew Davison and Georg Klein offered two sharply different answers to that ceiling.

In 2003, Davison—then at Oxford—achieved real-time 3D tracking of a handheld camera and its surrounding scene on an ordinary desktop PC. Carrying forward the probabilistic spatial-relations framework laid down by Smith and Cheeseman in 1988 and the EKF-SLAM architecture built on it by Leonard and Durrant-Whyte, he stripped away the laser scanners, stereo rigs, and IMUs that robotics teams usually depended on. Pairing the 1994 Shi-Tomasi corner detector with a Kalman predict-update loop on a single camera, he produced a combination that looked audacious by the standards of the day.

Four years later, in 2007, Klein and Murray at Oxford broke through the EKF wall in another way altogether: splitting pose tracking and map optimization into two parallel threads, an architectural pattern that became the backbone of Visual SLAM for the next decade.

---

## 5.1 The 2003 demo

At ICCV 2003, Davison unveiled [Real-Time Simultaneous Localisation and Mapping with a Single Camera](https://doi.org/10.1109/ICCV.2003.1238654), one of the earliest live demonstrations of real-time SLAM driven solely by a single moving camera.

Mainstream SLAM in 2003 leaned heavily on range sensors. LiDAR scanners measured 2D distances directly, while stereo rigs recovered pixel-level depth through triangulation. A monocular camera starts with no depth reading at all: inferring 3D structure requires observing the scene across at least two viewpoints, and any initial depth uncertainty ripples straight through the entire EKF state vector. Although the geometry was well understood on paper, turning it into a real-time loop was notoriously fragile.

By flying solo with one camera—skipping both IMUs and multi-camera stereo calibration—MonoSLAM proved that pure monocular real-time SLAM was genuinely possible, even as the EKF's expanding covariance matrix kept the resulting map tight and small.

---

## 5.2 The beauty and the wall of the EKF

Four years after the ICCV demo, Davison, Ian Reid, Nicholas Molton, and Olivier Stasse published the complete archival account of [MonoSLAM](https://doi.org/10.1109/TPAMI.2007.1049) in IEEE TPAMI (2007).

MonoSLAM transplanted the joint-state formulation of [Smith-Self-Cheeseman (1988)](https://arxiv.org/abs/1304.3111) and [Leonard-Durrant-Whyte (1991)](https://ieeexplore.ieee.org/document/174711/) (Chapter 4) directly onto a moving monocular camera. Its augmented state vector $\mathbf{x} = (\mathbf{x}_v^\top, \mathbf{y}_1^\top, \ldots, \mathbf{y}_N^\top)^\top \in \mathbb{R}^{13+3N}$ packed the 13-dimensional camera state $\mathbf{x}_v \in \mathbb{R}^{13}$—3 for position, 4 for quaternion orientation, 3 for linear velocity, and 3 for angular velocity—together with $N$ 3D landmarks $\mathbf{y}_i \in \mathbb{R}^3$. Because a free-moving handheld camera needed a smooth dynamics model between frames, velocity and angular velocity had to ride inside the state vector alongside pose. Frame after frame, the filter maintained the full $(13+3N)\times(13+3N)$ covariance matrix $\mathbf{P}$ through the standard predict-update equations from Chapter 4 §4.3: predicting via the motion model $f$ and its Jacobian $\mathbf{F}$ ($\mathbf{P}^- = \mathbf{F}\mathbf{P}\mathbf{F}^\top + \mathbf{Q}$), then updating with the Kalman gain derived from the projection Jacobian $\mathbf{H}_i$.

That exact covariance update, $(\mathbf{I} - \mathbf{K}_i\mathbf{H}_i)\mathbf{P}^-$, dictated the system's computational ceiling. Dominated by $(13+3N)^2$ matrix operations, its cost scaled as $O(N^2)$ with the number of landmarks $N$; in §III of the PAMI paper, the authors noted that real-time 30 Hz operation could sustain "about 100" features.

> 🔗 **Borrowed.** MonoSLAM's EKF state vector transplants the Smith-Cheeseman-Durrant-Whyte (1988-1991) probabilistic spatial-relations representation directly onto a monocular camera. While the Kalman filter dates back to 1960, Leonard and Durrant-Whyte established the convention of packing robot pose and landmarks into a single "augmented state vector" in 1991.

Even as they acknowledged that ceiling by pointing toward submapping as future work, partitioning an EKF was notoriously tricky because its dense covariance matrix explicitly linked every pair of landmarks. That same compute budget also shaped how MonoSLAM picked features: by relying on [Shi-Tomasi (1994)](https://doi.org/10.1109/CVPR.1994.323794) "Good Features to Track," the system invested its scarce state-vector slots exclusively in corners likely to stay trackable. As the PAMI paper reports, active map management kept roughly 12 features reliably in view per frame under a wide-angle lens—and as long as that tight set stayed locked on target, the filter ran smoothly.

> 🔗 **Borrowed.** The Shi-Tomasi 1994 corner detector was already at work in MonoSLAM before PTAM adopted it. The design rule of "select good features, then track them" forms a direct Shi-Tomasi → MonoSLAM → PTAM lineage.

---

## 5.3 2007, the same year

Maintaining only a dozen active features laid bare the EKF's fundamental bottleneck—and at Oxford, Georg Klein was confronting that exact same limit.

In 2007, the very year Davison's definitive MonoSLAM paper appeared in TPAMI, Klein and David Murray presented [Parallel Tracking and Mapping for Small AR Workspaces](https://doi.org/10.1109/ISMAR.2007.4538852) at ISMAR. That simultaneity was no coincidence; both works grew out of the same academic circle. Klein had earned his PhD under Tom Drummond at Cambridge before joining Murray—who had previously supervised Davison—as a postdoctoral researcher at Oxford. PTAM carried forward MonoSLAM's commitment to real-time monocular operation, yet made a decisive break to achieve scale: Klein threw out the EKF entirely.

---

## 5.4 The split

PTAM's defining insight was to decouple camera pose **tracking** from 3D **mapping** and execute them in two separate, parallel threads.

In EKF-SLAM, tracking and mapping were welded inside a single sequential loop: every incoming frame had to predict the camera state, match landmarks, and pay for a full joint covariance update. PTAM broke that coupling. Its **tracking thread** did one job as fast as possible—estimating only the current camera pose at frame rate by projecting already-mapped 3D points from nearby keyframes and aligning them with image observations. Meanwhile, its **mapping thread** worked asynchronously in the background, adding new keyframes whenever the camera explored fresh ground and refining the 3D map with bundle adjustment—without ever stalling the live tracker.

On the mapping thread, bundle adjustment minimized the robust sum of reprojection errors across a set of keyframes $\mathcal{K}$ and 3D map points $\mathcal{P}$:

$$\min_{\{\mathbf{T}_k\}, \{\mathbf{p}_j\}} \sum_{k \in \mathcal{K}} \sum_{j \in \mathcal{P}_k} \rho\!\left(\left\|\mathbf{z}_{kj} - \pi(\mathbf{T}_k,\, \mathbf{p}_j)\right\|^2_{\mathbf{\Sigma}_{kj}}\right)$$

In this objective, $\mathbf{T}_k \in SE(3)$ denotes the pose of keyframe $k$, $\mathbf{p}_j \in \mathbb{R}^3$ is a 3D landmark, $\pi$ is the camera projection function, $\mathbf{z}_{kj}$ is the observed pixel coordinate of point $j$ in keyframe $k$ with measurement covariance $\mathbf{\Sigma}_{kj}$, and $\rho$ is a robust loss kernel such as Huber. Solving this objective iteratively via Levenberg–Marquardt in a background thread meant that optimization cost never interrupted real-time camera tracking.

> 🔗 **Borrowed.** The bundle adjustment running in PTAM's mapping thread directly applies [Triggs et al. 1999 "Bundle Adjustment — A Modern Synthesis"](https://doi.org/10.1007/3-540-44480-7_21). The century-old photogrammetry lineage traced in Part I had moved straight into the heart of a real-time SLAM backend: what EKF-SLAM could not afford because of its dense covariance matrix, PTAM achieved by letting keyframe BA run asynchronously from tracking.

That single architectural split transformed map scale overnight. Freed from the EKF's $O(N^2)$ ceiling, PTAM scaled effortlessly from MonoSLAM's few dozen landmarks to maps spanning hundreds of keyframes, each packed with hundreds of patch features.

Initialization underwent a similar upgrade. Rather than assuming a known calibration pattern, PTAM asked the user to translate the camera smoothly sideways, estimated the essential matrix between the first two keyframes using a 5-point solver descended from [Nistér (2004)](https://doi.org/10.1109/TPAMI.2004.17) (specifically citing the follow-up by Stewénius, Engels, and Nistér 2006), and triangulated an initial 3D point cloud.

Algebraically, the essential matrix $\mathbf{E}$ is a $3\times 3$ matrix tying normalized corresponding points $(\mathbf{p}, \mathbf{p}')$ across two views through the epipolar constraint ${\mathbf{p}'}^\top \mathbf{E}\, \mathbf{p} = 0$. Factoring internally as $\mathbf{E} = \mathbf{t}_\times \mathbf{R}$—where $\mathbf{t}_\times$ is the skew-symmetric matrix of translation and $\mathbf{R}$ is rotation—$\mathbf{E}$ has five degrees of freedom. Although five point pairs suffice minimally, the resulting polynomial system yields up to ten complex candidate roots; Nistér's breakthrough was solving that polynomial fast enough to run inside a real-time RANSAC loop, giving PTAM a lightweight way to bootstrap its first keyframe pair.

> 🔗 **Borrowed.** PTAM's 5-point essential-matrix initialization follows the minimal-solver lineage opened by David Nistér's 2004 "An Efficient Solution to the Five-Point Relative Pose Problem" (the PTAM paper directly cites the follow-up Stewénius·Engels·Nistér 2006 ISPRS). Using the minimum five correspondences needed for a monocular camera's initial map, PTAM embedded the solver inside RANSAC to recover the relative pose of the first two keyframes at near-real-time speed.

> 🔀 **Structural parallel.** Leonard-Durrant-Whyte submaps and PTAM's keyframe map both keep computation bounded by working over local subsets. Yet the PTAM paper does not cite submapping as a design inspiration; its keyframes grew naturally out of separating tracking from mapping and feeding local bundle adjustment—a structure ORB-SLAM later formalized with a covisibility graph.

---

## 5.5 The diffusion of the new architecture

Designed expressly for augmented reality—as announced in its subtitle, "Small AR Workspaces"—PTAM delivered tracking stable and responsive enough to anchor virtual objects directly onto live video.

Industry picked up the pattern quickly. By the early 2010s, commercial AR platforms including Metaio (a German AR startup acquired by Apple in 2015) and Qualcomm's Vuforia SDK had adopted PTAM-style split tracking-and-mapping designs, helping bring reliable planar AR to consumer smartphones.

In academia, PTAM's blueprint proved even more foundational. When Raul Mur-Artal, J.M.M. Montiel, and Juan D. Tardós introduced [ORB-SLAM](https://arxiv.org/abs/1502.00956) in 2015, they kept PTAM's parallel-thread backbone while swapping patch features for ORB descriptors, organizing keyframes with a covisibility graph, and adding a third thread for loop closure. Three years later, Qin, Li, and Shen's [VINS-Mono](https://arxiv.org/abs/1708.03852) (2018) carried the same multi-threaded split—separating sliding-window optimization from loop closure—into visual-inertial odometry (VIO).

---

## 5.6 Davison vs Klein & Murray — a view comparison

Seen side by side in 2007, Davison's TPAMI MonoSLAM paper and Klein and Murray's ISMAR PTAM paper mark a clean fork in SLAM's evolution: MonoSLAM brought the probabilistic EKF paradigm to maturity, while PTAM broke its scaling limits with a new architecture.

Davison had a principled reason for holding onto the EKF: it maintained an explicit joint probability distribution over the entire system, tracking both the uncertainty of every landmark and the cross-correlations linking them. From that perspective, adopting bundle adjustment meant giving up explicit, continuously updated map covariance in exchange for raw scalability.

Klein and Murray happily made that trade. For augmented reality, the priority was rock-solid camera pose tracking at frame rate—not tracking landmark covariance to the centimeter—and periodic bundle adjustment kept the map accurate enough.

The broader community embraced the same trade-off. Throughout the 2010s, keyframe bundle adjustment and graph optimization swept Visual SLAM, confining EKF-SLAM largely to severely compute-starved platforms. Yet Davison's underlying insistence on consistent probabilistic inference never vanished. Instead of stepping straight onto the PTAM track, his lab evolved its representation in stages—from EKF to bundle adjustment, then to factor graphs, and onward to Gaussian Belief Propagation (GBP) and the Robot Web. Looking back twenty-three years later in Chapter 18 of the *SLAM Handbook*, Davison summarizes that arc as EKF → BA → factor graph → GBP: not as a narrow critique of MonoSLAM, but as an illustration of a broader principle that every shift in mathematical representation invites a redesign of the system around it.

---

## Prediction vs. outcome

> **Davison 2007 PAMI MonoSLAM**: In the Conclusion, Davison named larger indoor and outdoor environments, faster motion, and complex scenes with occlusion and lighting changes as the next tasks. He specifically proposed a submap strategy and CMOS cameras running above 100 Hz, and suggested extending the sparse map to a dense representation of "higher-order entities" (surfaces, etc.).
>
> These predictions met different fates. Submaps, PTAM's keyframe structure, and ORB-SLAM's covisibility graph share a concern with limiting computation, though that parallel alone does not establish direct lineage—and no system achieved hierarchical scaling while keeping the EKF intact, as hierarchy arrived only with the move to BA-based architectures. High-frame-rate sensing materialized in the 2010s through event-camera research. Meanwhile, robustness to dynamic scenes remains open as of 2026: systems such as DynaSLAM and FlowSLAM have tackled the problem, yet none has entered the standard baseline pipeline. Although Davison did not flag IMU fusion explicitly in Future Work (despite citing related work in the body), the VIO boom of the 2010s pursued that path aggressively. Above all, MonoSLAM's commitment to probabilistic consistency endured inside factor graphs and GBP—a trajectory Davison revisits in Handbook Ch.18 around how changing representations reshape systems, within which this history situates MonoSLAM.

> **Klein & Murray 2007 PTAM**: In §8 (Failure modes / Mapping inadequacies), Klein and Murray listed the system's limitations: corner-based tracking's vulnerability to motion blur, the geometric poverty of a point-cloud-centric map, and "not designed to close large loops in the SLAM sense." They stated plainly that global consistency across large loops was outside PTAM's design scope.
>
> Eight years later, ORB-SLAM (2015) tackled those exact boundaries head-on, adding [DBoW2](http://doriangalvez.com/papers/GalvezTRO12.pdf)-based appearance loop closure, covisibility-graph keyframe management, and ORB descriptors in place of raw patches to solve the large-scale mapping problem PTAM had left aside. While Klein and Murray did not prescribe appearance-based loop closure specifically, the failure modes they documented became the direct checklist for the generation that followed.

---

## Still open

**Monocular scale recovery.** Every pure monocular system from MonoSLAM to PTAM faces an unavoidable geometric ambiguity: a single camera cannot recover absolute metric scale without an external reference. Fusing an IMU resolves scale through gravity and linear acceleration, yet in vision-only monocular SLAM the problem remains open even in 2026. Learned monocular depth networks such as [MiDaS](https://arxiv.org/abs/1907.01341) and [Depth Anything](https://arxiv.org/abs/2401.10891) predict rich relative depth from a single image, but grounding those predictions in true metric units still depends on external cues such as a known ground-plane height or recognized object dimensions.

**Environmental generality of a single VO system.** MonoSLAM stayed within an indoor desk, PTAM targeted "Small AR Workspaces," and ORB-SLAM2 expanded to indoor, outdoor, and RGB-D domains—yet tracking still breaks down under harsh lighting shifts or featureless surfaces. As of 2026, no single monocular pipeline handles bright city streets, dark indoor corridors, nighttime scenes, and blank white walls with equal reliability. Multimodal rigs pairing cameras, LiDAR, and IMUs bridge much of that gap, leaving the universality of camera-only systems unresolved.

**Feature tracking in low light and dynamic scenes.** Both MonoSLAM and PTAM implicitly assumed steady illumination and a static world, assumptions most feature-based SLAM systems still lean on in 2026. ORB extraction falters in dim light, while crowded scenes full of moving people corrupt static triangulation with dynamic points. Learned optical flow and semantic segmentation help mitigate these failures, yet neither has yielded a lightweight, general-purpose real-time fix.

---

Even as PTAM's tracking-and-mapping split broke MonoSLAM's landmark limit, it left one crucial problem deliberately untouched: loop closure. As keyframes piled up along long trajectories, small drift errors accumulated until the camera returned to a familiar spot and found the map misaligned—a failure Klein and Murray had explicitly declared out of scope. Elsewhere in robotics, graph-SLAM researchers had already spent a decade forging the tool built to close that loop.


---

# Chapter 6. Graph SLAM

In a basement corridor at Carnegie Mellon in 1997, Feng Lu and Evangelos Milios set out to stitch a sequence of laser scans into a single globally consistent map. Although the Extended Kalman Filter was the field's reigning default, they chose a different representation altogether—modeling the relative measurements between robot poses as edges in a graph and solving for all poses simultaneously with least squares. They achieved global consistency without a Kalman filter in sight.

Lu and Milios were part of a wider shift away from filtering. More than a decade earlier, [Chatila and Laumond (1985)](https://www.semanticscholar.org/paper/Position-referencing-and-consistent-world-modeling-Chatila-Laumond/c34a678e40a7d80cb3683f07fc837179fd9bf3ee) at LAAS had framed mobile-robot spatial consistency in the language of smoothing. Shortly after Lu and Milios, [Gutmann and Konolige (1999)](https://www.semanticscholar.org/paper/Incremental-mapping-of-large-cyclic-environments-Gutmann-Konolige/3c1bda51b8ca59f1836ed1b96c485d905804989a) applied pose-graph matching to incremental mapping of large cyclic buildings, Sebastian Thrun's group cast the approach as the *full SLAM* problem and carried it into commercial robotics in the early 2000s, and [Folkesson and Christensen (2004)](http://www.hichristensen.net/hic-papers/folkesson-icra2004.pdf), Konolige, and Frank Dellaert developed complementary formulations of their own. Lu and Milios (1997) became the canonical citation not because they worked in isolation, but because they delivered a complete, clean pipeline combining laser scan matching with batch least-squares optimization. Even as EKF-SLAM struggled with its $O(N^2)$ covariance bottleneck in the 2000s and Klein and Murray's PTAM (2007) proved that real-time bundle adjustment could power monocular tracking, laboratories at CMU, LAAS, Stanford, and KTH were forging a unified graph-inference backend for SLAM.

---

## 6.1 From Laser Scans to Pose Graphs: Lu-Milios 1997

Before [Lu and Milios's 1997 paper, "Globally Consistent Range Scan Alignment"](https://doi.org/10.1023/A:1008854305733), mobile robots typically assembled laser maps by chaining together pairwise matches from Iterative Closest Point (ICP). Locally, ICP aligned consecutive scans neatly; globally, tiny registration errors compounded until corridors visibly twisted over tens of meters. When the robot completed a loop and returned to its starting hallway, the two ends of the map refused to meet.

Lu and Milios broke that chain of local fixes by representing the robot's pose history $x_1, x_2, \ldots, x_n$ as nodes in a graph and each relative spatial measurement between poses as an edge. Each edge encodes a measured relative transform $\hat{z}_{ij}$ paired with its certainty $\Omega_{ij}$, turning global map alignment into minimizing total energy over the entire graph:

$$F = \sum_{(i,j) \in \mathcal{E}} e_{ij}^T \Omega_{ij} e_{ij}, \quad e_{ij} = z_{ij} - h(x_i, x_j)$$

In this cost function, $h(x_i, x_j)$ predicts the relative transform from the current pose estimates, $z_{ij}$ is the actual measured transform, and $\Omega_{ij} = \Sigma_{ij}^{-1}$ is the information matrix—the inverse of the measurement covariance.

Under this graph view, loop closures become remarkably clean. Whenever a robot revisits a known place and registers a new scan match, a single edge drops that constraint straight into the graph, and global optimization adjusts every pose along the loop together. Where an EKF had to touch a dense covariance matrix at $O(N^2)$ cost to close a loop, a pose graph expresses the loop constraint effortlessly in one edge—though it still has to re-solve the optimization to update its pose estimates.

> 🔗 **Borrowed.** The Lu-Milios formulation of pose graph optimization rests on the nonlinear least-squares algorithms of [Levenberg (1944)](https://www.ams.org/qam/1944-02-02/S0033-569X-1944-10666-0/) and [Marquardt (1963)](https://www.stat.cmu.edu/technometrics/70-79/VOL-14-03/v1403757.pdf). A numerical optimization technique developed decades earlier for nonlinear parameter estimation arrived at the backend of indoor laser mapping.

Lu and Milios solved a batch linear system over all poses simultaneously, whose cost grew with scan count. Their system was closer to a proof of concept than a deployed real-time navigator, yet it established a vital principle: optimization—not recursive filtering—offered the natural path to global consistency. Alongside it, Gutmann and Konolige pushed incrementality, Folkesson and Christensen tackled robust data association, and Thrun's group scaled the idea to real-world environments—each filling in another piece of the same shift.

---

## 6.2 Discovering Sparsity: The Information Matrix and the Pose-Graph Extension

In the five years following Lu and Milios's paper, multiple research groups converged on the same structural revelation: unlike the covariance matrix, the **information matrix** ($\Omega = \Sigma^{-1}$) is overwhelmingly **sparse**.

In EKF-SLAM, the covariance matrix $\Sigma$ is stubbornly dense. Observing a new landmark updates its statistical correlation with every landmark already stored; even after marginalizing out the robot pose, tracking $n$ 2D landmarks leaves a $2n \times 2n$ dense matrix costing $O(n^2)$ per update—the very ceiling that crippled real-time tracking around 100 landmarks.

A pose graph's information matrix behaves completely differently. An off-diagonal block $(i,j)$ of $\Omega$ is nonzero *only* when poses $x_i$ and $x_j$ share a direct measurement edge. Because a moving robot mostly observes nearby poses along its trajectory, distant poses have zero direct coupling. $\Omega$ therefore assumes a clean banded sparse structure mirroring the graph's topology—nearly tridiagonal for an open trajectory without loop closures.

Sebastian Thrun's group, through the [Sparse Extended Information Filter (SEIF)](http://www.cs.cmu.edu/~thrun/papers/thrun.tr-seif02.pdf), along with Edwin Olson, began exploiting that sparsity directly. Using sparse linear solvers pushed computation well below $O(n^2)$; while exact runtime depends on graph connectivity, $O(n \log n)$ scaling became achievable in realistic bounded environments.

> 🔗 **Borrowed.** Thrun's sparse information filter (SEIF) and [Eustice's exactly sparse delayed-state filter](https://web.mit.edu/2.166/www/handouts/eustice_et_al_ieeetro_2006.pdf) showed that information-matrix sparsity was usable even in filter form. This insight set the stage for Dellaert's factor graph formulation and the Bayes tree data structure.

At ICRA 2006, [Olson, Leonard, and Teller](https://april.eecs.umich.edu/pdfs/olson2006icra.pdf) added another practical boost by introducing a stochastic-gradient optimizer for pose graphs. Although it lacked formal convergence guarantees, it chewed through graphs of hundreds of nodes at interactive speeds, and Olson's open code spread rapidly across the robotics community.

---

## 6.3 Factor Graphs and Square Root SAM

Later that same year, Frank Dellaert and his doctoral student Michael Kaess published [Square Root SAM](https://doi.org/10.1177/0278364906072768) (2006), giving SLAM backends what would become their standard mathematical language. Drawing on his background in probabilistic graphical models at Georgia Tech, Dellaert reframed SLAM as Bayesian inference over a **factor graph**.

A factor graph is a bipartite graph linking two kinds of nodes: *variable nodes* represent unknown robot poses and landmark coordinates, while *factor nodes* encode sensor observations or prior constraints. Each factor $f_k(x_{i_1}, x_{i_2}, \ldots)$ captures a local probabilistic constraint over the variables it touches, so the full joint probability decomposes cleanly into a product of factors:

$$p(X) \propto \prod_k f_k(X_k)$$

Finding the maximum a posteriori (MAP) state $X^*$ maximizes this joint likelihood—which, when factors carry Gaussian noise models, reduces directly to nonlinear least squares.

That least-squares structure unlocked Dellaert's key algebraic insight. Running QR factorization on the measurement Jacobian $J$ produces an upper-triangular matrix $R$ satisfying $R^T R = J^T J = \Omega$, earning $R$ the name "square root information matrix." Crucially, how sparse $R$ stays depends not just on the graph's topology, but on the order in which variables are eliminated: smart column-reordering heuristics such as AMD and COLAMD minimize fill-in and keep $R$ compact and fast to back-substitute.

Square Root SAM offered far better numerical conditioning than an EKF covariance update, optimized poses and landmarks jointly in one consistent framework, and treated loop closures effortlessly as newly inserted factors. The interactive visualization below illustrates how sparsity and variable elimination shape that matrix structure:
