# Ch.15b — Where the Static-World Assumption Breaks: Dynamic and Deformable SLAM

GS-SLAM, SplaTAM, and MonoGS all retained the static-world assumption. A separate line of research had addressed moving and deforming environments from the outset.

In 2015, Javier Fuentes-Pacheco, Ruiz-Ascencio, and Rendón-Mancha published [*Visual simultaneous localization and mapping: a survey*](https://link.springer.com/article/10.1007/s10462-012-9365-8) in *Artificial Intelligence Review*. Its final section addressed "Dynamic and Deformable Environments." Earlier papers had studied moving objects, but most treated them as outliers for RANSAC to reject. The survey was an early account that treated dynamic environments as a distinct topic. Eleven years later, the April 21, 2026 manuscript of the *SLAM Handbook* devoted 37 pages to it. Its six authors were Lukas Schmid, José María Martínez Montiel, Shoudong Huang, Daniel Cremers, José Neira, and Javier Civera. Although static scenes had been SLAM's starting point, self-driving cars, domestic service robots, and endoscopes all had to operate in changing environments.

---

## 15b.1 Three axes

In Handbook Ch.15 §15.1, Schmid et al. revise the earlier definition of "dynamic SLAM." They define an environment as dynamic or static relative to *the observation*, not as an intrinsic property of the environment. The same physical motion may appear as a short-term change to one robot and a long-term change to another, depending on the ratio between observation rate $\text{Obs}$ and change rate $\text{Dyn}$. When $\text{Dyn} \ll \text{Obs}$, motion is visible between frames; when $\text{Dyn} \gg \text{Obs}$, the scene changes between visits.

This perspective defines three axes. The observation axis distinguishes short-term from long-term change. The reconstruction axis distinguishes pose-only estimation, joint scene geometry, and full 4D spatio-temporal understanding. The time axis separates online from offline methods. Earlier accounts often reduced the field to removing dynamic objects, but that task occupies only one region of this three-axis space. Researchers working in different regions of the taxonomy had used the same terminology for different problems.

---

## 15b.2 Short-term: from masking to multi-object SLAM

The earliest solution removed moving regions from the measurements.

Berta Bescos, then a doctoral student at Zaragoza, published [DynaSLAM](https://arxiv.org/abs/1806.05620) in RA-L in 2018. The system added Mask R-CNN to the ORB-SLAM2 frontend, masking people and cars before excluding those regions from keypoint extraction. On the TUM-RGBD walking sequence, this direct approach reduced ATE to single-digit centimeters.

During the same period, Martin Rünz at UCL tracked moving objects separately rather than removing them. Under Lourdes Agapito's supervision, he released [Co-Fusion (Rünz & Agapito, 2017)](https://arxiv.org/abs/1706.06629) and [MaskFusion (Rünz et al., 2018)](https://arxiv.org/abs/1804.09194) in consecutive years. Each object received its own surfel model, and the system jointly estimated camera and object trajectories. At ICRA 2018, Raluca Scona of Edinburgh and Stefan Leutenegger of Imperial presented another approach in [StaticFusion](https://arxiv.org/abs/1806.05628). It separated dynamic regions through residual clustering without semantic segmentation, avoiding errors from that component.

The next approach included moving objects in the estimated state. Jun Zhang at QUT led [VDO-SLAM (Zhang et al., 2020)](https://arxiv.org/abs/2005.11052), which represented each dynamic object as a variable in the factor graph. The camera pose $T_i^w \in SE(3)$ and the pose of object $k$, $T_{k,i}^w \in SE(3)$, appeared in the same graph. A constant-velocity factor enforced continuity in each object's linear and angular velocities, and joint optimization operated over the product manifold of the camera and object SE(3) states. In 2021, Bescos at Zaragoza implemented the same principle on ORB-SLAM2 in [DynaSLAM II (Bescos et al., 2021)](https://arxiv.org/abs/2010.07820). Yuheng Qiu at CMU extended it to articulated objects such as human bodies in [AirDOS](https://arxiv.org/abs/2109.09903), published in RA-L in 2022.

> 🔗 **Borrowed.** VDO-SLAM's factor-graph extension directly follows the iSAM tradition established by Dellaert and Kaess in the graph-SLAM work discussed in Ch.6. Dynamic SLAM represented a moving car by adding its state variables and measurement factors to the map.

A third approach used inertial information. Song, Lim, Lee, and Myung at KAIST URL published [DynaVINS](https://arxiv.org/abs/2208.11500) in RA-L in 2022 without semantic masks or multi-object tracking. During bundle adjustment, the method reduced the factor weights of observations that disagreed with the pose prior from IMU preintegration, limiting the influence of dynamic features on the joint state. The same group's [DynaVINS++](https://arxiv.org/abs/2410.15373), published in RA-L in 2024, reformulated the method as adaptive truncated least squares. It also addressed the failure mode in which dynamic features affected IMU-bias estimation and caused divergence.

The Handbook groups this work under §15.2.3, "Dense Dynamic SLAM," and presents Schmid's [Dynablox (Schmid et al., 2023)](https://arxiv.org/abs/2304.10049) as a current LiDAR MOS system. [AnyCam](https://arxiv.org/abs/2503.23282) (2025) uses a transformer backbone to recover 4D structure directly from ordinary video, extending the simultaneous tracking-and-reconstruction approach introduced by Rünz in 2017.

---

## 15b.3 Long-term: maps across time

Short-term dynamics describe motion between frames, whereas long-term dynamics describe changes between visits, such as a chair moved overnight. Research on this problem followed a different lineage.

Under Michaud's supervision at Sherbrooke, Mathieu Labbé developed [RTAB-Map](https://introlab.github.io/rtabmap/) beginning in 2013, drawing directly on models of human memory. It organized short-term, working, and long-term memory hierarchically and moved nodes according to time and observation frequency. A node remained in working memory during a session, moved to long-term memory if it was not revisited often, and was discarded if it no longer carried useful information. In a 2019 JFR paper, Labbé described how this structure scaled to multi-session SLAM. Hyungtae Lim, Sungwon Hwang, and Hyun Myung at KAIST URL introduced [ERASOR](https://arxiv.org/abs/2103.04316) in 2021 to remove traces of moving objects from accumulated LiDAR maps. It compared regional height ranges in the map and individual scans to identify candidate regions, then used region-wise ground-plane fitting to distinguish ground from dynamic-object points.

Handbook §15.3 repeatedly distinguishes **absence of evidence from evidence of absence**. A mapping system must determine whether an object has disappeared or was simply not observed. Without this distinction, map cleaning can erase valid objects and change detection can misclassify occluded regions. Schmid's [Panoptic Multi-TSDF](https://arxiv.org/abs/2109.10165), published in RA-L in 2022, addressed the problem with independent submaps for each object and a local-consistency rule for active and inactive states. The same group's [Khronos](https://arxiv.org/abs/2402.13817) (2024) further used graduated non-convexity for robust association. After loop closure, it performed deformable geometric change detection and estimated when each object changed, extending a metric-semantic map into a 4D spatio-temporal representation.

> 🔗 **Borrowed.** Panoptic Multi-TSDF combines volumetric submapping, which maintains multiple TSDF submaps, with object-centric mapping, which assigns separate models to objects.

LiDAR research addressed the same problem separately. Jang, Lee, Nahrendra, and Myung at KAIST URL released [Chamelion](https://arxiv.org/abs/2602.08189) in 2026. It combined scene-mixing augmentation with a dual-head network to perform change detection without ground truth in transient environments such as construction sites and frequently rearranged indoor spaces. Khronos built a 4D representation from RGB-D and panoptic inputs, whereas Chamelion addressed long-term maintenance of point-cloud maps.

Another line of work modeled recurring changes. Beginning in 2014, Tomáš Krajník and Achim Lilienthal at Örebro in Sweden developed **frequency maps**, representing periodic events such as commuter traffic and day-night lighting changes with a Fourier basis. In 2019, Martin Magnusson's group at the Stockholm Royal Institute of Technology consolidated this work as Maps of Dynamics (MoD), encoding *typical motion patterns* directly in the map. A statement such as "people usually walk to the left in this corridor" became part of the representation. [Changing-SLAM (Schmid et al., 2023)](https://arxiv.org/abs/2301.09479) combined a Kalman filter for short-term changes with semantic class matching for long-term changes in an ORB-SLAM extension.

---

## 15b.4 Deformable: when the shape itself changes

Deformable SLAM addresses scenes in which even the background changes shape, a problem studied extensively by Civera and Montiel in Zaragoza.

An earlier starting point was [DynamicFusion](https://grail.cs.washington.edu/projects/dynamicfusion/), the 2015 CVPR best paper by Newcombe, Fox, and Seitz at Microsoft Research. It placed an embedded deformation graph over KinectFusion's canonical TSDF to reconstruct non-rigid objects such as faces and torsos in real time. Each graph node carried a rotation and translation that the system optimized in every frame. In related work, Matthias Innmann at TU München added color information in [VolumeDeform](https://arxiv.org/abs/1603.08161) (2016). In 2017, Miroslava Slavcheva introduced [KillingFusion](https://campar.in.tum.de/pub/slavcheva2017cvpr/slavcheva2017cvpr.pdf), using Killing-vector-field regularization to permit topological changes such as a hand separating from the torso. Under Tedrake's supervision at MIT, Wei Gao's [SurfelWarp](https://arxiv.org/abs/1904.13073) (2019) used surfels instead of a TSDF to support exploration more readily.

> 🔗 **Borrowed.** DynamicFusion directly adapted the embedded deformation graph published by Sumner, Schmid, and Pauly in computer graphics in 2007. A sparse control graph for mesh deformation became the variable representation for real-time non-rigid SLAM.

Monocular deformable SLAM developed in Zaragoza. Juan Lamarca, who completed his doctorate under Montiel, published [DefSLAM](https://arxiv.org/abs/1908.08918) in RA-L in 2021. The system recomputed a template at each keyframe with isometric NRSfM and combined an ORB frontend with Lucas-Kanade optical flow to maintain tracks. It assumed planar topology. In 2023, Juan J. Gómez Rodríguez from the same group removed this limitation with [NR-SLAM](https://arxiv.org/abs/2308.04036), using a dynamic deformation graph for arbitrary topology and a visco-elastic model for temporal regularization. Handbook §15.4.2 groups this work as the "monocular line of deformable SLAM."

Many applications are medical. Song at Tsinghua released [MIS-SLAM](https://ieeexplore.ieee.org/document/8458232) in 2018 to track intraoperative organ deformation with stereo endoscopy. The Jayender group at Children's National developed EMDQ (Expectation Maximization + Dual Quaternion), which estimated a smooth deformation field over SURF features. Both systems targeted intraoperative navigation for minimally invasive surgery.

Handbook §15.4.1 highlights a fundamental problem: **Floating Map Ambiguity**. Without a prior, observations cannot distinguish the rigid motion of a non-rigid object from the camera's rigid motion. The image alone cannot determine whether a hand moved 30 cm or the camera moved 30 cm. This differs from the conventional scale ambiguity of monocular SLAM because scale, trajectory, and deformation become coupled in one ill-posed problem. DefSLAM and NR-SLAM partially constrain the ambiguity with isometric and visco-elastic priors, but no principled solution existed as of 2026.

> 📜 **Prediction vs. outcome.** In §7, Future Work, of DynamicFusion (2015), Newcombe identified extension to larger scenes and topological changes, along with integration with loop closure, as the next challenges. KillingFusion addressed topological change in 2017, and the surfel-based SurfelWarp (2019) partially addressed larger scenes. Khronos combined a deformation graph, loop closures, and change detection in a long-term scene-mapping system in 2024. Khronos mapped scenes whose objects and arrangements changed over time.

---

## 15b.5 One way to read the connections

These works do not divide cleanly into three fixed schools. The papers, collaborations, and movement of researchers nevertheless reveal three overlapping lines. **The Zaragoza line** (Montiel, Neira, Civera, Lamarca, Rodríguez) pushed monocular geometry from MonoSLAM (Ch.5) and ORB-SLAM (Ch.7) into DynaSLAM, DefSLAM, and NR-SLAM. **The dense dynamic-reconstruction line** ran from KinectFusion to DynamicFusion and from SLAM++ to Co-Fusion and MaskFusion, linking work by Davison, Newcombe, Agapito, Rünz, and Cremers across several institutions. **Schmid's path** from the Cremers group at TUM through the Carlone group at MIT to JPL connects Dynablox, Panoptic Multi-TSDF, and Khronos. This is the chapter's interpretation of the lineage, not a taxonomy explicitly declared by the Handbook.

---

## 🧭 Still open

**Absence vs. evidence of absence.** Determining whether an object has disappeared from the map or was merely occluded remains a foundational problem in long-term SLAM. Schmid's Panoptic Multi-TSDF provided a partial answer through active submaps. The Handbook treats occlusion above 70% as an extreme-environment case that remains difficult; it does not report this as a universal error threshold for Panoptic Multi-TSDF. As of 2026, no paper had claimed a principled solution.

**Floating Map Ambiguity.** Deformable SLAM still relies on isometric and visco-elastic priors to separate the camera's rigid motion from an object's rigid motion. The conditions under which observations alone can identify both motions remain unknown. Lamarca's [2023 IJRR paper](https://arxiv.org/abs/2302.03710) described some observation conditions, but no general theory exists.

**Online deformable SLAM.** DefSLAM and NR-SLAM approach real-time operation, but no system performs Khronos-level change-aware integration online from monocular RGB input. Its optimization cost exceeds real-time limits. GPU acceleration and learned priors may help, but no validated pipeline has yet appeared.

**The real-world gap in medical MIS.** MIS-SLAM and NR-SLAM operate on phantoms and ex vivo data, but robustness declines in surgical environments containing blood, smoke, tool occlusions, and abrupt lighting changes. Gaussian-based methods such as EndoGS (2024) are emerging, but no system has been reported at deployment level.

---

The question running through this chapter is how to represent a world that changes. GS-SLAM and NeRF-SLAM improved the speed or compactness of scene representations while retaining a static-world assumption. Ch.16 follows DUSt3R and its successors along another route: learning the geometric prior rather than refining the representation pipeline alone.


---

# Ch.16 — Foundation 3D: From DUSt3R to VGGT

Philippe Weinzaepfel and Jerome Revaud of Naver Labs Europe released CroCo in 2022, proposing a cross-view self-supervised pretraining scheme that learned visual representations from two images of the same scene. The paper concerned feature learning. A year later, the same team used CroCo's architecture in DUSt3R to output pointmaps directly without calibration, turning the model into a reconstruction system. The work later reached the VGG group at Oxford, and by 2026 it had changed how SfM pipelines divided matching, calibration, and reconstruction.

---

## 16.1 DUSt3R — learned pointmap

For roughly ten years after 2013, 3D reconstruction followed the same procedure: find feature points, match them, estimate intrinsic and extrinsic camera parameters, build a point cloud through triangulation, and refine it with bundle adjustment. [COLMAP (Schönberger & Frahm, 2016)](https://openaccess.thecvf.com/content_cvpr_2016/html/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.html) was the most complete form of this pipeline. Errors dropped, but the structure of the procedure did not change.

[Shuzhe Wang et al. 2023. DUSt3R: Geometric 3D Vision Made Easy](https://arxiv.org/abs/2312.14132) bypasses this procedure. It takes two images as input and outputs 3D coordinates for each pixel directly. It does not require intrinsic parameters such as focal length or principal point. The output, called a pointmap, gives coordinates in a common 3D space rather than in image coordinates, without prior knowledge of the camera lens.

DUSt3R's transformer uses the encoder-decoder structure inherited from CroCo. Each image is encoded independently, then the decoder reads the other image's encoder output through cross-attention. Self-attention handles relations among pixels within one image; cross-attention learns correspondences between images implicitly from large-scale data instead of applying a coded matching rule. The paper assembled 8.5 million pairs from Habitat, MegaDepth, ARKitScenes, Static Scenes 3D, BlendedMVS, ScanNet++, CO3D-v2, and Waymo. Their annotations came from three sources: synthetic generation, reconstructions by SfM software, and dedicated sensors. Classical SfM therefore supplied part, not all, of the supervision for its learned successor.

> 🔗 **Borrowed.** DUSt3R's backbone comes from ViT ([Dosovitskiy et al. 2020](https://arxiv.org/abs/2010.11929)), and its direct precursor is CroCo ([Weinzaepfel et al. 2022](https://arxiv.org/abs/2210.10716), also from Naver Labs Europe). CroCo proposed cross-view self-supervised pretraining in which information from one image reconstructs masked regions in the other. DUSt3R retained CroCo's encoder-decoder structure and changed the task to pointmap prediction.

Both pointmaps already use the first camera's coordinate frame. Relative camera pose can be recovered with PnP-RANSAC from predicted 3D points and their pixel correspondences in the second image. For multiple image pairs, a separate global alignment adjusts the pointmaps and cameras. Pose estimation is derived from the pointmaps.

When extending to three or ten images, DUSt3R solves a global alignment. It is an optimization problem that registers the pointmaps of all image pairs into one common coordinate frame. Only at this stage does something resembling bundle adjustment appear, but it proceeds without feature matching or camera models.

---

## 16.2 Making matching explicit: MASt3R

DUSt3R's output is closer to reconstruction than to novel view synthesis. Yet it handles an important reconstruction subtask, finding precise pixel correspondences between two images, only implicitly. Replacing the explicit matching performed by SuperPoint+SuperGlue or LightGlue needed additional machinery.

[Vincent Leroy et al. 2024. Grounding Image Matching in 3D with MASt3R (ECCV)](https://arxiv.org/abs/2406.09756) adds a matching head to DUSt3R. It is trained to output a feature descriptor for each pixel along with the pointmap, with joint learning that keeps the 3D position and the feature consistent. The resulting features are anchored in 3D space rather than in the image plane. Matching simplifies into nearest-neighbor search over these feature descriptors.

> 🔗 **Borrowed.** MASt3R addresses the ambiguity in 2D descriptors that SuperGlue ([Sarlin et al. 2020](https://arxiv.org/abs/1911.11763)) handled with contextual reasoning. SuperGlue used a graph neural network to reduce ambiguity in 2D matching; MASt3R instead learns 3D structure directly.

Within months of MASt3R's release, multiple groups in the SLAM community reported experiments that replaced the SuperPoint+SuperGlue combination with MASt3R. In late 2024, [Riku Murai, Eric Dexheimer, Andrew Davison](https://arxiv.org/abs/2412.12392) at Imperial College London released MASt3R-SLAM, using MASt3R's matching as the frontend and graph-based global optimization as the backend. The system retained the classical SLAM architecture while replacing most of its internal components.

MASt3R's strength is that dense matching is possible without ground-truth calibration. As of 2026, researchers are testing DUSt3R or MASt3R in the initialization and matching stages of COLMAP-based SfM pipelines.

> 📜 **Prediction vs. outcome.** The DUSt3R paper itself did not include a dedicated "Future Work" section, but the structure of pairwise processing plus global alignment implies sequence processing and real-time operation as the next tasks. Spann3R arrived in August 2024 and MASt3R-SLAM at the end of 2024. The two follow-up works addressed sequential extension and SLAM integration within 6–12 months.

---

## 16.3 Spann3R — sequential processing

Batch processing has a practical constraint: in SLAM, the images are not all available in advance.

DUSt3R and MASt3R take a complete image set as input and register it in a batch. SLAM receives images in temporal order and must update the map at each frame.

[Hengyi Wang & Lourdes Agapito 2024. 3D Reconstruction with Spatial Memory (Spann3R)](https://arxiv.org/abs/2408.16061) reshapes DUSt3R's structure for sequential processing. It stores information from processed frames in a spatial-memory bank and applies cross-attention to that memory when a new frame arrives. Attention selects the past-frame information associated with each pixel of the new image.

> 🔗 **Borrowed.** Spann3R's spatial memory resembles other cross-attention memory mechanisms. It retains DUSt3R's pretrained ViT encoder-decoder and constructs memory keys from decoder outputs (geometric features) and image features, so lookup reflects both appearance and distance. DUSt3R's geometric representation becomes the index for sequential memory.

Spann3R retains DUSt3R's ability to work without a calibrated camera and updates the map incrementally as each image arrives. It is not fully real-time, but it moves the method from batch reconstruction toward SLAM.

---

## 16.4 VGGT — multi-view joint inference

Spann3R enabled sequential processing but retained DUSt3R's pairwise pointmaps and global alignment. At the start of 2025, Jianyuan Wang, Minghao Chen, Nikita Karaev, Andrea Vedaldi, Christian Rupprecht, and David Novotny at Oxford's VGG group took an arbitrary number of images as simultaneous input and produced camera pose, depth, and a point cloud in one forward pass.

[Jianyuan Wang et al. 2025. VGGT: Visual Geometry Grounded Transformer](https://arxiv.org/abs/2503.11651) turned DUSt3R's pairwise processing into multi-view joint inference. Exhaustively pairing N images for DUSt3R produces N(N-1)/2 pointmap pairs followed by global alignment. VGGT passes all N images through the transformer at once, and attention processes the relations among every image pair simultaneously.

> 🔗 **Borrowed.** There is an inversion in the fact that SfM reconstructions supplied part of DUSt3R's training supervision. VGGT then performs, within one model, functions that classical SfM separated into pairwise geometry estimation, graph construction, and global optimization. The stages of the classical pipeline have been absorbed in a different form.

In quantitative comparisons with DUSt3R, VGGT showed consistently better camera-pose accuracy and point-cloud quality. Processing was also faster because it required no global-alignment optimization. The change made the boundary between pose estimation and reconstruction less distinct.

---

## 16.5 Pose estimation and reconstruction converge

Traditional computer vision distinguished the two problems. Map-based localization finds the current position in an already-known map, and 3D reconstruction recovers the geometry of an unknown environment. SLAM was hard because it solved both at the same time.

Systems from DUSt3R to VGGT use shared learned representations for geometry and camera estimation. DUSt3R recovers pose from pointmaps through separate operations and joins multiple views with global alignment. VGGT outputs cameras and geometry in one forward pass. Their common direction does not imply identical postprocessing requirements.

DUSt3R, MASt3R, and VGGT have not discarded multi-view geometry. Their transformer weights encode principles implemented explicitly by the epipolar constraint, triangulation, and bundle adjustment. The change lies in how those principles are implemented: implicitly in model weights rather than as separate algorithms.

This implementation is harder to debug than Schönberger's COLMAP code. The causes of a DUSt3R failure are buried inside attention weights, returning interpretability to the list of unresolved problems.

> 📜 **Prediction vs. outcome.** The MASt3R paper closed briefly, suggesting that matching without ground-truth calibration was open to several downstream tasks. It was not an explicit prediction of pipeline reshaping. As of 2026 several photogrammetry software packages are evaluating DUSt3R/MASt3R as an initialization stage, and the pattern looks more like hybrid insertion than full replacement.

Within two years, one team at Naver Labs Europe released CroCo (2022), DUSt3R (2023), and MASt3R (2024), covering the path from pretraining method to matching system. The group centered on Weinzaepfel, Revaud, and Leroy was small compared with Google Brain, DeepMind, or Meta AI. Davison's group at Imperial College London then carried the work into SLAM with MASt3R-SLAM.

---

## 16.6 Another branch — semantic foundation enters the map

DUSt3R, MASt3R, and VGGT form the geometric branch of foundation 3D: they deal with pointmaps, camera poses, and geometric structure. Around 2022, the phrase also came to include a semantic branch that brought CLIP, DINO, and SAM into the map. The geometric branch reduced dependence on calibration; the semantic branch reduced dependence on a fixed label dictionary.

The semantic branch began in Luca Carlone's group at MIT. [Nathan Hughes et al. 2022. Hydra: A Real-time Spatial Perception System for 3D Scene Graph Construction and Optimization](https://arxiv.org/abs/2201.13360) placed an online hierarchy of objects → places → rooms → buildings on top of Kimera's (Rosinol 2020) metric-semantic mesh. Its closed-set classifier remained limited to a predefined dictionary of roughly 100–1000 labels, but it showed that a hierarchical map could run in real time.

Foundation models removed the fixed-dictionary constraint. [Songyou Peng et al. 2023. OpenScene: 3D Scene Understanding with Open Vocabularies (CVPR)](https://arxiv.org/abs/2211.15654) came from the ETH/Pollefeys group, followed by [Qiao Gu et al. 2024. ConceptGraphs: Open-Vocabulary 3D Scene Graphs for Perception and Planning (ICRA)](https://arxiv.org/abs/2309.16650) from a Montréal-MIT collaboration. OpenScene distilled CLIP features onto 3D point clouds, allowing natural-language queries such as "how close is this point to a chair." In ConceptGraphs, a VLM generated language descriptions as node attributes and an LLM described relations between objects. These methods connected concepts outside a predefined class dictionary to 3D representations. ConceptGraphs is distinct from methods that directly extend Hydra's hierarchy.

[Dominic Maggio et al. 2024. Clio: Real-time Task-Driven Open-Set 3D Scene Graphs](https://arxiv.org/abs/2404.13696) turned this lineage toward tasks. Clio treats a natural-language task as an information bottleneck and retains only the level of abstraction that task needs in the scene graph. For an instruction such as "clean near the coffee machine," it preserves the coffee machine and surrounding objects while grouping unrelated details. The exposed layer of the hierarchy varies by task.

> 🔗 **Borrowed.** Clio is a direct successor to Hydra in the Carlone group, adding task-driven abstraction. ConceptGraphs is a separate open-vocabulary object-graph approach and should not be described as inheriting Hydra's objects-places-rooms hierarchy.

Ch.18 §18.4 traces the contraction of the object-as-landmark lineage in 2017–2019. Semantic SLAM later returned in hierarchical scene graphs, but that semantic branch and the geometric DUSt3R branch had not yet converged as of 2026. No reported end-to-end system attached CLIP features to VGGT's pointmap or combined Clio's scene graph with DUSt3R's calibration-free geometry. Their possible point of contact remains an open problem.

---

## 16.7 What classical SLAM still supplies

MASt3R-SLAM borrows the architecture of classical SLAM. Keyframe selection, loop closure, and map management remain necessary on top of the new representation. The DUSt3R family replaced the internal machinery of feature matching and reconstruction but retained these system-level decisions in their classical form.

The same pattern appears in the other recent lineages. NeRF-SLAM adopted NeRF as a map representation yet kept keyframe-based tracking. 3DGS-SLAM adopted Gaussians but performed loop closure in the classical way (Ch.15). Dynamic SLAM in Ch.15b changed the frontend for mask removal while retaining the backend. The representation changed more often than the system structure.

Foundation 3D followed this pattern as well. In 2025, Dominic Maggio, Hyungtae Lim, and Luca Carlone at MIT released [VGGT-SLAM](https://arxiv.org/abs/2505.12549). VGGT reconstructs local submaps; the system then optimizes 15-degree-of-freedom projective transforms between sequential submaps on \(\mathrm{SL}(4)\), including loop-closure constraints. The transformer supplies local geometry, but global graph optimization remains. Revaud wrote in Handbook Ch.13 that "a form of factor graph is still necessary." Real-time large-scale sequences and integration with the semantic branch in §16.6 remained unresolved in 2026–2027.

---

## 🧭 Still open

**Large-scale sequence processing.** The transformers in DUSt3R and VGGT require memory that scales quadratically with the number of images. Up to 100 images is realistic, but 1,000 or 10,000 is another matter. Spann3R's incremental approach is a partial answer, but smooth handling of large outdoor environments is unresolved. Sparse-attention and hierarchical-global-alignment approaches have not yet produced a consensus method.

**Loop closure for pointmaps.** In classical SLAM, loop closure recognizes a previously visited place and corrects accumulated error. The DUSt3R family must represent that place and propagate the correction through a pointmap-based map. MASt3R-SLAM uses the existing approach, but whether it is the best or a principled solution is unknown.

**Metric-scale generalization.** DUSt3R's pointmaps have relative scale. The depth ratio between two images is recovered, but absolute scale is unknown. As with Metric3D or Depth Anything v2, metric scale remains a problem for foundation 3D. The physical constraint of determining absolute scale without GPS or an IMU remains regardless of data scale.

**SLAM lineage or separate branch?** MASt3R-SLAM and VGGT-SLAM brought foundation 3D into SLAM systems in 2024–2025. Real-time operation on large sequences and integration with the semantic branch in §16.6 (Hydra → Clio and the separate ConceptGraphs branch) remain unclear. No common architecture yet combines geometric and semantic foundation models in one system.

---

NeRF and foundation models changed the internal machinery of reconstruction and localization, while keyframes, loop closure, and map management remained above the new representations. LiDAR-based SLAM developed in parallel over the same period. Its sensors and research culture differed, but it faced many of the same engineering problems with a rotating laser rather than a lens.


---

# Ch.17 — The LiDAR Parallel Universe: From LOAM to FAST-LIO

The lineage from Ch.1 photogrammetry through Ch.16 Foundation 3D shares one premise: the sensor is a camera. MonoSLAM, PTAM, ORB-SLAM, DSO, and DUSt3R all read the world through pixels. Over the same period, LiDAR SLAM developed separately around ICP and point-cloud registration rather than keypoints, photometric consistency, or feature descriptors. The two communities rarely cited each other, and they used different benchmarks and conferences.

LOAM combined three earlier elements: point-to-plane matching from Besl & McKay's 1992 ICP, the network-of-poses formulation from Lu & Milios's 1997 work on globally consistent scan alignment, and the demand for real-time outdoor operation after the 2007 DARPA Urban Challenge. Ji Zhang's 2014 contribution was to split high-frequency odometry from low-frequency mapping on a spinning Velodyne. That division became a standard LiDAR-system architecture.

When Ji Zhang presented LOAM at RSS 2014, it drew little attention from the Visual SLAM community, which was occupied with ElasticFusion and LSD-SLAM. LOAM shared no code with camera-based methods, and the researcher populations barely overlapped. Both lineages belonged to robotics but developed apart for roughly a decade. LOAM built on [ICP (Besl·McKay, 1992)](https://graphics.stanford.edu/courses/cs164-09-spring/Handouts/paper_icp.pdf), while the factor graph already standard in Graph SLAM crossed into LiDAR systems only later.

---

## 17.1 LOAM: edges and planes, and the capture of KITTI

In 2014, Google's Waymo predecessor program was already driving on roads, and the influence of the DARPA Urban Challenge remained strong. A Velodyne HDL-64E cost $75,000 per unit. LiDAR research was therefore concentrated in large, well-funded groups able to afford the hardware. CMU Robotics Institute's Autonomous Mobile Robot Lab, led by Professor Sanjiv Singh, was one of them.

Attempts to build maps with LiDAR existed before LOAM. [Lu & Milios 1997. "Globally Consistent Range Scan Alignment for Environment Mapping" (Autonomous Robots)](https://doi.org/10.1023/A:1008854305733) placed 2D range scans as nodes, tied them together with relative scan-to-scan constraints as edges, and jointly optimized the full trajectory. This "network of poses" idea became an origin point of pose-graph SLAM (see Ch.6). Alongside Besl and McKay's ICP, [Biber and Straßer 2003. "The Normal Distributions Transform" (IROS)](https://doi.org/10.1109/IROS.2003.1249285) proposed NDT, a distribution-based method that aligns per-cell Gaussian distributions; Magnusson later extended it to 3D. These methods were either 2D or offline 3D. LOAM brought real-time 3D operation.

Ji Zhang, under Singh's supervision, released [Zhang & Singh 2014. "LOAM: Lidar Odometry and Mapping in Real-time" (RSS)](https://www.roboticsproceedings.org/rss10/p07.pdf). He classified LiDAR points into two kinds of features. An **edge point** is a point with high smoothness $c$ (high curvature); a **planar point** is one with low $c$ (low curvature). Rather than registering the whole point set like ICP, LOAM matches only these two feature sets. Edge points are constrained point-to-line against edge lines in the neighboring scan, and planar points are constrained point-to-plane against local planes. This selection lowers computational cost enough for real-time operation.

The algorithm is split into two stages. Lidar Odometry estimates the 6-DoF transform between scans at 10 Hz. Lidar Mapping, at a lower frequency (1 Hz), registers against the full map to correct the error. Separating high-frequency odometry from low-frequency mapping suppresses drift while retaining real-time performance. Later LiDAR SLAM systems widely adopted this two-tier structure.

LOAM entered the leading group in public KITTI comparisons after its release. The widely reported relative translation error is 0.78% on sequence 00 and 0.84% averaged over the listed sequences. These figures show its competitiveness, but they do not establish a universal advantage over visual odometry under different sensor and evaluation conditions.

> 🔗 **Borrowed.** LOAM's feature-based point registration starts from Besl·McKay's (1992) ICP. The difference is that it selectively matches only edge and planar features rather than all points. Selective reuse of classical registration bought both speed and precision.

---

## 17.2 LeGO-LOAM: cut the ground first

LOAM did not treat the ground plane explicitly. In outdoor driving environments, a significant share of the point cloud is road surface. Grouping it with other edge and planar features produces matching noise.

At Stevens Institute of Technology's Robust Field Autonomy Lab, Tixiao Shan and his advisor Brendan Englot separated ground segmentation as the first stage in [Shan & Englot 2018. LeGO-LOAM](https://doi.org/10.1109/IROS.2018.8594299). The point cloud is projected onto a range image, the ground points are separated first, and the non-ground points are then re-clustered. Ground is used for roll and pitch estimation, and clusters are used for yaw and translation. This is a two-stage optimization.

The result required less computation than LOAM. Where the original LOAM struggled to run in real time on a Velodyne VLP-16, LeGO-LOAM runs on the same sensor even on embedded NVIDIA Jetson platforms. The reduction came with a cost: segmentation can fail and odometry can degrade in sparse scans or environments with irregular ground, including occluded sections, rough off-road terrain, and building interiors.

Beyond its lower computational cost, LeGO-LOAM established a design pattern: preprocess the sensor input into structured components before running odometry. FAST-LIO and LIO-SAM later used related modular preprocessing.

Around the same time as LeGO-LOAM, Jens Behley and Cyrill Stachniss at the University of Bonn brought **surfels** (surface elements) to outdoor LiDAR instead of using edge and plane features. Their **SuMa**, described in [Behley & Stachniss 2018. "Efficient Surfel-Based SLAM using 3D Laser Range Data in Urban Environments" (RSS)](http://www.roboticsproceedings.org/rss14/p16.pdf), summarized each point's neighborhood as a disk-shaped surfel and performed scan-to-model registration. The follow-up [Chen et al. 2019. "SuMa++" (IROS)](https://doi.org/10.1109/IROS40897.2019.8967704) used semantic segmentation to filter moving objects at the surfel level. The surfel representation used by ElasticFusion in the indoor RGB-D lineage (Ch.9) had crossed into outdoor Velodyne systems. By 2018, feature selection (LOAM), segmentation-first processing (LeGO-LOAM), and surfel accumulation (SuMa) were competing approaches.

---

## 17.3 FAST-LIO — tightly coupled LiDAR-IMU

LiDAR scan frequency sits at 10–20 Hz. Fast motion between scans produces motion distortion in the point cloud. The sensor position at the end of a scan differs from its position at the start, which degrades the LOAM family on high-speed platforms.

An IMU runs at 100–400 Hz and can fill the gaps between LiDAR scans. Performance depends on how the two sensors are combined. A loosely coupled system estimates each independently and fuses the results; a tightly coupled system handles both inside one state estimator. The latter can use their cross-correlation but is harder to implement.

At Hong Kong University (HKU)'s MaRS Lab, Wei Xu and his advisor Fu Zhang presented [**FAST-LIO**](https://arxiv.org/abs/2010.08196) in RA-L 2021. Their drone-control work supplied a concrete field requirement: LiDAR odometry had to withstand heavy rotor vibration and fast UAV maneuvers. They used an **iterated Extended Kalman Filter (iEKF)**, which repeatedly re-linearizes at the current estimate during the measurement update. This can reduce measurement-model linearization error relative to a basic EKF that linearizes once, but the improvement depends on the initial estimate and the motion and observation conditions.

The following year they published **FAST-LIO2** ([Xu et al. 2022](https://doi.org/10.1109/TRO.2022.3141876)) in TRO, adding the ikd-Tree. Conventional kd-Trees carry heavy reconstruction cost every time a point is added. The ikd-Tree is an incremental variant that performs only partial reconstruction. Real-time nearest-neighbor search stays feasible even with millions of map points. Experiments showed consistent performance on UAVs, handheld rigs, and autonomous cars. Drift stayed low even in drone environments.

The next FAST-LIO system addressed motion distortion at the point level. [He et al. 2023. "Point-LIO: Robust High-Bandwidth Light Detection and Ranging Inertial Odometry" (Advanced Intelligent Systems)](https://doi.org/10.1002/aisy.202200459), also from the MaRS Lab, updates the state whenever a LiDAR point arrives instead of collecting a full scan before updating. Each point is fused at its own timestamp rather than correcting intra-scan distortion with a constant-velocity model or IMU interpolation. The authors reported lower drift than FAST-LIO2 on high-agility platforms.

> 🔗 **Borrowed.** FAST-LIO brings to LiDAR a tightly coupled IMU framework developed in Visual-Inertial SLAM. [Forster et al. 2016. "On-Manifold Preintegration" (TRO)](https://doi.org/10.1109/TRO.2016.2597321) established the preintegration formulation, while FAST-LIO implemented tightly coupled inertial estimation in iEKF form.

---

## 17.4 LIO-SAM: the factor graph crosses over to LiDAR

Factor graphs were already standard in Visual SLAM. [GTSAM (Dellaert·Kaess, 2012)](https://gtsam.org/) had become a common backend for Visual-Inertial systems, while LiDAR systems still relied mainly on EKF variants or scan matching. LiDAR pipelines therefore made less use of graph optimization's ability to correct the full trajectory after loop closure.

Tixiao Shan, after LeGO-LOAM, released [Shan et al. 2020. LIO-SAM](https://doi.org/10.1109/IROS45743.2020.9341176), which explicitly adopted GTSAM's factor graph as the backend of a LiDAR-IMU system. The [public implementation](https://github.com/TixiaoShan/LIO-SAM) maintains two graphs. The long-term mapping graph accumulates LiDAR odometry, GPS, and loop-closure constraints between keyframes. A separate IMU-preintegration graph estimates state and bias from inertial measurements and LiDAR odometry and is reset periodically to bound computation.

> 🔗 **Borrowed.** LIO-SAM imports directly into a LiDAR system the GTSAM factor graph backend that Dellaert (from 2006 onward) had standardized on the Visual SLAM side.

LIO-SAM handles accumulated drift better than FAST-LIO2 because it includes loop closure, but its computational cost is higher. Without GPS or another sensor, the factor graph offers less advantage. The two systems serve different design goals: FAST-LIO2 prioritizes speed and precision in a real-time single-sensor configuration, while LIO-SAM prioritizes consistency in multi-sensor long-term mapping.

For nearly ten years after LOAM, LiDAR odometry added feature selection, surfels, and neural descriptors. In 2023, [Vizzo et al. 2023. "KISS-ICP: In Defense of Point-to-Point ICP" (RA-L)](https://doi.org/10.1109/LRA.2023.3236571) at Bonn took the opposite direction. An adaptive threshold and a point-to-point ICP, with no feature extraction or learned descriptors and little tuning, produced competitive odometry on KITTI. The name stood for Keep It Small and Simple. The result showed that classical registration remained competitive when motion compensation, sampling, and robust correspondence handling were combined effectively. It does not establish why LOAM arose historically.

---

## 17.5 Falling sensor prices and wider use: 2007–2024

Sensor price shaped LiDAR SLAM alongside its technical papers.

At the 2007 DARPA Urban Challenge, the Velodyne HDL-64E used by leading teams cost $75,000 per unit, putting it beyond most groups outside autonomous-driving and defense research. In 2012 the HDL-32E was still around $30,000. By 2014, when LOAM appeared, the VLP-16 had dropped to $7,999, still a significant share of a research budget.

The LiDAR market spread across a much wider range of prices over the following decade. In 2019, Livox (part of DJI) [announced a US retail price of $599 for the Mid-40](https://www.livoxtech.com/news/1). Ouster's 128-channel OS1-128 cost $18,000 that year; in 2020, Ouster [announced a $600 target price for the solid-state ES2 in 2024 series-production programs](https://investors.ouster.com/news-releases/news-release-details/ouster-announces-first-high-performance-true-solid-state-digital). Products and production targets in the hundreds of dollars marked a real shift, but they do not establish a uniform 100-fold decline across LiDAR: channel count, field of view, range, and retail-versus-volume pricing differ.

Wider availability did not eliminate algorithmic constraints. Solid-state LiDARs generally have a more limited field of view (FoV) than spinning sensors, and some use non-repetitive scan patterns. The original LOAM, designed around a 360° rotating scan, does not transfer unchanged. FAST-LIO and FAST-LIO2, by contrast, were designed to handle both mechanical and solid-state LiDARs and reported operation with small FoV and irregular sampling. Lower prices therefore changed the algorithmic questions rather than removing them.

---

## 17.6 Why the Visual and LiDAR lineages split

Visual SLAM and LiDAR SLAM developed in the same period, yet the two communities exchanged little for years. Several differences reinforced the split.

The sensors produced different measurements. Cameras capture texture and color; LiDAR measures range and geometry. Camera-based methods developed around keypoints, descriptors, and photometric consistency, while LiDAR methods used edges, planes, and range images. Their problem formulations differed accordingly.

The conferences differed as well. Camera-based methods appeared mainly at CVPR and ICCV, while LiDAR SLAM appeared mostly at ICRA, IROS, and RSS. The researcher populations overlapped little. During the early-to-mid 2010s, as Velodyne supplied Google and the autonomous-driving industry, LiDAR SLAM concentrated in self-driving robotics groups.

Place recognition methods diverged too. Cameras use visual appearance, as in DBoW2 and NetVLAD. LiDAR uses the structural features of a 3D point cloud, as in [Scan Context (Kim·Kim, 2018)](https://gisbi-kim.github.io/publications/gkim-2018-iros.pdf) or [PointNetVLAD](https://arxiv.org/abs/1804.03492). Even for the same location, the signal being recognized is different.

The first signs of convergence appeared in the early 2020s, when LiDAR-camera fusion papers began reaching CVPR. Tixiao Shan's [LVI-SAM (2021)](https://arxiv.org/abs/2104.10831) added a visual-inertial subsystem to LIO-SAM. The authors presented a tightly coupled factor graph, but the LIS and VIS subsystems operate largely independently and support each other during failures. A fully unified state estimate remained open.

---

## 17.7 Visual-LiDAR convergence attempts: 2024–2025

From 2024, more work attempted to handle camera and LiDAR data in one representation as foundation models became less tied to a single sensor. Two approaches emerged.

One approach uses multimodal pretrained features to align LiDAR and camera data in the same embedding space. It adapts the contrastive-learning principle of [CLIP (Radford et al., 2021)](https://arxiv.org/abs/2103.00020) from image-text alignment to LiDAR-image pairs. In 2023–2024, this work remained experimental.

The other approach converts sensor outputs into shared geometric primitives or neural fields and processes them in one backend. This work also remained at the research-paper stage, with few demonstrations of real-time operation.

Neither approach had produced a common system lineage by 2026. FAST-LIO2 and ORB-SLAM3 were still used independently.

---

## 17.8 Radar is outside this book's scope

Radar SLAM developed as another independent subfield, divided between spinning radar such as the Navtech CIR family and SoC-based 4D mmWave radar. Direct Doppler radial-velocity measurements enable correspondence-free odometry, while radio-specific noise models address speckle, multipath, and receiver saturation. The lineage runs from Oxford's radar localisation in [Cen & Newman 2018](https://doi.org/10.1109/ICRA.2018.8460687), through Adolfsson and Magnusson's **CFEAR** and its successor **TBV-SLAM**, to Burnett and Barfoot's continuous-time ICP. Oxford Radar RobotCar, Boreas, and MulRan supply dedicated benchmarks. Radar's operation in bad weather and smoke offers a clear practical advantage, but it has little historical overlap with the photogrammetry → SfM → Visual SLAM → learning → 3D foundation lineage. Its separate history falls outside this book; Handbook of SLAM (2026) Ch.9 provides a technical account.

---

## 📜 Prediction vs. outcome

> Zhang and Singh named two items as explicit future work in the conclusion of the 2014 LOAM paper: loop closure to correct drift and fusion with IMU output through a Kalman filter. Both appeared within the next ten years. FAST-LIO (2021) and FAST-LIO2 (2022) integrated the IMU with a tightly coupled iEKF, while LIO-SAM (2020) added loop closure through a factor-graph backend. One field problem absent from the paper's conclusion remained: dynamic-object handling. As of 2026, real-time separation of moving pedestrians and vehicles from LiDAR points often used deep-learning segmentation. Geometric methods within SLAM also existed, but no general solution covered the range of dynamic environments.

---

## 🧭 Still open

**Full Visual+LiDAR fusion.** Even after LVI-SAM, no tightly coupled design that handles both sensors inside one state estimator has become a broadly accepted common architecture. Autonomous-driving systems need LiDAR to compensate when a camera weakens in fog or rain, but algorithm design and sensor calibration remain barriers. Transformer-based fusion in 2024–2025 remained at the research-prototype stage.

**Algorithms optimized for solid-state LiDAR.** The original LOAM assumed the scan-line structure of a 360° spinning LiDAR. Non-repetitive scans in some Livox products and the limited FoV of solid-state sensors change observability and motion distortion. FAST-LIO2's direct point-to-map formulation and Livox LOAM already address parts of this setting, but no single configuration covers the differing fields of view and scan patterns across sensor families.

**Dynamic object handling.** The static-world assumption remained in LiDAR SLAM from Zhang's 2014 work through 2026. Systems commonly hand real-time separation of moving objects to segmentation networks. Geometric approaches inside SLAM still face computational and stability costs. Production pipelines are mostly proprietary, while public research has not converged on one generally accepted solution.

---

The LiDAR and visual lineages matured with separate technical vocabularies, and their integration remained incomplete. Other approaches developed beside both of them, including biologically inspired, event-based, and semantic SLAM, without becoming the main line of either community.

# Ch.18 — Failed Cases and Lost Lineages

While the camera and LiDAR communities developed their own methods, other robotics researchers followed different directions. Some of these lines began with RatSLAM in 2004, well before LOAM; others ran through the 2010s. They did not become mainstream, but they remained part of SLAM's history.

These approaches had identifiable sources. Milford and Wyeth's RatSLAM (2004) drew on O'Keefe and Dostrovsky's 1971 place-cell work through cognitive-map theory. Event SLAM inherited the silicon-retina line through Lichtsteiner, Posch, and Delbruck's 2008 DVS at ETH Zürich INI. Salas-Moreno et al.'s SLAM++ (2013) extended 1990s object-level scene understanding into the SLAM state. Each encountered a different engineering limit.

Some approaches accumulated papers and promising early results without entering the mainstream. They reached scaling limits or lost adoption to a more practical alternative, outcomes distinct from a failure of the underlying technique.

---

## 18.1 RatSLAM — place cell-based topological map

RatSLAM, presented by [Milford et al. 2004](https://doi.org/10.1109/ROBOT.2004.1302555) at ICRA 2004, approached place recognition through a biological model. It imitated the firing patterns of **place cells** and **head direction cells** in the rat hippocampus to form a place representation during exploration. The computational model was a **Continuous Attractor Network (CAN)**. Its neurons form a continuous activation 'bump' on a 2D grid, which moves according to the robot's velocity and rotation input (path integration). Visual input is compared with stored place representations and corrects the bump's position. RatSLAM alternates between propagation from motion and correction from visual matching.

> 🔗 **Borrowed.** The place-cell discovery by [O'Keefe and Dostrovsky (1971)](https://pubmed.ncbi.nlm.nih.gov/5124915/) began in neuroscience and led to the theory of cognitive maps. RatSLAM was an early complete implementation of that biological mechanism in an engineering system, but few later SLAM systems adopted it directly.

Milford and Gordon Wyeth, based at the Queensland University of Technology (QUT) robotics lab, repeatedly tested RatSLAM on suburban roads in Brisbane between 2004 and 2008. A roof-mounted camera supplied the image stream as the system recognized previously traveled routes and closed loops. The [Milford & Wyeth 2008](https://doi.org/10.1109/TRO.2008.2004520) IEEE T-RO paper reported tens of thousands of images over a 66 km route. Contemporary geometric SLAM systems often operated over only a few hundred meters, so RatSLAM had a much larger demonstrated range.

The system did not scale much further. CAN grew in computational complexity with the number of places, and its topological map could recognize a return without reliably producing meter-level metric positions. Autonomous driving and manipulation needed precise coordinates that this cognitive-map formulation did not supply.

> 📜 **Prediction vs. outcome.** In the conclusion of the 2008 T-RO paper, Milford and Wyeth described RatSLAM as "an alternative approach to vision-only SLAM" and reported repeatable, reliable loop closure on long routes with large accumulated error and visual ambiguity. They presented it as an alternative, not a replacement. RatSLAM remained competitive on specific benchmarks, but after 2012 graph-based SLAM and visual odometry moved ahead in accuracy and speed. Topological maps persisted in some place-recognition work, while RatSLAM's metric-topological integration did not continue as a major system lineage.

RatSLAM's algorithm saw limited adoption, but its geometry-free place representation entered the place-recognition literature. In 2012, [SeqSLAM](https://doi.org/10.1109/ICRA.2012.6224623) emerged from the same Milford group, and image-sequence-based recognition became one line of visual place-recognition benchmarks.

---

## 18.2 The engineering limits of biologically-inspired SLAM

RatSLAM was the most complete case of biologically inspired SLAM, but not the only one. From the mid-2000s to the early 2010s, researchers proposed SLAM variants based on cognitive maps, entorhinal grid cells, and hippocampal replay. They encountered similar problems.

Biological models describe *how* the brain represents space. Whether the same representation fits an engineering objective is a separate question. Evolution shaped the rat hippocampus for particular environments and behavior, which differ from a robot's operating conditions.

Engineering SLAM requires sub-meter position accuracy, real-time processing, rapid adaptation to new environments, and verifiable error bounds. Cognitive models did not guarantee these properties, leaving a substantial gap between neuroscience and robotics.

The question reopened in the 2020s because representations learned by foundation models invited comparison with cognitive maps. Whether the resemblance can be made precise, or amounts only to analogy, remains unknown.

---

## 18.3 Event SLAM — the gap between hardware and algorithm maturity

The [Dynamic Vision Sensor (DVS)](https://doi.org/10.1109/JSSC.2007.914337), developed by Patrick Lichtsteiner, Christoph Posch, and Tobi Delbruck at the ETH Zürich Institute of Neuroinformatics (INI), was first disclosed at ISSCC 2008. Each pixel independently compares logarithmic light-intensity change against a threshold and asynchronously outputs an event of positive (ON) or negative (OFF) polarity. With no global shutter, it records each pixel's firing time at microsecond resolution, producing a camera without frames.

> 🔗 **Borrowed.** The DVS event sensor (Lichtsteiner et al. 2008) was hardware inspired by the change-detection mechanism of the biological retina. Event SLAM started with this sensor in hand. Hardware ran ahead of algorithms, and closing that gap took ten years.

Event cameras offered μs-level temporal resolution, little blur during high-speed motion, high dynamic range (HDR) across tunnels and direct sunlight, and a fraction of the power consumption of conventional cameras.

At ICRA 2014, [Weikersdorfer et al. 2014](https://doi.org/10.1109/ICRA.2014.6906882) presented event-based 3D SLAM. The same year, other groups released event-based optical-flow and depth-estimation methods. Between 2016 and 2018, Henri Rebecq in Davide Scaramuzza's RPG lab at the University of Zurich released [EVO](https://doi.org/10.1109/LRA.2016.2645143) (RA-L 2017) and [ESIM](https://proceedings.mlr.press/v87/rebecq18a.html) (CoRL 2018), completing more of the event-SLAM pipeline.

Results in real environments remained limited. Early DVS sensors had 128×128 pixels rather than VGA resolution, a serious constraint for feature matching and map building. Existing frame-based algorithms also did not apply directly to event streams, so the field needed new methods as well as better hardware.

From 2014 to 2018, event SLAM produced good results in controlled environments and low-texture conditions, but did not outperform existing visual-inertial odometry in general environments.

The approach also spread beyond odometry. [EventVLAD](https://ieeexplore.ieee.org/document/9635907/) (Lee & Kim, IROS 2021) combined edge images reconstructed from event streams with NetVLAD descriptors, demonstrating place recognition under sudden illumination changes and motion blur, conditions that challenged frame-based VPR.

---

## 18.4 Semantic SLAM — the shrinking of the object-as-landmark path

From 2017 to 2019, semantic methods appeared throughout the programs of CVPR, ECCV, and IROS. Deep learning was improving instance segmentation and object detection, and researchers widely explored their integration with SLAM. Implementations progressed more slowly than the surrounding claims.

[Salas-Moreno et al. 2013](https://doi.org/10.1109/CVPR.2013.178)'s **SLAM++** was an early large-scale system in this lineage. Salas-Moreno and his advisor Andrew Davison at Imperial College used *objects* rather than points or patches as the map's basic unit. They stored predefined 3D models of chairs, desks, and monitors in a database, recognized them in RGB-D input through ICP (Iterative Closest Point) alignment, and placed them on the map. Tens of objects could replace thousands of points, reducing map size and grounding place recognition and loop closure in semantic entities.

> 🔗 **Borrowed.** SLAM++'s object-level representation combined scene graphs from graphics with model-based recognition from computer vision. The approach later reappeared in LERF (Language Embedded Radiance Field) and LangSplat in the 2020s, with language features replacing objects as the representation unit.

After SLAM++, [SemanticFusion](https://arxiv.org/abs/1609.05130) (McCormac et al., 2017, ICRA) and [MaskFusion](https://arxiv.org/abs/1804.09194) (Rünz et al., 2018, ISMAR) used semantic information in mapping and dynamic-object separation. [SuperPoint](https://arxiv.org/abs/1712.07629) (DeTone et al., 2018)-based systems appeared in the same period, but SuperPoint is not a semantic feature: it jointly learns a keypoint detector and local descriptor. Both lines used learning, but they addressed different problems and representation units. Semantic-SLAM papers argued that integrating semantic understanding with geometric pipelines could make maps more robust to environmental change.

Through 2019, traditional geometric pipelines such as ORB-SLAM2, VINS-Mono, and LIO-SAM produced the main gains on autonomous-driving benchmarks. Systems with deep semantic features remained competitive only in specific indoor environments and with fixed object classes. On new categories or unseen environments, semantic priors sometimes increased drift.

> 📜 **Prediction vs. outcome.** In the Conclusion of the SLAM++ paper, Salas-Moreno described his method as "a first step toward a more generic SLAM method," hoping it would extend to objects with low-dimensional shape variation, and ultimately to systems that segment and define object classes on their own. The paper's introduction added that an object-unit representation would bring "large map compression" and "gains in efficiency and robustness." The actual development partially hit the mark. Object-level maps found a place in AR and certain manipulation applications, and the compression and efficiency advantages were confirmed again in indoor environments with repeated objects. But mainstream geometric SLAM still retains sparse points and keyframe-based graphs as of 2026, and the stage where objects are segmented and defined autonomously has not been reached. Object-as-landmark adoption remained limited, while semantics found other roles in dynamic-region separation within SLAM and in downstream semantic mapping and task planning.

Semantic-first SLAM depended on accurate segmentation; a segmentation error could corrupt the map, whereas robust estimation let a geometric pipeline survive some incorrect matches. Generalization posed a second problem. Semantic priors trained on particular object classes did not transfer beyond those classes, while SLAM systems had to operate in a much wider range of environments.

The object-as-landmark path contracted, but semantic information continued at a different map layer. [SuMa++](https://doi.org/10.1109/IROS40897.2019.8967704) (Chen et al., IROS 2019) overlaid semantic classes on LiDAR point clouds to filter dynamic objects, and [Kimera](https://doi.org/10.1109/ICRA40945.2020.9196885) (Rosinol et al., ICRA 2020) combined a metric-semantic mesh with a 3D scene graph. [Hydra](https://doi.org/10.15607/RSS.2022.XVIII.050) (Hughes et al., RSS 2022) extended the graph into a real-time hierarchy. [ConceptGraphs](https://doi.org/10.1109/ICRA57147.2024.10610243) (Gu et al., ICRA 2024) and [Clio](https://doi.org/10.1109/LRA.2024.3451395) (Maggio et al., RA-L 2024) later added open-vocabulary foundation features. This lineage remained active in 2026 and reappears in [Ch.15b](chapter_15b_dynamic.md), [Ch.16](chapter_16_foundation_3d.md), and [Ch.19 §19.7](chapter_19_open_problems.md#197-the-return-of-semantic-representation-and-open-world).

---

## 18.5 The Manhattan-world assumption — scope and continued use as an auxiliary constraint

Another line of research used the Manhattan-world assumption and later receded.

Following the Manhattan-world concept of [Coughlan & Yuille 1999](https://doi.org/10.1109/ICCV.1999.790349), these methods treated indoor walls, floors, and ceilings as aligned with three orthogonal axes (x, y, z) of the world coordinate frame. Parallel image lines converge to vanishing points, each described by the relation `v = K R d` between the camera rotation matrix R and direction vector d (K is the camera intrinsic matrix). Three orthogonal vanishing points allow direct recovery of the three columns of R. Visual-odometry systems could use this geometric constraint to suppress drift without an IMU or feature matching.

The constraint reduced drift in long corridors and rectangular rooms but failed outdoors, around curved structures, and in irregular industrial environments where the assumption did not hold. A prior fitted tightly to one environment became a liability elsewhere. As general-purpose visual-inertial odometry matured after 2015, Manhattan-world methods receded. The assumption remains an auxiliary constraint in some indoor mapping tools rather than an independent research lineage.

---

## 18.6 Rediscovery patterns of extinct lineages

The discontinued lineages left different kinds of descendants. RatSLAM's topological-map idea carried into SeqSLAM and visual place recognition. SLAM++'s object-level map returned in another form after 2022 when NeRF and Gaussian splatting were combined with language features, as in [LERF](https://arxiv.org/abs/2303.09553) (Kerr et al., 2023) and [LangSplat](https://arxiv.org/abs/2312.16084) (Qin et al., 2023).

Event-camera SLAM followed a different path because early hardware remained limited. After 2022, event cameras above 640×480 reached the market, and high-speed drones and HDR environments supplied clear applications. Between 2020 and 2024, the event-vision community around [Guillermo Gallego](https://arxiv.org/abs/1904.08405) at TU Berlin reported competitive results in event-based depth and ego-motion estimation.

A promising idea can still wait years for suitable hardware and algorithms. Adoption also depends on whether a more practical alternative becomes established before both mature.

---

## 🧭 Still open

**Biologically inspired SLAM.** Spatial representations formed by foundation models through large-scale unsupervised learning have structural similarities to cognitive maps. Whether a transformer's internal representation implements anything comparable to a place cell remains unverified. A RatSLAM-like lineage returning through foundation models is therefore a hypothesis, not an observed convergence.

**Event-camera SLAM adoption.** Commercial high-resolution event cameras widened the research base after 2022, but event processing had not settled on a stable common framework by 2026. Integration with frame-based pipelines, event representations, real-world benchmarks, and evaluation standards were all still developing. Broad adoption remained uncertain.

**The direction of the semantic-map concept.** As interest in semantic SLAM cooled after 2017, semantic representation developed other roles in dynamic-region separation and downstream tasks. From 2023, LERF and language-based Gaussian-splatting systems combined language features with dense scene representations. It remained unclear whether semantics would become part of SLAM itself or stay downstream, and whether these representations could relax the usual requirement that geometry be reliable first.

Full visual-LiDAR fusion, solid-state sensor algorithms, dynamic-object handling, event-camera maturity, and the return of semantic maps all connect with unresolved problems from earlier chapters; Ch.19 brings those threads together.
